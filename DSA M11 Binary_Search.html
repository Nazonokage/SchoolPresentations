<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Module 11 — Binary Search</title>
<style>
  :root{
    --bg:#0a0805;
    --surface:#151008;
    --surface-2:#1d1710;
    --border:#332615;
    --text:#faf3ea;
    --text-dim:#a08a6b;
    --accent:#fb923c;       /* orange - TARGET / mid / primary */
    --accent-dim:#8a4f1c;
    --accent-2:#38bdf8;     /* sky - low/high pointers / secondary */
    --mc:#c084fc;           /* purple - multiple choice */
    --id:#4ade80;           /* green - identification */
    --out:#f472b6;          /* pink - guess the output */
    --warn:#fbbf24;
    --danger:#f43f5e;
    --good:#4ade80;
    --font-mono:'SF Mono','Cascadia Code','Consolas','Roboto Mono',monospace;
    --font-sans:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;padding:0;height:100%;
    background:var(--bg);color:var(--text);
    font-family:var(--font-sans);
    overflow:hidden;
  }
  body::before{
    content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
    background:
      radial-gradient(ellipse at 12% 8%, rgba(251,146,60,0.06), transparent 55%),
      radial-gradient(ellipse at 88% 92%, rgba(56,189,248,0.05), transparent 55%);
  }
  #progress-wrap{
    position:fixed;top:0;left:0;right:0;height:5px;z-index:1000;
    background:repeating-linear-gradient(90deg, var(--surface-2) 0, var(--surface-2) 16px, var(--border) 16px, var(--border) 18px);
  }
  #progress-bar{
    height:100%;width:0%;
    background:linear-gradient(90deg,var(--accent),var(--accent-2));
    transition:width .35s ease;
    box-shadow:0 0 10px rgba(251,146,60,.4);
  }
  #counter{
    position:fixed;bottom:18px;right:22px;
    font-family:var(--font-mono);font-size:12.5px;color:var(--accent);
    background:var(--surface);border:1px solid var(--border);
    padding:7px 13px;border-radius:6px;z-index:1000;letter-spacing:.03em;
  }
  #counter .lbl{color:var(--text-dim);margin-right:6px;}
  #hint{
    position:fixed;bottom:18px;left:22px;
    font-family:var(--font-mono);font-size:11.5px;color:var(--text-dim);
    z-index:1000;opacity:.75;
  }
  #deck{position:relative;width:100vw;height:100vh;z-index:1;}
  .slide{
    position:absolute;inset:0;
    display:flex;flex-direction:column;
    justify-content:center;align-items:center;
    padding:60px 8vw;
    opacity:0;pointer-events:none;
    transform:translateX(24px);
    transition:opacity .35s ease, transform .35s ease;
    overflow:auto;
  }
  .slide.active{opacity:1;pointer-events:auto;transform:translateX(0);}
  .slide.exit-left{transform:translateX(-24px);}
  @media (prefers-reduced-motion: reduce){
    .slide{transition:opacity .01s linear;transform:none !important;}
  }
  .slide-inner{width:100%;max-width:1240px;margin:0 auto;min-width:0;}
  .eyebrow{
    font-family:var(--font-mono);font-size:12.5px;letter-spacing:.08em;
    color:var(--accent);text-transform:uppercase;
    display:flex;align-items:center;gap:10px;margin-bottom:18px;
  }
  .eyebrow .scan-tag{
    background:var(--surface-2);border:1px solid var(--border);
    border-bottom:2px solid var(--accent);color:var(--accent-2);
    padding:4px 10px;border-radius:4px 4px 0 0;font-weight:700;
  }
  .eyebrow.mc{color:var(--mc);} .eyebrow.mc .scan-tag{border-bottom-color:var(--mc);}
  .eyebrow.id{color:var(--id);} .eyebrow.id .scan-tag{border-bottom-color:var(--id);}
  .eyebrow.out{color:var(--out);} .eyebrow.out .scan-tag{border-bottom-color:var(--out);}
  h1.title{
    font-family:var(--font-mono);
    font-size:clamp(30px,4vw,54px);
    line-height:1.1;margin:0 0 18px 0;font-weight:800;letter-spacing:-.01em;
  }
  h2.title{
    font-family:var(--font-mono);
    font-size:clamp(25px,2.4vw,34px);
    line-height:1.2;margin:0 0 20px 0;font-weight:750;letter-spacing:-.01em;
  }
  p.lead{font-size:clamp(15px,1.15vw,18px);line-height:1.65;color:var(--text-dim);max-width:920px;margin:0 0 8px 0;}

    padding:1px 6px;border-radius:4px;color:var(--accent-2);font-size:.92em;}
  b{color:var(--text);}

  .cover-badges{display:flex;gap:10px;margin-top:26px;flex-wrap:wrap;}
  .badge{font-family:var(--font-mono);font-size:12px;color:var(--text-dim);
    border:1px solid var(--border);border-radius:20px;padding:6px 14px;}

  .recap-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:8px;}
  .recap-grid > *{min-width:0;}
  .recap-item{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:16px 18px;}
  .recap-item .k{font-family:var(--font-mono);font-size:13px;color:var(--accent);margin-bottom:6px;font-weight:700;}
  .recap-item .v{font-size:15px;color:var(--text-dim);line-height:1.6;}

  .two-col-lec{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:26px;align-items:start;}
  .two-col-lec > *{min-width:0;}
  .side-by-side{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px;align-items:start;}
  .side-by-side > *{min-width:0;text-align:center;}

  .lec-table{width:100%;border-collapse:collapse;font-size:15px;margin-top:10px;}

  .scenario-card .k{font-family:var(--font-mono);font-size:12.5px;color:var(--accent-2);margin-bottom:6px;font-weight:700;}
  .scenario-card .v{font-size:15px;color:var(--text-dim);line-height:1.6;}

  .quote-card{background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--accent);
    border-radius:8px;padding:18px 22px;font-size:16px;color:var(--text);font-style:italic;line-height:1.6;margin-bottom:14px;}

  .closing-sign{text-align:center;color:var(--text-dim);font-family:var(--font-mono);font-size:14px;margin-top:18px;}

  /* ===== code blocks ===== */
  .code-wrap{background:var(--surface);border:1px solid var(--border);border-radius:10px;
    overflow:hidden;margin-top:10px;}
  .code-top{display:flex;justify-content:space-between;align-items:center;
    padding:8px 14px;background:var(--surface-2);border-bottom:1px solid var(--border);}
  .code-lang{font-family:var(--font-mono);font-size:11px;color:var(--text-dim);

  .copy-btn{font-family:var(--font-mono);font-size:11.5px;color:var(--text-dim);
    background:var(--surface);border:1px solid var(--border);border-radius:5px;

  .copy-btn:hover{color:var(--accent);border-color:var(--accent-dim);}
  .copy-btn.copied{color:var(--accent);border-color:var(--accent);}
  .code-pre{margin:0;padding:14px 16px;max-height:320px;overflow:auto;

  .code-pre code{background:none;border:none;padding:0;color:var(--text);}

  .tok-str{color:#7dd3fc;}
  .tok-com{color:var(--text-dim);font-style:italic;}
  .tok-num{color:#c4b5fd;}
  .tok-type{color:var(--accent);}

  /* ===== array diagrams ===== */
  .arr-svg{width:100%;max-width:640px;height:auto;display:block;margin:16px auto 0;}
  .arr-box{fill:var(--surface-2);stroke:var(--accent-2);stroke-width:2;}
  .arr-box-elim{stroke:var(--text-dim);stroke-dasharray:4 3;opacity:.4;}
  .arr-box-mid{stroke:var(--accent);stroke-width:3;}
  .arr-box-found{stroke:var(--good);stroke-width:3;}
  .arr-box-danger{stroke:var(--danger);stroke-width:3;stroke-dasharray:4 3;}

  .arr-ptr-label{font-family:var(--font-mono);font-size:11px;font-weight:700;}
  .arr-ptr-low{fill:var(--accent-2);}
  .arr-ptr-high{fill:var(--accent-2);}
  .arr-ptr-mid{fill:var(--accent);}
  .arr-ptr-line{stroke:var(--text-dim);stroke-width:1.5;stroke-dasharray:2 2;}
  .mem-caption{text-align:center;color:var(--text-dim);font-size:12.5px;margin-top:8px;

  .opt b{color:var(--text);margin-right:4px;}
  .id-card{background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--id);
    border-radius:8px;padding:14px 18px;font-size:15px;color:var(--text-dim);line-height:1.55;height:100%;}
  .id-card .q-num{font-family:var(--font-mono);font-size:11px;color:var(--id);margin-bottom:5px;letter-spacing:.04em;}
  .code-activity-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-top:6px;}
  .code-activity-grid > *{min-width:0;}
  .code-activity-full{grid-column:1 / -1;}
  .out-card{background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--out);
    border-radius:8px;padding:14px 16px;}
  .out-card .q-num{font-family:var(--font-mono);font-size:11px;color:var(--out);margin-bottom:6px;letter-spacing:.04em;}
  .out-card pre{margin:0;font-family:var(--font-mono);font-size:12px;line-height:1.5;color:var(--text);
    background:var(--surface-2);border:1px solid var(--border);border-radius:6px;padding:9px 11px;overflow-x:auto;}

  /* ===== answers ===== */
  .answers-scroll{max-height:64vh;overflow-y:auto;padding-right:8px;margin-top:10px;}
  .ans-row{display:flex;gap:14px;padding:12px 0;border-bottom:1px solid var(--border);}
  .ans-row:last-child{border-bottom:none;}
  .ans-num{font-family:var(--font-mono);font-size:12px;color:var(--text-dim);min-width:34px;padding-top:2px;}
  .ans-correct{font-weight:700;color:var(--accent);font-size:15px;}
  .ans-out{font-weight:700;color:var(--out);font-family:var(--font-mono);font-size:14px;}
  .ans-explain{font-size:15px;color:var(--text-dim);margin-top:4px;line-height:1.55;}
  .ans-group-label{font-family:var(--font-mono);font-size:12px;color:var(--accent-2);
    letter-spacing:.06em;text-transform:uppercase;margin:16px 0 4px 0;}
  .ans-group-label:first-child{margin-top:0;}

  /* ===== shortcuts modal ===== */
  #shortcuts-modal{
    position:fixed;inset:0;background:rgba(4,3,1,.72);z-index:2000;
    display:flex;align-items:center;justify-content:center;
    opacity:0;pointer-events:none;transition:opacity .2s ease;
  }
  #shortcuts-modal.show{opacity:1;pointer-events:auto;}
  #shortcuts-modal .panel{background:var(--surface);border:1px solid var(--border);
    border-radius:12px;padding:28px 32px;max-width:460px;width:90%;}
  #shortcuts-modal h3{margin:0 0 16px 0;font-family:var(--font-mono);color:var(--accent);font-size:16px;}
  #shortcuts-modal .row{display:flex;justify-content:space-between;padding:7px 0;
    border-bottom:1px solid var(--border);font-size:13.5px;color:var(--text-dim);}
  #shortcuts-modal .row:last-child{border-bottom:none;}
  #shortcuts-modal kbd{font-family:var(--font-mono);background:var(--surface-2);
    border:1px solid var(--border);border-radius:4px;padding:2px 8px;color:var(--text);}

  ::-webkit-scrollbar{width:8px;height:8px;}
  ::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px;}
  ::-webkit-scrollbar-track{background:transparent;}
</style>

<script>
/* ============ HELPERS ============ */
function escHtml(s){
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

let codeBlockIdx = 0;
const KEYWORDS = new Set(["public","private","protected","static","void","int","double","char",
  "boolean","class","new","return","if","else","for","while","break","continue","this","null",
  "true","false","import","extends","implements","final","long","short","byte","float","package",
  "try","catch","finally","throw","interface","enum","switch","case","default","super","instanceof"]);

function codeBlock(code, lang){
  lang = lang || "java";
  codeBlockIdx++;
  const id = "code-" + codeBlockIdx;
  const tokenRe = /(\/\/.*$)|(\/\*[\s\S]*?\*\/)|("(?:[^"\\]|\\.)*")|('(?:[^'\\]|\\.)*')|(\b\d+\.?\d*\b)|(\b[A-Za-z_][A-Za-z0-9_]*\b)/gm;
  let out = "";
  let last = 0;
  let m;
  while((m = tokenRe.exec(code)) !== null){
    out += escHtml(code.slice(last, m.index));
    const full = m[0], comment1 = m[1], comment2 = m[2], dstr = m[3], sstr = m[4], num = m[5], ident = m[6];
    if(comment1 || comment2){
      out += '<span class="tok-com">' + escHtml(full) + '</span>';
    } else if(dstr || sstr){
      out += '<span class="tok-str">' + escHtml(full) + '</span>';
    } else if(num){
      out += '<span class="tok-num">' + escHtml(full) + '</span>';
    } else if(ident){
      if(KEYWORDS.has(ident)){
        out += '<span class="tok-kw">' + escHtml(full) + '</span>';
      } else if(/^[A-Z]/.test(ident)){
        out += '<span class="tok-type">' + escHtml(full) + '</span>';
      } else {
        out += escHtml(full);
      }
    }
    last = tokenRe.lastIndex;
  }
  out += escHtml(code.slice(last));
  return '<div class="code-wrap"><div class="code-top"><span class="code-lang">' + lang +
    '</span><button class="copy-btn" onclick="copyCode(this,\'' + id + '\')">Copy</button></div>' +
    '<pre class="code-pre"><code id="' + id + '">' + out + '</code></pre></div>';
}

function copyCode(btn, id){
  const codeEl = document.getElementById(id);
  const text = codeEl.textContent;
  const done = () => {
    const old = btn.textContent;
    btn.textContent = "Copied!";
    btn.classList.add("copied");
    setTimeout(()=>{ btn.textContent = old || "Copy"; btn.classList.remove("copied"); }, 1400);
  };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done).catch(done);
  } else {
    const ta = document.createElement("textarea");
    ta.value = text; document.body.appendChild(ta); ta.select();
    try{ document.execCommand("copy"); }catch(e){}
    document.body.removeChild(ta);
    done();
  }
}

/* ============ ARRAY / BINARY SEARCH DIAGRAM GENERATOR ============ */
function arrayDiagram(values, opts){
  opts = opts || {};
  const boxW = 62, boxH = 54, gap = 6;
  const n = values.length;
  const startX = 34;
  const y = 72;
  const totalW = startX*2 + n*boxW + Math.max(0,n-1)*gap;
  const svgH = 172;

  let svg = '<svg class="arr-svg" viewBox="0 0 ' + totalW + ' ' + svgH + '" xmlns="http://www.w3.org/2000/svg">' +
    '<title>' + (opts.svgTitle || "Sorted array with binary search low, mid, and high pointers") + '</title>';

  values.forEach((v, i) => {
    const x = startX + i * (boxW + gap);
    const outside = (opts.low !== undefined && i < opts.low) || (opts.high !== undefined && i > opts.high);
    let cls = "arr-box";
    if(opts.dangerIdx === i){
      cls = "arr-box arr-box-danger";
    } else if(opts.foundIdx === i){
      cls = "arr-box arr-box-found";
    } else if(i === opts.mid){
      cls = "arr-box arr-box-mid";
    } else if(outside){
      cls = "arr-box arr-box-elim";
    }

    svg += '<rect x="' + x + '" y="' + y + '" width="' + boxW + '" height="' + boxH + '" rx="8" class="' + cls + '"/>' +
      '<text x="' + (x+boxW/2) + '" y="' + (y+boxH/2+6) + '" text-anchor="middle" class="arr-data">' + v + '</text>' +
      '<text x="' + (x+boxW/2) + '" y="' + (y+boxH+18) + '" text-anchor="middle" class="arr-index">' + i + '</text>';

    if(i === opts.low){
      svg += '<text x="' + (x+boxW/2) + '" y="' + (y-30) + '" text-anchor="middle" class="arr-ptr-label arr-ptr-low">low</text>' +
        '<line x1="' + (x+boxW/2) + '" y1="' + (y-24) + '" x2="' + (x+boxW/2) + '" y2="' + (y-4) + '" class="arr-ptr-line"/>';
    }
    if(i === opts.high){
      svg += '<text x="' + (x+boxW/2) + '" y="' + (y-48) + '" text-anchor="middle" class="arr-ptr-label arr-ptr-high">high</text>' +
        '<line x1="' + (x+boxW/2) + '" y1="' + (y-42) + '" x2="' + (x+boxW/2) + '" y2="' + (y-4) + '" class="arr-ptr-line"/>';
    }
    if(i === opts.mid){
      svg += '<text x="' + (x+boxW/2) + '" y="' + (y-10) + '" text-anchor="middle" class="arr-ptr-label arr-ptr-mid">mid</text>';
    }
  });

  svg += '</svg>';
  let out = svg;
  if(opts.caption) out += '<div class="mem-caption">' + opts.caption + '</div>';
  return out;
}

/* ============ CANONICAL SORTED ARRAY USED THROUGHOUT THIS DECK ============ */
const sortedArr = [3, 8, 15, 22, 34, 45, 56, 67, 78, 90];

/* ============ STATIC SLIDES ============ */
const slideCover = '<div class="slide-inner">' +
  '<div class="eyebrow"><span class="scan-tag">SCAN 00</span> MODULE 11 &middot; SEARCHING ALGORITHMS</div>' +
  '<h1 class="title">Binary Search</h1>' +
  '<p class="lead">Linear Search checks every box, one at a time. Binary Search is smarter about it &mdash; but only if you make it one promise first: the data has to be sorted. Break that promise, and the whole trick falls apart.</p>' +
  '<div class="cover-badges">' +
    '<div class="badge">Prelims &middot; Module 11</div>' +
    '<div class="badge">Java</div>' +
    '<div class="badge">Lecture + Mini Project + Quiz</div>' +
  '</div>' +
'</div>';

const slideInstructions = '<div class="slide-inner">' +
  '<div class="eyebrow"><span class="scan-tag">SCAN 01</span> BEFORE YOU START</div>' +

/* ============ RENDER & NAVIGATION ============ */
const deck = document.getElementById("deck");
slides.forEach((html) => {
  const div = document.createElement("div");
  div.className = "slide";
  div.innerHTML = html;
  deck.appendChild(div);
});
const slideEls = Array.from(document.querySelectorAll(".slide"));
let current = 0;

function pad2(n){ return String(n).padStart(2,"0"); }

function render(){
  slideEls.forEach((el,i)=>{ el.classList.toggle("active", i===current); });
  document.getElementById("counter").innerHTML =
    '<span class="lbl">SCAN</span>' + pad2(current) + " / " + pad2(slideEls.length-1);
  document.getElementById("progress-bar").style.width = (((current+1)/slideEls.length)*100)+"%";
}
function goTo(i){ current = Math.max(0, Math.min(slideEls.length-1, i)); render(); }
function next(){ goTo(current+1); }
function prev(){ goTo(current-1); }

render();

/* block the default context menu everywhere */
document.addEventListener("contextmenu", (e) => { e.preventDefault(); }, true);

/* mouse navigation: right-click / Mouse4 = next, Mouse3 = previous */
document.addEventListener("mousedown", (e) => {
  const modal = document.getElementById("shortcuts-modal");
  if(e.button === 2){
    if(e.target.closest("button, a, input, textarea, select, .copy-btn")) return;
    if(modal.classList.contains("show")){ modal.classList.remove("show"); return; }
    e.preventDefault(); e.stopImmediatePropagation();
    next();
  } else if(e.button === 3){
    e.preventDefault(); e.stopImmediatePropagation();
    prev();
  } else if(e.button === 4){
    e.preventDefault(); e.stopImmediatePropagation();
    next();
  }
}, true);

window.addEventListener("auxclick", (e) => {
  if(e.button === 3 || e.button === 4){ e.preventDefault(); e.stopImmediatePropagation(); }
}, true);

/* keyboard */
document.addEventListener("keydown", (e) => {
  const modal = document.getElementById("shortcuts-modal");
  if(e.key === "?"){ modal.classList.toggle("show"); e.preventDefault(); return; }
  if(modal.classList.contains("show")){
    if(e.key === "Escape") modal.classList.remove("show");
    return;
  }
  if(e.key === "ArrowRight"){ next(); }
  else if(e.key === "ArrowLeft"){ prev(); }
  else if(e.key === "Home"){ goTo(0); }
  else if(e.key === "End"){ goTo(slideEls.length-1); }
});

/* swipe */
let touchStartX = null;
document.addEventListener("touchstart", (e) => { touchStartX = e.changedTouches[0].screenX; }, {passive:true});
document.addEventListener("touchend", (e) => {
  if(touchStartX === null) return;
  const dx = e.changedTouches[0].screenX - touchStartX;
  if(Math.abs(dx) > 50){ if(dx < 0) next(); else prev(); }
  touchStartX = null;
}, {passive:true});
</script>
