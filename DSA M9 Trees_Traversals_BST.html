<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Module 09 — Trees, Part 2: Traversals &amp; BST</title>
<style>
  :root{
    --bg:#080a12;
    --surface:#0f1420;
    --surface-2:#161d2e;
    --border:#252f47;
    --text:#edf1fb;
    --text-dim:#7783a3;
    --accent:#818cf8;       /* indigo - TRAVERSAL / primary */
    --accent-dim:#4a4f8a;
    --accent-2:#34d399;     /* emerald - BST / SORTED / secondary */
    --mc:#fb7185;           /* rose - multiple choice */
    --id:#fbbf24;           /* amber - identification */
    --out:#22d3ee;          /* cyan - coding / output */
    --warn:#fbbf24;
    --danger:#f43f5e;
    --good:#34d399;
    --font-mono:'SF Mono','Cascadia Code','Consolas','Roboto Mono',monospace;
    --font-sans:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;padding:0;height:100%;
    background:var(--bg);color:var(--text);
    font-family:var(--font-sans);
    overflow:hidden;
  }
  body::before{
    content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
    background:
      radial-gradient(ellipse at 12% 8%, rgba(129,140,248,0.06), transparent 55%),
      radial-gradient(ellipse at 88% 92%, rgba(52,211,153,0.05), transparent 55%);
  }
  #progress-wrap{
    position:fixed;top:0;left:0;right:0;height:5px;z-index:1000;
    background:repeating-linear-gradient(90deg, var(--surface-2) 0, var(--surface-2) 16px, var(--border) 16px, var(--border) 18px);
  }
  #progress-bar{
    height:100%;width:0%;
    background:linear-gradient(90deg,var(--accent),var(--accent-2));
    transition:width .35s ease;
    box-shadow:0 0 10px rgba(129,140,248,.4);
  }
  #counter{
    position:fixed;bottom:18px;right:22px;
    font-family:var(--font-mono);font-size:12.5px;color:var(--accent);
    background:var(--surface);border:1px solid var(--border);
    padding:7px 13px;border-radius:6px;z-index:1000;letter-spacing:.03em;
  }
  #counter .lbl{color:var(--text-dim);margin-right:6px;}
  #hint{
    position:fixed;bottom:18px;left:22px;
    font-family:var(--font-mono);font-size:11.5px;color:var(--text-dim);
    z-index:1000;opacity:.75;
  }
  #deck{position:relative;width:100vw;height:100vh;z-index:1;}
  .slide{
    position:absolute;inset:0;
    display:flex;flex-direction:column;
    justify-content:center;align-items:center;
    padding:60px 8vw;
    opacity:0;pointer-events:none;
    transform:translateX(24px);
    transition:opacity .35s ease, transform .35s ease;
    overflow:auto;
  }
  .slide.active{opacity:1;pointer-events:auto;transform:translateX(0);}
  .slide.exit-left{transform:translateX(-24px);}
  @media (prefers-reduced-motion: reduce){
    .slide{transition:opacity .01s linear;transform:none !important;}
  }
  .slide-inner{width:100%;max-width:1240px;margin:0 auto;min-width:0;}
  .eyebrow{
    font-family:var(--font-mono);font-size:12.5px;letter-spacing:.08em;
    color:var(--accent);text-transform:uppercase;
    display:flex;align-items:center;gap:10px;margin-bottom:18px;
  }
  .eyebrow .step-tag{
    background:var(--surface-2);border:1px solid var(--border);
    border-bottom:2px solid var(--accent);color:var(--accent-2);
    padding:4px 10px;border-radius:4px 4px 0 0;font-weight:700;
  }
  .eyebrow.mc{color:var(--mc);} .eyebrow.mc .step-tag{border-bottom-color:var(--mc);}
  .eyebrow.id{color:var(--id);} .eyebrow.id .step-tag{border-bottom-color:var(--id);}
  .eyebrow.out{color:var(--out);} .eyebrow.out .step-tag{border-bottom-color:var(--out);}
  h1.title{
    font-family:var(--font-mono);
    font-size:clamp(30px,4vw,54px);
    line-height:1.1;margin:0 0 18px 0;font-weight:800;letter-spacing:-.01em;
  }
  h2.title{
    font-family:var(--font-mono);
    font-size:clamp(25px,2.4vw,34px);
    line-height:1.2;margin:0 0 20px 0;font-weight:750;letter-spacing:-.01em;
  }
  p.lead{font-size:clamp(15px,1.15vw,18px);line-height:1.65;color:var(--text-dim);max-width:920px;margin:0 0 8px 0;}
  code{font-family:var(--font-mono);background:var(--surface-2);border:1px solid var(--border);
    padding:1px 6px;border-radius:4px;color:var(--accent-2);font-size:.92em;}
  b{color:var(--text);}

  .cover-badges{display:flex;gap:10px;margin-top:26px;flex-wrap:wrap;}
  .badge{font-family:var(--font-mono);font-size:12px;color:var(--text-dim);
    border:1px solid var(--border);border-radius:20px;padding:6px 14px;}

  .recap-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:8px;}
  .recap-grid > *{min-width:0;}
  .recap-item{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:16px 18px;}
  .recap-item .k{font-family:var(--font-mono);font-size:13px;color:var(--accent);margin-bottom:6px;font-weight:700;}
  .recap-item .v{font-size:14.5px;color:var(--text-dim);line-height:1.55;}

  .two-col-lec{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:26px;align-items:start;}
  .two-col-lec > *{min-width:0;}
  .three-col{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;align-items:start;}
  .three-col > *{min-width:0;text-align:center;}
  .side-by-side{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px;align-items:start;}
  .side-by-side > *{min-width:0;text-align:center;}
  .legend-row{display:flex;gap:18px;flex-wrap:wrap;justify-content:center;margin-top:10px;}
  .legend-item{display:flex;align-items:center;gap:6px;font-family:var(--font-mono);font-size:11.5px;color:var(--text-dim);}
  .legend-dot{width:12px;height:12px;border-radius:50%;display:inline-block;}

  .lec-table{width:100%;border-collapse:collapse;font-size:13.5px;margin-top:10px;}
  .lec-table th,.lec-table td{border:1px solid var(--border);padding:8px 12px;text-align:left;}
  .lec-table th{color:var(--accent);font-family:var(--font-mono);font-size:11.5px;
    text-transform:uppercase;letter-spacing:.04em;background:var(--surface-2);}
  .lec-table td{color:var(--text-dim);}
  .lec-table td.hl{color:var(--text);font-weight:700;}

  .lec-note{font-size:14px;color:var(--text-dim);margin-top:14px;line-height:1.55;
    background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--accent-2);
    border-radius:6px;padding:12px 16px;}
  .lec-note b{color:var(--text);}

  .scenario-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-top:8px;}
  .scenario-grid > *{min-width:0;}
  .scenario-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:16px 18px;}
  .scenario-card .k{font-family:var(--font-mono);font-size:12.5px;color:var(--accent-2);margin-bottom:6px;font-weight:700;}
  .scenario-card .v{font-size:14px;color:var(--text-dim);line-height:1.55;}

  .quote-card{background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--accent);
    border-radius:8px;padding:18px 22px;font-size:16px;color:var(--text);font-style:italic;line-height:1.6;margin-bottom:14px;}

  .closing-quote{font-size:19px;font-style:italic;color:var(--text);text-align:center;max-width:700px;
    margin:18px auto 6px;line-height:1.6;}
  .closing-sign{text-align:center;color:var(--text-dim);font-family:var(--font-mono);font-size:14px;margin-top:18px;}

  /* ===== code blocks ===== */
  .code-wrap{background:var(--surface);border:1px solid var(--border);border-radius:10px;
    overflow:hidden;margin-top:10px;}
  .code-top{display:flex;justify-content:space-between;align-items:center;
    padding:8px 14px;background:var(--surface-2);border-bottom:1px solid var(--border);}
  .code-lang{font-family:var(--font-mono);font-size:11px;color:var(--text-dim);
    text-transform:uppercase;letter-spacing:.06em;}
  .copy-btn{font-family:var(--font-mono);font-size:11.5px;color:var(--text-dim);
    background:var(--surface);border:1px solid var(--border);border-radius:5px;
    padding:4px 10px;cursor:pointer;transition:all .2s ease;}
  .copy-btn:hover{color:var(--accent);border-color:var(--accent-dim);}
  .copy-btn.copied{color:var(--accent);border-color:var(--accent);}
  .code-pre{margin:0;padding:14px 16px;max-height:320px;overflow:auto;
    font-family:var(--font-mono);font-size:12.8px;line-height:1.6;}
  .code-pre code{background:none;border:none;padding:0;color:var(--text);}
  .tok-kw{color:var(--accent-2);}
  .tok-str{color:#7dd3fc;}
  .tok-com{color:var(--text-dim);font-style:italic;}
  .tok-num{color:#c4b5fd;}
  .tok-type{color:var(--accent);}

  /* ===== tree diagrams ===== */
  .tree-svg{width:100%;height:auto;display:block;margin:10px auto 0;}
  .tree-edge{stroke:var(--text-dim);stroke-width:2;}
  .tree-node{fill:var(--surface-2);stroke:var(--accent-2);stroke-width:2;}
  .tree-node-root{stroke:var(--accent);stroke-width:3;}
  .tree-node-leaf{stroke:var(--text-dim);stroke-width:1.5;stroke-dasharray:4 3;}
  .tree-node-bad{stroke:var(--danger);stroke-width:3;}
  .tree-node-new{stroke:var(--warn);stroke-width:3;}
  .tree-label{fill:var(--text);font-family:var(--font-mono);font-weight:700;}
  .visit-badge{fill:var(--accent);stroke:var(--bg);stroke-width:1.5;}
  .visit-num{fill:var(--bg);font-family:var(--font-mono);font-size:11px;font-weight:800;}
  .mem-caption{text-align:center;color:var(--text-dim);font-size:12.5px;margin-top:8px;
    font-family:var(--font-mono);letter-spacing:.03em;}
  .seq-strip{font-family:var(--font-mono);font-size:15px;color:var(--accent-2);text-align:center;
    letter-spacing:.05em;margin-top:6px;font-weight:700;}

  /* ===== activity layout (2-col, odd centered) ===== */
  .activity-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:6px;}
  .activity-grid > *{min-width:0;}
  .activity-centered{grid-column:1 / -1;max-width:560px;margin:0 auto;width:100%;}
  .q-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:16px 18px;}
  .q-card .q-num{font-family:var(--font-mono);font-size:11.5px;color:var(--text-dim);margin-bottom:6px;letter-spacing:.04em;}
  .q-card .q-text{font-size:14.5px;color:var(--text);margin-bottom:10px;font-weight:600;line-height:1.45;}
  .opt-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;}
  .opt-grid > *{min-width:0;}
  .opt{font-size:13px;color:var(--text-dim);background:var(--surface-2);
    border:1px solid var(--border);border-radius:6px;padding:8px 10px;line-height:1.4;}
  .opt b{color:var(--text);margin-right:4px;}
  .id-card{background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--id);
    border-radius:8px;padding:14px 18px;font-size:14px;color:var(--text-dim);line-height:1.5;height:100%;}
  .id-card .q-num{font-family:var(--font-mono);font-size:11px;color:var(--id);margin-bottom:5px;letter-spacing:.04em;}
  .code-activity-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-top:6px;}
  .code-activity-grid > *{min-width:0;}
  .code-activity-full{grid-column:1 / -1;}
  .out-card{background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--out);
    border-radius:8px;padding:14px 16px;}
  .out-card .q-num{font-family:var(--font-mono);font-size:11px;color:var(--out);margin-bottom:6px;letter-spacing:.04em;}
  .out-card pre{margin:0;font-family:var(--font-mono);font-size:12px;line-height:1.5;color:var(--text);
    background:var(--surface-2);border:1px solid var(--border);border-radius:6px;padding:9px 11px;overflow-x:auto;}

  /* ===== answers ===== */
  .answers-scroll{max-height:64vh;overflow-y:auto;padding-right:8px;margin-top:10px;}
  .ans-row{display:flex;gap:14px;padding:12px 0;border-bottom:1px solid var(--border);}
  .ans-row:last-child{border-bottom:none;}
  .ans-num{font-family:var(--font-mono);font-size:12px;color:var(--text-dim);min-width:34px;padding-top:2px;}
  .ans-correct{font-weight:700;color:var(--accent);font-size:14.5px;}
  .ans-out{font-weight:700;color:var(--out);font-family:var(--font-mono);font-size:13.5px;}
  .ans-explain{font-size:13px;color:var(--text-dim);margin-top:4px;line-height:1.5;}
  .ans-group-label{font-family:var(--font-mono);font-size:12px;color:var(--accent-2);
    letter-spacing:.06em;text-transform:uppercase;margin:16px 0 4px 0;}
  .ans-group-label:first-child{margin-top:0;}

  /* ===== shortcuts modal ===== */
  #shortcuts-modal{
    position:fixed;inset:0;background:rgba(3,4,10,.72);z-index:2000;
    display:flex;align-items:center;justify-content:center;
    opacity:0;pointer-events:none;transition:opacity .2s ease;
  }
  #shortcuts-modal.show{opacity:1;pointer-events:auto;}
  #shortcuts-modal .panel{background:var(--surface);border:1px solid var(--border);
    border-radius:12px;padding:28px 32px;max-width:460px;width:90%;}
  #shortcuts-modal h3{margin:0 0 16px 0;font-family:var(--font-mono);color:var(--accent);font-size:16px;}
  #shortcuts-modal .row{display:flex;justify-content:space-between;padding:7px 0;
    border-bottom:1px solid var(--border);font-size:13.5px;color:var(--text-dim);}
  #shortcuts-modal .row:last-child{border-bottom:none;}
  #shortcuts-modal kbd{font-family:var(--font-mono);background:var(--surface-2);
    border:1px solid var(--border);border-radius:4px;padding:2px 8px;color:var(--text);}

  ::-webkit-scrollbar{width:8px;height:8px;}
  ::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px;}
  ::-webkit-scrollbar-track{background:transparent;}
</style>
</head>
<body>

<div id="progress-wrap"><div id="progress-bar"></div></div>
<div id="counter"><span class="lbl">STEP</span>00 / 00</div>
<div id="hint">right-click / &rarr; / Mouse4 next &nbsp;&middot;&nbsp; &larr; / Mouse3 prev &nbsp;&middot;&nbsp; ? for help</div>

<div id="shortcuts-modal">
  <div class="panel">
    <h3>Keyboard &amp; Mouse Shortcuts</h3>
    <div class="row"><span>Next slide</span><span><kbd>&rarr;</kbd>, right-click, or Mouse4</span></div>
    <div class="row"><span>Previous slide</span><span><kbd>&larr;</kbd> or Mouse3</span></div>
    <div class="row"><span>First slide</span><span><kbd>Home</kbd></span></div>
    <div class="row"><span>Last slide</span><span><kbd>End</kbd></span></div>
    <div class="row"><span>Toggle this panel</span><span><kbd>?</kbd></span></div>
    <div class="row"><span>Close panel</span><span><kbd>Esc</kbd></span></div>
    <div class="row"><span>Left-click</span><span>free for text &amp; buttons</span></div>
  </div>
</div>

<div id="deck"></div>

<script>
/* ============ HELPERS ============ */
function escHtml(s){
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

let codeBlockIdx = 0;
const KEYWORDS = new Set(["public","private","protected","static","void","int","double","char",
  "boolean","class","new","return","if","else","for","while","break","continue","this","null",
  "true","false","import","extends","implements","final","long","short","byte","float","package",
  "try","catch","finally","throw","interface","enum","switch","case","default","super","instanceof"]);

function codeBlock(code, lang){
  lang = lang || "java";
  codeBlockIdx++;
  const id = "code-" + codeBlockIdx;
  const tokenRe = /(\/\/.*$)|(\/\*[\s\S]*?\*\/)|("(?:[^"\\]|\\.)*")|('(?:[^'\\]|\\.)*')|(\b\d+\.?\d*\b)|(\b[A-Za-z_][A-Za-z0-9_]*\b)/gm;
  let out = "";
  let last = 0;
  let m;
  while((m = tokenRe.exec(code)) !== null){
    out += escHtml(code.slice(last, m.index));
    const full = m[0], comment1 = m[1], comment2 = m[2], dstr = m[3], sstr = m[4], num = m[5], ident = m[6];
    if(comment1 || comment2){
      out += '<span class="tok-com">' + escHtml(full) + '</span>';
    } else if(dstr || sstr){
      out += '<span class="tok-str">' + escHtml(full) + '</span>';
    } else if(num){
      out += '<span class="tok-num">' + escHtml(full) + '</span>';
    } else if(ident){
      if(KEYWORDS.has(ident)){
        out += '<span class="tok-kw">' + escHtml(full) + '</span>';
      } else if(/^[A-Z]/.test(ident)){
        out += '<span class="tok-type">' + escHtml(full) + '</span>';
      } else {
        out += escHtml(full);
      }
    }
    last = tokenRe.lastIndex;
  }
  out += escHtml(code.slice(last));
  return '<div class="code-wrap"><div class="code-top"><span class="code-lang">' + lang +
    '</span><button class="copy-btn" onclick="copyCode(this,\'' + id + '\')">Copy</button></div>' +
    '<pre class="code-pre"><code id="' + id + '">' + out + '</code></pre></div>';
}

function copyCode(btn, id){
  const codeEl = document.getElementById(id);
  const text = codeEl.textContent;
  const done = () => {
    const old = btn.textContent;
    btn.textContent = "Copied!";
    btn.classList.add("copied");
    setTimeout(()=>{ btn.textContent = old || "Copy"; btn.classList.remove("copied"); }, 1400);
  };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done).catch(done);
  } else {
    const ta = document.createElement("textarea");
    ta.value = text; document.body.appendChild(ta); ta.select();
    try{ document.execCommand("copy"); }catch(e){}
    document.body.removeChild(ta);
    done();
  }
}

/* ============ TREE DIAGRAM GENERATOR (with optional visit-order badges) ============ */
function measureWidth(node, unit){
  if(!node.children || node.children.length === 0) return unit;
  let w = 0;
  node.children.forEach(c => { w += measureWidth(c, unit); });
  return Math.max(w, unit);
}

function layoutTree(node, x, y, unit, levelH, positions, edges, depth){
  const w = measureWidth(node, unit);
  const cx = x + w / 2;
  positions.push({ node: node, x: cx, y: y, depth: depth });
  if(node.children && node.children.length){
    let childX = x;
    node.children.forEach(c => {
      const cw = measureWidth(c, unit);
      const childCenterX = childX + cw / 2;
      edges.push({ x1: cx, y1: y, x2: childCenterX, y2: y + levelH });
      layoutTree(c, childX, y + levelH, unit, levelH, positions, edges, depth + 1);
      childX += cw;
    });
  }
}

function treeDiagram(root, opts){
  opts = opts || {};
  const unit = opts.unit || 88;
  const levelH = opts.levelH || 80;
  const nodeR = opts.nodeR || 25;
  const padX = nodeR + 10;
  const padTop = 40;

  const positions = [], edges = [];
  layoutTree(root, 0, padTop, unit, levelH, positions, edges, 0);
  const totalW = measureWidth(root, unit);
  const maxDepth = Math.max.apply(null, positions.map(p => p.depth));
  const svgW = totalW + padX * 2;
  const svgH = padTop + maxDepth * levelH + nodeR + 30;

  let svg = '<svg class="tree-svg" viewBox="0 0 ' + svgW + ' ' + svgH + '" xmlns="http://www.w3.org/2000/svg">' +
    '<title>' + (opts.svgTitle || "Binary tree diagram") + '</title>';

  edges.forEach(e => {
    svg += '<line x1="' + (e.x1+padX) + '" y1="' + e.y1 + '" x2="' + (e.x2+padX) + '" y2="' + e.y2 + '" class="tree-edge"/>';
  });

  positions.forEach(p => {
    const isRoot = p.depth === 0;
    const isLeaf = !p.node.children || p.node.children.length === 0;
    let cls = "tree-node";
    if(p.node.bad) cls += " tree-node-bad";
    else if(p.node.isNew) cls += " tree-node-new";
    else if(isRoot) cls += " tree-node-root";
    else if(isLeaf) cls += " tree-node-leaf";
    const cx = p.x + padX;
    svg += '<circle cx="' + cx + '" cy="' + p.y + '" r="' + nodeR + '" class="' + cls + '"/>' +
      '<text x="' + cx + '" y="' + (p.y+5) + '" text-anchor="middle" class="tree-label" style="font-size:13px;">' + p.node.label + '</text>';
    if(opts.visitOrder && opts.visitOrder[p.node.label] !== undefined){
      const bx = cx + nodeR*0.68, by = p.y - nodeR*0.68;
      svg += '<circle cx="' + bx + '" cy="' + by + '" r="11" class="visit-badge"/>' +
        '<text x="' + bx + '" y="' + (by+4) + '" text-anchor="middle" class="visit-num">' + opts.visitOrder[p.node.label] + '</text>';
    }
  });

  svg += '</svg>';
  let out = svg;
  if(opts.caption) out += '<div class="mem-caption">' + opts.caption + '</div>';
  if(opts.sequence) out += '<div class="seq-strip">' + opts.sequence + '</div>';
  return out;
}

  codeBlock(
'class BSTNode {\n' +
'    int value;\n' +
'    BSTNode left, right;\n' +
'    BSTNode(int value) { this.value = value; }\n' +
'}\n\n' +
'class BST {\n' +
'    BSTNode root;\n\n' +
'    void insert(int value) {\n' +
'        root = insertNode(root, value);\n' +
'    }\n\n' +
'    BSTNode insertNode(BSTNode node, int value) {\n' +
'        if (node == null) return new BSTNode(value);\n' +
'        if (value < node.value) {\n' +
'            node.left = insertNode(node.left, value);\n' +
'        } else {\n' +
'            node.right = insertNode(node.right, value);\n' +
'        }\n' +
'        return node;\n' +
'    }\n\n' +
'    void inorderPrint(BSTNode node) {\n' +
'        if (node == null) return;\n' +
'        inorderPrint(node.left);\n' +
'        System.out.print(node.value + " ");\n' +
'        inorderPrint(node.right);\n' +
'    }\n' +
'}', "java") +
'</div>';

function pairInGrid(items, renderFn){
  let html = '<div class="activity-grid">';
  items.forEach((it, i) => {

    html += '<div' + (isLastOdd ? ' class="activity-centered"' : '') + '>' + renderFn(it, i) + '</div>';
  });

  return html;
}

  return '<div class="slide-inner"><div class="eyebrow out"><span class="step-tag">STEP 22</span> ACTIVITY &middot; CODING</div>' +
    '<h2 class="title">Trace the Code</h2><p class="lead">Trace each snippet against this lesson\u2019s BST and predict the result. Answers are on the next-to-last slide.</p>' +
    html + '</div>';
}

function answersSlide(){
  const mcRows = mcQuestions.map((q,i) =>
    '<div class="ans-row"><div class="ans-num">Q' + (i+1) + '</div><div>' +
    '<span class="ans-correct">' + String.fromCharCode(65+mcAnswers[i]) + ') ' + q.opts[mcAnswers[i]] + '</span>' +
    '<div class="ans-explain">' + mcExplain[i] + '</div></div></div>'
  ).join("");
  const idRows = idItems.map((it,i) =>
    '<div class="ans-row"><div class="ans-num">I' + (i+1) + '</div><div>' +
    '<span class="ans-correct">' + it.a + '</span>' +
    '<div class="ans-explain">' + it.q + '</div></div></div>'
  ).join("");
  const codeRows = codeItems.map((q,i) =>
    '<div class="ans-row"><div class="ans-num">C' + (i+1) + '</div><div>' +
    '<span class="ans-out">' + q.ans.map(escHtml).join(" / ") + '</span>' +
    '<div class="ans-explain">' + q.exp + '</div></div></div>'
  ).join("");
  return '<div class="slide-inner"><div class="eyebrow"><span class="step-tag">STEP 23</span> ANSWER KEY</div>' +
    '<h2 class="title">All Answers &amp; Explanations</h2>' +
    '<div class="answers-scroll">' +
      '<div class="ans-group-label">Multiple Choice</div>' + mcRows +
      '<div class="ans-group-label">Identification</div>' + idRows +
      '<div class="ans-group-label">Coding</div>' + codeRows +
    '</div></div>';
}

  '<div class="eyebrow"><span class="step-tag">STEP 24</span> CLOSING</div>' +
  '<h2 class="title" style="text-align:center;">That\u2019s Traversals &amp; BSTs</h2>' +
  '<div class="closing-quote">&ldquo;A tree only reveals its order once you decide how to walk it.&rdquo;</div>' +

'</div>';

/* ============ ASSEMBLE DECK ============ */

slides.push(sectionDivider("STEP 03","SECTION","Part 1 \u2014 Why Traversal?","Before comparing the three orders, let\u2019s be clear on why a defined order is needed at all."));

/* ============ RENDER & NAVIGATION ============ */
const deck = document.getElementById("deck");
slides.forEach((html) => {
  const div = document.createElement("div");
  div.className = "slide";
  div.innerHTML = html;
  deck.appendChild(div);
});
const slideEls = Array.from(document.querySelectorAll(".slide"));
let current = 0;

function pad2(n){ return String(n).padStart(2,"0"); }

function render(){
  slideEls.forEach((el,i)=>{ el.classList.toggle("active", i===current); });
  document.getElementById("counter").innerHTML =
    '<span class="lbl">STEP</span>' + pad2(current) + " / " + pad2(slideEls.length-1);
  document.getElementById("progress-bar").style.width = (((current+1)/slideEls.length)*100)+"%";
}
function goTo(i){ current = Math.max(0, Math.min(slideEls.length-1, i)); render(); }
function next(){ goTo(current+1); }
function prev(){ goTo(current-1); }

render();

/* block the default context menu everywhere */
document.addEventListener("contextmenu", (e) => { e.preventDefault(); }, true);

/* mouse navigation: right-click / Mouse4 = next, Mouse3 = previous */
document.addEventListener("mousedown", (e) => {
  const modal = document.getElementById("shortcuts-modal");
  if(e.button === 2){
    if(e.target.closest("button, a, input, textarea, select, .copy-btn")) return;
    if(modal.classList.contains("show")){ modal.classList.remove("show"); return; }
    e.preventDefault(); e.stopImmediatePropagation();
    next();
  } else if(e.button === 3){
    e.preventDefault(); e.stopImmediatePropagation();
    prev();
  } else if(e.button === 4){
    e.preventDefault(); e.stopImmediatePropagation();
    next();
  }
}, true);

window.addEventListener("auxclick", (e) => {
  if(e.button === 3 || e.button === 4){ e.preventDefault(); e.stopImmediatePropagation(); }
}, true);

/* keyboard */
document.addEventListener("keydown", (e) => {
  const modal = document.getElementById("shortcuts-modal");
  if(e.key === "?"){ modal.classList.toggle("show"); e.preventDefault(); return; }
  if(modal.classList.contains("show")){
    if(e.key === "Escape") modal.classList.remove("show");
    return;
  }
  if(e.key === "ArrowRight"){ next(); }
  else if(e.key === "ArrowLeft"){ prev(); }
  else if(e.key === "Home"){ goTo(0); }
  else if(e.key === "End"){ goTo(slideEls.length-1); }
});

/* swipe */
let touchStartX = null;
document.addEventListener("touchstart", (e) => { touchStartX = e.changedTouches[0].screenX; }, {passive:true});
document.addEventListener("touchend", (e) => {
  if(touchStartX === null) return;
  const dx = e.changedTouches[0].screenX - touchStartX;
  if(Math.abs(dx) > 50){ if(dx < 0) next(); else prev(); }
  touchStartX = null;
}, {passive:true});
</script>
