<script>
/* ── helpers ── */
function hl(code){
  return code
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/(\/\/[^\n]*)/g,'<span class="cm">$1</span>')
    .replace(/("(?:\\.|[^"\\])*"|'(?:\\.|[^'\\])*'|`(?:\\.|[^`\\])*`)/g,'<span class="str">$1</span>')
    .replace(/\b(const|let|var|function|return|if|else|for|while|new|import|export|default|class|extends|async|await|true|false|null|undefined|typeof|document|window)\b/g,'<span class="kw">$1</span>')
    .replace(/\b(getElementById|getElementsByTagName|getElementsByClassName|createElement|appendChild|removeChild|replaceChild|setAttribute|querySelector|querySelectorAll|innerHTML|style|write|addEventListener)\b/g,'<span class="fn">$1</span>');
}
function hlHtml(code){
  return code
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/(&lt;\/?)([\w]+)/g,'<span class="tag">$1$2</span>')
    .replace(/([\w-]+)=/g,'<span class="attr">$1</span>=')
    .replace(/=("(?:[^"]*)")/g,'=<span class="val">$1</span>')
    .replace(/(\/\/[^\n]*)/g,'<span class="cm">$1</span>');
}
function cb(code, lang='js'){
  const hled = lang==='html' ? hlHtml(code) : hl(code);
  const id = 'cb'+Math.random().toString(36).slice(2);
  return `<div class="codeblock"><div class="codebar"><span class="codelang">${lang}</span><button class="copybtn" onclick="doCopy(this,'${id}')">Copy</button></div><pre id="${id}">${hled}</pre></div>`;
}
function doCopy(btn,id){
  const txt = document.getElementById(id).innerText;
  navigator.clipboard.writeText(txt).then(()=>{
    btn.textContent='Copied!';btn.classList.add('copied');
    setTimeout(()=>{btn.textContent='Copy';btn.classList.remove('copied')},1800);
  });
}

/* ── ENGINE ── */
let cur = 0;
const tot = S.length;
const deck = document.getElementById('deck');
const prog = document.getElementById('prog');
const ctr  = document.getElementById('ctr');
let busy = false;

const ws = S.map((html,i) => {
  const w = document.createElement('div');
  w.className = 'sw';
  w.innerHTML = `<div class="slide" style="display:flex;flex-direction:column;gap:12px">${html}</div>`;
  deck.appendChild(w);
  return w;
});

function ui(){
  prog.style.width = ((cur+1)/tot*100)+'%';
  ctr.textContent  = (cur+1)+' / '+tot;
}
function go(idx, dir){
  if(busy||idx===cur||idx<0||idx>=tot) return;
  busy=true;
  const pv=ws[cur], nx=ws[idx];
  pv.classList.remove('active');
  pv.classList.add(dir===1?'xl':'xr');
  nx.style.transform=dir===1?'translateX(40px)':'translateX(-40px)';
  nx.style.opacity='0';
  nx.classList.add('active');
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    nx.style.transform=''; nx.style.opacity='';
  }));
  cur=idx; ui();
  setTimeout(()=>{ pv.classList.remove('xl','xr'); busy=false; },380);
}

ws[0].classList.add('active'); ui();

document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'||e.key==='ArrowDown') go(cur+1,1);
  else if(e.key==='ArrowLeft'||e.key==='ArrowUp') go(cur-1,-1);
  else if(e.key==='Home') go(0,-1);
  else if(e.key==='End') go(tot-1,1);
  else if(e.key==='?') document.getElementById('sco').classList.toggle('show');
  else if(e.key==='Escape') document.getElementById('sco').classList.remove('show');
});
document.addEventListener('mousedown',e=>{
  if(e.button===2){e.preventDefault();e.stopImmediatePropagation();go(cur+1,1);}
  else if(e.button===3){e.preventDefault();e.stopImmediatePropagation();go(cur-1,-1);}
  else if(e.button===4){e.preventDefault();e.stopImmediatePropagation();go(cur+1,1);}
},true);
document.addEventListener('contextmenu',e=>e.preventDefault(),true);
document.addEventListener('auxclick',e=>{if(e.button!==0)e.preventDefault();},true);
let tx=0;
document.addEventListener('touchstart',e=>{tx=e.touches[0].clientX;},{passive:true});
document.addEventListener('touchend',e=>{
  const dx=e.changedTouches[0].clientX-tx;
  if(Math.abs(dx)>50) go(cur+(dx<0?1:-1),dx<0?1:-1);
},{passive:true});
</script>
