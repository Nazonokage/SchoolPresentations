<script>
function hlJS(c){
  return c.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/(\/\/[^\n]*)/g,'<span class="cm">$1</span>')
    .replace(/("(?:\\.|[^"\\])*"|'(?:\\.|[^'\\])*'|`(?:\\.|[^`\\])*`)/g,'<span class="str">$1</span>')
    .replace(/\b(const|let|var|function|return|if|else|for|new|true|false|null|undefined|typeof|document|window|console)\b/g,'<span class="kw">$1</span>')
    .replace(/\b(getElementById|getElementsByTagName|getElementsByClassName|querySelector|querySelectorAll|createElement|appendChild|addEventListener|classList|forEach|from|filter|map|log|textContent|innerHTML|style)\b/g,'<span class="fn">$1</span>');
}
function hlHTML(c){
  return c.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/(&lt;\/?)([\w]+)/g,'<span class="tag">$1$2</span>')
    .replace(/([\w-]+)=(?=")/g,'<span class="attr">$1</span>=')
    .replace(/=("(?:[^"]*)")/g,'=<span class="val">$1</span>')
    .replace(/(\/\/[^\n]*)/g,'<span class="cm">$1</span>');
}
function cb(code,lang='js'){
  const id='cb'+Math.random().toString(36).slice(2);
  const h=lang==='html'?hlHTML(code):hlJS(code);
  return `<div class="codeblock"><div class="codebar"><span class="codelang">${lang}</span><button class="copybtn" onclick="doCopy(this,'${id}')">Copy</button></div><pre id="${id}">${h}</pre></div>`;
}
function doCopy(btn,id){
  navigator.clipboard.writeText(document.getElementById(id).innerText).then(()=>{
    btn.textContent='Copied!';btn.classList.add('copied');
    setTimeout(()=>{btn.textContent='Copy';btn.classList.remove('copied');},1800);
  });
}

/* ══ 2 — querySelector INTRO ══════════════════ */
S.push(`
<div class="eyebrow">Topic 1 · Modern Selection Methods</div>
<div class="stitle"><span class="ap">querySelector</span> & <span class="ag">querySelectorAll</span></div>
<div class="ssub" style="margin-bottom:10px">Accept any valid CSS selector string — the most flexible selection API in the DOM.</div>
<div class="tw" style="margin-bottom:14px"><table>
  <thead><tr><th>Method</th><th>Returns</th><th>If No Match</th></tr></thead>
  <tbody>
    <tr>
      <td>document.querySelector(selector)</td>
      <td style="font-family:sans-serif;color:#c6d4e4">The <strong>first</strong> element matching the CSS selector</td>
      <td style="font-family:monospace;color:#f87171">null</td>
    </tr>
    <tr>
      <td>document.querySelectorAll(selector)</td>
      <td style="font-family:sans-serif;color:#c6d4e4">A <strong>static NodeList</strong> of all matching elements</td>
      <td style="font-family:sans-serif;color:#7592b2">Empty NodeList</td>
    </tr>
  </tbody>
</table></div>
${cb(`// ── Select by ID ──────────────────────────────
const header = document.querySelector("#main-header");

// ── Select by class ────────────────────────────
const primaryBtn = document.querySelector(".btn-primary");

// ── Select ALL matching by class ───────────────
const allCards = document.querySelectorAll(".card-item");

// ── Complex attribute selector ─────────────────
const reqInputs = document.querySelectorAll("input[type='text'][required]");

// ── Descendant combinator ──────────────────────
const navLinks = document.querySelectorAll("nav ul li a");`,'js')}
<div class="note" style="margin-top:12px">💡 <strong>querySelector vs getElementById:</strong> Both find a single element by ID — but <code>querySelector("#id")</code> accepts the full CSS <code>#</code> prefix and any other valid selector, making it far more versatile.</div>

/* ══ 3 — HTMLCOLLECTION vs NODELIST ═══════════ */
S.push(`
<div class="eyebrow">Topic 2 · Collections</div>
<div class="stitle"><span class="ab">HTMLCollection</span> vs <span class="ag">NodeList</span></div>
<div class="ssub" style="margin-bottom:10px">Both are array-like objects — but they behave very differently.</div>
<div class="split" style="margin-bottom:14px">
  <div class="split-l">

    <div style="font-size:15px;line-height:1.7;color:#c6d4e4">
      <div style="padding:5px 0;border-bottom:1px solid #252f48"><strong style="color:#eef2fa">Returned by:</strong><br><code>getElementsByTagName()</code><br><code>getElementsByClassName()</code><br><code>element.children</code></div>
      <div style="padding:5px 0;border-bottom:1px solid #252f48"><strong style="color:#eef2fa">Node types:</strong> HTML elements <em>only</em></div>

      <div style="padding:5px 0"><strong style="color:#eef2fa">Nature:</strong> <span class="badge yes">🔴 LIVE</span> — auto-updates when DOM changes</div>

      <div style="padding:5px 0;border-bottom:1px solid #252f48"><strong style="color:#eef2fa">Returned by:</strong><br><code>querySelectorAll()</code><br><code>element.childNodes</code></div>
      <div style="padding:5px 0;border-bottom:1px solid #252f48"><strong style="color:#eef2fa">Node types:</strong> Elements, Text, Comments, Attributes</div>

      <div style="padding:5px 0"><strong style="color:#eef2fa">Nature:</strong> <span class="badge yes">📸 STATIC</span> (querySelectorAll) · <span class="badge yes">🔴 LIVE</span> (childNodes)</div>

/* ══ 4 — LIVE vs STATIC DEEP DIVE ═════════════ */
S.push(`
<div class="eyebrow">Topic 2 · Collections</div>
<div class="stitle">Live <span class="ar">vs</span> Static — Why It Matters</div>
<div class="g2" style="margin-bottom:14px">
  <div class="card r">
    <div class="ct">🔴 Live Collection — HTMLCollection</div>
    <div class="cb">Behaves like a <strong>live security camera feed</strong>. When elements are added to or removed from the DOM, the collection reflects the change <em>immediately</em> — without re-querying.<br><br>
    <strong>⚠️ Danger:</strong> If you delete elements inside a <code>for</code> loop over a live collection, indices shift mid-loop and you can skip or double-process elements.
    </div>
  </div>
  <div class="card g">
    <div class="ct">📸 Static Collection — querySelectorAll NodeList</div>
    <div class="cb">Behaves like a <strong>photograph of the DOM</strong> at the moment of the query. DOM changes after the query <em>do not affect</em> the list — you always iterate over the original matched set.<br><br>
    <strong>✅ Safer</strong> for most iteration and manipulation tasks.
    </div>
  </div>
</div>
${cb(`// LIVE — HTMLCollection
const liveItems = document.getElementsByClassName("item");
console.log(liveItems.length); // 3

document.querySelector(".item").remove(); // remove one from DOM
console.log(liveItems.length); // 2 ← automatically updated!

// STATIC — querySelectorAll NodeList
const staticItems = document.querySelectorAll(".item");
console.log(staticItems.length); // 3

document.querySelector(".item").remove(); // remove one from DOM
console.log(staticItems.length); // still 3 ← snapshot, unchanged`,'js')}
`);

let cur=0;
const tot=S.length;
const deck=document.getElementById('deck');
const prog=document.getElementById('prog');
const ctr=document.getElementById('ctr');
let busy=false;
const ws=S.map(html=>{
  const w=document.createElement('div');
  w.className='sw';
  w.innerHTML=`<div class="slide">${html}</div>`;
  deck.appendChild(w);
  return w;
});
function ui(){prog.style.width=((cur+1)/tot*100)+'%';ctr.textContent=(cur+1)+' / '+tot;}
function go(idx,dir){
  if(busy||idx===cur||idx<0||idx>=tot)return;
  busy=true;
  const pv=ws[cur],nx=ws[idx];
  pv.classList.remove('active');pv.classList.add(dir===1?'xl':'xr');
  nx.style.transform=dir===1?'translateX(40px)':'translateX(-40px)';nx.style.opacity='0';
  nx.classList.add('active');
  requestAnimationFrame(()=>requestAnimationFrame(()=>{nx.style.transform='';nx.style.opacity='';}));
  cur=idx;ui();
  setTimeout(()=>{pv.classList.remove('xl','xr');busy=false;},380);
}
ws[0].classList.add('active');ui();
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'||e.key==='ArrowDown')go(cur+1,1);
  else if(e.key==='ArrowLeft'||e.key==='ArrowUp')go(cur-1,-1);
  else if(e.key==='Home')go(0,-1);
  else if(e.key==='End')go(tot-1,1);
  else if(e.key==='?')document.getElementById('sco').classList.toggle('show');
  else if(e.key==='Escape')document.getElementById('sco').classList.remove('show');
});
document.addEventListener('mousedown',e=>{
  if(e.button===2){e.preventDefault();e.stopImmediatePropagation();go(cur+1,1);}
  else if(e.button===3){e.preventDefault();e.stopImmediatePropagation();go(cur-1,-1);}
  else if(e.button===4){e.preventDefault();e.stopImmediatePropagation();go(cur+1,1);}
},true);
document.addEventListener('contextmenu',e=>e.preventDefault(),true);
document.addEventListener('auxclick',e=>{if(e.button!==0)e.preventDefault();},true);
let tx=0;
document.addEventListener('touchstart',e=>{tx=e.touches[0].clientX;},{passive:true});
document.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-tx;if(Math.abs(dx)>50)go(cur+(dx<0?1:-1),dx<0?1:-1);},{passive:true});
</script>
</body>
</html>
