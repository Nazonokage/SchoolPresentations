<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>M10–11 · Node.js Introduction</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0A1628;--s1:#0F1E35;--s2:#152540;--s3:#1B2F50;
  --b1:#1E3A5A;--b2:#2A5080;
  --grn:#68D391;--grn2:#38A169;
  --cyn:#63B3ED;--cyn2:#3182CE;
  --amb:#F6AD55;--amb2:#DD6B20;
  --rose:#FC8181;--rose2:#C53030;
  --pur:#B794F4;
  --txt:#EDF2F7;--txt2:#718096;--txt3:#CBD5E0;
  --node:#539E43;
  --mono:'Cascadia Code','Fira Code','Consolas',monospace;
  --sans:'Segoe UI',system-ui,sans-serif;
  --ra:8px;--rb:14px;
  --tr:340ms cubic-bezier(.4,0,.2,1);
}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--txt);font-family:var(--sans)}
#bar{position:fixed;top:0;left:0;height:3px;background:linear-gradient(90deg,var(--node),var(--cyn));z-index:99;transition:width .28s;border-radius:0 2px 2px 0}
#ctr{position:fixed;top:9px;right:14px;font-size:11px;color:var(--txt2);z-index:99;font-family:var(--mono);letter-spacing:.4px}
#deck{width:100%;height:100vh;position:relative;overflow:hidden}
.slide{position:absolute;inset:0;display:flex;flex-direction:column;padding:44px 58px 28px;opacity:0;pointer-events:none;transform:translateX(44px);transition:opacity var(--tr),transform var(--tr);overflow-y:auto}
.slide.active{opacity:1;pointer-events:all;transform:translateX(0)}
.slide.ol{opacity:0;transform:translateX(-44px)}.slide.or{opacity:0;transform:translateX(44px)}
@media(prefers-reduced-motion:reduce){.slide{transition:opacity .12s;transform:none!important}}
/* TYPE */
.ey{font-size:10.5px;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:var(--node);margin-bottom:8px;display:flex;align-items:center;gap:9px}
.ey::before{content:'';width:18px;height:2px;background:var(--node);border-radius:1px;display:inline-block;flex-shrink:0}
.ey.c{color:var(--cyn)}.ey.c::before{background:var(--cyn)}
.ttl{font-size:clamp(25px,2.8vw,41px);font-weight:800;line-height:1.1;letter-spacing:-.3px;color:var(--txt);margin-bottom:4px}
.sub{font-size:14.5px;color:var(--txt2);margin-bottom:16px}
.rule{height:1px;background:linear-gradient(90deg,var(--b2),transparent);border:none;margin-bottom:16px}
/* LAYOUT */
.cnt{flex:1;display:flex;flex-direction:column;gap:11px;min-height:0}
.g2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:11px}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}
.g4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px}
.sp{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:13px;flex:1;min-height:0}
.sp>*{min-width:0;display:flex;flex-direction:column;gap:8px}
.col{display:flex;flex-direction:column;gap:8px;min-width:0}
.f1{flex:1}
/* FIXED-HEIGHT CODE PANEL */
.codepanel{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:13px;height:min(520px,60vh);align-items:stretch}
.codepanel>*{min-width:0;height:100%;display:flex;flex-direction:column}
/* CARD */
.card{background:var(--s1);border:1px solid var(--b1);border-radius:var(--rb);padding:13px 15px}
.card h3{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:1.5px;color:var(--node);margin-bottom:8px}
.card h3.c{color:var(--cyn)}
.card p,.card li{font-size:14.5px;color:var(--txt3);line-height:1.62}
.card ul{padding-left:15px}.card li{margin-bottom:3px}
/* CODE */
.cw{position:relative;background:#060F1C;border:1px solid var(--b1);border-radius:var(--ra);overflow:hidden;display:flex;flex-direction:column;flex:1}
.ch{display:flex;align-items:center;justify-content:space-between;padding:5px 11px;background:#080E1A;border-bottom:1px solid var(--b1);font-size:10px;color:var(--txt2);font-family:var(--mono);flex-shrink:0}
.ch .lb{color:var(--amb)}
.cw pre{padding:11px 13px;overflow:auto;font-family:var(--mono);font-size:13px;line-height:1.73;white-space:pre;flex:1;min-height:0}
.cpb{padding:2px 9px;font-size:10px;font-family:var(--sans);background:var(--s3);border:1px solid var(--b2);color:var(--txt2);border-radius:3px;cursor:pointer;transition:all .16s}
.cpb:hover{background:var(--node);color:#fff;border-color:var(--node)}
.cpb.ok{background:var(--grn);color:#060F1C;border-color:var(--grn)}
/* SYNTAX */
.k{color:#F687B3}.s{color:#9AE6B4}.f{color:#BEE3F8}.n{color:#90CDF4}
.cm{color:#2D4A65;font-style:italic}.tp{color:#FBB6CE}.b{color:#FAF089}
/* BREAKDOWN */
.bd{display:flex;flex-direction:column;gap:6px}
.bi{display:flex;gap:8px;align-items:flex-start;padding:8px 10px;background:var(--s1);border:1px solid var(--b1);border-radius:6px;border-left:3px solid var(--node)}
.bi.c{border-left-color:var(--cyn)}.bi.a{border-left-color:var(--amb)}
.bi.r{border-left-color:var(--rose)}.bi.g{border-left-color:var(--grn)}
.bl{font-family:var(--mono);font-size:10px;color:var(--node);background:#060F1C;padding:2px 6px;border-radius:3px;white-space:nowrap;align-self:flex-start;margin-top:1px;flex-shrink:0}
.bl.c{color:var(--cyn)}
.bt{font-size:13.5px;color:var(--txt3);line-height:1.52}.bt strong{color:var(--txt);font-weight:600}
/* STEP */
.step{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;background:var(--s1);border:1px solid var(--b1);border-radius:var(--ra)}
.sn{width:25px;height:25px;border-radius:50%;background:var(--node);color:#fff;font-weight:900;font-size:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px}
.sb h4{font-size:14px;font-weight:700;color:var(--txt);margin-bottom:2px}
.sb p{font-size:13px;color:var(--txt2);line-height:1.48}
/* TABLE */
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{background:var(--s2);color:var(--node);padding:7px 11px;text-align:left;font-weight:700;font-size:10px;letter-spacing:1px;text-transform:uppercase;border-bottom:1px solid var(--b1)}
td{padding:7px 11px;border-bottom:1px solid var(--b1);color:var(--txt3);line-height:1.45;vertical-align:top}
tr:last-child td{border-bottom:none}
tr:hover td{background:rgba(255,255,255,.012)}
/* PILLS */
.pill{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600;border:1px solid var(--b1);color:var(--txt2);margin:2px}
.pg{border-color:var(--grn);color:var(--grn);background:rgba(104,211,145,.07)}
.pc{border-color:var(--cyn);color:var(--cyn);background:rgba(99,179,237,.07)}
.pa{border-color:var(--amb);color:var(--amb);background:rgba(246,173,85,.07)}
.pn{border-color:var(--node);color:var(--node);background:rgba(83,158,67,.07)}
/* SCENARIO TAG */
.stag{display:inline-block;padding:2px 10px;border-radius:4px;font-size:10.5px;font-weight:700;font-family:var(--mono);background:rgba(246,173,85,.12);color:var(--amb);border:1px solid rgba(246,173,85,.25);margin-bottom:8px}
/* HERO */
.hbg{background:radial-gradient(ellipse at 12% 60%,rgba(83,158,67,.1) 0%,transparent 52%),radial-gradient(ellipse at 85% 15%,rgba(99,179,237,.07) 0%,transparent 46%),var(--bg)}
.ht{font-size:clamp(42px,4.8vw,68px);font-weight:900;line-height:1.02;letter-spacing:-1.2px}
.hs{font-size:17px;color:var(--txt2);max-width:520px;line-height:1.65;margin:12px 0 17px}
.dots{position:absolute;inset:0;background-image:radial-gradient(rgba(83,158,67,.04) 1px,transparent 1px);background-size:28px 28px;pointer-events:none}
/* FLOW DIAGRAM */
.flow{display:flex;align-items:center;flex-wrap:wrap;gap:0;margin:8px 0}
.fb{background:var(--s2);border:1px solid var(--b2);border-radius:6px;padding:6px 12px;font-size:13px;color:var(--txt3);font-weight:500}
.fb.hi{border-color:var(--node);color:var(--node)}
.fa{color:var(--node);padding:0 6px;font-size:15px}
/* COMPARE */
.cmp{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:11px}
.cmp-box{border-radius:var(--ra);padding:13px 15px;border:1px solid var(--b1)}
.cmp-box.old{background:rgba(252,129,129,.05);border-color:rgba(252,129,129,.2)}
.cmp-box.new{background:rgba(83,158,67,.05);border-color:rgba(83,158,67,.2)}
.cmp-box h4{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1px;margin-bottom:9px}
.cmp-box.old h4{color:var(--rose)}.cmp-box.new h4{color:var(--node)}
.cmp-box p,.cmp-box li{font-size:14px;color:var(--txt3);line-height:1.6}
.cmp-box ul{padding-left:14px}
/* BADGE ROW */
.badge-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:10px 0}
.badge-ico{display:flex;align-items:center;gap:6px;padding:5px 12px;border-radius:6px;background:var(--s2);border:1px solid var(--b1);font-size:12.5px;color:var(--txt3);font-weight:600}
/* QUIZ */
.mc-item{background:var(--s1);border:1px solid var(--b1);border-radius:var(--ra);padding:11px 13px}
.mc-q{font-size:14px;font-weight:600;color:var(--txt);margin-bottom:8px;line-height:1.48}
.qn{color:var(--node);margin-right:5px;font-weight:800}
.mc-opts{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:4px}
.mc-o{padding:6px 9px;border-radius:4px;border:1px solid var(--b1);font-size:13px;color:var(--txt3);cursor:pointer;transition:all .14s;background:var(--s2);line-height:1.35}
.mc-o:hover{border-color:var(--node);color:var(--txt)}
.mc-o.sel{border-color:var(--node);background:rgba(83,158,67,.1);color:var(--node)}
/* ANS */
.ab2{border:1px solid var(--b1);border-radius:var(--rb);overflow:hidden;flex:1}
.ar{display:flex;gap:8px;padding:7px 11px;border-bottom:1px solid var(--b1);font-size:13px;align-items:flex-start}
.ar:last-child{border:none}
.ar:nth-child(even){background:rgba(255,255,255,.01)}
.an{font-weight:800;min-width:21px;font-family:var(--mono);font-size:11px;flex-shrink:0;margin-top:1px;color:var(--node)}
.ab{color:var(--txt3);line-height:1.48;flex:1;min-width:0}
.ab strong{color:var(--grn)}
/* QUOTE */
.qc{background:linear-gradient(135deg,var(--s1),var(--s2));border-left:3px solid var(--node);border-radius:0 var(--ra) var(--ra) 0;padding:12px 16px;margin-bottom:9px}
.qt{font-size:15px;color:var(--txt3);line-height:1.68;font-style:italic}
.qs{font-size:10px;color:var(--node);margin-top:5px;font-style:normal;font-weight:700;letter-spacing:.5px}
/* RECAP */
.rcg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}
.rc{background:var(--s1);border:1px solid var(--b1);border-radius:var(--rb);padding:13px;text-align:center}
.rc .ico{font-size:22px;margin-bottom:6px}
.rc h4{font-size:10px;font-weight:700;color:var(--node);margin-bottom:4px;text-transform:uppercase;letter-spacing:.5px}
.rc p{font-size:12px;color:var(--txt2);line-height:1.5}
/* MODAL */
#mod{display:none;position:fixed;inset:0;background:rgba(0,0,0,.82);z-index:999;align-items:center;justify-content:center}
#mod.open{display:flex}
.mb{background:var(--s1);border:1px solid var(--b2);border-radius:13px;padding:22px 26px;min-width:300px}
.mb h3{font-size:13.5px;font-weight:700;color:var(--node);margin-bottom:12px}
.sr{display:flex;justify-content:space-between;align-items:center;padding:5px 0;border-bottom:1px solid var(--b1);font-size:12px;color:var(--txt3)}
.sr:last-of-type{border:none}
.sr kbd{background:var(--s2);border:1px solid var(--b2);border-radius:3px;padding:1px 6px;font-family:var(--mono);font-size:10px;color:var(--txt)}
.mcl{margin-top:13px;width:100%;padding:8px;background:var(--node);color:#fff;border:none;border-radius:5px;cursor:pointer;font-size:13px;font-weight:700;font-family:var(--sans)}
#hint{position:fixed;bottom:11px;left:50%;transform:translateX(-50%);font-size:10px;color:var(--txt2);pointer-events:none;opacity:.35;font-family:var(--mono);letter-spacing:.3px}
ic{background:var(--s2);padding:1px 5px;border-radius:3px;font-family:var(--mono);font-size:11.5px;color:var(--pur);border:1px solid var(--b1)}
</style>
</head>

<script>
// ── TOKENIZER ─────────────────────────────────────────────────────────
function hl(raw){
  const KW=/^(const|let|var|function|return|async|await|try|catch|throw|new|class|if|else|for|while|import|export|default|from|require|module|true|false|null|undefined)\b/;
  const TY=/^(console|process|fs|http|path|os|JSON|Math|Promise|Error|setTimeout|clearTimeout|EventEmitter|Buffer)\b/;
  const NUM=/^\b\d+(\.\d+)?\b/;
  function e(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
  let i=0,o='';
  while(i<raw.length){
    if(raw[i]==='/'&&raw[i+1]==='/'){const end=raw.indexOf('\n',i);const ch=end<0?raw.slice(i):raw.slice(i,end);o+='<span class="cm">'+e(ch)+'</span>';i+=ch.length;continue;}
    if(raw[i]==='`'){let j=i+1;while(j<raw.length&&raw[j]!=='`'){if(raw[j]==='\\')j++;j++;}o+='<span class="s">'+e(raw.slice(i,j+1))+'</span>';i=j+1;continue;}
    if(raw[i]==="'"){let j=i+1;while(j<raw.length&&raw[j]!=="'"&&raw[j]!=='\n'){if(raw[j]==='\\')j++;j++;}o+='<span class="s">'+e(raw.slice(i,j+1))+'</span>';i=j+1;continue;}
    if(raw[i]==='"'){let j=i+1;while(j<raw.length&&raw[j]!=='"'&&raw[j]!=='\n'){if(raw[j]==='\\')j++;j++;}o+='<span class="s">'+e(raw.slice(i,j+1))+'</span>';i=j+1;continue;}
    const rest=raw.slice(i);let m;
    if((m=rest.match(KW))){o+='<span class="k">'+m[0]+'</span>';i+=m[0].length;continue;}
    if((m=rest.match(TY))){o+='<span class="tp">'+m[0]+'</span>';i+=m[0].length;continue;}
    if((m=rest.match(NUM))){o+='<span class="n">'+m[0]+'</span>';i+=m[0].length;continue;}
    o+=e(raw[i]);i++;
  }
  return o;
}
function cw(code,lang,label,mh){
  const id='c'+Math.random().toString(36).slice(2);
  const body=(lang==='js'||lang==='bash'||lang==='json')?hl(code):code.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const style=mh?'max-height:'+mh+'px':'';
  return '<div class="cw"><div class="ch"><span class="lb">'+(label||lang)+'</span><button class="cpb" onclick="docp(\''+id+'\',this)">Copy</button></div><pre id="'+id+'" style="'+style+'">'+body+'</pre></div>';
}
function docp(id,btn){
  navigator.clipboard.writeText(document.getElementById(id).textContent).then(()=>{
    btn.textContent='Copied!';btn.classList.add('ok');
    setTimeout(()=>{btn.textContent='Copy';btn.classList.remove('ok');},1800);
  });
}

S.push({h:`
<div class="ey">M10 · What is Node.js</div>
<div class="ttl">JavaScript, Everywhere</div>
<hr class="rule"/>
<div class="cnt">
  <div class="g2" style="margin-bottom:2px">
    <div class="card">
      <h3>The One-Line Definition</h3>
      <p style="font-size:15.5px;line-height:1.7;margin-bottom:10px">Node.js is an <strong style="color:var(--txt)">open-source, cross-platform JavaScript runtime</strong> built on Chrome's V8 engine. It lets you run JavaScript <em>outside</em> the browser — on a server, your laptop, a Raspberry Pi.</p>

          Node.js
        </div>

    </div>
    <div class="card">
      <h3>Before vs After Node.js</h3>
      <table>
        <tr><th></th><th>Before Node.js</th><th>With Node.js</th></tr>
        <tr><td>Front-end</td><td>JavaScript</td><td style="color:var(--grn)">JavaScript</td></tr>
        <tr><td>Back-end</td><td>PHP / Java / Ruby</td><td style="color:var(--grn)">JavaScript</td></tr>
        <tr><td>Context switch</td><td style="color:var(--rose)">High — two languages</td><td style="color:var(--grn)">Zero — same language</td></tr>
        <tr><td>Code reuse</td><td style="color:var(--rose)">Hard</td><td style="color:var(--grn)">Easy</td></tr>

  <div class="g2" style="flex:1">
    <div class="card"><h3>How V8 Fits In</h3>

S.push({h:`
<div class="ey">M10 · Architecture</div>
<div class="ttl">Blocking vs Non-Blocking I/O</div>
<hr class="rule"/>
<div class="cnt">
  <div class="cmp" style="margin-bottom:4px">
    <div class="cmp-box old">
      <h4>❌ Traditional Servers (Blocking)</h4>
      <p style="margin-bottom:8px">PHP · Java · Ruby on Rails</p>
      <ol style="padding-left:16px;font-size:14px;color:var(--txt3);line-height:2">
        <li>Request arrives</li>
        <li>Thread assigned to handle it</li>
        <li>Thread <strong style="color:var(--rose)">waits</strong> while file/DB reads</li>
        <li>Response sent, thread released</li>
        <li>Next request needs its own thread</li>
      </ol>
      <p style="margin-top:9px;font-size:13px;color:var(--rose)">1000 users = 1000 threads = high memory</p>
    </div>
    <div class="cmp-box new">
      <h4>✅ Node.js (Non-Blocking)</h4>
      <p style="margin-bottom:8px">Single thread · Event Loop</p>
      <ol style="padding-left:16px;font-size:14px;color:var(--txt3);line-height:2">
        <li>Request arrives</li>
        <li>I/O operation kicked off to OS</li>
        <li>Node <strong style="color:var(--grn)">immediately</strong> handles next request</li>
        <li>OS signals when I/O is done</li>
        <li>Callback fires — response sent</li>
      </ol>
      <p style="margin-top:9px;font-size:13px;color:var(--grn)">1000 users = 1 thread + event loop = low memory</p>
    </div>
  </div>
  <div class="sp" style="flex:1">
    <div class="card f1">
      <h3>The Analogy</h3>
      <p style="margin-bottom:8px;font-size:14.5px;line-height:1.65"><strong style="color:var(--txt)">Blocking (old server):</strong> A single waiter takes your order, walks to the kitchen, <em>stands there watching the chef cook</em>, then walks back to serve you. Only then does he take the next table's order.</p>
      <p style="font-size:14.5px;line-height:1.65"><strong style="color:var(--node)">Non-blocking (Node.js):</strong> A single waiter takes your order, passes it to the kitchen, <em>immediately</em> goes to the next table. When the kitchen rings the bell, he picks up and serves. One waiter, many tables, all moving.</p>
    </div>
    <div class="col f1">
      <div class="card"><h3>What is I/O?</h3>
        <p style="font-size:14px;line-height:1.65">Input/Output operations are anything that <em>waits on an external resource</em>: reading a file, querying a database, making an HTTP request. These are <strong style="color:var(--txt)">slow compared to CPU calculations</strong> — non-blocking I/O avoids wasting time waiting.</p>
      </div>
      <div class="card"><h3>When Blocking IS Fine</h3>
        <p style="font-size:14px;line-height:1.65">CPU-heavy tasks — image processing, video encoding, large calculations — don't benefit from non-blocking I/O because the CPU itself is the bottleneck, not waiting. Node has <ic>worker_threads</ic> for those cases.</p>
      </div>
    </div>
  </div>
</div>`});

S.push({h:`
<div class="ey">M10 · How Node Works</div>
<div class="ttl">The Event Loop</div>
<hr class="rule"/>
<div class="cnt">
  <div class="sp" style="flex:1">
    <div>
      <div class="card" style="flex-shrink:0;margin-bottom:0"><h3>Execution Order — Code Demo</h3></div>
      ${cw(`// event-loop-demo.js
console.log('1 — sync start');

setTimeout(() => {
  console.log('4 — setTimeout (timers phase)');
}, 0);

Promise.resolve().then(() => {
  console.log('3 — Promise microtask');
});

process.nextTick(() => {
  console.log('2 — nextTick (highest priority)');
});

console.log('5 — sync end... wait, not 5?');

// Actual output:
// 1 — sync start
// 5 — sync end... wait, not 5?
// 2 — nextTick
// 3 — Promise microtask
// 4 — setTimeout`,'js','event-loop-demo.js',220)}
    </div>
    <div>
      <div class="card" style="flex-shrink:0;margin-bottom:0"><h3>The 4-Phase Cheat Sheet</h3></div>
      <div class="bd f1">
        <div class="bi"><div class="bl">1. Call Stack</div><div class="bt">Synchronous JS runs first, completely. The event loop doesn't touch async until the stack is <strong>empty</strong>.</div></div>
        <div class="bi c"><div class="bl c">2. nextTick / Microtasks</div><div class="bt">After each stack frame: <ic>process.nextTick()</ic> fires first, then <ic>Promise.then()</ic>. Both run before any I/O or timers.</div></div>
        <div class="bi a"><div class="bl">3. Timers</div><div class="bt"><ic>setTimeout</ic> and <ic>setInterval</ic> callbacks. Even <ic>setTimeout(fn, 0)</ic> waits until after microtasks.</div></div>
        <div class="bi g"><div class="bl">4. I/O → Check → Close</div><div class="bt">File reads, network — then <ic>setImmediate()</ic> — then stream close events. The loop keeps spinning until nothing is pending.</div></div>
      </div>
      <div class="card" style="flex-shrink:0"><h3>Why This Matters</h3>
        <p style="font-size:13.5px;line-height:1.62">Understanding this order prevents bugs where you assume a callback has already run when you try to use its result. UI bugs, race conditions, and stale data almost always come from misjudging event loop order.</p>
      </div>
    </div>
  </div>
</div>`});

// ── ENGINE ─────────────────────────────────────────────────────────────
let cur=0;
const deck=document.getElementById('deck');
const bar=document.getElementById('bar');
const ctr=document.getElementById('ctr');
function build(){
  S.forEach((s,i)=>{
    const el=document.createElement('div');
    el.className='slide'+(s.cls?' '+s.cls:'');
    el.innerHTML=s.h||'';
    if(i===0)el.classList.add('active');
    deck.appendChild(el);
    if(s.init)s.init(el);
  });
}
function go(n){
  if(n<0||n>=S.length||n===cur)return;
  const els=deck.querySelectorAll('.slide');
  const fwd=n>cur;
  els[cur].classList.remove('active');
  els[cur].classList.add(fwd?'ol':'or');
  setTimeout(()=>els[cur].classList.remove('ol','or'),420);
  cur=n;els[cur].classList.add('active');els[cur].scrollTop=0;tick();
}
function tick(){
  bar.style.width=(S.length>1?(cur/(S.length-1)*100):100)+'%';
  ctr.textContent=(cur+1)+' / '+S.length;
}
document.addEventListener('keydown',e=>{
  const m=document.getElementById('mod');
  if(m.classList.contains('open')){if(e.key==='Escape')m.classList.remove('open');return;}
  const t=document.activeElement.tagName;
  if(t==='INPUT'||t==='TEXTAREA')return;
  if(e.key==='ArrowRight'||e.key==='ArrowDown')go(cur+1);
  else if(e.key==='ArrowLeft'||e.key==='ArrowUp')go(cur-1);
  else if(e.key==='Home')go(0);
  else if(e.key==='End')go(S.length-1);
  else if(e.key==='?')m.classList.add('open');
  else if(e.key==='Escape')m.classList.remove('open');
});
document.addEventListener('mousedown',e=>{
  if(e.target.closest('button,input,a,.mc-o,.gto-ta'))return;
  if(e.button===2){e.preventDefault();e.stopImmediatePropagation();go(cur+1);}
  else if(e.button===3){e.preventDefault();e.stopImmediatePropagation();go(cur-1);}
  else if(e.button===4){e.preventDefault();e.stopImmediatePropagation();go(cur+1);}
},true);
document.addEventListener('contextmenu',e=>{
  if(e.target.closest('button,input,a'))return;
  e.preventDefault();e.stopImmediatePropagation();
},true);
document.addEventListener('auxclick',e=>{
  if(e.button===3||e.button===4){e.preventDefault();e.stopImmediatePropagation();}
},true);
let tx=0;
document.addEventListener('touchstart',e=>tx=e.touches[0].clientX,{passive:true});
document.addEventListener('touchend',e=>{const d=e.changedTouches[0].clientX-tx;if(Math.abs(d)>50){d<0?go(cur+1):go(cur-1);}},{passive:true});
build();tick();
</script>
