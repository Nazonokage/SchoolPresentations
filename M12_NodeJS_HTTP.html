// ── TOKENIZER ─────────────────────────────────────────────────────────
function hl(raw){
  const KW=/^(const|let|var|function|return|async|await|try|catch|throw|new|class|if|else|for|while|require|module|true|false|null|undefined)\b/;
  const TY=/^(console|process|http|fs|path|os|JSON|Math|Promise|Error|Buffer)\b/;
  const NUM=/^\b\d+(\.\d+)?\b/;
  function e(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
  let i=0,o='';
  while(i<raw.length){
    if(raw[i]==='/'&&raw[i+1]==='/'){const end=raw.indexOf('\n',i);const ch=end<0?raw.slice(i):raw.slice(i,end);o+='<span class="cm">'+e(ch)+'</span>';i+=ch.length;continue;}
    if(raw[i]==='`'){let j=i+1;while(j<raw.length&&raw[j]!=='`'){if(raw[j]==='\\')j++;j++;}o+='<span class="s">'+e(raw.slice(i,j+1))+'</span>';i=j+1;continue;}
    if(raw[i]==="'"){let j=i+1;while(j<raw.length&&raw[j]!=="'"&&raw[j]!=='\n'){if(raw[j]==='\\')j++;j++;}o+='<span class="s">'+e(raw.slice(i,j+1))+'</span>';i=j+1;continue;}
    if(raw[i]==='"'){let j=i+1;while(j<raw.length&&raw[j]!=='"'&&raw[j]!=='\n'){if(raw[j]==='\\')j++;j++;}o+='<span class="s">'+e(raw.slice(i,j+1))+'</span>';i=j+1;continue;}
    const rest=raw.slice(i);let m;
    if((m=rest.match(KW))){o+='<span class="k">'+m[0]+'</span>';i+=m[0].length;continue;}
    if((m=rest.match(TY))){o+='<span class="tp">'+m[0]+'</span>';i+=m[0].length;continue;}
    if((m=rest.match(NUM))){o+='<span class="n">'+m[0]+'</span>';i+=m[0].length;continue;}
    o+=e(raw[i]);i++;
  }
  return o;
}
function cw(code,lang,label){
  const id='c'+Math.random().toString(36).slice(2);
  const body=(lang==='js'||lang==='bash')?hl(code):code.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  return '<div class="cw"><div class="ch"><span class="lb">'+(label||lang)+'</span><button class="cpb" onclick="docp(\''+id+'\',this)">Copy</button></div><pre id="'+id+'">'+body+'</pre></div>';
}
function docp(id,btn){
  navigator.clipboard.writeText(document.getElementById(id).textContent).then(()=>{
    btn.textContent='Copied!';btn.classList.add('ok');
    setTimeout(()=>{btn.textContent='Copy';btn.classList.remove('ok');},1800);
  });
}

<div class="cnt">
  <div class="g4" style="margin-bottom:6px">

S.push({h:`
<div class="ey">Analogies &amp; Use Cases</div>

<div class="cnt">
  <div class="g2" style="flex:1">
    <div class="col">
      <div class="card f1"><h3>🏢 The Reception Desk</h3>
        <p>Your Node.js server is a receptionist at a busy office. The phone (port 3000) rings — that's an incoming request. The receptionist picks up (<ic>req</ic>), listens to what the caller wants, and gives a reply (<ic>res</ic>). Because they're not tied to any one caller for long (non-blocking), they can handle hundreds of calls without anyone waiting on hold.</p>
      </div>
      <div class="card f1"><h3>📮 Envelopes and Letters</h3>
        <p>The request/response cycle is like mail. <ic>req.headers</ic> is the envelope — return address, postmark, priority markings. <ic>res.setHeader</ic> is you writing on the response envelope. <ic>res.end('text')</ic> is putting the letter inside and dropping it in the mailbox. If you forget to drop it in (no <ic>res.end</ic>), the recipient waits forever.</p>
      </div>
      <div class="card f1"><h3>🚦 Status Codes as Traffic Lights</h3>
        <p>200 is green — proceed, everything's fine. 301 is a detour sign — go somewhere else. 404 is a road-closed sign — the address you asked for doesn't exist. 500 is a broken traffic light — <em>my</em> intersection is malfunctioning, not yours. The number tells the browser exactly how to react.</p>
      </div>
    </div>
    <div class="col">
      <div class="card f1"><h3>🌐 Real-World Uses for the http Module</h3>
        <p style="margin-bottom:8px">You'll almost always use <strong style="color:var(--txt)">Express</strong> in production, but knowing raw <ic>http</ic> matters because Express is just a wrapper on top of it. What you can build with raw <ic>http</ic>:</p>
        <ul>
          <li><strong style="color:var(--txt)">REST APIs</strong> — handle GET/POST/PUT/DELETE routes for a frontend to consume</li>
          <li><strong style="color:var(--txt)">Static file server</strong> — read HTML/CSS/JS from disk and serve them (like a mini web host)</li>
          <li><strong style="color:var(--txt)">Simple proxy</strong> — a server that forwards requests to another API, adding caching or auth</li>
          <li><strong style="color:var(--txt)">Webhook receiver</strong> — a URL that GitHub/Stripe/Discord can POST to when events happen</li>
        </ul>
      </div>
      <div class="card f1"><h3>🧱 Why Learn the Raw Version?</h3>
        <p>Frameworks hide complexity. That's great — until something breaks. Every developer who understands the raw <ic>http</ic> module can debug <em>any</em> Express or Fastify issue, because they know what's actually happening underneath. Frameworks age; the fundamentals don't.</p>
      </div>
    </div>
  </div>
</div>`});

// ── ENGINE ─────────────────────────────────────────────────────────────
let cur=0;
const deck=document.getElementById('deck');
const bar=document.getElementById('bar');
const ctr=document.getElementById('ctr');
function build(){
  S.forEach((s,i)=>{
    const el=document.createElement('div');
    el.className='slide'+(s.cls?' '+s.cls:'');
    el.innerHTML=s.h||'';
    if(i===0)el.classList.add('active');
    deck.appendChild(el);
    if(s.init)s.init(el);
  });
}
function go(n){
  if(n<0||n>=S.length||n===cur)return;
  const els=deck.querySelectorAll('.slide');
  const fwd=n>cur;
  els[cur].classList.remove('active');
  els[cur].classList.add(fwd?'ol':'or');
  setTimeout(()=>els[cur].classList.remove('ol','or'),420);
  cur=n;els[cur].classList.add('active');els[cur].scrollTop=0;tick();
}
function tick(){
  bar.style.width=(S.length>1?(cur/(S.length-1)*100):100)+'%';
  ctr.textContent=(cur+1)+' / '+S.length;
}
document.addEventListener('keydown',e=>{
  const m=document.getElementById('mod');
  if(m.classList.contains('open')){if(e.key==='Escape')m.classList.remove('open');return;}
  const t=document.activeElement.tagName;
  if(t==='INPUT'||t==='TEXTAREA')return;
  if(e.key==='ArrowRight'||e.key==='ArrowDown')go(cur+1);
  else if(e.key==='ArrowLeft'||e.key==='ArrowUp')go(cur-1);
  else if(e.key==='Home')go(0);
  else if(e.key==='End')go(S.length-1);
  else if(e.key==='?')m.classList.add('open');
  else if(e.key==='Escape')m.classList.remove('open');
});
document.addEventListener('mousedown',e=>{
  if(e.target.closest('button,input,a,.mc-o'))return;
  if(e.button===2){e.preventDefault();e.stopImmediatePropagation();go(cur+1);}
  else if(e.button===3){e.preventDefault();e.stopImmediatePropagation();go(cur-1);}
  else if(e.button===4){e.preventDefault();e.stopImmediatePropagation();go(cur+1);}
},true);
document.addEventListener('contextmenu',e=>{
  if(e.target.closest('button,input,a'))return;
  e.preventDefault();e.stopImmediatePropagation();
},true);
document.addEventListener('auxclick',e=>{
  if(e.button===3||e.button===4){e.preventDefault();e.stopImmediatePropagation();}
},true);
let tx=0;
document.addEventListener('touchstart',e=>tx=e.touches[0].clientX,{passive:true});
document.addEventListener('touchend',e=>{const d=e.changedTouches[0].clientX-tx;if(Math.abs(d)>50){d<0?go(cur+1):go(cur-1);}},{passive:true});
build();tick();
</script>
