<div id="bar"></div><div id="ctr"></div><div id="deck"></div>

<script>
function hl(raw){const KW=/^(const|let|var|function|return|async|await|try|catch|throw|new|class|extends|if|else|for|while|import|export|default|from|of|in|true|false|null|undefined|void|switch|case|break|typeof|instanceof|this)\b/;const TY=/^(React|useState|useEffect|axios|console|document|JSON|Array|Object|Math|Promise|Error|window|localStorage)\b/;const NUM=/^\b\d+(\.\d+)?\b/;const FN=/^[a-zA-Z_$][\w$]*(?=\s*\()/;function e(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}let i=0,o='';while(i<raw.length){if(raw[i]==='/'&&raw[i+1]==='/'){const end=raw.indexOf('\n',i);const ch=end<0?raw.slice(i):raw.slice(i,end);o+='<span class="cm">'+e(ch)+'</span>';i+=ch.length;continue}if(raw[i]==='/'&&raw[i+1]==='*'){const end=raw.indexOf('*/',i+2);const ch=end<0?raw.slice(i):raw.slice(i,end+2);o+='<span class="cm">'+e(ch)+'</span>';i+=ch.length;continue}if(raw[i]==='`'){let j=i+1;while(j<raw.length&&raw[j]!=='`'){if(raw[j]==='\\')j++;j++}o+='<span class="s">'+e(raw.slice(i,j+1))+'</span>';i=j+1;continue}if(raw[i]==="'"){let j=i+1;while(j<raw.length&&raw[j]!=="'"&&raw[j]!=='\n'){if(raw[j]==='\\')j++;j++}o+='<span class="s">'+e(raw.slice(i,j+1))+'</span>';i=j+1;continue}if(raw[i]==='"'){let j=i+1;while(j<raw.length&&raw[j]!=='"'&&raw[j]!=='\n'){if(raw[j]==='\\')j++;j++}o+='<span class="s">'+e(raw.slice(i,j+1))+'</span>';i=j+1;continue}const rest=raw.slice(i);let m;if((m=rest.match(KW))){o+='<span class="k">'+m[0]+'</span>';i+=m[0].length;continue}if((m=rest.match(TY))){o+='<span class="t">'+m[0]+'</span>';i+=m[0].length;continue}if((m=rest.match(NUM))){o+='<span class="n">'+m[0]+'</span>';i+=m[0].length;continue}if((m=rest.match(FN))){o+='<span class="f">'+m[0]+'</span>';i+=m[0].length;continue}o+=e(raw[i]);i++}return o}
function cw(code,lang,label){const id='c'+Math.random().toString(36).slice(2);const body=(lang==='jsx'||lang==='js')?hl(code):code.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');return '<div class="cw"><div class="cl"><span>'+(label||lang)+'</span><button class="cpbtn" onclick="doCopy(\''+id+'\',this)">Copy</button></div><pre id="'+id+'">'+body+'</pre></div>'}
function doCopy(id,btn){navigator.clipboard.writeText(document.getElementById(id).textContent).then(()=>{btn.textContent='Copied!';btn.classList.add('ok');setTimeout(()=>{btn.textContent='Copy';btn.classList.remove('ok')},1800)})}
const S=[];
S.push({cls:'hero-bg',h:`<div class="dots"></div><div style="flex:1;display:flex;flex-direction:column;justify-content:center;position:relative"><div class="eyebrow" style="margin-bottom:16px">Web Systems · Module 16</div><div class="hero-title"><div class="h1c">Connecting React</div><div class="h2c">to Express Backend</div></div><div class="hero-sub">Full-stack MERN client-server wiring — Vite env vars, Axios interceptors, Bearer injection, and automated 401 logouts.</div><div><span class="pill a">import.meta.env</span><span class="pill g">Axios Interceptors</span><span class="pill a">Bearer Token</span><span class="pill g">401 Auto-Logout</span></div></div>`});
S.push({h:`<div class="eyebrow">Where We Left Off</div><div class="slide-title">M15 → M16: From Client Guards to Full-Stack Integration</div><hr class="rule"/><div class="content"><div class="ba"><div class="ba-box bad"><h4>Isolated Client</h4><ul><li>Hardcoded API base URLs across components</li><li>Manually attaching Authorization on every fetch</li><li>No automated handling of HTTP 401</li><li>Breaks when deploying to staging/production</li></ul></div><div class="ba-box good"><h4>Full-Stack Integration</h4><ul><li>Vite import.meta.env.VITE_API_URL</li><li>Centralized Axios client instance</li><li>Request interceptor injects Bearer token</li><li>Response interceptor handles 401 logout</li></ul></div></div><div class="card"><h3>The Throughline</h3><p>Frontend apps never hardcode server endpoints. They read config from environment variables and funnel network calls through a centralized API client with automatic interceptors.</p></div></div>`});
S.push({h:`<div class="eyebrow">Core Concept</div><div class="slide-title">Airport Control Tower and Automated Security</div><hr class="rule"/><div class="content split"><div class="col"><div class="card flex1" style="border-left:3px solid var(--accent)"><h3 style="color:var(--accent)">Control Tower Analogy</h3><p>The Axios client is the control tower. Every plane (request) gets a clearance (Bearer header) automatically. If the tower receives a 401 (denied), it grounds the session and redirects to login.</p></div></div><div class="col"><div class="card flex1" style="border-left:3px solid var(--accent2)"><h3>Key pieces</h3><p><ic>import.meta.env</ic> — Vite env<br/><ic>axios.create</ic> — shared client<br/><ic>request interceptor</ic> — inject token<br/><ic>response interceptor</ic> — 401 logout</p></div></div></div>`});
S.push({h:`<div class="eyebrow">What / How / Why</div><div class="slide-title">API Client Fundamentals</div><hr class="rule"/><div class="content g3"><div class="card"><h3>What It Is</h3><p>A single Axios instance that attaches auth headers and handles auth failures for every API call in the app.</p></div><div class="card"><h3>How It Works</h3><p>Read VITE_API_URL, create axios instance, register interceptors for request (Bearer) and response (401).</p></div><div class="card"><h3>Why It Matters</h3><p>One place to change base URL or auth logic. No duplicated headers. Auto-logout on expired tokens.</p></div></div>`});
S.push({h:`<div class="eyebrow">Code Implementation</div><div class="slide-title">Centralized Axios Client</div><hr class="rule"/><div class="content">${cw(`import axios from 'axios';

const api = axios.create({
  baseURL: import.meta.env.VITE_API_URL,
});

// Request: inject Bearer token
api.interceptors.request.use((config) => {
  const token = localStorage.getItem('token');
  if (token) {
    config.headers.Authorization = \`Bearer \${token}\`;
  }
  return config;
});

// Response: catch 401 and logout
api.interceptors.response.use(
  (response) => response,
  (error) => {
    if (error.response && error.response.status === 401) {
      localStorage.removeItem('token');
      window.location.href = '/login';
    }
    return Promise.reject(error);
  }
);

export default api;`,'js','src/api/client.js')}</div>`});
S.push({h:`<div class="eyebrow">Code Implementation</div><div class="slide-title">Consuming the API in Components</div><hr class="rule"/><div class="content">${cw(`import { useState, useEffect } from 'react';
import api from '../api/client';

export function TaskBoard() {
  const [tasks, setTasks] = useState([]);
  const [title, setTitle] = useState('');

  useEffect(() => {
    api.get('/tasks')
      .then((res) => setTasks(res.data))
      .catch((err) => console.error(err));
  }, []);

  const handleCreate = async (e) => {
    e.preventDefault();
    const res = await api.post('/tasks', { title });
    setTasks((prev) => [...prev, res.data]);
    setTitle('');
  };

  return (
    <div>
      <form onSubmit={handleCreate}>
        <input value={title} onChange={(e) => setTitle(e.target.value)} />
        <button type="submit">Add Task</button>
      </form>
      <ul>{tasks.map((t) => <li key={t.id}>{t.title}</li>)}</ul>
    </div>
  );
}`,'jsx','src/components/TaskBoard.jsx')}</div>`});
S.push({h:`<div class="eyebrow">Common Pitfalls</div><div class="slide-title">Full-Stack Integration Mistakes</div><hr class="rule"/><div class="content"><div class="ba"><div class="ba-box bad"><h4>Using process.env in Vite</h4>${cw(`const url = process.env.VITE_API_URL; // ReferenceError!`,'js','Wrong')}<p style="margin-top:8px">process.env is Node-only. Not available in Vite browser bundles.</p></div><div class="ba-box good"><h4>Native Vite ESM Syntax</h4>${cw(`const url = import.meta.env.VITE_API_URL;`,'js','Correct')}<p style="margin-top:8px">Vite replaces import.meta.env at build time safely.</p></div></div></div>`});

let cur=0;const deck=document.getElementById('deck');const bar=document.getElementById('bar');const ctr=document.getElementById('ctr');
function build(){S.forEach((s,i)=>{const el=document.createElement('div');el.className='slide'+(s.cls?' '+s.cls:'');el.innerHTML=s.h||'';if(i===0)el.classList.add('active');deck.appendChild(el);if(s.init)s.init(el)})}
function go(n){if(n<0||n>=S.length||n===cur)return;const els=deck.querySelectorAll('.slide');const fwd=n>cur;els[cur].classList.remove('active');els[cur].classList.add(fwd?'out-l':'out-r');setTimeout(()=>els[cur].classList.remove('out-l','out-r'),420);cur=n;els[cur].classList.add('active');els[cur].scrollTop=0;tick()}
function tick(){bar.style.width=(S.length>1?(cur/(S.length-1)*100):100)+'%';ctr.textContent=(cur+1)+' / '+S.length}
document.addEventListener('keydown',e=>{const m=document.getElementById('modal');if(m.classList.contains('open')){if(e.key==='Escape')m.classList.remove('open');return}if(document.activeElement.tagName==='INPUT'||document.activeElement.tagName==='TEXTAREA')return;if(e.key==='ArrowRight'||e.key==='ArrowDown')go(cur+1);else if(e.key==='ArrowLeft'||e.key==='ArrowUp')go(cur-1);else if(e.key==='Home')go(0);else if(e.key==='End')go(S.length-1);else if(e.key==='?')m.classList.add('open')});
document.addEventListener('mousedown',e=>{if(e.target.closest('button,input,a,.mc-opt,.gto-ta,textarea'))return;if(e.button===2){e.preventDefault();e.stopImmediatePropagation();go(cur+1)}else if(e.button===3){e.preventDefault();e.stopImmediatePropagation();go(cur-1)}else if(e.button===4){e.preventDefault();e.stopImmediatePropagation();go(cur+1)}},true);
document.addEventListener('contextmenu',e=>{if(e.target.closest('button,input,a'))return;e.preventDefault();e.stopImmediatePropagation()},true);
document.addEventListener('auxclick',e=>{if(e.button===3||e.button===4){e.preventDefault();e.stopImmediatePropagation()}},true);
build();tick();
</script>
