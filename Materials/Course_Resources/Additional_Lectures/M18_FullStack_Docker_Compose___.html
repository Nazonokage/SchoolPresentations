<title>M18 — Full-Stack Docker Compose Orchestration</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#07111F;--surface:#0C1A2E;--surface2:#132236;--border:#1A3050;--border2:#224070;
  --accent:#61DAFB;--accent2:#4ADE80;--accent3:#FB923C;--accent4:#C084FC;--accent5:#F472B6;
  --text:#FFFFFF;--text2:#B8D4F0;--text3:#E8F1FA;--card:#0B1828;--card2:#0F1F35;

  --r:10px;--r2:14px;--tr:350ms cubic-bezier(.4,0,.2,1);
}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:16px;-webkit-font-smoothing:antialiased}
#bar{position:fixed;top:0;left:0;height:3px;background:linear-gradient(90deg,var(--accent2),var(--accent4));transition:width .3s;z-index:100;border-radius:0 2px 2px 0}
#ctr{position:fixed;top:12px;right:18px;font-size:16px;color:var(--text2);z-index:100;font-variant-numeric:tabular-nums;letter-spacing:.5px;font-family:var(--mono)}
#deck{width:100%;height:100vh;position:relative;overflow:hidden}

.slide.active{opacity:1;pointer-events:all;transform:translateX(0)}
.slide.out-l{opacity:0;transform:translateX(-48px)}

.eyebrow::before{content:'';width:22px;height:2px;background:var(--accent2);border-radius:1px;display:inline-block}

.content{flex:1;display:flex;flex-direction:column;gap:14px;min-height:0}
.g2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}

.bd{display:flex;flex-direction:column;gap:8px}
.bdi{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;background:var(--surface);border:1px solid var(--border);border-radius:8px;border-left:3px solid var(--accent)}

.bdi.p{border-left-color:var(--accent4)}.bdi.r{border-left-color:var(--accent5)}
.bdl{font-family:var(--mono);font-size:16px;color:var(--accent);background:#040C18;padding:4px 10px;border-radius:4px;white-space:nowrap;min-width:fit-content;align-self:flex-start;margin-top:1px;flex-shrink:0}

.mc-q{font-size:16px;font-weight:600;color:var(--text);margin-bottom:10px;line-height:1.45}

.gto-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;flex:1;min-height:0}

.gto-ta{width:100%;min-height:48px;padding:8px 11px;background:var(--surface2);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:16px;font-family:var(--mono);outline:none;resize:none;line-height:1.45;transition:border .2s}

<div id="bar"></div>

<div id="modal">
  <div class="mbox">

    <div class="shr"><span>Next</span><span><kbd>→</kbd> or <kbd>Right-click</kbd></span></div>
    <div class="shr"><span>Prev</span><span><kbd>←</kbd></span></div>
    <div class="shr"><span>First / Last</span><span><kbd>Home</kbd> / <kbd>End</kbd></span></div>
    <div class="shr"><span>Shortcuts</span><span><kbd>?</kbd></span></div>
    <div class="shr"><span>Close</span><span><kbd>Esc</kbd></span></div>
    <button class="mcl" onclick="document.getElementById('modal').classList.remove('open')">Close</button>
  </div>
</div>
<script>
function hl(raw){
  const KW=/^(const|let|var|function|return|async|await|try|catch|throw|new|class|extends|if|else|for|while|import|export|default|from|of|in|true|false|null|undefined|void|version|services|build|ports|environment|depends_on|volumes|image|env_file)\b/;
  const TY=/^(React|ReactDOM|console|document|JSON|Array|Object|Math|Promise|Error)\b/;
  const NUM=/^\b\d+(\.\d+)?\b/;
  function e(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
  let i=0,o='';
  while(i<raw.length){
    if(raw[i]==='/'&&raw[i+1]==='/'){const end=raw.indexOf('\n',i);const ch=end<0?raw.slice(i):raw.slice(i,end);o+='<span class="cm">'+e(ch)+'</span>';i+=ch.length;continue;}
    if(raw[i]==='#'){const end=raw.indexOf('\n',i);const ch=end<0?raw.slice(i):raw.slice(i,end);o+='<span class="cm">'+e(ch)+'</span>';i+=ch.length;continue;}
    if(raw[i]==='`'){let j=i+1;while(j<raw.length&&raw[j]!=='`'){if(raw[j]==='\\')j++;j++;}o+='<span class="s">'+e(raw.slice(i,j+1))+'</span>';i=j+1;continue;}
    if(raw[i]==="'"){let j=i+1;while(j<raw.length&&raw[j]!=="'"&&raw[j]!=='\n'){if(raw[j]==='\\')j++;j++;}o+='<span class="s">'+e(raw.slice(i,j+1))+'</span>';i=j+1;continue;}
    if(raw[i]==='"'){let j=i+1;while(j<raw.length&&raw[j]!=='"'&&raw[j]!=='\n'){if(raw[j]==='\\')j++;j++;}o+='<span class="s">'+e(raw.slice(i,j+1))+'</span>';i=j+1;continue;}
    const rest=raw.slice(i);let m;
    if((m=rest.match(KW))){o+='<span class="k">'+m[0]+'</span>';i+=m[0].length;continue;}
    if((m=rest.match(TY))){o+='<span class="t">'+m[0]+'</span>';i+=m[0].length;continue;}
    if((m=rest.match(NUM))){o+='<span class="n">'+m[0]+'</span>';i+=m[0].length;continue;}
    o+=e(raw[i]);i++;
  }
  return o;
}
function cw(code,lang,label){
  const id='c'+Math.random().toString(36).slice(2);
  const body=(lang==='yaml'||lang==='js'||lang==='jsx')?hl(code):code.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  return '<div class="cw"><div class="cl"><span>'+(label||lang)+'</span><button class="cpbtn" onclick="doCopy(\''+id+'\',this)">Copy</button></div><pre id="'+id+'">'+body+'</pre></div>';
}
function doCopy(id,btn){
  navigator.clipboard.writeText(document.getElementById(id).textContent).then(()=>{
    btn.textContent='Copied!';btn.classList.add('ok');
    setTimeout(()=>{btn.textContent='Copy';btn.classList.remove('ok');},1800);
  });
}

<div class="eyebrow">Core Concept &amp; System Analogy</div>
<div class="slide-title">The Symphony Orchestra Conductor</div>
<hr class="rule"/>
<div class="content split">
  <div class="col">
    <div class="card flex1" style="border-left:3px solid var(--accent2)">
      <h3 style="color:var(--accent2)">The Orchestra Conductor Analogy</h3>
      <p>Imagine your containers are individual orchestra musicians (Violin = React UI, Cello = Express API, Drums = MongoDB). <ic>docker-compose.yml</ic> is the Symphony Conductor standing on stage.</p>
      <ul style="margin-top:10px">
        <li><strong>Without Conductor:</strong> Musicians play out of tempo, starting and stopping randomly without cues (database connection crashes).</li>
        <li><strong>With Conductor (<ic>docker-compose.yml</ic>):</strong> Gives the exact entry signal (<ic>depends_on</ic>), tunes instruments to the same key (bridge network), and starts the entire symphony in perfect unison (<ic>docker-compose up</ic>)!</li>
      </ul>
    </div>

let cur=0;
const deck=document.getElementById('deck');
const bar=document.getElementById('bar');
const ctr=document.getElementById('ctr');

function build(){
  S.forEach((s,i)=>{
    const el=document.createElement('div');
    el.className='slide'+(s.cls?' '+s.cls:'');
    el.innerHTML=s.h||'';
    if(i===0)el.classList.add('active');
    deck.appendChild(el);
    if(s.init)s.init(el);
  });
}
function go(n){
  if(n<0||n>=S.length||n===cur)return;
  const els=deck.querySelectorAll('.slide');
  const fwd=n>cur;
  els[cur].classList.remove('active');
  els[cur].classList.add(fwd?'out-l':'out-r');
  setTimeout(()=>els[cur].classList.remove('out-l','out-r'),420);
  cur=n;els[cur].classList.add('active');els[cur].scrollTop=0;tick();
}
function tick(){
  bar.style.width=(S.length>1?(cur/(S.length-1)*100):100)+'%';
  ctr.textContent=(cur+1)+' / '+S.length;
}
document.addEventListener('keydown',e=>{
  const m=document.getElementById('modal');
  if(m.classList.contains('open')){if(e.key==='Escape')m.classList.remove('open');return;}
  const t=document.activeElement.tagName;
  if(t==='INPUT'||t==='TEXTAREA')return;
  if(e.key==='ArrowRight'||e.key==='ArrowDown')go(cur+1);
  else if(e.key==='ArrowLeft'||e.key==='ArrowUp')go(cur-1);
  else if(e.key==='Home')go(0);
  else if(e.key==='End')go(S.length-1);
  else if(e.key==='?')m.classList.add('open');
  else if(e.key==='Escape')m.classList.remove('open');
});
document.addEventListener('mousedown',e=>{
  if(e.target.closest('button,input,a,.mc-opt,.gto-ta,.id-ans'))return;
  if(e.button===2){e.preventDefault();e.stopImmediatePropagation();go(cur+1);}
  else if(e.button===3){e.preventDefault();e.stopImmediatePropagation();go(cur-1);}
  else if(e.button===4){e.preventDefault();e.stopImmediatePropagation();go(cur+1);}
},true);
document.addEventListener('contextmenu',e=>{
  if(e.target.closest('button,input,a'))return;
  e.preventDefault();e.stopImmediatePropagation();
},true);
document.addEventListener('auxclick',e=>{
  if(e.button===3||e.button===4){e.preventDefault();e.stopImmediatePropagation();}
},true);
build();tick();
</script>
</body>
</html>
