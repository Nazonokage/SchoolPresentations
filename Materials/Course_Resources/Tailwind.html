<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Positioning Practice</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-cyan-400 h-screen">

  <!--
    This outer container is the "playground".
    It's set to `relative` so the box inside can be
    positioned `absolute` relative to IT (not the whole page).
  -->
  <div class="relative w-full h-screen border-4 border-dashed border-gray-400">


    <div class="absolute bottom-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2
                w-32 h-32 bg-blue-500 rounded-xl shadow-lg
                flex items-center justify-center text-white font-bold pentagon">
      My object
    </div>



  </div>

</body>


</html>
