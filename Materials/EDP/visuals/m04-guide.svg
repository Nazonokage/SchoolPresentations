<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" role="img" aria-labelledby="title desc"><title id="title">One event, several listeners</title><desc id="desc">Order created then Invoice listener then Kitchen listener then Dispose listeners. Invoice and kitchen both react; the arrows here show reading order, not an async queue.</desc><rect width="1200" height="380" rx="24" fill="#0d1626"/><text x="40" y="60" fill="#e8f2ff" font-family="Segoe UI, sans-serif" font-size="32">M04: One event, several listeners</text><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#5eead4"/></marker></defs><path d="M300,190 L422,150" stroke="#5eead4" stroke-width="3" marker-end="url(#arrow)"/><path d="M300,190 L422,270" stroke="#5eead4" stroke-width="3" marker-end="url(#arrow)"/><path d="M690,150 L842,210" stroke="#5eead4" stroke-width="3" marker-end="url(#arrow)"/><path d="M690,270 L842,210" stroke="#5eead4" stroke-width="3" marker-end="url(#arrow)"/><rect x="40" y="145" width="260" height="90" rx="14" fill="#1b2d45" stroke="#5eead4"/><text x="170" y="197" text-anchor="middle" fill="#f1f5f9" font-family="Segoe UI, sans-serif" font-size="23">Order created</text><rect x="430" y="105" width="260" height="90" rx="14" fill="#1b2d45" stroke="#5eead4"/><text x="560" y="157" text-anchor="middle" fill="#f1f5f9" font-family="Segoe UI, sans-serif" font-size="23">Invoice listener</text><rect x="430" y="225" width="260" height="90" rx="14" fill="#1b2d45" stroke="#5eead4"/><text x="560" y="277" text-anchor="middle" fill="#f1f5f9" font-family="Segoe UI, sans-serif" font-size="23">Kitchen listener</text><rect x="850" y="165" width="260" height="90" rx="14" fill="#1b2d45" stroke="#5eead4"/><text x="980" y="217" text-anchor="middle" fill="#f1f5f9" font-family="Segoe UI, sans-serif" font-size="23">Dispose listeners</text><text x="40" y="345" fill="#bfcee1" font-family="Segoe UI, sans-serif" font-size="20">Read with the module explanation; local teaching model.</text></svg>