<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" role="img" aria-labelledby="title desc"><title id="title">Reliable consumer</title><desc id="desc">Receive ID then Check duplicate then Apply effect then Ack or retry. Real deduplication and the business change need an atomic durable boundary; this model is in memory.</desc><rect width="1200" height="380" rx="24" fill="#0d1626"/><text x="40" y="60" fill="#e8f2ff" font-family="Segoe UI, sans-serif" font-size="32">M13: Reliable consumer</text><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#5eead4"/></marker></defs><path d="M300,190 L322,190" stroke="#5eead4" stroke-width="3" marker-end="url(#arrow)"/><path d="M590,190 L612,190" stroke="#5eead4" stroke-width="3" marker-end="url(#arrow)"/><path d="M880,190 L902,190" stroke="#5eead4" stroke-width="3" marker-end="url(#arrow)"/><rect x="40" y="145" width="260" height="90" rx="14" fill="#1b2d45" stroke="#5eead4"/><text x="170" y="197" text-anchor="middle" fill="#f1f5f9" font-family="Segoe UI, sans-serif" font-size="23">Receive ID</text><rect x="330" y="145" width="260" height="90" rx="14" fill="#1b2d45" stroke="#5eead4"/><text x="460" y="197" text-anchor="middle" fill="#f1f5f9" font-family="Segoe UI, sans-serif" font-size="23">Check duplicate</text><rect x="620" y="145" width="260" height="90" rx="14" fill="#1b2d45" stroke="#5eead4"/><text x="750" y="197" text-anchor="middle" fill="#f1f5f9" font-family="Segoe UI, sans-serif" font-size="23">Apply effect</text><rect x="910" y="145" width="260" height="90" rx="14" fill="#1b2d45" stroke="#5eead4"/><text x="1040" y="197" text-anchor="middle" fill="#f1f5f9" font-family="Segoe UI, sans-serif" font-size="23">Ack or retry</text><text x="40" y="345" fill="#bfcee1" font-family="Segoe UI, sans-serif" font-size="20">Read with the module explanation; local teaching model.</text></svg>