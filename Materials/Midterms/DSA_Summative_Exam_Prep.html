<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>DSA — Summative Exam Prep</title>
<style>
:root{
  --bg:#07080d;
  --surface:#0f1218;
  --surface2:#161c26;
  --border:#232d3f;
  --text:#e8edf5;
  --muted:#6b7a96;
  --accent:#6ee7b7;   /* mint-green — data */
  --accent2:#818cf8;  /* indigo — pointers / logic */
  --accent3:#fb923c;  /* amber — stacks */
  --accent4:#38bdf8;  /* sky — queues */
  --accent5:#f472b6;  /* pink — ID questions */
  --accent6:#facc15;  /* yellow — Big O */
  --red:#fb7185;
  --radius:14px;
  --mono:'SF Mono','Cascadia Code','Consolas',monospace;
  --sans:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  --dur:350ms;
}
@media(prefers-reduced-motion:reduce){:root{--dur:1ms;}}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:var(--sans);overflow:hidden;}
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(ellipse 900px 600px at 10% 0%,rgba(110,231,183,.055),transparent 60%),
    radial-gradient(ellipse 700px 500px at 90% 100%,rgba(129,140,248,.05),transparent 60%);
}
/* grid bg */
#deck{
  position:fixed;inset:0;z-index:1;
  background-image:linear-gradient(rgba(255,255,255,.028) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.028) 1px,transparent 1px);
  background-size:48px 48px;
}
/* progress */
#prog-track{position:fixed;top:0;left:0;right:0;height:4px;background:rgba(255,255,255,.05);z-index:200;}
#prog-bar{height:100%;width:0%;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width var(--dur) ease;}
#counter{
  position:fixed;bottom:18px;right:22px;z-index:200;
  font-family:var(--mono);font-size:17px;color:var(--accent);
  background:rgba(15,18,24,.9);border:1px solid var(--border);
  padding:7px 14px;border-radius:8px;letter-spacing:.03em;
}
#counter b{color:var(--text);}
#hint-btn{
  position:fixed;bottom:18px;left:22px;z-index:200;
  width:36px;height:36px;border-radius:50%;
  background:rgba(15,18,24,.9);border:1px solid var(--border);
  color:var(--muted);font-size:17px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;font-weight:700;
  transition:color .2s,border-color .2s;
}
#hint-btn:hover{color:var(--accent6);border-color:var(--accent6);}
/* overlay */
#overlay{
  position:fixed;inset:0;z-index:300;
  background:rgba(0,0,0,.82);backdrop-filter:blur(8px);
  display:none;align-items:center;justify-content:center;
}
#overlay.show{display:flex;}
#overlay-box{
  background:var(--surface2);border:1px solid var(--border);border-radius:20px;
  padding:38px 44px;max-width:480px;width:90%;
}
#overlay-box h3{font-size:22px;margin-bottom:22px;color:var(--accent);}
#overlay-box .row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--border);}
#overlay-box .row:last-child{border:none;}
#overlay-box .key{
  font-family:var(--mono);font-size:16px;
  background:var(--surface);border:1px solid var(--border);border-radius:6px;
  padding:5px 11px;color:var(--accent2);
}
#overlay-box .desc{font-size:17px;color:var(--muted);}
#overlay-close{
  margin-top:24px;width:100%;padding:11px;
  background:rgba(110,231,183,.12);border:1px solid rgba(110,231,183,.3);
  color:var(--accent);border-radius:10px;font-size:17px;cursor:pointer;font-family:var(--sans);
  transition:background .2s;
}
#overlay-close:hover{background:rgba(110,231,183,.2);}
/* slides */
.stage{position:fixed;inset:0;z-index:10;}
.slide{
  position:absolute;inset:0;
  display:flex;align-items:center;justify-content:center;
  padding:5vh 7vw;
  opacity:0;visibility:hidden;transform:translateX(28px);
  transition:opacity var(--dur) ease,transform var(--dur) ease;
  pointer-events:none;
}
.slide.active{opacity:1;visibility:visible;transform:translateX(0);pointer-events:auto;}
.slide.prev-dir{transform:translateX(-28px);}
.slide-inner{width:100%;max-width:1200px;max-height:90vh;overflow-y:auto;padding-right:4px;}
.slide-inner::-webkit-scrollbar{width:5px;}
.slide-inner::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px;}
/* typography */
.eyebrow{
  display:inline-flex;align-items:center;gap:10px;
  font-family:var(--mono);font-size:13px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--accent);font-weight:600;margin-bottom:16px;
}
.eyebrow .dash{width:20px;height:1px;background:var(--accent);opacity:.6;}
h1.title{font-size:clamp(30px,4.5vw,56px);line-height:1.08;font-weight:900;letter-spacing:-.02em;margin-bottom:14px;}
h2.title{font-size:clamp(24px,3vw,40px);line-height:1.12;font-weight:800;letter-spacing:-.015em;margin-bottom:14px;}
.lede{font-size:clamp(16px,1.3vw,20px);color:var(--muted);line-height:1.65;margin-bottom:22px;}
/* grid helpers */
.g2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;}
.g4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;}
/* cards */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px 22px;}
.card h3{font-size:18px;font-weight:700;margin-bottom:8px;}
.card p,.card li{font-size:16px;color:var(--muted);line-height:1.6;}
.card ul{padding-left:18px;margin-top:6px;}
.card li{margin-bottom:6px;}
.card li::marker{color:var(--accent);}
/* colored borders */
.c-green{border-color:rgba(110,231,183,.35);}
.c-indigo{border-color:rgba(129,140,248,.35);}
.c-amber{border-color:rgba(251,146,60,.35);}
.c-sky{border-color:rgba(56,189,248,.35);}
.c-pink{border-color:rgba(244,114,182,.35);}
.c-yellow{border-color:rgba(250,204,21,.35);}
/* accent text */
.a1{color:var(--accent);}
.a2{color:var(--accent2);}
.a3{color:var(--accent3);}
.a4{color:var(--accent4);}
.a5{color:var(--accent5);}
.a6{color:var(--accent6);}
.ar{color:var(--red);}
/* badge */
.badge{
  display:inline-block;font-family:var(--mono);font-size:13px;font-weight:700;
  letter-spacing:.06em;text-transform:uppercase;
  padding:4px 11px;border-radius:999px;line-height:1;margin-bottom:10px;
}
.badge-green{background:rgba(110,231,183,.12);color:var(--accent);border:1px solid rgba(110,231,183,.3);}
.badge-indigo{background:rgba(129,140,248,.12);color:var(--accent2);border:1px solid rgba(129,140,248,.3);}
.badge-amber{background:rgba(251,146,60,.12);color:var(--accent3);border:1px solid rgba(251,146,60,.3);}
.badge-sky{background:rgba(56,189,248,.12);color:var(--accent4);border:1px solid rgba(56,189,248,.3);}
.badge-pink{background:rgba(244,114,182,.12);color:var(--accent5);border:1px solid rgba(244,114,182,.3);}
.badge-yellow{background:rgba(250,204,21,.12);color:var(--accent6);border:1px solid rgba(250,204,21,.3);}
.badge-red{background:rgba(251,113,133,.12);color:var(--red);border:1px solid rgba(251,113,133,.3);}
/* table */
table.tbl{width:100%;border-collapse:collapse;font-size:16px;}
table.tbl th,table.tbl td{padding:11px 14px;text-align:left;border-bottom:1px solid var(--border);}
table.tbl th{color:var(--accent);font-size:13px;text-transform:uppercase;letter-spacing:.08em;font-family:var(--mono);}
table.tbl td{color:var(--text);}
table.tbl code{color:var(--accent4);font-family:var(--mono);font-size:15px;}
/* code */
.code-wrap{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;}
.code-header{
  display:flex;justify-content:space-between;align-items:center;
  padding:10px 16px;border-bottom:1px solid var(--border);
  font-family:var(--mono);font-size:14px;color:var(--muted);
}
.copy-btn{
  font-family:var(--mono);font-size:13px;
  background:var(--surface);border:1px solid var(--border);
  color:var(--muted);border-radius:6px;padding:5px 12px;cursor:pointer;
  transition:all .2s;box-shadow:2px 2px 4px rgba(0,0,0,.3),-1px -1px 3px rgba(255,255,255,.04);
}
.copy-btn.copied{
  color:var(--accent);border-color:rgba(110,231,183,.4);
  box-shadow:inset 1px 1px 3px rgba(0,0,0,.3),inset -1px -1px 2px rgba(255,255,255,.04);
  background:rgba(110,231,183,.08);
}
.copy-btn:hover:not(.copied){color:var(--text);border-color:rgba(255,255,255,.2);}
pre.code-body{
  padding:18px 20px;overflow-x:auto;font-family:var(--mono);font-size:15px;
  line-height:1.65;color:var(--text);margin:0;
  max-height:340px;overflow-y:auto;
}
pre.code-body::-webkit-scrollbar{height:5px;width:5px;}
pre.code-body::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px;}
/* syntax highlight */
.kw{color:var(--accent2);}
.ty{color:var(--accent4);}
.st{color:var(--accent);}
.cm{color:var(--muted);font-style:italic;}
.nu{color:var(--accent3);}
.fn{color:var(--accent6);}
/* MCQ options */
.opt{
  display:flex;align-items:flex-start;gap:12px;
  background:var(--surface2);border:1px solid var(--border);border-radius:10px;
  padding:12px 16px;margin-bottom:8px;font-size:17px;line-height:1.5;
}
.opt-key{
  font-family:var(--mono);font-size:15px;font-weight:700;
  color:var(--accent2);flex-shrink:0;min-width:22px;
}
/* ID blank */
.id-item{
  display:flex;align-items:center;gap:14px;
  background:var(--surface);border:1px solid var(--border);border-radius:10px;
  padding:12px 18px;margin-bottom:10px;font-size:17px;
}
.id-num{
  font-family:var(--mono);font-size:14px;font-weight:700;
  color:var(--accent5);flex-shrink:0;min-width:28px;
}
.id-blank{
  flex:1;border-bottom:1px dashed var(--border);
  color:var(--text);font-size:16px;
}
/* output box */
.out-box{
  background:rgba(0,0,0,.4);border:1px solid var(--border);border-radius:10px;
  padding:16px 20px;font-family:var(--mono);font-size:16px;line-height:1.8;
  color:var(--accent4);margin-top:10px;min-height:70px;
}
/* divider */
.divider{height:1px;background:var(--border);margin:18px 0;}
/* icon row */
.icon-row{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:24px;}
.chip{
  display:inline-flex;align-items:center;gap:8px;
  background:var(--surface);border:1px solid var(--border);border-radius:8px;
  padding:8px 16px;font-size:16px;font-weight:600;
}
/* answer key highlight */
.ans{
  display:inline-flex;align-items:center;gap:8px;
  background:rgba(110,231,183,.1);border:1px solid rgba(110,231,183,.3);
  border-radius:8px;padding:5px 14px;font-family:var(--mono);font-size:16px;color:var(--accent);font-weight:700;
}
.ans-row{margin-bottom:12px;font-size:16px;line-height:1.6;}
.ans-row small{color:var(--muted);font-size:15px;}
/* hero svg wrap */
.hero-svg{display:flex;justify-content:center;margin-bottom:28px;}
/* big num */
.big-num{font-size:clamp(48px,6vw,80px);font-weight:900;line-height:1;font-family:var(--mono);}
/* recap section label */
.sec-label{
  font-family:var(--mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--muted);margin-bottom:12px;display:block;
}
</style>
</head>
<body>
<div id="prog-track"><div id="prog-bar"></div></div>
<span id="counter"><b id="cur">1</b> / <b id="tot">1</b></span>
<button id="hint-btn" title="Shortcuts">?</button>
<div id="overlay">
  <div id="overlay-box">
    <h3>⌨ Keyboard Shortcuts</h3>
    <div class="row"><span class="key">→ / Mouse4</span><span class="desc">Next slide</span></div>
    <div class="row"><span class="key">← / Mouse3</span><span class="desc">Previous slide</span></div>
    <div class="row"><span class="key">Home</span><span class="desc">First slide</span></div>
    <div class="row"><span class="key">End</span><span class="desc">Last slide</span></div>
    <div class="row"><span class="key">?</span><span class="desc">Toggle this overlay</span></div>
    <div class="row"><span class="key">Swipe</span><span class="desc">Navigate on mobile</span></div>
    <button id="overlay-close">Close</button>
  </div>
</div>
<div id="deck">
<div class="stage" id="stage"></div>
</div>
<script>
const slides = [

// ============================================================
// SLIDE 1 — TITLE
// ============================================================
`<div class="slide-inner">
  <div class="hero-svg">
    <svg width="320" height="90" viewBox="0 0 320 90" role="img" xmlns="http://www.w3.org/2000/svg">
      <title>DSA Data Structures & Algorithms logo</title>
      <!-- Linked list nodes -->
      <rect x="10" y="30" width="56" height="30" rx="8" fill="none" stroke="#6ee7b7" stroke-width="2"/>
      <text x="38" y="50" text-anchor="middle" font-family="monospace" font-size="13" fill="#6ee7b7">Node</text>
      <line x1="66" y1="45" x2="88" y2="45" stroke="#818cf8" stroke-width="2" marker-end="url(#arr)"/>
      <rect x="88" y="30" width="56" height="30" rx="8" fill="none" stroke="#818cf8" stroke-width="2"/>
      <text x="116" y="50" text-anchor="middle" font-family="monospace" font-size="13" fill="#818cf8">Node</text>
      <line x1="144" y1="45" x2="166" y2="45" stroke="#fb923c" stroke-width="2" marker-end="url(#arr2)"/>
      <rect x="166" y="30" width="56" height="30" rx="8" fill="none" stroke="#fb923c" stroke-width="2"/>
      <text x="194" y="50" text-anchor="middle" font-family="monospace" font-size="13" fill="#fb923c">Node</text>
      <line x1="222" y1="45" x2="244" y2="45" stroke="#38bdf8" stroke-width="2" marker-end="url(#arr3)"/>
      <rect x="244" y="30" width="56" height="30" rx="8" fill="none" stroke="#38bdf8" stroke-width="2"/>
      <text x="272" y="50" text-anchor="middle" font-family="monospace" font-size="13" fill="#38bdf8">null</text>
      <!-- O() badge top right -->
      <text x="290" y="22" font-family="monospace" font-size="18" fill="#facc15" font-weight="900">O(n)</text>
      <defs>
        <marker id="arr" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
          <path d="M0,0 L6,3 L0,6 Z" fill="#818cf8"/>
        </marker>
        <marker id="arr2" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
          <path d="M0,0 L6,3 L0,6 Z" fill="#fb923c"/>
        </marker>
        <marker id="arr3" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
          <path d="M0,0 L6,3 L0,6 Z" fill="#38bdf8"/>
        </marker>
      </defs>
    </svg>
  </div>
  <div class="eyebrow"><div class="dash"></div>DSA Periodical Exam Prep<div class="dash"></div></div>
  <h1 class="title"><span class="a1">Summative</span> Review &amp; <span class="a2">Exam Simulator</span></h1>
  <p class="lede">30-item summative covering Big O Notation, Linked Lists, Stacks, and Queues — with a comprehensive recap before the exam questions.</p>
  <div class="icon-row">
    <span class="chip"><span class="a6">⊛</span> Big O Notation</span>
    <span class="chip"><span class="a1">⬡</span> Linked Lists</span>
    <span class="chip"><span class="a3">▣</span> Stacks</span>
    <span class="chip"><span class="a4">⬤</span> Queues</span>
  </div>
  <div class="g4">
    <div class="card c-yellow" style="text-align:center;padding:16px;">
      <div class="big-num a6">10</div>
      <div style="font-size:16px;color:var(--muted);margin-top:6px;">Multiple Choice</div>
    </div>
    <div class="card c-pink" style="text-align:center;padding:16px;">
      <div class="big-num a5">15</div>
      <div style="font-size:16px;color:var(--muted);margin-top:6px;">Identification</div>
    </div>
    <div class="card c-sky" style="text-align:center;padding:16px;">
      <div class="big-num a4">5</div>
      <div style="font-size:16px;color:var(--muted);margin-top:6px;">Guess the Output</div>
    </div>
    <div class="card c-green" style="text-align:center;padding:16px;">
      <div class="big-num a1">30</div>
      <div style="font-size:16px;color:var(--muted);margin-top:6px;">Total Items</div>
    </div>
  </div>
</div>`,

// ============================================================
// SLIDE 2 — RECAP: BIG O NOTATION
// ============================================================
`<div class="slide-inner">
  <div class="eyebrow"><div class="dash"></div>Recap — Topic 1<div class="dash"></div></div>
  <h2 class="title"><span class="a6">Big O Notation</span> — How Algorithms Scale</h2>
  <p class="lede">Big O describes <em>how the work grows</em> as input <code style="color:var(--accent4);">n</code> increases — not the exact runtime.</p>
  <div class="g2" style="margin-bottom:18px;">
    <div class="card c-yellow">
      <div class="badge badge-yellow">O(1) — Constant</div>
      <p>Work stays the same regardless of input size. <strong style="color:var(--text);">Vending machine analogy</strong> — press B4, always takes the same time.</p>
      <p style="margin-top:8px;font-family:var(--mono);font-size:15px;color:var(--accent4);">arr[0] → always one lookup</p>
    </div>
    <div class="card c-green">
      <div class="badge badge-green">O(log n) — Logarithmic</div>
      <p>Each step <strong style="color:var(--text);">halves</strong> the remaining problem. <strong style="color:var(--text);">Phone book analogy</strong> — flip to middle, discard half, repeat.</p>
      <p style="margin-top:8px;font-family:var(--mono);font-size:15px;color:var(--accent4);">i = i * 2 in a loop</p>
    </div>
    <div class="card c-indigo">
      <div class="badge badge-indigo">O(n) — Linear</div>
      <p>Effort grows <strong style="color:var(--text);">proportionally</strong> with input. <strong style="color:var(--text);">Pocket-checking analogy</strong> — more pockets, more checks.</p>
      <p style="margin-top:8px;font-family:var(--mono);font-size:15px;color:var(--accent4);">for(i=0;i&lt;n;i++)</p>
    </div>
    <div class="card c-amber">
      <div class="badge badge-amber">O(n²) — Quadratic</div>
      <p>A <strong style="color:var(--text);">nested loop</strong>. Double input → roughly 4x the work. Common in brute-force sorts like bubble sort.</p>
      <p style="margin-top:8px;font-family:var(--mono);font-size:15px;color:var(--accent4);">for i: for j → n²</p>
    </div>
  </div>
  <div class="card" style="background:var(--surface2);">
    <table class="tbl">
      <tr><th>Notation</th><th>Name</th><th>n=10</th><th>n=1,000</th><th>n=1,000,000</th><th>Loop Pattern</th></tr>
      <tr><td class="a6">O(1)</td><td>Constant</td><td>1</td><td>1</td><td>1</td><td>No loop / single statement</td></tr>
      <tr><td class="a1">O(log n)</td><td>Logarithmic</td><td>3</td><td>10</td><td>20</td><td>i = i*2 (doubles)</td></tr>
      <tr><td class="a2">O(n)</td><td>Linear</td><td>10</td><td>1,000</td><td>1,000,000</td><td>Single loop over n</td></tr>
      <tr><td class="a3">O(n²)</td><td>Quadratic</td><td>100</td><td>1,000,000</td><td>10¹²</td><td>Loop inside loop</td></tr>
    </table>
  </div>
</div>`,

// ============================================================
// SLIDE 3 — RECAP: LINKED LISTS
// ============================================================
`<div class="slide-inner">
  <div class="eyebrow"><div class="dash"></div>Recap — Topic 2<div class="dash"></div></div>
  <h2 class="title"><span class="a1">Linked Lists</span> — Nodes, Pointers &amp; Traversal</h2>
  <div class="hero-svg">
    <svg width="580" height="72" viewBox="0 0 580 72" role="img" xmlns="http://www.w3.org/2000/svg">
      <title>Singly linked list diagram: head → [data|next] → [data|next] → null</title>
      <text x="10" y="40" font-family="monospace" font-size="14" fill="#6b7a96">head</text>
      <line x1="52" y1="38" x2="70" y2="38" stroke="#6ee7b7" stroke-width="2" marker-end="url(#ga)"/>
      <defs><marker id="ga" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#6ee7b7"/></marker>
      <marker id="gb" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#818cf8"/></marker>
      <marker id="gc" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#fb923c"/></marker></defs>

const stage = document.getElementById('stage');
const progBar = document.getElementById('prog-bar');
const curEl = document.getElementById('cur');
const totEl = document.getElementById('tot');
let cur = 0;

totEl.textContent = slides.length;

function buildSlides(){
  slides.forEach((html, i) => {
    const div = document.createElement('div');
    div.className = 'slide' + (i===0?' active':'');
    div.innerHTML = html;
    stage.appendChild(div);
  });
}

function goTo(n, dir){
  if(n<0||n>=slides.length||n===cur) return;
  const all = stage.querySelectorAll('.slide');
  const outgoing = all[cur];
  const incoming = all[n];

  // outgoing slide exits toward the opposite side of travel
  outgoing.classList.remove('active');
  outgoing.style.transform = dir==='next' ? 'translateX(-28px)' : 'translateX(28px)';

  // incoming slide starts from the side it's arriving from
  incoming.classList.remove('active');
  incoming.style.transition = 'none';
  incoming.style.transform = dir==='next' ? 'translateX(28px)' : 'translateX(-28px)';

  cur = n;

  requestAnimationFrame(()=>{
    requestAnimationFrame(()=>{
      incoming.style.transition = '';
      incoming.classList.add('active');
      incoming.style.transform = '';
    });
  });

  setTimeout(()=>{
    outgoing.style.transform = '';
  },350);

  curEl.textContent=cur+1;
  progBar.style.width=(((cur+1)/slides.length)*100)+'%';
}

buildSlides();
progBar.style.width=(1/slides.length*100)+'%';

// keyboard
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'||e.key==='PageDown') goTo(cur+1,'next');
  else if(e.key==='ArrowLeft'||e.key==='PageUp') goTo(cur-1,'prev');
  else if(e.key==='Home') goTo(0,'prev');
  else if(e.key==='End') goTo(slides.length-1,'next');
  else if(e.key==='?'){
    document.getElementById('overlay').classList.toggle('show');
  }
});

// mouse side buttons (Mouse3/Mouse4)
document.addEventListener('mousedown', e=>{
  if(e.button===3){e.preventDefault();e.stopImmediatePropagation();goTo(cur-1,'prev');}
  if(e.button===4){e.preventDefault();e.stopImmediatePropagation();goTo(cur+1,'next');}
},{capture:true});

// context menu block
document.addEventListener('contextmenu',e=>e.preventDefault());

// touch swipe
let tx=null;
document.addEventListener('touchstart',e=>{tx=e.touches[0].clientX;},{passive:true});
document.addEventListener('touchend',e=>{
  if(tx===null) return;
  const dx=e.changedTouches[0].clientX-tx;
  if(Math.abs(dx)>50){ dx<0?goTo(cur+1,'next'):goTo(cur-1,'prev'); }
  tx=null;
},{passive:true});

// overlay
document.getElementById('hint-btn').addEventListener('click',()=>{
  document.getElementById('overlay').classList.toggle('show');
});
document.getElementById('overlay-close').addEventListener('click',()=>{
  document.getElementById('overlay').classList.remove('show');
});
document.getElementById('overlay').addEventListener('click',e=>{
  if(e.target===document.getElementById('overlay'))
    document.getElementById('overlay').classList.remove('show');
});

// copy buttons
function copyCode(btn){
  const pre = btn.closest('.code-wrap').querySelector('pre[data-code]');
  const text = pre.innerText;
  navigator.clipboard.writeText(text).then(()=>{
    btn.textContent='Copied!';
    btn.classList.add('copied');
    setTimeout(()=>{btn.textContent='Copy';btn.classList.remove('copied');},2000);
  });
}
</script>
</body>
