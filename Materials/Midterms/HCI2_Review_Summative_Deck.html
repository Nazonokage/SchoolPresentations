<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>HCI2 · Periodical Review — DOM &amp; Modern Web APIs</title>
<style>
  :root{
    --bg:#0b1622;
    --bg-2:#0e1d2e;
    --panel:#12233a;
    --panel-2:#0f1e30;
    --ink:#eaf1f7;
    --ink-dim:#93a7bd;
    --ink-faint:#5f7085;
    --line:rgba(234,241,247,.12);
    --line-strong:rgba(234,241,247,.22);
    --accent:#7fe3c6;
    --accent-ink:#062821;
    --amber:#f3b855;
    --coral:#ef8974;
    --violet:#a695e8;
    --radius:18px;
    --radius-sm:11px;
    --shadow:0 24px 60px -24px rgba(0,0,0,.65);
    --mono:'JetBrains Mono','Fira Code',ui-monospace,'Cascadia Code',Consolas,'SFMono-Regular',monospace;
    --display:'Avenir Next','Century Gothic','Segoe UI Semibold',system-ui,sans-serif;
    --body:system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;background:var(--bg);}
  body{
    font-family:var(--body);
    color:var(--ink);
    overflow:hidden;
    -webkit-font-smoothing:antialiased;
    -webkit-user-select:none;
    user-select:none;
  }
  ::selection{background:var(--accent);color:var(--accent-ink);}

  /* ---------- background texture ---------- */
  .bg-grid{
    position:fixed;inset:0;z-index:0;pointer-events:none;
    background-image:
      radial-gradient(circle at 15% 8%, rgba(127,227,198,.10), transparent 40%),
      radial-gradient(circle at 88% 82%, rgba(166,149,232,.09), transparent 42%),
      linear-gradient(var(--line) 1px, transparent 1px),
      linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size:auto,auto,64px 64px,64px 64px;
    opacity:.5;
  }

  /* ---------- deck / slide mechanics ---------- */
  .deck{position:relative;width:100vw;height:100vh;overflow:hidden;z-index:1;}
  .slide{
    position:absolute;inset:0;
    display:flex;
    opacity:0;pointer-events:none;
    transform:translateX(0);
    transition:opacity .35s ease, transform .35s ease;
    padding:clamp(20px,4vh,48px) clamp(28px,6vw,96px);
  }
  .slide.active{opacity:1;pointer-events:auto;transform:translateX(0);}
  .slide.enter-right{opacity:0;transform:translateX(70px);}
  .slide.enter-left{opacity:0;transform:translateX(-70px);}
  .slide.exit-left{opacity:0;transform:translateX(-70px);}
  .slide.exit-right{opacity:0;transform:translateX(70px);}
  @media (prefers-reduced-motion: reduce){
    .slide{transition:none !important;}
  }

  .slide-inner{
    width:100%;max-width:1280px;margin:0 auto;
    display:flex;flex-direction:column;
    min-height:0;height:100%;
  }
  .slide-body{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;}
  .slide-body.overflow-ok{overflow-y:auto;justify-content:flex-start;}
  .slide-body.top{justify-content:flex-start;}

  .eyebrow{
    font-family:var(--mono);
    font-size:16px;letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--accent);
    display:flex;align-items:center;gap:10px;
    margin:0 0 10px 0;
  }
  .eyebrow::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px rgba(127,227,198,.18);}
  h2.title{
    font-family:var(--display);
    font-weight:700;
    font-size:clamp(26px,3.6vw,44px);
    line-height:1.12;
    letter-spacing:-.01em;
    margin:0 0 22px 0;
    color:var(--ink);
  }
  .slide-head{flex-shrink:0;}

  /* ---------- index / progress chrome ---------- */
  .chrome-top{position:fixed;top:0;left:0;right:0;height:4px;z-index:30;background:rgba(255,255,255,.05);}
  .chrome-top-fill{height:100%;width:0%;background:linear-gradient(90deg,var(--accent),var(--violet));transition:width .35s ease;}
  .chrome-counter{
    position:fixed;bottom:22px;right:28px;z-index:30;
    font-family:var(--mono);font-size:16px;color:var(--ink-dim);
    letter-spacing:.04em;
    background:rgba(18,35,58,.55);border:1px solid var(--line);
    padding:6px 12px;border-radius:999px;backdrop-filter:blur(6px);
  }
  .chrome-counter b{color:var(--accent);font-weight:600;}
  .chrome-hint{
    position:fixed;bottom:22px;left:28px;z-index:30;
    font-family:var(--mono);font-size:16px;color:var(--ink-faint);
    display:flex;gap:14px;align-items:center;
  }
  .chrome-hint kbd{
    font-family:var(--mono);font-size:16px;color:var(--ink-dim);
    border:1px solid var(--line-strong);border-bottom-width:2px;
    padding:2px 7px;border-radius:6px;background:var(--panel-2);
  }

  /* ---------- shortcuts overlay ---------- */
  .overlay{
    position:fixed;inset:0;z-index:50;
    background:rgba(6,12,20,.72);backdrop-filter:blur(6px);
    display:flex;align-items:center;justify-content:center;
    opacity:0;pointer-events:none;transition:opacity .25s ease;
  }
  .overlay.show{opacity:1;pointer-events:auto;}
  .overlay-card{
    background:var(--panel);border:1px solid var(--line-strong);
    border-radius:var(--radius);padding:36px 40px;box-shadow:var(--shadow);
    width:min(520px,88vw);
  }
  .overlay-card h3{margin:0 0 18px 0;font-family:var(--display);font-size:22px;}
  .overlay-row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);font-size:16px;color:var(--ink-dim);}
  .overlay-row:last-child{border-bottom:none;}
  .overlay-row kbd{font-family:var(--mono);font-size:16px;color:var(--ink);background:var(--panel-2);border:1px solid var(--line-strong);border-bottom-width:2px;padding:3px 9px;border-radius:6px;}

  /* ---------- cards / grids ---------- */
  .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:22px;min-height:0;}
  .grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:18px;min-height:0;}
  .card{
    background:var(--panel);border:1px solid var(--line);
    border-radius:var(--radius);padding:22px 24px;
    box-shadow:var(--shadow);min-width:0;
  }
  .card.soft{background:var(--panel-2);}
  .badge{
    display:inline-flex;align-items:center;gap:6px;
    font-family:var(--mono);font-size:16px;letter-spacing:.03em;
    padding:4px 10px;border-radius:999px;
    background:rgba(127,227,198,.12);color:var(--accent);
    border:1px solid rgba(127,227,198,.28);
  }
  .badge.amber{background:rgba(243,184,85,.13);color:var(--amber);border-color:rgba(243,184,85,.3);}
  .badge.coral{background:rgba(239,137,116,.13);color:var(--coral);border-color:rgba(239,137,116,.3);}
  .badge.violet{background:rgba(166,149,232,.13);color:var(--violet);border-color:rgba(166,149,232,.3);}

  p{font-size:17px;line-height:1.6;color:var(--ink-dim);margin:0 0 10px 0;}
  strong{color:var(--ink);font-weight:600;}
  ul.plain{margin:0;padding:0;list-style:none;}
  ul.plain li{font-size:17px;line-height:1.55;color:var(--ink-dim);padding:7px 0 7px 22px;position:relative;}
  ul.plain li::before{content:"";position:absolute;left:0;top:16px;width:8px;height:8px;border-radius:2px;background:var(--accent);transform:rotate(45deg);}

  /* ---------- logo chip row ---------- */
  .chip-row{display:flex;gap:14px;flex-wrap:wrap;margin-top:22px;}
  .chip{
    display:flex;align-items:center;gap:9px;
    background:var(--panel);border:1px solid var(--line-strong);
    border-radius:999px;padding:8px 16px 8px 8px;
  }
  .chip .ic{width:38px;height:38px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .chip span{font-family:var(--mono);font-size:16px;color:var(--ink);}

  /* ---------- question cards (MCQ / ID) ---------- */
  .q-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:24px 26px;box-shadow:var(--shadow);display:flex;flex-direction:column;min-height:0;}
  .q-num{font-family:var(--mono);font-size:16px;color:var(--accent);letter-spacing:.06em;margin-bottom:8px;}
  .q-text{font-size:18px;line-height:1.5;color:var(--ink);margin:0 0 16px 0;font-weight:500;}
  .opts{display:flex;flex-direction:column;gap:9px;margin-top:auto;}
  .opt{
    display:flex;gap:10px;align-items:flex-start;
    font-size:16px;line-height:1.5;color:var(--ink-dim);
    background:var(--panel-2);border:1px solid var(--line);
    border-radius:var(--radius-sm);padding:9px 13px;
  }
  .opt b{font-family:var(--mono);color:var(--accent);flex-shrink:0;}
  .id-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius-sm);padding:16px 20px;display:flex;gap:16px;align-items:flex-start;}
  .id-card .q-num{margin:0;flex-shrink:0;padding-top:2px;}
  .id-card p{margin:0;color:var(--ink);font-size:16px;line-height:1.55;}
  .id-list{display:flex;flex-direction:column;gap:14px;}

  /* ---------- code cards ---------- */
  .code-card{
    background:var(--panel-2);border:1px solid var(--line);
    border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);
    display:flex;flex-direction:column;height:100%;min-height:0;
  }
  .code-head{
    flex-shrink:0;display:flex;align-items:center;justify-content:space-between;
    padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line);
  }
  .code-head .dots{display:flex;gap:6px;}
  .code-head .dots span{width:9px;height:9px;border-radius:50%;background:var(--line-strong);}
  .code-head .label{font-family:var(--mono);font-size:16px;color:var(--ink-faint);letter-spacing:.04em;}
  .copy-btn{
    font-family:var(--mono);font-size:16px;color:var(--ink-dim);
    background:var(--panel-2);border:1px solid var(--line-strong);
    border-radius:8px;padding:5px 12px;cursor:pointer;
    box-shadow:2px 2px 5px rgba(0,0,0,.35), -2px -2px 5px rgba(255,255,255,.03);
    transition:all .15s ease;
  }
  .copy-btn:active,.copy-btn.copied{
    box-shadow:inset 2px 2px 5px rgba(0,0,0,.45), inset -2px -2px 5px rgba(255,255,255,.03);
    color:var(--accent);border-color:rgba(127,227,198,.4);
  }
  pre.code{
    flex:1;overflow:auto;min-height:0;margin:0;
    padding:16px 18px;font-family:var(--mono);font-size:16px;line-height:1.62;
    color:var(--ink);white-space:pre-wrap;word-break:break-word;overflow-wrap:anywhere;
  }
  .tok-kw{color:var(--violet);}
  .tok-str{color:var(--accent);}
  .tok-com{color:var(--ink-faint);font-style:italic;}
  .tok-num{color:var(--amber);}
  .tok-fn{color:#8ec9ff;}

  .gto-q{font-size:17px;color:var(--ink);margin:0 0 12px 0;font-weight:500;}

  /* ---------- answer key ---------- */
  .ans-table{width:100%;border-collapse:collapse;}
  .ans-table td{font-family:var(--mono);font-size:16px;padding:7px 10px;border-bottom:1px solid var(--line);color:var(--ink-dim);}
  .ans-table td.n{color:var(--ink-faint);width:34px;}
  .ans-table td.a{color:var(--accent);font-weight:700;width:26px;}
  .ans-key-item{padding:9px 0;border-bottom:1px solid var(--line);}
  .ans-key-item:last-child{border-bottom:none;}
  .ans-key-item .k-n{font-family:var(--mono);color:var(--accent);font-size:16px;margin-right:8px;}
  .ans-key-item .k-a{color:var(--ink);font-size:16px;font-weight:600;}
  .ans-key-item .k-note{color:var(--ink-dim);font-size:16px;display:block;margin-top:2px;line-height:1.5;}

  /* ---------- quotes ---------- */
  .quote-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:26px 30px;box-shadow:var(--shadow);position:relative;}
  .quote-mark{font-family:var(--display);font-size:52px;color:var(--accent);opacity:.35;line-height:1;margin-bottom:4px;}
  .quote-text{font-size:19px;line-height:1.55;color:var(--ink);margin:0 0 14px 0;font-weight:500;}
  .quote-attr{font-family:var(--mono);font-size:16px;color:var(--ink-dim);}

  /* ---------- recap ---------- */
  .recap-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  .recap-item{display:flex;gap:12px;align-items:flex-start;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius-sm);padding:14px 16px;}
  .recap-item .ic{flex-shrink:0;width:34px;height:34px;}
  .recap-item p{margin:0;font-size:16px;color:var(--ink-dim);line-height:1.5;}
  .recap-item strong{display:block;color:var(--ink);font-size:16.5px;margin-bottom:2px;}

  /* ---------- title & final ---------- */
  .title-wrap{display:flex;flex-direction:column;justify-content:center;height:100%;}
  .kicker{font-family:var(--mono);color:var(--accent);letter-spacing:.18em;text-transform:uppercase;font-size:17px;margin-bottom:18px;display:flex;align-items:center;gap:10px;}
  .kicker::before{content:"";width:26px;height:2px;background:var(--accent);}
  h1.hero{font-family:var(--display);font-weight:700;font-size:clamp(38px,6vw,72px);line-height:1.05;letter-spacing:-.015em;margin:0 0 18px 0;}
  h1.hero .accent{color:var(--accent);}
  .hero-sub{font-size:19px;color:var(--ink-dim);max-width:640px;line-height:1.6;margin:0 0 6px 0;}
  .stat-row{display:flex;gap:14px;margin-top:26px;flex-wrap:wrap;}
  .stat{background:var(--panel);border:1px solid var(--line-strong);border-radius:var(--radius-sm);padding:12px 18px;min-width:110px;}
  .stat b{display:block;font-family:var(--display);font-size:26px;color:var(--accent);}
  .stat span{font-family:var(--mono);font-size:16px;color:var(--ink-dim);letter-spacing:.04em;}

  .final-wrap{display:flex;flex-direction:column;align-items:flex-start;justify-content:center;height:100%;gap:20px;}

  /* ---------- scrollbars ---------- */
  ::-webkit-scrollbar{width:9px;height:9px;}
  ::-webkit-scrollbar-track{background:transparent;}
  ::-webkit-scrollbar-thumb{background:var(--line-strong);border-radius:6px;}

  /* ---------- responsive ---------- */
  @media (max-width: 820px){
    .grid-2,.grid-3{grid-template-columns:1fr;}
    .chrome-hint{display:none;}
    h1.hero{font-size:clamp(30px,8vw,48px);}
  }
</style>
</head>
<body>

<div class="bg-grid" aria-hidden="true"></div>
<div class="chrome-top" aria-hidden="true"><div class="chrome-top-fill" id="progressFill"></div></div>
<div class="deck" id="deck" role="region" aria-label="Presentation slides"></div>
<div class="chrome-counter" id="counter">[01 / 01]</div>
<div class="chrome-hint">
  <span><kbd>&larr;</kbd>/<kbd>&rarr;</kbd> navigate</span>
  <span><kbd>?</kbd> shortcuts</span>
</div>

<div class="overlay" id="shortcutsOverlay" aria-hidden="true">
  <div class="overlay-card">
    <h3>Keyboard &amp; mouse shortcuts</h3>
    <div class="overlay-row"><span>Next slide</span><span><kbd>&rarr;</kbd> or right-click or Mouse4</span></div>
    <div class="overlay-row"><span>Previous slide</span><span><kbd>&larr;</kbd> or Mouse3</span></div>
    <div class="overlay-row"><span>First / last slide</span><span><kbd>Home</kbd> / <kbd>End</kbd></span></div>
    <div class="overlay-row"><span>Toggle this panel</span><span><kbd>?</kbd></span></div>
    <div class="overlay-row"><span>Close panel</span><span><kbd>Esc</kbd></span></div>
    <div class="overlay-row"><span>Mobile</span><span>swipe left / right</span></div>
  </div>
</div>

<script>
(function(){
"use strict";

/* ======================================================================
   CONTENT DATA
====================================================================== */

var MCQ = [
  {q:"What is the correct term for the browser's in-memory tree representation of an HTML page?",
   o:["CSSOM","DOM","BOM","AST"], a:1},
  {q:"Which selection method returns exactly one element, or null if none matches?",
   o:["getElementsByClassName","querySelectorAll","querySelector","getElementsByTagName"], a:2},
  {q:"Which collection type is described as \u201clive\u201d \u2014 it automatically reflects later DOM changes?",
   o:["NodeList from querySelectorAll","HTMLCollection from getElementsByClassName","An array from Array.from()","A cloned node list"], a:1},
  {q:"What does el.nextElementSibling skip that el.nextSibling does NOT?",
   o:["Comment nodes only","Whitespace text nodes and comments","Attribute nodes","Nothing \u2014 they are identical"], a:1},
  {q:"Which event-handling pattern lets a single listener respond to clicks on child elements added after page load?",
   o:["Inline onclick=\"\"","Event delegation","Capturing phase alone","Manual polling with setInterval"], a:1},
  {q:"In addEventListener(\"click\", handler, true), what does the third argument (true) enable?",
   o:["Bubbling-phase handling","Capturing-phase handling","A passive listener","Once-only execution"], a:1},
  {q:"Which Web Sensor requires the ambient-light-sensor permissions-policy to run?",
   o:["Accelerometer","Gyroscope","AmbientLightSensor","Magnetometer"], a:2},
  {q:"Which storage mechanism is automatically sent to the server with every matching HTTP request?",
   o:["localStorage","sessionStorage","Cookies","IndexedDB"], a:2},
  {q:"In a fetch() promise chain, which of these actually rejects the promise?",
   o:["A 404 or 500 HTTP status by itself","A network failure, e.g. no internet connection","Calling response.json()","Calling .then() twice"], a:1},
  {q:"What must a developer do before storing a JavaScript object in localStorage?",
   o:["Nothing \u2014 objects store natively","Convert it with JSON.stringify()","Wrap it in an array","Call Object.freeze() on it"], a:1}
];

var IDQ = [
  {q:"A quiz app calls document.querySelectorAll(\".option\") and stores the result before more .option elements are injected later; the stored list's length does NOT change even though the DOM did. Which JS collection type explains this static behavior?",
   a:"NodeList (from querySelectorAll) \u2014 static, not live"},
  {q:"A dev reads list.children[0] and gets the actual <li> even though the HTML source has leading whitespace before it. Why doesn't the whitespace break this, unlike using .childNodes[0]?",
   a:".children only returns element nodes \u2014 it ignores text/whitespace nodes"},
  {q:"A settings panel must only become visible after its new element is fully part of the page, not right after createElement() runs. Which step of the 3-step DOM-building workflow makes that happen?",
   a:"Attach \u2014 appendChild() onto a parent already in the document"},
  {q:"A chat app adds new \u201cReact\u201d buttons to messages every few seconds. A junior dev attaches a fresh addEventListener inside the function that builds each button, causing steadily growing memory use. What single pattern should replace this entirely?",
   a:"Event delegation \u2014 one listener on a stable parent, checking event.target"},
  {q:"A checkbox's change listener is attached with addEventListener(\"change\", fn, false). By default, which phase does the event travel through when it reaches this listener?",
   a:"The bubbling phase (target \u2192 ancestors)"},
  {q:"A flashlight app wants to detect the phone's physical tilt in 3D space to auto-rotate content. Which category of browser API does this belong to \u2014 sensors, storage, or networking?",
   a:"Web Sensor APIs (e.g. orientation/motion sensors)"},
  {q:"A developer generates a QR code and needs to drop it straight into an <img src=\"...\"> without hosting a separate file on a server. Which QRious method produces that embeddable string?",
   a:"toDataURL() \u2014 returns a Base64-encoded image string"},
  {q:"A cart page must keep its items only for the current browsing session and clear them the instant the tab closes. Which Web Storage API matches this exactly?",
   a:"sessionStorage"},
  {q:"A login system must stop any injected <script> from ever reading the session cookie through document.cookie. Which single cookie attribute enforces that?",
   a:"HttpOnly"},
  {q:"A call to a removed API endpoint returns HTTP 410, but a developer's .catch() never fires \u2014 the app still tries to render the missing data. What false assumption about fetch() explains this bug?",
   a:"Assuming fetch() rejects on bad HTTP status \u2014 it only rejects on network-level failures; response.ok must be checked manually"},
  {q:"A form's Submit button already runs onclick=\"validate()\". A teammate needs to also log analytics on the same click, without touching the HTML or removing validate(). Which method should they call, and on what?",
   a:"element.addEventListener(\"click\", analyticsFn) \u2014 adds a handler without overwriting the existing one"},
  {q:"A dashboard needs a live count of .notification elements whose .length updates automatically as new notifications are appended, with no extra code. Which selection method naturally provides this?",
   a:"document.getElementsByClassName(\"notification\") \u2014 returns a live HTMLCollection"},
  {q:"A student writes div.firstChild.nodeValue expecting text but logs undefined, because firstChild pointed to something other than a text node here. What should be checked before trusting nodeValue?",
   a:"The node's nodeType (or use firstElementChild / textContent depending on intent)"},
  {q:"A chat box widget and a stock-ticker widget on the same page must each keep their own state and keep working even if the other is removed. Which widget characteristic does this describe?",
   a:"Loose coupling \u2014 independence between widgets"},
  {q:"A theming script runs localStorage.getItem(\"theme\") on a brand-new visitor and logs null instead of throwing an error. What does this confirm about a missing key in Web Storage?",
   a:"getItem() returns null (not an error) for a missing key \u2014 a fallback/default must be handled in code"}
];

var GTO = [
  {q:"What is the output? (assume one .tag element already exists before this runs)",
   code:'const list = document.querySelectorAll(".tag");\nconsole.log(list.length);\ndocument.body.appendChild(document.createElement("span")).className = "tag";\nconsole.log(list.length);',
   out:"1\n1",
   note:"querySelectorAll() returns a STATIC NodeList \u2014 it does not update after a later DOM change."},
  {q:"What is the output?",
   code:'const el = document.createElement("p");\nel.textContent = "Ready";\nconsole.log(document.body.contains(el));\ndocument.body.appendChild(el);\nconsole.log(document.body.contains(el));',
   out:"false\ntrue",
   note:"A created element only becomes part of the live document after appendChild() runs."},
  {q:"What is the output?",
   code:'localStorage.setItem("count", 5);\nconst val = localStorage.getItem("count");\nconsole.log(typeof val);',
   out:"string",
   note:"Every value read from localStorage comes back as a string, even if a number was stored."},
  {q:"What is the output?",
   code:'const btn = document.getElementById("go");\nbtn.addEventListener("click", () => console.log("first"));\nbtn.addEventListener("click", () => console.log("second"));\nbtn.click();',
   out:"first\nsecond",
   note:"addEventListener() supports multiple handlers on the same event \u2014 they run in the order they were added."},
  {q:"What is the output?",
   code:'console.log("start");\nfetch("https://api.example.com/ping").then(() => console.log("fetched"));\nconsole.log("end");',
   out:"start\nend\nfetched",
   note:"fetch() is asynchronous \u2014 synchronous lines finish first, the .then() callback runs later."}
];

/* ======================================================================
   SMALL UTILITIES
====================================================================== */

function esc(s){
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

function highlight(code){
  // true single-pass tokenizer: one regex scan left-to-right, classifying
  // each match as it's found, so tokens never get re-matched/corrupted by a
  // later pass (e.g. digits inside an already-classified token).
  var pattern = /(\/\/[^\n]*)|("(?:[^"\\]|\\.)*"|'(?:[^'\\]|\\.)*')|\b(const|let|var|function|return|if|else|for|while|new|typeof|true|false|null|undefined|async|await)\b|\b(\d+(?:\.\d+)?)\b|\b([a-zA-Z_$][\w$]*)(?=\()/g;
  var out = "";
  var lastIndex = 0;
  var m;
  while((m = pattern.exec(code)) !== null){
    out += esc(code.slice(lastIndex, m.index));
    if(m[1]!==undefined) out += '<span class="tok-com">'+esc(m[1])+'</span>';
    else if(m[2]!==undefined) out += '<span class="tok-str">'+esc(m[2])+'</span>';
    else if(m[3]!==undefined) out += '<span class="tok-kw">'+esc(m[3])+'</span>';
    else if(m[4]!==undefined) out += '<span class="tok-num">'+esc(m[4])+'</span>';
    else if(m[5]!==undefined) out += '<span class="tok-fn">'+esc(m[5])+'</span>';
    lastIndex = pattern.lastIndex;
  }
  out += esc(code.slice(lastIndex));
  return out;
}

  '<p>Five core methods retrieve nodes from the tree \u2014 know which return a <strong>single element</strong> versus a <strong>collection</strong>.</p>'+
  '<ul class="plain">'+
    '<li><strong>getElementById(id)</strong> \u2014 single element, fastest lookup.</li>'+
    '<li><strong>getElementsByClassName / TagName</strong> \u2014 live HTMLCollection.</li>'+
    '<li><strong>querySelector(css)</strong> \u2014 single element, or null.</li>'+
    '<li><strong>querySelectorAll(css)</strong> \u2014 static NodeList, has native <strong>.forEach()</strong>.</li>'+

slides.push(slideConcept("Concept \u00b7 03", "Live vs. static collections",
  '<p>This distinction is one of the most commonly tested traps in DOM programming.</p>'+
  '<ul class="plain">'+
    '<li><span class="badge">live</span> HTMLCollection (getElementsBy*) \u2014 auto-updates as the DOM changes.</li>'+
    '<li><span class="badge amber">static</span> NodeList (querySelectorAll) \u2014 a frozen snapshot at call time.</li>'+
    '<li><span class="badge">live</span> NodeList (childNodes) \u2014 also auto-updates, unlike its querySelectorAll cousin.</li>'+
  '</ul>'+
  '<p style="margin-top:14px">Rule of thumb: <strong>getElementsBy*</strong> methods are always live; <strong>querySelectorAll</strong> is always static.</p>', null));

slides.push(slideConcept("Concept \u00b7 04", "Traversal &amp; building the DOM",
  '<p>Nodes relate to each other as <strong>parent</strong>, <strong>child</strong>, and <strong>sibling</strong>. Watch for the &ldquo;text node trap&rdquo;: whitespace in your HTML source creates real text nodes.</p>'+

    '<li>Use <strong>.children</strong> / <strong>.firstElementChild</strong> to skip whitespace text nodes.</li>'+

slides.push(slideConcept("Concept \u00b7 05", "Events &amp; delegation",

/* ======================================================================
   RENDER + NAVIGATION ENGINE
====================================================================== */

var deckEl = document.getElementById("deck");
slides.forEach(function(html, i){
  var sec = document.createElement("section");
  sec.className = "slide";
  sec.setAttribute("data-index", i);
  sec.innerHTML = html;
  deckEl.appendChild(sec);
});
var slideEls = Array.prototype.slice.call(deckEl.children);
var total = slideEls.length;
var current = 0;

function pad(n){ return (n<10?"0":"")+n; }

function updateChrome(){
  document.getElementById("counter").innerHTML = "["+pad(current+1)+" / "+pad(total)+"]";
  document.getElementById("progressFill").style.width = (((current+1)/total)*100)+"%";
}

var navGen = 0;

function go(idx){
  if(idx<0||idx>=total||idx===current) return;
  var dir = idx>current ? 1 : -1;
  var oldEl = slideEls[current];
  var newEl = slideEls[idx];
  current = idx;
  updateChrome();
  navGen++;
  var gen = navGen;

  // Any slide that isn't part of THIS transition gets snapped straight to a
  // hidden resting state with no animation. This guarantees that very rapid
  // or repeated input (holding an arrow key, spamming right-click) can never
  // leave a stale slide half-visible ("ghosting").
  slideEls.forEach(function(el){
    if(el!==oldEl && el!==newEl){
      el.style.transition = "none";
      el.classList.remove("active","enter-right","enter-left","exit-left","exit-right");
      void el.offsetWidth;
      el.style.transition = "";
    }
  });

  // Force the incoming slide to a clean "about to enter" state in case it
  // was itself mid-transition a moment ago.
  newEl.style.transition = "none";
  newEl.classList.remove("active","enter-right","enter-left","exit-left","exit-right");
  newEl.classList.add(dir>0?"enter-right":"enter-left");
  void newEl.offsetWidth;
  newEl.style.transition = "";

  oldEl.classList.remove("enter-right","enter-left");
  oldEl.classList.remove("active");
  oldEl.classList.add(dir>0?"exit-left":"exit-right");

  requestAnimationFrame(function(){
    if(gen!==navGen) return; // superseded by a newer navigation - do nothing
    newEl.classList.add("active");
    newEl.classList.remove("enter-right","enter-left");
  });
  setTimeout(function(){
    oldEl.classList.remove("exit-left","exit-right");
  }, 420);
}

function next(){ go(current+1); }
function prev(){ go(current-1); }

slideEls[0].classList.add("active");
updateChrome();

/* ---- keyboard ---- */
var overlay = document.getElementById("shortcutsOverlay");
function toggleOverlay(force){
  var show = typeof force==="boolean" ? force : !overlay.classList.contains("show");
  overlay.classList.toggle("show", show);
}
document.addEventListener("keydown", function(e){
  if(e.key==="ArrowRight"){ next(); }
  else if(e.key==="ArrowLeft"){ prev(); }
  else if(e.key==="Home"){ go(0); }
  else if(e.key==="End"){ go(total-1); }
  else if(e.key==="?"){ toggleOverlay(); }
  else if(e.key==="Escape"){ toggleOverlay(false); }
});

/* ---- right-click = next, block context menu ---- */
document.addEventListener("contextmenu", function(e){
  e.preventDefault();
  next();
});

/* ---- mouse back/forward side buttons ---- */
document.addEventListener("mousedown", function(e){
  if(e.button===3){ e.preventDefault(); e.stopImmediatePropagation(); prev(); }
  else if(e.button===4){ e.preventDefault(); e.stopImmediatePropagation(); next(); }
}, true);
window.addEventListener("popstate", function(e){ e.preventDefault(); });

/* ---- swipe ---- */
var touchStartX=0, touchStartY=0;
document.addEventListener("touchstart", function(e){
  if(!e.touches || !e.touches.length) return;
  touchStartX = e.touches[0].clientX;
  touchStartY = e.touches[0].clientY;
}, {passive:true});
document.addEventListener("touchend", function(e){
  if(!e.changedTouches || !e.changedTouches.length) return;
  var dx = e.changedTouches[0].clientX - touchStartX;
  var dy = e.changedTouches[0].clientY - touchStartY;
  if(Math.abs(dx) > 55 && Math.abs(dx) > Math.abs(dy)*1.4){
    if(dx<0){ next(); } else { prev(); }
  }
}, {passive:true});

/* ---- copy buttons (event delegation) ---- */
document.addEventListener("click", function(e){
  var btn = e.target.closest ? e.target.closest(".copy-btn") : null;
  if(!btn) return;
  var id = btn.getAttribute("data-copy-target");
  var pre = document.getElementById(id);
  if(!pre) return;
  var raw = decodeURIComponent(pre.getAttribute("data-raw"));
  var done = function(){
    var original = btn.innerHTML;
    btn.classList.add("copied");
    btn.innerHTML = "Copied!";
    setTimeout(function(){ btn.classList.remove("copied"); btn.innerHTML = original; }, 1200);
  };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(raw).then(done).catch(function(){
      fallbackCopy(raw); done();
    });
  } else {
    fallbackCopy(raw); done();
  }
});
function fallbackCopy(text){
  var ta = document.createElement("textarea");
  ta.value = text; ta.style.position="fixed"; ta.style.opacity="0";
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand("copy"); }catch(err){}
  document.body.removeChild(ta);
}

/* small polyfill for e.target.closest in older engines (no-op if native exists) */
if(!Element.prototype.closest){
  Element.prototype.closest = function(sel){
    var el = this;
    while(el){ if(el.matches && el.matches(sel)) return el; el = el.parentElement; }
    return null;
  };
}

})();
