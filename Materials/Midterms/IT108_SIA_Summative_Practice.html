<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IT108 SIA · 30-Item Summative Practice</title>
<style>
  :root {
    --bg: #0B0F14;
    --panel: #121A24;
    --panel-2: #0F161F;
    --line: #22303F;
    --line-soft: #1A2532;
    --text: #E7EDF3;
    --text-dim: #AEC0D4;
    --text-faint: #7A8B9E;
    --teal: #2DD4BF;
    --teal-dim: #1B7A70;
    --amber: #F2A65A;
    --danger: #F2745A;
    --radius: 10px;
    --font-display: 'IBM Plex Mono', 'SFMono-Regular', Menlo, Consolas, monospace;
    --font-body: 'IBM Plex Sans', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }
  * { box-sizing: border-box; min-width: 0; }
  html, body {
    margin: 0; padding: 0; height: 100%; background: var(--bg); color: var(--text);
    font-family: var(--font-body); overflow: hidden; -webkit-font-smoothing: antialiased;
  }
  body {
    background-image:
      radial-gradient(circle at 12% 12%, rgba(45,212,191,0.06), transparent 42%),
      radial-gradient(circle at 88% 88%, rgba(242,166,90,0.05), transparent 42%);
  }
  #progress-track { position: fixed; top: 0; left: 0; right: 0; height: 3px; background: var(--line-soft); z-index: 100; }
  #progress-fill { height: 100%; width: 0%; background: linear-gradient(90deg, var(--teal), var(--amber)); transition: width .3s ease; }
  #counter {
    position: fixed; right: 22px; bottom: 18px; z-index: 100; font-family: var(--font-display);
    font-size: 16px; color: var(--text-dim); letter-spacing: 0.05em; background: rgba(18,26,36,0.75);
    padding: 6px 14px; border: 1px solid var(--line); border-radius: 999px; backdrop-filter: blur(6px);
  }
  #hint {
    position: fixed; left: 22px; bottom: 18px; z-index: 100; font-family: var(--font-display); font-size: 16px;
    color: var(--text-faint); letter-spacing: 0.03em;
  }
  #hint kbd {
    background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 2px 8px;
    color: var(--text-dim); font-family: var(--font-display); font-size: 15px;
  }
  #stage { position: relative; width: 100vw; height: 100vh; overflow: hidden; }
  .slide {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    padding: clamp(24px, 3.5vh, 48px) clamp(36px, 5.5vw, 96px);
    opacity: 0; transform: translateX(48px); pointer-events: none;
    transition: opacity .35s ease, transform .35s ease;
  }
  .slide.active { opacity: 1; transform: translateX(0); pointer-events: auto; z-index: 2; }
  .slide.prep-left { transform: translateX(-48px); opacity: 0; }
  .slide.prep-right { transform: translateX(48px); opacity: 0; }
  .slide.exit-left { transform: translateX(-48px); opacity: 0; }
  .slide.exit-right { transform: translateX(48px); opacity: 0; }
  @media (prefers-reduced-motion: reduce) {
    .slide { transition: opacity .01s linear; transform: none !important; }
  }
  .slide.overflow-ok { overflow-y: auto; }
  .eyebrow {
    font-family: var(--font-display); font-size: 16px; letter-spacing: 0.2em; color: var(--teal);
    text-transform: uppercase; display: flex; align-items: center; gap: 10px; margin-bottom: 10px;
  }
  .eyebrow::before {
    content: ''; width: 8px; height: 8px; border-radius: 50%; background: var(--teal);
    box-shadow: 0 0 0 3px rgba(45,212,191,0.15);
  }
  .eyebrow .trace {
    flex: 1; height: 1px;
    background: repeating-linear-gradient(90deg, var(--line) 0 6px, transparent 6px 11px);
  }
  h1.title {
    font-family: var(--font-display); font-weight: 700; font-size: clamp(26px, 3.4vw, 42px);
    letter-spacing: -0.01em; margin: 0 0 clamp(12px, 1.8vh, 22px) 0; color: var(--text); line-height: 1.15;
  }
  h1.title .accent { color: var(--amber); }
  .lede {
    font-size: clamp(16px, 1.15vw, 19px); color: var(--text-dim); max-width: 920px; line-height: 1.55; margin-bottom: 16px;
  }
  .content { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 14px; }
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; align-items: stretch; }
  .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
  .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  .card {
    background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 16px 18px; display: flex; flex-direction: column; gap: 8px;
  }
  .card h3 {
    margin: 0; font-size: 18px; color: var(--text); font-family: var(--font-display); font-weight: 600;
  }
  .card p { margin: 0; font-size: 16px; color: var(--text-dim); line-height: 1.5; }
  .card .tag {
    align-self: flex-start; font-family: var(--font-display); font-size: 13px; letter-spacing: 0.08em;
    color: var(--teal); border: 1px solid var(--teal-dim); padding: 2px 10px; border-radius: 999px; text-transform: uppercase;
  }
  ul.bullets { margin: 0; padding-left: 20px; color: var(--text-dim); font-size: 16px; line-height: 1.65; }
  ul.bullets li { margin-bottom: 6px; }
  ul.bullets li b, ul.bullets li strong { color: var(--text); }
  .quote-block {
    border-left: 3px solid var(--amber); background: var(--panel); border-radius: 0 var(--radius) var(--radius) 0;
    padding: 16px 20px; font-style: italic; color: var(--text); font-size: clamp(16px, 1.25vw, 20px); line-height: 1.6;
  }
  table.term-table { width: 100%; border-collapse: collapse; font-size: 16px; }
  table.term-table th {
    text-align: left; font-family: var(--font-display); font-size: 14px; letter-spacing: 0.06em;
    text-transform: uppercase; color: var(--teal); border-bottom: 1px solid var(--line); padding: 8px 10px;
  }
  table.term-table td {
    border-bottom: 1px solid var(--line-soft); padding: 9px 10px; color: var(--text-dim); vertical-align: top;
  }
  table.term-table td b { color: var(--text); }
  .node {
    background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 12px 16px; text-align: center; font-size: 16px; color: var(--text); min-width: 120px;
  }
  .node.hi { border-color: var(--teal-dim); box-shadow: 0 0 0 3px rgba(45,212,191,0.08); }
  .node .n-label {
    font-family: var(--font-display); font-size: 13px; color: var(--teal); letter-spacing: 0.06em;
    text-transform: uppercase; display: block; margin-bottom: 4px;
  }
  .flow-row { display: flex; align-items: center; justify-content: center; gap: 0; flex-wrap: wrap; }
  .arrow-h {
    width: clamp(28px, 3.5vw, 56px); height: 2px;
    background: repeating-linear-gradient(90deg, var(--teal) 0 6px, transparent 6px 10px); position: relative;
  }
  .arrow-h::after {
    content: ''; position: absolute; right: -1px; top: -4px;
    border: 5px solid transparent; border-left-color: var(--teal);
  }
  .code-wrap {
    position: relative; background: #0D1319; border: 1px solid var(--line); border-radius: var(--radius);
    overflow: hidden; display: flex; flex-direction: column; min-height: 0; flex: 1;
  }
  .code-head {
    display: flex; align-items: center; justify-content: space-between; padding: 8px 14px;
    border-bottom: 1px solid var(--line); background: #0F161F; flex-shrink: 0;
  }
  .code-lang {
    font-family: var(--font-display); font-size: 14px; letter-spacing: 0.08em; color: var(--text-dim); text-transform: uppercase;
  }
  .copy-btn {
    font-family: var(--font-display); font-size: 14px; color: var(--text-dim); background: var(--panel);
    border: 1px solid var(--line); border-radius: 6px; padding: 5px 12px; cursor: pointer; transition: all .15s;
  }
  .copy-btn:hover { color: var(--teal); border-color: var(--teal-dim); }
  .copy-btn.copied { color: var(--teal); border-color: var(--teal); }
  .code-body { padding: 14px 16px; overflow: auto; font-size: 15px; line-height: 1.55; flex: 1; min-height: 0; }
  .code-body pre { margin: 0; white-space: pre; font-family: var(--font-display); }
  .tok-key { color: #6FA8DC; } .tok-str { color: var(--teal); } .tok-num { color: #C792EA; }
  .tok-bool { color: #C792EA; } .tok-punc { color: var(--text-faint); } .tok-comment { color: var(--text-faint); font-style: italic; }
  .tok-fn { color: #D2A8FF; }
  .qa-list { display: flex; flex-direction: column; gap: 12px; overflow-y: auto; }
  .qa-item {
    background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px;
  }
  .qa-item .qnum { font-family: var(--font-display); color: var(--amber); font-size: 15px; margin-right: 8px; }
  .qa-item .qtext { color: var(--text); font-size: 16px; }
  .choices { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 16px; margin-top: 8px; }
  .choice { font-size: 16px; color: var(--text-dim); }
  .choice b { color: var(--teal); font-family: var(--font-display); margin-right: 6px; }
  .answers-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 24px; overflow-y: auto; }
  .ans-block h4 {
    font-family: var(--font-display); color: var(--teal); font-size: 15px; letter-spacing: 0.06em;
    text-transform: uppercase; margin: 0 0 8px 0;
  }
  .ans-item { font-size: 15px; color: var(--text-dim); margin-bottom: 6px; line-height: 1.45; }
  .ans-item b { color: var(--text); }
  .recap-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
  .recap-grid .card { align-items: center; text-align: center; }
  .recap-grid .num { font-family: var(--font-display); font-size: 24px; color: var(--amber); }
  .title-slide { align-items: center; justify-content: center; text-align: center; }
  .title-slide .kicker {
    font-family: var(--font-display); color: var(--teal); letter-spacing: 0.28em; font-size: 16px;
    margin-bottom: 18px; text-transform: uppercase;
  }
  .title-slide h1 {
    font-family: var(--font-display); font-size: clamp(34px, 5.5vw, 64px); margin: 0; line-height: 1.1;
  }
  .title-slide h1 .accent { color: var(--amber); }
  .title-slide .sub {
    margin-top: 18px; color: var(--text-dim); font-size: clamp(16px, 1.25vw, 20px); max-width: 720px;
  }
  .title-slide .trace-line {
    margin-top: 36px; width: min(560px, 55vw); height: 1px;
    background: repeating-linear-gradient(90deg, var(--line) 0 8px, transparent 8px 14px); position: relative;
  }
  .title-slide .trace-line::before, .title-slide .trace-line::after {
    content: ''; position: absolute; top: -3px; width: 7px; height: 7px; border-radius: 50%; background: var(--teal);
  }
  .title-slide .trace-line::before { left: 0; }
  .title-slide .trace-line::after { right: 0; }
  #shortcuts-modal {
    position: fixed; inset: 0; background: rgba(5,8,12,0.78); backdrop-filter: blur(3px); z-index: 200;
    display: none; align-items: center; justify-content: center;
  }
  #shortcuts-modal.show { display: flex; }
  #shortcuts-modal .box {
    background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 28px 34px;
    max-width: 460px; width: 90%;
  }
  #shortcuts-modal h2 { font-family: var(--font-display); font-size: 20px; margin: 0 0 16px 0; color: var(--teal); }
  #shortcuts-modal .row {
    display: flex; justify-content: space-between; font-size: 16px; color: var(--text-dim);
    padding: 8px 0; border-bottom: 1px solid var(--line-soft);
  }
  #shortcuts-modal .row kbd {
    background: var(--panel-2); border: 1px solid var(--line); border-radius: 5px; padding: 3px 10px;
    color: var(--text); font-family: var(--font-display);
  }
  #shortcuts-modal .close-hint { margin-top: 16px; font-size: 15px; color: var(--text-faint); text-align: center; }
  .diagram-wrap { display: flex; justify-content: center; align-items: center; padding: 8px 0; }
  .badge-row { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-top: 14px; }
  .badge {
    background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 8px 16px;
    font-size: 16px; font-family: var(--font-display); color: var(--text-dim);
  }
  .badge.teal { color: var(--teal); border-color: var(--teal-dim); }
  .badge.amber { color: var(--amber); border-color: rgba(242,166,90,0.4); }
  @media (max-width: 900px) {
    .grid-2, .grid-3, .grid-4, .recap-grid, .answers-grid, .choices { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div id="progress-track"><div id="progress-fill"></div></div>
<div id="counter">1 / 22</div>
<div id="hint">Right-click / <kbd>→</kbd> next · <kbd>←</kbd> back · <kbd>?</kbd> shortcuts</div>
<div id="stage"></div>
<div id="shortcuts-modal">
  <div class="box">
    <h2>Keyboard &amp; Mouse Shortcuts</h2>
    <div class="row"><span>Next slide</span><kbd>→</kbd></div>
    <div class="row"><span>Previous slide</span><kbd>←</kbd></div>
    <div class="row"><span>First / Last</span><kbd>Home</kbd> / <kbd>End</kbd></div>
    <div class="row"><span>Next slide</span><span>Right-click</span></div>
    <div class="row"><span>Next / Prev</span><span>Mouse 4 / 3</span></div>
    <div class="row"><span>This panel</span><kbd>?</kbd></div>
    <div class="close-hint">Press Esc or click outside to close</div>
  </div>
</div>
<script>
(function () {
  "use strict";

  const slides = [];

  function S(html) { slides.push(html); }

  // 1 Title
  S(`
  <section class="slide title-slide">
    <div class="kicker">IT108 · System Integration &amp; Architecture</div>
    <h1>30-Item Summative<br><span class="accent">Practice Exam</span></h1>
    <div class="sub">A focused warm-up covering integration methods, SOA/REST, middleware, testing, usability, and Node.js API basics — before the real midterm.</div>
    <div class="badge-row">
      <span class="badge teal">25 MC / ID / ENUM</span>
      <span class="badge amber">5 Guess-the-Output</span>
      <span class="badge">Modules 5 · 6 · 8 · 10 · 11 · 12</span>
    </div>
    <div class="trace-line"></div>
  </section>`);

  // 2 How to use
  S(`
  <section class="slide">
    <div class="eyebrow">Prep<span class="trace"></span></div>
    <h1 class="title">How to Use This Deck</h1>
    <div class="content grid-2">
      <div class="card">
        <span class="tag">Review First</span>
        <h3>Concept slides</h3>
        <p>Quick refreshers with diagrams. Skim if you already know the material; linger on anything that feels fuzzy.</p>
      </div>
      <div class="card">
        <span class="tag">Then Practice</span>
        <h3>30 items</h3>
        <p>Multiple choice, identification, enumeration, and Guess-the-Output (Node.js). Answers appear on the answer-key slides near the end.</p>
      </div>
      <div class="card">
        <span class="tag">Navigation</span>
        <h3>Keyboard &amp; mouse</h3>
        <p>→ or right-click for next · ← for back · ? for shortcuts · Home / End for first / last.</p>
      </div>
      <div class="card">
        <span class="tag">Goal</span>
        <h3>Spot weak spots</h3>
        <p>Treat misses as study targets for the actual midterm — especially ESB vs Star, REST constraints, and async messaging.</p>
      </div>
    </div>
  </section>`);

  // 3 Integration methods
  S(`
  <section class="slide">
    <div class="eyebrow">Review · Module 5<span class="trace"></span></div>
    <h1 class="title">Four Integration Methods</h1>
    <div class="content grid-2">
      <div class="card">
        <span class="tag">01</span>
        <h3>Point-to-Point</h3>
        <p>Direct link between two systems. Simple, but every pair needs its own connection.</p>
      </div>
      <div class="card">
        <span class="tag">02</span>
        <h3>Vertical / Star</h3>
        <p>Functional silos or full mesh. Star formula: <b>N(N−1)/2</b> — 10 systems = 45 links.</p>
      </div>
      <div class="card">
        <span class="tag">03</span>
        <h3>Horizontal (ESB)</h3>
        <p>Central bus. Each system needs only one connection. Scales linearly.</p>
      </div>
      <div class="card">
        <span class="tag">04</span>
        <h3>Common Data Format</h3>
        <p>Everyone converts to/from one shared format. Adding a system costs one converter.</p>
      </div>
    </div>
  </section>`);

  // 4 ESB diagram
  S(`
  <section class="slide">
    <div class="eyebrow">Review · Module 5<span class="trace"></span></div>
    <h1 class="title">Why ESB Beats Spaghetti</h1>
    <div class="lede">Star mesh grows exponentially. A horizontal bus keeps connections equal to the number of systems.</div>
    <div class="content diagram-wrap">
      <svg viewBox="0 0 680 220" width="100%" style="max-width:720px;height:auto;" role="img" aria-label="ESB hub diagram">
        <title>Enterprise Service Bus with four systems</title>
        <rect x="240" y="90" width="200" height="44" rx="8" fill="#121A24" stroke="#1B7A70" stroke-width="2"/>
        <text x="340" y="118" text-anchor="middle" fill="#2DD4BF" font-family="monospace" font-size="16">Enterprise Service Bus</text>
        <rect x="40" y="20" width="120" height="40" rx="6" fill="#121A24" stroke="#22303F"/>
        <text x="100" y="45" text-anchor="middle" fill="#E7EDF3" font-size="15">System A</text>
        <rect x="520" y="20" width="120" height="40" rx="6" fill="#121A24" stroke="#22303F"/>
        <text x="580" y="45" text-anchor="middle" fill="#E7EDF3" font-size="15">System B</text>
        <rect x="40" y="160" width="120" height="40" rx="6" fill="#121A24" stroke="#22303F"/>
        <text x="100" y="185" text-anchor="middle" fill="#E7EDF3" font-size="15">System C</text>
        <rect x="520" y="160" width="120" height="40" rx="6" fill="#121A24" stroke="#22303F"/>
        <text x="580" y="185" text-anchor="middle" fill="#E7EDF3" font-size="15">System D</text>
        <line x1="160" y1="40" x2="280" y2="100" stroke="#2DD4BF" stroke-width="1.5" stroke-dasharray="4 3"/>
        <line x1="520" y1="40" x2="400" y2="100" stroke="#2DD4BF" stroke-width="1.5" stroke-dasharray="4 3"/>
        <line x1="160" y1="180" x2="280" y2="120" stroke="#2DD4BF" stroke-width="1.5" stroke-dasharray="4 3"/>
        <line x1="520" y1="180" x2="400" y2="120" stroke="#2DD4BF" stroke-width="1.5" stroke-dasharray="4 3"/>
      </svg>
    </div>
  </section>`);

  // 5 SOA + REST
  S(`
  <section class="slide">
    <div class="eyebrow">Review · Module 6<span class="trace"></span></div>
    <h1 class="title">SOA Principles &amp; REST vs SOAP</h1>
    <div class="content grid-2">
      <div class="card">
        <h3>SOA pillars</h3>
        <ul class="bullets">
          <li><b>Loose Coupling</b> — interface stable, internals free to change</li>
          <li><b>Reusability</b> — services shared across apps</li>
          <li><b>Interoperability</b> — open standards</li>
          <li><b>Abstraction</b> — hide internal logic</li>
        </ul>
      </div>
      <div class="card">
        <h3>REST vs SOAP</h3>
        <ul class="bullets">
          <li><b>SOAP</b> — strict protocol, XML only, heavy, enterprise security</li>
          <li><b>REST</b> — style, multi-format (JSON preferred), HTTP verbs, lightweight</li>
          <li>Microservices = fine-grained SOA with independent deploy + own DB</li>
        </ul>
      </div>
    </div>
  </section>`);

  // 6 Middleware
  S(`
  <section class="slide">
    <div class="eyebrow">Review · Module 8<span class="trace"></span></div>
    <h1 class="title">Middleware &amp; Messaging</h1>
    <div class="content">
      <div class="flow-row" style="margin-bottom:12px;">
        <div class="node hi"><span class="n-label">App</span>Clients</div>
        <div class="arrow-h"></div>
        <div class="node"><span class="n-label">Glue</span>Middleware / MOM</div>
        <div class="arrow-h"></div>
        <div class="node hi"><span class="n-label">Backend</span>Services · DB</div>
      </div>
      <div class="grid-2">
        <div class="card">
          <h3>Queue (Point-to-Point)</h3>
          <p>One-to-one. Single consumer removes the message. Ideal for work queues.</p>
        </div>
        <div class="card">
          <h3>Topic (Pub/Sub)</h3>
          <p>One-to-many. Every active subscriber gets a copy. Ideal for events.</p>
        </div>
      </div>
    </div>
  </section>`);

  // 7 Testing + Deploy
  S(`
  <section class="slide">
    <div class="eyebrow">Review · Module 10<span class="trace"></span></div>
    <h1 class="title">Testing Pyramid &amp; Deploy Strategies</h1>
    <div class="content grid-2">
      <div class="card">
        <h3>Pyramid (bottom → top)</h3>
        <ul class="bullets">
          <li><b>Unit</b> — most tests, fastest, cheapest</li>
          <li><b>Integration (SIT)</b> — component communication</li>
          <li><b>Acceptance (UAT)</b> — fewest, business workflows</li>
        </ul>
      </div>
      <div class="card">
        <h3>Deployment</h3>
        <ul class="bullets">
          <li><b>Blue-Green</b> — two environments, instant switch, zero downtime</li>
          <li><b>Canary</b> — small % of users first, limit blast radius</li>
          <li><b>CI</b> — frequent merges + automated build/test</li>
        </ul>
      </div>
    </div>
  </section>`);

  // 8 Usability + API
  S(`
  <section class="slide">
    <div class="eyebrow">Review · Modules 11–12<span class="trace"></span></div>
    <h1 class="title">Usability + REST APIs</h1>
    <div class="content grid-2">
      <div class="card">
        <h3>Usability essentials</h3>
        <ul class="bullets">
          <li>ISO 9241-11: effectiveness, efficiency, satisfaction</li>
          <li>5 requirements: learn, use, recall, low error, satisfaction</li>
          <li><b>Slip</b> = right goal, wrong action · <b>Mistake</b> = wrong goal</li>
          <li>SUS: 10 questions → score 0–100</li>

    if (i === 0) el.classList.add('active');

  const all = Array.from(stage.querySelectorAll('.slide'));
  const total = all.length;
  let idx = 0;
  const fill = document.getElementById('progress-fill');
  const counter = document.getElementById('counter');
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function update() {
    fill.style.width = ((idx + 1) / total * 100) + '%';
    counter.textContent = (idx + 1) + ' / ' + total;
  }
  update();

  function goTo(n, dir) {
    n = Math.max(0, Math.min(total - 1, n));
    if (n === idx) return;
    const cur = all[idx];
    const next = all[n];
    if (reduce) {
      cur.classList.remove('active');
      next.classList.add('active');
      idx = n; update(); return;
    }
    cur.classList.remove('active');
    cur.classList.add(dir > 0 ? 'exit-left' : 'exit-right');
    next.classList.remove('exit-left', 'exit-right', 'prep-left', 'prep-right');
    next.classList.add(dir > 0 ? 'prep-right' : 'prep-left');
    void next.offsetWidth;
    requestAnimationFrame(() => {
      next.classList.remove('prep-left', 'prep-right');
      next.classList.add('active');
    });
    setTimeout(() => cur.classList.remove('exit-left', 'exit-right'), 380);
    idx = n; update();
  }
  function next() { goTo(idx + 1, 1); }
  function prev() { goTo(idx - 1, -1); }

  function isInteractive(el) {
    return !!(el.closest && el.closest('button, a, input, textarea, select, [contenteditable="true"], .copy-btn'));
  }

  document.addEventListener('keydown', e => {
    const modal = document.getElementById('shortcuts-modal');
    if (e.key === '?') { modal.classList.toggle('show'); return; }
    if (modal.classList.contains('show')) {
      if (e.key === 'Escape') modal.classList.remove('show');
      return;
    }
    if (e.key === 'ArrowRight') next();
    else if (e.key === 'ArrowLeft') prev();
    else if (e.key === 'Home') goTo(0, -1);
    else if (e.key === 'End') goTo(total - 1, 1);
  });

  document.getElementById('shortcuts-modal').addEventListener('click', function (e) {
    if (e.target === this) this.classList.remove('show');
  });

  let fired = false;
  document.addEventListener('mousedown', e => {
    if (isInteractive(e.target)) return;
    if (e.button === 2) {

      if (!fired) { next(); fired = true; }
    } else if (e.button === 3) {

  const samples = {
    gto29: `const http = require('http');\n\nconst server = http.createServer((req, res) => {\n  res.setHeader('Content-Type', 'application/json');\n  res.statusCode = 200;\n  res.end(JSON.stringify({ status: 'ok' }));\n});\n\nserver.listen(3000, () => {\n  console.log('Server running');\n});`,
    gto30: `const http = require('http');\n\nconst server = http.createServer((req, res) => {\n  res.setHeader('Content-Type', 'application/json');\n  if (req.method === 'POST' && req.url === '/api/echo') {\n    let body = '';\n    req.on('data', chunk => { body += chunk; });\n    req.on('end', () => {\n      const parsed = JSON.parse(body);\n      res.statusCode = 200;\n      res.end(JSON.stringify({ received: parsed }));\n    });\n  } else {\n    res.statusCode = 404;\n    res.end(JSON.stringify({ error: 'Not Found' }));\n  }\n});\n\nserver.listen(3000);`
  };

  function esc(s) {
    return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }
  function tokenizeJS(code) {
    const re = /(\/\/[^\n]*)|(\`(?:\\.|[^\`\\])*\`)|("(?:\\.|[^"\\])*"|'(?:\\.|[^'\\])*')|\b(async|await|function|const|let|var|try|catch|throw|new|return|if|typeof|require)\b|\b(true|false|null|undefined)\b|\b(\d+\.?\d*)\b|([{}()\[\],;:])/g;
    return code.replace(re, (m, comment, template, str, kw, boolnull, num, punc) => {
      if (comment) return '<span class="tok-comment">' + esc(comment) + '</span>';
      if (template) return '<span class="tok-str">' + esc(template) + '</span>';
      if (str) return '<span class="tok-str">' + esc(str) + '</span>';
      if (kw) return '<span class="tok-key">' + esc(kw) + '</span>';
      if (boolnull) return '<span class="tok-bool">' + esc(boolnull) + '</span>';
      if (num) return '<span class="tok-num">' + esc(num) + '</span>';
      if (punc) return '<span class="tok-punc">' + esc(punc) + '</span>';
      return esc(m);
    });
  }

  Object.keys(samples).forEach(id => {
    const el = document.getElementById(id);
    if (el) el.innerHTML = tokenizeJS(samples[id]);
  });

  document.querySelectorAll('.copy-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const id = btn.getAttribute('data-copy');
      const text = samples[id] || '';
      const done = () => {
        const orig = btn.textContent;
        btn.textContent = 'Copied!';
        btn.classList.add('copied');
        setTimeout(() => { btn.textContent = 'Copy'; btn.classList.remove('copied'); }, 1200);
      };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(done, () => { fallback(text); done(); });
      } else { fallback(text); done(); }
    });
  });
  function fallback(text) {
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); } catch (e) {}
    document.body.removeChild(ta);
  }
})();
</script>
</body>
