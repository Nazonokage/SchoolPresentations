<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Summative Exam · Web Systems</title>
    <style>
        /* ── reset & base ── */
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        :root {
            --bg: #0b0f19;
            --surface: #111827;
            --surface2: #1c2536;
            --border: #253044;
            --border2: #2d3f58;
            --accent: #38bdf8;
            --accent2: #34d399;
            --accent3: #fb923c;
            --accent4: #c084fc;
            --accent5: #f472b6;
            --text: #f1f5f9;
            --text2: #94a3b8;
            --text3: #cbd5e1;
            --card: #141e2e;
            --card2: #172032;
            --font: 'Inter', system-ui, sans-serif;
            --mono: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', monospace;
            --r: 8px;
            --r2: 12px;
            --tr: 350ms cubic-bezier(.4, 0, .2, 1);
        }
        html,
        body {
            height: 100%;
            overflow: hidden;
            background: var(--bg);
            color: var(--text);
            font-family: var(--font);
            font-size: 16px;
            line-height: 1.6;
        }
        /* ── chrome ── */
        #bar {
            position: fixed;
            top: 0;
            left: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--accent), var(--accent4));
            transition: width .3s;
            z-index: 100;
            border-radius: 0 2px 2px 0;
        }
        #ctr {
            position: fixed;
            top: 10px;
            right: 16px;
            font-size: 16px;
            color: var(--text2);
            z-index: 100;
            font-variant-numeric: tabular-nums;
            font-family: var(--mono);
            letter-spacing: .5px;
        }
        /* ── deck ── */
        #deck {
            width: 100%;
            height: 100vh;
            position: relative;
            overflow: hidden;
        }
        .slide {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            padding: 52px 64px 36px;
            opacity: 0;
            pointer-events: none;
            transform: translateX(48px);
            transition: opacity var(--tr), transform var(--tr);
            overflow-y: auto;
        }
        .slide.active {
            opacity: 1;
            pointer-events: all;
            transform: translateX(0);
        }
        .slide.out-l {
            opacity: 0;
            transform: translateX(-48px);
        }
        .slide.out-r {
            opacity: 0;
            transform: translateX(48px);
        }
        @media(prefers-reduced-motion:reduce) {
            .slide {
                transition: opacity .15s;
                transform: none !important;
            }
        }
        /* ── typography ── */
        .eyebrow {
            font-size: 16px;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--accent);
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .eyebrow::before {
            content: '';
            display: inline-block;
            width: 24px;
            height: 2px;
            background: var(--accent);
            border-radius: 1px;
        }
        .slide-title {
            font-size: clamp(28px, 3.6vw, 48px);
            font-weight: 800;
            line-height: 1.1;
            color: var(--text);
            margin-bottom: 6px;
            letter-spacing: -.5px;
        }
        .slide-sub {
            font-size: 18px;
            color: var(--text2);
            margin-bottom: 24px;
            font-weight: 400;
        }
        .rule {
            height: 1px;
            background: linear-gradient(90deg, var(--border2), transparent);
            border: none;
            margin-bottom: 22px;
        }
        /* ── content helpers ── */
        .content {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 14px;
            min-height: 0;
        }
        .g2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
            min-height: 0;
        }
        .g3 {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 12px;
        }
        .g2>*,
        .g3>* {
            min-width: 0;
        }
        .split {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px;
            flex: 1;
            min-height: 0;
        }
        .split>* {
            min-width: 0;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .col {
            display: flex;
            flex-direction: column;
            gap: 10px;
            min-width: 0;
        }
        .flex1 {
            flex: 1;
        }
        /* ── cards ── */
        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--r2);
            padding: 16px 18px;
        }
        .card h3 {
            font-size: 16px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--accent);
            margin-bottom: 10px;
        }
        .card p,
        .card li {
            font-size: 16px;
            color: var(--text3);
            line-height: 1.7;
        }
        .card ul {
            padding-left: 20px;
        }
        .card li {
            margin-bottom: 4px;
        }
        /* ── code blocks ── */
        .cw {
            position: relative;
            background: #070c15;
            border: 1px solid var(--border);
            border-radius: var(--r);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        .cl {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 7px 12px;
            background: #0d1421;
            border-bottom: 1px solid var(--border);
            font-size: 16px;
            color: var(--text2);
            font-family: var(--mono);
            flex-shrink: 0;
        }
        .cl span {
            color: var(--accent3);
        }
        .cw pre {
            padding: 12px 14px;
            overflow: auto;
            font-family: var(--mono);
            font-size: 15px;
            line-height: 1.7;
            white-space: pre;
            flex: 1;
            min-height: 0;
            max-height: 400px;
        }
        .cpbtn {
            padding: 3px 10px;
            font-size: 16px;
            font-family: var(--font);
            background: var(--surface2);
            border: 1px solid var(--border2);
            color: var(--text2);
            border-radius: 4px;
            cursor: pointer;
            transition: all .2s;
            white-space: nowrap;
            box-shadow: 0 2px 4px rgba(0, 0, 0, .3), inset 0 1px 0 rgba(255, 255, 255, .05);
        }
        .cpbtn:hover {
            background: var(--accent);
            color: #fff;
            border-color: var(--accent);
            box-shadow: 0 2px 6px rgba(56, 189, 248, .3);
        }
        .cpbtn.ok {
            background: var(--accent2);
            color: #fff;
            border-color: var(--accent2);
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, .3);
            transform: scale(.96);
        }
        /* syntax */
        .k {
            color: #f472b6;
        }
        .s {
            color: #86efac;
        }
        .f {
            color: #c4b5fd;
        }
        .n {
            color: #7dd3fc;
        }
        .c {
            color: #4b5563;
            font-style: italic;
        }
        .t {
            color: #fca5a5;
        }
        .op {
            color: #94a3b8;
        }
        .b {
            color: #fcd34d;
        }
        /* ── inline code ── */
        ic {
            background: var(--surface2);
            padding: 1px 6px;
            border-radius: 4px;
            font-family: var(--mono);
            font-size: 15px;
            color: var(--accent4);
            border: 1px solid var(--border);
        }
        /* ── breakdown items ── */
        .bd {
            display: flex;
            flex-direction: column;
            gap: 7px;
        }
        .bdi {
            display: flex;
            gap: 10px;
            align-items: flex-start;
            padding: 9px 11px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 6px;
            border-left: 3px solid var(--accent);
        }
        .bdi.g {
            border-left-color: var(--accent2);
        }
        .bdi.o {
            border-left-color: var(--accent3);
        }
        .bdi.p {
            border-left-color: var(--accent4);
        }
        .bdi.r {
            border-left-color: var(--accent5);
        }
        .bdl {
            font-family: var(--mono);
            font-size: 14px;
            color: var(--accent);
            background: #070c15;
            padding: 2px 7px;
            border-radius: 3px;
            white-space: nowrap;
            min-width: fit-content;
            align-self: flex-start;
            margin-top: 1px;
            flex-shrink: 0;
        }
        .bdt {
            font-size: 16px;
            color: var(--text3);
            line-height: 1.6;
        }
        .bdt strong {
            color: var(--text);
            font-weight: 600;
        }
        /* ── pills ── */
        .pill {
            display: inline-block;
            padding: 3px 11px;
            border-radius: 20px;
            font-size: 16px;
            font-weight: 600;
            border: 1px solid var(--border);
            color: var(--text2);
            margin: 3px;
        }
        .pill.a {
            border-color: var(--accent);
            color: var(--accent);
            background: rgba(56, 189, 248, .1);
        }
        .pill.g {
            border-color: var(--accent2);
            color: var(--accent2);
            background: rgba(52, 211, 153, .1);
        }
        .pill.o {
            border-color: var(--accent3);
            color: var(--accent3);
            background: rgba(251, 146, 60, .1);
        }
        /* ── exam question cards ── */
        .exam-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            flex: 1;
            min-height: 0;
            align-content: start;
        }
        .exam-item {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--r2);
            padding: 14px 16px;
        }
        .exam-item h4 {
            font-size: 16px;
            font-weight: 700;
            color: var(--accent);
            margin-bottom: 6px;
        }
        .exam-item p,
        .exam-item li {
            font-size: 16px;
            color: var(--text3);
            line-height: 1.6;
        }
        .exam-item .qn {
            color: var(--accent3);
            font-weight: 800;
            margin-right: 4px;
        }
        .exam-item .opts {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 4px 12px;
            margin-top: 6px;
        }
        .exam-item .opts span {
            font-size: 16px;
            color: var(--text2);
        }
        .exam-item .code-snip {
            background: #070c15;
            border-radius: 4px;
            padding: 8px 10px;
            font-family: var(--mono);
            font-size: 15px;
            color: var(--text3);
            white-space: pre;
            overflow-x: auto;
            margin: 6px 0 4px;
            border: 1px solid var(--border);
        }
        .exam-item .answer-blank {
            display: inline-block;
            border-bottom: 2px solid var(--accent);
            min-width: 100px;
            margin: 0 4px;
        }
        .exam-item .scenario {
            font-style: italic;
            color: var(--text2);
        }
        /* ── recap icons ── */
        .recap-icon {
            font-size: 28px;
            margin-right: 8px;
        }
        .recap-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 12px;
        }
        .recap-item {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--r);
            padding: 12px 14px;
            text-align: center;
        }
        .recap-item .ico {
            font-size: 32px;
            margin-bottom: 6px;
        }
        .recap-item h4 {
            font-size: 16px;
            font-weight: 700;
            color: var(--accent);
            margin-bottom: 4px;
        }
        .recap-item p {
            font-size: 16px;
            color: var(--text2);
            line-height: 1.5;
        }
        /* ── hero / title ── */
        .hero-slide {
            background: radial-gradient(ellipse at 15% 60%, rgba(56, 189, 248, .12) 0%, transparent 55%),
                radial-gradient(ellipse at 80% 20%, rgba(192, 132, 252, .08) 0%, transparent 50%),
                var(--bg);
        }
        .hero-title {
            font-size: clamp(48px, 5.5vw, 76px);
            font-weight: 900;
            line-height: 1.02;
            letter-spacing: -1.5px;
        }
        .hero-title .h1 {
            color: var(--text);
        }
        .hero-title .h2 {
            color: var(--accent);
        }
        .hero-sub {
            font-size: 18px;
            color: var(--text2);
            max-width: 600px;
            line-height: 1.7;
            margin: 14px 0 20px;
        }
        .dot-grid {
            position: absolute;
            inset: 0;
            background-image: radial-gradient(rgba(56, 189, 248, .06) 1px, transparent 1px);
            background-size: 32px 32px;
            pointer-events: none;
        }
        .logo-row {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            margin-top: 10px;
        }
        .logo-row svg {
            height: 40px;
            width: auto;
            filter: drop-shadow(0 0 6px rgba(56, 189, 248, .2));
        }
        /* ── quote ── */
        .quote-slide {
            justify-content: center;
            align-items: center;
            text-align: center;
        }
        .quote-slide blockquote {
            font-size: 28px;
            font-weight: 300;
            color: var(--text3);
            max-width: 800px;
            line-height: 1.5;
            border-left: 4px solid var(--accent);
            padding-left: 24px;
            margin: 0 auto;
        }
        .quote-slide blockquote footer {
            font-size: 18px;
            color: var(--text2);
            margin-top: 12px;
        }
        /* ── modal ── */
        #modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, .8);
            z-index: 200;
            align-items: center;
            justify-content: center;
        }
        #modal.open {
            display: flex;
        }
        .mbox {
            background: var(--surface);
            border: 1px solid var(--border2);
            border-radius: 14px;
            padding: 28px 32px;
            min-width: 340px;
        }
        .mbox h3 {
            font-size: 18px;
            font-weight: 700;
            color: var(--accent);
            margin-bottom: 16px;
        }
        .shr {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 7px 0;
            border-bottom: 1px solid var(--border);
            font-size: 16px;
            color: var(--text3);
        }
        .shr:last-of-type {
            border: none;
        }
        .shr kbd {
            background: var(--surface2);
            border: 1px solid var(--border2);
            border-radius: 4px;
            padding: 2px 8px;
            font-family: var(--mono);
            font-size: 14px;
            color: var(--text);
        }
        .mcl {
            margin-top: 18px;
            width: 100%;
            padding: 9px;
            background: var(--accent);
            color: #0b0f19;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 700;
            font-family: var(--font);
        }
        #hint {
            position: fixed;
            bottom: 16px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 16px;
            color: var(--text2);
            letter-spacing: .5px;
            pointer-events: none;
            opacity: .4;
            font-family: var(--mono);
        }
        /* responsive */
        @media(max-width:800px) {
            .slide {
                padding: 36px 24px 24px;
            }
            .g2,
            .split,
            .exam-grid {
                grid-template-columns: 1fr;
            }
            .hero-title {
                font-size: 32px;
            }
            .logo-row svg {
                height: 30px;
            }
            .exam-item .opts {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div id="bar"></div>
    <div id="ctr"></div>
    <div id="deck"></div>
    <div id="hint">right-click or → to advance &nbsp;·&nbsp; ? for shortcuts</div>
    <div id="modal">
        <div class="mbox">
            <h3>⌨ Keyboard Shortcuts</h3>
            <div class="shr"><span>Next slide</span><span><kbd>→</kbd> or <kbd>Right-click</kbd></span></div>
            <div class="shr"><span>Prev slide</span><span><kbd>←</kbd></span></div>
            <div class="shr"><span>First slide</span><span><kbd>Home</kbd></span></div>
            <div class="shr"><span>Last slide</span><span><kbd>End</kbd></span></div>
            <div class="shr"><span>Shortcuts</span><span><kbd>?</kbd></span></div>
            <div class="shr"><span>Close</span><span><kbd>Esc</kbd></span></div>
            <button class="mcl" onclick="document.getElementById('modal').classList.remove('open')">Close</button>
        </div>
    </div>
    <script>
        // ── syntax highlighting ──
        function hl(code) {
            const KW = /\b(const|let|var|function|return|async|await|try|catch|throw|new|class|extends|if|else|for|while|of|in|from|import|export|default|module|require|true|false|null|undefined|typeof|instanceof|delete|void|yield|super|this)\b/;
            const TY = /\b(console|process|fs|path|http|express|JSON|Object|Array|Math|Promise|Error|module|exports|fetch|require)\b/;
            const NUM = /^\b\d+(\.\d+)?\b/;

            function esc(s) { return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
            let i = 0,
                out = '';
            while (i < code.length) {
                if (code[i] === '/' && code[i + 1] === '/') {
                    let e = code.indexOf('\n', i);
                    let ch = e === -1 ? code.slice(i) : code.slice(i, e);
                    out += `<span class="c">${esc(ch)}</span>`;
                    i += ch.length;
                    continue;
                }
                if (code[i] === '`') {
                    let j = i + 1;
                    while (j < code.length && code[j] !== '`') { if (code[j] === '\\') j++; j++; }
                    out += `<span class="s">${esc(code.slice(i, j + 1))}</span>`;
                    i = j + 1;
                    continue;
                }
                if (code[i] === "'") {
                    let j = i + 1;
                    while (j < code.length && code[j] !== "'" && code[j] !== '\n') { if (code[j] === '\\') j++; j++; }
                    out += `<span class="s">${esc(code.slice(i, j + 1))}</span>`;
                    i = j + 1;
                    continue;
                }
                if (code[i] === '"') {
                    let j = i + 1;
                    while (j < code.length && code[j] !== '"' && code[j] !== '\n') { if (code[j] === '\\') j++; j++; }
                    out += `<span class="s">${esc(code.slice(i, j + 1))}</span>`;
                    i = j + 1;
                    continue;
                }
                let rest = code.slice(i),
                    m;
                if ((m = rest.match(KW))) { out += `<span class="k">${m[0]}</span>`; i += m[0].length; continue; }
                if ((m = rest.match(TY))) { out += `<span class="t">${m[0]}</span>`; i += m[0].length; continue; }
                if ((m = rest.match(NUM))) { out += `<span class="n">${m[0]}</span>`; i += m[0].length; continue; }
                out += esc(code[i]);
                i++;
            }
            return out;
        }

        function cw(code, lang = 'js', label = '') {
            const id = 'c' + Math.random().toString(36).slice(2);
            const isPlain = (lang === 'bash' || lang === 'dockerfile' || lang === 'text' || lang === 'tree');
            const inner = isPlain ?
                code.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;') :
                hl(code);
            return `<div class="cw"><div class="cl"><span>${label||lang}</span><button class="cpbtn" onclick="cp('${id}',this)">Copy</button></div><pre id="${id}">${inner}</pre></div>`;
        }

        function cp(id, btn) {
            navigator.clipboard.writeText(document.getElementById(id).textContent).then(() => {
                btn.textContent = 'Copied!';
                btn.classList.add('ok');
                setTimeout(() => { btn.textContent = 'Copy';
                    btn.classList.remove('ok'); }, 2000);
            });
        }

        // escape for outer template literal and HTML
        function escForTemplate(str) {
            return str.replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/`/g, '\\`')
                .replace(/\${/g, '\\${');
        }

        // ── slides ──
        const S = [];

        function chunk(items, size = 4) {
            const pages = [];
            for (let i = 0; i < items.length; i += size) pages.push(items.slice(i, i + size));
            return pages;
        }

        // 0 — TITLE
        S.push({ cls: 'hero-slide', html: `
        <div class="dot-grid"></div>
        <div style="flex:1;display:flex;flex-direction:column;justify-content:center;gap:0;position:relative">
          <div class="eyebrow" style="margin-bottom:14px">Summative Exam · Web Systems</div>
          <div class="hero-title">
            <div class="h1">JSON, Express</div>
            <div class="h2">&amp; Docker</div>
            <div style="font-size:24px;font-weight:400;color:var(--text2);margin-top:8px">with JavaScript Foundations</div>
          </div>
          <div class="hero-sub">30‑point assessment — 10 MC, 10 Scenario ID, 10 Guess the Output</div>

        }, true);

        let tx = 0;
        document.addEventListener('touchstart', e => tx = e.touches[0].clientX, { passive: true });
        document.addEventListener('touchend', e => {
            const d = e.changedTouches[0].clientX - tx;
            if (Math.abs(d) > 50) { d < 0 ? go(cur + 1) : go(cur - 1); }
        }, { passive: true });

        build();
        tick();
    </script>
</body>
</html>
