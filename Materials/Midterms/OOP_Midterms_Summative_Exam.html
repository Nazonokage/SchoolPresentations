<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OOP Midterms — Java Methods & Access Modifiers</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Inter:wght@300;400;500;600;700;800;900&display=swap');

  :root {
    --bg: #0d1117;
    --surface: #161b22;
    --surface2: #21262d;
    --border: #30363d;
    --accent: #58a6ff;
    --accent2: #3fb950;
    --accent3: #f78166;
    --accent4: #d2a8ff;
    --accent5: #ffa657;
    --text: #e6edf3;
    --text-muted: #8b949e;
    --text-subtle: #6e7681;
    --java-orange: #f89820;
    --private-red: #f85149;
    --default-blue: #58a6ff;
    --protected-purple: #d2a8ff;
    --public-green: #3fb950;
    --static-yellow: #ffa657;
    --instance-cyan: #39d353;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: var(--bg);
    font-family: 'Inter', sans-serif;
    color: var(--text);
  }

  /* ── Progress bar ── */
  #progress-bar {
    position: fixed; top: 0; left: 0; height: 3px;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    transition: width 0.35s ease; z-index: 1000;
  }

  /* ── Counter ── */
  #counter {
    position: fixed; bottom: 18px; right: 24px;
    font-size: 16px; color: var(--text-muted);
    font-family: 'JetBrains Mono', monospace;
    z-index: 1000; letter-spacing: 0.03em;
  }

  /* ── Slides container ── */
  #deck {
    width: 100%; height: 100%;
    position: relative; overflow: hidden;
  }

  .slide {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    padding: 40px 56px 60px;
    overflow-y: auto;
    opacity: 0; pointer-events: none;
    transform: translateX(60px);
    transition: opacity 0.35s ease, transform 0.35s ease;
  }
  .slide.active {
    opacity: 1; pointer-events: all;
    transform: translateX(0);
  }
  .slide.exit-left { opacity: 0; transform: translateX(-60px); }
  .slide.exit-right { opacity: 0; transform: translateX(60px); }

  @media (prefers-reduced-motion: reduce) {
    .slide { transition: opacity 0.15s ease; transform: none !important; }
  }

  /* ── Typography ── */
  .eyebrow {
    font-size: 16px; font-weight: 600; letter-spacing: 0.12em;
    text-transform: uppercase; color: var(--accent);
    margin-bottom: 10px;
  }
  .slide-title {
    font-size: clamp(26px, 3.5vw, 42px);
    font-weight: 800; line-height: 1.15;
    color: var(--text); margin-bottom: 28px;
  }
  .slide-title span { color: var(--accent); }

  /* ── Cards / grids ── */
  .grid-2 {
    display: grid; grid-template-columns: 1fr 1fr;
    gap: 20px; flex: 1;
  }
  .grid-3 {
    display: grid; grid-template-columns: repeat(3, 1fr);
    gap: 16px; flex: 1;
  }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px 22px;
  }
  .card h3 {
    font-size: 18px; font-weight: 700;
    margin-bottom: 10px; color: var(--text);
  }
  .card p, .card li {
    font-size: 16px; line-height: 1.65;
    color: var(--text-muted);
  }
  .card ul { padding-left: 18px; }

  /* ── Code blocks ── */
  .code-wrap {
    background: #010409;
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
    display: flex; flex-direction: column;
  }
  .code-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 16px;
    background: var(--surface2);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .code-lang {
    font-size: 16px; font-weight: 600;
    color: var(--java-orange);
    font-family: 'JetBrains Mono', monospace;
  }
  .copy-btn {
    font-size: 16px; padding: 4px 14px; border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--surface2);
    color: var(--text-muted);
    cursor: pointer;
    font-family: 'Inter', sans-serif;
    box-shadow: 2px 2px 4px rgba(0,0,0,0.4), -1px -1px 2px rgba(255,255,255,0.03);
    transition: all 0.18s;
  }
  .copy-btn:hover { color: var(--text); border-color: var(--accent); }
  .copy-btn.copied {
    color: var(--accent2);
    box-shadow: inset 1px 1px 3px rgba(0,0,0,0.5);
    transform: scale(0.97);
  }
  pre {
    font-family: 'JetBrains Mono', monospace;
    font-size: 16px; line-height: 1.7;
    padding: 18px 20px;
    overflow: auto; flex: 1;
    color: var(--text);
  }

  /* ── Syntax colors ── */
  .kw { color: #ff7b72; } /* keywords */
  .ty { color: #ffa657; } /* types */
  .fn { color: #d2a8ff; } /* function names */
  .st { color: #a5d6ff; } /* strings */
  .cm { color: #8b949e; font-style: italic; } /* comments */
  .nm { color: #79c0ff; } /* numbers */
  .op { color: #ff7b72; } /* operators */
  .cls { color: #ffa657; font-weight: 600; } /* class names */

  /* ── Tables ── */
  table {
    width: 100%; border-collapse: collapse;
    font-size: 16px;
  }
  th {
    background: var(--surface2);
    padding: 12px 16px; text-align: left;
    font-weight: 700; font-size: 16px;
    border-bottom: 2px solid var(--border);
    color: var(--accent);
  }
  td {
    padding: 11px 16px;
    border-bottom: 1px solid var(--border);
    font-size: 16px; color: var(--text-muted);
    vertical-align: top; line-height: 1.5;
  }
  tr:hover td { background: rgba(88,166,255,0.04); }

  /* ── Badge chips ── */
  .badge {
    display: inline-block;
    padding: 3px 10px; border-radius: 20px;
    font-size: 16px; font-weight: 600;
  }
  .badge-red { background: rgba(248,81,73,0.18); color: var(--private-red); }
  .badge-blue { background: rgba(88,166,255,0.18); color: var(--default-blue); }
  .badge-purple { background: rgba(210,168,255,0.18); color: var(--protected-purple); }
  .badge-green { background: rgba(63,185,80,0.18); color: var(--public-green); }
  .badge-orange { background: rgba(255,166,87,0.18); color: var(--static-yellow); }
  .badge-cyan { background: rgba(57,211,83,0.18); color: var(--instance-cyan); }

  /* ── Q&A items ── */
  .q-item {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 18px 20px;
    margin-bottom: 14px;
  }
  .q-num {
    font-size: 16px; font-weight: 700;
    color: var(--accent); margin-bottom: 6px;
    font-family: 'JetBrains Mono', monospace;
  }
  .q-text {
    font-size: 17px; line-height: 1.6;
    color: var(--text); margin-bottom: 10px;
  }
  .q-option {
    font-size: 16px; color: var(--text-muted);
    padding: 4px 0; line-height: 1.5;
  }
  .q-option.correct { color: var(--accent2); font-weight: 600; }
  .q-answer {
    font-size: 16px; color: var(--accent2);
    font-weight: 600; padding-top: 8px;
    border-top: 1px solid var(--border); margin-top: 8px;
  }
  .q-explain {
    font-size: 16px; color: var(--text-muted);
    margin-top: 5px; line-height: 1.55;
  }

  /* ── Output box ── */
  .output-box {
    background: #010409;
    border: 1px solid var(--accent2);
    border-radius: 8px;
    padding: 14px 18px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 17px; color: var(--accent2);
    line-height: 1.7;
    margin-top: 12px;
  }

  /* ── Hero / title slide ── */
  .hero {
    flex: 1; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    text-align: center; gap: 20px;
  }
  .hero-title {
    font-size: clamp(36px, 5vw, 62px);
    font-weight: 900; line-height: 1.1;
    background: linear-gradient(135deg, var(--accent), var(--accent4), var(--accent2));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .hero-sub {
    font-size: 20px; color: var(--text-muted);
    max-width: 600px; line-height: 1.6;
  }
  .hero-tags {
    display: flex; gap: 10px; flex-wrap: wrap;
    justify-content: center; margin-top: 10px;
  }
  .hero-tag {
    padding: 7px 18px; border-radius: 30px;
    border: 1px solid var(--border);
    font-size: 16px; font-weight: 600;
    background: var(--surface);
  }

  /* ── Section divider ── */
  .section-slide {
    flex: 1; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    text-align: center;
  }
  .section-number {
    font-size: 80px; font-weight: 900;
    font-family: 'JetBrains Mono', monospace;
    color: var(--surface2);
    line-height: 1;
  }
  .section-label {
    font-size: 32px; font-weight: 800;
    color: var(--text); margin-top: -10px;
  }
  .section-desc { font-size: 18px; color: var(--text-muted); margin-top: 12px; }

  /* ── Visual diagram ── */
  .diagram-wrap { flex: 1; display: flex; align-items: center; justify-content: center; }

  /* ── Shortcuts overlay ── */
  #overlay {
    display: none; position: fixed; inset: 0;
    background: rgba(1,4,9,0.88); z-index: 2000;
    align-items: center; justify-content: center;
  }
  #overlay.show { display: flex; }
  .overlay-box {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 14px; padding: 32px 40px; min-width: 320px;
  }
  .overlay-box h2 { font-size: 22px; margin-bottom: 20px; color: var(--accent); }
  .shortcut-row {
    display: flex; justify-content: space-between;
    padding: 8px 0; border-bottom: 1px solid var(--border);
    font-size: 17px;
  }
  .key {
    background: var(--surface2); border: 1px solid var(--border);
    border-radius: 5px; padding: 2px 10px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 16px; color: var(--accent);
  }

  /* Blank line spacer */
  .spacer { height: 16px; }

  /* Recap highlight */
  .highlight-box {
    background: linear-gradient(135deg, rgba(88,166,255,0.1), rgba(210,168,255,0.08));
    border: 1px solid rgba(88,166,255,0.3);
    border-radius: 10px; padding: 16px 20px;
    margin-bottom: 14px;
  }
  .highlight-box h4 { font-size: 18px; font-weight: 700; color: var(--accent); margin-bottom: 6px; }
  .highlight-box p { font-size: 16px; color: var(--text-muted); line-height: 1.6; }

  /* tag pill */
  .pill {
    display: inline-block; padding: 2px 10px;
    border-radius: 12px; font-size: 16px; font-weight: 600;
    margin-left: 6px;
  }

  .ans-key-item {
    background: var(--surface); border-radius: 10px;
    padding: 14px 18px; margin-bottom: 10px;
    border-left: 3px solid var(--accent2);
  }
  .ans-key-item .num { font-size: 16px; color: var(--text-muted); font-weight: 600; }
  .ans-key-item .ans { font-size: 17px; color: var(--accent2); font-weight: 700; margin: 4px 0; }
  .ans-key-item .exp { font-size: 16px; color: var(--text-muted); }

  .final-quote {
    font-size: 22px; font-style: italic; color: var(--text-muted);
    text-align: center; max-width: 600px; line-height: 1.7;
    margin: 0 auto;
  }
  .final-quote strong { color: var(--accent); font-style: normal; }
</style>
</head>

    <div class="shortcut-row"><span>Next slide</span><span><kbd class="key">→</kbd></span></div>

</div>

<script>
// ── Slide data ──────────────────────────────────────────────────────────────
const slides = [

{html: `

// ── SLIDE 3: WHAT IS A METHOD ─────────────────────────────────────────────
{html: `
<div class="eyebrow">Recap · Module 5</div>
<div class="slide-title">What is a <span>Method</span>?</div>
<div style="display:flex;gap:20px;flex:1">
  <div style="flex:1;display:flex;flex-direction:column;gap:14px">
    <div class="highlight-box">
      <h4>Definition</h4>
      <p>A <strong style="color:var(--text)">method</strong> is a named block of code that performs a specific task. It only runs when explicitly called.</p>
    </div>
    <div class="highlight-box" style="border-color:rgba(63,185,80,0.3);background:linear-gradient(135deg,rgba(63,185,80,0.08),rgba(63,185,80,0.04))">

      <ul style="font-size:16px;color:var(--text-muted);padding-left:18px;line-height:1.7">
        <li>♻️ <strong style="color:var(--text)">Reuse</strong> — write once, call anywhere</li>
        <li>📦 <strong style="color:var(--text)">Organization</strong> — break big problems into pieces</li>
        <li>🔧 <strong style="color:var(--text)">Actions</strong> — define what an object <em>can do</em></li>
        <li>🔒 <strong style="color:var(--text)">Encapsulation</strong> — hide complexity inside</li>
      </ul>
    </div>
  </div>
  <div style="flex:1">
    <div class="code-wrap" style="height:100%">
      <div class="code-header">
        <span class="code-lang">Java</span>
        <button class="copy-btn" onclick="copyCode(this)">Copy</button>
      </div>
      <pre><span class="cm">// Basic method anatomy</span>
<span class="kw">return_type</span> <span class="fn">methodName</span>(<span class="ty">parameters</span>) {
    <span class="cm">// body — code that runs</span>
    <span class="kw">return</span> value; <span class="cm">// if not void</span>
}

<span class="cm">// Real example</span>
<span class="ty">int</span> <span class="fn">addOne</span>(<span class="ty">int</span> num) {
    <span class="kw">return</span> num + <span class="nm">1</span>;
}

<span class="cm">// void = returns nothing</span>
<span class="kw">void</span> <span class="fn">greet</span>(<span class="ty">String</span> name) {
    System.out.<span class="fn">println</span>(<span class="st">"Hello, "</span> + name);
}</pre>
    </div>

// ── SLIDE 4: STATIC DEEP DIVE ─────────────────────────────────────────────
{html: `
<div class="eyebrow">Deep Dive · Static Methods</div>
<div class="slide-title"><span>Static</span> Methods — The Class-Level Tool</div>
<div style="display:flex;gap:20px;flex:1">
  <div style="flex:1;display:flex;flex-direction:column;gap:12px">
    <div class="card" style="border-color:rgba(255,166,87,0.4)">
      <h3 style="color:var(--static-yellow)">🔑 Key Facts</h3>
      <ul style="font-size:16px;line-height:1.8;padding-left:16px;color:var(--text-muted)">
        <li>Declared with the <code style="color:var(--static-yellow);background:var(--surface2);padding:1px 6px;border-radius:4px">static</code> keyword</li>
        <li>Belongs to the <strong style="color:var(--text)">class itself</strong>, not any object</li>
        <li>Called as <code style="color:var(--static-yellow);background:var(--surface2);padding:1px 6px;border-radius:4px">ClassName.method()</code></li>
        <li><strong style="color:var(--text)">No object needed</strong> — loaded with the class</li>
        <li>Can only directly access <em>other static</em> members</li>
        <li>Shared across ALL instances</li>
      </ul>
    </div>
    <div class="card" style="border-color:rgba(255,166,87,0.25)">
      <h3 style="color:var(--static-yellow)">🏗️ Memory Model</h3>
      <p style="font-size:16px;color:var(--text-muted);line-height:1.65">When the JVM loads a class, static methods are placed in the <strong style="color:var(--text)">Method Area</strong> (part of the heap/meta-space). They exist before any object is ever created. Think of them as class-level utilities.</p>
    </div>
  </div>
  <div style="flex:1">
    <div class="code-wrap" style="height:100%">
      <div class="code-header"><span class="code-lang">Java</span><button class="copy-btn" onclick="copyCode(this)">Copy</button></div>
      <pre><span class="kw">public class</span> <span class="cls">MathHelper</span> {

  <span class="cm">// static field — shared by all</span>
  <span class="kw">static</span> <span class="ty">int</span> callCount = <span class="nm">0</span>;

  <span class="cm">// static method — no object needed</span>
  <span class="kw">static</span> <span class="ty">int</span> <span class="fn">square</span>(<span class="ty">int</span> n) {
    callCount++;        <span class="cm">// CAN access static field</span>
    <span class="kw">return</span> n * n;
  }

  <span class="kw">public static void</span> <span class="fn">main</span>(<span class="ty">String</span>[] args) {
    <span class="cm">// called via class name, no new!</span>
    System.out.<span class="fn">println</span>(MathHelper.<span class="fn">square</span>(<span class="nm">5</span>));
    System.out.<span class="fn">println</span>(MathHelper.callCount);
  }
}
<span class="cm">// Output:
// 25
// 1</span></pre>
    </div>
  </div>
</div>
`},

        <li>Requires <code style="color:var(--instance-cyan);background:var(--surface2);padding:1px 6px;border-radius:4px">new ClassName()</code> first</li>
        <li>Can access both <em>static</em> and <em>instance</em> members</li>
        <li>Has access to <code style="color:var(--instance-cyan);background:var(--surface2);padding:1px 6px;border-radius:4px">this</code> keyword</li>
      </ul>
    </div>
    <div class="card" style="border-color:rgba(57,211,83,0.25)">
      <h3 style="color:var(--instance-cyan)">🏗️ Memory Model</h3>
      <p style="font-size:16px;color:var(--text-muted);line-height:1.65">Each time you use <code style="color:var(--text)">new</code>, Java allocates a new object on the <strong style="color:var(--text)">Heap</strong>. Instance methods operate on <em>that specific object's data</em>. Two Dog objects have separate <code>name</code> fields; each <code>bark()</code> prints its own name.</p>
    </div>
  </div>
  <div style="flex:1">
    <div class="code-wrap" style="height:100%">
      <div class="code-header"><span class="code-lang">Java</span><button class="copy-btn" onclick="copyCode(this)">Copy</button></div>
      <pre><span class="kw">public class</span> <span class="cls">Dog</span> {
  <span class="ty">String</span> name;  <span class="cm">// instance field</span>
  <span class="ty">int</span> age;

  <span class="kw">public</span> <span class="fn">Dog</span>(<span class="ty">String</span> n, <span class="ty">int</span> a) {
    <span class="kw">this</span>.name = n;  <span class="cm">// 'this' = this object</span>
    <span class="kw">this</span>.age  = a;
  }

  <span class="cm">// instance method — needs an object</span>
  <span class="kw">public void</span> <span class="fn">bark</span>() {
    System.out.<span class="fn">println</span>(name + <span class="st">" says: Woof!"</span>);
  }

  <span class="kw">public static void</span> <span class="fn">main</span>(<span class="ty">String</span>[] args) {
    Dog d1 = <span class="kw">new</span> <span class="fn">Dog</span>(<span class="st">"Buddy"</span>, <span class="nm">3</span>);
    Dog d2 = <span class="kw">new</span> <span class="fn">Dog</span>(<span class="st">"Max"</span>, <span class="nm">5</span>);
    d1.<span class="fn">bark</span>(); <span class="cm">// Buddy says: Woof!</span>
    d2.<span class="fn">bark</span>(); <span class="cm">// Max says: Woof!</span>
  }
}
<span class="cm">// d1 and d2 are DIFFERENT objects in memory</span></pre>
    </div>
  </div>
</div>
`},

{html: `

<div style="flex:1;overflow:auto">
<table>
  <tr>
    <th style="width:25%">Feature</th>
    <th style="color:var(--static-yellow)">⚡ Static Method</th>

  </tr>
  <tr><td>Keyword</td><td><span class="badge badge-orange">static</span></td><td><em style="color:var(--text-muted)">no static keyword</em></td></tr>
  <tr><td>Belongs to</td><td>The <strong style="color:var(--text)">Class</strong></td><td>An <strong style="color:var(--text)">Object</strong></td></tr>
  <tr><td>Object required?</td><td>❌ No</td><td>✅ Yes — use <code>new</code></td></tr>
  <tr><td>How to call</td><td><code style="color:var(--static-yellow)">ClassName.method()</code></td><td><code style="color:var(--instance-cyan)">obj.method()</code></td></tr>
  <tr><td>Access to <code>this</code>?</td><td>❌ No — no object context</td><td>✅ Yes — refers to current obj</td></tr>
  <tr><td>Can access instance fields?</td><td>❌ No (compile error)</td><td>✅ Yes</td></tr>
  <tr><td>Can access static fields?</td><td>✅ Yes</td><td>✅ Yes</td></tr>
  <tr><td>Memory location</td><td>Method Area / Class metadata</td><td>Heap (per object)</td></tr>
  <tr><td>Common use cases</td><td>Utility/helper, <code>Math.abs()</code>, factory methods</td><td>Object behavior, getters/setters</td></tr>
  <tr><td>Example</td><td><code style="color:var(--static-yellow)">Math.sqrt(25)</code></td><td><code style="color:var(--instance-cyan)">dog.bark()</code></td></tr>
</table>
</div>
<div style="margin-top:14px;padding:10px 18px;background:rgba(248,152,32,0.08);border:1px solid rgba(248,152,32,0.3);border-radius:8px;font-size:16px;color:var(--text-muted)">
  ⚠️ <strong style="color:var(--static-yellow)">Common trap:</strong> You <em>cannot</em> call an instance method from inside a static method without first creating an object. <code style="color:var(--private-red)">main()</code> is static — that's why you always need <code>new ClassName()</code> inside it!
</div>
`},

{html: `
<div class="eyebrow">Best Practice</div>
<div class="slide-title">Encapsulation — <span>Private Fields + Public Methods</span></div>
<div style="display:flex;gap:20px;flex:1">
  <div style="flex:1;display:flex;flex-direction:column;gap:12px">
    <div class="card">
      <h3>The Pattern</h3>
      <ul style="font-size:16px;color:var(--text-muted);line-height:1.8;padding-left:16px">
        <li>Make fields <span class="badge badge-red">private</span> — hide data</li>
        <li>Add <span class="badge badge-green">public</span> getter/setter methods</li>
        <li>Validate inside setters — full control</li>
        <li>Outside code can't corrupt your data directly</li>
      </ul>
    </div>
    <div class="card" style="border-color:rgba(248,81,73,0.3)">
      <h3 style="color:var(--private-red)">❌ Bad (exposed field)</h3>
      <pre style="font-size:16px;padding:8px;background:var(--surface2);border-radius:6px;color:var(--text-muted)"><span class="kw">public int</span> balance = <span class="nm">1000</span>;
<span class="cm">// Anyone can: account.balance = -9999;</span></pre>
    </div>
    <div class="card" style="border-color:rgba(63,185,80,0.3)">
      <h3 style="color:var(--accent2)">✅ Good (encapsulated)</h3>
      <pre style="font-size:16px;padding:8px;background:var(--surface2);border-radius:6px;color:var(--text-muted)"><span class="kw">private int</span> balance = <span class="nm">1000</span>;
<span class="kw">public void</span> <span class="fn">deposit</span>(<span class="ty">int</span> amt) {
  <span class="kw">if</span> (amt > <span class="nm">0</span>) balance += amt;
}</pre>
    </div>
  </div>
  <div style="flex:1">
    <div class="code-wrap" style="height:100%">
      <div class="code-header"><span class="code-lang">Java</span><button class="copy-btn" onclick="copyCode(this)">Copy</button></div>
      <pre><span class="kw">class</span> <span class="cls">BankAccount</span> {
  <span class="kw">private double</span> balance = <span class="nm">0</span>;

  <span class="kw">public void</span> <span class="fn">deposit</span>(<span class="ty">double</span> amount) {
    <span class="kw">if</span> (amount > <span class="nm">0</span>) {
      balance += amount;
    }
  }

  }

}
<span class="cm">// acc.balance = -9999 → COMPILE ERROR!</span></pre>

// ── Navigation ──────────────────────────────────────────────────────────────
let current = 0;
const deck = document.getElementById('deck');
const bar = document.getElementById('progress-bar');
const counter = document.getElementById('counter');

function buildSlides() {
  slides.forEach((s, i) => {
    const el = document.createElement('div');
    el.className = 'slide' + (i === 0 ? ' active' : '');
    el.innerHTML = s.html;
    deck.appendChild(el);
  });
}

function go(dir) {
  const els = document.querySelectorAll('.slide');
  const next = current + dir;
  if (next < 0 || next >= slides.length) return;
  els[current].classList.remove('active');
  els[current].classList.add(dir > 0 ? 'exit-left' : 'exit-right');
  setTimeout(() => { els[current].classList.remove('exit-left', 'exit-right'); }, 380);
  current = next;
  els[current].classList.add('active');
  updateUI();
}

function goTo(n) {
  const els = document.querySelectorAll('.slide');
  els[current].classList.remove('active');
  current = Math.max(0, Math.min(n, slides.length - 1));
  els[current].classList.add('active');
  updateUI();
}

function updateUI() {
  const pct = ((current) / (slides.length - 1)) * 100;
  bar.style.width = pct + '%';
  counter.textContent = (current + 1) + ' / ' + slides.length;
}

// ── Keyboard ──────────────────────────────────────────────────────────────
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight') go(1);
  else if (e.key === 'ArrowLeft') go(-1);
  else if (e.key === 'Home') goTo(0);
  else if (e.key === 'End') goTo(slides.length - 1);
  else if (e.key === '?') toggleOverlay();
});

// ── Mouse buttons ─────────────────────────────────────────────────────────
document.addEventListener('mousedown', e => {
  if (e.button === 3) { e.preventDefault(); e.stopImmediatePropagation(); go(1); }
  if (e.button === 4) { e.preventDefault(); e.stopImmediatePropagation(); go(-1); }
}, true);
document.addEventListener('contextmenu', e => { e.preventDefault(); go(1); });

// ── Touch/swipe ───────────────────────────────────────────────────────────
let touchX = 0;
document.addEventListener('touchstart', e => { touchX = e.changedTouches[0].clientX; });
document.addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - touchX;
  if (Math.abs(dx) > 50) go(dx < 0 ? 1 : -1);
});

// ── Overlay ───────────────────────────────────────────────────────────────
function toggleOverlay() {
  document.getElementById('overlay').classList.toggle('show');
}
document.getElementById('overlay').addEventListener('click', () => {
  document.getElementById('overlay').classList.remove('show');
});

// ── Copy button ───────────────────────────────────────────────────────────
function copyCode(btn) {
  const pre = btn.closest('.code-wrap').querySelector('pre');
  const text = pre.innerText || pre.textContent;
  navigator.clipboard.writeText(text).then(() => {
    btn.textContent = 'Copied!';
    btn.classList.add('copied');
    setTimeout(() => { btn.textContent = 'Copy'; btn.classList.remove('copied'); }, 1800);
  });
}

// ── Init ──────────────────────────────────────────────────────────────────
buildSlides();
updateUI();
</script>
