  <div class="mbox">

    <div class="shr"><span>Next</span><span><kbd>→</kbd> / Right-click</span></div>
    <div class="shr"><span>Prev</span><span><kbd>←</kbd></span></div>
    <div class="shr"><span>First / Last</span><span><kbd>Home</kbd> / <kbd>End</kbd></span></div>
    <div class="shr"><span>Shortcuts</span><span><kbd>?</kbd></span></div>
    <button class="mcl" onclick="document.getElementById('modal').classList.remove('open')">Close</button>
  </div>
</div>
<script>
function hl(raw){
  const KW=/^(const|let|var|function|return|async|await|try|catch|throw|new|if|else|import|export|from|true|false|null|undefined)\b/;
  const TY=/^(React|useState|useEffect|useQuery|useMutation|useQueryClient|axios|console|JSON|Promise|Error|QueryClient|QueryClientProvider)\b/;
  const NUM=/^\b\d+(\.\d+)?\b/;
  function e(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
  let i=0,o='';
  while(i<raw.length){
    if(raw[i]==='/'&&raw[i+1]==='/'){const end=raw.indexOf('\n',i);const ch=end<0?raw.slice(i):raw.slice(i,end);o+='<span class="cm">'+e(ch)+'</span>';i+=ch.length;continue;}
    if(raw[i]==='`'||raw[i]==="'"||raw[i]==='"'){const q=raw[i];let j=i+1;while(j<raw.length&&raw[j]!==q){if(raw[j]==='\\')j++;j++;}o+='<span class="s">'+e(raw.slice(i,j+1))+'</span>';i=j+1;continue;}
    const rest=raw.slice(i);let m;
    if((m=rest.match(KW))){o+='<span class="k">'+m[0]+'</span>';i+=m[0].length;continue;}
    if((m=rest.match(TY))){o+='<span class="t">'+m[0]+'</span>';i+=m[0].length;continue;}
    if((m=rest.match(NUM))){o+='<span class="n">'+m[0]+'</span>';i+=m[0].length;continue;}
    o+=e(raw[i]);i++;
  }
  return o;
}
function cw(code,lang,label){
  const id='c'+Math.random().toString(36).slice(2);
  const body=(lang==='jsx'||lang==='js')?hl(code):code.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  return '<div class="cw"><div class="cl"><span>'+(label||lang)+'</span><button class="cpbtn" onclick="doCopy(\''+id+'\',this)">Copy</button></div><pre id="'+id+'">'+body+'</pre></div>';
}
function doCopy(id,btn){
  navigator.clipboard.writeText(document.getElementById(id).textContent).then(()=>{
    btn.textContent='Copied!';btn.classList.add('copied');
    setTimeout(()=>{btn.textContent='Copy';btn.classList.remove('copied');},1800);
  });
}

<div class="eyebrow">The Main Hook</div>

      ${cw(`import { useQuery } from '@tanstack/react-query';
import axios from 'axios';

function ProductCatalog() {
  const { data, isPending, isError, error } = useQuery({
    queryKey: ['products'],
    queryFn: () =>
      axios.get('/api/products').then(r => r.data),
    staleTime: 1000 * 60 * 5, // 5 min
  });

  if (isPending) return <p>Loading…</p>;
  if (isError)   return <p>Error: {error.message}</p>;

  return (
    <ul>
      {data.map(p => (
        <li key={p.id}>{p.name} — \${p.price}</li>
      ))}
    </ul>
  );
}`,'jsx','useQuery example')}

      <div class="bdi" style="border-left-color:var(--accent4)"><span class="bdl">4</span><div class="bdt"><strong>isPending / isError</strong> — built-in flags replace your manual loading & error state.</div></div>
      <div class="bdi" style="border-left-color:var(--accent5)"><span class="bdl">5</span><div class="bdt"><strong>data</strong> — the resolved value of queryFn. Only safe to use after the early returns.</div></div>

<div class="eyebrow">Writing Data</div>
<div class="slide-title">useMutation + Cache Invalidation</div>

      ${cw(`import { useMutation, useQueryClient } from '@tanstack/react-query';
import axios from 'axios';

function AddProductForm() {
  const queryClient = useQueryClient();

  const mutation = useMutation({
    mutationFn: (newProduct) =>
      axios.post('/api/products', newProduct),
    onSuccess: () => {
      // Tell every ['products'] query to refetch
      queryClient.invalidateQueries({
        queryKey: ['products']
      });
    }
  });

  return (
    <button
      onClick={() => mutation.mutate({
        name: 'Keyboard', price: 99
      })}
      disabled={mutation.isPending}
    >
      {mutation.isPending ? 'Saving…' : 'Add Item'}
    </button>
  );
}`,'jsx','useMutation example')}
    </div>
    <div class="col" style="overflow-y:auto">
      <div class="bdi"><span class="bdl">1</span><div class="bdt"><strong>useQueryClient()</strong> — gives access to the cache so we can invalidate after a write.</div></div>
      <div class="bdi" style="border-left-color:var(--accent2)"><span class="bdl">2</span><div class="bdt"><strong>mutationFn</strong> — the async function that performs the POST/PUT/DELETE.</div></div>

let cur=0;
const deck=document.getElementById('deck');
const bar=document.getElementById('bar');
const ctr=document.getElementById('ctr');
function build(){S.forEach((s,i)=>{const el=document.createElement('div');el.className='slide'+(s.cls?' '+s.cls:'');el.innerHTML=s.h||'';if(i===0)el.classList.add('active');deck.appendChild(el);if(s.init)s.init(el);});}
function go(n){if(n<0||n>=S.length||n===cur)return;const els=deck.querySelectorAll('.slide');const fwd=n>cur;els[cur].classList.remove('active');els[cur].classList.add(fwd?'out-l':'out-r');setTimeout(()=>els[cur].classList.remove('out-l','out-r'),400);cur=n;els[cur].classList.add('active');els[cur].scrollTop=0;tick();}
function tick(){bar.style.width=(S.length>1?(cur/(S.length-1)*100):100)+'%';ctr.textContent=(cur+1)+' / '+S.length;}
document.addEventListener('keydown',e=>{const m=document.getElementById('modal');if(m.classList.contains('open')){if(e.key==='Escape')m.classList.remove('open');return;}if(['INPUT','TEXTAREA'].includes(document.activeElement.tagName))return;if(e.key==='ArrowRight'||e.key==='ArrowDown')go(cur+1);else if(e.key==='ArrowLeft'||e.key==='ArrowUp')go(cur-1);else if(e.key==='Home')go(0);else if(e.key==='End')go(S.length-1);else if(e.key==='?')m.classList.add('open');});
document.addEventListener('mousedown',e=>{if(e.target.closest('button,input,a,.mc-opt,.gto-ta'))return;if(e.button===2){e.preventDefault();e.stopImmediatePropagation();go(cur+1);}},true);
document.addEventListener('contextmenu',e=>{if(!e.target.closest('button,input,a'))e.preventDefault();},true);
document.addEventListener('auxclick',e=>{if(e.button===3){e.preventDefault();go(cur-1);}if(e.button===4){e.preventDefault();go(cur+1);}});
build();tick();
</script>
