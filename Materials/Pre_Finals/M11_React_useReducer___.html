<body>
<div id="bar"></div><div id="ctr"></div><div id="deck"></div>
<div id="hint">right-click or → to advance · ? for shortcuts</div>
<div id="modal"><div class="mbox"><h3>⌨ Keyboard Shortcuts</h3>
<div class="shr"><span>Next</span><span><kbd>→</kbd> or <kbd>Right-click</kbd></span></div>
<div class="shr"><span>Prev</span><span><kbd>←</kbd></span></div>
<div class="shr"><span>First / Last</span><span><kbd>Home</kbd> / <kbd>End</kbd></span></div>
<div class="shr"><span>Shortcuts</span><span><kbd>?</kbd></span></div>
<div class="shr"><span>Close</span><span><kbd>Esc</kbd></span></div>
<button class="mcl" onclick="document.getElementById('modal').classList.remove('open')">Close</button></div></div>
<script>
function hl(raw){
  const KW=/^(const|let|var|function|return|async|await|try|catch|throw|new|class|extends|if|else|for|while|import|export|default|from|of|in|true|false|null|undefined|void|switch|case|break|typeof|instanceof|this|super|static|get|set)\b/;
  const TY=/^(React|useState|useReducer|useContext|useEffect|useMemo|useCallback|useRef|createContext|console|document|JSON|Array|Object|Math|Promise|Error|Map|Set|Date|String|Number|Boolean)\b/;
  const NUM=/^\b\d+(\.\d+)?\b/;
  const FN=/^[a-zA-Z_$][\w$]*(?=\s*\()/;
  function e(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
  let i=0,o='';
  while(i<raw.length){
    if(raw[i]==='/'&&raw[i+1]==='/'){const end=raw.indexOf('\n',i);const ch=end<0?raw.slice(i):raw.slice(i,end);o+='<span class="cm">'+e(ch)+'</span>';i+=ch.length;continue;}
    if(raw[i]==='/'&&raw[i+1]==='*'){const end=raw.indexOf('*/',i+2);const ch=end<0?raw.slice(i):raw.slice(i,end+2);o+='<span class="cm">'+e(ch)+'</span>';i+=ch.length;continue;}
    if(raw[i]==='`'){let j=i+1;while(j<raw.length&&raw[j]!=='`'){if(raw[j]==='\\')j++;j++;}o+='<span class="s">'+e(raw.slice(i,j+1))+'</span>';i=j+1;continue;}
    if(raw[i]==="'"){let j=i+1;while(j<raw.length&&raw[j]!=="'"&&raw[j]!=='\n'){if(raw[j]==='\\')j++;j++;}o+='<span class="s">'+e(raw.slice(i,j+1))+'</span>';i=j+1;continue;}
    if(raw[i]==='"'){let j=i+1;while(j<raw.length&&raw[j]!=='"'&&raw[j]!=='\n'){if(raw[j]==='\\')j++;j++;}o+='<span class="s">'+e(raw.slice(i,j+1))+'</span>';i=j+1;continue;}
    const rest=raw.slice(i);let m;
    if((m=rest.match(KW))){o+='<span class="k">'+m[0]+'</span>';i+=m[0].length;continue;}
    if((m=rest.match(TY))){o+='<span class="t">'+m[0]+'</span>';i+=m[0].length;continue;}
    if((m=rest.match(NUM))){o+='<span class="n">'+m[0]+'</span>';i+=m[0].length;continue;}
    if((m=rest.match(FN))){o+='<span class="f">'+m[0]+'</span>';i+=m[0].length;continue;}
    o+=e(raw[i]);i++;
  }
  return o;
}
function cw(code,lang,label){const id='c'+Math.random().toString(36).slice(2);const body=(lang==='jsx'||lang==='js')?hl(code):code.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');return '<div class="cw"><div class="cl"><span>'+(label||lang)+'</span><button class="cpbtn" onclick="doCopy(\''+id+'\',this)">Copy</button></div><pre id="'+id+'">'+body+'</pre></div>'}
function doCopy(id,btn){navigator.clipboard.writeText(document.getElementById(id).textContent).then(()=>{btn.textContent='Copied!';btn.classList.add('ok');setTimeout(()=>{btn.textContent='Copy';btn.classList.remove('ok')},1800)})}
const S=[];
S.push({cls:'hero-bg',h:`<div class="dots"></div><div style="flex:1;display:flex;flex-direction:column;justify-content:center;position:relative"><div class="eyebrow" style="margin-bottom:16px">Web Systems · Module 11</div><div class="hero-title"><div class="h1c">React useReducer &amp;</div><div class="h2c">State Machines</div></div><div class="hero-sub">Managing complex multi-sub-value client state deterministically with pure reducer functions, action objects, and dispatch events.</div><div><span class="pill p">useReducer</span><span class="pill p">Action Dispatch</span><span class="pill g">Immutability</span><span class="pill a">State Machine Logic</span></div></div>`});
S.push({h:`<div class="eyebrow">Where We Left Off</div><div class="slide-title">M10 → M11: Deterministic Client State</div><hr class="rule"/><div class="content"><div class="ba"><div class="ba-box bad"><h4>❌ Scattered useState</h4><ul><li>Many useState calls across components</li><li>Updates that depend on multiple sub-values</li><li>Fragile inline handlers</li><li>Business logic mixed into JSX</li></ul></div><div class="ba-box good"><h4>✅ useReducer</h4><ul><li>Pure Reducer function for transitions</li><li>Explicit Action objects { type, payload }</li><li>dispatch events instead of setters</li><li>Logic decoupled from UI</li></ul></div></div><div class="card"><h3>The Throughline</h3><p>When state logic grows complex, individual useState setters lead to bugs. useReducer extracts transitions into a pure, testable function.</p></div></div>`});
S.push({h:`<div class="eyebrow">Core Concept</div><div class="slide-title">The Fast-Food Order Ticket Analogy</div><hr class="rule"/><div class="content split"><div class="col"><div class="card flex1" style="border-left:3px solid var(--accent4)"><h3 style="color:var(--accent4)">Order Ticket Analogy</h3><p>You don't walk into the kitchen and change the food. You hand a ticket (the <strong>action</strong>). The kitchen (the <strong>reducer</strong>) reads it and produces a new tray (the <strong>new state</strong>).</p><ul style="margin-top:10px"><li><strong>Action</strong> = order ticket</li><li><strong>Reducer</strong> = kitchen</li><li><strong>dispatch</strong> = handing the ticket over</li></ul></div></div><div class="col"><div class="card flex1" style="border-left:3px solid var(--accent)"><h3>Why it matters</h3><p>Every state change becomes an explicit named event. You can log actions, test the reducer alone, and reason about the whole history.</p></div></div></div>`});
S.push({h:`<div class="eyebrow">What / How / Why</div><div class="slide-title">useReducer Fundamentals</div><hr class="rule"/><div class="content g3"><div class="card"><h3>What It Is</h3><p>A React hook that accepts a pure reducer and initial state, returning current state plus a dispatch function.</p></div><div class="card"><h3>How It Works</h3><p><ic>const [state, dispatch] = useReducer(reducer, initialState)</ic><br/>Call <ic>dispatch({ type, payload })</ic> to transition.</p></div><div class="card"><h3>Why It Matters</h3><p>Complex interdependent state becomes predictable, testable, and free of scattered-setter bugs.</p></div></div>`});
S.push({h:`<div class="eyebrow">Code Implementation</div><div class="slide-title">A Minimal Counter Reducer</div><hr class="rule"/><div class="content">${cw(`function counterReducer(state, action) {
  switch (action.type) {
    case 'INC':
      return { count: state.count + 1 };
    case 'DEC':
      return { count: state.count - 1 };
    case 'ADD':
      return { count: state.count + action.payload };
    default:
      return state;
  }
}

const [state, dispatch] = useReducer(counterReducer, { count: 0 });
dispatch({ type: 'INC' });
dispatch({ type: 'ADD', payload: 5 });`,'js','counterReducer.js')}</div>`});
S.push({h:`<div class="eyebrow">Immutability</div><div class="slide-title">Never Mutate — Always Return a New Reference</div><hr class="rule"/><div class="content"><div class="ba"><div class="ba-box bad"><h4>❌ Direct Mutation</h4>${cw(`case 'ADD_ITEM':
  state.items.push(action.payload);
  return state; // same ref → no re-render`,'js','Mutation Trap')}</div><div class="ba-box good"><h4>✅ Immutable Spread</h4>${cw(`case 'ADD_ITEM':
  return {
    ...state,
    items: [...state.items, action.payload]
  };`,'js','Immutable Spread')}</div></div></div>`});
S.push({h:`<div class="eyebrow">Common Pitfalls</div><div class="slide-title">Reducer Anti-Patterns</div><hr class="rule"/><div class="content"><div class="ba"><div class="ba-box bad"><h4>❌ Side Effects Inside Reducer</h4><p>Calling fetch, writing localStorage, or logging analytics inside the reducer breaks purity. Do that work in the event handler or useEffect, then dispatch a success action.</p></div><div class="ba-box good"><h4>✅ Pure Transition Only</h4><p>The reducer receives previous state and an action, and returns the next state. Nothing else. Easy to unit-test with plain JavaScript.</p></div></div></div>`});
S.push({h:`<div class="eyebrow">Production Patterns</div><div class="slide-title">Updating Deeply Nested State</div><hr class="rule"/><div class="content"><div class="card" style="margin-bottom:12px"><h3>Nested Spread Copies</h3><p>When updating nested properties you must spread every level so React sees a new reference at each layer.</p></div>${cw(`function userReducer(state, action) {
  switch (action.type) {
    case 'UPDATE_EMAIL':
      return {
        ...state,
        user: {
          ...state.user,
          contact: {
            ...state.user.contact,
            email: action.payload
          }
        }
      };
    default:
      return state;
  }

let cur=0;const deck=document.getElementById('deck');const bar=document.getElementById('bar');const ctr=document.getElementById('ctr');
function build(){S.forEach((s,i)=>{const el=document.createElement('div');el.className='slide'+(s.cls?' '+s.cls:'');el.innerHTML=s.h||'';if(i===0)el.classList.add('active');deck.appendChild(el);if(s.init)s.init(el)})}
function go(n){if(n<0||n>=S.length||n===cur)return;const els=deck.querySelectorAll('.slide');const fwd=n>cur;els[cur].classList.remove('active');els[cur].classList.add(fwd?'out-l':'out-r');setTimeout(()=>els[cur].classList.remove('out-l','out-r'),420);cur=n;els[cur].classList.add('active');els[cur].scrollTop=0;tick()}
function tick(){bar.style.width=(S.length>1?(cur/(S.length-1)*100):100)+'%';ctr.textContent=(cur+1)+' / '+S.length}
document.addEventListener('keydown',e=>{const m=document.getElementById('modal');if(m.classList.contains('open')){if(e.key==='Escape')m.classList.remove('open');return}if(document.activeElement.tagName==='INPUT'||document.activeElement.tagName==='TEXTAREA')return;if(e.key==='ArrowRight'||e.key==='ArrowDown')go(cur+1);else if(e.key==='ArrowLeft'||e.key==='ArrowUp')go(cur-1);else if(e.key==='Home')go(0);else if(e.key==='End')go(S.length-1);else if(e.key==='?')m.classList.add('open')});
document.addEventListener('mousedown',e=>{if(e.target.closest('button,input,a,.mc-opt,.gto-ta,textarea'))return;if(e.button===2){e.preventDefault();e.stopImmediatePropagation();go(cur+1)}else if(e.button===3){e.preventDefault();e.stopImmediatePropagation();go(cur-1)}else if(e.button===4){e.preventDefault();e.stopImmediatePropagation();go(cur+1)}},true);
document.addEventListener('contextmenu',e=>{if(e.target.closest('button,input,a'))return;e.preventDefault();e.stopImmediatePropagation()},true);
document.addEventListener('auxclick',e=>{if(e.button===3||e.button===4){e.preventDefault();e.stopImmediatePropagation()}},true);
build();tick();
