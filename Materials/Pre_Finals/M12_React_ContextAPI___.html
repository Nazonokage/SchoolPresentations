<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>M12 — React Context API & Global State Broadcast</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap"/>
<style>
:root{--bg:#060E1A;--panel:#0C1829;--panel2:#11223A;--line:#1E3350;--cy:#61DAFB;--or:#FB923C;--gr:#4ADE80;--rs:#F472B6;--tx:#F2F7FC;--tx2:#A9C1DB;--disp:'Bricolage Grotesque',Georgia,serif;--sans:'Instrument Sans',Helvetica,Arial,sans-serif;--mono:'JetBrains Mono',Menlo,Consolas,monospace;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#060E1A}}
:root[data-theme="dark"]{--bg:#060E1A}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--tx);font-family:var(--sans);overflow:hidden}
#stage{position:fixed;inset:0}
#canvas{width:1760px;height:990px;position:relative;background:radial-gradient(1000px 600px at 90% 0%,rgba(97,218,251,.09),transparent 60%),radial-gradient(800px 500px at 0% 100%,rgba(251,146,60,.08),transparent 60%),var(--bg);overflow:hidden}
.slide{position:absolute;inset:0;padding:60px 96px 52px;display:none;flex-direction:column;animation:in .45s cubic-bezier(.2,.7,.2,1)}
.slide.on{display:flex}
@keyframes in{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){.slide{animation:none}}
.tag{font:600 24px var(--mono);color:var(--or);letter-spacing:.14em;text-transform:uppercase;display:flex;gap:16px;align-items:center}
.tag i{font-style:normal;color:var(--tx2)}
h1,h2{font-family:var(--disp);letter-spacing:-.02em;text-wrap:balance}
h2{font-size:66px;font-weight:800;line-height:1.05;margin:10px 0 30px}
h1{font-size:136px;font-weight:800;line-height:.95}
h1 em{font-style:normal;color:var(--cy)}
p,li{font-size:31px;line-height:1.5;color:var(--tx2);text-wrap:pretty}
b{color:var(--tx);font-weight:600}
.row{display:grid;gap:32px;flex:1;min-height:0}.c2{grid-template-columns:1fr 1fr}.c3{grid-template-columns:repeat(3,1fr)}.c-6040{grid-template-columns:1.4fr 1fr}
.card{justify-content:center;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:34px 38px;display:flex;flex-direction:column;gap:14px;min-height:0}
.card h3{font:700 37px var(--disp);color:var(--tx)}
.card.hi{background:linear-gradient(160deg,rgba(97,218,251,.1),var(--panel) 60%);border-color:rgba(97,218,251,.4)}
.card.wa{background:linear-gradient(160deg,rgba(251,146,60,.1),var(--panel) 60%);border-color:rgba(251,146,60,.4)}
.num{font:800 96px var(--disp);color:var(--or);line-height:1}
code,ic{font:500 .86em var(--mono);color:var(--cy);background:rgba(97,218,251,.09);padding:2px 10px;border-radius:8px}
ul{list-style:none;display:flex;flex-direction:column;gap:12px}
li::before{content:'→ ';color:var(--or);font-family:var(--mono)}

.code header{display:flex;justify-content:space-between;align-items:center;padding:12px 22px;border-bottom:1px solid var(--line);font:500 22px var(--mono);color:var(--tx2)}
.code pre,.code textarea{font:400 27px/1.6 var(--mono);color:#D6E2F0;padding:22px 26px;white-space:pre;overflow:auto;flex:1;min-height:0;background:none;border:0;outline:0;resize:none;width:100%}
.k{color:#F49AD0}.s{color:#F5B98A}.c{color:#5E7C99;font-style:italic}.f{color:var(--cy)}
.btn{font:600 22px var(--sans);color:var(--tx);background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:8px 22px;cursor:pointer;transition:.2s}
.btn:hover,.btn:focus-visible{background:var(--cy);color:#04101D;border-color:var(--cy);outline:0}
.btn.on{background:var(--or);color:#04101D;border-color:var(--or)}

.opt.ok{background:rgba(74,222,128,.14);border-color:var(--gr)}.opt.no{background:rgba(244,114,182,.14);border-color:var(--rs)}

.mcq{gap:16px;justify-content:flex-start}.mcq .q{font:700 36px/1.3 var(--disp);color:var(--tx)}.mcq .q span{color:var(--or);margin-right:10px}
.lab{gap:16px;justify-content:flex-start}.lab h3 span{color:var(--or);margin-right:10px;font-family:var(--mono)}.lab p{font-size:28px;line-height:1.4}
.lab .code{flex:1}.lab .code pre,.lab textarea{font-size:24px}
.hero{justify-content:center;gap:34px}.hero p{max-width:1200px;font-size:36px}

svg text{font:600 22px var(--mono);fill:var(--tx)}
.nd rect{fill:var(--panel2);stroke:var(--line);stroke-width:2;transition:.4s}.ed{stroke:var(--line);stroke-width:3;fill:none;transition:.4s}
.drill .ed.d{stroke:var(--or);stroke-dasharray:12 8;animation:fl 1s linear infinite}.drill .nd.d rect{stroke:var(--or)}.drill .cast-only{opacity:0}
.cast .ed.c{stroke:var(--cy);stroke-dasharray:12 8;animation:fl 1s linear infinite}.cast .nd.p rect,.cast .nd.u rect{stroke:var(--cy);fill:rgba(97,218,251,.12)}.cast .drill-only{opacity:0}.cast .nd.m{opacity:.4}
.cast-only,.drill-only{transition:.4s}
@keyframes fl{to{stroke-dashoffset:-20}}
#lbl{position:fixed;right:22px;bottom:14px;font:500 17px var(--mono);color:var(--tx2);opacity:.7;pointer-events:none;z-index:9}
#bar{position:fixed;top:0;left:0;height:4px;background:linear-gradient(90deg,var(--or),var(--cy));transition:width .3s;z-index:9}
</style></head><body>
<div id="bar"></div><div id="stage"><div id="canvas"></div></div>
<div id="lbl"></div>
<script>
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const hl=s=>esc(s).replace(/(\/\/.*$)|('[^'\n]*'|`[^`]*`)|\b(const|let|return|function|export|import|from|if|throw|new|default|null)\b|\b(use[A-Z]\w*|createContext|Provider)\b/gm,(m,c,st,k,f)=>c?`<span class=c>${m}</span>`:st?`<span class=s>${m}</span>`:k?`<span class=k>${m}</span>`:`<span class=f>${m}</span>`);
const code=(t,l,x='')=>`<div class="code" ${x}><header><span>${l}</span></header><pre>${hl(t)}</pre></div>`;
const hd=(t,h,n)=>`<div class="tag">${String(n).padStart(2,'0')} <i>/</i> ${t}</div><h2>${h}</h2>`;

const MCQ=[
{q:'What is prop-drilling?',o:['Fetching many APIs at once','Passing props through intermediate components that never use them','Writing SQL inside JSX','Compiling components to WASM'],a:1,e:'The middle components only relay data. Context lets deep children skip them.'},
{q:'Which prop does <Provider> use to broadcast data?',o:['data','value','state','payload'],a:1,e:'<Ctx.Provider value={...}> is the only channel. Every consumer below reads it.'},
{q:'A component calls useContext(ThemeCtx) with no Provider above it. ThemeCtx = createContext(null). What does it get?',o:['It throws automatically','undefined','null, the default value','An empty object'],a:2,e:'The default is used silently. That is why custom hooks add an explicit null check.'},
{q:'A Provider passes value={{ user, logout }} inline. The parent re-renders with the same user. What happens to consumers?',o:['Nothing, the values are equal','They re-render, because it is a new object reference','Only the first consumer re-renders','React throws a warning'],a:1,e:'React compares with Object.is. A fresh object each render breaks it. Fix: useMemo.'}];

const LABS=[
['Create the Theme context','Build ThemeContext and a ThemeProvider that holds theme (default "dark") and a toggleTheme function.',
`import { createContext, useState } from 'react';

// TODO: create ThemeContext
// TODO: export ThemeProvider({ children })
`,`import { createContext, useState } from 'react';

export const ThemeContext = createContext(null);

export function ThemeProvider({ children }) {
  const [theme, setTheme] = useState('dark');
  const toggleTheme = () =>
    setTheme(t => (t === 'dark' ? 'light' : 'dark'));
  return (
    <ThemeContext.Provider value={{ theme, toggleTheme }}>
      {children}
    </ThemeContext.Provider>
  );
}`],
['Write a safe custom hook','Write useTheme() so that using it outside a ThemeProvider fails fast with a clear message.',
`import { useContext } from 'react';
import { ThemeContext } from './ThemeContext';

export function useTheme() {
  // TODO
}`,`export function useTheme() {
  const ctx = useContext(ThemeContext);
  if (!ctx) {
    throw new Error('useTheme must be used inside ThemeProvider');
  }
  return ctx;
}`],
['Fix the re-render trap','Every consumer re-renders whenever AuthProvider re-renders. Stabilize the value with useMemo.',
`function AuthProvider({ children }) {
  const [user, setUser] = useState(null);
  const logout = () => setUser(null);
  return (
    <AuthCtx.Provider value={{ user, logout }}>
      {children}
    </AuthCtx.Provider>
  );
}`,`function AuthProvider({ children }) {
  const [user, setUser] = useState(null);
  const logout = useCallback(() => setUser(null), []);
  const value = useMemo(() => ({ user, logout }), [user, logout]);
  return (
    <AuthCtx.Provider value={value}>
      {children}
    </AuthCtx.Provider>
  );
}`],
['Context + useReducer store','Complete authReducer for LOGIN (sets user from action.user) and LOGOUT (resets user to null).',
`const initial = { user: null };

function authReducer(state, action) {
  switch (action.type) {
    // TODO: LOGIN
    // TODO: LOGOUT
    default: return state;
  }
}`,`const initial = { user: null };

function authReducer(state, action) {
  switch (action.type) {
    case 'LOGIN':
      return { ...state, user: action.user };
    case 'LOGOUT':
      return { ...state, user: null };
    default: return state;
  }
}`],
['Consume it deep in the tree','Wrap App in the provider, then write Header that shows the theme and a button to toggle it, with no props.',
`function App() {
  // TODO: wrap with provider
  return <Header />;
}

function Header() {
  // TODO: read theme + toggleTheme
}`,`function App() {
  return (
    <ThemeProvider>
      <Header />
    </ThemeProvider>
  );
}

function Header() {
  const { theme, toggleTheme } = useTheme();
  return (
    <button onClick={toggleTheme}>Theme: {theme}</button>
  );
}`],
['Challenge: nearest wins','Make only <Sidebar /> render in "light" while the rest of the app stays "dark". No new context, no props.',
`<ThemeCtx.Provider value="dark">
  <Header />
  {/* TODO: Sidebar must see "light" */}
  <Sidebar />
  <Main />
</ThemeCtx.Provider>`,`<ThemeCtx.Provider value="dark">
  <Header />
  <ThemeCtx.Provider value="light">
    <Sidebar />
  </ThemeCtx.Provider>
  <Main />
</ThemeCtx.Provider>
// useContext walks up to the NEAREST Provider,
// so Sidebar gets "light"; Header and Main get "dark".`]];

const labCard=(l,i)=>`<div class="card lab"><h3><span>${String(i+1).padStart(2,'0')}</span>${l[0]}</h3><p>${l[1]}</p><div class="code"><header><span data-t>your workspace · editable</span><button class="btn" data-sol>Show solution</button></header><textarea spellcheck="false" data-ws>${esc(l[2])}</textarea><pre data-so style="display:none">${hl(l[3])}</pre></div></div>`;

const node=(x,y,t,c)=>`<g class="nd ${c}"><rect x="${x-80}" y="${y-28}" width="160" height="56" rx="14"/><text x="${x}" y="${y+8}" text-anchor="middle">${t}</text></g>`;
const SVG=`<svg id="tree" class="drill" viewBox="0 0 920 620" width="100%" height="100%">
<g><path class="ed d" d="M460 80V150M460 150H270V190M270 150 M270 240V300M270 350V420"/><path class="ed" d="M460 150H650V190M270 240H470V300"/><path class="ed d" d="M270 190V420"/><path class="ed d" d="M270 420V500"/><path class="ed" d="M470 350V500"/></g>
<path class="ed c cast-only" d="M540 60C900 100 900 420 350 510" stroke-width="3"/><path class="ed c cast-only" d="M540 60C860 120 760 400 550 505"/>
${node(460,55,'&lt;Provider&gt;','p')}${node(270,215,'Layout','m d')}${node(650,215,'Footer','m')}${node(270,325,'Sidebar','m d')}${node(470,325,'Main','m')}${node(270,445,'Menu','m d')}${node(270,545,'Avatar','u d')}${node(470,545,'Profile','u')}
<text x="60" y="330" class="drill-only" style="fill:var(--or)">props ×4</text><text x="640" y="470" class="cast-only" style="fill:var(--cy)">direct</text></svg>`;

const S=[
`<div class="slide hero"><div class="tag">Web Systems <i>/</i> Module 12</div><h1>React Context<br><em>Global State Broadcast</em></h1><p>Stop threading props through components that don't care. Broadcast themes, auth sessions and carts straight to the components that do.</p><div class="pills"><span class="pill o">createContext</span><span class="pill o">Provider</span><span class="pill">useContext</span><span class="pill">Custom Provider</span></div></div>`,
`<div class="slide">${hd('Where we left off','From local reducers to tree-wide broadcast',2)}<div class="row c2"><div class="card"><h3>M11 · useReducer</h3><ul><li>Predictable state transitions</li><li>State still lives in one top component</li><li>You pass <code>state</code> and <code>dispatch</code> down by hand</li></ul></div><div class="card hi"><h3>M12 · Context API</h3><ul><li>Publish a value once, near the top</li><li>Any descendant subscribes with <code>useContext</code></li><li>Middle layers are bypassed entirely</li></ul></div></div></div>`,
`<div class="slide">${hd('Core concept','Prop-drilling vs. a radio tower',3)}<div class="row c-6040"><div class="card" style="padding:14px">${SVG}</div><div class="col" style="display:flex;flex-direction:column;gap:24px"><div style="display:flex;gap:14px"><button class="btn on" data-m="drill">Prop-drilling</button><button class="btn" data-m="cast">Context broadcast</button></div><div class="card flex" id="tx"><h3>Handing a note down a hallway</h3><p>Avatar needs one value. Layout, Sidebar and Menu must each accept it and pass it along, even though none of them use it.</p></div></div></div></div>`,
`<div class="slide">${hd('The three moving parts','Create it. Broadcast it. Tune in.',4)}<div class="row c3"><div class="card"><div class="num">1</div><h3>createContext</h3><p>Makes the channel and sets a <b>default value</b> used when no Provider exists above.</p>${code("const Ctx = createContext(null);",'create')}</div><div class="card hi"><div class="num">2</div><h3>Provider</h3><p>Wraps a subtree and sets the <b>value</b> that everything inside can read.</p>${code("<Ctx.Provider value={v}>\n  {children}\n</Ctx.Provider>",'broadcast')}</div><div class="card wa"><div class="num">3</div><h3>useContext</h3><p>Reads the value from the <b>nearest</b> Provider above. Re-runs when it changes.</p>${code("const v = useContext(Ctx);",'consume')}</div></div></div>`,
`<div class="slide">${hd('Code','Theme context + custom hook',5)}<div class="row c-6040">${code(LABS[0][3].replace("export const ThemeContext","const ThemeContext").replace("createContext, useState","createContext, useContext, useState")+"\n\nexport function useTheme() {\n  const ctx = useContext(ThemeContext);\n  if (!ctx) throw new Error('Wrap in ThemeProvider');\n  return ctx;\n}",'ThemeContext.jsx')}<div style="display:flex;flex-direction:column;gap:24px"><div class="card hi"><h3>Provider owns state</h3><p>Any component can change theme, and every consumer updates.</p></div><div class="card wa"><h3>Hook guards the boundary</h3><p>The <code>throw</code> turns a silent <code>null</code> bug into an error that names the fix.</p></div></div></div></div>`,
`<div class="slide">${hd('Supporting info','When context fits, and when it doesn\'t',6)}<div class="row c2"><div class="card hi"><h3>Good fit: rarely changes, read widely</h3><ul><li>Theme, locale, feature flags</li><li>Current user / auth session</li><li>Cart or notification count</li></ul></div><div class="card wa"><h3>Poor fit: fast-changing or local</h3><ul><li>Form input typed every keystroke</li><li>State used by one parent and one child</li><li>Huge lists that update often</li></ul></div></div><p style="margin-top:26px"><b>Rule of thumb:</b> context is a <b>transport</b>, not a store. State still comes from <ic>useState</ic> or <ic>useReducer</ic>; context just delivers it.</p></div>`,
`<div class="slide">${hd('Under the hood','Why a new value re-renders every consumer',7)}<div class="row c2"><div class="card"><h3>The rule</h3><ul><li>React compares old and new <code>value</code> with <code>Object.is</code></li><li>Changed? <b>Every</b> consumer of that context re-renders</li><li><code>{{ user, logout }}</code> is a new object each render, so it always looks changed</li></ul></div><div style="display:flex;flex-direction:column;gap:20px">${code("// re-render trap\n<Ctx.Provider value={{ user, logout }}>",'❌ new object every time')}${code("const value = useMemo(\n  () => ({ user, logout }), [user, logout]\n);\n<Ctx.Provider value={value}>",'✅ stable reference')}</div></div></div>`,
`<div class="slide">${hd('Production pattern','Context + useReducer = mini global store',8)}<div class="row c-6040">${code("const AuthCtx = createContext(null);\n\nexport function AuthProvider({ children }) {\n  const [state, dispatch] = useReducer(\n    authReducer, initial\n  );\n  const value = useMemo(\n    () => ({ state, dispatch }), [state]\n  );\n  return (\n    <AuthCtx.Provider value={value}>\n      {children}\n    </AuthCtx.Provider>\n  );\n}",'AuthContext.jsx')}<div style="display:flex;flex-direction:column;gap:24px"><div class="card hi"><h3>Pro tip: split it</h3><p>Put <code>state</code> and <code>dispatch</code> in two contexts. Buttons that only dispatch never re-render on state change.</p></div><div class="card wa"><h3>Nearest wins</h3><p>Nest Providers to override a value for one subtree, like a light sidebar in a dark app.</p></div></div></div></div>`,
`<div class="slide hero"><div class="tag">Module 12 <i>/</i> Assessment</div><h1 style="font-size:120px">Quiz <em>time</em></h1><div class="pills"><span class="pill o">4 Multiple Choice</span><span class="pill">6 Coding Problems</span></div><p>Answers are checked instantly on MCQs. Coding labs are editable, with a solution reveal.</p></div>`,
...[0,1].map(n=>`<div class="slide">${hd('Multiple choice','Questions '+(n*2+1)+'–'+(n*2+2),10+n)}<div class="row c2">${[n*2,n*2+1].map(i=>{const m=MCQ[i];return `<div class="card mcq" data-a="${m.a}" data-i="${i}"><div class="q"><span>${i+1}.</span>${esc(m.q)}</div>${m.o.map((o,j)=>`<button class="opt" data-j="${j}">${esc(o)}</button>`).join('')}<div class="why"></div></div>`}).join('')}</div></div>`),
...[0,1,2].map(n=>`<div class="slide">${hd('Coding lab','Problems '+(n*2+1)+'–'+(n*2+2),12+n)}<div class="row c2">${labCard(LABS[n*2],n*2)}${labCard(LABS[n*2+1],n*2+1)}</div></div>`),
`<div class="slide">${hd('Answer key','Multiple choice',15+0)}<div class="row c2" style="grid-template-rows:1fr 1fr">${MCQ.map((m,i)=>`<div class="card"><h3><span style="color:var(--or);font-family:var(--mono)">${i+1}.</span> ${'ABCD'[m.a]}) ${esc(m.o[m.a])}</h3><p>${esc(m.e)}</p></div>`).join('')}</div></div>`,
...[0,1,2].map(n=>`<div class="slide">${hd('Answer key','Coding problems '+(n*2+1)+'–'+(n*2+2),16+n)}<div class="row c2">${[n*2,n*2+1].map(i=>`<div class="card lab"><h3><span>${String(i+1).padStart(2,'0')}</span>${LABS[i][0]}</h3><div class="code" style="flex:1"><header><span>solution</span></header><pre>${hl(LABS[i][3])}</pre></div></div>`).join('')}</div></div>`),
`<div class="slide hero"><div class="tag">Module 12 <i>/</i> Complete</div><h1 style="font-size:108px">Your state is now<br><em>broadcast, prop-free.</em></h1><div class="card wa" style="max-width:1150px"><h3>Next · M13 Performance &amp; Custom Hooks</h3><p>Optimize renders with useMemo, useCallback and useRef, then build reusable hooks.</p></div></div>`];

const cv=document.getElementById('canvas');cv.innerHTML=S.join('');
const sl=[...cv.children];sl.forEach((s,i)=>s.dataset.screenLabel=String(i+1).padStart(2,'0'));
let cur=0;try{cur=Math.min(sl.length-1,+localStorage.getItem('m12')||0)}catch(e){}
function show(n){cur=Math.max(0,Math.min(sl.length-1,n));sl.forEach((s,i)=>s.classList.toggle('on',i===cur));document.getElementById('lbl').textContent=String(cur+1).padStart(2,'0')+' / '+String(sl.length).padStart(2,'0')+(cur===0?'  ·  right-click → next':'');document.getElementById('bar').style.width=(cur+1)/sl.length*100+'%';try{localStorage.setItem('m12',cur)}catch(e){}}
function fit(){const k=Math.min(innerWidth/1760,innerHeight/990);cv.style.zoom=k;cv.style.width=innerWidth/k+'px';cv.style.height=innerHeight/k+'px'}
addEventListener('resize',fit);fit();show(cur);
addEventListener('contextmenu',e=>{if(e.target.closest('textarea'))return;e.preventDefault();e.shiftKey?show(cur-1):show(cur+1)});
addEventListener('mouseup',e=>{if(e.button===3){e.preventDefault();show(cur-1)}else if(e.button===4){e.preventDefault();show(cur+1)}});
let tx=0;addEventListener('touchstart',e=>tx=e.touches[0].clientX,{passive:true});addEventListener('touchend',e=>{const d=e.changedTouches[0].clientX-tx;if(Math.abs(d)>70&&!e.target.closest('textarea,pre'))show(cur+(d<0?1:-1))},{passive:true});
addEventListener('keydown',e=>{if(/TEXTAREA|INPUT/.test(document.activeElement.tagName))return;if(['ArrowRight',' ','PageDown'].includes(e.key)){e.preventDefault();show(cur+1)}else if(['ArrowLeft','PageUp'].includes(e.key))show(cur-1);else if(e.key==='Home')show(0);else if(e.key==='End')show(sl.length-1)});
