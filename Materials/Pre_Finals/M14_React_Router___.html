<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>M14 — Client Routing with React Router v6</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#07111F;--surface:#0C1A2E;--surface2:#0f1e33;--border:#1a2e48;--border2:#224070;
  --accent:#F43F5E;--accent2:#4ADE80;--accent3:#61DAFB;--accent4:#C084FC;--accent5:#FB923C;
  --text:#F0F6FF;--text2:#8FAFC8;--text3:#C8DCF0;--card:#090f1c;--card2:#0d1a2d;
  --mono:'JetBrains Mono',ui-monospace,monospace;
  --sans:'Inter',system-ui,sans-serif;
  --r:8px;--r2:12px;--tr:320ms cubic-bezier(.4,0,.2,1);
}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:16px;-webkit-font-smoothing:antialiased}
#bar{position:fixed;bottom:0;left:0;height:3px;background:linear-gradient(90deg,var(--accent),#e11d48);transition:width .35s ease;z-index:100}
#ctr{position:fixed;bottom:14px;left:20px;font-size:16px;color:var(--text2);z-index:100;font-family:var(--mono);letter-spacing:.5px;opacity:.7}
#nav-prev,#nav-next{position:fixed;top:50%;transform:translateY(-50%);z-index:90;background:rgba(10,20,35,.7);border:1px solid var(--border2);color:var(--text2);width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .2s;backdrop-filter:blur(8px);font-size:16px;user-select:none}
#nav-prev{left:10px}#nav-next{right:10px}
#nav-prev:hover,#nav-next:hover{background:var(--accent);color:#fff;border-color:var(--accent)}
#deck{width:100%;height:100vh;position:relative;overflow:hidden}
.slide{position:absolute;inset:0;display:flex;flex-direction:column;padding:44px 72px 40px;opacity:0;pointer-events:none;transform:translateX(40px);transition:opacity var(--tr),transform var(--tr);overflow-y:auto}
.slide.active{opacity:1;pointer-events:all;transform:translateX(0)}
.slide.out-l{opacity:0;transform:translateX(-40px)}
.slide.out-r{opacity:0;transform:translateX(40px)}
@media(prefers-reduced-motion:reduce){.slide{transition:opacity .15s;transform:none!important}}
.slide-tag{font-size:16px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--accent);margin-bottom:11px;display:flex;align-items:center;gap:8px;opacity:.85}
.slide-tag::after{content:'';flex:1;max-width:32px;height:1.5px;background:var(--accent);border-radius:1px;opacity:.6}
.slide-title{font-size:clamp(24px,2.8vw,40px);font-weight:800;line-height:1.1;color:var(--text);margin-bottom:4px;letter-spacing:-.4px}
.slide-sub{font-size:16px;color:var(--text2);margin-bottom:16px}
.rule{height:1px;background:linear-gradient(90deg,var(--border2) 0%,transparent 80%);border:none;margin-bottom:18px}
.content{flex:1;display:flex;flex-direction:column;gap:12px;min-height:0}
.g2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.g2>*,.g3>*{min-width:0}
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;flex:1;min-height:0}
.split>*{min-width:0;display:flex;flex-direction:column;gap:10px}
.col{display:flex;flex-direction:column;gap:10px;min-width:0}
.flex1{flex:1}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--r2);padding:14px 16px}
.card h3{font-size:16px;font-weight:700;letter-spacing:1px;color:var(--accent);margin-bottom:8px;text-transform:uppercase}
.card p,.card li{font-size:16px;color:var(--text3);line-height:1.65}
.card ul{padding-left:16px}.card li{margin-bottom:4px}
.cw{position:relative;background:#040C18;border:1px solid var(--border);border-radius:var(--r);overflow:hidden;flex:1;display:flex;flex-direction:column}
.cl{display:flex;align-items:center;justify-content:space-between;padding:6px 12px;background:#060d18;border-bottom:1px solid var(--border);font-size:16px;color:var(--text2);font-family:var(--mono);flex-shrink:0}
.cl span{color:var(--accent3);font-weight:500}
.cw pre{padding:12px 14px;overflow:auto;font-family:var(--mono);font-size:16px;line-height:1.75;white-space:pre;flex:1;max-height:320px}
.cpbtn{padding:3px 10px;font-size:16px;font-family:var(--sans);background:var(--surface2);border:1px solid var(--border2);color:var(--text2);border-radius:4px;cursor:pointer;transition:all .2s;white-space:nowrap}
.cpbtn:hover{background:var(--accent);color:#fff;border-color:var(--accent)}
.cpbtn.ok{background:var(--accent2);color:#07111F;border-color:var(--accent2)}
.k{color:#e879f9}.s{color:#86efac}.f{color:#c4b5fd}.n{color:#7dd3fc}
.cm{color:#2E4A65;font-style:italic}.t{color:#fca5a5}.b{color:#fcd34d}
.bdi{display:flex;gap:10px;align-items:flex-start;padding:9px 12px;background:var(--surface);border:1px solid var(--border);border-radius:6px;border-left:3px solid var(--accent)}
.bdi.g{border-left-color:var(--accent2)}.bdi.o{border-left-color:var(--accent3)}
.bdi.p{border-left-color:var(--accent4)}.bdi.r{border-left-color:var(--accent5)}
.bdl{font-family:var(--mono);font-size:16px;color:var(--accent);background:#040C18;padding:2px 7px;border-radius:3px;white-space:nowrap;min-width:fit-content;align-self:flex-start;margin-top:2px;flex-shrink:0;font-weight:700}
.bdi.g .bdl{color:var(--accent2)}.bdi.o .bdl{color:var(--accent3)}.bdi.p .bdl{color:var(--accent4)}
.bdt{font-size:16px;color:var(--text3);line-height:1.55}.bdt strong{color:var(--text);font-weight:600}
.flow{display:flex;align-items:center;flex-wrap:wrap;gap:0}
.fb{background:var(--card2);border:1px solid var(--border2);border-radius:6px;padding:6px 12px;font-size:16px;color:var(--text3);font-weight:500}
.fb.hi{border-color:var(--accent);color:var(--accent)}
.fa{color:var(--text2);padding:0 8px;font-size:16px}
.step{display:flex;gap:12px;align-items:flex-start;padding:10px 13px;background:var(--card);border:1px solid var(--border);border-radius:var(--r)}
.snum{width:26px;height:26px;border-radius:50%;background:var(--accent);color:#fff;font-weight:900;font-size:16px;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px}
.sbody h4{font-size:16px;font-weight:700;color:var(--text);margin-bottom:2px}
.sbody p{font-size:16px;color:var(--text2);line-height:1.5}
table{width:100%;border-collapse:collapse;font-size:16px}
th{background:var(--surface2);color:var(--accent);padding:8px 12px;text-align:left;font-weight:700;font-size:16px;letter-spacing:1px;text-transform:uppercase;border-bottom:1px solid var(--border)}
td{padding:8px 12px;border-bottom:1px solid var(--border);color:var(--text3);line-height:1.5;vertical-align:top}
tr:last-child td{border-bottom:none}
tr:hover td{background:rgba(255,255,255,.01)}
.pill{display:inline-block;padding:4px 12px;border-radius:20px;font-size:16px;font-weight:600;border:1px solid var(--border);color:var(--text2);margin:3px}
.pill.a{border-color:var(--accent);color:var(--accent);background:rgba(244,63,94,.07)}
.pill.g{border-color:var(--accent2);color:var(--accent2);background:rgba(74,222,128,.07)}
.pill.o{border-color:var(--accent3);color:var(--accent3);background:rgba(97,218,251,.07)}
.hero-bg{background:radial-gradient(ellipse at 10% 65%,rgba(244,63,94,.09) 0%,transparent 55%),radial-gradient(ellipse at 88% 20%,rgba(192,132,252,.07) 0%,transparent 50%),var(--bg)}
.hero-title{font-size:clamp(42px,5.2vw,68px);font-weight:900;line-height:1.05;letter-spacing:-2px}
.h1c{color:var(--text)}.h2c{color:var(--accent)}
.hero-sub{font-size:17px;color:var(--text2);max-width:560px;line-height:1.7;margin:12px 0 18px;font-weight:400}
.dots{position:absolute;inset:0;background-image:radial-gradient(rgba(244,63,94,.04) 1px,transparent 1px);background-size:28px 28px;pointer-events:none}
.ba{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;flex:1}
.ba-box{border-radius:var(--r);padding:14px 16px;border:1px solid var(--border)}
.ba-box.bad{background:rgba(251,146,60,.04);border-color:rgba(251,146,60,.18)}
.ba-box.good{background:rgba(244,63,94,.04);border-color:rgba(244,63,94,.18)}
.ba-box h4{font-size:16px;font-weight:700;letter-spacing:.5px;margin-bottom:10px}
.ba-box.bad h4{color:var(--accent5)}.ba-box.good h4{color:var(--accent)}
.ba-box p,.ba-box li{font-size:16px;color:var(--text3);line-height:1.65}
.ba-box ul{padding-left:16px}
.q-card{background:linear-gradient(135deg,var(--card),var(--surface));border-left:3px solid var(--accent);border-radius:0 var(--r) var(--r) 0;padding:14px 18px;margin-bottom:10px}
.q-text{font-size:16px;color:var(--text3);line-height:1.75;font-style:italic}
.q-src{font-size:16px;color:var(--accent);margin-top:6px;font-style:normal;font-weight:700;letter-spacing:.5px}
.rc-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.rc{background:var(--card);border:1px solid var(--border);border-radius:var(--r2);padding:15px;text-align:center}
.rc .ico{font-size:24px;margin-bottom:7px}
.rc h4{font-size:16px;font-weight:700;color:var(--accent);margin-bottom:4px;text-transform:uppercase;letter-spacing:.5px}
.rc p{font-size:16px;color:var(--text2);line-height:1.55}
ic{background:var(--surface2);padding:1px 6px;border-radius:4px;font-family:var(--mono);font-size:16px;color:var(--accent4);border:1px solid var(--border)}

/* VISUAL DIAGRAMS */
.visual-diagram{background:var(--card);border:1px solid var(--border);border-radius:var(--r2);padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.visual-diagram h4{font-size:16px;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:1px;margin-bottom:2px}
.lc-row{display:flex;align-items:center;gap:0;font-size:16px}
.lc-box{padding:6px 10px;border-radius:5px;font-family:var(--mono);font-size:16px;text-align:center;font-weight:600;white-space:nowrap}
.lc-arrow{color:var(--text2);padding:0 6px;font-size:16px;flex-shrink:0}
.lc-box.mount{background:rgba(74,222,128,.1);border:1px solid rgba(74,222,128,.25);color:var(--accent2)}
.lc-box.render{background:rgba(97,218,251,.1);border:1px solid rgba(97,218,251,.25);color:var(--accent3)}
.lc-box.action{background:rgba(244,63,94,.1);border:1px solid rgba(244,63,94,.25);color:var(--accent)}
.lc-box.result{background:rgba(250,204,21,.1);border:1px solid rgba(250,204,21,.25);color:#facc15}
.lc-box.skip{background:rgba(192,132,252,.1);border:1px solid rgba(192,132,252,.25);color:var(--accent4)}

/* URL anatomy visual */
.url-bar{background:#040C18;border:1px solid var(--border2);border-radius:6px;padding:10px 14px;font-family:var(--mono);font-size:16px;display:flex;align-items:center;gap:0;flex-wrap:wrap}
.url-seg{padding:2px 4px;border-radius:3px;font-weight:600}
.url-seg.host{color:var(--text2)}
.url-seg.path{color:var(--accent3)}
.url-seg.param{color:var(--accent);background:rgba(250,204,21,.1);border:1px solid rgba(250,204,21,.2)}
.url-seg.sep{color:var(--text2);opacity:.5}
.url-label{display:flex;flex-direction:column;gap:4px;margin-top:6px}
.url-label-row{display:flex;align-items:center;gap:8px;font-size:16px}
.url-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}

/* SPA vs reload visual */
.compare-row{display:flex;gap:10px}
.compare-col{flex:1;padding:10px 12px;border-radius:6px;display:flex;flex-direction:column;gap:6px}
.compare-col.bad{background:rgba(251,146,60,.05);border:1px solid rgba(251,146,60,.2)}
.compare-col.good{background:rgba(74,222,128,.05);border:1px solid rgba(74,222,128,.2)}
.compare-col h5{font-size:16px;font-weight:700;text-transform:uppercase;letter-spacing:.5px}
.compare-col.bad h5{color:var(--accent5)}
.compare-col.good h5{color:var(--accent2)}
.compare-step{font-size:16px;color:var(--text3);padding:4px 8px;background:rgba(255,255,255,.03);border-radius:4px;line-height:1.4}

/* outlet diagram */
.outlet-diagram{display:flex;flex-direction:column;align-items:stretch;gap:2px}
.od-shell{border:1px solid rgba(97,218,251,.3);border-radius:6px;padding:8px 10px;background:rgba(97,218,251,.04)}
.od-label{font-size:16px;font-weight:700;color:var(--accent3);margin-bottom:6px;font-family:var(--mono)}
.od-outlet{border:2px dashed rgba(244,63,94,.4);border-radius:4px;padding:8px 10px;background:rgba(244,63,94,.04);text-align:center;font-size:16px;color:var(--accent);font-weight:600;position:relative}
.od-child{margin:4px 8px;border:1px solid rgba(74,222,128,.3);border-radius:4px;padding:6px 10px;background:rgba(74,222,128,.04);font-size:16px;color:var(--accent2);font-family:var(--mono)}

/* ACTIVITIES */
.act-grid{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:12px;flex:1;min-height:0}
.act-panel{background:var(--card);border:1px solid var(--border);border-radius:var(--r2);padding:14px 15px;display:flex;flex-direction:column;gap:8px;overflow:hidden;min-height:0}
.act-panel-header{display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.act-panel-title{font-size:16px;font-weight:700;text-transform:uppercase;letter-spacing:1px}
.act-panel-pts{font-size:16px;font-weight:700;font-family:var(--mono);padding:2px 8px;border-radius:10px;background:rgba(244,63,94,.1);border:1px solid rgba(244,63,94,.2);color:var(--accent)}
.act-body{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:6px;min-height:0}
.mc-item{display:flex;flex-direction:column;gap:5px}
.mc-q{font-size:16px;font-weight:600;color:var(--text);line-height:1.45}
.qn{color:var(--accent);margin-right:5px;font-weight:800;font-family:var(--mono)}
.mc-opts{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.mc-opt{padding:6px 10px;border-radius:5px;border:1px solid var(--border);font-size:16px;color:var(--text3);cursor:pointer;transition:all .15s;background:var(--surface2);line-height:1.35;user-select:none}
.mc-opt:hover{border-color:var(--accent);color:var(--text)}
.mc-opt.sel{border-color:var(--accent);background:rgba(244,63,94,.08);color:var(--accent)}
.mc-sep{height:1px;background:var(--border);flex-shrink:0}
.id-item{display:flex;gap:8px;align-items:stretch}
.id-q{flex:1;background:#040C18;border:1px solid var(--border);border-radius:5px;padding:7px 10px;font-size:16px;color:var(--text3);line-height:1.45;display:flex;align-items:center;gap:6px}
.id-num{font-family:var(--mono);font-weight:800;color:var(--accent4);font-size:16px;flex-shrink:0}
.id-ans{width:130px;flex-shrink:0}
.id-ta{width:100%;height:100%;min-height:44px;padding:6px 9px;background:var(--surface2);border:1px solid var(--border);border-radius:5px;color:var(--text);font-size:16px;font-family:var(--mono);outline:none;resize:none;line-height:1.5;transition:border .2s}
.id-ta:focus{border-color:var(--accent4)}
.gto-item{display:flex;gap:8px;align-items:stretch}
.gto-pre-sm{background:#040C18;border:1px solid var(--border);border-radius:5px;padding:7px 10px;font-family:var(--mono);font-size:16px;color:var(--text3);white-space:pre;overflow-x:auto;flex:1;line-height:1.6}
.gto-right-sm{display:flex;flex-direction:column;gap:3px;width:130px;flex-shrink:0}
.gto-alabel{font-size:16px;color:var(--text2);font-weight:700;text-transform:uppercase;letter-spacing:.8px}
.gto-ta{width:100%;flex:1;min-height:52px;padding:6px 8px;background:var(--surface2);border:1px solid var(--border);border-radius:5px;color:var(--text);font-size:16px;font-family:var(--mono);outline:none;resize:none;line-height:1.5;transition:border .2s}
.gto-ta:focus{border-color:var(--accent4)}
.chal-item{background:var(--card);border:1px solid var(--border);border-radius:var(--r2);padding:14px;display:flex;gap:12px;flex:1}
.chal-left{flex:1;display:flex;flex-direction:column;gap:8px;min-width:0}
.chal-badge{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:12px;font-size:16px;font-weight:700;background:rgba(192,132,252,.12);border:1px solid rgba(192,132,252,.3);color:var(--accent4);width:fit-content}
.chal-q{font-size:16px;font-weight:600;color:var(--text);line-height:1.45}
.chal-pre{background:#040C18;border:1px solid var(--border);border-radius:6px;padding:10px 12px;font-family:var(--mono);font-size:16px;color:var(--text3);white-space:pre;overflow-x:auto;flex:1;line-height:1.7}
.chal-right{width:200px;flex-shrink:0;display:flex;flex-direction:column;gap:8px}
.hint-btn{width:100%;padding:7px 12px;background:rgba(192,132,252,.08);border:1px solid rgba(192,132,252,.25);border-radius:6px;color:var(--accent4);font-size:16px;font-weight:600;font-family:var(--sans);cursor:pointer;transition:all .2s;text-align:left}
.hint-btn:hover{background:rgba(192,132,252,.15)}
.hint-reveal{background:rgba(192,132,252,.07);border:1px solid rgba(192,132,252,.2);border-radius:6px;padding:8px 10px;font-size:16px;color:var(--text3);line-height:1.55;display:none}
.hint-reveal.open{display:block}
.chal-ta{width:100%;flex:1;min-height:80px;padding:8px 10px;background:var(--surface2);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:16px;font-family:var(--mono);outline:none;resize:none;line-height:1.6;transition:border .2s}
.chal-ta:focus{border-color:var(--accent4)}
.chal-alabel{font-size:16px;color:var(--text2);font-weight:700;text-transform:uppercase;letter-spacing:.8px}
.ans-block{border:1px solid var(--border);border-radius:var(--r2);overflow:hidden;flex:1}
.ans-row{display:flex;gap:10px;padding:8px 13px;border-bottom:1px solid var(--border);font-size:16px;align-items:flex-start}
.ans-row:last-child{border:none}
.ans-row:nth-child(even){background:rgba(255,255,255,.01)}
.anum{font-weight:800;min-width:22px;font-variant-numeric:tabular-nums;font-family:var(--mono);font-size:16px;flex-shrink:0;margin-top:2px}
.anum.b{color:var(--accent)}.anum.p{color:var(--accent4)}.anum.c{color:var(--accent2)}
.abody{color:var(--text3);line-height:1.5;flex:1;min-width:0;font-size:16px}
.abody strong{color:var(--accent2)}
#modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:200;align-items:center;justify-content:center}
#modal.open{display:flex}
.mbox{background:var(--surface);border:1px solid var(--border2);border-radius:14px;padding:24px 28px;min-width:300px}
.mbox h3{font-size:16px;font-weight:700;color:var(--accent);margin-bottom:12px}
.shr{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--border);font-size:16px;color:var(--text3)}
.shr:last-of-type{border:none}
.shr kbd{background:var(--surface2);border:1px solid var(--border2);border-radius:4px;padding:2px 7px;font-family:var(--mono);font-size:16px;color:var(--text)}
.mcl{margin-top:14px;width:100%;padding:8px;background:var(--accent);color:#fff;border:none;border-radius:6px;cursor:pointer;font-size:16px;font-weight:700;font-family:var(--sans)}
#hint-bar{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);font-size:16px;color:var(--text2);letter-spacing:.4px;pointer-events:none;opacity:.4;font-family:var(--mono)}

/* ── 2x2 ACTIVITY GRID ── */
.act2x2{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:11px;flex:1;min-height:0}
.act-cell{background:var(--card);border:1px solid var(--border);border-radius:var(--r2);padding:12px 13px;display:flex;flex-direction:column;gap:6px;overflow:hidden;min-height:0}
.act-cell-hd{font-size:16px;font-weight:800;text-transform:uppercase;letter-spacing:1.2px;flex-shrink:0;display:flex;align-items:center;gap:6px}

    <button class="mcl" onclick="document.getElementById('modal').classList.remove('open')">Close</button>
  </div>
</div>
<script>
function hl(raw){
  const KW=/^(const|let|var|function|return|async|await|try|catch|throw|new|class|extends|if|else|for|while|import|export|default|from|of|in|true|false|null|undefined|void)\b/;
  const TY=/^(React|ReactDOM|createBrowserRouter|RouterProvider|Outlet|Link|NavLink|useParams|useNavigate|useLocation|console|document|window)\b/;
  const NUM=/^\b\d+(\.\d+)?\b/;
  function e(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
  let i=0,o='';
  while(i<raw.length){
    if(raw[i]==='/'&&raw[i+1]==='/'){const end=raw.indexOf('\n',i);const ch=end<0?raw.slice(i):raw.slice(i,end);o+='<span class="cm">'+e(ch)+'</span>';i+=ch.length;continue;}
    if(raw[i]==='`'){let j=i+1;while(j<raw.length&&raw[j]!=='`'){if(raw[j]==='\\')j++;j++;}o+='<span class="s">'+e(raw.slice(i,j+1))+'</span>';i=j+1;continue;}
    if(raw[i]==="'"){let j=i+1;while(j<raw.length&&raw[j]!=="'"&&raw[j]!=='\n'){if(raw[j]==='\\')j++;j++;}o+='<span class="s">'+e(raw.slice(i,j+1))+'</span>';i=j+1;continue;}
    if(raw[i]==='"'){let j=i+1;while(j<raw.length&&raw[j]!=='"'&&raw[j]!=='\n'){if(raw[j]==='\\')j++;j++;}o+='<span class="s">'+e(raw.slice(i,j+1))+'</span>';i=j+1;continue;}
    const rest=raw.slice(i);let m;
    if((m=rest.match(KW))){o+='<span class="k">'+m[0]+'</span>';i+=m[0].length;continue;}
    if((m=rest.match(TY))){o+='<span class="t">'+m[0]+'</span>';i+=m[0].length;continue;}
    if((m=rest.match(NUM))){o+='<span class="n">'+m[0]+'</span>';i+=m[0].length;continue;}
    o+=e(raw[i]);i++;
  }
  return o;
}
function cw(code,lang,label){
  const id='c'+Math.random().toString(36).slice(2);
  const body=(lang==='jsx'||lang==='js')?hl(code):code.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  return '<div class="cw"><div class="cl"><span>'+(label||lang)+'</span><button class="cpbtn" onclick="doCopy(\''+id+'\',this)">Copy</button></div><pre id="'+id+'">'+body+'</pre></div>';
}
function doCopy(id,btn){
  navigator.clipboard.writeText(document.getElementById(id).textContent).then(()=>{
    btn.textContent='Copied!';btn.classList.add('ok');
    setTimeout(()=>{btn.textContent='Copy';btn.classList.remove('ok');},2000);
  });
}

// ENGINE
function pickOpt(el){
  el.closest('.mc-opts').querySelectorAll('.mc-opt').forEach(x=>x.classList.remove('sel'));
  el.classList.add('sel');
}
function toggleHint(btn){
  const reveal=btn.nextElementSibling;
  reveal.classList.toggle('open');
  btn.textContent=reveal.classList.contains('open')?'🙈 Hide hint':'💡 Reveal hint';
}
let cur=0;
const deck=document.getElementById('deck');
const bar=document.getElementById('bar');
const ctr=document.getElementById('ctr');
function build(){
  S.forEach((s,i)=>{
    const el=document.createElement('div');
    el.className='slide'+(s.cls?' '+s.cls:'');
    el.innerHTML=s.h||'';
    if(i===0)el.classList.add('active');
    deck.appendChild(el);
    if(s.init)s.init(el);
    el.querySelectorAll('.long-code').forEach(pre=>{pre.innerHTML=hl(pre.textContent);});
  });
}
function go(n){
  if(n<0||n>=S.length||n===cur)return;
  const els=deck.querySelectorAll('.slide');
  const fwd=n>cur;
  els[cur].classList.remove('active');
  els[cur].classList.add(fwd?'out-l':'out-r');
  setTimeout(()=>els[cur].classList.remove('out-l','out-r'),380);
  cur=n;els[cur].classList.add('active');els[cur].scrollTop=0;tick();
}
function tick(){
  bar.style.width=(S.length>1?(cur/(S.length-1)*100):100)+'%';
  ctr.textContent=(cur+1)+' / '+S.length;
}
document.addEventListener('keydown',e=>{
  const m=document.getElementById('modal');
  if(m.classList.contains('open')){if(e.key==='Escape')m.classList.remove('open');return;}
  const t=document.activeElement.tagName;
  if(t==='INPUT'||t==='TEXTAREA')return;
  if(e.key==='ArrowRight'||e.key==='ArrowDown')go(cur+1);
  else if(e.key==='ArrowLeft'||e.key==='ArrowUp')go(cur-1);
  else if(e.key==='Home')go(0);
  else if(e.key==='End')go(S.length-1);
  else if(e.key==='?')m.classList.add('open');
  else if(e.key==='Escape')m.classList.remove('open');
});
document.addEventListener('mousedown',e=>{
  if(e.target.closest('button,input,a,.mc-opt,.gto-ta,.id-ta,.chal-ta'))return;
  if(e.button===2){e.preventDefault();e.stopImmediatePropagation();go(cur+1);}
},true);
document.addEventListener('contextmenu',e=>{
  if(e.target.closest('button,input,a'))return;
  e.preventDefault();e.stopImmediatePropagation();
},true);
let tx=0;
document.addEventListener('touchstart',e=>tx=e.touches[0].clientX,{passive:true});
document.addEventListener('touchend',e=>{const d=e.changedTouches[0].clientX-tx;if(Math.abs(d)>50){d<0?go(cur+1):go(cur-1);}},{passive:true});
build();tick();
</script>
