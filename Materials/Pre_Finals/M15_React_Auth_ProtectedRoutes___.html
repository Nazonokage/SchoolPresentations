<script>
function hl(raw){const KW=/^(const|let|var|function|return|async|await|try|catch|throw|new|class|extends|if|else|for|while|import|export|default|from|of|in|true|false|null|undefined|void|switch|case|break|typeof|instanceof|this)\b/;const TY=/^(React|createContext|useContext|useState|useEffect|Navigate|Outlet|axios|console|document|JSON|Array|Object|Math|Promise|Error|localStorage)\b/;const NUM=/^\b\d+(\.\d+)?\b/;const FN=/^[a-zA-Z_$][\w$]*(?=\s*\()/;function e(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}let i=0,o='';while(i<raw.length){if(raw[i]==='/'&&raw[i+1]==='/'){const end=raw.indexOf('\n',i);const ch=end<0?raw.slice(i):raw.slice(i,end);o+='<span class="cm">'+e(ch)+'</span>';i+=ch.length;continue}if(raw[i]==='/'&&raw[i+1]==='*'){const end=raw.indexOf('*/',i+2);const ch=end<0?raw.slice(i):raw.slice(i,end+2);o+='<span class="cm">'+e(ch)+'</span>';i+=ch.length;continue}if(raw[i]==='`'){let j=i+1;while(j<raw.length&&raw[j]!=='`'){if(raw[j]==='\\')j++;j++}o+='<span class="s">'+e(raw.slice(i,j+1))+'</span>';i=j+1;continue}if(raw[i]==="'"){let j=i+1;while(j<raw.length&&raw[j]!=="'"&&raw[j]!=='\n'){if(raw[j]==='\\')j++;j++}o+='<span class="s">'+e(raw.slice(i,j+1))+'</span>';i=j+1;continue}if(raw[i]==='"'){let j=i+1;while(j<raw.length&&raw[j]!=='"'&&raw[j]!=='\n'){if(raw[j]==='\\')j++;j++}o+='<span class="s">'+e(raw.slice(i,j+1))+'</span>';i=j+1;continue}const rest=raw.slice(i);let m;if((m=rest.match(KW))){o+='<span class="k">'+m[0]+'</span>';i+=m[0].length;continue}if((m=rest.match(TY))){o+='<span class="t">'+m[0]+'</span>';i+=m[0].length;continue}if((m=rest.match(NUM))){o+='<span class="n">'+m[0]+'</span>';i+=m[0].length;continue}if((m=rest.match(FN))){o+='<span class="f">'+m[0]+'</span>';i+=m[0].length;continue}o+=e(raw[i]);i++}return o}
function cw(code,lang,label){const id='c'+Math.random().toString(36).slice(2);const body=(lang==='jsx'||lang==='js')?hl(code):code.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');return '<div class="cw"><div class="cl"><span>'+(label||lang)+'</span><button class="cpbtn" onclick="doCopy(\''+id+'\',this)">Copy</button></div><pre id="'+id+'">'+body+'</pre></div>'}
function doCopy(id,btn){navigator.clipboard.writeText(document.getElementById(id).textContent).then(()=>{btn.textContent='Copied!';btn.classList.add('ok');setTimeout(()=>{btn.textContent='Copy';btn.classList.remove('ok')},1800)})}
const S=[];
S.push({cls:'hero-bg',h:`<div class="dots"></div><div style="flex:1;display:flex;flex-direction:column;justify-content:center;position:relative"><div class="eyebrow" style="margin-bottom:16px">Web Systems · Module 15</div><div class="hero-title"><div class="h1c">React Auth &amp;</div><div class="h2c">Protected Routes</div></div><div class="hero-sub">Securing Client SPAs — JWT tokens, AuthContext state, and ProtectedRoute layout guards.</div><div><span class="pill r">JWT Tokens</span><span class="pill r">AuthContext</span><span class="pill g">ProtectedRoute</span><span class="pill a">&lt;Navigate replace /&gt;</span></div></div>`});
S.push({h:`<div class="eyebrow">Where We Left Off</div><div class="slide-title">M14 → M15: From Open Routing to Access Guards</div><hr class="rule"/><div class="content"><div class="ba"><div class="ba-box bad"><h4>Open Client Routing</h4><ul><li>SPA paths like /dashboard and /settings</li><li>Layout routes with persistent Navbars and Outlet</li><li>Anyone typing the URL can see confidential pages</li><li>No identity verification or token controls</li></ul></div><div class="ba-box good"><h4>Protected Routes</h4><ul><li>JWT authentication sessions</li><li>Auth credentials in AuthContext</li><li>ProtectedRoute guard component</li><li>Redirect unauthenticated users to /login</li></ul></div></div><div class="card"><h3>The Throughline</h3><p>Frontend route protection stops unauthenticated users from viewing sensitive dashboards. Backend JWT verification still rejects unauthorized API requests.</p></div></div>`});
S.push({h:`<div class="eyebrow">Core Concept</div><div class="slide-title">Airport Security Gate and Digital Passport</div><hr class="rule"/><div class="content split"><div class="col"><div class="card flex1" style="border-left:3px solid var(--accent5)"><h3 style="color:var(--accent5)">Airport Gate Analogy</h3><p>A JWT is your boarding pass. ProtectedRoute is the security gate. Without a valid pass, you are redirected to check-in (login). With a valid pass, you walk through to the lounge (dashboard).</p></div></div><div class="col"><div class="card flex1" style="border-left:3px solid var(--accent)"><h3>Key pieces</h3><p><ic>JWT</ic> — signed session token<br/><ic>AuthContext</ic> — holds token + login/logout<br/><ic>ProtectedRoute</ic> — checks isAuth before Outlet<br/><ic>Navigate replace</ic> — redirect without history loop</p></div></div></div>`});
S.push({h:`<div class="eyebrow">What / How / Why</div><div class="slide-title">Auth Fundamentals</div><hr class="rule"/><div class="content g3"><div class="card"><h3>What It Is</h3><p>Client-side access control that redirects unauthenticated users away from private routes using shared auth state.</p></div><div class="card"><h3>How It Works</h3><p>AuthProvider stores the token. ProtectedRoute reads isAuth. If false, render Navigate to /login. If true, render Outlet.</p></div><div class="card"><h3>Why It Matters</h3><p>Stops casual URL access to dashboards. Still requires server-side JWT verification for real security.</p></div></div>`});
S.push({h:`<div class="eyebrow">Code Implementation</div><div class="slide-title">AuthContext and AuthProvider</div><hr class="rule"/><div class="content">${cw(`import { createContext, useContext, useState } from 'react';

const AuthContext = createContext(null);

export function AuthProvider({ children }) {
  const [token, setToken] = useState(() => localStorage.getItem('token'));

  const login = (newToken) => {
    localStorage.setItem('token', newToken);
    setToken(newToken);
  };

  const logout = () => {
    localStorage.removeItem('token');
    setToken(null);
  };

  return (
    <AuthContext.Provider value={{ token, isAuth: !!token, login, logout }}>
      {children}
    </AuthContext.Provider>
  );
}

export const useAuth = () => useContext(AuthContext);`,'jsx','src/context/AuthContext.jsx')}</div>`});
S.push({h:`<div class="eyebrow">Code Implementation</div><div class="slide-title">ProtectedRoute Guard</div><hr class="rule"/><div class="content">${cw(`import { Navigate, Outlet } from 'react-router-dom';
import { useAuth } from '../context/AuthContext';

export function ProtectedRoute() {
  const { isAuth } = useAuth();

  if (!isAuth) {
    return <Navigate to="/login" replace />;
  }

  return <Outlet />;
}`,'jsx','src/components/ProtectedRoute.jsx')}</div>`});
S.push({h:`<div class="eyebrow">Code Implementation</div><div class="slide-title">Wiring Protected Routes in the Router</div><hr class="rule"/><div class="content">${cw(`import { createBrowserRouter } from 'react-router-dom';
import { ProtectedRoute } from './components/ProtectedRoute';
import { Dashboard } from './pages/Dashboard';
import { Login } from './pages/Login';

export const router = createBrowserRouter([
  { path: '/login', element: <Login /> },
  {
    element: <ProtectedRoute />,
    children: [
      { path: '/dashboard', element: <Dashboard /> },
      { path: '/settings', element: <Settings /> },
    ],
  },
]);`,'jsx','src/router.jsx')}</div>`});
S.push({h:`<div class="eyebrow">Common Pitfalls</div><div class="slide-title">Auth Security Traps</div><hr class="rule"/><div class="content"><div class="ba"><div class="ba-box bad"><h4>Client-Only Protection</h4>${cw(`{user.isAdmin && <DeleteDatabaseButton />}`,'jsx','UI-only hide')}<p style="margin-top:8px">Hiding buttons does not secure the API. Attackers can still POST directly.</p></div><div class="ba-box good"><h4>Full-Stack Security</h4>${cw(`app.post('/api/delete', verifyJwtToken, (req, res) => { ... });`,'js','Server guard')}<p style="margin-top:8px">Express must verify JWT on every sensitive endpoint.</p></div></div></div>`});
S.push({h:`<div class="eyebrow">Production Patterns</div><div class="slide-title">Role-Based Protected Routes</div><hr class="rule"/><div class="content"><div class="card" style="margin-bottom:12px"><h3>Restrict by User Role</h3><p>Extend the guard to check allowed roles before rendering children.</p></div>${cw(`export function RoleRoute({ allowedRoles }) {
  const { user, isAuth } = useAuth();

  if (!isAuth) return <Navigate to="/login" replace />;
  if (!allowedRoles.includes(user?.role)) {
    return <Navigate to="/unauthorized" replace />;
  }
  return <Outlet />;

let cur=0;const deck=document.getElementById('deck');const bar=document.getElementById('bar');const ctr=document.getElementById('ctr');
function build(){S.forEach((s,i)=>{const el=document.createElement('div');el.className='slide'+(s.cls?' '+s.cls:'');el.innerHTML=s.h||'';if(i===0)el.classList.add('active');deck.appendChild(el);if(s.init)s.init(el)})}
function go(n){if(n<0||n>=S.length||n===cur)return;const els=deck.querySelectorAll('.slide');const fwd=n>cur;els[cur].classList.remove('active');els[cur].classList.add(fwd?'out-l':'out-r');setTimeout(()=>els[cur].classList.remove('out-l','out-r'),420);cur=n;els[cur].classList.add('active');els[cur].scrollTop=0;tick()}
function tick(){bar.style.width=(S.length>1?(cur/(S.length-1)*100):100)+'%';ctr.textContent=(cur+1)+' / '+S.length}
document.addEventListener('keydown',e=>{const m=document.getElementById('modal');if(m.classList.contains('open')){if(e.key==='Escape')m.classList.remove('open');return}if(document.activeElement.tagName==='INPUT'||document.activeElement.tagName==='TEXTAREA')return;if(e.key==='ArrowRight'||e.key==='ArrowDown')go(cur+1);else if(e.key==='ArrowLeft'||e.key==='ArrowUp')go(cur-1);else if(e.key==='Home')go(0);else if(e.key==='End')go(S.length-1);else if(e.key==='?')m.classList.add('open')});
document.addEventListener('mousedown',e=>{if(e.target.closest('button,input,a,.mc-opt,.gto-ta,textarea'))return;if(e.button===2){e.preventDefault();e.stopImmediatePropagation();go(cur+1)}else if(e.button===3){e.preventDefault();e.stopImmediatePropagation();go(cur-1)}else if(e.button===4){e.preventDefault();e.stopImmediatePropagation();go(cur+1)}},true);
document.addEventListener('contextmenu',e=>{if(e.target.closest('button,input,a'))return;e.preventDefault();e.stopImmediatePropagation()},true);
document.addEventListener('auxclick',e=>{if(e.button===3||e.button===4){e.preventDefault();e.stopImmediatePropagation()}},true);
build();tick();
