<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>M6 — React Fundamentals</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0A1622;
  --surface:#0F1E2E;
  --surface2:#15283B;
  --border:#1D3348;
  --border2:#2B4A65;
  --accent:#FF6B4A;
  --accent2:#5FD8A6;
  --accent3:#F0B429;
  --accent4:#9C8CF0;
  --accent5:#F2789A;
  --text:#F0F6FC;
  --text2:#B8D4F0;
  --text3:#E8F1FA;
  --card:#0D1C2B;
  --card2:#112238;
  --font:'Segoe UI',system-ui,sans-serif;
  --mono:'Cascadia Code','Fira Code','Consolas',monospace;
  --r:6px;--r2:10px;
  --tr:350ms cubic-bezier(.4,0,.2,1);
}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:var(--font)}
#bar{position:fixed;top:0;left:0;height:3px;background:linear-gradient(90deg,var(--accent),var(--accent4));transition:width .3s;z-index:100;border-radius:0 2px 2px 0}
#ctr{position:fixed;top:10px;right:16px;font-size:16px;color:var(--text2);z-index:100;font-variant-numeric:tabular-nums;letter-spacing:.5px;font-family:var(--mono)}
#deck{width:100%;height:100vh;position:relative;overflow:hidden}
.slide{position:absolute;inset:0;display:flex;flex-direction:column;padding:50px 64px 34px;opacity:0;pointer-events:none;transform:translateX(48px);transition:opacity var(--tr),transform var(--tr);overflow-y:auto}
.slide.active{opacity:1;pointer-events:all;transform:translateX(0)}
.slide.out-l{opacity:0;transform:translateX(-48px)}
.slide.out-r{opacity:0;transform:translateX(48px)}
@media(prefers-reduced-motion:reduce){.slide{transition:opacity .15s;transform:none!important}}
.eyebrow{font-size:16px;font-weight:700;letter-spacing:1.5px;color:var(--accent);margin-bottom:9px;display:flex;align-items:center;gap:6px;font-family:var(--mono)}
.eyebrow::before{content:'//';color:var(--border2);font-weight:400}
.slide-title{font-size:clamp(27px,3.2vw,44px);font-weight:800;line-height:1.1;color:var(--text);margin-bottom:5px;letter-spacing:-.5px}
.slide-sub{font-size:16px;color:var(--text2);margin-bottom:20px}
.rule{height:0;border:none;border-top:1px dashed var(--border2);margin-bottom:20px}
.content{flex:1;display:flex;flex-direction:column;gap:13px;min-height:0}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:13px;min-height:0}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:11px}
.g2>*,.g3>*{min-width:0}
.split{display:grid;grid-template-columns:1fr 1fr;gap:16px;flex:1;min-height:0}
.split>*{min-width:0;display:flex;flex-direction:column;gap:10px}
.col{display:flex;flex-direction:column;gap:10px;min-width:0}
.card{background:var(--card);border:1px solid var(--border);border-top:2px solid var(--border2);border-radius:0 0 var(--r2) var(--r2);padding:15px 17px;position:relative}
.card h3{font-size:16px;font-weight:700;text-transform:uppercase;letter-spacing:1.3px;color:var(--accent);margin-bottom:9px;display:flex;align-items:center;gap:7px}
.card h3::before{content:'';width:6px;height:6px;background:var(--accent);flex-shrink:0}
.card p,.card li{font-size:16px;color:var(--text3);line-height:1.55}
.card ul{padding-left:16px}.card li{margin-bottom:4px}
/* CODE */
.cw{position:relative;background:#050D1A;border:1px solid var(--border);border-radius:var(--r);overflow:hidden;flex:1;display:flex;flex-direction:column;min-height:0}
.cl{display:flex;align-items:center;justify-content:space-between;padding:6px 12px;background:#090F1E;border-bottom:1px solid var(--border);font-size:16px;color:var(--text2);font-family:var(--mono);flex-shrink:0}
.cl span{color:var(--accent3)}
.cw pre{padding:11px 13px;overflow:auto;font-family:var(--mono);font-size:16px;line-height:1.6;white-space:pre;flex:1;min-height:0;max-height:none}
.cpbtn{padding:4px 11px;font-size:16px;font-family:var(--font);background:var(--surface2);border:1px solid var(--border2);color:var(--text2);border-radius:4px;cursor:pointer;transition:all .2s;white-space:nowrap}
.cpbtn:hover{background:var(--accent);color:#08101E;border-color:var(--accent)}
.cpbtn.ok{background:var(--accent2);color:#08101E;border-color:var(--accent2)}
/* syntax */
.k{color:#F472B6}.s{color:#86EFAC}.f{color:#C4B5FD}.n{color:#7DD3FC}
.cm{color:#3D5470;font-style:italic}.t{color:#FCA5A5}.b{color:#FCD34D}
/* BREAKDOWN */
.bd{display:flex;flex-direction:column;gap:7px}
.bdi{display:flex;gap:10px;align-items:flex-start;padding:9px 11px;background:var(--surface);border:1px solid var(--border);border-radius:6px;border-left:3px solid var(--accent)}
.bdi.g{border-left-color:var(--accent2)}.bdi.o{border-left-color:var(--accent3)}
.bdi.p{border-left-color:var(--accent4)}.bdi.r{border-left-color:var(--accent5)}
.bdl{font-family:var(--mono);font-size:16px;color:var(--accent);background:#050D1A;padding:2px 7px;border-radius:3px;white-space:nowrap;min-width:fit-content;align-self:flex-start;margin-top:1px;flex-shrink:0}
.bdt{font-size:16px;color:var(--text3);line-height:1.5}.bdt strong{color:var(--text);font-weight:600}
/* TABLES */
table{width:100%;border-collapse:collapse;font-size:16px}
th{background:var(--surface2);color:var(--accent);padding:8px 12px;text-align:left;font-weight:700;font-size:16px;letter-spacing:1px;text-transform:uppercase;border-bottom:1px solid var(--border)}
td{padding:8px 12px;border-bottom:1px solid var(--border);color:var(--text3);line-height:1.5;vertical-align:top}
tr:last-child td{border-bottom:none}
tr:hover td{background:rgba(255,255,255,.015)}
/* PILLS */
.pill{display:inline-block;padding:4px 12px;border-radius:3px;font-size:16px;font-weight:600;border:1px solid var(--border);color:var(--text2);margin:3px}
.pill.a{border:1px dashed var(--accent);color:var(--accent);background:rgba(255,107,74,.08)}
.pill.g{border-color:var(--accent2);color:var(--accent2);background:rgba(95,216,166,.08)}
.pill.o{border-color:var(--accent3);color:var(--accent3);background:rgba(240,180,41,.08)}

.flow{display:flex;align-items:center;flex-wrap:wrap;gap:0;margin:8px 0}
.fb{background:var(--card2);border:1px solid var(--border2);border-radius:4px;padding:7px 13px;font-size:16px;color:var(--text3);font-weight:500}
.fb.hi{border-color:var(--accent);color:var(--accent)}
.fa{color:var(--accent);padding:0 8px;font-size:18px}
/* STEPS */

.sbody p{font-size:16px;color:var(--text2);line-height:1.4}

.hero-title{font-size:clamp(50px,6vw,78px);font-weight:900;line-height:1.0;letter-spacing:-2px}
.h1c{color:var(--text)}.h2c{color:var(--accent)}
.hero-sub{font-size:18px;color:var(--text2);max-width:520px;line-height:1.65;margin:14px 0 20px}
.dots{position:absolute;inset:0;background-image:linear-gradient(rgba(157,196,240,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(157,196,240,.05) 1px,transparent 1px);background-size:36px 36px;pointer-events:none}

.crop.bl{bottom:28px;left:28px;border-right:none;border-top:none}

.cmp{display:grid;grid-template-columns:1fr 1fr;gap:12px;flex:1}
.cmp-box{border-radius:var(--r);padding:14px 16px;border:1px solid var(--border)}
.cmp-box.old{background:rgba(242,120,154,.05);border-color:rgba(242,120,154,.2)}
.cmp-box.new{background:rgba(255,107,74,.05);border-color:rgba(255,107,74,.2)}
.cmp-box h4{font-size:16px;font-weight:700;text-transform:uppercase;letter-spacing:1px;margin-bottom:10px}
.cmp-box.old h4{color:var(--accent5)}
.cmp-box.new h4{color:var(--accent)}
.cmp-box p{font-size:16px;color:var(--text3);line-height:1.5}
/* MC */
.mc-item{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:13px 15px;flex:1}
.mc-q{font-size:16px;font-weight:600;color:var(--text);margin-bottom:9px;line-height:1.45}
.qn{color:var(--accent);margin-right:6px;font-weight:800}
.mc-opts{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.mc-opt{padding:8px 11px;border-radius:5px;border:1px solid var(--border);font-size:16px;color:var(--text3);cursor:pointer;transition:all .15s;background:var(--surface2);line-height:1.35}
.mc-opt:hover{border-color:var(--accent);color:var(--text)}
.mc-opt.sel{border-color:var(--accent);background:rgba(255,107,74,.1);color:var(--accent)}
/* GTO */
.gto-wrap{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:11px 13px;flex:1;display:flex;gap:13px;align-items:stretch}
.gto-left{display:flex;flex-direction:column;flex:1;min-width:0;gap:5px}
.gto-qlabel{font-size:16px;font-weight:700;color:var(--text)}
.gto-num{color:var(--accent4);font-weight:800;margin-right:6px}
.gto-pre{background:#050D1A;border:1px solid var(--border);border-radius:5px;padding:8px 10px;font-family:var(--mono);font-size:16px;color:var(--text3);white-space:pre;overflow-x:auto;flex:1;margin:0}
.gto-right{display:flex;flex-direction:column;min-width:160px;max-width:185px;gap:4px}
.gto-alabel{font-size:16px;color:var(--text2);font-weight:700;text-transform:uppercase;letter-spacing:1px;margin-bottom:2px}
.gto-ta{width:100%;flex:1;min-height:62px;padding:6px 9px;background:var(--surface2);border:1px solid var(--border);border-radius:5px;color:var(--text);font-size:16px;font-family:var(--mono);outline:none;resize:none;line-height:1.5;transition:border .2s}
.gto-ta:focus{border-color:var(--accent4)}
/* RECAP */
.rc-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:11px}
.rc{background:var(--card);border:1px solid var(--border);border-radius:var(--r2);padding:15px;text-align:center}
.rc .ico{font-size:26px;margin-bottom:7px}
.rc h4{font-size:16px;font-weight:700;color:var(--accent);margin-bottom:5px;text-transform:uppercase;letter-spacing:.5px}
.rc p{font-size:16px;color:var(--text2);line-height:1.4}
/* ANS */
.ans-block{border:1px solid var(--border);border-radius:var(--r2);overflow:hidden;flex:1}
.ans-row{display:flex;gap:10px;padding:8px 13px;border-bottom:1px solid var(--border);font-size:16px;align-items:flex-start}
.ans-row:last-child{border:none}
.ans-row:nth-child(even){background:rgba(255,255,255,.012)}
.anum{font-weight:800;color:var(--accent);min-width:28px;font-variant-numeric:tabular-nums;font-family:var(--mono);font-size:16px;flex-shrink:0;margin-top:1px}
.anum.p{color:var(--accent4)}
.abody{color:var(--text3);line-height:1.5;flex:1;min-width:0}
.abody strong{color:var(--accent2)}
/* QUOTE */
.q-card{background:linear-gradient(135deg,var(--card),var(--surface));border-left:3px solid var(--accent);border-radius:0 var(--r) var(--r) 0;padding:14px 18px;margin-bottom:11px}
.q-text{font-size:16px;color:var(--text3);line-height:1.7;font-style:italic}
.q-src{font-size:16px;color:var(--accent);margin-top:7px;font-style:normal;font-weight:700;letter-spacing:.5px}
/* MODAL */
#modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:200;align-items:center;justify-content:center}
#modal.open{display:flex}
.mbox{background:var(--surface);border:1px solid var(--border2);border-radius:14px;padding:26px 30px;min-width:320px}
.mbox h3{font-size:16px;font-weight:700;color:var(--accent);margin-bottom:14px}
.shr{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--border);font-size:16px;color:var(--text3)}
.shr:last-of-type{border:none}
.shr kbd{background:var(--surface2);border:1px solid var(--border2);border-radius:4px;padding:2px 7px;font-family:var(--mono);font-size:16px;color:var(--text)}
.mcl{margin-top:16px;width:100%;padding:9px;background:var(--accent);color:#08101E;border:none;border-radius:6px;cursor:pointer;font-size:16px;font-weight:700;font-family:var(--font)}
#hint{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);font-size:16px;color:var(--text2);letter-spacing:.5px;pointer-events:none;opacity:.5;font-family:var(--mono)}
ic{background:var(--surface2);padding:1px 6px;border-radius:4px;font-family:var(--mono);font-size:16px;color:var(--accent4);border:1px solid var(--border)}
small{font-size:16px}button,input,textarea,select{font-size:16px}
</style>

<script>
// ── TOKENIZER ──────────────────────────────────────────────────────────
function hl(code){
  const KW=/^(const|let|var|function|return|async|await|try|catch|throw|new|class|extends|if|else|for|while|import|export|default|from|of|in|true|false|null|undefined)\b/;
  const TY=/^(React|ReactDOM|useState|useEffect|console|document|JSON|Array|Object|Math|Promise|Error|module|require|exports)\b/;
  const NUM=/^\b\d+(\.\d+)?\b/;
  function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
  let i=0,out='';
  while(i<code.length){
    if(code[i]==='/'&&code[i+1]==='/'){
      const e=code.indexOf('\n',i);const ch=e===-1?code.slice(i):code.slice(i,e);
      out+='<span class="cm">'+esc(ch)+'</span>';i+=ch.length;continue;
    }
    if(code[i]==='`'){
      let j=i+1;while(j<code.length&&code[j]!=='`'){if(code[j]==='\\')j++;j++;}
      out+='<span class="s">'+esc(code.slice(i,j+1))+'</span>';i=j+1;continue;
    }
    if(code[i]==="'"){
      let j=i+1;while(j<code.length&&code[j]!=="'"&&code[j]!=='\n'){if(code[j]==='\\')j++;j++;}
      out+='<span class="s">'+esc(code.slice(i,j+1))+'</span>';i=j+1;continue;
    }
    if(code[i]==='"'){
      let j=i+1;while(j<code.length&&code[j]!=='"'&&code[j]!=='\n'){if(code[j]==='\\')j++;j++;}
      out+='<span class="s">'+esc(code.slice(i,j+1))+'</span>';i=j+1;continue;
    }
    const rest=code.slice(i);let m;
    if((m=rest.match(KW))){out+='<span class="k">'+m[0]+'</span>';i+=m[0].length;continue;}
    if((m=rest.match(TY))){out+='<span class="t">'+m[0]+'</span>';i+=m[0].length;continue;}
    if((m=rest.match(NUM))){out+='<span class="n">'+m[0]+'</span>';i+=m[0].length;continue;}
    out+=esc(code[i]);i++;
  }
  return out;
}
function cw(code,lang,label){
  const id='c'+Math.random().toString(36).slice(2);
  const body=(lang==='jsx'||lang==='js')?hl(code):code.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  return '<div class="cw"><div class="cl"><span>'+(label||lang)+'</span><button class="cpbtn" onclick="cp(\''+id+'\',this)">Copy</button></div><pre id="'+id+'">'+body+'</pre></div>';
}
function cp(id,btn){
  navigator.clipboard.writeText(document.getElementById(id).textContent).then(()=>{
    btn.textContent='Copied!';btn.classList.add('ok');
    setTimeout(()=>{btn.textContent='Copy';btn.classList.remove('ok');},2000);
  });
}

<div class="slide-title">Where We Are in Web Systems</div>
<hr class="rule"/>
<div class="content">
  <div class="card" style="margin-bottom:0"><h3>🗺 Web Systems Journey So Far</h3>
    <div class="flow" style="margin:0;flex-wrap:wrap;gap:6px">
      <div class="fb" style="font-size:16px">M1–M4<br/><small style="color:var(--text2)">Node.js core</small></div><div class="fa">→</div>

<div class="eyebrow">Part 1 — What is React</div>
<div class="slide-title">React in Plain English</div>
<hr class="rule"/>
<div class="content">
  <div class="split">
    <div>

// ── ENGINE ────────────────────────────────────────────────────────────
let cur=0;
const deck=document.getElementById('deck');
const bar=document.getElementById('bar');
const ctr=document.getElementById('ctr');

function build(){
  S.forEach((s,i)=>{
    const el=document.createElement('div');
    el.className='slide'+(s.cls?' '+s.cls:'');
    el.innerHTML=s.h||'';
    if(i===0)el.classList.add('active');
    deck.appendChild(el);
    if(s.init)s.init(el);
  });
}

function go(n){
  if(n<0||n>=S.length||n===cur)return;
  const els=deck.querySelectorAll('.slide');
  const fwd=n>cur;
  els[cur].classList.remove('active');
  els[cur].classList.add(fwd?'out-l':'out-r');
  setTimeout(()=>els[cur].classList.remove('out-l','out-r'),420);
  cur=n;els[cur].classList.add('active');els[cur].scrollTop=0;tick();
}
function tick(){
  bar.style.width=(S.length>1?(cur/(S.length-1)*100):100)+'%';
  ctr.textContent=(cur+1)+' / '+S.length;
}
document.addEventListener('keydown',e=>{
  const m=document.getElementById('modal');
  if(m.classList.contains('open')){if(e.key==='Escape')m.classList.remove('open');return;}
  const t=document.activeElement.tagName;
  if(t==='INPUT'||t==='TEXTAREA')return;
  if(e.key==='ArrowRight'||e.key==='ArrowDown')go(cur+1);
  else if(e.key==='ArrowLeft'||e.key==='ArrowUp')go(cur-1);
  else if(e.key==='Home')go(0);
  else if(e.key==='End')go(S.length-1);
  else if(e.key==='?')m.classList.add('open');
  else if(e.key==='Escape')m.classList.remove('open');
});
document.addEventListener('mousedown',e=>{
  if(e.target.closest('button,input,a,.mc-opt,.gto-ta'))return;
  if(e.button===2){e.preventDefault();e.stopImmediatePropagation();go(cur+1);}
  else if(e.button===3){e.preventDefault();e.stopImmediatePropagation();go(cur-1);}
  else if(e.button===4){e.preventDefault();e.stopImmediatePropagation();go(cur+1);}
},true);
document.addEventListener('contextmenu',e=>{
  if(e.target.closest('button,input,a'))return;
  e.preventDefault();e.stopImmediatePropagation();
},true);
document.addEventListener('auxclick',e=>{
  if(e.button===3||e.button===4){e.preventDefault();e.stopImmediatePropagation();}
},true);
let tx=0;
document.addEventListener('touchstart',e=>tx=e.touches[0].clientX,{passive:true});
document.addEventListener('touchend',e=>{const d=e.changedTouches[0].clientX-tx;if(Math.abs(d)>50){d<0?go(cur+1):go(cur-1);}},{passive:true});
build();tick();
</script>
