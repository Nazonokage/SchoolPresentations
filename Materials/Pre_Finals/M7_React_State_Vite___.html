<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>M7 — React State & Vite</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#07111F;
  --surface:#0C1A2E;
  --surface2:#132236;
  --border:#1A3050;
  --border2:#224070;
  --accent:#61DAFB;
  --accent2:#4ADE80;
  --accent3:#FB923C;
  --accent4:#C084FC;
  --accent5:#F472B6;
  --text:#F0F6FC;
  --text2:#7A9EBF;
  --text3:#C4D9EF;
  --card:#0B1828;
  --card2:#0F1F35;
  --mono:'Cascadia Code','Fira Code','Consolas',monospace;
  --sans:'Segoe UI',system-ui,sans-serif;
  --r:10px;--r2:14px;
  --tr:350ms cubic-bezier(.4,0,.2,1);
}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:var(--sans)}
#bar{position:fixed;top:0;left:0;height:3px;background:linear-gradient(90deg,var(--accent),var(--accent4));transition:width .3s;z-index:100;border-radius:0 2px 2px 0}
#ctr{position:fixed;top:10px;right:16px;font-size:16px;color:var(--text2);z-index:100;font-variant-numeric:tabular-nums;letter-spacing:.5px;font-family:var(--mono)}
#deck{width:100%;height:100vh;position:relative;overflow:hidden}
.slide{position:absolute;inset:0;display:flex;flex-direction:column;padding:48px 62px 32px;opacity:0;pointer-events:none;transform:translateX(48px);transition:opacity var(--tr),transform var(--tr);overflow-y:auto}
.slide.active{opacity:1;pointer-events:all;transform:translateX(0)}
.slide.out-l{opacity:0;transform:translateX(-48px)}
.slide.out-r{opacity:0;transform:translateX(48px)}
@media(prefers-reduced-motion:reduce){.slide{transition:opacity .15s;transform:none!important}}
.eyebrow{font-size:16px;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:var(--accent);margin-bottom:9px;display:flex;align-items:center;gap:10px}
.eyebrow::before{content:'';width:22px;height:2px;background:var(--accent);border-radius:1px;display:inline-block}
.slide-title{font-size:clamp(27px,3.2vw,44px);font-weight:800;line-height:1.1;color:var(--text);margin-bottom:5px;letter-spacing:-.5px}
.rule{height:1px;background:linear-gradient(90deg,var(--border2),transparent);border:none;margin-bottom:20px}
.content{flex:1;display:flex;flex-direction:column;gap:13px;min-height:0}
.g2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:13px}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:11px}
.g2>*,.g3>*{min-width:0}
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;flex:1;min-height:0}
.split>*{min-width:0;display:flex;flex-direction:column;gap:10px}
.col{display:flex;flex-direction:column;gap:10px;min-width:0}
.flex1{flex:1}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--r2);padding:15px 17px}
.card h3{font-size:16px;font-weight:700;text-transform:uppercase;letter-spacing:1.5px;color:var(--accent);margin-bottom:9px}
.card p,.card li{font-size:16px;color:var(--text3);line-height:1.65}
.card ul{padding-left:16px}.card li{margin-bottom:4px}
/* CODE */
.cw{position:relative;background:#040C18;border:1px solid var(--border);border-radius:var(--r);overflow:hidden;flex:1;display:flex;flex-direction:column}
.cl{display:flex;align-items:center;justify-content:space-between;padding:6px 12px;background:#080F1C;border-bottom:1px solid var(--border);font-size:16px;color:var(--text2);font-family:var(--mono);flex-shrink:0}
.cl span{color:var(--accent3)}
.cw pre{padding:11px 13px;overflow:auto;font-family:var(--mono);font-size:16px;line-height:1.74;white-space:pre;flex:1;max-height:350px}
.cpbtn{padding:3px 10px;font-size:16px;font-family:var(--sans);background:var(--surface2);border:1px solid var(--border2);color:var(--text2);border-radius:4px;cursor:pointer;transition:all .2s;white-space:nowrap}
.cpbtn:hover{background:var(--accent);color:#07111F;border-color:var(--accent)}
.cpbtn.ok{background:var(--accent2);color:#07111F;border-color:var(--accent2)}
/* syntax */
.k{color:#F472B6}.s{color:#86EFAC}.f{color:#C4B5FD}.n{color:#7DD3FC}
.cm{color:#2E4A65;font-style:italic}.t{color:#FCA5A5}.b{color:#FCD34D}
/* BREAKDOWN */
.bd{display:flex;flex-direction:column;gap:7px}
.bdi{display:flex;gap:10px;align-items:flex-start;padding:9px 11px;background:var(--surface);border:1px solid var(--border);border-radius:6px;border-left:3px solid var(--accent)}
.bdi.g{border-left-color:var(--accent2)}.bdi.o{border-left-color:var(--accent3)}
.bdi.p{border-left-color:var(--accent4)}.bdi.r{border-left-color:var(--accent5)}
.bdl{font-family:var(--mono);font-size:16px;color:var(--accent);background:#040C18;padding:2px 7px;border-radius:3px;white-space:nowrap;min-width:fit-content;align-self:flex-start;margin-top:1px;flex-shrink:0}
.bdt{font-size:16px;color:var(--text3);line-height:1.55}.bdt strong{color:var(--text);font-weight:600}
/* FLOW */
.flow{display:flex;align-items:center;flex-wrap:wrap;gap:0}
.fb{background:var(--card2);border:1px solid var(--border2);border-radius:6px;padding:7px 13px;font-size:16px;color:var(--text3);font-weight:500}
.fb.hi{border-color:var(--accent);color:var(--accent)}
.fa{color:var(--accent);padding:0 7px;font-size:17px}
/* STEP */
.step{display:flex;gap:12px;align-items:flex-start;padding:11px 14px;background:var(--card);border:1px solid var(--border);border-radius:var(--r)}
.snum{width:28px;height:28px;border-radius:50%;background:var(--accent);color:#07111F;font-weight:900;font-size:16px;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px}
.sbody h4{font-size:16px;font-weight:700;color:var(--text);margin-bottom:3px}
.sbody p{font-size:16px;color:var(--text2);line-height:1.5}
/* TABLE */
table{width:100%;border-collapse:collapse;font-size:16px}
th{background:var(--surface2);color:var(--accent);padding:8px 12px;text-align:left;font-weight:700;font-size:16px;letter-spacing:1px;text-transform:uppercase;border-bottom:1px solid var(--border)}
td{padding:8px 12px;border-bottom:1px solid var(--border);color:var(--text3);line-height:1.5;vertical-align:top}
tr:last-child td{border-bottom:none}
tr:hover td{background:rgba(255,255,255,.013)}
/* PILLS */
.pill{display:inline-block;padding:4px 12px;border-radius:20px;font-size:16px;font-weight:600;border:1px solid var(--border);color:var(--text2);margin:3px}
.pill.a{border-color:var(--accent);color:var(--accent);background:rgba(97,218,251,.08)}
.pill.g{border-color:var(--accent2);color:var(--accent2);background:rgba(74,222,128,.08)}
.pill.o{border-color:var(--accent3);color:var(--accent3);background:rgba(251,146,60,.08)}
/* HERO */
.hero-bg{background:radial-gradient(ellipse at 12% 60%,rgba(97,218,251,.1) 0%,transparent 52%),radial-gradient(ellipse at 85% 18%,rgba(192,132,252,.07) 0%,transparent 48%),var(--bg)}
.hero-title{font-size:clamp(48px,5.8vw,76px);font-weight:900;line-height:1.02;letter-spacing:-1.5px}
.h1c{color:var(--text)}.h2c{color:var(--accent)}
.hero-sub{font-size:18px;color:var(--text2);max-width:530px;line-height:1.65;margin:14px 0 20px}
.dots{position:absolute;inset:0;background-image:radial-gradient(rgba(97,218,251,.045) 1px,transparent 1px);background-size:30px 30px;pointer-events:none}
/* BEFORE/AFTER */
.ba{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;flex:1}
.ba-box{border-radius:var(--r);padding:14px 16px;border:1px solid var(--border)}
.ba-box.bad{background:rgba(244,114,182,.05);border-color:rgba(244,114,182,.2)}
.ba-box.good{background:rgba(97,218,251,.05);border-color:rgba(97,218,251,.2)}
.ba-box h4{font-size:16px;font-weight:700;text-transform:uppercase;letter-spacing:1px;margin-bottom:10px}
.ba-box.bad h4{color:var(--accent5)}.ba-box.good h4{color:var(--accent)}
.ba-box p,.ba-box li{font-size:16px;color:var(--text3);line-height:1.65}
.ba-box ul{padding-left:16px}
/* QUOTE */
.q-card{background:linear-gradient(135deg,var(--card),var(--surface));border-left:3px solid var(--accent);border-radius:0 var(--r) var(--r) 0;padding:14px 18px;margin-bottom:11px}
.q-text{font-size:16px;color:var(--text3);line-height:1.7;font-style:italic}
.q-src{font-size:16px;color:var(--accent);margin-top:7px;font-style:normal;font-weight:700;letter-spacing:.5px}
/* RECAP */
.rc-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:11px}
.rc{background:var(--card);border:1px solid var(--border);border-radius:var(--r2);padding:15px;text-align:center}
.rc .ico{font-size:26px;margin-bottom:7px}
.rc h4{font-size:16px;font-weight:700;color:var(--accent);margin-bottom:5px;text-transform:uppercase;letter-spacing:.5px}
.rc p{font-size:16px;color:var(--text2);line-height:1.55}
/* MC */
.mc-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;flex:1;min-height:0}
.mc-item{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:13px 15px;display:flex;flex-direction:column;min-height:0}
.mc-q{font-size:16px;font-weight:600;color:var(--text);margin-bottom:9px;line-height:1.45}
.qn{color:var(--accent);margin-right:6px;font-weight:800}
.mc-opts{display:grid;grid-template-columns:minmax(0,1fr);gap:5px;flex:1}
.mc-opt{padding:7px 10px;border-radius:5px;border:1px solid var(--border);font-size:16px;color:var(--text3);cursor:pointer;transition:all .15s;background:var(--surface2);line-height:1.35}
.mc-opt:hover{border-color:var(--accent);color:var(--text)}
.mc-opt.sel{border-color:var(--accent);background:rgba(97,218,251,.1);color:var(--accent)}
.hard-card{background:var(--card);border:1px solid var(--border2);border-radius:var(--r2);padding:18px 20px;flex:1;display:flex;flex-direction:column;gap:12px;min-height:0}
.hard-card h3{font-size:16px;font-weight:700;color:var(--accent);margin-bottom:2px}
.hard-card .hint{font-size:16px;color:var(--text2);background:rgba(97,218,251,.08);border:1px solid rgba(97,218,251,.2);border-radius:6px;padding:8px 12px;line-height:1.5}
.hard-card .hint strong{color:var(--accent)}
.hard-card textarea{width:100%;flex:1;min-height:90px;padding:12px 14px;background:var(--surface2);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:16px;font-family:var(--mono);outline:none;resize:vertical;line-height:1.55}
.hard-card textarea:focus{border-color:var(--accent)}
/* GTO */
.gto-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;flex:1;min-height:0}
.gto-wrap{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:11px 13px;display:flex;flex-direction:column;gap:8px;min-height:0}
.gto-qlabel{font-size:16px;font-weight:700;color:var(--text)}
.gto-num{color:var(--accent4);font-weight:800;margin-right:6px}
.gto-pre{background:#040C18;border:1px solid var(--border);border-radius:5px;padding:8px 10px;font-family:var(--mono);font-size:16px;color:var(--text3);white-space:pre;overflow-x:auto;flex:1;margin:0;min-height:50px}
.gto-alabel{font-size:16px;color:var(--text2);font-weight:700;text-transform:uppercase;letter-spacing:1px}
.gto-ta{width:100%;min-height:48px;padding:6px 9px;background:var(--surface2);border:1px solid var(--border);border-radius:5px;color:var(--text);font-size:16px;font-family:var(--mono);outline:none;resize:none;line-height:1.5;transition:border .2s}
.gto-ta:focus{border-color:var(--accent4)}
/* ANS */
.ans-block{border:1px solid var(--border);border-radius:var(--r2);overflow:hidden;flex:1}
.ans-row{display:flex;gap:10px;padding:8px 13px;border-bottom:1px solid var(--border);font-size:16px;align-items:flex-start}
.ans-row:last-child{border:none}
.ans-row:nth-child(even){background:rgba(255,255,255,.012)}
.anum{font-weight:800;min-width:24px;font-variant-numeric:tabular-nums;font-family:var(--mono);font-size:16px;flex-shrink:0;margin-top:1px}
.anum.b{color:var(--accent)}.anum.p{color:var(--accent4)}
.abody{color:var(--text3);line-height:1.5;flex:1;min-width:0}
.abody strong{color:var(--accent2)}
/* MODAL */
#modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:200;align-items:center;justify-content:center}
#modal.open{display:flex}
.mbox{background:var(--surface);border:1px solid var(--border2);border-radius:14px;padding:26px 30px;min-width:320px}
.mbox h3{font-size:16px;font-weight:700;color:var(--accent);margin-bottom:14px}
.shr{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--border);font-size:16px;color:var(--text3)}
.shr:last-of-type{border:none}
.shr kbd{background:var(--surface2);border:1px solid var(--border2);border-radius:4px;padding:2px 7px;font-family:var(--mono);font-size:16px;color:var(--text)}
.mcl{margin-top:16px;width:100%;padding:9px;background:var(--accent);color:#07111F;border:none;border-radius:6px;cursor:pointer;font-size:16px;font-weight:700;font-family:var(--sans)}
#hint{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);font-size:16px;color:var(--text2);letter-spacing:.5px;pointer-events:none;opacity:.4;font-family:var(--mono)}
ic{background:var(--surface2);padding:1px 6px;border-radius:4px;font-family:var(--mono);font-size:16px;color:var(--accent4);border:1px solid var(--border)}
small{font-size:16px}button,input,textarea,select{font-size:16px}
</style>
</head>
<body>
<div id="bar"></div>
<div id="ctr"></div>
<div id="deck"></div>
<div id="hint">right-click or → to advance &nbsp;·&nbsp; ? for shortcuts</div>
<div id="modal">
  <div class="mbox">
    <h3>⌨ Keyboard Shortcuts</h3>
    <div class="shr"><span>Next</span><span><kbd>→</kbd> or <kbd>Right-click</kbd></span></div>
    <div class="shr"><span>Prev</span><span><kbd>←</kbd></span></div>
    <div class="shr"><span>First / Last</span><span><kbd>Home</kbd> / <kbd>End</kbd></span></div>
    <div class="shr"><span>Shortcuts</span><span><kbd>?</kbd></span></div>
    <div class="shr"><span>Close</span><span><kbd>Esc</kbd></span></div>
    <button class="mcl" onclick="document.getElementById('modal').classList.remove('open')">Close</button>
  </div>
</div>
<script>
// ── TOKENIZER ──────────────────────────────────────────────────────────
function hl(raw){
  const KW=/^(const|let|var|function|return|async|await|try|catch|throw|new|class|extends|if|else|for|while|import|export|default|from|of|in|true|false|null|undefined|void)\b/;
  const TY=/^(React|ReactDOM|useState|useEffect|console|document|JSON|Array|Object|Math|Promise|Error)\b/;
  const NUM=/^\b\d+(\.\d+)?\b/;
  function e(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
  let i=0,o='';
  while(i<raw.length){
    if(raw[i]==='/'&&raw[i+1]==='/'){const end=raw.indexOf('\n',i);const ch=end<0?raw.slice(i):raw.slice(i,end);o+='<span class="cm">'+e(ch)+'</span>';i+=ch.length;continue;}
    if(raw[i]==='`'){let j=i+1;while(j<raw.length&&raw[j]!=='`'){if(raw[j]==='\\')j++;j++;}o+='<span class="s">'+e(raw.slice(i,j+1))+'</span>';i=j+1;continue;}
    if(raw[i]==="'"){let j=i+1;while(j<raw.length&&raw[j]!=="'"&&raw[j]!=='\n'){if(raw[j]==='\\')j++;j++;}o+='<span class="s">'+e(raw.slice(i,j+1))+'</span>';i=j+1;continue;}
    if(raw[i]==='"'){let j=i+1;while(j<raw.length&&raw[j]!=='"'&&raw[j]!=='\n'){if(raw[j]==='\\')j++;j++;}o+='<span class="s">'+e(raw.slice(i,j+1))+'</span>';i=j+1;continue;}
    const rest=raw.slice(i);let m;
    if((m=rest.match(KW))){o+='<span class="k">'+m[0]+'</span>';i+=m[0].length;continue;}
    if((m=rest.match(TY))){o+='<span class="t">'+m[0]+'</span>';i+=m[0].length;continue;}
    if((m=rest.match(NUM))){o+='<span class="n">'+m[0]+'</span>';i+=m[0].length;continue;}
    o+=e(raw[i]);i++;
  }
  return o;
}
function cw(code,lang,label){
  const id='c'+Math.random().toString(36).slice(2);
  const body=(lang==='jsx'||lang==='js')?hl(code):code.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  return '<div class="cw"><div class="cl"><span>'+(label||lang)+'</span><button class="cpbtn" onclick="doCopy(\''+id+'\',this)">Copy</button></div><pre id="'+id+'">'+body+'</pre></div>';
}
function doCopy(id,btn){
  navigator.clipboard.writeText(document.getElementById(id).textContent).then(()=>{
    btn.textContent='Copied!';btn.classList.add('ok');
    setTimeout(()=>{btn.textContent='Copy';btn.classList.remove('ok');},2000);
  });
}

// ── SLIDE DEFINITIONS ─────────────────────────────────────────────────
const S=[];

// 0 ── TITLE
S.push({cls:'hero-bg',h:`
<div class="dots"></div>
<div style="flex:1;display:flex;flex-direction:column;justify-content:center;position:relative">
  <div class="eyebrow" style="margin-bottom:14px">Web Systems · Module 7</div>
  <div class="hero-title"><div class="h1c">React State</div><div class="h2c">&amp; Vite</div></div>
  <div class="hero-sub">From CDN React to a real project — useState, controlled inputs, and conditional rendering done properly.</div>
  <div>
    <span class="pill a">useState</span>
    <span class="pill a">Controlled Inputs</span>
    <span class="pill a">Conditional Rendering</span>
    <span class="pill a">Vite Setup</span>
    <span class="pill g">Activity: Searchable Student List</span>
  </div>
</div>`});

// 1 ── BRIDGE FROM M6
S.push({h:`
<div class="eyebrow">Where We Left Off</div>
<div class="slide-title">M6 → M7: From Static to Interactive</div>
<hr class="rule"/>
<div class="content">
  <div class="ba">
    <div class="ba-box bad">
      <h4>❌ M6 — What we built</h4>
      <ul>
        <li>React via CDN — one HTML file, no build tools</li>
        <li>Data was hardcoded in the JS array</li>
        <li>Components rendered once and never changed</li>
        <li>No user interaction — you could read but not filter, search, or update anything</li>
      </ul>
      <p style="margin-top:10px;font-size:16px;color:rgba(244,114,182,.7)">Static. Data flows in one direction only.</p>
    </div>
    <div class="ba-box good">
      <h4>✅ M7 — What we're adding</h4>
      <ul>
        <li>Real Vite project — proper file structure, hot reload</li>
        <li>State — data that lives inside a component and <em>can change</em></li>
        <li>Controlled inputs — a text box that React owns and updates</li>
        <li>Conditional rendering — show/hide UI based on state</li>
      </ul>
      <p style="margin-top:10px;font-size:16px;color:rgba(74,222,128,.7)">Interactive. State drives the UI.</p>
    </div>
  </div>
  <div class="card"><h3>The Core Idea This Module</h3>
    <p style="font-size:16px;line-height:1.7">In M6, components were like <strong style="color:var(--text)">printed posters</strong> — they showed data but couldn't react to you. In M7, components become <strong style="color:var(--accent)">live dashboards</strong> — they hold their own data and update automatically when something changes. That data is called <strong style="color:var(--accent)">state</strong>.</p>
  </div>
</div>`});

// 2 ── WHAT IS STATE
S.push({h:`
<div class="eyebrow">Part 1 — useState</div>
<div class="slide-title">What Is State?</div>
<hr class="rule"/>
<div class="content">
  <div class="split">
    <div>
      <div class="card flex1"><h3>State vs Props — The Difference</h3>
        <table>
          <tr><th></th><th>Props</th><th>State</th></tr>
          <tr><td><strong style="color:var(--text)">Comes from</strong></td><td>Parent component</td><td>The component itself</td></tr>
          <tr><td><strong style="color:var(--text)">Can change?</strong></td><td>No — read only</td><td>Yes — via setState</td></tr>
          <tr><td><strong style="color:var(--text)">Who owns it</strong></td><td>Parent</td><td>This component</td></tr>
          <tr><td><strong style="color:var(--text)">Causes re-render?</strong></td><td>When parent re-renders</td><td>Yes, every update</td></tr>
          <tr><td><strong style="color:var(--text)">Analogy</strong></td><td>Order handed to you</td><td>Your notepad</td></tr>
        </table>
      </div>
      <div class="card"><h3>The useState Hook</h3>
        ${cw(`import { useState } from 'react';

function Counter() {
  // [currentValue, setterFunction]
  const [count, setCount] = useState(0);
  //                                 ^ initial value

  return (
    <div>
      <p>Count: {count}</p>
      <button onClick={() => setCount(count + 1)}>
        +1
      </button>
    </div>
  );
}`,'jsx','Counter.jsx')}
      </div>
    </div>
    <div>
      <div class="card" style="margin-bottom:0"><h3>Code Breakdown</h3></div>
      <div class="bd">
        <div class="bdi"><div class="bdl">import</div><div class="bdt"><strong>useState</strong> is a named export from <ic>'react'</ic>. In Vite projects, you import it explicitly — it's not a global like with CDN React.</div></div>
        <div class="bdi g"><div class="bdl">line 4</div><div class="bdt"><strong>Array destructuring</strong> — <ic>useState(0)</ic> returns a pair: the current value and the setter function. You name them anything, but convention is <ic>[thing, setThing]</ic>.</div></div>
        <div class="bdi o"><div class="bdl">setCount</div><div class="bdt">When you call <ic>setCount(newValue)</ic>, React <strong>schedules a re-render</strong> with the new value. You never modify <ic>count</ic> directly — that would change the variable but React wouldn't know to update the UI.</div></div>
        <div class="bdi p"><div class="bdl">re-render</div><div class="bdt">Every time <ic>setCount</ic> is called, the <strong>entire component function runs again</strong> with the new state value. React reconciles the new output with the old DOM and updates only what changed.</div></div>

    </div>

  const [items, setItems] = useState([]);
  const [input, setInput] = useState('');

  const addItem = () => {
    if (!input.trim()) return;
    // ✅ Spread into a NEW array
    setItems([...items, input]);
    setInput('');
  };

  return (
    <div>
      <input
        value={input}
        onChange={e => setInput(e.target.value)}
      />
      <button onClick={addItem}>Add</button>

  return (

        type="text"
        value={query}

S.push({h:`
<div class="eyebrow">Part 3 — Conditional Rendering</div>
<div class="slide-title">Showing &amp; Hiding UI with State</div>

      />

          }

      <div class="bd">
        <div class="bdi"><div class="bdl">derived value</div><div class="bdt"><strong>filtered</strong> is not state — it's computed <em>from</em> state inside the render. Every re-render recomputes it fresh. This is the recommended pattern: keep state minimal, derive everything else.</div></div>
        <div class="bdi g"><div class="bdl">&&</div><div class="bdt">Short-circuit rendering: <ic>{condition && &lt;JSX /&gt;}</ic> — if condition is false, nothing renders. Cleaner than a ternary when you only need a "show" case, not a "show/hide" pair.</div></div>
        <div class="bdi o"><div class="bdl">ternary</div><div class="bdt"><ic>{a ? &lt;X /&gt; : &lt;Y /&gt;}</ic> — use when you need <em>either</em> one component <em>or</em> another. Avoid nesting ternaries — extract to a variable instead.</div></div>

      <div class="card flex1"><h3>🧠 State = Short-Term Memory</h3>
        <p>Props are like information written on a whiteboard by someone else — you can read it, not erase it. State is your own notepad — you can write, cross out, and rewrite whenever you want. When you write something new (<ic>setState</ic>), React takes a photo of your notepad and updates everything that references it.</p>
      </div>
      <div class="card flex1"><h3>🎮 Controlled Input = Joystick, Not Autopilot</h3>
        <p>An uncontrolled input is on autopilot — the browser flies it, you only find out what it typed when the plane lands (form submit). A controlled input is a joystick — you feel every movement, React knows the exact position at all times, and you can override it instantly (clear button, format on the fly).</p>
      </div>
      <div class="card flex1"><h3>🔄 Re-render = Recalculate, Not Rebuild</h3>
        <p>When state changes, React doesn't tear down and rebuild the entire page like a browser refresh does. It's more like Excel recalculating a formula — only the cells that depend on the changed value update. Everything else stays exactly as it was.</p>

    <div class="col">

        <p>In the student list, <ic>filtered</ic> is not stored in state — it's computed from <ic>students</ic>, <ic>query</ic>, and <ic>onlyActive</ic> on every render. Just like a spreadsheet formula recalculates when any referenced cell changes. Keep state minimal; derive everything else. This avoids "stale state" bugs where two variables drift out of sync.</p>
      </div>
      <div class="card flex1"><h3>📺 useState = TV Remote, Not the TV</h3>
        <p><ic>useState</ic> doesn't hold your data inside the DOM (the TV screen). It holds it in React's memory and tells the TV what to display. When you change the channel (<ic>setState</ic>), the TV updates — but the remote still works the same way. The display is always a reflection of what the remote's memory says, nothing more.</p>

// ── ENGINE ────────────────────────────────────────────────────────────
let cur=0;
const deck=document.getElementById('deck');
const bar=document.getElementById('bar');
const ctr=document.getElementById('ctr');

function build(){
  S.forEach((s,i)=>{
    const el=document.createElement('div');
    el.className='slide'+(s.cls?' '+s.cls:'');
    el.innerHTML=s.h||'';
    if(i===0)el.classList.add('active');
    deck.appendChild(el);
    if(s.init)s.init(el);
  });
}
function go(n){
  if(n<0||n>=S.length||n===cur)return;
  const els=deck.querySelectorAll('.slide');
  const fwd=n>cur;
  els[cur].classList.remove('active');
  els[cur].classList.add(fwd?'out-l':'out-r');
  setTimeout(()=>els[cur].classList.remove('out-l','out-r'),420);
  cur=n;els[cur].classList.add('active');els[cur].scrollTop=0;tick();
}
function tick(){
  bar.style.width=(S.length>1?(cur/(S.length-1)*100):100)+'%';
  ctr.textContent=(cur+1)+' / '+S.length;
}
document.addEventListener('keydown',e=>{
  const m=document.getElementById('modal');
  if(m.classList.contains('open')){if(e.key==='Escape')m.classList.remove('open');return;}
  const t=document.activeElement.tagName;
  if(t==='INPUT'||t==='TEXTAREA')return;
  if(e.key==='ArrowRight'||e.key==='ArrowDown')go(cur+1);
  else if(e.key==='ArrowLeft'||e.key==='ArrowUp')go(cur-1);
  else if(e.key==='Home')go(0);
  else if(e.key==='End')go(S.length-1);
  else if(e.key==='?')m.classList.add('open');
  else if(e.key==='Escape')m.classList.remove('open');
});
document.addEventListener('mousedown',e=>{
  if(e.target.closest('button,input,a,.mc-opt,.gto-ta'))return;
  if(e.button===2){e.preventDefault();e.stopImmediatePropagation();go(cur+1);}
  else if(e.button===3){e.preventDefault();e.stopImmediatePropagation();go(cur-1);}
  else if(e.button===4){e.preventDefault();e.stopImmediatePropagation();go(cur+1);}
},true);
document.addEventListener('contextmenu',e=>{
  if(e.target.closest('button,input,a'))return;
  e.preventDefault();e.stopImmediatePropagation();
},true);
document.addEventListener('auxclick',e=>{
  if(e.button===3||e.button===4){e.preventDefault();e.stopImmediatePropagation();}
},true);
let tx=0;
document.addEventListener('touchstart',e=>tx=e.touches[0].clientX,{passive:true});
document.addEventListener('touchend',e=>{const d=e.changedTouches[0].clientX-tx;if(Math.abs(d)>50){d<0?go(cur+1):go(cur-1);}},{passive:true});
build();tick();
</script>
