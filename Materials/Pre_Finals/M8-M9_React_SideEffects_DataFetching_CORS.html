<script>
function hl(raw){
  const KW=/^(const|let|var|function|return|async|await|try|catch|throw|new|class|extends|if|else|for|while|import|export|default|from|of|in|true|false|null|undefined|void|require)\b/;
  const TY=/^(React|ReactDOM|useState|useEffect|console|document|JSON|Array|Object|Math|Promise|Error|AbortController|axios|express|cors)\b/;
  const NUM=/^\b\d+(\.\d+)?\b/;
  function e(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
  let i=0,o='';
  while(i<raw.length){
    if(raw[i]==='/'&&raw[i+1]==='/'){const end=raw.indexOf('\n',i);const ch=end<0?raw.slice(i):raw.slice(i,end);o+='<span class="cm">'+e(ch)+'</span>';i+=ch.length;continue;}
    if(raw[i]==='`'){let j=i+1;while(j<raw.length&&raw[j]!=='`'){if(raw[j]==='\\')j++;j++;}o+='<span class="s">'+e(raw.slice(i,j+1))+'</span>';i=j+1;continue;}
    if(raw[i]==="'"){let j=i+1;while(j<raw.length&&raw[j]!=="'"&&raw[j]!=='\n'){if(raw[j]==='\\')j++;j++;}o+='<span class="s">'+e(raw.slice(i,j+1))+'</span>';i=j+1;continue;}
    if(raw[i]==='"'){let j=i+1;while(j<raw.length&&raw[j]!=='"'&&raw[j]!=='\n'){if(raw[j]==='\\')j++;j++;}o+='<span class="s">'+e(raw.slice(i,j+1))+'</span>';i=j+1;continue;}
    const rest=raw.slice(i);let m;
    if((m=rest.match(KW))){o+='<span class="k">'+m[0]+'</span>';i+=m[0].length;continue;}
    if((m=rest.match(TY))){o+='<span class="t">'+m[0]+'</span>';i+=m[0].length;continue;}
    if((m=rest.match(NUM))){o+='<span class="n">'+m[0]+'</span>';i+=m[0].length;continue;}
    o+=e(raw[i]);i++;
  }
  return o;
}
function cw(code,lang,label){
  const id='c'+Math.random().toString(36).slice(2);
  const body=(lang==='jsx'||lang==='js')?hl(code):code.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  return '<div class="cw"><div class="cl"><span>'+(label||lang)+'</span><button class="cpbtn" onclick="doCopy(\''+id+'\',this)">Copy</button></div><pre id="'+id+'">'+body+'</pre></div>';
}
function doCopy(id,btn){
  navigator.clipboard.writeText(document.getElementById(id).textContent).then(()=>{
    btn.textContent='Copied!';btn.classList.add('ok');
    setTimeout(()=>{btn.textContent='Copy';btn.classList.remove('ok');},2000);
  });
}

<div class="part-badge p1">Part 1 · Side Effects</div>
<div class="slide-title">What Exactly Is a Side Effect?</div>
<hr class="rule"/>
<div class="content">
  <div class="g2" style="flex:1">
    <div class="col">
      <div class="card flex1"><h3>Definition</h3>
        <p>A <strong>side effect</strong> is any work that reaches outside the pure calculation of JSX. Given the same props and state, a pure component must always return the same JSX. Side effects break that rule on purpose — they talk to systems React does not control.</p>
      </div>
      <div class="card flex1"><h3>Common Side Effects</h3>
        <ul>
          <li>HTTP requests (<ic>fetch</ic> / Axios)</li>
          <li>Timers (<ic>setTimeout</ic>, <ic>setInterval</ic>)</li>
          <li>Subscriptions (WebSocket, event listeners)</li>
          <li>Direct DOM mutation (focus, scroll, measure)</li>
          <li>Writing to localStorage / cookies</li>
        </ul>
      </div>
    </div>
    <div class="col">
      <div class="card flex1"><h3>💡 Motion-Sensor Lights Analogy</h3>
        <p>Think of a room with motion-sensor lights:</p>
        <ul>
          <li><strong>Render</strong> = building the physical room (walls, furniture, doors).</li>
          <li><strong>useEffect</strong> = the lights turning on <em>after</em> you step inside (mount).</li>
          <li><strong>Cleanup</strong> = the lights turning off the moment you leave (unmount).</li>
        </ul>
        <p style="margin-top:8px">You never turn the lights on while the walls are still being built. React paints first, then runs effects.</p>
      </div>
      <div class="card"><h3>Why Isolation Matters</h3>
        <p>If you put a fetch call directly in the component body, it runs on <em>every</em> render — including the re-renders caused by the data arriving. That creates infinite loops and race conditions. useEffect defers the work until after paint and lets you control re-execution.</p>
      </div>
    </div>
  </div>
</div>`});

// 3 USEEFFECT SYNTAX
S.push({h:`
<div class="part-badge p1">Part 1 · The Hook</div>
<div class="slide-title">useEffect — Syntax, What / How / Why</div>
<hr class="rule"/>
<div class="content">
  <div class="split">
    <div>
      ${cw(`import { useEffect } from 'react';

useEffect(() => {
  // 1. Do the side-effect work here
  console.log('Effect ran');

  // 2. Optional cleanup
  return () => {
    console.log('Cleanup ran');
  };
}, [/* dependency array */]);`,'jsx','Basic shape')}
    </div>
    <div class="col">
      <div class="bdi"><span class="bdl">WHAT</span><div class="bdt">A React hook that schedules a function to run <strong>after</strong> the browser has painted the current UI.</div></div>
      <div class="bdi g"><span class="bdl">HOW</span><div class="bdt">Pass a callback. Optionally return a cleanup function. Optionally pass a dependency array that tells React when to re-run the effect.</div></div>
      <div class="bdi o"><span class="bdl">WHY</span><div class="bdt">Keeps the render pure. Lets React know which values the effect depends on so it can skip unnecessary work and avoid stale closures.</div></div>
      <div class="card"><h3>Timing Guarantee</h3>
        <p>Effects run <em>after</em> the commit phase (DOM is already updated). That is why you can safely read layout measurements or start network requests without blocking the paint.</p>

    </div>
  </div>
</div>`});

// 4 DEPENDENCY ARRAY
S.push({h:`
<div class="part-badge p1">Part 1 · Control When It Runs</div>
<div class="slide-title">The Dependency Array — Three Modes</div>
<hr class="rule"/>
<div class="content">
  <table>
    <tr><th>Form</th><th>When the effect runs</th><th>Typical use</th></tr>
    <tr><td><ic>useEffect(fn)</ic><br/><span style="color:var(--text2);font-size:13px">no array</span></td><td>After <strong>every</strong> render</td><td>Rare — almost never what you want</td></tr>
    <tr><td><ic>useEffect(fn, [])</ic><br/><span style="color:var(--text2);font-size:13px">empty array</span></td><td>Only once after <strong>mount</strong></td><td>Initial data fetch, one-time setup</td></tr>
    <tr><td><ic>useEffect(fn, [id])</ic><br/><span style="color:var(--text2);font-size:13px">with values</span></td><td>On mount + whenever <ic>id</ic> changes</td><td>Re-fetch when a prop/state changes</td></tr>
  </table>
  <div class="g2" style="margin-top:6px">
    <div class="card"><h3>Empty Array = “Run once”</h3>
      <p>React treats the empty array as “this effect has no reactive dependencies.” It therefore schedules the effect only after the first paint and never again (unless the component unmounts and remounts).</p>
    </div>
    <div class="card"><h3>With Dependencies = “Re-run when these change”</h3>
      <p>React does a shallow comparison of every value in the array. If any value is different from the previous render (Object.is), the cleanup of the previous effect runs, then the new effect runs.</p>
    </div>
  </div>
</div>`});

<div class="part-badge p1">Part 1 · Leaving Cleanly</div>

// 7 ABORTCONTROLLER
S.push({h:`
<div class="part-badge p1">Part 1 · Safe Async Work</div>
<div class="slide-title">AbortController — Cancelling In-Flight Requests</div>
<hr class="rule"/>
<div class="content">
  <div class="split">
    <div>
      ${cw(`useEffect(() => {
  const controller = new AbortController();

  async function load() {
    try {
      const res = await fetch(
        \`/api/users/\${userId}\`,
        { signal: controller.signal }
      );
      const data = await res.json();
      setUser(data);
    } catch (err) {
      // AbortError is expected on cleanup
      if (err.name !== 'AbortError') {
        console.error(err);
      }
    }
  }

  load();
  return () => controller.abort();
}, [userId]);`,'jsx','Full pattern')}
    </div>
    <div class="col">
      <div class="bdi"><span class="bdl">1</span><div class="bdt"><strong>Create</strong> an AbortController for this particular effect run.</div></div>
      <div class="bdi g"><span class="bdl">2</span><div class="bdt"><strong>Pass</strong> <ic>controller.signal</ic> into fetch so the request can be cancelled.</div></div>
      <div class="bdi o"><span class="bdl">3</span><div class="bdt"><strong>Return</strong> a cleanup that calls <ic>controller.abort()</ic>.</div></div>
      <div class="bdi p"><span class="bdl">4</span><div class="bdt">In the catch block, <strong>ignore</strong> <ic>AbortError</ic> — it is the expected result of cleanup.</div></div>
      <div class="card"><h3>Why This Matters</h3>
        <p>If the user navigates away or the <ic>userId</ic> changes before the response arrives, the old response must not call <ic>setUser</ic>. Aborting the request both cancels the network work and prevents the stale state update.</p>
      </div>
    </div>
  </div>
</div>`});

export function UserProfile({ userId }) {

  const [error, setError] = useState(null);

          signal: controller.signal

        if (err.name !== 'AbortError') {
          setError(err.message);
        }
      }
    }

    loadUser();
    return () => controller.abort();
  }, [userId]);

  if (!user) return <p>Loading…</p>;
  return <h1>{user.name}</h1>;
}`,'jsx','UserProfile.jsx')}

// 9 PITFALLS PART 1
S.push({h:`
<div class="part-badge p1">Part 1 · Watch Out</div>
<div class="slide-title">Common Pitfalls & How to Avoid Them</div>
<hr class="rule"/>
<div class="content">
  <div class="g2">
    <div class="card"><h3>❌ Missing dependency</h3>
      <p>You use a value inside the effect but forget to put it in the array. The effect captures a stale value from the first render.</p>
      <p style="margin-top:5px;font-size:13.5px;color:var(--accent3)">Fix: include every reactive value the effect reads, or use a ref for intentionally-stable values.</p>
    </div>
    <div class="card"><h3>❌ Infinite loop</h3>
      <p>The effect sets state that is also a dependency. Every run schedules another run.</p>
      <p style="margin-top:5px;font-size:13.5px;color:var(--accent3)">Fix: either remove the state from the dependency array (if it is not needed) or restructure so the effect does not write the same value again.</p>
    </div>
    <div class="card"><h3>❌ No cleanup for async</h3>
      <p>A fetch finishes after the component has unmounted and calls setState → React warning + possible memory leak.</p>
      <p style="margin-top:5px;font-size:13.5px;color:var(--accent3)">Fix: AbortController (or an <ic>isMounted</ic> flag in older code).</p>
    </div>
    <div class="card"><h3>❌ Object / array in deps</h3>
      <p>A new object literal is created every render, so the effect thinks the dependency changed every time.</p>
      <p style="margin-top:5px;font-size:13.5px;color:var(--accent3)">Fix: memoize with useMemo or depend on primitive fields instead.</p>
    </div>
  </div>
</div>`});

<div class="part-badge p2">Part 2 · Core Concept</div>
<div class="slide-title">What is CORS &amp; Why Does the Browser Block You?</div>
<hr class="rule"/>
<div class="content">
  <div class="g2">
    <div class="col">
      <div class="card">
        <h3>Restaurant Security Analogy</h3>
        <p>Your React app (port 5173) is a customer. Your Express API (port 5000) is the kitchen.</p>
        <p style="margin-top:8px">The browser is a strict bouncer. Different ports = different origins. The bouncer blocks the response unless the kitchen sends <ic>Access-Control-Allow-Origin</ic>.</p>
      </div>
      <div class="card">
        <h3>Same-Origin Policy</h3>
        <p>Browsers only allow a page to read responses from the exact same origin (protocol + domain + port) unless the server opts in with CORS headers.</p>
      </div>
    </div>
    <div class="col">
      <div class="card">
        <h3>What / How / Why</h3>
        <div class="bdi"><span class="bdl">WHAT</span><div class="bdt">Cross-Origin Resource Sharing — a browser security mechanism.</div></div>
        <div class="bdi g"><span class="bdl">HOW</span><div class="bdt">Server must send <ic>Access-Control-Allow-Origin</ic> (and often methods/headers) for the browser to hand the response to JavaScript.</div></div>
        <div class="bdi o"><span class="bdl">WHY</span><div class="bdt">Prevents malicious sites from reading data from other origins using the user’s cookies.</div></div>
      </div>
      <div class="card">
        <h3>Typical Error</h3>
        <p style="font-family:var(--mono);font-size:13.5px;color:var(--accent5);line-height:1.45">Access to fetch at 'http://localhost:5000/api/...' from origin 'http://localhost:5173' has been blocked by CORS policy</p>
      </div>
    </div>
  </div>
</div>`});

// ENGINE
let cur=0;
const deck=document.getElementById('deck');
const bar=document.getElementById('bar');
const ctr=document.getElementById('ctr');

function build(){
  S.forEach((s,i)=>{
    const el=document.createElement('div');
    el.className='slide'+(s.cls?' '+s.cls:'');
    el.innerHTML=s.h||'';
    if(i===0)el.classList.add('active');
    deck.appendChild(el);
    if(s.init)s.init(el);
  });
}
function go(n){
  if(n<0||n>=S.length||n===cur)return;
  const els=deck.querySelectorAll('.slide');
  const fwd=n>cur;
  els[cur].classList.remove('active');
  els[cur].classList.add(fwd?'out-l':'out-r');
  setTimeout(()=>els[cur].classList.remove('out-l','out-r'),420);
  cur=n;els[cur].classList.add('active');els[cur].scrollTop=0;tick();
}
function tick(){
  bar.style.width=(S.length>1?(cur/(S.length-1)*100):100)+'%';
  ctr.textContent=(cur+1)+' / '+S.length;
}
document.addEventListener('keydown',e=>{
  const m=document.getElementById('modal');
  if(m.classList.contains('open')){if(e.key==='Escape')m.classList.remove('open');return;}
  const t=document.activeElement.tagName;
  if(t==='INPUT'||t==='TEXTAREA')return;
  if(e.key==='ArrowRight'||e.key==='ArrowDown')go(cur+1);
  else if(e.key==='ArrowLeft'||e.key==='ArrowUp')go(cur-1);
  else if(e.key==='Home')go(0);
  else if(e.key==='End')go(S.length-1);
  else if(e.key==='?')m.classList.add('open');
  else if(e.key==='Escape')m.classList.remove('open');
});
document.addEventListener('mousedown',e=>{
  if(e.target.closest('button,input,a,.mc-opt,.gto-ta'))return;
  if(e.button===2){e.preventDefault();e.stopImmediatePropagation();go(cur+1);}
  else if(e.button===3){e.preventDefault();e.stopImmediatePropagation();go(cur-1);}
  else if(e.button===4){e.preventDefault();e.stopImmediatePropagation();go(cur+1);}
},true);
document.addEventListener('contextmenu',e=>{
  if(e.target.closest('button,input,a'))return;
  e.preventDefault();e.stopImmediatePropagation();
},true);
document.addEventListener('auxclick',e=>{
  if(e.button===3||e.button===4){e.preventDefault();e.stopImmediatePropagation();}
},true);
let tx=0;
document.addEventListener('touchstart',e=>tx=e.touches[0].clientX,{passive:true});
document.addEventListener('touchend',e=>{const d=e.changedTouches[0].clientX-tx;if(Math.abs(d)>50){d<0?go(cur+1):go(cur-1);}},{passive:true});
build();tick();
</script>
