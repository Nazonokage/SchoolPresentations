<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Platform Technologies – Summative Exam</title>
<style>
:root{--bg:#eef3fb;--card:#fff;--tx:#12233f;--mu:#44566f;--ac:#b45309;--ac2:#0f766e;--bd:#c5d3e8}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:18px/1.6 "Segoe UI",Roboto,system-ui,sans-serif;overflow:hidden;background-image:linear-gradient(#dbe6f6 1px,transparent 1px),linear-gradient(90deg,#dbe6f6 1px,transparent 1px);background-size:32px 32px}
#bar{position:fixed;top:0;left:0;height:4px;width:0;background:var(--ac);z-index:10;transition:width .35s}
#cnt{position:fixed;right:20px;bottom:12px;font-size:16px;font-weight:700;color:var(--mu);z-index:10}
.slide{position:absolute;inset:0;padding:clamp(18px,4vh,40px) clamp(18px,5vw,64px) 52px;display:flex;flex-direction:column;opacity:0;visibility:hidden;transform:translateX(40px);transition:opacity .35s,transform .35s,visibility .35s;overflow:auto}
.slide.active{opacity:1;visibility:visible;transform:none}
.slide.before{transform:translateX(-40px)}
@media(prefers-reduced-motion:reduce){.slide,#bar{transition:none}}
.eye{font-size:16px;font-weight:700;color:var(--ac);display:flex;align-items:center;gap:10px}
.ico{width:30px;height:30px;color:var(--ac2);flex:none}
h2{font-size:clamp(26px,3.6vw,36px);margin:2px 0 14px;line-height:1.2}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-auto-rows:minmax(0,1fr);gap:16px;flex:1;min-height:0}
.grid.few{grid-auto-rows:auto;flex:none;align-content:start}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px 18px 16px 62px;position:relative;overflow:auto;min-width:0;box-shadow:0 2px 0 var(--bd)}
.num{position:absolute;left:14px;top:14px;width:36px;height:36px;border-radius:50%;background:var(--tx);color:#fff;font-weight:800;display:grid;place-items:center}
.q{margin:0 0 8px;font-weight:600}
.opt{list-style:none;margin:0;padding:0}.opt li{padding:2px 0}.opt b{color:var(--ac2);margin-right:8px}
.keys{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 22px}
.keys div{background:var(--card);border:1px solid var(--bd);border-left:6px solid var(--ac2);border-radius:10px;padding:8px 14px;min-width:0}
.keys b{color:var(--ac)}.keys span{color:var(--mu)}
.hero{align-items:center;justify-content:center;text-align:center}
.hero svg{height:clamp(140px,26vh,230px);max-width:100%}
.hero p{max-width:60ch;margin:6px auto}
.pill{display:inline-block;background:var(--tx);color:#fff;border-radius:99px;padding:2px 14px;margin:4px;font-weight:600}
#help{position:fixed;inset:0;background:rgba(18,35,63,.9);display:none;place-items:center;z-index:20;padding:20px}
#help.on{display:grid}
#help div{background:#fff;border-radius:16px;padding:20px 28px;max-width:560px}
#help h2{margin-top:0}#help p{margin:4px 0}
@media(max-width:760px){.grid,.keys{grid-template-columns:minmax(0,1fr)}.grid{flex:none;grid-auto-rows:auto}}
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;height:min(560px,62vh);align-items:stretch}
.split>*{height:100%;min-height:0}
.cc{display:flex;flex-direction:column;background:#12233f;color:#e8eefc;border-radius:14px;overflow:hidden;min-width:0}
.ch{flex-shrink:0;display:flex;justify-content:space-between;align-items:center;padding:8px 14px;background:#0c1a31;font-weight:600}
.cc pre{margin:0;flex:1;overflow:auto;min-height:0;padding:12px 16px;font:16px/1.6 Consolas,Menlo,monospace}
.cc i{font-style:normal}.c{color:#8aa0c0}.s{color:#7ee0c8}.k{color:#ffb454}.n{color:#ff9db0}
.cp{font:inherit;font-size:16px;cursor:pointer;border:0;border-radius:10px;padding:2px 16px;color:#e8eefc;background:#16294a;box-shadow:4px 4px 8px #091324,-3px -3px 7px #1f3a66}
.cp.ok{box-shadow:inset 3px 3px 6px #091324,inset -3px -3px 6px #1f3a66;color:#7ee0c8}
.pn{background:#fff;border:1px solid var(--bd);border-radius:14px;padding:14px 18px;overflow:auto;min-width:0}
.pn h3{margin:0 0 6px;font-size:20px;color:var(--ac)}
.pn ul,.pn ol{margin:4px 0;padding-left:22px}.pn p{margin:6px 0}
table{border-collapse:collapse;width:100%}th,td{border:1px solid var(--bd);padding:4px 8px;text-align:left;vertical-align:top}th{background:#e3ecf9}
code{font-family:Consolas,Menlo,monospace;font-size:16px;background:#e3ecf9;border-radius:4px;padding:0 4px}
.cc code{background:none;border-radius:0;padding:0;font-size:16px;color:#e8eefc}
@media(max-width:760px){.split{grid-template-columns:minmax(0,1fr);height:auto}.split>*{height:auto;max-height:70vh}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
<symbol id="ic-q" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="2"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.7.4-1 1-1 1.7M12 17h.01" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
<symbol id="ic-pen" viewBox="0 0 24 24"><path d="M4 20l4-1 11-11-3-3L5 16z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></symbol>
<symbol id="ic-list" viewBox="0 0 24 24"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></symbol>
<symbol id="ic-ok" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="2"/><path d="M7 12.5l3.5 3.5L17 9" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></symbol>
</svg>
<div id="bar"></div><div id="cnt"></div>
<main id="deck"></main>

<h2>Shortcuts</h2>
<p><b>Next:</b> → , right-click, Mouse4</p>
<p><b>Previous:</b> ← , Mouse3, Mouse5</p>
<p><b>First / last:</b> Home / End</p>
<p><b>Mobile:</b> swipe left or right</p>
<p><b>Close this:</b> ? or Esc</p>
</div></div>
<script>
var MCQ=[
["Which keyword marks a function as returning a Promise?","await","async","yield","defer"],
["Which feature lets you write: const { name, age } = user; ?","Spread Operator","Destructuring","ES6 Modules","Event Loop"],
["What prints first to last for: log 'start', setTimeout(log 'async', 0), log 'end'?","start, async, end","async, start, end","start, end, async","end, start, async"],
["Which Firebase service sends push notifications?","Cloud Storage","Authentication","Cloud Messaging","Cloud Firestore"],
["Which database scales automatically and supports range and compound queries?","Realtime Database","Cloud Firestore","MySQL","XAMPP"],
["Which CMS is called the People's Choice and powers over 40% of the web?","WordPress","Joomla","Drupal","Twilio"],
["Which CMS has exceptional multilingual support including RTL languages like Arabic and Hebrew?","WordPress","Joomla","Drupal","Wix"],
["Which Twilio feature delivers one-time passwords via SMS or Voice?","Video Calls","Two-Factor Authentication","WhatsApp Integration","Call forwarding"],
["Which Python class attaches the plain-text body to an email?","MIMEMultipart","MIMEText","smtplib","starttls"],
["In the local setup, where is the extracted WordPress folder placed?","xampp/htdocs/","xampp/bin/","xampp/php/","xampp/tmp/"]];

["A teammate asks why a setTimeout with 0 delay still prints last. Which JS mechanism explains it?"],
["You copy an array and add two items without changing the original: [...nums, 4, 5]. What operator is this?"],
["Callbacks keep losing the right this value. Which function syntax inherits this from the enclosing scope?"],
["A startup wants app data and sign-in without building its own servers. Which Google BaaS fits?"],

["A bakery owner wants to update the site without coding, with design kept separate from content. What type of software?"],

["A student project needs email alerts but has no billing account. Which free server can it use?"],
["Your Python login to Gmail fails with your normal password. Which 16-character code must you use instead?"]];

var ENQ=["Firestore fetch workflow, in exact order: Step 1 of 5.","Firestore fetch workflow, in exact order: Step 2 of 5.","Firestore fetch workflow, in exact order: Step 3 of 5.","Firestore fetch workflow, in exact order: Step 4 of 5.","Firestore fetch workflow, in exact order: Step 5 of 5.","Twilio key communication service (any order): 1 of 5.","Twilio key communication service (any order): 2 of 5.","Twilio key communication service (any order): 3 of 5.","Twilio key communication service (any order): 4 of 5.","Twilio key communication service (any order): 5 of 5."];
var ENA=["Add Firebase to project","Add SDK dependency","Authenticate (optional)","Access database reference","Fetch the data","SMS Notifications","Voice Calls","Video Calls","WhatsApp Integration","Two-Factor Authentication (2FA)"];
var MCA=[["B","async returns a Promise"],["B","unpacks into named variables"],["C","callback runs after sync code"],["C","Cloud Messaging = push"],["B","Firestore queries and scales"],["A","40%+ of the web"],["C","Drupal has built-in RTL"],["B","2FA sends OTP"],["B","MIMEText = body"],["A","extract into htdocs"]];

function ico(id,t){return '<svg class="ico" viewBox="0 0 24 24" role="img"><title>'+t+'</title><use href="#'+id+'"/></svg>';}
function chunk(a,n){var r=[];for(var i=0;i<a.length;i+=n)r.push(a.slice(i,i+n));return r;}
var deck=document.getElementById('deck'),S=[],cur=0,L='ABCD';
function add(eye,title,body,cls,ic,it){
  var s=document.createElement('section');s.className='slide'+(cls?' '+cls:'');
  s.innerHTML=(eye?'<div class="eye">'+(ic?ico(ic,it):'')+eye+'</div><h2>'+title+'</h2>':'')+body;
  deck.appendChild(s);S.push(s);
}
function cards(items,start,fn){
  return '<div class="grid'+(items.length<3?' few':'')+'">'+items.map(function(x,i){return '<div class="card"><span class="num">'+(start+i)+'</span>'+fn(x)+'</div>';}).join('')+'</div>';
}
var cloud='<svg viewBox="0 0 260 160" role="img"><title>Cloud holding code brackets with three connected services</title><path d="M70 125a36 36 0 0 1-3-72 52 52 0 0 1 98-9 42 42 0 0 1 33 81z" fill="#fff" stroke="#b45309" stroke-width="4"/><text x="130" y="100" text-anchor="middle" font-size="40" font-weight="700" fill="#12233f" font-family="Consolas,monospace">{ / }</text><circle cx="30" cy="140" r="9" fill="#0f766e"/><circle cx="130" cy="150" r="9" fill="#0f766e"/><circle cx="230" cy="140" r="9" fill="#0f766e"/><path d="M38 134l28-10M130 141v-14M222 134l-28-10" stroke="#0f766e" stroke-width="3"/></svg>';
add('','','<div class="hero" style="display:flex;flex-direction:column;align-items:center">'+cloud+'<div class="eye" style="justify-content:center;margin-top:10px">Pre-periodical practice</div><h2 style="font-size:clamp(30px,5vw,48px)">Platform Technologies: Lecture and Summative Exam</h2><p>JavaScript, Firebase, CMS, Twilio, Gmail SMTP and XAMPP.</p><p><span class="pill">7 lecture slides</span><span class="pill">10 MCQ</span><span class="pill">10 Identification</span><span class="pill">10 Enumeration</span></p><p>Study the lecture first, then take the exam. Press → or right-click to begin. Press ? for shortcuts.</p></div>','hero');
var CODES=[];
function hl(c){return c.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/(\/\/.*|#.*)|("[^"\n]*"|'[^'\n]*'|`[^`\n]*`)|\b(import|from|const|let|async|await|function|if|return|new)\b|\b(\d+)\b/g,function(m,a,b,k){return '<i class="'+(a?'c':b?'s':k?'k':'n')+'">'+m+'</i>';});}
function codeCard(t,code){return '<div class="cc"><div class="ch"><span>'+t+'</span><button class="cp" data-i="'+(CODES.push(code)-1)+'">Copy</button></div><pre><code>'+hl(code)+'</code></pre></div>';}
function pn(h,b){return '<div class="pn"><h3>'+h+'</h3>'+b+'</div>';}
function flow(steps){var h=steps.length*62+8,s='<svg viewBox="0 0 300 '+h+'" role="img" style="width:100%;max-height:100%"><title>Five-step Firestore fetch workflow</title>';steps.forEach(function(t,i){var y=4+i*62;s+='<rect x="6" y="'+y+'" width="288" height="44" rx="10" fill="#e3ecf9" stroke="#0f766e" stroke-width="2"/><text x="20" y="'+(y+29)+'" font-size="18" font-weight="700" fill="#12233f">'+(i+1)+'. '+t+'</text>';if(i<steps.length-1)s+='<path d="M150 '+(y+46)+'v12m-6-6l6 6 6-6" fill="none" stroke="#b45309" stroke-width="2.5"/>';});return s+'</svg>';}
var LEC='Lecture · ';
var jsCode=["const user = { name: 'Zephyra', age: 30 };","const { name, age } = user;","const nums = [1, 2, 3];","const more = [...nums, 4, 5];","const square = x => x * x;","console.log(`Hi ${name}, ${age}. Squares: ${more.map(square)}`);"].join('\n');
var evCode=["console.log('start');","setTimeout(() => console.log('async'), 0);","const wait = ms => new Promise(r => setTimeout(r, ms));","async function run() {","  await wait(100);","  console.log('after await');","}","run();","console.log('end');"].join('\n');
var fsCode=["import { initializeApp } from 'firebase/app';","import { getFirestore, doc, getDoc } from 'firebase/firestore';","const firebaseConfig = { projectId: 'your-project-id' };","const app = initializeApp(firebaseConfig);","const db = getFirestore(app);","async function fetchUser() {","  const ref = doc(db, 'users', 'user_id_1');","  const snap = await getDoc(ref);","  if (snap.exists()) { console.log(snap.data()); }","}","fetchUser();"].join('\n');
var pyCode=["import smtplib","from email.mime.text import MIMEText","from email.mime.multipart import MIMEMultipart","sender = 'your_email@gmail.com'","password = 'your_app_password_here'","msg = MIMEMultipart()","msg['From'] = sender","msg['To'] = 'recipient@example.com'","msg['Subject'] = 'Google Mailer Notification'","msg.attach(MIMEText('Hello from Python!', 'plain'))","server = smtplib.SMTP('smtp.gmail.com', 587)","server.starttls()","server.login(sender, password)","server.sendmail(sender, msg['To'], msg.as_string())","server.quit()"].join('\n');
function sp(a,b){return '<div class="split">'+a+b+'</div>';}
add(LEC+'JavaScript','The 7 core features',sp(pn('Know these by name','<ul><li><b>Async/Await</b>: async code that reads like sync, built on Promises</li><li><b>Template Literals</b>: &#96;backticks&#96; with &#36;{ } interpolation</li><li><b>Arrow Functions</b>: <code>=&gt;</code> syntax, inherits <code>this</code></li><li><b>Destructuring</b>: unpack into named variables</li><li><b>ES6 Modules</b>: <code>export</code> / <code>import</code></li><li><b>Spread (...)</b>: clone, merge, pass args</li><li><b>Event Loop</b>: single-threaded, non-blocking</li></ul>'),codeCard('features.js',jsCode)),'','ic-pen','Pencil');
add(LEC+'JavaScript','Async/Await and the Event Loop',sp(codeCard('eventloop.js',evCode),pn('Output order','<p><b>start</b>, <b>end</b>, <b>async</b>, <b>after await</b></p><p>Synchronous code runs first. The Event Loop then queues callbacks, so the UI never freezes. <code>async</code> marks a function as returning a Promise, and <code>await</code> pauses inside it until the Promise resolves.</p><svg viewBox="0 0 330 70" role="img" style="width:100%;max-height:90px"><title>Call stack feeds the event loop which pulls from the task queue</title><rect x="2" y="10" width="100" height="46" rx="8" fill="#e3ecf9" stroke="#0f766e" stroke-width="2"/><text x="14" y="39" font-size="18" font-weight="700" fill="#12233f">Stack</text><rect x="120" y="10" width="100" height="46" rx="8" fill="#fde9cf" stroke="#b45309" stroke-width="2"/><text x="128" y="39" font-size="18" font-weight="700" fill="#12233f">Loop</text><rect x="238" y="10" width="90" height="46" rx="8" fill="#e3ecf9" stroke="#0f766e" stroke-width="2"/><text x="250" y="39" font-size="18" font-weight="700" fill="#12233f">Queue</text><path d="M104 33h14M222 33h14" stroke="#12233f" stroke-width="2.5"/></svg>')),'','ic-pen','Pencil');
add(LEC+'Firebase','A backend without servers',sp(pn('Firebase is a Backend-as-a-Service by Google','<ul><li><b>Realtime Database / Cloud Firestore</b>: store and sync data</li><li><b>Authentication</b>: sign-in across platforms</li><li><b>Cloud Storage</b>: user images and videos</li><li><b>Cloud Messaging</b>: push notifications</li></ul>'),pn('Firestore vs Realtime Database','<table><tr><th></th><th>Firestore</th><th>Realtime DB</th></tr><tr><td>Structure</td><td>Collections of documents</td><td>One big JSON tree</td></tr><tr><td>Scale</td><td>Automatic</td><td>About 100k users</td></tr><tr><td>Queries</td><td>Complex, compound</td><td>Basic filtering</td></tr><tr><td>Offline</td><td>Persistent cache</td><td>In-memory cache</td></tr><tr><td>Best for</td><td>Most new apps</td><td>Lowest latency</td></tr></table>')),'','ic-pen','Pencil');
add(LEC+'Firebase','Fetching data from Firestore: 5 steps',sp(codeCard('fetchUser.js',fsCode),pn('The workflow',flow(['Add Firebase to project','Add SDK dependency','Authenticate (optional)','Access database reference','Fetch the data']))),'','ic-pen','Pencil');
add(LEC+'CMS and XAMPP','Choosing a CMS, then testing it locally',sp(pn('A CMS separates design from content','<table><tr><th></th><th>WordPress</th><th>Joomla</th><th>Drupal</th></tr><tr><td>Ease</td><td>Very high</td><td>Medium</td><td>Low</td></tr><tr><td>Best for</td><td>Blogs, small business</td><td>Communities, e-commerce</td><td>Enterprise, government</td></tr><tr><td>Users</td><td>Plugins needed</td><td>Built-in ACL</td><td>Custom roles</td></tr><tr><td>Languages</td><td>Plugins</td><td>Built-in</td><td>Built-in + RTL</td></tr></table>'),pn('XAMPP = Apache + MySQL + PHP','<ol><li>Install XAMPP</li><li>Start Apache and MySQL</li><li>Open localhost/phpmyadmin, create <code>wordpress_test</code></li><li>Download WordPress from wordpress.org</li><li>Extract into <code>xampp/htdocs/</code>, rename it <code>mysite</code></li><li>Visit localhost/mysite and run the installer</li></ol>')),'','ic-pen','Pencil');
add(LEC+'Twilio and Gmail SMTP','Sending messages from code',sp(codeCard('mailer.py',pyCode),pn('CPaaS vs free email','<p><b>Twilio</b> (paid) offers SMS, Voice, Video, WhatsApp and Two-Factor Authentication through APIs.</p><p><b>Gmail SMTP</b> is free. Turn on 2-Step Verification, create a 16-character <b>App Password</b>, and never use your real password.</p><ul><li><code>MIMEMultipart</code>: the envelope</li><li><code>MIMEText</code>: the plain-text body</li><li><code>starttls()</code>, <code>login()</code>, <code>sendmail()</code>, <code>quit()</code></li></ul>')),'','ic-pen','Pencil');
add(LEC+'Real life and recap','Analogies, then a quick recap',sp(pn('Real-life scenarios','<ul><li><b>Twilio</b>: you pay a rail service instead of building train tracks.</li><li><b>Event Loop</b>: a waiter takes new orders while the kitchen cooks.</li><li><b>CMS</b>: swapping a theme is like changing a phone case, the phone stays.</li><li><b>Firebase</b>: renting a ready kitchen instead of building one.</li></ul>'),pn('Recap','<ul><li>7 JS features, 5 Firestore steps</li><li>4 Firebase services</li><li>3 CMS: WordPress, Joomla, Drupal</li><li>3 XAMPP parts, 5 Twilio services</li><li>Gmail SMTP needs an App Password</li></ul><p><b>Next: the exam.</b></p>')),'','ic-ok','Check mark');

});

  add('Part II · Situational identification · 1 point each','Items '+(k*4+11)+'–'+(k*4+10+c.length),cards(c,k*4+11,function(m){return '<p class="q">'+m[0]+'</p>';}),'','ic-pen','Pencil');
});

  add('Part III · Enumeration · 1 point each','Items '+(k*4+21)+'–'+(k*4+20+c.length),cards(c,k*4+21,function(m){return '<p class="q">'+m+'</p>';}),'','ic-list','List');
});

var bar=document.getElementById('bar'),cnt=document.getElementById('cnt'),help=document.getElementById('help');
function go(n){cur=Math.max(0,Math.min(S.length-1,n));S.forEach(function(el,i){el.className='slide'+(el.classList.contains('hero')?' hero':'')+(i==cur?' active':i<cur?' before':'');if(i==cur)el.scrollTop=0;});bar.style.width=((cur+1)/S.length*100)+'%';cnt.textContent=(cur+1)+' / '+S.length;}
function nx(){go(cur+1);}function pv(){go(cur-1);}
document.addEventListener('keydown',function(e){
  if(e.key==='?'){help.classList.toggle('on');return;}
  if(e.key==='Escape'){help.classList.remove('on');return;}
  if(e.key==='ArrowRight'||e.key==='PageDown')nx();
  else if(e.key==='ArrowLeft'||e.key==='PageUp')pv();
  else if(e.key==='Home')go(0);
  else if(e.key==='End')go(S.length-1);
});
document.addEventListener('mousedown',function(e){
  if(e.button===1||e.button===3||e.button===4){e.preventDefault();e.stopImmediatePropagation();if(e.button===3)nx();else pv();}
},true);
['mouseup','auxclick'].forEach(function(t){document.addEventListener(t,function(e){if(e.button===1||e.button===3||e.button===4){e.preventDefault();e.stopImmediatePropagation();}},true);});
document.addEventListener('contextmenu',function(e){e.preventDefault();nx();});
var tx=null;
document.addEventListener('touchstart',function(e){tx=e.touches[0].clientX;},{passive:true});
document.addEventListener('touchend',function(e){if(tx===null)return;var d=e.changedTouches[0].clientX-tx;tx=null;if(Math.abs(d)>60){d<0?nx():pv();}},{passive:true});
document.addEventListener('click',function(e){var b=e.target.closest('.cp');if(!b)return;var t=CODES[b.dataset.i];
  var p=(navigator.clipboard&&navigator.clipboard.writeText)?navigator.clipboard.writeText(t):Promise.reject();
  p.catch(function(){var a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();document.execCommand('copy');a.remove();}).then(function(){b.classList.add('ok');b.textContent='Copied!';setTimeout(function(){b.classList.remove('ok');b.textContent='Copy';},1600);});});
go(0);
</script>
