e;\n  }\n  console.log(login('Orvyn', 'wrong'));\n  console.log(login('Orvyn', 'secret'));\n  console.log(session);\n}\ndemo();", "Sessions: the server finally remembers Orvyn."], ["function calc() {\n  return 1 + '1' - 1;\n}\nconsole.log(calc());", "Math, but JavaScript is mad at you."], ["function crud() {\n  const users = [];\n  users.push({ id: 1, name: 'Quillon' });\n  users.push({ id: 2, name: 'Orvyn' });\n  users.push({ id: 3, name: 'Zed' });\n  const found = users.find(u => u.id === 2);\n  found.name = 'Orvyn II';\n  users.splice(0, 1);\n  console.log(users.length, users[0].name);\n}\ncrud();", "insert, find, update, delete: all four letters of CRUD."], ["function birthday(doc) {\n  Object.assign(doc, { age: 21 });\n  return doc;\n}\nconsole.log(birthday({ name: 'Quillon', age: 20 }));", "updateOne with a birthday."], ["function removeSecond(docs) {\n  docs.splice(1, 1);\n  return docs;\n}\nconsole.log(removeSecond(['a', 'b', 'c']));", "deleteOne, array edition."], ["function handle(url) {\n  if (url.startsWith('/users/')) {\n    return 'User ' + url.split('/')[2];\n  }\n  if (url === '/about') return 'About';\n  return 'Not Found';\n}\nconsole.log(handle('/users/7'));\nconsole.log(handle('/about'));\nconsole.log(handle('/nope'));", "A router with a tiny attitude."]];
