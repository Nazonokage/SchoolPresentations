<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>Long-Term Planning &amp; Scaling Concepts for Web Projects &mdash; Part 1</title>
<style>
  :root{
    --bg:#1b1e25;
    --surface:#20242c;
    --surface-2:#252a33;
    --shadow-d:#121419;
    --shadow-l:#2e3441;
    --text:#e9ebf1;
    --text-dim:#a4abbb;
    --text-faint:#767e91;
    --accent:#53e6c9;
    --accent-soft:rgba(83,230,201,0.14);
    --accent-2:#f5ac4d;
    --accent-2-soft:rgba(245,172,77,0.14);
    --accent-3:#7f9cf5;
    --accent-3-soft:rgba(127,156,245,0.14);
    --danger:#ef6a76;
    --danger-soft:rgba(239,106,118,0.14);
    --radius-lg:24px;
    --radius-md:18px;
    --radius-sm:12px;
    --font-display:"Segoe UI",ui-sans-serif,system-ui,-apple-system,sans-serif;
    --font-body:"Segoe UI",ui-sans-serif,system-ui,-apple-system,sans-serif;
    --font-mono:ui-monospace,"Cascadia Mono","SFMono-Regular",Consolas,Menlo,monospace;
  }
  *{box-sizing:border-box;}
  svg{ width:28px; height:28px; display:block; flex-shrink:0; }
  html,body{
    margin:0;padding:0;height:100%;
    background:var(--bg);
    color:var(--text);
    font-family:var(--font-body);
    overflow:hidden;
    -webkit-font-smoothing:antialiased;
  }
  body{
    background-image:
      radial-gradient(1200px 700px at 12% -8%, rgba(83,230,201,0.06), transparent 60%),
      radial-gradient(1000px 650px at 100% 110%, rgba(127,156,245,0.06), transparent 60%);
  }
  ::selection{ background:var(--accent); color:#0c1210; }

  #deck{ position:relative; width:100vw; height:100vh; overflow:hidden; }

  .slide{
    position:absolute; inset:0;
    display:flex; flex-direction:column;
    padding:42px 88px 68px;
    opacity:0; pointer-events:none;
    transform:translateX(40px);
    transition:opacity 350ms ease, transform 350ms ease;
  }
  .slide.active{ opacity:1; pointer-events:auto; transform:translateX(0); }
  .slide.exit-left{ transform:translateX(-40px); }
  .slide.exit-right{ transform:translateX(40px); }

  @media (prefers-reduced-motion: reduce){
    .slide{ transition:opacity 1ms linear; transform:none !important; }
  }

  .eyebrow{
    font-size:15px; letter-spacing:.14em; text-transform:uppercase;
    color:var(--accent); font-weight:700; margin:0 0 10px;
    display:flex; align-items:center; gap:10px;
  }
  .eyebrow::before{
    content:""; width:22px; height:2px; background:var(--accent); border-radius:2px; display:inline-block;
  }
  .title{
    font-family:var(--font-display);
    font-size:34px; line-height:1.12; font-weight:750; margin:0 0 16px;
    letter-spacing:-0.01em;
    color:var(--text);
  }
  .subtitle{ font-size:17px; color:var(--text-dim); margin:-10px 0 16px; font-weight:400; }
  .content{ flex:1; min-height:0; display:flex; flex-direction:column; overflow-y:auto; overflow-x:hidden; padding-right:6px; }
  .content::-webkit-scrollbar{ width:8px; }
  .content::-webkit-scrollbar-thumb{ background:var(--surface-2); border-radius:8px; }

  /* neumorphic base elements */
  .card{
    background:var(--surface);
    border-radius:var(--radius-md);
    box-shadow:9px 9px 18px var(--shadow-d), -9px -9px 18px var(--shadow-l);
    padding:18px 20px;
  }
  .card-flat{ background:var(--surface); border-radius:var(--radius-sm); padding:16px 18px; }
  .inset{
    background:var(--surface);
    border-radius:var(--radius-md);
    box-shadow:inset 6px 6px 12px var(--shadow-d), inset -6px -6px 12px var(--shadow-l);
    padding:18px 20px;
  }
  .badge{
    display:inline-flex; align-items:center; gap:8px;
    background:var(--surface); border-radius:999px; padding:8px 16px;
    font-size:15px; font-weight:600; color:var(--text-dim);
    box-shadow:5px 5px 10px var(--shadow-d), -5px -5px 10px var(--shadow-l);
  }
  .badge .dot{ width:8px; height:8px; border-radius:50%; background:var(--accent); flex-shrink:0; }

  h3.h{ font-size:20px; font-weight:700; margin:0 0 10px; color:var(--text); }
  p{ font-size:17px; line-height:1.5; color:var(--text-dim); margin:0 0 8px; }
  strong{ color:var(--text); font-weight:700; }
  ul.list, ol.list{ margin:0; padding-left:20px; }
  ul.list li, ol.list li{ font-size:17px; line-height:1.45; color:var(--text-dim); margin-bottom:7px; }
  ul.list li::marker{ color:var(--accent); }
  .muted{ color:var(--text-faint); font-size:15px; }

  .grid{ display:grid; gap:20px; min-height:0; }
  .grid-2{ grid-template-columns:1fr 1fr; }
  .grid-3{ grid-template-columns:repeat(auto-fit, minmax(230px, 1fr)); }
  .grid-4{ grid-template-columns:repeat(auto-fit, minmax(200px, 1fr)); }
  .stack{ display:flex; flex-direction:column; gap:12px; min-height:0; }
  .row{ display:flex; gap:12px; align-items:stretch; min-height:0; }

  /* table */
  table.tbl{ width:100%; border-collapse:separate; border-spacing:0; font-size:15.5px; }
  table.tbl th{
    text-align:left; color:var(--accent); font-size:13.5px; letter-spacing:.05em; text-transform:uppercase;
    padding:10px 14px; font-weight:700; background:var(--surface-2); border-bottom:2px solid var(--bg);
  }
  table.tbl th:first-child{ border-top-left-radius:12px; }
  table.tbl th:last-child{ border-top-right-radius:12px; }
  table.tbl td{ padding:12px 14px; color:var(--text-dim); border-bottom:1px solid var(--surface-2); vertical-align:top; line-height:1.5; }
  table.tbl tr:last-child td{ border-bottom:none; }
  table.tbl td strong{ color:var(--text); }

  /* icon badges / logo row */
  .icon-row{ display:flex; flex-wrap:wrap; gap:14px; }
  .icon-chip{
    display:flex; align-items:center; gap:10px;
    background:var(--surface); border-radius:14px; padding:10px 16px 10px 12px;
    box-shadow:6px 6px 12px var(--shadow-d), -6px -6px 12px var(--shadow-l);
    font-size:15px; font-weight:600; color:var(--text-dim);
  }
  .icon-chip svg{ width:26px; height:26px; flex-shrink:0; }

  /* diagram wrapper */
  .diagram-wrap{
    background:var(--surface); border-radius:var(--radius-md);
    box-shadow:9px 9px 18px var(--shadow-d), -9px -9px 18px var(--shadow-l);
    padding:18px; overflow:hidden; display:flex; align-items:center; justify-content:center;
    min-height:0;
  }
  .diagram-wrap svg{ width:100%; height:100%; max-height:100%; }
  .dnode-label{ font-size:14.5px; font-weight:700; fill:var(--text); font-family:var(--font-body); }
  .dnode-sub{ font-size:12px; fill:var(--text-faint); font-family:var(--font-body); }
  .dedge-label{ font-size:12px; fill:var(--text-dim); font-family:var(--font-body); }

  /* code panel */
  .code-card{ display:flex; flex-direction:column; height:100%; min-height:0; background:var(--surface);
    border-radius:var(--radius-md); box-shadow:9px 9px 18px var(--shadow-d), -9px -9px 18px var(--shadow-l);
    overflow:hidden; }
  .code-head{ flex-shrink:0; display:flex; align-items:center; justify-content:space-between;
    padding:12px 16px; background:var(--surface-2); }
  .code-head .fname{ font-size:14px; color:var(--text-dim); font-family:var(--font-mono); }
  .copy-btn{
    font-family:var(--font-body); font-size:13.5px; font-weight:600; color:var(--text-dim);
    background:var(--surface); border:none; border-radius:10px; padding:7px 14px; cursor:pointer;
    box-shadow:4px 4px 8px var(--shadow-d), -4px -4px 8px var(--shadow-l);
    transition:box-shadow 120ms ease, color 120ms ease;
  }
  .copy-btn:active, .copy-btn.copied{
    box-shadow:inset 3px 3px 6px var(--shadow-d), inset -3px -3px 6px var(--shadow-l);
    color:var(--accent);
  }
  pre.code{ flex:1; overflow:auto; min-height:0; margin:0; padding:16px 18px; font-family:var(--font-mono);
    font-size:15px; line-height:1.6; color:var(--text-dim); }
  pre.code .kw{ color:var(--accent-3); } pre.code .str{ color:var(--accent); }
  pre.code .cmt{ color:var(--text-faint); font-style:italic; } pre.code .fn{ color:var(--accent-2); }
  pre.code .num{ color:#c98af0; }

  /* note / panel column beside code */
  .panel-col{ display:flex; flex-direction:column; height:100%; min-height:0; }
  .panel-col .card{ flex:1; overflow-y:auto; min-height:0; }

  /* quadrant matrix */
  .quad{ display:grid; grid-template-columns:auto 1fr 1fr; grid-template-rows:auto 1fr 1fr; gap:10px; height:100%; }
  .quad .axis-label{ display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:700;
    color:var(--text-faint); text-transform:uppercase; letter-spacing:.05em; }
  .quad .vaxis{ writing-mode:vertical-rl; transform:rotate(180deg); }
  .quad-cell{ border-radius:16px; padding:18px; display:flex; flex-direction:column; justify-content:center; gap:6px; }
  .quad-cell .qtitle{ font-weight:700; font-size:16px; color:var(--text); }
  .quad-cell .qdesc{ font-size:14px; color:var(--text-dim); }
  .q1{ background:var(--accent-soft); } .q2{ background:var(--accent-3-soft); }
  .q3{ background:var(--surface-2); } .q4{ background:var(--danger-soft); }

  /* activities */
  .qcard{ background:var(--surface); border-radius:var(--radius-md); padding:18px 20px;
    box-shadow:7px 7px 14px var(--shadow-d), -7px -7px 14px var(--shadow-l); }
  .qcard .qnum{ display:inline-flex; align-items:center; justify-content:center; width:26px; height:26px;
    border-radius:50%; background:var(--accent-soft); color:var(--accent); font-weight:700; font-size:13.5px; margin-right:10px; }
  .qcard .qtext{ font-size:16px; font-weight:600; color:var(--text); display:inline; }
  .qcard .opts{ margin:12px 0 0 36px; padding:0; list-style:none; }
  .qcard .opts li{ font-size:15px; color:var(--text-dim); margin-bottom:6px; }
  .qcard .opts li .optlet{ color:var(--accent-2); font-weight:700; margin-right:6px; }
  .qcard.answer{ display:flex; align-items:flex-start; gap:14px; }
  .qcard .ans-badge{ flex-shrink:0; background:var(--accent-soft); color:var(--accent); font-weight:700;
    font-size:14px; padding:6px 12px; border-radius:10px; }

  /* footer chrome */
  .chrome{ position:absolute; left:0; right:0; bottom:0; padding:14px 88px 20px; display:flex; flex-direction:column; gap:10px; z-index:20; background:linear-gradient(0deg, var(--bg) 60%, transparent); }
  .progress-track{ width:100%; height:4px; border-radius:4px; background:var(--surface);
    box-shadow:inset 2px 2px 4px var(--shadow-d), inset -2px -2px 4px var(--shadow-l); overflow:hidden; }
  .progress-fill{ height:100%; background:var(--accent); border-radius:4px; transition:width 300ms ease; }
  .chrome-row{ display:flex; align-items:center; justify-content:space-between; }
  .counter{ font-size:15px; color:var(--text-faint); font-variant-numeric:tabular-nums; }
  .hint{ font-size:14px; color:var(--text-faint); display:flex; gap:14px; }
  .hint kbd{ font-family:var(--font-mono); background:var(--surface); padding:2px 7px; border-radius:6px;
    box-shadow:3px 3px 6px var(--shadow-d), -3px -3px 6px var(--shadow-l); font-size:12.5px; color:var(--text-dim); }

  /* shortcuts overlay */
  #shortcuts-overlay{ position:fixed; inset:0; background:rgba(10,11,14,0.72); backdrop-filter:blur(3px);
    display:flex; align-items:center; justify-content:center; z-index:100; opacity:0; pointer-events:none; transition:opacity 200ms ease; }
  #shortcuts-overlay.show{ opacity:1; pointer-events:auto; }
  #shortcuts-overlay .panel{ background:var(--surface); border-radius:var(--radius-lg); padding:36px 40px;
    box-shadow:14px 14px 28px var(--shadow-d), -14px -14px 28px var(--shadow-l); max-width:480px; width:90%; }
  #shortcuts-overlay h4{ margin:0 0 18px; font-size:20px; color:var(--text); font-family:var(--font-display); }
  #shortcuts-overlay .row{ display:flex; justify-content:space-between; padding:10px 0; border-bottom:1px solid var(--surface-2); font-size:15.5px; color:var(--text-dim); }
  #shortcuts-overlay .row:last-child{ border-bottom:none; }

  @media (max-width: 1150px){
    .slide{ padding:44px 48px 84px; }
    .title{ font-size:33px; }
    .icon-row .icon-chip{ font-size:14px; padding:8px 12px; }
  }
  @media (max-width: 900px){
    .slide{ padding:38px 26px 78px; }
    .title{ font-size:28px; }
    .grid-2{ grid-template-columns:1fr; }
    .row{ flex-direction:column; }
    .chrome{ padding:0 26px 14px; }
    .hint{ display:none; }
  }
  @media (max-height: 720px){
    .slide{ padding-top:34px; padding-bottom:70px; }
    .title{ font-size:30px; margin-bottom:14px; }
  }
</style>
</head>
<body>

<div id="deck"></div>

<div class="chrome">
  <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
  <div class="chrome-row">
    <div class="counter" id="counter">1 / 1</div>
    <div class="hint">
      <span><kbd>&#8592;</kbd> <kbd>&#8594;</kbd> navigate</span>
      <span><kbd>Home</kbd> <kbd>End</kbd> jump</span>
      <span><kbd>?</kbd> shortcuts</span>
    </div>
  </div>
</div>

<div id="shortcuts-overlay">
  <div class="panel">
    <h4>Keyboard &amp; mouse shortcuts</h4>
    <div class="row"><span>Next slide</span><span>&#8594; / Right-click / Mouse4</span></div>
    <div class="row"><span>Previous slide</span><span>&#8592; / Mouse3</span></div>
    <div class="row"><span>First / last slide</span><span>Home / End</span></div>
    <div class="row"><span>Toggle this panel</span><span>?</span></div>
    <div class="row"><span>Swipe</span><span>Left / Right on mobile</span></div>
  </div>
</div>

<script>
// ---------- small icon library (generic, non-branded tech glyphs) ----------
const ICONS = {
  server: '<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="3" y="3" width="18" height="7" rx="2" stroke="currentColor" stroke-width="1.6"/><rect x="3" y="14" width="18" height="7" rx="2" stroke="currentColor" stroke-width="1.6"/><circle cx="7" cy="6.5" r="1" fill="currentColor"/><circle cx="7" cy="17.5" r="1" fill="currentColor"/></svg>',
  db: '<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><ellipse cx="12" cy="5" rx="8" ry="3" stroke="currentColor" stroke-width="1.6"/><path d="M4 5v14c0 1.66 3.58 3 8 3s8-1.34 8-3V5" stroke="currentColor" stroke-width="1.6"/><path d="M4 12c0 1.66 3.58 3 8 3s8-1.34 8-3" stroke="currentColor" stroke-width="1.6"/></svg>',
  cloud: '<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M7 18a4.5 4.5 0 0 1-.5-8.97A5.5 5.5 0 0 1 17.2 8.1 4 4 0 0 1 17 18H7Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>',
  layers: '<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M12 2 2 7l10 5 10-5-10-5Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M2 12l10 5 10-5" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M2 17l10 5 10-5" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>',
  bolt: '<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M13 2 3 14h7l-1 8 10-12h-7l1-8Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>',
  shield: '<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M12 2 4 5v6c0 5 3.4 8.7 8 11 4.6-2.3 8-6 8-11V5l-8-3Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>',
  gear: '<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><circle cx="12" cy="12" r="3.2" stroke="currentColor" stroke-width="1.6"/><path d="M19.4 13.5c.1-.5.1-1 0-1.5l1.9-1.3-2-3.5-2.2.8a7.4 7.4 0 0 0-1.3-.8L15.5 5h-4l-.3 2.2c-.5.2-.9.5-1.3.8l-2.2-.8-2 3.5L7.6 12c-.1.5-.1 1 0 1.5l-1.9 1.3 2 3.5 2.2-.8c.4.3.8.6 1.3.8l.3 2.2h4l.3-2.2c.5-.2.9-.5 1.3-.8l2.2.8 2-3.5-1.9-1.3Z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>',
  chart: '<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M4 20V10M11 20V4M18 20v-7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>',
  map: '<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M9 4 4 6v14l5-2 6 2 5-2V4l-5 2-6-2Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M9 4v14M15 6v14" stroke="currentColor" stroke-width="1.4"/></svg>',
  doc: '<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M6 2h9l5 5v15H6V2Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M15 2v5h5" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M9 12h6M9 16h6" stroke="currentColor" stroke-width="1.4"/></svg>',
  eye: '<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.6"/></svg>',
  loop: '<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M4 12a8 8 0 0 1 13.66-5.66L20 8M20 8V3M20 8h-5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M20 12a8 8 0 0 1-13.66 5.66L4 16m0 0v5m0-5h5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  people: '<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><circle cx="8" cy="8" r="3" stroke="currentColor" stroke-width="1.6"/><circle cx="17" cy="9" r="2.4" stroke="currentColor" stroke-width="1.6"/><path d="M2 20c0-3.3 2.7-5.5 6-5.5s6 2.2 6 5.5" stroke="currentColor" stroke-width="1.6"/><path d="M14.5 14.7c2.6.3 4.5 2.3 4.5 5.3" stroke="currentColor" stroke-width="1.6"/></svg>',
  puzzle: '<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M9 4h4a1.5 1.5 0 0 1 1.4 2c-.2.7.3 1.5 1 1.5A1.6 1.6 0 0 1 17 9v4h-2c-.8 0-1.5.7-1.5 1.5S14.2 16 15 16h2v4H9a1 1 0 0 1-1-1v-4c0-.8-.7-1.5-1.5-1.5S5 14.2 5 15v4H4a1 1 0 0 1-1-1v-4c1.1 0 2-.9 2-2s-.9-2-2-2V6a1 1 0 0 1 1-1h4c0-1.1.9-2 2-2Z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg>',
  spark: '<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M12 2v6M12 16v6M2 12h6M16 12h6M5 5l4 4M15 15l4 4M19 5l-4 4M9 15l-4 4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>',
  key: '<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><circle cx="7.5" cy="14.5" r="4.5" stroke="currentColor" stroke-width="1.6"/><path d="M11 11 20 2m-3 3 2 2m-6 2 2 2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>',
  quote: '<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M7 15c-2 0-3-1.5-3-3.5C4 8 6 5.5 9 5v2c-1.5.4-2.5 1.7-2.5 3.2.3-.2.7-.3 1.1-.3 1.4 0 2.4 1 2.4 2.4S9 15 7 15Zm9 0c-2 0-3-1.5-3-3.5 0-3.5 2-6 5-6.5v2c-1.5.4-2.5 1.7-2.5 3.2.3-.2.7-.3 1.1-.3 1.4 0 2.4 1 2.4 2.4S18 15 16 15Z" fill="currentColor"/></svg>',
  celebrate: '<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M4 20 15 9M4 20l3-9 8 3-3 9-8-3Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="M15 5l.6 1.7L17.3 7l-1.7.6L15 9.3l-.6-1.7L12.7 7l1.7-.3L15 5ZM20 3v3M18.5 4.5h3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>'
};
function icon(name){ return ICONS[name] || ''; }
function chip(name, label){
  return '<div class="icon-chip"><span style="color:var(--accent)">'+icon(name)+'</span><span>'+label+'</span></div>';
}

// ---------- generic renderers ----------
function table(headers, rows){
  let h = '<table class="tbl"><thead><tr>' + headers.map(x=>'<th>'+x+'</th>').join('') + '</tr></thead><tbody>';
  rows.forEach(r=>{ h += '<tr>' + r.map(c=>'<td>'+c+'</td>').join('') + '</tr>'; });
  h += '</tbody></table>';
  return h;
}
function cardGrid(items, cols){
  cols = cols || 3;
  let h = '<div class="grid grid-'+cols+'">';
  items.forEach(it=>{
    h += '<div class="card"><div style="color:var(--accent);margin-bottom:10px">'+icon(it.icon)+'</div>' +
      '<h3 class="h">'+it.title+'</h3><p style="margin:0">'+it.body+'</p></div>';
  });
  h += '</div>';
  return h;
}

// SVG box/arrow diagram renderer. nodes: {id,x,y,w,h,label,sub,variant}. edges:{from,to,label,dashed}
function diagram(viewW, viewH, nodes, edges, opts){
  opts = opts || {};
  const colorFor = v => v==='accent' ? 'var(--accent)' : v==='accent-2' ? 'var(--accent-2)' : v==='accent-3' ? 'var(--accent-3)' : 'var(--surface-2)';
  const fillFor = v => v==='accent' ? 'rgba(83,230,201,0.12)' : v==='accent-2' ? 'rgba(245,172,77,0.12)' : v==='accent-3' ? 'rgba(127,156,245,0.12)' : 'var(--surface-2)';
  let s = '<svg viewBox="0 0 '+viewW+' '+viewH+'" xmlns="http://www.w3.org/2000/svg" role="img"><title>'+(opts.title||'diagram')+'</title>';
  s += '<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="var(--accent)"/></marker></defs>';
  const nmap = {}; nodes.forEach(n=>nmap[n.id]=n);
  edges.forEach(e=>{
    const a = nmap[e.from], b = nmap[e.to];
    if(!a || !b) return;
    const ax = a.x + a.w/2, ay = a.y + a.h/2, bx = b.x + b.w/2, by = b.y + b.h/2;
    let sx, sy, exx, exy;
    if (Math.abs(ax-bx) >= Math.abs(ay-by)) {
      sx = ax < bx ? a.x+a.w : a.x; sy = ay;
      exx = ax < bx ? b.x : b.x+b.w; exy = by;
    } else {
      sx = ax; sy = ay < by ? a.y+a.h : a.y;
      exx = bx; exy = ay < by ? b.y : b.y+b.h;
    }
    s += '<line x1="'+sx+'" y1="'+sy+'" x2="'+exx+'" y2="'+exy+'" stroke="var(--accent)" stroke-width="1.6" ' +
      (e.dashed ? 'stroke-dasharray="4 4" ' : '') + 'marker-end="url(#arrow)" opacity="0.85"/>';
    if(e.label){
      s += '<text x="'+((sx+exx)/2)+'" y="'+((sy+exy)/2 - 8)+'" text-anchor="middle" class="dedge-label">'+e.label+'</text>';
    }
  });
  nodes.forEach(n=>{
    s += '<rect x="'+n.x+'" y="'+n.y+'" width="'+n.w+'" height="'+n.h+'" rx="14" fill="'+fillFor(n.variant)+'" stroke="'+colorFor(n.variant)+'" stroke-width="1.4"/>';
    const cx = n.x + n.w/2;
    if(n.sub){
      s += '<text x="'+cx+'" y="'+(n.y + n.h/2 - 4)+'" text-anchor="middle" class="dnode-label">'+n.label+'</text>';
      s += '<text x="'+cx+'" y="'+(n.y + n.h/2 + 15)+'" text-anchor="middle" class="dnode-sub">'+n.sub+'</text>';
    } else {
      s += '<text x="'+cx+'" y="'+(n.y + n.h/2 + 5)+'" text-anchor="middle" class="dnode-label">'+n.label+'</text>';
    }
  });
  s += '</svg>';
  return s;
}

function codePanel(fname, codeHtml){
  const id = 'code_' + Math.random().toString(36).slice(2,9);
  return '<div class="code-card"><div class="code-head"><span class="fname">'+fname+'</span>' +
    '<button class="copy-btn" onclick="copyCode(this,\''+id+'\')">Copy</button></div>' +
    '<pre class="code" id="'+id+'">'+codeHtml+'</pre></div>';
}
function copyCode(btn, id){
  const el = document.getElementById(id);
  const text = el.innerText;
  navigator.clipboard && navigator.clipboard.writeText(text).catch(()=>{});
  const original = btn.textContent;
  btn.textContent = 'Copied!'; btn.classList.add('copied');
  setTimeout(()=>{ btn.textContent = original; btn.classList.remove('copied'); }, 1400);
}

// ---------- render & navigation ----------
const deck = document.getElementById('deck');
let current = 0;

function renderSlide(s){
  const el = document.createElement('div');
  el.className = 'slide';
  el.innerHTML = '<div class="eyebrow">' + s.eyebrow + '</div>' +
    '<h2 class="title">' + s.title + '</h2>' +
    '<div class="content' + (s.scroll ? ' scrollable' : '') + '">' + s.html + '</div>';
  return el;
}

const slideEls = slides.map(renderSlide);
slideEls.forEach(el => deck.appendChild(el));

function updateChrome(){
  document.getElementById('counter').textContent = (current+1) + ' / ' + slides.length;
  document.getElementById('progress-fill').style.width = ((current+1)/slides.length*100) + '%';
}

function goTo(idx, dir){
  if (idx < 0 || idx >= slides.length || idx === current) return;
  const prevEl = slideEls[current];
  const nextEl = slideEls[idx];
  prevEl.classList.remove('active');
  prevEl.classList.add(dir === 'next' ? 'exit-left' : 'exit-right');
  nextEl.classList.remove('exit-left','exit-right');
  // force reflow so the transition applies from the offset start position
  void nextEl.offsetWidth;
  nextEl.classList.add('active');
  setTimeout(()=>{ prevEl.classList.remove('exit-left','exit-right'); }, 380);
  current = idx;
  updateChrome();
}

slideEls[0].classList.add('active');
updateChrome();

function next(){ goTo(current+1, 'next'); }
function prev(){ goTo(current-1, 'prev'); }

// keyboard
window.addEventListener('keydown', (e)=>{
  const overlay = document.getElementById('shortcuts-overlay');
  if (e.key === '?'){ overlay.classList.toggle('show'); return; }
  if (overlay.classList.contains('show')){
    if (e.key === 'Escape') overlay.classList.remove('show');
    return;
  }
  if (e.key === 'ArrowRight' || e.key === 'PageDown'){ next(); }
  else if (e.key === 'ArrowLeft' || e.key === 'PageUp'){ prev(); }
  else if (e.key === 'Home'){ goTo(0, 'prev'); }
  else if (e.key === 'End'){ goTo(slides.length-1, 'next'); }
});

// right-click / left-click to advance (left click free for buttons/selection: only advance on background clicks)
deck.addEventListener('contextmenu', (e)=>{ e.preventDefault(); next(); });
deck.addEventListener('click', (e)=>{
  const interactive = e.target.closest('button, a, .copy-btn');
  if (interactive) return;
  // only treat plain background clicks (not text selection) as navigation
  const sel = window.getSelection();
  if (sel && sel.toString().length > 0) return;
});

// mouse4 / mouse3 side buttons - block browser back/forward, use for nav
window.addEventListener('mousedown', (e)=>{
  if (e.button === 3 || e.button === 4){
    e.preventDefault();
    e.stopImmediatePropagation();
  }
}, true);
window.addEventListener('mouseup', (e)=>{
  if (e.button === 3){ e.preventDefault(); e.stopImmediatePropagation(); prev(); }
  else if (e.button === 4){ e.preventDefault(); e.stopImmediatePropagation(); next(); }
}, true);
window.addEventListener('popstate', ()=>{ history.pushState(null, '', location.href); });
history.pushState(null, '', location.href);

// swipe
let touchStartX = null;
deck.addEventListener('touchstart', (e)=>{ touchStartX = e.changedTouches[0].clientX; }, {passive:true});
deck.addEventListener('touchend', (e)=>{
  if (touchStartX === null) return;
  const dx = e.changedTouches[0].clientX - touchStartX;
  if (Math.abs(dx) > 50){ dx < 0 ? next() : prev(); }
  touchStartX = null;
}, {passive:true});

// close shortcuts overlay on outside click
document.getElementById('shortcuts-overlay').addEventListener('click', (e)=>{
  if (e.target.id === 'shortcuts-overlay') e.target.classList.remove('show');
});
</script>
