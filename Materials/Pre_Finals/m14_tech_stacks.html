<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>Tech Stacks: What They Are &amp; How They Work &mdash; M14</title>
<style>
  :root{
    --bg:#1b1e25;
    --surface:#20242c;
    --surface-2:#252a33;
    --shadow-d:#121419;
    --shadow-l:#2e3441;
    --text:#f2f4f9;
    --text-dim:#cdd2df;
    --text-faint:#9aa3b5;
    --accent:#53e6c9;
    --accent-soft:rgba(83,230,201,0.14);
    --accent-2:#f5ac4d;
    --accent-2-soft:rgba(245,172,77,0.14);
    --accent-3:#7f9cf5;
    --accent-3-soft:rgba(127,156,245,0.14);
    --danger:#ef6a76;
    --danger-soft:rgba(239,106,118,0.14);
    --radius-lg:24px;
    --radius-md:18px;
    --radius-sm:12px;
    --font-display:"Segoe UI",ui-sans-serif,system-ui,-apple-system,sans-serif;
    --font-body:"Segoe UI",ui-sans-serif,system-ui,-apple-system,sans-serif;
    --font-mono:ui-monospace,"Cascadia Mono","SFMono-Regular",Consolas,Menlo,monospace;
  }
  *{box-sizing:border-box;}
  svg{ width:28px; height:28px; display:block; flex-shrink:0; }
  .diagram-wrap svg{ width:100% !important; height:100% !important; max-height:100%; }
  html,body{
    margin:0;padding:0;height:100%;
    background:var(--bg);
    color:var(--text);
    font-family:var(--font-body);
    overflow:hidden;
    -webkit-font-smoothing:antialiased;
  }
  body{
    background-image:
      radial-gradient(1200px 700px at 12% -8%, rgba(83,230,201,0.06), transparent 60%),
      radial-gradient(1000px 650px at 100% 110%, rgba(127,156,245,0.06), transparent 60%);
  }
  ::selection{ background:var(--accent); color:#0c1210; }

  #deck{ position:relative; width:100vw; height:100vh; overflow:hidden; }

  .slide{
    position:absolute; inset:0;
    display:flex; flex-direction:column;
    padding:56px 88px 92px;
    opacity:0; pointer-events:none;
    transform:translateX(40px);
    transition:opacity 350ms ease, transform 350ms ease;
  }
  .slide.active{ opacity:1; pointer-events:auto; transform:translateX(0); }
  .slide.exit-left{ transform:translateX(-40px); }
  .slide.exit-right{ transform:translateX(40px); }

  @media (prefers-reduced-motion: reduce){
    .slide{ transition:opacity 1ms linear; transform:none !important; }
  }

  .eyebrow{
    font-size:17px; letter-spacing:.14em; text-transform:uppercase;
    color:var(--accent); font-weight:700; margin:0 0 10px;
    display:flex; align-items:center; gap:10px;
  }
  .eyebrow::before{
    content:""; width:22px; height:2px; background:var(--accent); border-radius:2px; display:inline-block;
  }
  .title{
    font-family:var(--font-display);
    font-size:40px; line-height:1.15; font-weight:750; margin:0 0 22px;
    letter-spacing:-0.01em;
    color:var(--text);
  }
  .subtitle{ font-size:20px; color:var(--text-dim); margin:-14px 0 22px; font-weight:400; }
  .content{ flex:1; min-height:0; display:flex; flex-direction:column; overflow-y:auto; overflow-x:hidden; padding-right:6px; }
  .content::-webkit-scrollbar{ width:8px; }
  .content::-webkit-scrollbar-thumb{ background:var(--surface-2); border-radius:8px; }

  .card{
    background:var(--surface);
    border-radius:var(--radius-md);
    box-shadow:9px 9px 18px var(--shadow-d), -9px -9px 18px var(--shadow-l);
    padding:22px 24px;
  }
  .card-flat{ background:var(--surface); border-radius:var(--radius-sm); padding:16px 18px; }
  .inset{
    background:var(--surface);
    border-radius:var(--radius-md);
    box-shadow:inset 6px 6px 12px var(--shadow-d), inset -6px -6px 12px var(--shadow-l);
    padding:18px 20px;
  }
  .badge{
    display:inline-flex; align-items:center; gap:8px;
    background:var(--surface); border-radius:999px; padding:8px 16px;
    font-size:17px; font-weight:600; color:var(--text-dim);
    box-shadow:5px 5px 10px var(--shadow-d), -5px -5px 10px var(--shadow-l);
  }
  .badge .dot{ width:8px; height:8px; border-radius:50%; background:var(--accent); flex-shrink:0; }

  h3.h{ font-size:21px; font-weight:700; margin:0 0 12px; color:var(--text); }
  p{ font-size:18px; line-height:1.65; color:var(--text-dim); margin:0 0 10px; }
  strong{ color:var(--text); font-weight:700; }
  ul.list, ol.list{ margin:0; padding-left:20px; }
  ul.list li, ol.list li{ font-size:18px; line-height:1.6; color:var(--text-dim); margin-bottom:8px; }
  ul.list li::marker{ color:var(--accent); }
  .muted{ color:var(--text-faint); font-size:17px; }

  .grid{ display:grid; gap:20px; min-height:0; }
  .grid-2{ grid-template-columns:1fr 1fr; }
  .grid-3{ grid-template-columns:repeat(auto-fit, minmax(230px, 1fr)); }
  .grid-4{ grid-template-columns:repeat(auto-fit, minmax(200px, 1fr)); }
  .stack{ display:flex; flex-direction:column; gap:16px; min-height:0; }
  .row{ display:flex; gap:16px; align-items:stretch; min-height:0; }

  /* table */
  table.tbl{ width:100%; border-collapse:separate; border-spacing:0; font-size:17px; }
  table.tbl th{
    text-align:left; color:var(--accent); font-size:15px; letter-spacing:.05em; text-transform:uppercase;
    padding:10px 14px; font-weight:700; background:var(--surface-2); border-bottom:2px solid var(--bg);
  }
  table.tbl th:first-child{ border-top-left-radius:12px; }
  table.tbl th:last-child{ border-top-right-radius:12px; }
  table.tbl td{ padding:11px 14px; color:var(--text-dim); border-bottom:1px solid var(--surface-2); vertical-align:top; line-height:1.55; font-size:17px; }
  table.tbl tr:last-child td{ border-bottom:none; }
  table.tbl td strong{ color:var(--text); }

  /* icon chips */
  .icon-row{ display:flex; flex-wrap:wrap; gap:14px; }
  .icon-chip{
    display:flex; align-items:center; gap:10px;
    background:var(--surface); border-radius:14px; padding:10px 16px 10px 12px;
    box-shadow:6px 6px 12px var(--shadow-d), -6px -6px 12px var(--shadow-l);
    font-size:17px; font-weight:600; color:var(--text-dim);
  }
  .icon-chip svg{ width:26px; height:26px; flex-shrink:0; }

  /* stack layer pill */
  .layer-pill{
    display:flex; align-items:center; gap:14px;
    background:var(--surface); border-radius:var(--radius-sm);
    box-shadow:inset 5px 5px 10px var(--shadow-d), inset -5px -5px 10px var(--shadow-l);
    padding:12px 18px;
  }
  .layer-pill .licon{ width:36px; height:36px; border-radius:10px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .layer-pill .ltitle{ font-size:17px; font-weight:700; color:var(--text); line-height:1.2; }
  .layer-pill .lsub{ font-size:17px; color:var(--text-dim); }

  /* stack card header */
  .stack-header{
    display:flex; align-items:center; gap:16px; margin-bottom:16px;
  }
  .stack-badge{
    font-size:17px; font-weight:700; letter-spacing:.08em; text-transform:uppercase;
    padding:5px 12px; border-radius:999px;
  }
  .stack-acronym{
    font-size:28px; font-weight:800; letter-spacing:-.02em;
  }

  /* diagram wrapper */
  .diagram-wrap{
    background:var(--surface); border-radius:var(--radius-md);
    box-shadow:9px 9px 18px var(--shadow-d), -9px -9px 18px var(--shadow-l);
    padding:18px; overflow:hidden; display:flex; align-items:center; justify-content:center;
    min-height:220px; flex:1;
  }
  .diagram-wrap svg{ width:100% !important; height:100% !important; max-height:100%; }

  /* activities */
  .qcard{ background:var(--surface); border-radius:var(--radius-md); padding:18px 20px;
    box-shadow:7px 7px 14px var(--shadow-d), -7px -7px 14px var(--shadow-l); }
  .qcard .qnum{ display:inline-flex; align-items:center; justify-content:center; width:30px; height:30px;
    border-radius:50%; background:var(--accent-soft); color:var(--accent); font-weight:700; font-size:17px; margin-right:10px; }
  .qcard .qtext{ font-size:18px; font-weight:600; color:var(--text); display:inline; }
  .qcard .opts{ margin:12px 0 0 36px; padding:0; list-style:none; }
  .qcard .opts li{ font-size:17px; color:var(--text-dim); margin-bottom:6px; }
  .qcard .opts li .optlet{ color:var(--accent-2); font-weight:700; margin-right:6px; }
  .qcard.answer{ display:flex; align-items:flex-start; gap:14px; }
  .qcard .ans-badge{ flex-shrink:0; background:var(--accent-soft); color:var(--accent); font-weight:700;
    font-size:17px; padding:6px 12px; border-radius:10px; white-space:nowrap; }

  /* footer chrome */
  .chrome{ position:absolute; left:0; right:0; bottom:0; padding:14px 88px 20px; display:flex; flex-direction:column; gap:10px; z-index:20; background:linear-gradient(0deg, var(--bg) 60%, transparent); }
  .progress-track{ width:100%; height:4px; border-radius:4px; background:var(--surface);
    box-shadow:inset 2px 2px 4px var(--shadow-d), inset -2px -2px 4px var(--shadow-l); overflow:hidden; }
  .progress-fill{ height:100%; background:var(--accent); border-radius:4px; transition:width 300ms ease; }
  .chrome-row{ display:flex; align-items:center; justify-content:space-between; }
  .counter{ font-size:17px; color:var(--text-faint); font-variant-numeric:tabular-nums; }
  .hint{ font-size:17px; color:var(--text-faint); display:flex; gap:14px; }
  .hint kbd{ font-family:var(--font-mono); background:var(--surface); padding:2px 7px; border-radius:6px;
    box-shadow:3px 3px 6px var(--shadow-d), -3px -3px 6px var(--shadow-l); font-size:15px; color:var(--text-dim); }

  /* shortcuts overlay */
  #shortcuts-overlay{ position:fixed; inset:0; background:rgba(10,11,14,0.72); backdrop-filter:blur(3px);
    display:flex; align-items:center; justify-content:center; z-index:100; opacity:0; pointer-events:none; transition:opacity 200ms ease; }
  #shortcuts-overlay.show{ opacity:1; pointer-events:auto; }
  #shortcuts-overlay .panel{ background:var(--surface); border-radius:var(--radius-lg); padding:36px 40px;
    box-shadow:14px 14px 28px var(--shadow-d), -14px -14px 28px var(--shadow-l); max-width:480px; width:90%; }
  #shortcuts-overlay h4{ margin:0 0 18px; font-size:20px; color:var(--text); font-family:var(--font-display); }
  #shortcuts-overlay .srow{ display:flex; justify-content:space-between; padding:10px 0; border-bottom:1px solid var(--surface-2); font-size:17px; color:var(--text-dim); }
  #shortcuts-overlay .srow:last-child{ border-bottom:none; }

  @media (max-width: 1150px){
    .slide{ padding:44px 48px 84px; }
    .title{ font-size:33px; }
    .icon-chip{ font-size:17px; padding:8px 12px; }
  }
  @media (max-width: 900px){
    .slide{ padding:38px 26px 78px; }
    .title{ font-size:28px; }
    .grid-2{ grid-template-columns:1fr; }
    .row{ flex-direction:column; }
    .chrome{ padding:0 26px 14px; }
    .hint{ display:none; }
  }
  @media (max-height: 720px){
    .slide{ padding-top:34px; padding-bottom:70px; }
    .title{ font-size:30px; margin-bottom:14px; }
  }
</style>
</head>
<body>

<div id="deck"></div>

<div class="chrome">
  <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
  <div class="chrome-row">
    <div class="counter" id="counter">1 / 1</div>
    <div class="hint">
      <span><kbd>&#8592;</kbd> <kbd>&#8594;</kbd> navigate</span>
      <span><kbd>Home</kbd> <kbd>End</kbd> jump</span>
      <span><kbd>?</kbd> shortcuts</span>
    </div>
  </div>
</div>

<div id="shortcuts-overlay">
  <div class="panel">
    <h4>Keyboard &amp; mouse shortcuts</h4>
    <div class="srow"><span>Next slide</span><span>&#8594; / Right-click / Mouse4</span></div>
    <div class="srow"><span>Previous slide</span><span>&#8592; / Mouse3</span></div>
    <div class="srow"><span>First / last slide</span><span>Home / End</span></div>
    <div class="srow"><span>Toggle this panel</span><span>?</span></div>
    <div class="srow"><span>Swipe</span><span>Left / Right on mobile</span></div>
  </div>
</div>

<script>
// ---------- icons ----------
const ICONS = {
  layers:   '<svg viewBox="0 0 24 24" fill="none"><path d="M12 2 2 7l10 5 10-5-10-5Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M2 12l10 5 10-5" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M2 17l10 5 10-5" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>',
  server:   '<svg viewBox="0 0 24 24" fill="none"><rect x="3" y="3" width="18" height="7" rx="2" stroke="currentColor" stroke-width="1.6"/><rect x="3" y="14" width="18" height="7" rx="2" stroke="currentColor" stroke-width="1.6"/><circle cx="7" cy="6.5" r="1" fill="currentColor"/><circle cx="7" cy="17.5" r="1" fill="currentColor"/></svg>',
  db:       '<svg viewBox="0 0 24 24" fill="none"><ellipse cx="12" cy="5" rx="8" ry="3" stroke="currentColor" stroke-width="1.6"/><path d="M4 5v14c0 1.66 3.58 3 8 3s8-1.34 8-3V5" stroke="currentColor" stroke-width="1.6"/><path d="M4 12c0 1.66 3.58 3 8 3s8-1.34 8-3" stroke="currentColor" stroke-width="1.6"/></svg>',
  cloud:    '<svg viewBox="0 0 24 24" fill="none"><path d="M7 18a4.5 4.5 0 0 1-.5-8.97A5.5 5.5 0 0 1 17.2 8.1 4 4 0 0 1 17 18H7Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>',
  bolt:     '<svg viewBox="0 0 24 24" fill="none"><path d="M13 2 3 14h7l-1 8 10-12h-7l1-8Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>',
  gear:     '<svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="3.2" stroke="currentColor" stroke-width="1.6"/><path d="M19.4 13.5c.1-.5.1-1 0-1.5l1.9-1.3-2-3.5-2.2.8a7.4 7.4 0 0 0-1.3-.8L15.5 5h-4l-.3 2.2c-.5.2-.9.5-1.3.8l-2.2-.8-2 3.5L7.6 12c-.1.5-.1 1 0 1.5l-1.9 1.3 2 3.5 2.2-.8c.4.3.8.6 1.3.8l.3 2.2h4l.3-2.2c.5-.2.9-.5 1.3-.8l2.2.8 2-3.5-1.9-1.3Z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>',
  code:     '<svg viewBox="0 0 24 24" fill="none"><path d="M16 18l6-6-6-6M8 6l-6 6 6 6" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  mobile:   '<svg viewBox="0 0 24 24" fill="none"><rect x="5" y="2" width="14" height="20" rx="3" stroke="currentColor" stroke-width="1.6"/><circle cx="12" cy="18" r="1" fill="currentColor"/></svg>',
  chart:    '<svg viewBox="0 0 24 24" fill="none"><path d="M4 20V10M11 20V4M18 20v-7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>',
  shield:   '<svg viewBox="0 0 24 24" fill="none"><path d="M12 2 4 5v6c0 5 3.4 8.7 8 11 4.6-2.3 8-6 8-11V5l-8-3Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>',
  spark:    '<svg viewBox="0 0 24 24" fill="none"><path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>',
  map:      '<svg viewBox="0 0 24 24" fill="none"><path d="M9 3L3 6v15l6-3 6 3 6-3V3l-6 3-6-3Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M9 3v15M15 6v15" stroke="currentColor" stroke-width="1.4"/></svg>',
  quote:    '<svg viewBox="0 0 24 24" fill="none"><path d="M3 21c3 0 7-1 7-8V5c0-1.25-.756-2.017-2-2H4c-1.25 0-2 .75-2 1.972V11c0 1.25.75 2 2 2 1 0 1 0 1 1v1c0 1-1 2-2 2s-1 .008-1 1.031V20c0 1 0 1 1 1Zm12 0c3 0 7-1 7-8V5c0-1.25-.757-2.017-2-2h-4c-1.25 0-2 .75-2 1.972V11c0 1.25.75 2 2 2 1 0 1 0 1 1v1c0 1-1 2-2 2s-1 .008-1 1.031V20c0 1 0 1 1 1Z" stroke="currentColor" stroke-width="1.6"/></svg>',
  celebrate:'<svg viewBox="0 0 24 24" fill="none"><path d="M4 20 15 9M4 20l3-9 8 3-3 9-8-3Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="M15 5l.6 1.7L17.3 7l-1.7.6L15 9.3l-.6-1.7L12.7 7l1.7-.3L15 5ZM20 3v3M18.5 4.5h3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>',
  check:    '<svg viewBox="0 0 24 24" fill="none"><path d="M20 6 9 17l-5-5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  people:   '<svg viewBox="0 0 24 24" fill="none"><circle cx="9" cy="7" r="4" stroke="currentColor" stroke-width="1.6"/><path d="M3 21v-2a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4v2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><path d="M16 3.13a4 4 0 0 1 0 7.75M21 21v-2a4 4 0 0 0-3-3.87" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>',
};
function icon(name){ return ICONS[name] || ''; }
function chip(icn, label, color){
  return `<div class="icon-chip"><span style="color:${color||'var(--accent)'}">${icon(icn)}</span><span>${label}</span></div>`;
}

function table(headers, rows){
  let h = '<table class="tbl"><thead><tr>' + headers.map(x=>'<th>'+x+'</th>').join('') + '</tr></thead><tbody>';
  rows.forEach(r=>{ h += '<tr>' + r.map(c=>'<td>'+c+'</td>').join('') + '</tr>'; });
  h += '</tbody></table>';
  return h;
}

// stack layer diagram — vertical layers with labels
function stackDiagram(layers){
  // layers: [{label, sub, color}]
  const W=280, rowH=54, gap=10, padY=10;
  const H = layers.length*(rowH+gap) + padY*2 - gap;
  let svg = `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">`;
  svg += `<defs><marker id="arrd" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto"><path d="M0,0 L6,3.5 L0,7 Z" fill="#9aa3b5" opacity=".7"/></marker></defs>`;
  layers.forEach((l,i)=>{
    const y = padY + i*(rowH+gap);
    // resolve colour — text-faint layers get a visible slate instead
    const resolvedColor = l.color === 'var(--text-faint)' ? '#b0b8cc' : l.color;
    const fillColor = resolvedColor
      .replace('var(--accent)','rgba(83,230,201,0.15)')
      .replace('var(--accent-2)','rgba(245,172,77,0.15)')
      .replace('var(--accent-3)','rgba(127,156,245,0.15)')
      .replace('var(--danger)','rgba(239,106,118,0.13)')
      .replace('#b0b8cc','rgba(176,184,204,0.12)');
    const strokeColor = resolvedColor
      .replace('var(--accent)','#53e6c9')
      .replace('var(--accent-2)','#f5ac4d')
      .replace('var(--accent-3)','#7f9cf5')
      .replace('var(--danger)','#ef6a76');
    svg += `<rect x="10" y="${y}" width="${W-20}" height="${rowH}" rx="12" fill="${fillColor}" stroke="${strokeColor}" stroke-width="1.6"/>`;
    if(l.sub){
      svg += `<text x="${W/2}" y="${y+rowH/2-4}" text-anchor="middle" font-size="15" font-weight="700" fill="${strokeColor}" font-family="Segoe UI,sans-serif">${l.label}</text>`;
      svg += `<text x="${W/2}" y="${y+rowH/2+14}" text-anchor="middle" font-size="13" fill="#b0b8cc" font-family="Segoe UI,sans-serif">${l.sub}</text>`;
    } else {
      svg += `<text x="${W/2}" y="${y+rowH/2+6}" text-anchor="middle" font-size="15" font-weight="700" fill="${strokeColor}" font-family="Segoe UI,sans-serif">${l.label}</text>`;
    }
    if(i < layers.length-1){
      const ay = y+rowH+2;
      svg += `<line x1="${W/2}" y1="${ay}" x2="${W/2}" y2="${ay+gap-2}" stroke="#9aa3b5" stroke-width="1.4" opacity=".6" marker-end="url(#arrd)"/>`;
    }
  });
  svg += '</svg>';
  return svg;
}

// ---------- SLIDES ----------
const slides = [];

// 1. Cover
slides.push({
  eyebrow: 'Integrative Programming &mdash; Reference Notes &middot; M14',
  title: 'Tech Stacks: What They Are &amp; How They Work',
  html: `
    <div class="stack" style="justify-content:center;flex:1;gap:26px">
      <p class="subtitle" style="margin:0;max-width:680px">A tech stack is the combination of technologies, frameworks, and tools used to build and run an application. This module breaks down the most common stacks you'll encounter in the real world.</p>
      <div class="icon-row">
        ${chip('layers','Core Layers')}
        ${chip('code','Full-Stack Combos','var(--accent-3)')}
        ${chip('mobile','Mobile Stacks','var(--accent-2)')}
        ${chip('cloud','DevOps &amp; Data','var(--danger)')}
        ${chip('map','How to Choose','var(--accent)')}
        ${chip('check','Activities','var(--text-faint)')}
      </div>
    </div>
  `
});

// 2. Glossary
slides.push({
  eyebrow: 'Before We Start',

    ${table(

      [
        ['<strong>Tech Stack</strong>','The full set of technologies used to build and run an application — frontend, backend, database, and infra combined.'],
        ['<strong>Frontend</strong>','The client-side layer: what the user sees and interacts with in the browser or app.'],
        ['<strong>Backend</strong>','The server-side layer: handles business logic, authentication, APIs, and data processing.'],
        ['<strong>Database</strong>','Where data is stored and retrieved. Can be relational (SQL) or non-relational (NoSQL).'],
        ['<strong>Runtime</strong>','The environment that executes code. Node.js is a runtime that lets JavaScript run on the server.'],
        ['<strong>Framework</strong>','A pre-built structure that provides rules and tools for building apps faster (e.g. Django, Rails, Express).'],
        ['<strong>API</strong>','Application Programming Interface — a contract for how two systems communicate, usually over HTTP.'],
        ['<strong>SPA</strong>','Single Page Application — a web app that loads once and updates dynamically without full page reloads.'],
        ['<strong>ORM</strong>','Object-Relational Mapper — lets you query a database using code instead of raw SQL (e.g. Prisma, Sequelize).'],
        ['<strong>Opinionated</strong>','A framework that enforces a specific way of doing things (e.g. Rails, Django). Opposite: flexible/un-opinionated (e.g. Express).'],
        ['<strong>MVP</strong>','Minimum Viable Product — the simplest version of a product that can be shipped and tested.'],
        ['<strong>SaaS</strong>','Software as a Service — software delivered over the internet on a subscription basis (e.g. Spotify, Notion).'],
      ]
    )}
  `
});

        <div class="qcard answer"><span class="ans-badge" style="background:var(--accent-2-soft);color:var(--accent-2)">SC 10</span><span style="font-size:17px;color:var(--text-dim)"><strong style="color:var(--text)">Rails or Django</strong> — both are opinionated, convention-first frameworks built for rapid solo/small-team SaaS development.</span></div>
      </div>
    </div>
  `
});

// 26. Closing
slides.push({
  eyebrow: 'Closing',
  title: 'Stack Smart, Not Stack Trendy',
  html: `
    <div class="stack" style="flex:1;justify-content:center;align-items:center;text-align:center;gap:20px">
      <div style="color:var(--accent-2)">${icon('celebrate')}</div>
      <div class="card" style="max-width:620px;padding:32px 40px">
        <div style="color:var(--accent);display:flex;justify-content:center;margin-bottom:16px">${icon('quote')}</div>
        <p style="font-size:21px;color:var(--text);line-height:1.5;margin-bottom:14px">"The best tech stack is the one your team can build, ship, and maintain confidently &mdash; not the one with the most GitHub stars."</p>
        <p class="muted" style="margin:0">A principle worth remembering every time a shiny new framework shows up on your feed.</p>
      </div>
      <p class="muted" style="max-width:540px">No single stack wins every category. The skill is knowing what each one is good at, and matching it to what your project actually needs. You now have that map.</p>
    </div>
  `
});

// ---------- render & navigation ----------
const deck = document.getElementById('deck');
let current = 0;

function renderSlide(s){
  const el = document.createElement('div');
  el.className = 'slide';
  el.innerHTML = '<div class="eyebrow">' + s.eyebrow + '</div>' +
    '<h2 class="title">' + s.title + '</h2>' +
    '<div class="content' + (s.scroll ? ' scrollable' : '') + '">' + s.html + '</div>';
  return el;
}

const slideEls = slides.map(renderSlide);
slideEls.forEach(el => deck.appendChild(el));

function updateChrome(){
  document.getElementById('counter').textContent = (current+1) + ' / ' + slides.length;
  document.getElementById('progress-fill').style.width = ((current+1)/slides.length*100) + '%';
}

function goTo(idx, dir){
  if (idx < 0 || idx >= slides.length || idx === current) return;
  const prevEl = slideEls[current];
  const nextEl = slideEls[idx];
  prevEl.classList.remove('active');
  prevEl.classList.add(dir === 'next' ? 'exit-left' : 'exit-right');
  nextEl.classList.remove('exit-left','exit-right');
  void nextEl.offsetWidth;
  nextEl.classList.add('active');
  setTimeout(()=>{ prevEl.classList.remove('exit-left','exit-right'); }, 380);
  current = idx;
  updateChrome();
}

slideEls[0].classList.add('active');
updateChrome();

function next(){ goTo(current+1, 'next'); }
function prev(){ goTo(current-1, 'prev'); }

window.addEventListener('keydown', (e)=>{
  const overlay = document.getElementById('shortcuts-overlay');
  if (e.key === '?'){ overlay.classList.toggle('show'); return; }
  if (overlay.classList.contains('show')){
    if (e.key === 'Escape') overlay.classList.remove('show');
    return;
  }
  if (e.key === 'ArrowRight' || e.key === 'PageDown'){ next(); }
  else if (e.key === 'ArrowLeft' || e.key === 'PageUp'){ prev(); }
  else if (e.key === 'Home'){ goTo(0, 'prev'); }
  else if (e.key === 'End'){ goTo(slides.length-1, 'next'); }
});

deck.addEventListener('contextmenu', (e)=>{ e.preventDefault(); next(); });
deck.addEventListener('click', (e)=>{
  const interactive = e.target.closest('button, a, .copy-btn');
  if (interactive) return;
  const sel = window.getSelection();
  if (sel && sel.toString().length > 0) return;
});

window.addEventListener('mousedown', (e)=>{
  if (e.button === 3 || e.button === 4){ e.preventDefault(); e.stopImmediatePropagation(); }
}, true);
window.addEventListener('mouseup', (e)=>{
  if (e.button === 3){ e.preventDefault(); e.stopImmediatePropagation(); prev(); }
  else if (e.button === 4){ e.preventDefault(); e.stopImmediatePropagation(); next(); }
}, true);
window.addEventListener('popstate', ()=>{ history.pushState(null, '', location.href); });
history.pushState(null, '', location.href);

let touchStartX = null;
deck.addEventListener('touchstart', (e)=>{ touchStartX = e.changedTouches[0].clientX; }, {passive:true});
deck.addEventListener('touchend', (e)=>{
  if (touchStartX === null) return;
  const dx = e.changedTouches[0].clientX - touchStartX;
  if (Math.abs(dx) > 50){ dx < 0 ? next() : prev(); }
  touchStartX = null;
}, {passive:true});

document.getElementById('shortcuts-overlay').addEventListener('click', (e)=>{
  if (e.target.id === 'shortcuts-overlay') e.target.classList.remove('show');
});
</script>
