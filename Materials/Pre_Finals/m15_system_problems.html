<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>Common Backend, API &amp; Server Problems — M15</title>
<style>
  :root{
    --bg:#0e1014;
    --surface:#161a20;
    --surface-2:#1c2028;
    --surface-3:#222730;
    --shadow-d:#08090b;
    --shadow-l:#222730;
    --text:#f0ede8;
    --text-dim:#c4bfb8;
    --text-faint:#7a7670;
    --accent:#f97316;
    --accent-soft:rgba(249,115,22,0.14);
    --accent-2:#fbbf24;
    --accent-2-soft:rgba(251,191,36,0.13);
    --good:#4ade80;
    --good-soft:rgba(74,222,128,0.12);
    --danger:#ef4444;
    --danger-soft:rgba(239,68,68,0.13);
    --radius-lg:22px;
    --radius-md:16px;
    --radius-sm:11px;
    --font-body:"Segoe UI",ui-sans-serif,system-ui,-apple-system,sans-serif;
    --font-mono:ui-monospace,"Cascadia Mono","SFMono-Regular",Consolas,Menlo,monospace;
  }
  *{ box-sizing:border-box; }
  html,body{
    margin:0; padding:0; height:100%;
    background:var(--bg);
    color:var(--text);
    font-family:var(--font-body);
    overflow:hidden;
    -webkit-font-smoothing:antialiased;
  }
  body{
    background-image:
      radial-gradient(900px 500px at 0% 0%, rgba(249,115,22,0.05), transparent 55%),
      radial-gradient(700px 400px at 100% 100%, rgba(251,191,36,0.04), transparent 55%);
  }
  ::selection{ background:var(--accent); color:#0e0a06; }

  /* ── layout ── */
  #deck{ position:relative; width:100vw; height:100vh; overflow:hidden; }
  .slide{
    position:absolute; inset:0;
    display:flex; flex-direction:column;
    padding:52px 84px 88px;
    opacity:0; pointer-events:none;
    transform:translateX(36px);
    transition:opacity 320ms ease, transform 320ms ease;
  }
  .slide.active{ opacity:1; pointer-events:auto; transform:translateX(0); }
  .slide.exit-left{ transform:translateX(-36px); }
  .slide.exit-right{ transform:translateX(36px); }
  @media (prefers-reduced-motion:reduce){
    .slide{ transition:opacity 1ms linear; transform:none !important; }
  }

  /* ── type ── */
  .eyebrow{
    font-size:13px; letter-spacing:.18em; text-transform:uppercase;
    color:var(--text-faint); font-weight:600; margin:0 0 12px;
    display:flex; align-items:center; gap:10px; font-family:var(--font-mono);
  }
  .eyebrow .emark{ color:var(--accent); font-size:16px; }
  .title{
    font-size:38px; line-height:1.15; font-weight:800; margin:0 0 20px;
    letter-spacing:-.02em; color:var(--text);
  }
  .title .hi{ color:var(--accent); }
  h3.h{ font-size:19px; font-weight:700; margin:0 0 10px; color:var(--text); }
  p{ font-size:17px; line-height:1.65; color:var(--text-dim); margin:0 0 10px; }
  strong{ color:var(--text); font-weight:700; }
  ul.list,ol.list{ margin:0; padding-left:20px; }
  ul.list li,ol.list li{ font-size:17px; line-height:1.6; color:var(--text-dim); margin-bottom:8px; }
  ul.list li::marker{ color:var(--accent); }
  .mono{ font-family:var(--font-mono); font-size:15px; color:var(--accent-2); }
  .muted{ color:var(--text-faint); font-size:16px; }

  /* ── content container ── */
  .content{ flex:1; min-height:0; display:flex; flex-direction:column; overflow-y:auto; overflow-x:hidden; padding-right:4px; }
  .content::-webkit-scrollbar{ width:6px; }
  .content::-webkit-scrollbar-thumb{ background:var(--surface-2); border-radius:6px; }

  /* ── layout helpers ── */
  .grid{ display:grid; gap:16px; min-height:0; }
  .grid-2{ grid-template-columns:1fr 1fr; }
  .grid-3{ grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); }
  .stack{ display:flex; flex-direction:column; gap:14px; min-height:0; }
  .row{ display:flex; gap:14px; align-items:stretch; min-height:0; }

  /* ── cards ── */
  .card{
    background:var(--surface);
    border-radius:var(--radius-md);
    box-shadow:8px 8px 16px var(--shadow-d), -4px -4px 10px var(--shadow-l);
    padding:20px 22px;
  }
  .card-border-accent{ border-left:3px solid var(--accent); }
  .card-border-good{ border-left:3px solid var(--good); }
  .card-border-danger{ border-left:3px solid var(--danger); }
  .inset{
    background:var(--surface);
    border-radius:var(--radius-sm);
    box-shadow:inset 5px 5px 10px var(--shadow-d), inset -3px -3px 8px var(--shadow-l);
    padding:14px 18px;
  }

  /* ── problem card ── */
  .prob-header{
    display:flex; align-items:center; gap:12px; margin-bottom:14px;
  }
  .prob-tag{
    font-family:var(--font-mono); font-size:12px; font-weight:700;
    letter-spacing:.1em; text-transform:uppercase;
    padding:4px 10px; border-radius:6px;
    background:var(--danger-soft); color:var(--danger); flex-shrink:0;
  }
  .prob-tag.api{ background:var(--accent-soft); color:var(--accent); }
  .prob-tag.server{ background:var(--accent-2-soft); color:var(--accent-2); }
  .prob-name{ font-size:21px; font-weight:800; color:var(--text); letter-spacing:-.01em; }

  /* ── fix vs broken ── */
  .two-state{ display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  .state-box{ border-radius:var(--radius-sm); padding:14px 16px; }
  .state-box.broken{ background:rgba(239,68,68,0.07); border:1px solid rgba(239,68,68,0.25); }
  .state-box.fixed{ background:rgba(74,222,128,0.06); border:1px solid rgba(74,222,128,0.2); }
  .state-label{ font-family:var(--font-mono); font-size:12px; font-weight:700; letter-spacing:.12em; text-transform:uppercase; margin-bottom:8px; }
  .state-label.broken{ color:var(--danger); }
  .state-label.fixed{ color:var(--good); }
  .state-box p{ font-size:16px; margin:0; color:var(--text-dim); line-height:1.55; }

  /* ── code block ── */
  .code-block{
    background:var(--surface-3); border-radius:var(--radius-sm);
    border:1px solid rgba(249,115,22,0.15);
    padding:14px 16px; font-family:var(--font-mono);
    font-size:14px; line-height:1.7; color:var(--text-dim);
    overflow-x:auto; white-space:pre;
  }
  .code-block .c-bad{ color:var(--danger); }
  .code-block .c-good{ color:var(--good); }
  .code-block .c-comment{ color:var(--text-faint); }
  .code-block .c-key{ color:var(--accent); }
  .code-block .c-str{ color:var(--accent-2); }

  /* ── glossary table ── */
  table.tbl{ width:100%; border-collapse:separate; border-spacing:0; font-size:17px; }
  table.tbl th{
    text-align:left; color:var(--accent); font-size:14px; letter-spacing:.08em; text-transform:uppercase;
    padding:10px 14px; font-weight:700; background:var(--surface-2); border-bottom:2px solid var(--bg);
    font-family:var(--font-mono);
  }
  table.tbl th:first-child{ border-top-left-radius:10px; }
  table.tbl th:last-child{ border-top-right-radius:10px; }
  table.tbl td{ padding:11px 14px; color:var(--text-dim); border-bottom:1px solid var(--surface-2); vertical-align:top; line-height:1.55; font-size:17px; }
  table.tbl tr:last-child td{ border-bottom:none; }
  table.tbl td strong{ color:var(--text); }

  /* ── severity badge ── */
  .sev{ display:inline-flex; align-items:center; gap:6px; font-family:var(--font-mono); font-size:12px; font-weight:700; padding:3px 10px; border-radius:999px; letter-spacing:.06em; }
  .sev.critical{ background:var(--danger-soft); color:var(--danger); }
  .sev.high{ background:var(--accent-soft); color:var(--accent); }
  .sev.medium{ background:var(--accent-2-soft); color:var(--accent-2); }
  .sev::before{ content:"●"; font-size:10px; }

  /* ── bucket header ── */
  .bucket-divider{
    display:flex; align-items:center; gap:16px; margin-bottom:6px;
  }
  .bucket-label{
    font-family:var(--font-mono); font-size:13px; font-weight:700;
    letter-spacing:.14em; text-transform:uppercase;
    padding:5px 14px; border-radius:999px;
  }
  .bucket-label.db{ background:var(--danger-soft); color:var(--danger); }
  .bucket-label.api{ background:var(--accent-soft); color:var(--accent); }
  .bucket-label.server{ background:var(--accent-2-soft); color:var(--accent-2); }

  /* ── activities ── */
  .qcard{
    background:var(--surface); border-radius:var(--radius-md); padding:18px 20px;
    box-shadow:6px 6px 12px var(--shadow-d), -3px -3px 8px var(--shadow-l);
  }
  .qcard .qnum{
    display:inline-flex; align-items:center; justify-content:center;
    width:28px; height:28px; border-radius:50%;
    background:var(--accent-soft); color:var(--accent);
    font-weight:700; font-size:15px; margin-right:10px; font-family:var(--font-mono);
  }
  .qcard .qtext{ font-size:17px; font-weight:600; color:var(--text); display:inline; }
  .qcard .opts{ margin:12px 0 0 36px; padding:0; list-style:none; }
  .qcard .opts li{ font-size:17px; color:var(--text-dim); margin-bottom:6px; }
  .qcard .opts li .optlet{ color:var(--accent); font-weight:700; margin-right:6px; font-family:var(--font-mono); }
  .qcard.answer{ display:flex; align-items:flex-start; gap:12px; }
  .qcard .ans-badge{
    flex-shrink:0; background:var(--accent-soft); color:var(--accent);
    font-weight:700; font-size:15px; padding:5px 12px;
    border-radius:8px; white-space:nowrap; font-family:var(--font-mono);
  }

  /* ── footer chrome ── */
  .chrome{
    position:absolute; left:0; right:0; bottom:0;
    padding:12px 84px 18px; display:flex; flex-direction:column; gap:8px;
    z-index:20; background:linear-gradient(0deg, var(--bg) 55%, transparent);
  }
  .progress-track{
    width:100%; height:3px; border-radius:3px; background:var(--surface-2); overflow:hidden;
  }
  .progress-fill{ height:100%; background:var(--accent); border-radius:3px; transition:width 280ms ease; }
  .chrome-row{ display:flex; align-items:center; justify-content:space-between; }
  .counter{ font-size:14px; color:var(--text-faint); font-family:var(--font-mono); }
  .hint{ font-size:13px; color:var(--text-faint); display:flex; gap:14px; font-family:var(--font-mono); }
  .hint kbd{
    background:var(--surface-2); padding:2px 7px; border-radius:5px;
    font-size:12px; color:var(--text-dim); font-family:var(--font-mono);
  }

  /* ── shortcuts ── */
  #shortcuts-overlay{
    position:fixed; inset:0; background:rgba(6,7,9,0.78); backdrop-filter:blur(3px);
    display:flex; align-items:center; justify-content:center;
    z-index:100; opacity:0; pointer-events:none; transition:opacity 200ms ease;
  }
  #shortcuts-overlay.show{ opacity:1; pointer-events:auto; }
  #shortcuts-overlay .panel{
    background:var(--surface); border-radius:var(--radius-lg); padding:34px 38px;
    box-shadow:14px 14px 28px var(--shadow-d); max-width:460px; width:90%;
    border:1px solid var(--surface-3);
  }
  #shortcuts-overlay h4{ margin:0 0 16px; font-size:18px; color:var(--text); font-family:var(--font-mono); }
  #shortcuts-overlay .srow{
    display:flex; justify-content:space-between; padding:9px 0;
    border-bottom:1px solid var(--surface-2); font-size:15px; color:var(--text-dim);
  }
  #shortcuts-overlay .srow:last-child{ border-bottom:none; }

  @media(max-width:1100px){
    .slide{ padding:42px 44px 82px; }
    .title{ font-size:31px; }
    .two-state{ grid-template-columns:1fr; }
  }
  @media(max-width:860px){
    .slide{ padding:34px 22px 76px; }
    .title{ font-size:26px; }
    .grid-2{ grid-template-columns:1fr; }
    .row{ flex-direction:column; }
    .chrome{ padding:0 22px 12px; }
    .hint{ display:none; }
  }
  @media(max-height:700px){
    .slide{ padding-top:30px; padding-bottom:66px; }
    .title{ font-size:28px; margin-bottom:14px; }
  }
</style>
</head>
<body>

<div id="deck"></div>

<div class="chrome">
  <div class="progress-track"><div class="progress-fill" id="pf"></div></div>
  <div class="chrome-row">
    <div class="counter" id="ctr">1 / 1</div>
    <div class="hint">
      <span><kbd>←</kbd> <kbd>→</kbd> navigate</span>
      <span><kbd>Home</kbd> <kbd>End</kbd> jump</span>
      <span><kbd>?</kbd> shortcuts</span>
    </div>
  </div>
</div>

<div id="shortcuts-overlay">
  <div class="panel">
    <h4>// shortcuts</h4>
    <div class="srow"><span>Next slide</span><span>→ / right-click / Mouse4</span></div>
    <div class="srow"><span>Previous slide</span><span>← / Mouse3</span></div>
    <div class="srow"><span>First / last</span><span>Home / End</span></div>
    <div class="srow"><span>Toggle panel</span><span>?</span></div>
    <div class="srow"><span>Swipe</span><span>left / right on mobile</span></div>
  </div>
</div>

<script>
// ── icons ──
const IC = {
  db:     '<svg viewBox="0 0 24 24" fill="none" style="width:22px;height:22px"><ellipse cx="12" cy="5" rx="8" ry="3" stroke="currentColor" stroke-width="1.6"/><path d="M4 5v14c0 1.66 3.58 3 8 3s8-1.34 8-3V5" stroke="currentColor" stroke-width="1.6"/><path d="M4 12c0 1.66 3.58 3 8 3s8-1.34 8-3" stroke="currentColor" stroke-width="1.6"/></svg>',
  api:    '<svg viewBox="0 0 24 24" fill="none" style="width:22px;height:22px"><path d="M8 6H5a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h3M16 6h3a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2h-3M12 3v18M8 12h8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>',
  server: '<svg viewBox="0 0 24 24" fill="none" style="width:22px;height:22px"><rect x="3" y="3" width="18" height="7" rx="2" stroke="currentColor" stroke-width="1.6"/><rect x="3" y="14" width="18" height="7" rx="2" stroke="currentColor" stroke-width="1.6"/><circle cx="7" cy="6.5" r="1" fill="currentColor"/><circle cx="7" cy="17.5" r="1" fill="currentColor"/></svg>',
  warn:   '<svg viewBox="0 0 24 24" fill="none" style="width:22px;height:22px"><path d="M12 9v4M12 17h.01M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0Z" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  check:  '<svg viewBox="0 0 24 24" fill="none" style="width:22px;height:22px"><path d="M20 6 9 17l-5-5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  fix:    '<svg viewBox="0 0 24 24" fill="none" style="width:22px;height:22px"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76Z" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  bolt:   '<svg viewBox="0 0 24 24" fill="none" style="width:22px;height:22px"><path d="M13 2 3 14h7l-1 8 10-12h-7l1-8Z" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  clock:  '<svg viewBox="0 0 24 24" fill="none" style="width:22px;height:22px"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.6"/><path d="M12 7v5l3 3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>',
  key:    '<svg viewBox="0 0 24 24" fill="none" style="width:22px;height:22px"><circle cx="7.5" cy="15.5" r="5.5" stroke="currentColor" stroke-width="1.6"/><path d="m21 2-9.6 9.6M15 8l2 2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>',
  layers: '<svg viewBox="0 0 24 24" fill="none" style="width:22px;height:22px"><path d="M12 2 2 7l10 5 10-5-10-5Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M2 12l10 5 10-5M2 17l10 5 10-5" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>',
  quote:  '<svg viewBox="0 0 24 24" fill="none" style="width:28px;height:28px"><path d="M3 21c3 0 7-1 7-8V5c0-1.25-.756-2.017-2-2H4c-1.25 0-2 .75-2 1.972V11c0 1.25.75 2 2 2 1 0 1 0 1 1v1c0 1-1 2-2 2s-1 .008-1 1.031V20c0 1 0 1 1 1Zm12 0c3 0 7-1 7-8V5c0-1.25-.757-2.017-2-2h-4c-1.25 0-2 .75-2 1.972V11c0 1.25.75 2 2 2 1 0 1 0 1 1v1c0 1-1 2-2 2s-1 .008-1 1.031V20c0 1 0 1 1 1Z" stroke="currentColor" stroke-width="1.6"/></svg>',
};

function probCard(type, name, sev, whatItIs, symptom, fix, extra){
  const tagClass = type==='DB'?'':'type==="API"?"api":"server"';
  const tc = type==='DB'?'':type==='API'?'api':'server';
  return `
    <div class="prob-header">
      <span class="prob-tag ${tc}">${type}</span>
      <span class="sev ${sev==='CRITICAL'?'critical':sev==='HIGH'?'high':'medium'}">${sev}</span>
      <span class="prob-name">${name}</span>
    </div>
    <div class="two-state" style="margin-bottom:12px">
      <div class="state-box broken">
        <div class="state-label broken">// the problem</div>
        <p>${whatItIs}</p>
      </div>
      <div class="state-box broken" style="background:rgba(249,115,22,0.06);border-color:rgba(249,115,22,0.22)">
        <div class="state-label" style="color:var(--accent)">// symptom in prod</div>
        <p>${symptom}</p>
      </div>
    </div>
    <div class="state-box fixed">
      <div class="state-label fixed">// senior fix</div>
      <p>${fix}</p>
    </div>
    ${extra||''}
  `;
}

function table(headers, rows){
  let h = '<table class="tbl"><thead><tr>'+headers.map(x=>'<th>'+x+'</th>').join('')+'</tr></thead><tbody>';
  rows.forEach(r=>{ h+='<tr>'+r.map(c=>'<td>'+c+'</td>').join('')+'</tr>'; });
  return h+'</tbody></table>';
}

// ── slides ──
const slides = [];

// 1 cover
slides.push({ eyebrow:'Integrative Programming · M15', title:'<span class="hi">Common Problems</span> in Backend, API &amp; Server Design', html:`
  <div class="stack" style="justify-content:center;flex:1;gap:24px">
    <p style="max-width:660px;font-size:18px;color:var(--text-dim)">Every production system breaks eventually. The difference between a junior and a senior dev isn't that seniors write bug-free code — it's that they <strong>recognise the pattern</strong>, know the name, and already know the fix.</p>
    <div style="display:flex;flex-wrap:wrap;gap:12px">
      <span class="bucket-label db" style="font-size:14px">${IC.db} &nbsp;6 Database Problems</span>
      <span class="bucket-label api" style="font-size:14px">${IC.api} &nbsp;6 API Problems</span>
      <span class="bucket-label server" style="font-size:14px">${IC.server} &nbsp;6 Server / Infra Problems</span>
    </div>
    <div class="inset" style="max-width:600px">
      <span class="mono">// format per problem</span><br>
      <span style="color:var(--text-faint);font-size:16px">What it is &nbsp;→&nbsp; Symptom in prod &nbsp;→&nbsp; Senior fix</span>
    </div>
  </div>
`});

// 2 glossary
slides.push({ eyebrow:'Before We Start', title:'Glossary', scroll:true, html:`
  <p class="muted" style="margin-bottom:12px">Terms you'll see throughout this deck.</p>
  ${table(['Term','What it means'],[
    ['<strong>Query</strong>','A request sent to a database to read, insert, update, or delete data.'],
    ['<strong>N+1 problem</strong>','Running 1 query to get a list, then N more queries for each item in that list — instead of one joined query.'],
    ['<strong>Index (DB)</strong>','A data structure that lets the database find rows fast without scanning the whole table.'],
    ['<strong>Connection pool</strong>','A set of pre-opened DB connections reused across requests, so the app doesn\'t open a new connection every time.'],
    ['<strong>Rate limiting</strong>','Restricting how many requests a client can make in a time window to prevent abuse or overload.'],
    ['<strong>Idempotency</strong>','An operation that produces the same result no matter how many times it\'s called. POST /checkout should not create two orders on retry.'],
    ['<strong>Pagination</strong>','Returning results in chunks (pages) instead of all at once — critical for large datasets.'],
    ['<strong>SPOF</strong>','Single Point of Failure — one component whose failure takes down the whole system.'],
    ['<strong>Graceful shutdown</strong>','Letting in-flight requests finish before a server stops, instead of cutting them off mid-process.'],
    ['<strong>Thundering herd</strong>','When a cache expires and thousands of requests hit the DB simultaneously before the cache is repopulated.'],
    ['<strong>Secret</strong>','Sensitive credentials (API keys, DB passwords) that must never be hardcoded or committed to source control.'],
    ['<strong>Log noise</strong>','Too many low-value log entries that bury the signals you actually need when debugging.'],
  ])}
`});

// 3 how seniors think
slides.push({ eyebrow:'Section 1', title:'How Seniors Think About Problems', html:`
  <div class="row" style="flex:1;gap:16px">
    <div class="stack" style="flex:1">
      <p>Juniors ask <strong>"how do I fix this error?"</strong><br>Seniors ask <strong>"why does this class of error keep happening, and how do we make it impossible?"</strong></p>
      <div class="card card-border-accent">
        <h3 class="h">The senior mental model</h3>
        <ul class="list">
          <li><strong>Name the problem first.</strong> A named problem has known solutions. "It's slow" is not a named problem. "N+1 query on the user list endpoint" is.</li>
          <li><strong>Reproduce it deterministically.</strong> If you can't make it happen on demand, you can't confirm it's fixed.</li>
          <li><strong>Fix the root cause, not the symptom.</strong> Restarting the server every 6 hours is not a fix.</li>
          <li><strong>Prevent the whole class.</strong> Add a lint rule, a code review checklist item, or a test — not just a patch.</li>
        </ul>
      </div>
    </div>
    <div class="stack" style="flex:1;gap:12px">
      <div class="inset">
        <div style="color:var(--danger);margin-bottom:6px">${IC.warn}</div>
        <h3 class="h" style="font-size:17px">Junior response</h3>
        <p style="margin:0;font-size:16px">"The page was loading slow so I added a loading spinner and filed a Jira ticket."</p>
      </div>
      <div class="inset" style="background:rgba(74,222,128,0.04);box-shadow:inset 5px 5px 10px var(--shadow-d), inset -3px -3px 8px var(--shadow-l);">
        <div style="color:var(--good);margin-bottom:6px">${IC.check}</div>
        <h3 class="h" style="font-size:17px;color:var(--good)">Senior response</h3>
        <p style="margin:0;font-size:16px">"Profiled the endpoint. Found 47 DB queries for a 10-item list — N+1 on the user→orders relation. Added eager loading, dropped to 2 queries. Added a test to catch regression."</p>
      </div>
      <div class="inset">
        <span class="mono" style="font-size:14px">// the pattern</span>
        <p style="margin:6px 0 0;font-size:16px">Observe → Name → Root cause → Fix → Prevent recurrence</p>
      </div>
    </div>
  </div>
`});

slides.push({ eyebrow:'Database Problems · 4 of 6', title:'Uncontrolled Migrations on Live DBs', html:`
  <div class="card" style="flex:1">

      'Deploy causes 5-minute downtime. Or worse: the migration succeeds but old app code referencing the old column name starts throwing 500 errors until rollback.',
      '<strong>Expand-contract pattern:</strong> (1) Add new column as nullable. (2) Deploy code that writes to both old and new. (3) Backfill existing rows. (4) Make column NOT NULL. (5) Remove old column in a later deploy. Never rename — add new, migrate, drop old.'
    )}
    <div class="two-state" style="margin-top:12px">

ALTER TABLE orders

      </div>

        <div class="state-label fixed">// safe</div>

<span class="c-good">ALTER TABLE orders ADD COLUMN status VARCHAR;</span>
<span class="c-comment">-- Step 2: backfill async</span>
<span class="c-good">UPDATE orders SET status='pending' WHERE status IS NULL;</span>
<span class="c-comment">-- Step 3: later, add constraint</span>

  <div class="card" style="flex:1">

      <div class="state-box fixed">
        <div class="state-label fixed">// graceful</div>
        <div class="code-block">process.on(<span class="c-str">'SIGTERM'</span>, async () => {
  <span class="c-good">server.close()</span>          <span class="c-comment">// stop new reqs</span>
  await <span class="c-good">drainQueue()</span>     <span class="c-comment">// finish jobs</span>

`});

slides.push({ eyebrow:'Server / Infra Problems · 4 of 6', title:'The Thundering Herd Problem', html:`
  <div class="card" style="flex:1">
    ${probCard('SERVER','Thundering Herd','HIGH',
      'A popular cached result expires. At that exact moment, 5,000 concurrent requests all find an empty cache and simultaneously fire the same expensive DB query to repopulate it — multiplying your DB load by 5,000x.',
      'DB CPU hits 100%. Response times spike from 50ms to 30 seconds. Cache repopulation queries compete with each other and slow each other down. May cascade into a full outage.',
      '<strong>Cache locking / mutex:</strong> only one request regenerates the cache; others wait for it. <strong>Probabilistic early revalidation (PER):</strong> proactively refresh the cache slightly before it expires, not after. <strong>Stale-while-revalidate:</strong> serve the stale value while refreshing in the background. <strong>Jitter on TTLs:</strong> add a random ±10% to cache expiry so they don\'t all expire at the same time.'
    )}
    <div class="inset" style="margin-top:12px">
      <span class="mono" style="font-size:14px">// jitter pattern</span>
      <p style="margin:6px 0 0;font-size:16px">Instead of <code>TTL = 300s</code> for every key, use <code>TTL = 300 + random(0, 30)</code> — spreads cache expiry across 30 seconds, preventing the simultaneous stampede.</p>

`});

// ── render ──
const deck = document.getElementById('deck');
let current = 0;

function renderSlide(s){
  const el = document.createElement('div');
  el.className = 'slide';
  const emark = s.eyebrow.includes('Database')?'<span class="emark">⬛</span>':
                s.eyebrow.includes('API')?'<span class="emark">▶</span>':
                s.eyebrow.includes('Server')?'<span class="emark">◆</span>':'<span class="emark">//</span>';
  el.innerHTML =
    `<div class="eyebrow">${emark} ${s.eyebrow}</div>`+
    `<h2 class="title">${s.title}</h2>`+
    `<div class="content${s.scroll?' scrollable':''}">${s.html}</div>`;
  return el;
}

const slideEls = slides.map(renderSlide);
slideEls.forEach(el => deck.appendChild(el));

function updateChrome(){
  document.getElementById('ctr').textContent = (current+1)+' / '+slides.length;
  document.getElementById('pf').style.width = ((current+1)/slides.length*100)+'%';
}

function goTo(idx, dir){
  if(idx<0||idx>=slides.length||idx===current) return;
  const prev=slideEls[current], next=slideEls[idx];
  prev.classList.remove('active');
  prev.classList.add(dir==='next'?'exit-left':'exit-right');
  next.classList.remove('exit-left','exit-right');
  void next.offsetWidth;
  next.classList.add('active');
  setTimeout(()=>{ prev.classList.remove('exit-left','exit-right'); }, 350);
  current=idx;
  updateChrome();
}

slideEls[0].classList.add('active');
updateChrome();

const next=()=>goTo(current+1,'next');
const prev=()=>goTo(current-1,'prev');

window.addEventListener('keydown', e=>{
  const ov=document.getElementById('shortcuts-overlay');
  if(e.key==='?'){ ov.classList.toggle('show'); return; }
  if(ov.classList.contains('show')){ if(e.key==='Escape') ov.classList.remove('show'); return; }
  if(e.key==='ArrowRight'||e.key==='PageDown') next();
  else if(e.key==='ArrowLeft'||e.key==='PageUp') prev();
  else if(e.key==='Home') goTo(0,'prev');
  else if(e.key==='End') goTo(slides.length-1,'next');
});

deck.addEventListener('contextmenu', e=>{ e.preventDefault(); next(); });
window.addEventListener('mousedown', e=>{
  if(e.button===3||e.button===4){ e.preventDefault(); e.stopImmediatePropagation(); }
},true);
window.addEventListener('mouseup', e=>{
  if(e.button===3){ e.preventDefault(); prev(); }
  else if(e.button===4){ e.preventDefault(); next(); }
},true);
window.addEventListener('popstate',()=>{ history.pushState(null,'',location.href); });
history.pushState(null,'',location.href);

let tx=null;
deck.addEventListener('touchstart', e=>{ tx=e.changedTouches[0].clientX; },{passive:true});
deck.addEventListener('touchend', e=>{
  if(tx===null) return;
  const dx=e.changedTouches[0].clientX-tx;
  if(Math.abs(dx)>50){ dx<0?next():prev(); }
  tx=null;
},{passive:true});

document.getElementById('shortcuts-overlay').addEventListener('click', e=>{
  if(e.target.id==='shortcuts-overlay') e.target.classList.remove('show');
});
</script>
