<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Summative Exam: Architecture, Clean Code, Scaling, Stacks &amp; System Problems</title>
<style>
:root{--bg:#0e1a2b;--card:#15263d;--card2:#1b3150;--line:#2e4a70;--ink:#eaf1fb;--mut:#aec0d8;--amb:#f4b942;--teal:#52d6c0;--rose:#ff8aa0;--r:14px}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:16px/1.55 "Trebuchet MS","Segoe UI",system-ui,sans-serif;overflow:hidden}
#bar{position:fixed;top:0;left:0;height:4px;width:0;background:linear-gradient(90deg,var(--teal),var(--amb));z-index:20;transition:width .35s}
#ctr{position:fixed;right:16px;bottom:12px;font-size:1rem;color:var(--mut);z-index:20;background:rgba(14,26,43,.85);padding:2px 12px;border-radius:99px;border:1px solid var(--line)}
#stage{position:fixed;inset:0}
.slide{position:absolute;inset:0;opacity:0;pointer-events:none;overflow:auto;transition:opacity .35s ease,transform .35s ease;background:
 repeating-linear-gradient(0deg,transparent 0 39px,rgba(82,214,192,.05) 39px 40px),repeating-linear-gradient(90deg,transparent 0 39px,rgba(82,214,192,.05) 39px 40px)}
.slide.on{opacity:1;pointer-events:auto}
.in{max-width:1280px;margin:0 auto;padding:30px 36px 56px}
.eb{font-size:1rem;color:var(--teal);letter-spacing:.04em;margin-bottom:2px}
h1,h2{font-family:Georgia,"Times New Roman",serif;margin:0 0 14px;line-height:1.15}
h1{font-size:clamp(2.2rem,5vw,3.6rem)}h2{font-size:clamp(1.7rem,3.2vw,2.3rem)}
p{margin:0 0 10px}
.grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:stretch}
.grid.one{grid-template-columns:minmax(0,1fr);max-width:640px;margin:0 auto}
.card,.q{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;min-width:0}
.q{display:flex;gap:14px}
.qn{flex:0 0 auto;width:38px;height:38px;border-radius:50%;background:var(--amb);color:#1a1405;font-weight:700;display:grid;place-items:center;font-size:1.1rem}
.qb{min-width:0;flex:1}.qb p{font-size:1.1rem;margin-bottom:10px}
.opts{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.opts li{display:flex;gap:10px;background:var(--card2);border-radius:10px;padding:6px 10px;font-size:1.05rem}
.opts b{color:var(--teal);flex:0 0 auto}
.line{border-bottom:2px solid var(--line);padding:8px 0 2px;color:var(--mut);font-size:1rem}
.tag{display:inline-block;font-size:1rem;padding:1px 12px;border-radius:99px;border:1px solid var(--amb);color:var(--amb);margin:0 8px 8px 0}
table{width:100%;border-collapse:collapse;font-size:1.05rem}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line)}th{color:var(--amb)}
.k{font-size:1.05rem;display:grid;gap:10px}.k .card{padding:10px 14px}.k b{color:var(--amb)}.k i{color:var(--mut);font-style:normal}
.hero{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:28px;align-items:center;min-height:80vh}
.svgw{height:clamp(220px,42vh,380px);overflow:hidden}.svgw svg{width:100%;height:100%}
blockquote{margin:0 0 12px;padding:14px 18px;border-left:5px solid var(--amb);background:var(--card);border-radius:0 var(--r) var(--r) 0;font:italic 1.3rem/1.4 Georgia,serif}
#help{position:fixed;inset:0;background:rgba(5,10,18,.9);z-index:30;display:none;place-items:center}
#help.on{display:grid}#help div{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:22px 30px;font-size:1.05rem;line-height:2}
kbd{background:var(--card2);border:1px solid var(--line);border-radius:6px;padding:1px 8px;font-size:1rem}
@media(max-width:820px){.grid,.hero{grid-template-columns:minmax(0,1fr)}.in{padding:22px 16px 56px}}
@media(prefers-reduced-motion:reduce){.slide,#bar{transition:none}}
</style>
</head>
<body>
<div id="bar"></div><div id="ctr">1 / 1</div><div id="stage"></div>
<div id="help"><div><b>Shortcuts</b><br><kbd>→</kbd> / right-click / Mouse4 next<br><kbd>←</kbd> / Mouse3 previous<br><kbd>Home</kbd> / <kbd>End</kbd> first / last<br><kbd>?</kbd> toggle this panel<br>Swipe left / right on mobile</div></div>
<script>
var MCQ=[
["Which term describes the internal structure of one single application?",["Project architecture","Program architecture","Service mesh","Content delivery network"],"B","Program architecture is internal (e.g. MVC); project architecture covers many systems."],
["In MVP (Model-View-Presenter), what is the role of the View?",["It holds all UI logic","It stores the database","It stays passive and only displays what the Presenter says","It routes HTTP requests"],"C","The Presenter holds the UI logic; the View is passive (&ldquo;dumb&rdquo;)."],
["Adding more web servers behind a load balancer is called:",["Vertical scaling","Horizontal scaling","Sharding","Denormalization"],"B","Scale out = more machines sharing load."],
["Which naming convention is recommended for constants like a retry limit?",["camelCase","PascalCase","UPPER_SNAKE_CASE","kebab-case"],"C","e.g. MAX_RETRIES."],
["Which stack is LAMP with Nginx replacing Apache?",["MERN","MEAN","LEMP","JAMstack"],"C","LEMP: Linux, Nginx, MySQL, PHP."],
["The usual fix for the N+1 query problem is:",["Add a loading spinner","Eager loading / JOIN queries","Restart the server","Increase pool size"],"B","Fetch the list and its relations in one or two queries."],
["Which part of a SemVer number (2.4.1) is increased for breaking changes?",["MAJOR","MINOR","PATCH","BUILD"],"A","MAJOR = breaking; MINOR = features; PATCH = fixes."],
["Which HTTP status code should a rate-limited API return?",["201 Created","404 Not Found","429 Too Many Requests","502 Bad Gateway"],"C","Pair it with a Retry-After header."],
["What is the RICE score formula?",["Reach &times; Impact &times; Effort","(Reach &times; Impact &times; Confidence) / Effort","Reach + Impact + Confidence + Effort","Impact / Reach"],"B","Higher score = higher priority."],
["What is an idempotency key used for?",["Encrypting passwords","Speeding up joins","Preventing duplicate effects when a request is retried","Versioning an API"],"C","Same key again returns the original result (no double charge)."]];
var ID=[
["The principle that says &ldquo;avoid duplicating logic; centralize it.&rdquo;","DRY (Don&rsquo;t Repeat Yourself)","Duplicated logic should become one reusable function."],
["Architecture where components communicate by producing and reacting to events, often through a broker such as Kafka or RabbitMQ.","Event-driven architecture","Decoupled and real-time friendly."],
["A prioritization method that sorts features into four buckets: Must, Should, Could, Won&rsquo;t.","MoSCoW","Won&rsquo;t = explicitly deferred."],
["The practice of shipping code to production switched off, then enabling it gradually or for specific users.","Feature flags","Part of team and process scaling."],
["When a popular cache entry expires and thousands of requests hit the database at once to rebuild it.","Thundering herd","Fix: cache locking, early revalidation, stale-while-revalidate."]];
var SIT=[
["A weekend hackathon team ships everything from one codebase with one deploy.","Monolithic architecture","Simple for small teams and MVPs."],
["A live chat widget must show messages instantly on both sides without polling.","WebSockets","Persistent two-way connection."],
["One function validates an order, calculates totals, saves it, and emails the customer.","God function (violates one-thing-per-function)","Split into focused helpers."],
["A developer wrote <code>catch (e) {}</code> so errors never show up anywhere.","Swallowed (silent) errors","Log and rethrow instead."],
["An ops team upgrades a single server from 8GB to 64GB RAM to survive traffic.","Vertical scaling (scale up)","Hardware has a ceiling; single point of failure."],
["A backend renames a field on the live API and old mobile apps start crashing.","No API versioning","Use /v1, /v2 and keep old versions alive."],
["An endpoint listing 50 users fires 51 database queries.","N+1 query problem","Use eager loading."],
["A payment gateway slows down and every server thread ends up hanging, freezing the whole app.","Missing request timeouts","Fail fast; add a circuit breaker."],
["A public repo exposes the production database password committed in a config file.","Hardcoded secrets","Use env variables and a secrets manager."],
["A startup with 10 users splits its app into 12 microservices &ldquo;to be ready for scale.&rdquo;","Premature optimization / over-engineering","Measure first; scale on real bottlenecks."]];
var ENU=[
["Enumerate the three tiers of a three-tier architecture.","Presentation &bull; Application / Logic &bull; Data"],
["Enumerate the three parts of a Semantic Version number.","MAJOR &bull; MINOR &bull; PATCH"],
["Enumerate three common load-balancing algorithms.","Round Robin &bull; Least Connections &bull; IP Hash"],
["Enumerate the three pillars of observability.","Logs &bull; Metrics &bull; Traces"],
["Enumerate the three components of MVC.","Model &bull; View &bull; Controller"]];
var L="ABCD",S=[];
function sl(eb,t,body,x){S.push('<section class="slide"><div class="in"><div class="eb">'+eb+'</div><h2>'+t+'</h2>'+body+'</div></section>');}
function pages(arr,eb,t,fn,per){for(var p=0;p<arr.length;p+=per){var c=arr.slice(p,p+per),h=c.map(function(q,i){return fn(q,p+i+1)}).join("");
 var a=p+1,b=p+c.length;sl(eb+" &middot; Items "+a+"&ndash;"+b,t,'<div class="grid'+(c.length==1?' one':'')+'">'+h+'</div>');}}
function card(n,q,inner){return '<div class="q"><div class="qn">'+n+'</div><div class="qb"><p>'+q+'</p>'+inner+'</div></div>';}
// 1 title
S.push('<section class="slide"><div class="in"><div class="hero"><div><div class="eb">Integrative Programming &middot; Modules 10&ndash;15</div><h1>Summative Exam</h1><p style="font-size:1.2rem;color:var(--mut)">Architecture, clean coding, planning &amp; scaling, tech stacks, and common system problems.</p><span class="tag">10 MCQ</span><span class="tag">5 Identification</span><span class="tag">10 Situational</span><span class="tag">5 Enumeration</span></div><div class="svgw card"><svg viewBox="0 0 400 300" role="img"><title>Layered system blueprint: presentation, logic and data tiers</title><g fill="none" stroke-width="3"><rect x="40" y="30" width="320" height="60" rx="10" stroke="#52d6c0"/><rect x="40" y="120" width="320" height="60" rx="10" stroke="#f4b942"/><rect x="40" y="210" width="320" height="60" rx="10" stroke="#ff8aa0"/><path d="M200 90v30M200 180v30" stroke="#aec0d8" stroke-dasharray="6 5"/></g><g fill="#eaf1fb" font-size="20" text-anchor="middle" font-family="Georgia,serif"><text x="200" y="68">Presentation</text><text x="200" y="158">Application / Logic</text><text x="200" y="248">Data</text></g></svg></div></div></div></section>');
// 2 rules
sl("Before you begin","Coverage &amp; Rules",'<div class="grid"><div class="card"><table><tr><th>Part</th><th>Items</th><th>Points</th></tr><tr><td>I. Multiple Choice</td><td>10</td><td>10</td></tr><tr><td>II. Identification</td><td>5</td><td>10</td></tr><tr><td>III. Situational Identification</td><td>10</td><td>20</td></tr><tr><td>IV. Enumeration</td><td>5 &times; 3 answers</td><td>15</td></tr><tr><td><b>Total</b></td><td>30</td><td><b>55</b></td></tr></table></div><div class="card"><p><b>Rules</b></p><p>Read each item fully. Four questions appear per slide in a 2&times;2 grid. Write answers on your own paper; the answer key is at the end.</p><p>MCQ: pick the best letter. Identification: name the term. Situational: name the concept or problem the scenario shows. Enumeration: list exactly three answers.</p></div></div>');
// 3 recap
sl("Recap","Before the Exam",'<div class="grid"><div class="card"><p><b>M10 &ndash; M11</b></p><p>Program vs project architecture, tiers, MVC/MVVM/MVP, monolith vs microservices, REST. Clean code: naming, DRY, one-thing functions, guard clauses, clean vibe coding.</p></div><div class="card"><p><b>M12 &ndash; M13</b></p><p>Vertical vs horizontal scaling, load balancing, caching, DB scaling, queues, tech debt, SemVer, CI/CD, MoSCoW, RICE, YAGNI.</p></div><div class="card"><p><b>M14</b></p><p>MERN, MEAN, LAMP, LEMP, Django, Rails, JAMstack, Spring Boot, .NET, serverless, GraphQL.</p></div><div class="card"><p><b>M15</b></p><p>N+1, missing indexes, pool exhaustion, rate limiting, idempotency, pagination, SPOF, graceful shutdown, secrets, timeouts.</p></div></div>');
// exam pages
pages(MCQ,"Part I &middot; Multiple Choice","Choose the Best Answer",function(q,n){return card(n,q[0],'<ol class="opts">'+q[1].map(function(o,i){return '<li><b>'+L[i]+'.</b><span>'+o+'</span></li>'}).join("")+'</ol>');},4);
pages(ID,"Part II &middot; Identification","Name the Term",function(q,n){return card(n,q[0],'<div class="line">Answer:</div>');},4);
pages(SIT,"Part III &middot; Situational","What Is Happening Here?",function(q,n){return card(n,q[0],'<div class="line">Concept / problem:</div>');},4);
pages(ENU,"Part IV &middot; Enumeration","List Exactly Three",function(q,n){return card(n,q[0],'<div class="line">1.</div><div class="line">2.</div><div class="line">3.</div>');},4);
// answer keys
function key(a,off){return '<div class="k">'+a.join("")+'</div>';}
sl("Answer key &middot; 1 of 3","Part I: Multiple Choice",'<div class="grid k">'+MCQ.map(function(q,i){return '<div class="card"><b>'+(i+1)+'. '+q[2]+'</b> '+q[1][L.indexOf(q[2])]+'<br><i>'+q[3]+'</i></div>'}).join("")+'</div>');
sl("Answer key &middot; 2 of 3","Parts II &amp; IV: Identification &amp; Enumeration",'<div class="grid k">'+ID.map(function(q,i){return '<div class="card"><b>ID '+(i+1)+'. '+q[1]+'</b><br><i>'+q[2]+'</i></div>'}).join("")+ENU.map(function(q,i){return '<div class="card"><b>Enum '+(i+1)+'. '+q[1]+'</b></div>'}).join("")+'</div>');
sl("Answer key &middot; 3 of 3","Part III: Situational",'<div class="grid k">'+SIT.map(function(q,i){return '<div class="card"><b>'+(i+1)+'. '+q[1]+'</b><br><i>'+q[2]+'</i></div>'}).join("")+'</div>');
// closing
S.push('<section class="slide"><div class="in"><div class="eb">Key quotes &amp; closing</div><h2>Good Luck, Builders!</h2><div class="grid"><div><blockquote>Architecture decisions are expensive to change later.</blockquote><blockquote>Boring, proven, well-supported tech is often the right choice.</blockquote><p style="color:var(--mut)">From the module notes (M10 and M13).</p></div><div class="svgw card"><svg viewBox="0 0 300 200" role="img"><title>Celebration with stars and confetti</title><g><path d="M150 40l14 30 32 4-24 22 7 32-29-17-29 17 7-32-24-22 32-4z" fill="#f4b942"/><circle cx="50" cy="50" r="8" fill="#52d6c0"/><circle cx="250" cy="60" r="8" fill="#ff8aa0"/><rect x="60" y="140" width="16" height="16" fill="#ff8aa0" transform="rotate(20 68 148)"/><rect x="230" y="145" width="16" height="16" fill="#52d6c0" transform="rotate(-25 238 153)"/><circle cx="150" cy="165" r="7" fill="#f4b942"/></g></svg></div></div></div></section>');
var st=document.getElementById("stage");st.innerHTML=S.join("");
var el=st.children,N=el.length,cur=-1,bar=document.getElementById("bar"),ctr=document.getElementById("ctr"),help=document.getElementById("help");
function go(n){n=Math.max(0,Math.min(N-1,n));if(n===cur)return;var d=n>cur?1:-1,o=el[cur],e=el[n];
 if(o){o.classList.remove("on");o.style.transform="translateX("+(-30*d)+"px)";}
 e.style.transition="none";e.style.transform="translateX("+(30*d)+"px)";e.scrollTop=0;void e.offsetWidth;e.style.transition="";e.style.transform="none";e.classList.add("on");
 cur=n;bar.style.width=((n+1)/N*100)+"%";ctr.textContent=(n+1)+" / "+N;}
function next(){go(cur+1)}function prev(){go(cur-1)}
document.addEventListener("keydown",function(e){var k=e.key;if(k==="ArrowRight"){next()}else if(k==="ArrowLeft"){prev()}else if(k==="Home"){go(0)}else if(k==="End"){go(N-1)}else if(k==="?"){help.classList.toggle("on")}else if(k==="Escape"){help.classList.remove("on")}});
document.addEventListener("contextmenu",function(e){e.preventDefault();next()});
function side(e){if(e.button===3||e.button===4){e.preventDefault();e.stopImmediatePropagation();if(e.type==="mousedown"){e.button===4?next():prev();}}}
window.addEventListener("mousedown",side,true);window.addEventListener("mouseup",side,true);window.addEventListener("auxclick",side,true);
history.pushState(null,"",location.href);window.addEventListener("popstate",function(){history.pushState(null,"",location.href)});
var sx=null;document.addEventListener("touchstart",function(e){sx=e.touches[0].clientX},{passive:true});
document.addEventListener("touchend",function(e){if(sx===null)return;var dx=e.changedTouches[0].clientX-sx;if(Math.abs(dx)>50){dx<0?next():prev()}sx=null},{passive:true});
help.addEventListener("click",function(){help.classList.remove("on")});
go(0);
</script>
</body>
</html>
