<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>React Web Systems (M6–M15) Summative Exam Deck</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #0B132B;
  --surface: #1C2541;
  --surface-hover: #232E52;
  --card: #141E38;
  --border: #2A385B;
  --border-light: #3A4B7C;
  --accent: #61DAFB;
  --accent-alt: #4ADE80;
  --accent-warn: #FB923C;
  --accent-purple: #C084FC;
  --text: #F8FAFC;
  --text-dim: #94A3B8;
  --text-muted: #64748B;
  --font-sans: 'Segoe UI', system-ui, -apple-system, sans-serif;
  --font-mono: 'Cascadia Code', 'Fira Code', 'Consolas', monospace;
  --tr-speed: 350ms;
}

html, body {
  height: 100%;
  overflow: hidden;
  background-color: var(--bg);
  color: var(--text);
  font-family: var(--font-sans);
  font-size: 16px;
  line-height: 1.5;
}

#progress-bar {
  position: fixed;
  top: 0;
  left: 0;
  height: 4px;
  background: linear-gradient(90deg, var(--accent), var(--accent-purple));
  z-index: 100;
  transition: width 0.3s ease;
}

#slide-counter {
  position: fixed;
  top: 14px;
  right: 20px;
  font-size: 16px;
  font-family: var(--font-mono);
  color: var(--text-dim);
  z-index: 100;
  background: rgba(11, 19, 43, 0.8);
  padding: 4px 10px;
  border-radius: 6px;
  border: 1px solid var(--border);
}

#deck {
  width: 100vw;
  height: 100vh;
  position: relative;
  overflow: hidden;
}

.slide {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  padding: 40px 60px 30px;
  opacity: 0;
  pointer-events: none;
  transform: translateX(50px);
  transition: opacity var(--tr-speed) cubic-bezier(0.4, 0, 0.2, 1),
              transform var(--tr-speed) cubic-bezier(0.4, 0, 0.2, 1);
  overflow-y: auto;
}

.slide.active {
  opacity: 1;
  pointer-events: all;
  transform: translateX(0);
}

.slide.out-left {
  opacity: 0;
  transform: translateX(-50px);
}

.slide.out-right {
  opacity: 0;
  transform: translateX(50px);
}

@media (prefers-reduced-motion: reduce) {
  .slide { transition: opacity 0.15s ease; transform: none !important; }
}

.eyebrow {
  font-size: 16px;
  font-family: var(--font-mono);
  font-weight: 700;
  text-transform: uppercase;
  color: var(--accent);
  letter-spacing: 1.5px;
  margin-bottom: 6px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.eyebrow::before {
  content: '//';
  color: var(--text-muted);
}

.slide-title {
  font-size: clamp(25px, 2.8vw, 38px);
  font-weight: 800;
  color: var(--text);
  line-height: 1.2;
  margin-bottom: 16px;
  border-bottom: 2px solid var(--border);
  padding-bottom: 8px;
}

.content-area {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 16px;
  min-height: 0;
}

.grid-2x2 {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  grid-template-rows: repeat(2, minmax(0, 1fr));
  gap: 16px;
  flex: 1;
  min-height: 0;
}

.grid-side-by-side {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 16px;
  flex: 1;
  min-height: min(560px, 62vh);
}

.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 16px 20px;
  display: flex;
  flex-direction: column;
  position: relative;
  overflow: hidden;
}

.card-title {
  font-size: 16px;
  font-weight: 700;
  color: var(--accent);
  margin-bottom: 10px;
  display: flex;
  align-items: center;
  gap: 8px;
}

.mcq-question {
  font-size: 16px;
  font-weight: 600;
  color: var(--text);
  margin-bottom: 12px;
}

.mcq-options {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.mcq-opt {
  background: var(--surface);
  border: 1px solid var(--border);
  padding: 8px 12px;
  border-radius: 6px;
  font-size: 16px;
  color: var(--text-dim);
  cursor: pointer;
  transition: all 0.2s;
}

.mcq-opt:hover {
  border-color: var(--accent);
  color: var(--text);
  background: var(--surface-hover);
}

.mcq-opt.selected {
  border-color: var(--accent);
  background: rgba(97, 218, 251, 0.15);
  color: var(--accent);
  font-weight: 600;
}

.ident-question {
  font-size: 16px;
  color: var(--text);
  margin-bottom: 12px;
}

.ident-input {
  width: 100%;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 10px 14px;
  color: var(--text);
  font-size: 16px;
  font-family: var(--font-mono);
  outline: none;
  transition: border-color 0.2s;
  margin-top: auto;
}

.ident-input:focus {
  border-color: var(--accent);
}

/* CODE BLOCK & PANEL */
.code-card {
  background: #060B18;
  border: 1px solid var(--border);
  border-radius: 8px;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  height: 100%;
  min-height: 0;
}

.code-header {
  background: #0E162B;
  border-bottom: 1px solid var(--border);
  padding: 8px 14px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-family: var(--font-mono);
  font-size: 16px;
  color: var(--accent-alt);
  flex-shrink: 0;
}

.copy-btn {
  background: var(--surface);
  border: 1px solid var(--border-light);
  color: var(--text-dim);
  border-radius: 6px;
  padding: 4px 12px;
  font-size: 16px;
  cursor: pointer;
  box-shadow: 2px 2px 5px rgba(0,0,0,0.3), -1px -1px 3px rgba(255,255,255,0.05);
  transition: all 0.2s ease;
}

.copy-btn:hover {
  color: var(--text);
  border-color: var(--accent);
}

.copy-btn.copied {
  box-shadow: inset 2px 2px 5px rgba(0,0,0,0.6);
  background: var(--accent-alt);
  color: #000;
  border-color: var(--accent-alt);
  font-weight: 700;
}

.code-card pre {
  padding: 12px 16px;
  overflow: auto;
  font-family: var(--font-mono);
  font-size: 16px;
  line-height: 1.5;
  color: var(--text-dim);
  flex: 1;
  min-height: 0;
}

.kw { color: #F472B6; }
.str { color: #86EFAC; }
.fn { color: #C4B5FD; }
.num { color: #7DD3FC; }
.cm { color: #475569; font-style: italic; }
.type { color: #FCA5A5; }

.gto-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  height: 100%;
  min-height: 0;
  overflow: hidden;
}

.gto-input-panel {
  display: flex;
  flex-direction: column;
  gap: 8px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 12px;
  overflow: auto;
  flex-shrink: 0;
}

.gto-textarea {
  width: 100%;
  min-height: 70px;
  background: #060B18;
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 8px 12px;
  color: var(--text);
  font-size: 16px;
  font-family: var(--font-mono);
  resize: vertical;
  outline: none;
}
.gto-textarea:focus { border-color: var(--accent-purple); }

/* HERO & RECAP */
.hero-slide {
  background: radial-gradient(circle at 80% 20%, rgba(97, 218, 251, 0.15), transparent 40%),
              radial-gradient(circle at 20% 80%, rgba(192, 132, 252, 0.15), transparent 40%),
              var(--bg);
}

.badge-row {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin-top: 10px;
}

.pill {
  padding: 6px 14px;
  border-radius: 20px;
  font-size: 16px;
  font-weight: 600;
  border: 1px solid var(--border-light);
  color: var(--text-dim);
  background: var(--surface);
}
.pill.cyan { border-color: var(--accent); color: var(--accent); }
.pill.green { border-color: var(--accent-alt); color: var(--accent-alt); }
.pill.purple { border-color: var(--accent-purple); color: var(--accent-purple); }

.recap-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 14px;
  flex: 1;
}

.recap-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 16px;
  text-align: center;
}
.recap-card h4 {
  color: var(--accent);
  font-size: 16px;
  margin-bottom: 8px;
}

.ans-row {
  display: flex;
  gap: 12px;
  padding: 10px 14px;
  border-bottom: 1px solid var(--border);
  font-size: 16px;
}
.ans-row:nth-child(even) { background: rgba(255,255,255,0.02); }
.ans-num {
  font-weight: 800;
  font-family: var(--font-mono);
  color: var(--accent);
  min-width: 32px;
}

#shortcuts-modal {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.85);
  z-index: 200;
  align-items: center;
  justify-content: center;
}
#shortcuts-modal.open { display: flex; }
.modal-box {
  background: var(--surface);
  border: 1px solid var(--border-light);
  border-radius: 12px;
  padding: 28px;
  min-width: 360px;
}
.modal-row {
  display: flex;
  justify-content: space-between;
  padding: 8px 0;
  border-bottom: 1px solid var(--border);
  font-size: 16px;
}
kbd {
  background: var(--card);
  border: 1px solid var(--border-light);
  padding: 2px 8px;
  border-radius: 4px;
  font-family: var(--font-mono);
}

.hero-img-container {
  height: clamp(180px, 30vh, 280px);
  overflow: hidden;
  border-radius: 10px;
  border: 1px solid var(--border);
  margin-bottom: 16px;
}
.hero-img-container img, .hero-img-container svg {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

code {
  background: rgba(97, 218, 251, 0.1);
  color: var(--accent);
  padding: 2px 6px;
  border-radius: 4px;
  font-family: var(--font-mono);
  font-size: 16px;
}
</style>
</head>
<body>

<div id="progress-bar"></div>
<div id="slide-counter">1 / 18</div>
<div id="deck"></div>

<div id="shortcuts-modal">
  <div class="modal-box">
    <h3 style="color:var(--accent); margin-bottom:16px;">⌨ Navigation Shortcuts</h3>
    <div class="modal-row"><span>Next Slide</span><span><kbd>→</kbd> / <kbd>Right-Click</kbd> / <kbd>Mouse4</kbd></span></div>
    <div class="modal-row"><span>Previous Slide</span><span><kbd>←</kbd> / <kbd>Mouse3</kbd></span></div>
    <div class="modal-row"><span>First / Last Slide</span><span><kbd>Home</kbd> / <kbd>End</kbd></span></div>
    <div class="modal-row"><span>Shortcuts Menu</span><span><kbd>?</kbd></span></div>
    <button style="margin-top:20px; width:100%; padding:10px; background:var(--accent); color:#000; font-weight:700; border:none; border-radius:6px; cursor:pointer;" onclick="document.getElementById('shortcuts-modal').classList.remove('open')">Close</button>
  </div>
</div>

<script>
// --- SYNTAX HIGHLIGHTER ---
function highlightCode(raw) {
  const keywords = /^(const|let|var|function|return|async|await|import|export|default|from|if|else|switch|case|break|try|catch|new|throw)\b/;
  const types = /^(React|ReactDOM|useState|useEffect|useReducer|useContext|useRef|useMemo|useCallback|useQuery|useMutation|useParams|useNavigate|axios|express|cors|QueryClient|QueryClientProvider|createContext)\b/;
  const numbers = /^\b\d+(\.\d+)?\b/;
  
  function escapeHTML(str) {
    return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  let i = 0, out = '';
  while (i < raw.length) {
    if (raw[i] === '/' && raw[i+1] === '/') {
      let end = raw.indexOf('\n', i);
      let comment = end === -1 ? raw.slice(i) : raw.slice(i, end);
      out += '<span class="cm">' + escapeHTML(comment) + '</span>';
      i += comment.length;
      continue;
    }
    if (raw[i] === '`' || raw[i] === "'" || raw[i] === '"') {
      let quote = raw[i];
      let j = i + 1;
      while (j < raw.length && raw[j] !== quote && raw[j] !== '\n') {
        if (raw[j] === '\\') j++;
        j++;
      }
      out += '<span class="str">' + escapeHTML(raw.slice(i, j + 1)) + '</span>';
      i = j + 1;
      continue;
    }
    let rest = raw.slice(i);
    let m;
    if ((m = rest.match(keywords))) {
      out += '<span class="kw">' + escapeHTML(m[0]) + '</span>';
      i += m[0].length;
      continue;
    }
    if ((m = rest.match(types))) {
      out += '<span class="type">' + escapeHTML(m[0]) + '</span>';
      i += m[0].length;
      continue;
    }
    if ((m = rest.match(numbers))) {
      out += '<span class="num">' + escapeHTML(m[0]) + '</span>';
      i += m[0].length;
      continue;
    }
    out += escapeHTML(raw[i]);
    i++;
  }
  return out;
}

function createCodeBlock(codeText, label) {
  const id = 'code-' + Math.random().toString(36).substring(2, 9);
  const highlighted = highlightCode(codeText);
  return `
    <div class="code-card">
      <div class="code-header">
        <span>${label || 'JavaScript'}</span>
        <button class="copy-btn" onclick="copyCode('${id}', this)">Copy</button>
      </div>
      <pre id="${id}">${highlighted}</pre>
    </div>
  `;
}

function copyCode(id, btn) {
  const pre = document.getElementById(id);
  navigator.clipboard.writeText(pre.textContent).then(() => {
    btn.textContent = 'Copied!';
    btn.classList.add('copied');
    setTimeout(() => {
      btn.textContent = 'Copy';
      btn.classList.remove('copied');
    }, 2000);
  });
}

// --- SLIDE DATA DEFINITION ---
const slides = [];

// Slide 0: Title Hero
slides.push({
  cls: 'hero-slide',
  html: `
    <div style="flex:1; display:flex; flex-direction:column; justify-content:center; align-items:flex-start;">
      <div class="eyebrow">Comprehensive Assessment Deck</div>
      <h1 style="font-size:clamp(40px, 5vw, 68px); font-weight:900; line-height:1.1; margin-bottom:12px;">
        React Web Systems <span style="color:var(--accent);"><br/>Summative Exam (M6–M15)</span>
      </h1>
      <p style="font-size:18px; color:var(--text-dim); max-width:680px; margin-bottom:20px;">
        A 30-item evaluation covering Fundamentals, State, Effects, TanStack Query, Reducers, Context, Hooks Optimization, Routing, and Protected Auth Routes.
      </p>
      <div class="hero-img-container" style="width:100%; max-width:680px;">
        <svg viewBox="0 0 800 300" role="img" aria-label="React Web Systems Modules Architecture Diagram">
          <title>React Web Systems Architecture</title>
          <rect width="800" height="300" fill="#0E162B" rx="10"/>
          <g stroke="#2A385B" stroke-width="2" fill="none">
            <rect x="40" y="40" width="200" height="100" rx="8" fill="#141E38"/>
            <rect x="300" y="40" width="200" height="100" rx="8" fill="#141E38"/>
            <rect x="560" y="40" width="200" height="100" rx="8" fill="#141E38"/>
            <rect x="170" y="180" width="200" height="90" rx="8" fill="#141E38"/>
            <rect x="430" y="180" width="200" height="90" rx="8" fill="#141E38"/>
          </g>
          <path d="M 240 90 L 300 90 M 500 90 L 560 90 M 400 140 L 270 180 M 400 140 L 530 180" stroke="#61DAFB" stroke-width="3" fill="none"/>
          <text x="140" y="85" fill="#61DAFB" font-family="sans-serif" font-weight="700" font-size="16" text-anchor="middle">UI &amp; Components</text>
          <text x="140" y="110" fill="#94A3B8" font-family="sans-serif" font-size="16" text-anchor="middle">JSX / Props (M6)</text>
          <text x="400" y="85" fill="#4ADE80" font-family="sans-serif" font-weight="700" font-size="16" text-anchor="middle">State Management</text>
          <text x="400" y="110" fill="#94A3B8" font-family="sans-serif" font-size="16" text-anchor="middle">useState / useReducer (M7, M11)</text>
          <text x="660" y="85" fill="#C084FC" font-family="sans-serif" font-weight="700" font-size="16" text-anchor="middle">Server &amp; Sync</text>
          <text x="660" y="110" fill="#94A3B8" font-family="sans-serif" font-size="16" text-anchor="middle">useEffect / TanStack (M8-M10)</text>
          <text x="270" y="225" fill="#FB923C" font-family="sans-serif" font-weight="700" font-size="16" text-anchor="middle">Global Broadcast</text>
          <text x="270" y="250" fill="#94A3B8" font-family="sans-serif" font-size="16" text-anchor="middle">Context API (M12)</text>
          <text x="530" y="225" fill="#61DAFB" font-family="sans-serif" font-weight="700" font-size="16" text-anchor="middle">Router &amp; Guards</text>
          <text x="530" y="250" fill="#94A3B8" font-family="sans-serif" font-size="16" text-anchor="middle">React Router v6 (M14-M15)</text>
        </svg>
      </div>
      <div class="badge-row">
        <span class="pill cyan">10 Multiple Choice</span>
        <span class="pill green">10 Identifications</span>
        <span class="pill purple">10 Guess the Output</span>
      </div>
    </div>
  `
});

// Slide 1: Recap
slides.push({
  html: `
    <div class="eyebrow">Module Review</div>
    <div class="slide-title">Mastery Recap — M6 through M15</div>
    <div class="content-area">
      <div class="recap-grid">
        <div class="recap-card">
          <h4>M6–M7: Fundamentals &amp; State</h4>
          <p style="font-size:16px; color:var(--text-dim);">UI is a function of state. JSX compiles to function calls. useState schedules updates with immutable replacements.</p>
        </div>
        <div class="recap-card">
          <h4>M8–M10: Effects &amp; Server Sync</h4>
          <p style="font-size:16px; color:var(--text-dim);">useEffect synchronizes with external systems. Axios + TanStack Query handle server caching, retries, and stale data.</p>
        </div>
        <div class="recap-card">
          <h4>M11–M12: Reducers &amp; Context</h4>
          <p style="font-size:16px; color:var(--text-dim);">useReducer handles complex state transitions. Context API broadcasts values globally to bypass prop drilling.</p>
        </div>
        <div class="recap-card">
          <h4>M13: Hooks &amp; Performance</h4>
          <p style="font-size:16px; color:var(--text-dim);">useRef stores silent mutable values. useMemo and useCallback stabilize references to prevent excess renders.</p>
        </div>
        <div class="recap-card">
          <h4>M14: React Router v6</h4>
          <p style="font-size:16px; color:var(--text-dim);">Client-side SPA navigation via createBrowserRouter, NavLink, Outlet placeholders, and dynamic useParams.</p>
        </div>
        <div class="recap-card">
          <h4>M15: Auth &amp; Protected Routes</h4>
          <p style="font-size:16px; color:var(--text-dim);">JWT tokens stored in AuthContext. ProtectedRoute renders Outlet for authenticated users or redirects with replace.</p>
        </div>
      </div>
    </div>
  `
});

// Slide 2: Key Quotes
slides.push({
  html: `
    <div class="eyebrow">Guiding Philosophy</div>
    <div class="slide-title">Key Architectural Principles</div>
    <div class="content-area" style="justify-content:center; gap:20px;">
      <div class="card" style="border-left:4px solid var(--accent);">
        <p style="font-size:18px; font-style:italic; color:var(--text);">"UI is a function of state. Same state in, same UI out. Every single time."</p>
        <span style="font-size:16px; color:var(--accent); margin-top:6px; font-weight:700;">— Core React Mental Model</span>
      </div>
      <div class="card" style="border-left:4px solid var(--accent-alt);">
        <p style="font-size:18px; font-style:italic; color:var(--text);">"Never mutate state directly. When you call a setter, React detects the new reference, schedules reconciliation, and updates the real DOM."</p>
        <span style="font-size:16px; color:var(--accent-alt); margin-top:6px; font-weight:700;">— Immutability Rule</span>
      </div>
      <div class="card" style="border-left:4px solid var(--accent-purple);">
        <p style="font-size:18px; font-style:italic; color:var(--text);">"Frontend guards shape the user experience. The server API middleware is the real security door."</p>
        <span style="font-size:16px; color:var(--accent-purple); margin-top:6px; font-weight:700;">— Authentication Principle</span>
      </div>
    </div>
  `
});

// Slide 3: Real-World Scenarios
slides.push({
  html: `
    <div class="eyebrow">Practical Application</div>
    <div class="slide-title">Real-Life Architecture Analogies</div>
    <div class="content-area">
      <div style="display:grid; grid-template-columns:1fr 1fr; gap:16px; flex:1;">
        <div class="card">
          <div class="card-title">🏢 Context API = Radio Tower Broadcast</div>
          <p style="font-size:16px; color:var(--text-dim); line-height:1.6;">
            Prop drilling is like handing a paper memo down every office floor. Context API is like broadcasting over a radio tower—any employee with a receiver tuned in (<code>useContext</code>) gets the message directly, skipping intermediate managers.
          </p>
        </div>
        <div class="card">

// --- ENGINE LOGIC ---
let currentSlide = 0;
const deck = document.getElementById('deck');
const progressBar = document.getElementById('progress-bar');
const slideCounter = document.getElementById('slide-counter');

function renderSlides() {
  deck.innerHTML = '';
  slides.forEach((slideData, index) => {
    const slideDiv = document.createElement('div');
    slideDiv.className = 'slide' + (slideData.cls ? ' ' + slideData.cls : '');
    slideDiv.innerHTML = slideData.html;
    if (index === 0) slideDiv.classList.add('active');
    deck.appendChild(slideDiv);
  });
  updateUI();
}

function goToSlide(n) {
  if (n < 0 || n >= slides.length || n === currentSlide) return;
  const slideEls = deck.querySelectorAll('.slide');
  const isForward = n > currentSlide;

  slideEls[currentSlide].classList.remove('active');
  slideEls[currentSlide].classList.add(isForward ? 'out-left' : 'out-right');

  setTimeout(() => {
    slideEls.forEach(el => el.classList.remove('out-left', 'out-right'));
  }, 400);

  currentSlide = n;
  slideEls[currentSlide].classList.add('active');
  slideEls[currentSlide].scrollTop = 0;
  updateUI();
}

function updateUI() {
  progressBar.style.width = ((currentSlide / (slides.length - 1)) * 100) + '%';
  slideCounter.textContent = (currentSlide + 1) + ' / ' + slides.length;
}

function selectOpt(el) {
  const parent = el.closest('.mcq-opts');
  parent.querySelectorAll('.mcq-opt').forEach(opt => opt.classList.remove('selected'));
  el.classList.add('selected');
}

// --- EVENT LISTENERS ---
document.addEventListener('keydown', (e) => {
  const modal = document.getElementById('shortcuts-modal');
  if (modal.classList.contains('open')) {
    if (e.key === 'Escape') modal.classList.remove('open');
    return;
  }
  const tag = document.activeElement.tagName;
  if (tag === 'INPUT' || tag === 'TEXTAREA') return;

  if (e.key === 'ArrowRight' || e.key === 'ArrowDown') goToSlide(currentSlide + 1);
  else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') goToSlide(currentSlide - 1);
  else if (e.key === 'Home') goToSlide(0);
  else if (e.key === 'End') goToSlide(slides.length - 1);
  else if (e.key === '?') modal.classList.add('open');
  else if (e.key === 'Escape') modal.classList.remove('open');
});

document.addEventListener('mousedown', (e) => {
  if (e.target.closest('button, input, textarea, a, .mcq-opt')) return;
  if (e.button === 2) { // Right-click
    e.preventDefault();
    e.stopImmediatePropagation();
    goToSlide(currentSlide + 1);
  } else if (e.button === 3) { // Mouse3 / Back
    e.preventDefault();
    e.stopImmediatePropagation();
    goToSlide(currentSlide - 1);
  } else if (e.button === 4) { // Mouse4 / Forward
    e.preventDefault();
    e.stopImmediatePropagation();
    goToSlide(currentSlide + 1);
  }
}, true);

document.addEventListener('contextmenu', (e) => {
  if (e.target.closest('button, input, textarea, a')) return;
  e.preventDefault();
  e.stopImmediatePropagation();
}, true);

document.addEventListener('auxclick', (e) => {
  if (e.button === 3 || e.button === 4) {
    e.preventDefault();
    e.stopImmediatePropagation();
  }
}, true);

let touchStartX = 0;
document.addEventListener('touchstart', (e) => {
  touchStartX = e.touches[0].clientX;
}, { passive: true });

document.addEventListener('touchend', (e) => {
  if (e.target.closest('input, textarea')) return;
  const diffX = e.changedTouches[0].clientX - touchStartX;
  if (Math.abs(diffX) > 50) {
    if (diffX < 0) goToSlide(currentSlide + 1);
    else goToSlide(currentSlide - 1);
  }
}, { passive: true });

// Initial Render
renderSlides();
</script>
