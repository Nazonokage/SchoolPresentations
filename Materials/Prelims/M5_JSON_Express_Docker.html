<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>M5 — JSON, Express & Docker</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0B0F19;
  --surface:#111827;
  --surface2:#1C2536;
  --border:#253044;
  --border2:#2D3F58;
  --accent:#38BDF8;
  --accent2:#34D399;
  --accent3:#FB923C;
  --accent4:#C084FC;
  --accent5:#F472B6;
  --text:#F1F5F9;
  --text2:#94A3B8;
  --text3:#CBD5E1;
  --card:#141E2E;
  --card2:#172032;
  --font:'Inter',system-ui,sans-serif;
  --mono:'JetBrains Mono','Fira Code','Cascadia Code',monospace;
  --r:8px;--r2:12px;
  --tr:350ms cubic-bezier(.4,0,.2,1);
}
/* Google Fonts removed — system-ui fallback active */

html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:var(--font);font-size:16px}

/* ── CHROME ────────────────────────────────────────────────────────── */
#bar{position:fixed;top:0;left:0;height:3px;background:linear-gradient(90deg,var(--accent),var(--accent4));transition:width .3s;z-index:100;border-radius:0 2px 2px 0}
#ctr{position:fixed;top:10px;right:16px;font-size:12px;color:var(--text2);z-index:100;font-variant-numeric:tabular-nums;letter-spacing:.5px;font-family:var(--mono)}

/* ── DECK ──────────────────────────────────────────────────────────── */
#deck{width:100%;height:100vh;position:relative;overflow:hidden}
.slide{
  position:absolute;inset:0;
  display:flex;flex-direction:column;
  padding:52px 64px 36px;
  opacity:0;pointer-events:none;
  transform:translateX(48px);
  transition:opacity var(--tr),transform var(--tr);
  overflow-y:auto;
}
.slide.active{opacity:1;pointer-events:all;transform:translateX(0)}
.slide.out-l{opacity:0;transform:translateX(-48px)}
.slide.out-r{opacity:0;transform:translateX(48px)}
@media(prefers-reduced-motion:reduce){.slide{transition:opacity .15s;transform:none!important}}

/* ── TYPOGRAPHY ────────────────────────────────────────────────────── */
.eyebrow{font-size:11px;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:var(--accent);margin-bottom:10px;display:flex;align-items:center;gap:10px}
.eyebrow::before{content:'';display:inline-block;width:24px;height:2px;background:var(--accent);border-radius:1px}
.slide-title{font-size:clamp(28px,3.2vw,44px);font-weight:800;line-height:1.1;color:var(--text);margin-bottom:6px;letter-spacing:-.5px}
.slide-sub{font-size:16px;color:var(--text2);margin-bottom:24px;font-weight:400}
.rule{height:1px;background:linear-gradient(90deg,var(--border2),transparent);border:none;margin-bottom:22px}

/* ── LAYOUT HELPERS ────────────────────────────────────────────────── */
.content{flex:1;display:flex;flex-direction:column;gap:14px;min-height:0}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px;min-height:0}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.g2>*,.g3>*{min-width:0}
.split{display:grid;grid-template-columns:1fr 1fr;gap:18px;flex:1;min-height:0}
.split>*{min-width:0;display:flex;flex-direction:column;gap:10px}
.col{display:flex;flex-direction:column;gap:10px;min-width:0}
.flex1{flex:1}

/* ── CARDS ─────────────────────────────────────────────────────────── */
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--r2);padding:16px 18px}
.card h3{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:1.5px;color:var(--accent);margin-bottom:10px}
.card p,.card li{font-size:14.5px;color:var(--text3);line-height:1.65}
.card ul{padding-left:17px}.card li{margin-bottom:4px}

/* ── CODE BLOCKS ────────────────────────────────────────────────────── */
.cw{position:relative;background:#070C15;border:1px solid var(--border);border-radius:var(--r);overflow:hidden;flex:1;display:flex;flex-direction:column}
.cl{display:flex;align-items:center;justify-content:space-between;padding:7px 12px;background:#0D1421;border-bottom:1px solid var(--border);font-size:11px;color:var(--text2);font-family:var(--mono);flex-shrink:0}
.cl span{color:var(--accent3)}
.cw pre{padding:12px 14px;overflow:auto;font-family:var(--mono);font-size:13px;line-height:1.7;white-space:pre;flex:1;max-height:340px}
.cpbtn{padding:3px 10px;font-size:11px;font-family:var(--font);background:var(--surface2);border:1px solid var(--border2);color:var(--text2);border-radius:4px;cursor:pointer;transition:all .2s;white-space:nowrap}
.cpbtn:hover{background:var(--accent);color:#fff;border-color:var(--accent)}
.cpbtn.ok{background:var(--accent2);color:#fff;border-color:var(--accent2)}

/* syntax */
.k{color:#F472B6}.s{color:#86EFAC}.f{color:#C4B5FD}.n{color:#7DD3FC}
.c{color:#4B5563;font-style:italic}.t{color:#FCA5A5}.op{color:#94A3B8}
.b{color:#FCD34D}

/* ── INLINE CODE ────────────────────────────────────────────────────── */
ic{background:var(--surface2);padding:1px 6px;border-radius:4px;font-family:var(--mono);font-size:12.5px;color:var(--accent4);border:1px solid var(--border)}

/* ── BREAKDOWN ITEMS ────────────────────────────────────────────────── */
.bd{display:flex;flex-direction:column;gap:7px}
.bdi{display:flex;gap:10px;align-items:flex-start;padding:9px 11px;background:var(--surface);border:1px solid var(--border);border-radius:6px;border-left:3px solid var(--accent)}
.bdi.g{border-left-color:var(--accent2)}.bdi.o{border-left-color:var(--accent3)}
.bdi.p{border-left-color:var(--accent4)}.bdi.r{border-left-color:var(--accent5)}
.bdl{font-family:var(--mono);font-size:11px;color:var(--accent);background:#070C15;padding:2px 7px;border-radius:3px;white-space:nowrap;min-width:fit-content;align-self:flex-start;margin-top:1px;flex-shrink:0}
.bdt{font-size:14px;color:var(--text3);line-height:1.55}
.bdt strong{color:var(--text);font-weight:600}

/* ── TABLES ─────────────────────────────────────────────────────────── */
table{width:100%;border-collapse:collapse;font-size:14px}
th{background:var(--surface2);color:var(--accent);padding:9px 12px;text-align:left;font-weight:700;font-size:11px;letter-spacing:1px;text-transform:uppercase;border-bottom:1px solid var(--border)}
td{padding:9px 12px;border-bottom:1px solid var(--border);color:var(--text3);line-height:1.5;vertical-align:top}
tr:last-child td{border-bottom:none}
tr:hover td{background:rgba(255,255,255,.015)}

/* ── PILLS / BADGES ─────────────────────────────────────────────────── */
.pill{display:inline-block;padding:3px 11px;border-radius:20px;font-size:12px;font-weight:600;border:1px solid var(--border);color:var(--text2);margin:3px}
.pill.a{border-color:var(--accent);color:var(--accent);background:rgba(56,189,248,.1)}
.pill.g{border-color:var(--accent2);color:var(--accent2);background:rgba(52,211,153,.1)}
.pill.o{border-color:var(--accent3);color:var(--accent3);background:rgba(251,146,60,.1)}
.badge{display:inline-block;padding:2px 10px;border-radius:20px;font-size:11px;font-weight:700}
.bga{background:rgba(56,189,248,.15);color:var(--accent)}
.bgg{background:rgba(52,211,153,.15);color:var(--accent2)}
.bgr{background:rgba(244,114,182,.15);color:var(--accent5)}

/* ── STEP BOXES ─────────────────────────────────────────────────────── */
.step{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;background:var(--card);border:1px solid var(--border);border-radius:var(--r);margin-bottom:8px}
.step-num{width:28px;height:28px;border-radius:50%;background:var(--accent);color:#0B0F19;font-weight:900;font-size:13px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.step-body{flex:1;min-width:0}
.step-body h4{font-size:14px;font-weight:700;color:var(--text);margin-bottom:3px}
.step-body p{font-size:13px;color:var(--text2);line-height:1.5}

/* ── FLOW ────────────────────────────────────────────────────────────── */
.flow{display:flex;align-items:center;flex-wrap:wrap;gap:0;margin:8px 0}
.fb{background:var(--card2);border:1px solid var(--border2);border-radius:6px;padding:8px 14px;font-size:13.5px;color:var(--text3);font-weight:500}
.fb.hi{border-color:var(--accent);color:var(--accent)}
.fa{color:var(--accent);padding:0 8px;font-size:18px;font-weight:300}

/* ── HERO ────────────────────────────────────────────────────────────── */
.hero-slide{background:radial-gradient(ellipse at 15% 60%,rgba(56,189,248,.12) 0%,transparent 55%),radial-gradient(ellipse at 80% 20%,rgba(192,132,252,.08) 0%,transparent 50%),var(--bg)}
.hero-title{font-size:clamp(48px,5.5vw,76px);font-weight:900;line-height:1.02;letter-spacing:-1.5px}
.hero-title .h1{color:var(--text)}
.hero-title .h2{color:var(--accent)}
.hero-sub{font-size:18px;color:var(--text2);max-width:560px;line-height:1.65;margin:14px 0 20px}
.dot-grid{position:absolute;inset:0;background-image:radial-gradient(rgba(56,189,248,.06) 1px,transparent 1px);background-size:32px 32px;pointer-events:none}

/* ── MC / QUIZ ───────────────────────────────────────────────────────── */
.mc-item{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:14px 16px;flex:1}
.mc-q{font-size:15px;font-weight:600;color:var(--text);margin-bottom:10px;line-height:1.5}
.qn{color:var(--accent);margin-right:6px;font-weight:800}
.mc-opts{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.mc-opt{padding:7px 11px;border-radius:5px;border:1px solid var(--border);font-size:13.5px;color:var(--text3);cursor:pointer;transition:all .15s;background:var(--surface2);line-height:1.4}
.mc-opt:hover{border-color:var(--accent);color:var(--text)}
.mc-opt.sel{border-color:var(--accent);background:rgba(56,189,248,.12);color:var(--accent)}
.mc-page{display:flex;flex-direction:column;gap:11px;flex:1}

/* ── RECAP ───────────────────────────────────────────────────────────── */
.rc-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:11px}
.rc{background:var(--card);border:1px solid var(--border);border-radius:var(--r2);padding:16px;text-align:center}
.rc .ico{font-size:28px;margin-bottom:8px}
.rc h4{font-size:12px;font-weight:700;color:var(--accent);margin-bottom:5px;text-transform:uppercase;letter-spacing:.5px}
.rc p{font-size:13px;color:var(--text2);line-height:1.55}

/* ── ANSWER KEY ──────────────────────────────────────────────────────── */
.ans-block{border:1px solid var(--border);border-radius:var(--r2);overflow:hidden;flex:1}
.ans-row{display:flex;gap:10px;padding:9px 14px;border-bottom:1px solid var(--border);font-size:14px;align-items:flex-start}
.ans-row:last-child{border:none}
.ans-row:nth-child(even){background:rgba(255,255,255,.012)}
.anum{font-weight:800;color:var(--accent);min-width:28px;font-variant-numeric:tabular-nums;font-family:var(--mono);font-size:13px}
.abody{color:var(--text3);line-height:1.5;flex:1;min-width:0}
.abody strong{color:var(--accent2)}

/* ── SHORTCUT MODAL ──────────────────────────────────────────────────── */
#modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:200;align-items:center;justify-content:center}
#modal.open{display:flex}
.mbox{background:var(--surface);border:1px solid var(--border2);border-radius:14px;padding:28px 32px;min-width:340px}
.mbox h3{font-size:16px;font-weight:700;color:var(--accent);margin-bottom:16px}
.shr{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid var(--border);font-size:13px;color:var(--text3)}
.shr:last-of-type{border:none}
.shr kbd{background:var(--surface2);border:1px solid var(--border2);border-radius:4px;padding:2px 8px;font-family:var(--mono);font-size:11px;color:var(--text)}
.mcl{margin-top:18px;width:100%;padding:9px;background:var(--accent);color:#0B0F19;border:none;border-radius:6px;cursor:pointer;font-size:14px;font-weight:700;font-family:var(--font)}

#hint{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--text2);letter-spacing:.5px;pointer-events:none;opacity:.4;font-family:var(--mono)}

/* ── GTO ACTIVITY ──────────────────────────────────────────────────────── */
.gto-wrap{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:12px 14px;flex:1;display:flex;gap:14px;align-items:stretch}
.gto-left{display:flex;flex-direction:column;flex:1;min-width:0;gap:6px}
.gto-qlabel{font-size:13.5px;font-weight:700;color:var(--text)}
.gto-num{color:var(--accent3);font-weight:800;margin-right:6px}
.gto-pre{background:#070C15;border:1px solid var(--border);border-radius:5px;padding:8px 10px;font-family:var(--mono);font-size:12.5px;color:var(--text3);white-space:pre;overflow-x:auto;flex:1;margin:0}
.gto-right{display:flex;flex-direction:column;justify-content:flex-end;min-width:180px;max-width:200px;gap:4px}
.gto-alabel{font-size:11px;color:var(--text2);font-weight:600;text-transform:uppercase;letter-spacing:1px}
.gto-ta{width:100%;flex:1;min-height:70px;padding:7px 10px;background:var(--surface2);border:1px solid var(--border);border-radius:5px;color:var(--text);font-size:13px;font-family:var(--mono);outline:none;resize:none;line-height:1.6;transition:border .2s}
.gto-ta:focus{border-color:var(--accent3)}
</style>

    <button class="mcl" onclick="document.getElementById('modal').classList.remove('open')">Close</button>
  </div>

<script>
// ── TOKENIZER ──────────────────────────────────────────────────────────────
function hl(code){
  const KW=/^(const|let|var|function|return|async|await|try|catch|throw|new|class|extends|if|else|for|while|of|in|from|import|export|default|module|require|true|false|null|undefined)\b/;
  const TY=/^(console|process|fs|path|http|express|JSON|Object|Array|Math|Promise|Error|module|exports)\b/;
  const NUM=/^\b\d+(\.\d+)?\b/;
  function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
  let i=0,out='';
  while(i<code.length){
    // comment
    if(code[i]==='/'&&code[i+1]==='/'){
      const e=code.indexOf('\n',i);const ch=e===-1?code.slice(i):code.slice(i,e);
      out+=`<span class="c">${esc(ch)}</span>`;i+=ch.length;continue;
    }
    // template literal
    if(code[i]==='`'){
      let j=i+1;while(j<code.length&&code[j]!=='`'){if(code[j]==='\\')j++;j++;}
      out+=`<span class="s">${esc(code.slice(i,j+1))}</span>`;i=j+1;continue;
    }
    // single quote
    if(code[i]==="'"){
      let j=i+1;while(j<code.length&&code[j]!=="'"&&code[j]!=='\n'){if(code[j]==='\\')j++;j++;}
      out+=`<span class="s">${esc(code.slice(i,j+1))}</span>`;i=j+1;continue;
    }
    // double quote
    if(code[i]==='"'){
      let j=i+1;while(j<code.length&&code[j]!=='"'&&code[j]!=='\n'){if(code[j]==='\\')j++;j++;}
      out+=`<span class="s">${esc(code.slice(i,j+1))}</span>`;i=j+1;continue;
    }
    const rest=code.slice(i);let m;
    if((m=rest.match(KW)))  {out+=`<span class="k">${m[0]}</span>`;i+=m[0].length;continue;}
    if((m=rest.match(TY)))  {out+=`<span class="t">${m[0]}</span>`;i+=m[0].length;continue;}
    if((m=rest.match(NUM))) {out+=`<span class="n">${m[0]}</span>`;i+=m[0].length;continue;}
    out+=esc(code[i]);i++;
  }
  return out;
}

function cw(code,lang='js',label=''){
  const id='c'+Math.random().toString(36).slice(2);
  return `<div class="cw"><div class="cl"><span>${label||lang}</span><button class="cpbtn" onclick="cp('${id}',this)">Copy</button></div><pre id="${id}">${lang==='bash'||lang==='dockerfile'||lang==='text'||lang==='tree'?code.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'):hl(code)}</pre></div>`;
}

function cp(id,btn){
  navigator.clipboard.writeText(document.getElementById(id).textContent).then(()=>{
    btn.textContent='Copied!';btn.classList.add('ok');
    setTimeout(()=>{btn.textContent='Copy';btn.classList.remove('ok');},2000);
  });
}

<div class="eyebrow">Part 1 — Arrays</div>
<div class="slide-title">Multidimensional Arrays</div>
<hr class="rule"/>
<div class="content">
  <div class="split">
    <div>
      <div class="card" style="margin-bottom:0"><h3>What Is It?</h3>
        <p>An array that contains other arrays or objects as its elements. Think of it like a <strong style="color:var(--text)">table</strong>, a shelf of boxes, or a grade sheet.</p>

  const cards = students.map(s => \`
    <div class="card">
      <h2>\${s.name}</h2>
      <span class="badge \${s.active?'active':'inactive'}">
        \${s.active ? 'Active' : 'Inactive'}
      </span>

        Phone  : <span>\${s.contact.phone}</span>
      </div>
      <div class="gwa-badge">GWA \${s.gwa}</div>
    </div>\`).join('');

  html = html
    .replace('{{count}}', students.length)
    .replace('{{cards}}', cards);
  res.send(html);
});

// Route 3: GET /api/students → raw JSON
app.get('/api/students', (req, res) => {
  res.json(students);
});

// 404 fallback
app.use((req, res) => {
  res.status(404).json({ error: 'Not found' });
});

app.listen(PORT, () => {

// ── ENGINE ──────────────────────────────────────────────────────────────────
let cur=0;
const deck=document.getElementById('deck');
const bar=document.getElementById('bar');
const ctr=document.getElementById('ctr');

function build(){
  S.forEach((s,i)=>{
    const el=document.createElement('div');
    el.className='slide'+(s.cls?' '+s.cls:'');
    el.innerHTML=s.html||'';
    if(i===0)el.classList.add('active');
    deck.appendChild(el);
    if(s.init)s.init(el);
  });
}

function go(n){
  if(n<0||n>=S.length||n===cur)return;
  const els=deck.querySelectorAll('.slide');
  const fwd=n>cur;
  els[cur].classList.remove('active');
  els[cur].classList.add(fwd?'out-l':'out-r');
  setTimeout(()=>els[cur].classList.remove('out-l','out-r'),420);
  cur=n;els[cur].classList.add('active');els[cur].scrollTop=0;
  tick();
}

function tick(){
  bar.style.width=(S.length>1?(cur/(S.length-1)*100):100)+'%';
  ctr.textContent=(cur+1)+' / '+S.length;
}

document.addEventListener('keydown',e=>{
  const m=document.getElementById('modal');
  if(m.classList.contains('open')){if(e.key==='Escape')m.classList.remove('open');return;}
  const t=document.activeElement.tagName;
  if(t==='INPUT'||t==='TEXTAREA')return;
  if(e.key==='ArrowRight'||e.key==='ArrowDown')go(cur+1);
  else if(e.key==='ArrowLeft'||e.key==='ArrowUp')go(cur-1);
  else if(e.key==='Home')go(0);
  else if(e.key==='End')go(S.length-1);
  else if(e.key==='?')m.classList.add('open');
  else if(e.key==='Escape')m.classList.remove('open');
});

document.addEventListener('mousedown',e=>{
  if(e.target.closest('button,input,a,.mc-opt'))return;
  if(e.button===2){e.preventDefault();e.stopImmediatePropagation();go(cur+1);}
  else if(e.button===3){e.preventDefault();e.stopImmediatePropagation();go(cur-1);}
  else if(e.button===4){e.preventDefault();e.stopImmediatePropagation();go(cur+1);}
},true);
document.addEventListener('contextmenu',e=>{
  if(e.target.closest('button,input,a'))return;
  e.preventDefault();e.stopImmediatePropagation();
},true);
document.addEventListener('auxclick',e=>{
  if(e.button===3||e.button===4){e.preventDefault();e.stopImmediatePropagation();}
},true);

let tx=0;
document.addEventListener('touchstart',e=>tx=e.touches[0].clientX,{passive:true});
document.addEventListener('touchend',e=>{const d=e.changedTouches[0].clientX-tx;if(Math.abs(d)>50){d<0?go(cur+1):go(cur-1);}},{passive:true});

build();tick();
</script>
