<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Program &amp; Project Architecture — Integrative Programming</title>
<style>
  :root{
    --bg:#1b1e24;
    --bg-alt:#20242c;
    --bg-raised:#1e2129;
    --shadow-dark:#101216;
    --shadow-light:#2a2f3a;
    --text:#e9e7e2;
    --text-dim:#9aa2af;
    --text-faint:#6b7280;
    --accent:#6fb8ff;
    --accent-soft:rgba(111,184,255,0.14);
    --accent2:#f5a962;
    --accent2-soft:rgba(245,169,98,0.14);
    --good:#6fe3b4;
    --good-soft:rgba(111,227,180,0.14);
    --bad:#ff8f8f;
    --bad-soft:rgba(255,143,143,0.14);
    --radius-lg:24px;
    --radius-md:18px;
    --radius-sm:12px;
    --sh-out: 9px 9px 18px var(--shadow-dark), -9px -9px 18px var(--shadow-light);
    --sh-out-sm: 5px 5px 10px var(--shadow-dark), -5px -5px 10px var(--shadow-light);
    --sh-in: inset 5px 5px 10px var(--shadow-dark), inset -5px -5px 10px var(--shadow-light);
    --sh-in-sm: inset 3px 3px 6px var(--shadow-dark), inset -3px -3px 6px var(--shadow-light);
    --font-display: ui-rounded, "Segoe UI Semibold", "Segoe UI", -apple-system, system-ui, sans-serif;
    --font-body: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    --font-mono: ui-monospace, "Cascadia Mono", "Consolas", "SFMono-Regular", Menlo, monospace;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; padding:0; height:100%; background:var(--bg); color:var(--text);
    font-family:var(--font-body); overflow:hidden; -webkit-user-select:text; user-select:text;
  }
  ::selection{ background:var(--accent); color:#0d1015; }

  #deck{ position:relative; width:100vw; height:100vh; }

  .slide{
    position:absolute; inset:0;
    display:flex; flex-direction:column; justify-content:flex-start;
    padding: clamp(28px,4.5vh,56px) clamp(28px,6vw,90px);
    opacity:0; visibility:hidden;
    transform: translateX(40px);
    transition: opacity .35s ease, transform .35s ease;
    background:
      radial-gradient(1100px 500px at 85% -10%, rgba(111,184,255,0.06), transparent 60%),
      radial-gradient(900px 500px at -10% 110%, rgba(245,169,98,0.05), transparent 60%),
      var(--bg);
    overflow:hidden;
  }
  .slide.active{ opacity:1; visibility:visible; transform:translateX(0); z-index:2; }
  .slide.prev{ transform: translateX(-40px); }
  @media (prefers-reduced-motion: reduce){
    .slide{ transition:none; transform:none; }
  }

  .slide-inner{ display:flex; flex-direction:column; height:100%; min-height:0; }

  .eyebrow{
    display:inline-flex; align-items:center; gap:10px; width:fit-content;
    font-family:var(--font-display); font-size:16px; letter-spacing:.14em; text-transform:uppercase;
    color:var(--accent); font-weight:600; margin-bottom:14px;
  }
  .eyebrow .mark{ width:20px; height:20px; flex-shrink:0; }
  .slide-title{
    font-family:var(--font-display); font-weight:700; font-size:clamp(25px, 4vw, 46px);
    line-height:1.15; margin:0 0 22px 0; color:var(--text); letter-spacing:-0.01em;
  }
  .slide-title .hl{ color:var(--accent); }
  .slide-sub{ font-size:16px; color:var(--text-dim); margin:-14px 0 20px 0; max-width:60ch; line-height:1.55; }

  .content{ flex:1; min-height:0; overflow:auto; padding-right:4px; }
  .content::-webkit-scrollbar{ width:10px; }
  .content::-webkit-scrollbar-thumb{ background:var(--bg-alt); border-radius:8px; box-shadow:var(--sh-in-sm); }

  p, li{ font-size:16px; line-height:1.6; }
  ul, ol{ margin:0; padding-left:1.3em; }
  li{ margin-bottom:8px; color:var(--text); }
  li::marker{ color:var(--accent); }
  strong{ color:var(--text); font-weight:700; }
  a{ color:var(--accent); }

  .card{
    background:var(--bg-raised); border-radius:var(--radius-md); box-shadow:var(--sh-out);
    padding:22px 24px;
  }
  .card-in{ background:var(--bg-raised); border-radius:var(--radius-md); box-shadow:var(--sh-in); padding:22px 24px; }
  .card h3{ font-family:var(--font-display); font-size:19px; margin:0 0 10px 0; color:var(--text); display:flex; align-items:center; gap:10px;}
  .card h3 svg{ width:22px; height:22px; flex-shrink:0; }
  .card p, .card li{ font-size:16px; }
  .card .tag{ font-size:16px; color:var(--text-faint); }

  .grid{ display:grid; gap:20px; height:100%; min-height:0; }
  .grid-2{ grid-template-columns: minmax(0,1fr) minmax(0,1fr); }
  .grid-3{ grid-template-columns: repeat(3, minmax(0,1fr)); }
  .grid-4{ grid-template-columns: repeat(4, minmax(0,1fr)); }
  .grid-auto-fit{ grid-template-columns: repeat(auto-fit, minmax(200px,1fr)); }

  .badge{
    display:inline-flex; align-items:center; gap:8px; font-size:16px; font-weight:600;
    padding:8px 14px; border-radius:999px; background:var(--bg-raised); box-shadow:var(--sh-out-sm);
    color:var(--text);
  }
  .badge svg{ width:18px; height:18px; }
  .badge-row{ display:flex; flex-wrap:wrap; gap:12px; margin:14px 0; }

  table{ width:100%; border-collapse:separate; border-spacing:0; font-size:16px; }
  thead th{
    text-align:left; font-family:var(--font-display); font-size:16px; letter-spacing:.03em;
    color:var(--accent); padding:12px 16px; background:var(--bg-raised); box-shadow:var(--sh-in-sm);
  }
  thead th:first-child{ border-radius:var(--radius-sm) 0 0 var(--radius-sm); }
  thead th:last-child{ border-radius:0 var(--radius-sm) var(--radius-sm) 0; }
  tbody td{ padding:13px 16px; color:var(--text); border-bottom:1px solid rgba(255,255,255,0.04); vertical-align:top; }
  tbody tr:last-child td{ border-bottom:none; }
  .table-wrap{ background:var(--bg-raised); border-radius:var(--radius-md); box-shadow:var(--sh-out); padding:14px; }

  .icon-chip{
    width:56px; height:56px; border-radius:16px; background:var(--bg-raised); box-shadow:var(--sh-out-sm);
    display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  .icon-chip svg{ width:30px; height:30px; }

  .diagram-wrap{ background:var(--bg-raised); border-radius:var(--radius-md); box-shadow:var(--sh-out); padding:16px; overflow:hidden; }
  .diagram-wrap.pad-lg{ padding:22px; }
  svg.diagram{ display:block; width:100%; height:auto; max-height:100%; }
  .dg-box{ fill:var(--bg-alt); stroke:var(--accent); stroke-width:2; }
  .dg-box2{ fill:var(--bg-alt); stroke:var(--accent2); stroke-width:2; }
  .dg-box3{ fill:var(--bg-alt); stroke:var(--good); stroke-width:2; }
  .dg-line{ stroke:var(--text-dim); stroke-width:2; fill:none; }
  .dg-line-acc{ stroke:var(--accent); stroke-width:2; fill:none; }
  .dg-label{ fill:var(--text); font-size:16px; font-family:var(--font-body); font-weight:600; }
  .dg-label-sm{ fill:var(--text-dim); font-size:16px; font-family:var(--font-body); }
  .dg-title{ fill:var(--accent); font-size:16px; font-family:var(--font-display); font-weight:700; }

  .code-panel{
    display:flex; flex-direction:column; height:100%; min-height:0; overflow:hidden;
    background:var(--bg-raised); border-radius:var(--radius-md); box-shadow:var(--sh-out);
  }
  .code-header{
    flex-shrink:0; display:flex; align-items:center; justify-content:space-between;
    padding:12px 18px; font-size:16px; color:var(--text-dim); font-family:var(--font-mono);
    box-shadow:var(--sh-in-sm); border-radius:var(--radius-md) var(--radius-md) 0 0;
  }
  .copy-btn{
    font-family:var(--font-body); font-size:16px; font-weight:600; color:var(--text);
    background:var(--bg-raised); border:none; border-radius:999px; padding:7px 16px; cursor:pointer;
    box-shadow:var(--sh-out-sm); transition:box-shadow .15s ease, color .15s ease;
  }
  .copy-btn:active, .copy-btn.copied{ box-shadow:var(--sh-in-sm); color:var(--good); }
  .code-panel pre{
    flex:1; min-height:0; overflow:auto; margin:0; padding:18px 20px; font-family:var(--font-mono);
    font-size:16px; line-height:1.6; color:var(--text);
  }
  .code-panel pre::-webkit-scrollbar{ width:10px; }
  .code-panel pre::-webkit-scrollbar-thumb{ background:var(--bg); border-radius:8px; }
  .tok-kw{ color:var(--accent); }
  .tok-str{ color:var(--good); }
  .tok-com{ color:var(--text-faint); font-style:italic; }
  .tok-fn{ color:var(--accent2); }
  .tok-num{ color:#c9a3ff; }
  .tok-tag{ color:var(--accent); }

  .row-fixed{ height:min(560px,62vh); min-height:0; }
  .stretch{ align-items:stretch; height:100%; min-height:0; }

  .quote-card{
    background:var(--bg-raised); border-radius:var(--radius-lg); box-shadow:var(--sh-out);
    padding:30px 36px; display:flex; flex-direction:column; gap:12px; height:100%;
  }
  .quote-card .mark-q{ font-family:var(--font-display); font-size:44px; color:var(--accent); line-height:1; }
  .quote-card p{ font-size:19px; line-height:1.6; font-style:italic; color:var(--text); }
  .quote-card .who{ font-size:16px; color:var(--text-dim); font-style:normal; }

  .mcq{ background:var(--bg-raised); border-radius:var(--radius-md); box-shadow:var(--sh-out); padding:18px 20px; }
  .mcq .qn{ font-weight:700; margin-bottom:10px; font-size:16px; }
  .mcq ol{ list-style:none; padding:0; margin:0; display:flex; flex-direction:column; gap:6px; }
  .mcq li{ font-size:16px; padding:8px 12px; border-radius:10px; box-shadow:var(--sh-in-sm); margin-bottom:0; }
  .mcq li::marker{ content:none; }

  .id-item{ background:var(--bg-raised); border-radius:var(--radius-sm); box-shadow:var(--sh-out-sm); padding:14px 18px; font-size:16px; }
  .id-item .num{ color:var(--accent); font-weight:700; margin-right:8px; }

  .answer-item{ background:var(--bg-raised); border-radius:var(--radius-sm); box-shadow:var(--sh-out-sm); padding:14px 18px; margin-bottom:10px; }
  .answer-item .a-head{ font-weight:700; color:var(--good); font-size:16px; margin-bottom:4px; }
  .answer-item .a-body{ font-size:16px; color:var(--text-dim); }

  .recap-list{ display:flex; flex-direction:column; gap:12px; }
  .recap-list .item{ display:flex; gap:14px; align-items:flex-start; background:var(--bg-raised); border-radius:var(--radius-sm); box-shadow:var(--sh-out-sm); padding:14px 18px; }
  .recap-list .item svg{ width:24px; height:24px; flex-shrink:0; margin-top:2px; }

  .hero-wrap{ display:flex; align-items:center; gap:48px; height:100%; }
  .hero-text{ flex:1.1; min-width:0; }
  .hero-title{ font-family:var(--font-display); font-weight:800; font-size:clamp(32px,5.4vw,64px); line-height:1.08; margin:0 0 18px 0; letter-spacing:-0.02em;}
  .hero-title .hl{ color:var(--accent); }
  .hero-sub{ font-size:18px; color:var(--text-dim); max-width:52ch; line-height:1.6; margin-bottom:26px;}
  .hero-art{ flex:0.9; display:flex; align-items:center; justify-content:center; min-width:0; }
  .hero-art svg{ width:100%; max-width:420px; height:auto; }

  .progress-track{ position:fixed; bottom:0; left:0; width:100%; height:5px; background:var(--bg-alt); box-shadow:var(--sh-in-sm); z-index:50; }
  .progress-bar{ height:100%; background:linear-gradient(90deg, var(--accent), var(--accent2)); transition:width .3s ease; }
  .counter{
    position:fixed; bottom:14px; right:22px; font-size:16px; font-family:var(--font-mono); color:var(--text-dim);
    background:var(--bg-raised); box-shadow:var(--sh-out-sm); padding:6px 14px; border-radius:999px; z-index:50;
  }

  .shortcuts-overlay{
    position:fixed; inset:0; background:rgba(10,11,14,0.72); backdrop-filter: blur(4px);
    display:flex; align-items:center; justify-content:center; z-index:100; opacity:0; visibility:hidden;
    transition:opacity .2s ease;
  }
  .shortcuts-overlay.show{ opacity:1; visibility:visible; }
  .shortcuts-box{
    background:var(--bg); border-radius:var(--radius-lg); box-shadow:var(--sh-out); padding:34px 40px;
    max-width:520px; width:90%;
  }
  .shortcuts-box h2{ font-family:var(--font-display); font-size:22px; margin:0 0 18px 0; color:var(--accent); }
  .shortcuts-box .row{ display:flex; justify-content:space-between; align-items:center; padding:10px 0; border-bottom:1px solid rgba(255,255,255,0.06); font-size:16px; }
  .shortcuts-box .row:last-child{ border-bottom:none; }
  .kbd{ font-family:var(--font-mono); background:var(--bg-raised); box-shadow:var(--sh-out-sm); padding:4px 10px; border-radius:8px; font-size:16px; }

  .fs-toggle{
    position:fixed; top:16px; right:22px; z-index:50; background:var(--bg-raised); box-shadow:var(--sh-out-sm);
    border:none; border-radius:999px; width:40px; height:40px; display:flex; align-items:center; justify-content:center; cursor:pointer;
  }
  .fs-toggle svg{ width:18px; height:18px; color:var(--text-dim); }
  .fs-toggle:active{ box-shadow:var(--sh-in-sm); }

  .center-col{ display:flex; align-items:center; justify-content:center; height:100%; }
  .closing-wrap{ text-align:center; max-width:70ch; margin:0 auto; }
  .closing-wrap svg{ width:90px; height:90px; margin:0 auto 18px auto; display:block; }
  .closing-wrap .quote{ font-size:22px; font-style:italic; color:var(--text); line-height:1.5; margin-bottom:14px; }
  .closing-wrap .who{ font-size:16px; color:var(--text-dim); margin-bottom:26px; }
  .closing-wrap .bye{ font-family:var(--font-display); font-size:26px; color:var(--accent); font-weight:700; }

  @media (max-width: 720px){
    .grid-2, .grid-3, .grid-4{ grid-template-columns: 1fr; }
    .row-fixed{ height:auto; }
    .hero-wrap{ flex-direction:column; }
    .hero-art{ order:-1; }
  }
</style>
</head>
<body>

<div id="deck"></div>
<div class="progress-track"><div class="progress-bar" id="progressBar" style="width:0%"></div></div>
<div class="counter" id="counter">1 / 1</div>
<button class="fs-toggle" id="fsToggle" title="Fullscreen">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 3H5a2 2 0 0 0-2 2v3M16 3h3a2 2 0 0 1 2 2v3M8 21H5a2 2 0 0 1-2-2v-3M16 21h3a2 2 0 0 0 2-2v-3"/></svg>
</button>

<div class="shortcuts-overlay" id="shortcutsOverlay">
  <div class="shortcuts-box">
    <h2>Keyboard &amp; Mouse Shortcuts</h2>
    <div class="row"><span>Next slide</span><span class="kbd">→ / Right-click / Mouse4</span></div>
    <div class="row"><span>Previous slide</span><span class="kbd">← / Mouse3</span></div>
    <div class="row"><span>First slide</span><span class="kbd">Home</span></div>
    <div class="row"><span>Last slide</span><span class="kbd">End</span></div>
    <div class="row"><span>This overlay</span><span class="kbd">?</span></div>
    <div class="row"><span>Swipe</span><span class="kbd">← / → on mobile</span></div>
  </div>
</div>

<script>
// ---------- Reusable inline icon library (all inherit currentColor via CSS vars) ----------
const ICONS = {

  feather: '<svg viewBox="0 0 24 24" fill="none" stroke="var(--good)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" role="img"><title>Simplicity</title><path d="M20.24 12.24a6 6 0 0 0-8.49-8.49L5 10.5V19h8.5z"/><path d="M16 8L2 22"/><path d="M17.5 15H9"/></svg>',

// ---------- Code highlighter (very small single-pass tokenizer) ----------
function hl(code, lang){
  const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  code = esc(code);
  const kw = {
    js: /\b(const|let|var|function|return|if|else|async|await|import|from|export|new|class|extends|try|catch|for|of|in|require)\b/g,
    json: /(&quot;|"){0}/,
  };
  // strings
  code = code.replace(/(&quot;.*?&quot;|'[^']*'|"[^"]*")/g, m=>'<span class="tok-str">'+m+'</span>');
  // comments (line)
  code = code.replace(/(\/\/[^\n]*)/g, m=>'<span class="tok-com">'+m+'</span>');
  if(lang!=='json'){
    code = code.replace(/\b(const|let|var|function|return|if|else|async|await|import|from|export|new|class|extends|try|catch|for|of|in|require|GET|POST|PUT|PATCH|DELETE)\b/g, m=>'<span class="tok-kw">'+m+'</span>');
    code = code.replace(/\b([a-zA-Z_][a-zA-Z0-9_]*)(?=\()/g, m=>'<span class="tok-fn">'+m+'</span>');
  }
  code = code.replace(/\b(\d+)\b/g, m=>'<span class="tok-num">'+m+'</span>');
  return code;
}
function codePanel(title, lang, code){
  const id = 'code_'+Math.random().toString(36).slice(2,9);
  return '<div class="code-panel">'+
    '<div class="code-header"><span>'+title+'</span><button class="copy-btn" data-target="'+id+'">Copy</button></div>'+
    '<pre id="'+id+'"><code>'+hl(code, lang)+'</code></pre>'+
  '</div>';
}

    ['MCQ 5','PUT / PATCH &mdash; used to update an existing resource.']
  ];
  const idAns = [
    ['ID 1','Monolithic architecture.'],
    ['ID 2','Separation of Concerns.'],
    ['ID 3','The ViewModel.'],
    ['ID 4','Service-Oriented Architecture (SOA).'],
    ['ID 5','GraphQL.']
  ];
  return '<div class="slide-inner">'+
  '<div class="eyebrow"><span class="mark">'+ICONS.check+'</span>Answer Key</div>'+
  '<h1 class="slide-title">Check Your <span class="hl">Answers</span></h1>'+
  '<div class="content"><div class="grid grid-2" style="height:auto;">'+
  '<div>'+mcqAns.map(a=>'<div class="answer-item"><div class="a-head">'+a[0]+'</div><div class="a-body">'+a[1]+'</div></div>').join('')+'</div>'+
  '<div>'+idAns.map(a=>'<div class="answer-item"><div class="a-head">'+a[0]+'</div><div class="a-body">'+a[1]+'</div></div>').join('')+'</div>'+
  '</div></div></div>';
});

// 26. Closing
SLIDES.push(function(){
  return '<div class="slide-inner"><div class="center-col"><div class="closing-wrap">'+
  ICONS.party+
  '<p class="quote">&ldquo;Good architecture isn&rsquo;t about picking the fanciest pattern &mdash; it&rsquo;s about matching the pattern to the project.&rdquo;</p>'+
  '<p class="who">&mdash; Key takeaway, Integrative Programming</p>'+
  '<p class="bye">Nice work getting through the blueprint. Now go build something well-structured! ✅</p>'+
  '</div></div></div>';
});

// ---------- Render + navigation ----------
const deckEl = document.getElementById('deck');
let current = 0;
let renderedHTML = new Array(SLIDES.length);

function buildSlideDiv(i){
  const div = document.createElement('div');
  div.className = 'slide';
  div.dataset.index = i;
  div.innerHTML = SLIDES[i]();
  deckEl.appendChild(div);
  return div;
}
const slideDivs = SLIDES.map((_,i)=>buildSlideDiv(i));

function updateCounter(){
  document.getElementById('counter').textContent = (current+1)+' / '+SLIDES.length;
  document.getElementById('progressBar').style.width = (((current+1)/SLIDES.length)*100)+'%';
}

function goTo(i){
  if(i<0) i=0;
  if(i>=SLIDES.length) i=SLIDES.length-1;
  if(i===current){ showOnly(i); return; }
  const dir = i>current ? 1 : -1;
  slideDivs[current].classList.remove('active');
  if(dir>0) slideDivs[current].classList.add('prev');
  current = i;
  slideDivs.forEach((d,idx)=>{ if(idx!==current){ d.classList.remove('active'); } });
  slideDivs[current].classList.remove('prev');
  slideDivs[current].classList.add('active');
  updateCounter();
}
function showOnly(i){
  slideDivs.forEach((d,idx)=> d.classList.toggle('active', idx===i));
  updateCounter();
}
showOnly(0);

function next(){ goTo(current+1); }
function prev(){ goTo(current-1); }

// Keyboard
window.addEventListener('keydown', (e)=>{
  if(e.key === '?'){ toggleShortcuts(); return; }
  if(e.key === 'Escape'){ closeShortcuts(); return; }
  if(document.getElementById('shortcutsOverlay').classList.contains('show')) return;
  if(e.key === 'ArrowRight' || e.key === 'PageDown'){ next(); }
  else if(e.key === 'ArrowLeft' || e.key === 'PageUp'){ prev(); }
  else if(e.key === 'Home'){ goTo(0); }
  else if(e.key === 'End'){ goTo(SLIDES.length-1); }
});

// Mouse: right-click / back-forward buttons navigate; left click stays free
document.addEventListener('contextmenu', (e)=>{ e.preventDefault(); next(); });
document.addEventListener('mousedown', (e)=>{
  if(e.button === 3){ e.preventDefault(); e.stopImmediatePropagation(); prev(); }
  else if(e.button === 4){ e.preventDefault(); e.stopImmediatePropagation(); next(); }
}, true);
window.addEventListener('popstate', (e)=>{ e.preventDefault(); });

// Copy buttons (event delegation) — copies the raw text content of the <pre>
deckEl.addEventListener('click', (e)=>{
  const btn = e.target.closest('.copy-btn');
  if(!btn) return;
  const pre = document.getElementById(btn.dataset.target);
  const text = pre.innerText;
  navigator.clipboard.writeText(text).then(()=>{
    btn.classList.add('copied');
    const old = btn.textContent;
    btn.textContent = 'Copied!';
    setTimeout(()=>{ btn.classList.remove('copied'); btn.textContent = old; }, 1400);
  }).catch(()=>{
    btn.textContent = 'Press Ctrl+C';
    setTimeout(()=>{ btn.textContent = 'Copy'; }, 1400);
  });
});

// Shortcuts overlay
function toggleShortcuts(){
  document.getElementById('shortcutsOverlay').classList.toggle('show');
}
function closeShortcuts(){
  document.getElementById('shortcutsOverlay').classList.remove('show');
}
document.getElementById('shortcutsOverlay').addEventListener('click', (e)=>{
  if(e.target.id === 'shortcutsOverlay') closeShortcuts();
});

// Swipe (mobile)
let touchStartX = null;
window.addEventListener('touchstart', (e)=>{ touchStartX = e.changedTouches[0].clientX; }, {passive:true});
window.addEventListener('touchend', (e)=>{
  if(touchStartX===null) return;
  const dx = e.changedTouches[0].clientX - touchStartX;
  if(Math.abs(dx) > 50){ dx<0 ? next() : prev(); }
  touchStartX = null;
}, {passive:true});

// Fullscreen toggle
document.getElementById('fsToggle').addEventListener('click', ()=>{
  if(!document.fullscreenElement){ document.documentElement.requestFullscreen().catch(()=>{}); }
  else{ document.exitFullscreen().catch(()=>{}); }
});

updateCounter();
</script>
</body>
</html>
