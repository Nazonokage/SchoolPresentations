<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Web Design in 30 Minutes — HTML, CSS &amp; JavaScript</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-base:#14161c;
    --bg-panel:#1a1d25;
    --bg-panel-2:#20232d;
    --line:#2a2e3a;
    --text-primary:#eceef2;
    --text-muted:#8b93a7;
    --text-dim:#5b6272;
    --accent-html:#ff8a5c;
    --accent-css:#6cc6ff;
    --accent-js:#ffd866;
    --accent-html-dim:rgba(255,138,92,0.12);
    --accent-css-dim:rgba(108,198,255,0.12);
    --accent-js-dim:rgba(255,216,102,0.12);
    --green:#8fd48a;
    --pink:#ff9edb;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{
    height:100%;
    background:var(--bg-base);
    color:var(--text-primary);
    font-family:'Inter',sans-serif;
    overflow:hidden;
    -webkit-font-smoothing:antialiased;
  }
  ::selection{ background:rgba(255,255,255,0.15); }

  /* ---------- shell ---------- */
  #shell{
    position:relative;
    height:100vh;
    width:100vw;
    display:flex;
    flex-direction:column;
  }

  /* ---------- top progress rail ---------- */
  #progress-rail{
    position:fixed; top:0; left:0; right:0; height:3px;
    background:var(--line); z-index:50;
  }
  #progress-fill{
    height:100%; width:0%;
    background:linear-gradient(90deg,var(--accent-html),var(--accent-css),var(--accent-js));
    transition:width .35s ease;
  }

  /* ---------- editor tab bar ---------- */
  #tabbar{
    height:44px;
    display:flex;
    align-items:stretch;
    background:var(--bg-panel);
    border-bottom:1px solid var(--line);
    padding-left:18px;
    flex-shrink:0;
    -webkit-app-region:no-drag;
  }
  #tabbar .dots{
    display:flex; align-items:center; gap:7px; padding-right:18px; margin-right:6px; border-right:1px solid var(--line);
  }
  #tabbar .dots span{ width:10px; height:10px; border-radius:50%; background:var(--line); }
  .tab{
    display:flex; align-items:center; gap:8px;
    padding:0 18px;
    font-family:'JetBrains Mono',monospace;
    font-size:12.5px;
    color:var(--text-dim);
    border-right:1px solid var(--line);
    position:relative;
    transition:color .3s ease;
    letter-spacing:.2px;
  }
  .tab .dot{ width:6px; height:6px; border-radius:50%; background:currentColor; opacity:.4; }
  .tab.active{ color:var(--text-primary); background:var(--bg-panel-2); }
  .tab.active .dot{ opacity:1; }
  .tab.active::after{
    content:''; position:absolute; bottom:-1px; left:0; right:0; height:2px;
  }
  .tab[data-file="html"].active{ }
  .tab[data-file="html"].active::after{ background:var(--accent-html); }
  .tab[data-file="css"].active::after{ background:var(--accent-css); }
  .tab[data-file="js"].active::after{ background:var(--accent-js); }
  .tab[data-file="html"].active .dot{ color:var(--accent-html); }
  .tab[data-file="css"].active .dot{ color:var(--accent-css); }
  .tab[data-file="js"].active .dot{ color:var(--accent-js); }

  /* ---------- main stage ---------- */
  #stage{
    flex:1;
    display:flex;
    position:relative;
    overflow:hidden;
  }

  /* line-number rail */
  #rail{
    width:64px;
    flex-shrink:0;
    background:var(--bg-panel);
    border-right:1px solid var(--line);
    display:flex; flex-direction:column; align-items:center;
    padding-top:22px;
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    color:var(--text-dim);
    gap:0;
    overflow:hidden;
  }
  #rail .num{
    height:14px;
    line-height:14px;
    margin-bottom:11px;
    transition:color .3s ease, transform .3s ease;
  }
  #rail .num.current{ color:var(--text-primary); font-weight:700; transform:scale(1.15); }

  /* slide viewport */
  #viewport{
    flex:1;
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:48px 64px;
    cursor:pointer;
  }

  .slide{
    position:absolute;
    inset:0;
    display:flex;
    padding:40px 72px;
    opacity:0;
    transform:translateY(18px) scale(.985);
    pointer-events:none;
    overflow-y:auto;
    overflow-x:hidden;
    transition:opacity .4s cubic-bezier(.2,.7,.3,1), transform .45s cubic-bezier(.2,.7,.3,1);
    scrollbar-width:thin;
    scrollbar-color:var(--line) transparent;
  }
  .slide::-webkit-scrollbar{ width:8px; }
  .slide::-webkit-scrollbar-thumb{ background:var(--line); border-radius:4px; }
  .slide::-webkit-scrollbar-track{ background:transparent; }
  .slide.active{
    opacity:1;
    transform:translateY(0) scale(1);
    pointer-events:auto;
  }
  .slide-inner{
    width:100%;
    max-width:980px;
    margin:auto;
    padding-bottom:8px;
  }

  .eyebrow{
    font-family:'JetBrains Mono',monospace;
    font-size:12.5px;
    letter-spacing:1.5px;
    text-transform:uppercase;
    margin-bottom:14px;
    display:flex; align-items:center; gap:10px;
  }
  .eyebrow .bracket{ opacity:.5; }
  h1.slide-title, h2.slide-title{
    font-family:'JetBrains Mono',monospace;
    font-weight:700;
    line-height:1.15;
    letter-spacing:-.5px;
    margin-bottom:26px;
  }
  h1.slide-title{ font-size:clamp(34px,4.6vw,58px); }
  h2.slide-title{ font-size:clamp(26px,3.2vw,38px); }

  .subtitle{
    font-size:19px; color:var(--text-muted); margin-bottom:8px; font-weight:500;
  }
  .presenter{ font-size:14px; color:var(--text-dim); margin-bottom:34px; font-family:'JetBrains Mono',monospace; }

  .quote-block{
    border-left:3px solid var(--accent-js);
    padding:14px 22px;
    background:var(--accent-js-dim);
    border-radius:0 8px 8px 0;
    font-size:17px;
    color:var(--text-primary);
    max-width:640px;
    margin-top:8px;
    font-style:italic;
  }

  ul.bullets{ list-style:none; display:flex; flex-direction:column; gap:12px; margin-bottom:8px; }
  ul.bullets li{
    font-size:16.5px; color:var(--text-primary); line-height:1.55;
    padding-left:20px; position:relative;
  }
  ul.bullets li::before{
    content:'›'; position:absolute; left:0; top:0;
    color:var(--tab-accent, var(--accent-html));
    font-weight:700;
  }
  ul.bullets li b, ul.bullets li strong{ color:var(--text-primary); font-weight:700;}
  ul.bullets li .hl{ color:var(--tab-accent, var(--accent-html)); font-weight:600; }
  ul.bullets.numbered{ counter-reset: item; }
  ul.bullets.numbered li{ padding-left:30px; }
  ul.bullets.numbered li::before{
    counter-increment:item; content: counter(item);
    font-family:'JetBrains Mono',monospace; font-size:12px;
    width:18px; height:18px; border-radius:4px;
    background:var(--tab-accent-dim, var(--accent-html-dim));
    color:var(--tab-accent, var(--accent-html));
    display:flex; align-items:center; justify-content:center;
    top:1px;
  }

  .two-col{ display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:34px; align-items:start; min-width:0; }
  .two-col > *{ min-width:0; }

  .tri-grid{ display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:18px; margin-top:6px; min-width:0; }
  .tri-card{
    min-width:0;
    background:var(--bg-panel-2);
    border:1px solid var(--line);
    border-radius:12px;
    padding:18px;
  }
  .tri-card .col-title{ margin-bottom:8px; }
  .tri-desc{ font-size:13.5px; color:var(--text-muted); line-height:1.55; margin-bottom:4px; min-height:40px; }
  .tri-card .code-block{ margin-top:10px; }
  .tri-card .code-head{ padding:6px 12px; font-size:10.5px; }
  .tri-card pre.code{ font-size:12px; padding:12px 14px; line-height:1.55; }
  .col-title{
    font-family:'JetBrains Mono',monospace; font-weight:700; font-size:14px;
    color:var(--tab-accent,var(--accent-html)); margin-bottom:10px; letter-spacing:.3px;
  }

  .code-block{
    background:var(--bg-panel-2);
    border:1px solid var(--line);
    border-radius:10px;
    overflow:hidden;
    margin-top:14px;
    min-width:0;
    box-shadow:0 8px 24px rgba(0,0,0,0.25);
  }
  .code-head{
    display:flex; align-items:center; justify-content:space-between;
    padding:8px 14px;
    border-bottom:1px solid var(--line);
    font-family:'JetBrains Mono',monospace;
    font-size:11.5px;
    color:var(--text-dim);
  }
  .code-head .fname{ color:var(--text-muted); }
  pre.code{
    margin:0; padding:16px 18px;
    font-family:'JetBrains Mono',monospace;
    font-size:13.5px; line-height:1.65;
    overflow:auto;
    color:#c9cdd6;
    white-space:pre;
  }
  .tk-tag{ color:#ff8a5c; }
  .tk-attr{ color:#ffd866; }
  .tk-str{ color:#8fd48a; }
  .tk-comment{ color:#5b6272; font-style:italic; }
  .tk-kw{ color:#ff9edb; }
  .tk-prop{ color:#6cc6ff; }
  .tk-val{ color:#8fd48a; }
  .tk-num{ color:#ffd866; }
  .tk-sel{ color:#ff8a5c; font-weight:600; }
  .tk-punct{ color:#8b93a7; }

  table.ref{ width:100%; border-collapse:collapse; margin-top:10px; font-size:14px; }
  table.ref th{
    text-align:left; font-family:'JetBrains Mono',monospace; font-size:11.5px;
    color:var(--text-dim); text-transform:uppercase; letter-spacing:.5px;
    padding:8px 12px; border-bottom:1px solid var(--line);
  }
  table.ref td{
    padding:9px 12px; border-bottom:1px solid var(--line); color:var(--text-primary);
  }
  table.ref td:first-child{ font-family:'JetBrains Mono',monospace; color:var(--tab-accent,var(--accent-html)); }
  table.ref tr:last-child td{ border-bottom:none; }

  .footer-note{
    margin-top:22px; font-size:13.5px; color:var(--text-dim);
    font-family:'JetBrains Mono',monospace;
  }
  .footer-note b{ color:var(--text-muted); }

  .badge-row{ display:flex; gap:10px; margin-top:18px; flex-wrap:wrap; }
  .badge{
    font-family:'JetBrains Mono',monospace; font-size:12px;
    padding:6px 12px; border-radius:20px;
    border:1px solid var(--line); color:var(--text-muted);
  }

  .cta-box{
    margin-top:28px; padding:20px 24px;
    border:1px solid var(--line); border-radius:12px;
    background:var(--bg-panel-2);
  }
  .cta-box .cta-title{ font-family:'JetBrains Mono',monospace; font-weight:700; font-size:15px; color:var(--accent-js); margin-bottom:6px; }
  .cta-box p{ font-size:14.5px; color:var(--text-muted); line-height:1.6; }

  /* ---------- nav affordances ---------- */
  #nav-hint{
    position:fixed; bottom:16px; left:50%; transform:translateX(-50%);
    font-family:'JetBrains Mono',monospace; font-size:11.5px; color:var(--text-dim);
    display:flex; align-items:center; gap:8px; z-index:40;
    background:rgba(20,22,28,0.7); backdrop-filter:blur(6px);
    padding:6px 14px; border-radius:20px; border:1px solid var(--line);
    opacity:1; transition:opacity .6s ease;
  }
  #nav-hint kbd{
    background:var(--bg-panel-2); border:1px solid var(--line);
    border-radius:4px; padding:1px 6px; color:var(--text-muted); font-size:11px;
  }
  #nav-hint.fade{ opacity:0; }

  #counter{
    position:fixed; top:12px; right:20px; z-index:40;
    font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--text-dim);
    letter-spacing:.5px;
  }
  #counter b{ color:var(--text-primary); }

  .edge-btn{
    position:fixed; top:0; bottom:0; width:64px; z-index:30;
    display:flex; align-items:center; justify-content:center;
    color:var(--text-dim); font-size:20px;
    opacity:0; transition:opacity .2s ease, color .2s ease;
    background:linear-gradient(90deg, rgba(0,0,0,0.15), transparent);
  }
  .edge-btn:hover{ opacity:1; color:var(--text-primary); }
  #edge-prev{ left:0; }
  #edge-next{ right:0; transform:scaleX(-1); background:linear-gradient(90deg, rgba(0,0,0,0.15), transparent); }

  @media (max-width:820px){
    #rail{ width:36px; }
    .two-col{ grid-template-columns:1fr; }
    .tri-grid{ grid-template-columns:1fr; }
    .slide{ padding:24px 26px; }
    h1.slide-title{ font-size:32px; }
  }

  @media (prefers-reduced-motion: reduce){
    .slide{ transition:opacity .2s linear; transform:none !important; }
  }
</style>
</head>
<body>

<div id="progress-rail"><div id="progress-fill"></div></div>

<div id="shell">
  <div id="tabbar">
    <div class="dots"><span></span><span></span><span></span></div>
    <div class="tab" data-file="html"><span class="dot"></span>index.html</div>
    <div class="tab" data-file="css"><span class="dot"></span>style.css</div>
    <div class="tab" data-file="js"><span class="dot"></span>script.js</div>
  </div>

  <div id="stage">
    <div id="rail"></div>
    <div id="viewport">
      <div id="slides"></div>
    </div>
  </div>
</div>

<div class="edge-btn" id="edge-prev">‹</div>
<div class="edge-btn" id="edge-next">‹</div>
<div id="counter"><b id="counter-cur">1</b> / <span id="counter-total">27</span></div>
<div id="nav-hint">click / <kbd>→</kbd> next &nbsp;·&nbsp; <kbd>←</kbd> back</div>

<script>
/* ============ Syntax highlight (lightweight, presentational only) ============ */
function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function hlHTML(code){
  const s = esc(code);
  const re = /(&lt;!--[\s\S]*?--&gt;)|(&lt;\/?)([a-zA-Z][\w-]*)|([a-zA-Z-]+)(=)("[^"]*")/g;
  return s.replace(re, (m, comment, bracket, tag, attrName, eq, attrVal) => {
    if(comment) return `<span class="tk-comment">${comment}</span>`;
    if(bracket) return `${bracket}<span class="tk-tag">${tag}</span>`;
    if(attrName) return `<span class="tk-attr">${attrName}</span>${eq}<span class="tk-str">${attrVal}</span>`;
    return m;
  });
}
function hlCSS(code){
  const s = esc(code);
  const re = /(\/\*[\s\S]*?\*\/)|([#.]?[a-zA-Z][\w-]*)(\s*\{)|([a-zA-Z-]+)(\s*:\s*)([^;{}]+)(;)/g;
  return s.replace(re, (m, comment, sel, brace, prop, colon, val, semi) => {
    if(comment) return `<span class="tk-comment">${comment}</span>`;
    if(sel) return `<span class="tk-sel">${sel}</span>${brace}`;
    if(prop) return `<span class="tk-prop">${prop}</span>${colon}<span class="tk-val">${val}</span>${semi}`;
    return m;
  });
}
function hlJS(code){
  const s = esc(code);
  const kws = ['var','let','const','function','if','else','for','return','true','false','new'];
  const kwAlt = kws.join('|');
  const re = new RegExp(
    '(\\/\\/.*$)' +
    '|("(?:[^"\\\\]|\\\\.)*"|\'(?:[^\'\\\\]|\\\\.)*\')' +
    '|\\b(' + kwAlt + ')\\b' +
    '|\\b(\\d+(?:\\.\\d+)?)\\b'
  , 'gm');
  return s.replace(re, (m, comment, str, kw, num) => {
    if(comment) return `<span class="tk-comment">${comment}</span>`;
    if(str) return `<span class="tk-str">${str}</span>`;
    if(kw) return `<span class="tk-kw">${kw}</span>`;
    if(num) return `<span class="tk-num">${num}</span>`;
    return m;
  });
}
function code(lang, filename, raw){
  const fn = lang==='html'?hlHTML:lang==='css'?hlCSS:hlJS;
  return `<div class="code-block">
    <div class="code-head"><span class="fname">${filename||('example.'+lang)}</span><span>${lang.toUpperCase()}</span></div>
    <pre class="code">${fn(raw)}</pre>
  </div>`;
}

/* ============ Slide content ============ */
const S = []; // {file:'html'|'css'|'js'|'title', html: '...'}

function slide(file, html){ S.push({file, html}); }

/* ---- Title ---- */
slide('title', `
  <div class="eyebrow" style="color:var(--accent-js)"><span class="bracket">&lt;</span>crash course<span class="bracket">/&gt;</span></div>
  <h1 class="slide-title">Web Design in 30 Minutes</h1>
  <div class="subtitle">HTML, CSS &amp; JavaScript — a crash course for beginners</div>
  <div class="presenter">presenter: <span style="color:var(--text-muted)">[Your Name Here]</span></div>
  <div class="quote-block">Learning web design is a profitable skill for any career — and life in general.</div>
`);

/* ---- Tools ---- */
slide('html', `
  <div class="eyebrow" style="color:var(--accent-html)">setup</div>
  <h2 class="slide-title">Setting Up Your Development Environment</h2>
  <ul class="bullets" style="--tab-accent:var(--accent-html)">
    <li><span class="hl">Text editor</span> — the software you'll use to write your code.</li>
    <li><b>Recommended:</b> VS Code (Visual Studio Code) — search "VS Code," download the build for your OS (Mac, Windows, Linux).</li>
    <li><span class="hl">Web browser</span> — used to view and test your pages (Chrome, Firefox, etc).</li>
  </ul>
  <div class="footer-note"><b>Note —</b> Sublime Text or Notepad++ work fine too. Chrome is recommended for its Developer Tools.</div>
`);

/* ---- First HTML Page ---- */
slide('html', `
  <div class="eyebrow" style="color:var(--accent-html)">html basics</div>
  <h2 class="slide-title">Your First HTML Page</h2>
  <div class="two-col">
    <div>
      <div class="col-title">Instructions</div>
      <ul class="bullets numbered" style="--tab-accent:var(--accent-html); --tab-accent-dim:var(--accent-html-dim)">
        <li>Create a folder on your desktop named <code>HTML</code>.</li>
        <li>Open the folder in VS Code.</li>
        <li>Create a file named <code>index.html</code>.</li>
        <li>Type <code>Hello World</code> and save.</li>
        <li>Double-click the file to open it in your browser.</li>
      </ul>
    </div>
    <div>
      <div class="col-title">What is HTML?</div>
      <ul class="bullets" style="--tab-accent:var(--accent-html)">
        <li>HyperText Markup Language.</li>
        <li>It's the <b>structure</b> of a web page.</li>
        <li>Think of it as the skeleton of a building.</li>
      </ul>
      ${code('html','index.html','Hello World')}
    </div>
  </div>
`);

/* ---- Syntax & tags ---- */
slide('html', `
  <div class="eyebrow" style="color:var(--accent-html)">syntax</div>
  <h2 class="slide-title">HTML Syntax: Tags &amp; Document Structure</h2>
  <div class="two-col">
    <div>
      <ul class="bullets" style="--tab-accent:var(--accent-html)">
        <li>Every document starts with <code>&lt;!DOCTYPE html&gt;</code>.</li>
        <li><b>&lt;html&gt;</b> — the root element.</li>
        <li><b>&lt;head&gt;</b> — meta-information (title, styles).</li>
        <li><b>&lt;body&gt;</b> — the visible content.</li>
        <li><b>Tag</b> — text in angle brackets, e.g. <code>&lt;p&gt;</code>.</li>
        <li>Always close a tag with <code>/</code>: <code>&lt;p&gt;...&lt;/p&gt;</code></li>
      </ul>
    </div>
    <div>
      ${code('html','index.html', `<!DOCTYPE html>
<html>
<head>
    <title>My First Webpage</title>
</head>
<body>
    <p>Hello, world!</p>
</body>
</html>`)}
    </div>
  </div>
`);

/* ---- Common elements ---- */
slide('html', `
  <div class="eyebrow" style="color:var(--accent-html)">elements</div>
  <h2 class="slide-title">Essential HTML Tags for Content</h2>
  <div class="two-col">
    <div>
      <ul class="bullets" style="--tab-accent:var(--accent-html)">
        <li><b>Headings</b> — <code>&lt;h1&gt;</code> to <code>&lt;h6&gt;</code> (h1 is largest).</li>
        <li><b>Paragraphs</b> — <code>&lt;p&gt;</code> for text blocks.</li>
        <li><b>Lists</b> — <code>&lt;ul&gt;</code> with <code>&lt;li&gt;</code> items.</li>
        <li><b>Links</b> — <code>&lt;a&gt;</code> with an <code>href</code> attribute.</li>
        <li><b>Images</b> — <code>&lt;img&gt;</code> with <code>src</code> (self-closing).</li>
      </ul>
    </div>
    <div>
      ${code('html','index.html', `<body>
    <h1>This is a Heading</h1>
    <p>This is a paragraph of text.</p>

    <ul>
        <li>Eggs</li>
        <li>Milk</li>
        <li>Cheese</li>
    </ul>

    <a href="https://google.com">Link to Google</a>
    <br>
    <img src="image_url_here.jpg" alt="My Image">
</body>`)}
    </div>
  </div>
`);

/* ---- Advanced elements ---- */
slide('html', `
  <div class="eyebrow" style="color:var(--accent-html)">structure</div>
  <h2 class="slide-title">Tables, Divs &amp; Forms</h2>
  <div class="tri-grid">
    <div class="tri-card">
      <div class="col-title">Tables</div>
      <p class="tri-desc">For structuring tabular data.</p>
      ${code('html','index.html', `<table border="1">
  <tr>
    <td>Row 1, Cell 1</td>

/* ============ Render ============ */
const slidesEl = document.getElementById('slides');
const railEl = document.getElementById('rail');
S.forEach((s,i)=>{
  const div = document.createElement('div');
  div.className = 'slide';
  div.dataset.index = i;
  div.innerHTML = `<div class="slide-inner">${s.html}</div>`;
  slidesEl.appendChild(div);

  const num = document.createElement('div');
  num.className = 'num';
  num.textContent = String(i+1).padStart(2,'0');
  railEl.appendChild(num);
});

document.getElementById('counter-total').textContent = S.length;

let cur = 0;
const slideNodes = document.querySelectorAll('.slide');
const railNodes = document.querySelectorAll('#rail .num');
const tabs = document.querySelectorAll('.tab');

function render(){
  slideNodes.forEach((n,i)=> n.classList.toggle('active', i===cur));
  railNodes.forEach((n,i)=> n.classList.toggle('current', i===cur));
  const centerNode = railNodes[cur];
  if(centerNode) centerNode.scrollIntoView({block:'center', behavior:'smooth'});

  const file = S[cur].file;
  tabs.forEach(t=> t.classList.toggle('active', t.dataset.file===file));

  document.getElementById('progress-fill').style.width = ((cur+1)/S.length*100)+'%';
  document.getElementById('counter-cur').textContent = cur+1;
}

function go(delta){
  cur = Math.min(S.length-1, Math.max(0, cur+delta));
  render();
}

document.getElementById('viewport').addEventListener('click', (e)=>{
  // avoid double-trigger with edge buttons
  go(1);
});
document.getElementById('edge-next').addEventListener('click', (e)=>{ e.stopPropagation(); go(1); });
document.getElementById('edge-prev').addEventListener('click', (e)=>{ e.stopPropagation(); go(-1); });

document.addEventListener('keydown', (e)=>{
  if(['ArrowRight','ArrowDown',' ','PageDown'].includes(e.key)){ e.preventDefault(); go(1); }
  else if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){ e.preventDefault(); go(-1); }
  else if(e.key==='Home'){ cur=0; render(); }
  else if(e.key==='End'){ cur=S.length-1; render(); }
});

let hintTimer = setTimeout(()=> document.getElementById('nav-hint').classList.add('fade'), 4500);
document.addEventListener('mousemove', ()=>{
  document.getElementById('nav-hint').classList.remove('fade');
  clearTimeout(hintTimer);
  hintTimer = setTimeout(()=> document.getElementById('nav-hint').classList.add('fade'), 3000);
});

render();
</script>
</body>
</html>
