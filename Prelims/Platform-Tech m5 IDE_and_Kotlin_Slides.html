<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IDEs & Kotlin — Platform Briefing</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Orbitron:wght@500;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap');

  :root{
    --bg:#05070d;
    --panel:#0c1220;
    --panel-2:#111b30;
    --line: rgba(146,168,214,0.16);
    --line-strong: rgba(146,168,214,0.3);
    --cyan:#4fd8ff;
    --violet:#a17bff;
    --mint:#63f2c3;
    --text:#eef2fb;
    --muted:#8b96b8;
    --faint:#5b6488;
    --danger:#ff6b6b;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;background:var(--bg);color:var(--text);}
  body{
    font-family:'Inter', sans-serif;
    -webkit-font-smoothing:antialiased;
    overflow:hidden;
  }

  /* ---------- background field ---------- */
  .field{
    position:fixed; inset:0; z-index:0; overflow:hidden;
    background:
      radial-gradient(1100px 700px at 82% -10%, rgba(161,123,255,0.16), transparent 60%),
      radial-gradient(900px 600px at -10% 110%, rgba(79,216,255,0.14), transparent 60%),
      var(--bg);
  }
  .field::before{
    content:"";
    position:absolute; inset:-2px;
    background-image:
      linear-gradient(var(--line) 1px, transparent 1px),
      linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size: 64px 64px;
    mask-image: radial-gradient(1200px 800px at 50% 30%, black, transparent 75%);
    opacity:0.55;
  }
  .beam{
    position:absolute; width:2px; height:160%; top:-30%;
    background:linear-gradient(180deg, transparent, rgba(79,216,255,0.5), transparent);
    filter: blur(1px);
    animation: drift 14s linear infinite;
    opacity:0.5;
  }
  .beam.b2{ background:linear-gradient(180deg, transparent, rgba(161,123,255,0.45), transparent); animation-duration:19s; }
  .beam.b3{ background:linear-gradient(180deg, transparent, rgba(99,242,195,0.35), transparent); animation-duration:23s; }
  @keyframes drift{
    0%{ left:-5%; }
    100%{ left:105%; }
  }
  @media (prefers-reduced-motion: reduce){ .beam{ animation:none; display:none; } }

  /* ---------- deck / slides ---------- */
  .deck{ position:fixed; inset:0; z-index:1; }
  .slide{
    position:absolute; inset:0;
    overflow-y:auto;
    padding: 96px 8vw 120px;
    opacity:0; pointer-events:none;
    transform: translateX(48px) scale(0.98);
    transition: transform .42s cubic-bezier(.22,.8,.28,1), opacity .42s ease;
  }
  .slide.active{ opacity:1; pointer-events:auto; transform: translateX(0) scale(1); z-index:2; }
  .slide.before{ transform: translateX(-48px) scale(0.98); opacity:0; }
  @media (prefers-reduced-motion: reduce){
    .slide{ transition: opacity .25s ease; transform:none !important; }
  }

  .slide-inner{
    min-height:100%;
    display:flex; flex-direction:column; justify-content:center;
    max-width:1180px; margin:0 auto; width:100%; min-width:0;
  }

  .eyebrow{
    font-family:'Orbitron', sans-serif;
    font-size:12px; letter-spacing:0.22em; text-transform:uppercase;
    color:var(--cyan); font-weight:600;
    display:flex; align-items:center; gap:10px; margin-bottom:18px;
  }
  .eyebrow::before{
    content:""; width:26px; height:1px; background:linear-gradient(90deg, var(--cyan), transparent);
  }

  h1.title{
    font-family:'Space Grotesk', sans-serif;
    font-weight:700; font-size:clamp(30px, 4.2vw, 54px);
    line-height:1.08; letter-spacing:-0.01em; margin:0 0 18px;
    background: linear-gradient(120deg, #ffffff 40%, var(--cyan) 90%);
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .subtitle{ font-size:18px; color:var(--muted); max-width:760px; line-height:1.6; margin-bottom:8px; }
  .lede{ font-size:16px; color:var(--muted); max-width:820px; line-height:1.7; }

  /* ---------- generic content blocks ---------- */
  .panel{
    background:linear-gradient(180deg, var(--panel), var(--panel-2));
    border:1px solid var(--line); border-radius:14px; padding:26px 28px;
    min-width:0;
  }

  .grid{ display:grid; gap:18px; margin-top:28px; min-width:0; }
  .grid.cols-2{ grid-template-columns: repeat(2, minmax(0,1fr)); }
  .grid.cols-3{ grid-template-columns: repeat(3, minmax(0,1fr)); }
  .grid.cols-4{ grid-template-columns: repeat(4, minmax(0,1fr)); }
  @media (max-width: 900px){
    .grid.cols-3, .grid.cols-4{ grid-template-columns: repeat(2, minmax(0,1fr)); }
  }
  @media (max-width: 620px){
    .grid.cols-2, .grid.cols-3, .grid.cols-4{ grid-template-columns: minmax(0,1fr); }
  }

  .card{
    background:var(--panel); border:1px solid var(--line); border-radius:12px;
    padding:20px 20px; min-width:0; position:relative; overflow:hidden;
  }
  .card::after{
    content:""; position:absolute; inset:0; border-radius:12px; padding:1px;
    background:linear-gradient(140deg, rgba(79,216,255,0.35), transparent 40%);
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor; mask-composite: exclude;
    opacity:0.7; pointer-events:none;
  }
  .card .tag{
    font-family:'JetBrains Mono', monospace; font-size:11px; color:var(--mint);
    letter-spacing:0.06em; margin-bottom:10px; display:block;
  }
  .card h3{ font-family:'Space Grotesk', sans-serif; font-size:17px; margin:0 0 8px; font-weight:600; }
  .card p{ font-size:14px; color:var(--muted); line-height:1.55; margin:0; }

  .card-head{ display:flex; align-items:center; gap:12px; margin-bottom:12px; }
  .card-head h3{ margin:0; }
  .icon-chip{
    width:42px; height:42px; border-radius:10px; flex-shrink:0;
    background:rgba(255,255,255,0.07); border:1px solid var(--line);
    display:flex; align-items:center; justify-content:center; padding:7px; overflow:hidden;
  }
  .icon-chip img{ max-width:100%; max-height:100%; object-fit:contain; }
  .icon-chip.mono{
    font-family:'Orbitron', sans-serif; font-weight:700; font-size:12px; color:var(--cyan);
    letter-spacing:0.02em;
  }

  .num-badge{
    font-family:'Orbitron', sans-serif; font-size:12px; color:var(--violet);
    border:1px solid rgba(161,123,255,0.4); border-radius:20px;
    padding:2px 10px; display:inline-block; margin-bottom:12px;
  }

  .two-col{ display:grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap:24px; margin-top:26px; min-width:0; }
  @media (max-width: 760px){ .two-col{ grid-template-columns: minmax(0,1fr); } }
  .two-col .panel{ min-width:0; }
  .two-col h3{ font-family:'Space Grotesk', sans-serif; font-size:18px; margin:0 0 12px; color:var(--cyan); }
  .two-col ul, ul.plain{ margin:0; padding-left:20px; color:var(--muted); font-size:14.5px; line-height:1.75; }
  .two-col ul li, ul.plain li{ margin-bottom:6px; }

  ol.steps{ counter-reset: step; list-style:none; padding:0; margin:26px 0 0; display:flex; flex-direction:column; gap:14px; }
  ol.steps li{
    display:flex; gap:16px; align-items:flex-start; padding:16px 18px;
    background:var(--panel); border:1px solid var(--line); border-radius:12px; min-width:0;
  }
  ol.steps li::before{
    counter-increment: step; content: counter(step, decimal-leading-zero);
    font-family:'JetBrains Mono', monospace; font-size:14px; color:var(--bg);
    background:linear-gradient(135deg, var(--cyan), var(--violet));
    min-width:34px; height:34px; border-radius:8px; display:flex; align-items:center; justify-content:center;
    flex-shrink:0; font-weight:600;
  }
  ol.steps li .step-body b{ display:block; font-size:15px; margin-bottom:2px; color:var(--text); }
  ol.steps li .step-body span{ font-size:14px; color:var(--muted); line-height:1.6; }

  /* ---------- code blocks ---------- */
  .code-block{
    margin-top:24px; border-radius:12px; overflow:hidden;
    border:1px solid var(--line-strong); background:#080c16; min-width:0;
  }
  .code-head{
    display:flex; align-items:center; gap:8px; padding:10px 16px;
    background:var(--panel-2); border-bottom:1px solid var(--line);
    font-family:'JetBrains Mono', monospace; font-size:12px; color:var(--muted);
  }
  .code-head .dot{ width:9px; height:9px; border-radius:50%; }
  .code-head .dot.r{ background:#ff6b6b; } .code-head .dot.y{ background:#ffd479; } .code-head .dot.g{ background:#63f2c3; }
  .code-head .fname{ margin-left:8px; }
  pre.code{
    margin:0; padding:18px 20px; overflow-x:auto; min-width:0;
    font-family:'JetBrains Mono', monospace; font-size:13.5px; line-height:1.65; color:#cdd6ee;
  }
  .cm-comment{ color:#5b6488; font-style:italic; }
  .cm-string{ color:var(--mint); }
  .cm-keyword{ color:var(--violet); font-weight:600; }
  .cm-tag{ color:var(--cyan); font-weight:600; }
  .cm-attr{ color:#ffd479; }
  .cm-selector{ color:var(--cyan); font-weight:600; }
  .cm-property{ color:#ffd479; }
  .cm-number{ color:#ff9b6b; }

  .code-note{ margin-top:16px; display:flex; flex-direction:column; gap:8px; }
  .code-note .row{ display:flex; gap:10px; font-size:14px; color:var(--muted); }
  .code-note code{ font-family:'JetBrains Mono', monospace; color:var(--mint); background:rgba(99,242,195,0.08); padding:1px 6px; border-radius:5px; }

  /* ---------- quiz ---------- */
  .quiz-q{ font-family:'Space Grotesk', sans-serif; font-size:19px; margin:22px 0 14px; color:var(--text); }
  .quiz-grid{ display:grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap:12px; min-width:0; }
  @media (max-width:700px){ .quiz-grid{ grid-template-columns: minmax(0,1fr); } }
  .quiz-option{
    border:1px solid var(--line); background:var(--panel); border-radius:10px;
    padding:12px 14px; font-size:14.5px; color:var(--muted); display:flex; gap:10px; min-width:0;
  }
  .quiz-option b{ color:var(--faint); font-family:'JetBrains Mono', monospace; }
  .quiz-option.correct{ border-color: rgba(99,242,195,0.55); color:var(--text); background:rgba(99,242,195,0.06); }
  .quiz-option.correct b{ color:var(--mint); }
  .quiz-option .chk{ margin-left:auto; color:var(--mint); font-family:'JetBrains Mono', monospace; font-size:12px; opacity:0; }
  .quiz-option.correct .chk{ opacity:1; }
  .quiz-block{ margin-bottom:6px; }

  /* ---------- quote ---------- */
  .quote-slide .mark{ font-family:'Space Grotesk', sans-serif; font-size:64px; color:var(--violet); line-height:0.6; margin-bottom:10px; opacity:0.7; }
  .quote-slide blockquote{
    font-family:'Space Grotesk', sans-serif; font-weight:600; font-size:clamp(22px,3vw,32px);
    line-height:1.45; margin:0 0 22px; max-width:900px;
    background: linear-gradient(120deg,#fff 40%, var(--mint) 100%); -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .quote-slide cite{ font-style:normal; font-family:'JetBrains Mono', monospace; color:var(--cyan); font-size:14px; letter-spacing:0.04em; }

  /* ---------- directory / logo grid ---------- */
  .directory{ display:grid; grid-template-columns: repeat(5, minmax(0,1fr)); gap:14px; margin-top:26px; min-width:0; }
  @media (max-width:900px){ .directory{ grid-template-columns: repeat(3, minmax(0,1fr)); } }
  @media (max-width:600px){ .directory{ grid-template-columns: repeat(2, minmax(0,1fr)); } }
  .dir-item{ background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:18px 12px; text-align:center; min-width:0; }
  .dir-mono{
    width:52px; height:52px; margin:0 auto 12px; border-radius:12px;
    display:flex; align-items:center; justify-content:center;
    font-family:'Orbitron', sans-serif; font-weight:700; font-size:16px; color:var(--bg);
    background:linear-gradient(135deg, var(--cyan), var(--violet));
  }
  .dir-logo{
    width:64px; height:64px; margin:0 auto 12px; border-radius:12px;
    display:flex; align-items:center; justify-content:center;
    background:#f4f6fb; border:1px solid var(--line);
    padding:10px;
  }
  .dir-logo img{ max-width:100%; max-height:100%; object-fit:contain; }
  .dir-item .idx{ font-family:'JetBrains Mono', monospace; font-size:11px; color:var(--faint); display:block; margin-bottom:6px; }
  .dir-item .name{ font-size:13.5px; color:var(--text); font-weight:500; }
  .dir-item .icon-chip{ width:52px; height:52px; margin:0 auto 12px; border-radius:12px; padding:9px; }

  /* ---------- faq ---------- */
  .faq-item{ background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:22px 24px; margin-top:20px; min-width:0; }
  .faq-item h3{ font-family:'Space Grotesk', sans-serif; font-size:17px; margin:0 0 10px; color:var(--cyan); }
  .faq-item p{ font-size:14.5px; color:var(--muted); line-height:1.7; margin:0; }

  /* ---------- chrome: progress + counter ---------- */
  .chrome{ position:fixed; inset:0; z-index:5; pointer-events:none; }
  .progress-rail{ position:fixed; top:0; left:0; right:0; height:3px; background:rgba(255,255,255,0.06); z-index:6; }
  .progress-fill{ height:100%; width:0%; background:linear-gradient(90deg, var(--cyan), var(--violet)); transition:width .4s ease; box-shadow:0 0 12px rgba(79,216,255,0.6); }

  .hud{
    position:fixed; bottom:22px; right:26px; z-index:6;
    font-family:'JetBrains Mono', monospace; font-size:12px; color:var(--muted);
    background:rgba(12,18,32,0.7); border:1px solid var(--line); backdrop-filter: blur(6px);
    padding:8px 14px; border-radius:20px; display:flex; align-items:center; gap:10px;
    letter-spacing:0.04em;
  }
  .hud .dotlive{ width:6px; height:6px; border-radius:50%; background:var(--mint); box-shadow:0 0 8px var(--mint); }
  .hud b{ color:var(--text); }

  .hint{
    position:fixed; bottom:22px; left:26px; z-index:6;
    font-family:'JetBrains Mono', monospace; font-size:11.5px; color:var(--faint);
    letter-spacing:0.05em; display:flex; gap:14px;
  }
  .hint kbd{
    border:1px solid var(--line); border-radius:5px; padding:1px 6px; color:var(--muted);
    background:rgba(255,255,255,0.03); font-family:'JetBrains Mono', monospace;
  }
  @media (max-width:640px){ .hint{ display:none; } }

  ::-webkit-scrollbar{ width:8px; }
  ::-webkit-scrollbar-thumb{ background:var(--line-strong); border-radius:8px; }
</style>
</head>

<script>
function escapeHtml(s){
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function highlightCode(code){
  const pattern = /(?<comment>\/\/.*|\/\*[\s\S]*?\*\/|<!--[\s\S]*?-->)|(?<string>"(?:\\.|[^"\\])*"|'(?:\\.|[^'\\])*'|`(?:\\.|[^`\\])*`)|(?<tag><\/?[A-Za-z][\w-]*)|(?<attr>[a-zA-Z-][\w-]*(?=\s*=))|(?<keyword>\b(?:fun|val|var|println|package|import|class|public|private|protected|override|static|void|new|return|if|else|for|while|extends|implements|super|this|const|let|function|from|export|default|null|true|false|try|catch|throw|throws|interface|enum|when|is|in|object|companion|data)\b)|(?<selector>[.#][A-Za-z][\w-]*(?=\s*\{))|(?<property>[a-zA-Z-]+(?=\s*:\s*[^;{}]+;))|(?<number>\b\d+(?:\.\d+)?\b)/g;

  let result = '';
  let lastIndex = 0;
  code.replace(pattern, function(match, ...rest){
    const groups = rest[rest.length - 1];
    const offset = rest[rest.length - 3];
    result += escapeHtml(code.slice(lastIndex, offset));
    let cls = '';
    if (groups.comment) cls = 'cm-comment';
    else if (groups.string) cls = 'cm-string';
    else if (groups.tag) cls = 'cm-tag';
    else if (groups.attr) cls = 'cm-attr';
    else if (groups.keyword) cls = 'cm-keyword';
    else if (groups.selector) cls = 'cm-selector';
    else if (groups.property) cls = 'cm-property';
    else if (groups.number) cls = 'cm-number';
    result += cls ? '<span class="' + cls + '">' + escapeHtml(match) + '</span>' : escapeHtml(match);
    lastIndex = offset + match.length;
    return match;
  });
  result += escapeHtml(code.slice(lastIndex));
  return result;
}

function codeBlock(fname, lang, code){
  return '<div class="code-block">' +
    '<div class="code-head"><span class="dot r"></span><span class="dot y"></span><span class="dot g"></span><span class="fname">' + fname + '</span><span style="margin-left:auto;opacity:.6;">' + lang + '</span></div>' +
    '<pre class="code"><code>' + highlightCode(code) + '</code></pre>' +
  '</div>';
}

function iconTile(url, initials){
  if (!url){
    return '<div class="icon-chip mono">' + initials + '</div>';
  }
  return '<div class="icon-chip"><img src="' + url + '" alt="" ' +
    'onerror="this.style.display=\'none\'; this.parentElement.classList.add(\'mono\'); this.parentElement.textContent=\'' + initials + '\';"></div>';
}
function cardHead(url, initials, title){
  return '<div class="card-head">' + iconTile(url, initials) + '<h3>' + title + '</h3></div>';
}

// ---------- render + navigation ----------
const deck = document.getElementById('deck');
slides.forEach(function(html, i){
  const el = document.createElement('div');
  el.className = 'slide';
  el.innerHTML = html;
  el.dataset.index = i;
  deck.appendChild(el);
});

const slideEls = Array.from(deck.querySelectorAll('.slide'));
const total = slideEls.length;
document.getElementById('hudTotal').textContent = String(total).padStart(2,'0');

let current = 0;

function render(){
  slideEls.forEach(function(el, i){
    el.classList.remove('active','before');
    if(i === current){ el.classList.add('active'); }
    else if(i < current){ el.classList.add('before'); }
  });
  const pct = total > 1 ? (current / (total - 1)) * 100 : 100;
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('hudCurrent').textContent = String(current + 1).padStart(2,'0');
}

function goTo(i){
  current = Math.max(0, Math.min(total - 1, i));
  render();
}
function next(){ goTo(current + 1); }
function prev(){ goTo(current - 1); }

document.addEventListener('click', function(e){
  if (e.target.closest('a')) return;
  next();
});

document.addEventListener('keydown', function(e){
  if (e.key === 'ArrowRight' || e.key === ' '){ e.preventDefault(); next(); }
  else if (e.key === 'ArrowLeft'){ e.preventDefault(); prev(); }
  else if (e.key === 'Home'){ e.preventDefault(); goTo(0); }
  else if (e.key === 'End'){ e.preventDefault(); goTo(total - 1); }
});

render();
</script>
