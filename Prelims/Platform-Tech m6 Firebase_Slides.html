<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Firebase & Cloud Backends — Platform Briefing</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Orbitron:wght@500;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap');

  :root{
    --bg:#05070d;
    --panel:#0c1220;
    --panel-2:#111b30;
    --line: rgba(146,168,214,0.16);
    --line-strong: rgba(146,168,214,0.3);
    --cyan:#4fd8ff;
    --violet:#a17bff;
    --mint:#63f2c3;
    --text:#eef2fb;
    --muted:#8b96b8;
    --faint:#5b6488;
    --danger:#ff6b6b;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;background:var(--bg);color:var(--text);}
  body{
    font-family:'Inter', sans-serif;
    -webkit-font-smoothing:antialiased;
    overflow:hidden;
  }

  /* ---------- background field ---------- */
  .field{
    position:fixed; inset:0; z-index:0; overflow:hidden;
    background:
      radial-gradient(1100px 700px at 82% -10%, rgba(161,123,255,0.16), transparent 60%),
      radial-gradient(900px 600px at -10% 110%, rgba(79,216,255,0.14), transparent 60%),
      var(--bg);
  }
  .field::before{
    content:"";
    position:absolute; inset:-2px;
    background-image:
      linear-gradient(var(--line) 1px, transparent 1px),
      linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size: 64px 64px;
    mask-image: radial-gradient(1200px 800px at 50% 30%, black, transparent 75%);
    opacity:0.55;
  }
  .beam{
    position:absolute; width:2px; height:160%; top:-30%;
    background:linear-gradient(180deg, transparent, rgba(79,216,255,0.5), transparent);
    filter: blur(1px);
    animation: drift 14s linear infinite;
    opacity:0.5;
  }
  .beam.b2{ background:linear-gradient(180deg, transparent, rgba(161,123,255,0.45), transparent); animation-duration:19s; }
  .beam.b3{ background:linear-gradient(180deg, transparent, rgba(99,242,195,0.35), transparent); animation-duration:23s; }
  @keyframes drift{
    0%{ left:-5%; }
    100%{ left:105%; }
  }
  @media (prefers-reduced-motion: reduce){ .beam{ animation:none; display:none; } }

  /* ---------- deck / slides ---------- */
  .deck{ position:fixed; inset:0; z-index:1; }
  .slide{
    position:absolute; inset:0;
    overflow-y:auto;
    padding: 96px 8vw 120px;
    opacity:0; pointer-events:none;
    transform: translateX(48px) scale(0.98);
    transition: transform .42s cubic-bezier(.22,.8,.28,1), opacity .42s ease;
  }
  .slide.active{ opacity:1; pointer-events:auto; transform: translateX(0) scale(1); z-index:2; }
  .slide.before{ transform: translateX(-48px) scale(0.98); opacity:0; }
  @media (prefers-reduced-motion: reduce){
    .slide{ transition: opacity .25s ease; transform:none !important; }
  }

  .slide-inner{
    min-height:100%;
    display:flex; flex-direction:column; justify-content:center;
    max-width:1180px; margin:0 auto; width:100%; min-width:0;
  }

  .eyebrow{
    font-family:'Orbitron', sans-serif;
    font-size:12px; letter-spacing:0.22em; text-transform:uppercase;
    color:var(--cyan); font-weight:600;
    display:flex; align-items:center; gap:10px; margin-bottom:18px;
  }
  .eyebrow::before{
    content:""; width:26px; height:1px; background:linear-gradient(90deg, var(--cyan), transparent);
  }

  h1.title{
    font-family:'Space Grotesk', sans-serif;
    font-weight:700; font-size:clamp(30px, 4.2vw, 54px);
    line-height:1.08; letter-spacing:-0.01em; margin:0 0 18px;
    background: linear-gradient(120deg, #ffffff 40%, var(--cyan) 90%);
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .subtitle{ font-size:18px; color:var(--muted); max-width:760px; line-height:1.6; margin-bottom:8px; }
  .lede{ font-size:16px; color:var(--muted); max-width:820px; line-height:1.7; }

  /* ---------- generic content blocks ---------- */
  .panel{
    background:linear-gradient(180deg, var(--panel), var(--panel-2));
    border:1px solid var(--line); border-radius:14px; padding:26px 28px;
    min-width:0;
  }

  .grid{ display:grid; gap:18px; margin-top:28px; min-width:0; }
  .grid.cols-2{ grid-template-columns: repeat(2, minmax(0,1fr)); }
  .grid.cols-3{ grid-template-columns: repeat(3, minmax(0,1fr)); }
  .grid.cols-4{ grid-template-columns: repeat(4, minmax(0,1fr)); }
  .grid.cols-5{ grid-template-columns: repeat(5, minmax(0,1fr)); }
  @media (max-width: 900px){
    .grid.cols-3, .grid.cols-4, .grid.cols-5{ grid-template-columns: repeat(2, minmax(0,1fr)); }
  }
  @media (max-width: 620px){
    .grid.cols-2, .grid.cols-3, .grid.cols-4, .grid.cols-5{ grid-template-columns: minmax(0,1fr); }
  }

  .card{
    background:var(--panel); border:1px solid var(--line); border-radius:12px;
    padding:20px 20px; min-width:0; position:relative; overflow:hidden;
  }
  .card::after{
    content:""; position:absolute; inset:0; border-radius:12px; padding:1px;
    background:linear-gradient(140deg, rgba(79,216,255,0.35), transparent 40%);
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor; mask-composite: exclude;
    opacity:0.7; pointer-events:none;
  }
  .card .tag{
    font-family:'JetBrains Mono', monospace; font-size:11px; color:var(--mint);
    letter-spacing:0.06em; margin-bottom:10px; display:block;
  }
  .card h3{ font-family:'Space Grotesk', sans-serif; font-size:17px; margin:0 0 8px; font-weight:600; }
  .card p{ font-size:14px; color:var(--muted); line-height:1.55; margin:0; }

  .num-badge{
    font-family:'Orbitron', sans-serif; font-size:12px; color:var(--violet);
    border:1px solid rgba(161,123,255,0.4); border-radius:20px;
    padding:2px 10px; display:inline-block; margin-bottom:12px;
  }

  .two-col{ display:grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap:24px; margin-top:26px; min-width:0; }
  @media (max-width: 760px){ .two-col{ grid-template-columns: minmax(0,1fr); } }
  .two-col .panel{ min-width:0; }
  .two-col h3{ font-family:'Space Grotesk', sans-serif; font-size:18px; margin:0 0 12px; color:var(--cyan); }
  .two-col ul, ul.plain{ margin:0; padding-left:20px; color:var(--muted); font-size:14.5px; line-height:1.75; }
  .two-col ul li, ul.plain li{ margin-bottom:6px; }

  ol.steps{ counter-reset: step; list-style:none; padding:0; margin:26px 0 0; display:flex; flex-direction:column; gap:14px; }
  ol.steps li{
    display:flex; gap:16px; align-items:flex-start; padding:16px 18px;
    background:var(--panel); border:1px solid var(--line); border-radius:12px; min-width:0;
  }
  ol.steps li::before{
    counter-increment: step; content: counter(step, decimal-leading-zero);
    font-family:'JetBrains Mono', monospace; font-size:14px; color:var(--bg);
    background:linear-gradient(135deg, var(--cyan), var(--violet));
    min-width:34px; height:34px; border-radius:8px; display:flex; align-items:center; justify-content:center;
    flex-shrink:0; font-weight:600;
  }
  ol.steps[start="5"]{ counter-reset: step 4; }
  ol.steps li .step-body b{ display:block; font-size:15px; margin-bottom:2px; color:var(--text); }
  ol.steps li .step-body span{ font-size:14px; color:var(--muted); line-height:1.6; }

  /* ---------- diagram ---------- */
  .diagram-wrap{
    margin-top:24px; border:1px solid var(--line-strong); border-radius:14px;
    background:#080c16; padding:18px 10px; min-width:0;
  }
  .diagram-wrap svg{ width:100%; height:auto; display:block; }
  .diagram-caption{ text-align:center; font-family:'JetBrains Mono', monospace; font-size:11.5px; color:var(--faint); margin-top:10px; letter-spacing:0.04em; }
  .flow-line{ stroke-dasharray: 6 8; animation: flowmove 1.6s linear infinite; }
  .flow-line.reverse{ animation-direction: reverse; }
  @keyframes flowmove{ to{ stroke-dashoffset: -28; } }
  @media (prefers-reduced-motion: reduce){ .flow-line{ animation:none; } }

  /* ---------- quiz ---------- */
  .quiz-q{ font-family:'Space Grotesk', sans-serif; font-size:19px; margin:22px 0 14px; color:var(--text); }
  .quiz-grid{ display:grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap:12px; min-width:0; }
  @media (max-width:700px){ .quiz-grid{ grid-template-columns: minmax(0,1fr); } }
  .quiz-option{
    border:1px solid var(--line); background:var(--panel); border-radius:10px;
    padding:12px 14px; font-size:14.5px; color:var(--muted); display:flex; gap:10px; min-width:0;
  }
  .quiz-option b{ color:var(--faint); font-family:'JetBrains Mono', monospace; }
  .quiz-block{ margin-bottom:6px; }

  /* ---------- quote ---------- */
  .quote-slide .mark{ font-family:'Space Grotesk', sans-serif; font-size:64px; color:var(--violet); line-height:0.6; margin-bottom:10px; opacity:0.7; }
  .quote-slide blockquote{
    font-family:'Space Grotesk', sans-serif; font-weight:600; font-size:clamp(22px,3vw,32px);
    line-height:1.45; margin:0 0 22px; max-width:900px;
    background: linear-gradient(120deg,#fff 40%, var(--mint) 100%); -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .quote-slide cite{ font-style:normal; font-family:'JetBrains Mono', monospace; color:var(--cyan); font-size:14px; letter-spacing:0.04em; }

  /* ---------- faq ---------- */
  .faq-item{ background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:22px 24px; margin-top:20px; min-width:0; }
  .faq-item h3{ font-family:'Space Grotesk', sans-serif; font-size:17px; margin:0 0 10px; color:var(--cyan); }
  .faq-item p{ font-size:14.5px; color:var(--muted); line-height:1.7; margin:0; }

  /* ---------- env chips ---------- */
  .env-row{ display:flex; flex-wrap:wrap; gap:10px; margin-top:20px; }
  .env-chip{
    font-family:'JetBrains Mono', monospace; font-size:12.5px; color:var(--text);
    border:1px solid var(--line-strong); border-radius:20px; padding:6px 14px;
    background:rgba(79,216,255,0.06);
  }

  /* ---------- brand logo ---------- */
  .brand-logo{
    display:inline-flex; align-items:center; justify-content:center;
    align-self:flex-start; width:fit-content;
    background:rgba(255,255,255,0.94); border-radius:14px;
    padding:12px 20px; box-shadow:0 10px 30px rgba(0,0,0,0.35);
    border:1px solid rgba(255,255,255,0.6);
  }
  .brand-logo img{ height:40px; width:auto; display:block; }
  .brand-logo.sm img{ height:30px; }
  .progress-rail{ position:fixed; top:0; left:0; right:0; height:3px; background:rgba(255,255,255,0.06); z-index:6; }
  .progress-fill{ height:100%; width:0%; background:linear-gradient(90deg, var(--cyan), var(--violet)); transition:width .4s ease; box-shadow:0 0 12px rgba(79,216,255,0.6); }

  .hud{
    position:fixed; bottom:22px; right:26px; z-index:6;
    font-family:'JetBrains Mono', monospace; font-size:12px; color:var(--muted);
    background:rgba(12,18,32,0.7); border:1px solid var(--line); backdrop-filter: blur(6px);
    padding:8px 14px; border-radius:20px; display:flex; align-items:center; gap:10px;
    letter-spacing:0.04em;
  }
  .hud .dotlive{ width:6px; height:6px; border-radius:50%; background:var(--mint); box-shadow:0 0 8px var(--mint); }
  .hud b{ color:var(--text); }

  .hint{
    position:fixed; bottom:22px; left:26px; z-index:6;
    font-family:'JetBrains Mono', monospace; font-size:11.5px; color:var(--faint);
    letter-spacing:0.05em; display:flex; gap:14px;
  }
  .hint kbd{
    border:1px solid var(--line); border-radius:5px; padding:1px 6px; color:var(--muted);
    background:rgba(255,255,255,0.03); font-family:'JetBrains Mono', monospace;
  }
  @media (max-width:640px){ .hint{ display:none; } }

  ::-webkit-scrollbar{ width:8px; }
  ::-webkit-scrollbar-thumb{ background:var(--line-strong); border-radius:8px; }
</style>
</head>
<body>

<div class="field">
  <div class="beam" style="left:14%;"></div>
  <div class="beam b2" style="left:52%;"></div>
  <div class="beam b3" style="left:78%;"></div>
</div>

<div class="progress-rail"><div class="progress-fill" id="progressFill"></div></div>

<div class="deck" id="deck"></div>

<div class="hud" id="hud"><span class="dotlive"></span><span><b id="hudCurrent">01</b> / <span id="hudTotal">00</span></span></div>
<div class="hint"><span><kbd>&larr;</kbd> <kbd>&rarr;</kbd> navigate</span><span>click anywhere &rarr; next</span></div>

<script>
function wrap(eyebrow, body){
  return '<div class="slide-inner"><div class="eyebrow">' + eyebrow + '</div>' + body + '</div>';
}

function architectureDiagram(){
  return '<div class="diagram-wrap"><svg viewBox="0 0 900 280" xmlns="http://www.w3.org/2000/svg">' +
    '<defs>' +
      '<marker id="arrowCyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">' +
        '<path d="M0,0 L10,5 L0,10 z" fill="#4fd8ff"/>' +
      '</marker>' +
      '<marker id="arrowViolet" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">' +
        '<path d="M0,0 L10,5 L0,10 z" fill="#a17bff"/>' +
      '</marker>' +
    '</defs>' +

    '<rect x="30" y="90" width="220" height="100" rx="14" fill="#111b30" stroke="#4fd8ff" stroke-opacity="0.55"/>' +
    '<text x="140" y="132" text-anchor="middle" font-family="Space Grotesk, sans-serif" font-size="17" font-weight="600" fill="#eef2fb">Client App</text>' +
    '<text x="140" y="154" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="12" fill="#8b96b8">Web / Mobile</text>' +

    '<rect x="340" y="90" width="220" height="100" rx="14" fill="#111b30" stroke="#a17bff" stroke-opacity="0.55"/>' +
    '<text x="450" y="132" text-anchor="middle" font-family="Space Grotesk, sans-serif" font-size="17" font-weight="600" fill="#eef2fb">REST API</text>' +
    '<text x="450" y="154" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="12" fill="#8b96b8">Cloud Layer</text>' +

    '<rect x="650" y="90" width="220" height="100" rx="14" fill="#111b30" stroke="#63f2c3" stroke-opacity="0.55"/>' +
    '<text x="760" y="132" text-anchor="middle" font-family="Space Grotesk, sans-serif" font-size="17" font-weight="600" fill="#eef2fb">Database</text>' +
    '<text x="760" y="154" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="12" fill="#8b96b8">Cloud / NoSQL</text>' +

    '<line class="flow-line" x1="252" y1="112" x2="338" y2="112" stroke="#4fd8ff" stroke-width="2" marker-end="url(#arrowCyan)"/>' +
    '<text x="295" y="98" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11" fill="#4fd8ff">HTTP Request</text>' +

    '<line class="flow-line reverse" x1="338" y1="168" x2="252" y2="168" stroke="#a17bff" stroke-width="2" marker-end="url(#arrowViolet)"/>' +
    '<text x="295" y="186" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11" fill="#a17bff">JSON Response</text>' +

    '<line class="flow-line" x1="562" y1="112" x2="648" y2="112" stroke="#4fd8ff" stroke-width="2" marker-end="url(#arrowCyan)"/>' +
    '<text x="605" y="98" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11" fill="#4fd8ff">Data Transfer</text>' +

    '<line class="flow-line reverse" x1="648" y1="168" x2="562" y2="168" stroke="#63f2c3" stroke-width="2" marker-end="url(#arrowViolet)"/>' +
    '<text x="605" y="186" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11" fill="#63f2c3">Sync Payload</text>' +
  '</svg></div>' +
  '<div class="diagram-caption">CLIENT ↔ REST API ↔ DATABASE — live round-trip request / response cycle</div>';
}

const slides = [];

// 1 — Title
slides.push(wrap('Module 06 // Platform Layer',
  '<div class="brand-logo" style="margin-bottom:22px;"><img src="https://firebase.google.com/static/downloads/brand-guidelines/SVG/logo-standard.svg" alt="Firebase logo"></div>' +
  '<h1 class="title">Cloud Databases &amp; Backend Platforms</h1>' +
  '<p class="subtitle">Shifting from the frontend environment to the backend — how Firebase gives your app a full cloud infrastructure without a server you have to manage yourself.</p>' +
  '<div class="grid cols-3" style="margin-top:36px;">' +
    '<div class="card"><span class="tag">TRACK A</span><h3>What Is Firebase</h3><p>A Backend-as-a-Service platform, and how the client-server flow actually works.</p></div>' +
    '<div class="card"><span class="tag">TRACK B</span><h3>Core Services</h3><p>Ten building blocks — from Firestore to Cloud Functions to Analytics.</p></div>' +
    '<div class="card"><span class="tag">TRACK C</span><h3>Hands-On Setup</h3><p>Step-by-step: spin up your own Firebase database from the console.</p></div>' +
  '</div>'
));

// 2 — Lesson preview
slides.push(wrap('Lesson Briefing',
  '<h1 class="title">Where We\'re Headed</h1>' +
  '<p class="lede">In the previous lesson, we explored Online IDEs and the basics of Kotlin. Today we shift from the frontend environment to the backend — exploring cloud platform integration through the Firebase API.</p>' +
  '<div class="two-col">' +
    '<div class="panel"><h3>Already covered</h3><ul><li>Online and app-based IDEs</li><li>Kotlin syntax and a first practice program</li><li>A live JSON-fetching project drill</li></ul></div>' +
    '<div class="panel"><h3>Coming up now</h3><ul><li>What Firebase is, and the client-server workflow</li><li>Ten core Firebase services</li><li>Creating your own cloud database, step by step</li><li>A hands-on account setup activity</li></ul></div>' +
  '</div>'
));

// 3 — What is Firebase
slides.push(wrap('Core Concept',
  '<div class="brand-logo sm" style="margin-bottom:18px;"><img src="https://firebase.google.com/static/downloads/brand-guidelines/SVG/logo-standard.svg" alt="Firebase logo"></div>' +
  '<h1 class="title">What Is Firebase?</h1>' +
  '<p class="lede">Firebase is a comprehensive, cloud-based Backend-as-a-Service (BaaS) platform provided by Google. It gives developers a robust suite of tools and reliable infrastructure to build, scale, and maintain web and mobile applications.</p>' +
  '<div class="panel" style="margin-top:24px;">' +
    '<span class="num-badge">WHY IT MATTERS</span>' +
    '<p style="color:var(--muted);font-size:15px;line-height:1.7;">By offering pre-built features and easy-to-use APIs, Firebase eliminates the headache of manual server management and infrastructure setup — letting developers focus entirely on building high-quality user experiences.</p>' +
  '</div>'
));

// 4 — Architecture diagram
slides.push(wrap('Core Concept · Architecture',
  '<h1 class="title">The Client-Server Workflow</h1>' +
  '<p class="lede">Your frontend app never talks to the database directly. It talks to a REST API layer, which reads and writes on its behalf — the same round trip whether you\'re using the Realtime Database or Firestore.</p>' +
  architectureDiagram() +
  '<div class="env-row">' +
    '<span class="env-chip">Android (Kotlin/Java)</span>' +
    '<span class="env-chip">iOS (Swift)</span>' +
    '<span class="env-chip">JavaScript</span>' +
    '<span class="env-chip">Node.js</span>' +
    '<span class="env-chip">Unity</span>' +
    '<span class="env-chip">PHP</span>' +
    '<span class="env-chip">C++</span>' +
  '</div>'
));

// 5 — Core services 1-5
slides.push(wrap('Service Catalog · Part 1',
  '<h1 class="title">Core Firebase Services</h1>' +
  '<div class="grid cols-3">' +
    '<div class="card"><span class="tag">01</span><h3>Realtime Database</h3><p>A cloud-hosted NoSQL database storing data as one massive JSON tree, synced across clients in milliseconds — great for chat and multiplayer.</p></div>' +
    '<div class="card"><span class="tag">02</span><h3>Cloud Firestore</h3><p>Google\'s flagship document-based NoSQL database — collections and documents, complex queries, offline support, multi-region replication.</p></div>' +
    '<div class="card"><span class="tag">03</span><h3>Authentication</h3><p>Ready-to-use UI flows and secure backend management for email/password, phone verification, and federated social logins.</p></div>' +
    '<div class="card"><span class="tag">04</span><h3>Cloud Storage</h3><p>Object storage for user-generated binary assets — profile pictures, video, audio, and large files — served straight from client code.</p></div>' +
    '<div class="card"><span class="tag">05</span><h3>Hosting</h3><p>Fast, secure, production-grade hosting for static assets, with automatic global CDN, free SSL, and custom domain support.</p></div>' +
  '</div>'
));

// 6 — Core services 6-10
slides.push(wrap('Service Catalog · Part 2',
  '<h1 class="title">More Core Services</h1>' +
  '<div class="grid cols-3">' +
    '<div class="card"><span class="tag">06</span><h3>Cloud Functions</h3><p>A serverless framework that runs backend code automatically in response to events — no standalone server to configure.</p></div>' +
    '<div class="card"><span class="tag">07</span><h3>Analytics</h3><p>A free app-measurement solution giving deep insight into usage and engagement trends for data-driven decisions.</p></div>' +
    '<div class="card"><span class="tag">08</span><h3>Performance Monitoring</h3><p>Visibility into your app\'s performance across devices and networks — pinpoint slow renders and latency bottlenecks.</p></div>' +
    '<div class="card"><span class="tag">09</span><h3>Remote Config</h3><p>Change your app\'s behavior, look, and layout on the fly, without an app store update — ideal for flagging and A/B tests.</p></div>' +
    '<div class="card"><span class="tag">10</span><h3>Cloud Messaging (FCM)</h3><p>A cross-platform solution for sending targeted push notifications and data messages, at zero cost, across devices.</p></div>' +
  '</div>'
));

// 7 — Step by step part 1
slides.push(wrap('Hands-On · Setup',
  '<h1 class="title">Creating a Firebase Database</h1>' +

// ---------- render + navigation ----------
const deck = document.getElementById('deck');
slides.forEach(function(html, i){
  const el = document.createElement('div');
  el.className = 'slide';
  el.innerHTML = html;
  el.dataset.index = i;
  deck.appendChild(el);
});

const slideEls = Array.from(deck.querySelectorAll('.slide'));
const total = slideEls.length;
document.getElementById('hudTotal').textContent = String(total).padStart(2,'0');

let current = 0;

function render(){
  slideEls.forEach(function(el, i){
    el.classList.remove('active','before');
    if(i === current){ el.classList.add('active'); }
    else if(i < current){ el.classList.add('before'); }
  });
  const pct = total > 1 ? (current / (total - 1)) * 100 : 100;
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('hudCurrent').textContent = String(current + 1).padStart(2,'0');
}

function goTo(i){
  current = Math.max(0, Math.min(total - 1, i));
  render();
}
function next(){ goTo(current + 1); }
function prev(){ goTo(current - 1); }

document.addEventListener('click', function(e){
  if (e.target.closest('a')) return;
  next();
});

document.addEventListener('keydown', function(e){
  if (e.key === 'ArrowRight' || e.key === ' '){ e.preventDefault(); next(); }
  else if (e.key === 'ArrowLeft'){ e.preventDefault(); prev(); }
  else if (e.key === 'Home'){ e.preventDefault(); goTo(0); }
  else if (e.key === 'End'){ e.preventDefault(); goTo(total - 1); }
});

render();
</script>
