<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SIA M13 – Hardware Integration: Microcontrollers</title>
<style>
  :root {
    --bg: #181c1f;
    --bg2: #1d2226;
    --card: #222a2e;
    --shadow-dark: #0f1315;
    --shadow-light: #2d3a40;
    --accent: #34d399;   /* circuit-board green */
    --accent2: #fb923c;  /* warm amber / solder */
    --accent3: #60a5fa;  /* oscilloscope blue */
    --accent4: #a78bfa;  /* purple pin */
    --text: #e2e8f0;
    --text-muted: #94a3b8;
    --danger: #f87171;
    --warning: #fbbf24;
    --radius: 20px;
    --radius-sm: 12px;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); }

  /* ── PROGRESS BAR ── */
  #progress-bar { position: fixed; top: 0; left: 0; height: 3px; background: linear-gradient(90deg, var(--accent), var(--accent3)); transition: width .35s ease; z-index: 999; }
  #counter { position: fixed; bottom: 14px; right: 20px; font-size: 16px; color: var(--text-muted); z-index: 999; letter-spacing: .5px; }

  /* ── SLIDES ── */
  #deck { width: 100%; height: 100%; position: relative; }
  .slide {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; justify-content: center; align-items: center;
    padding: 38px 54px;
    opacity: 0; pointer-events: none;
    transition: opacity .35s ease, transform .35s ease;
    transform: translateX(60px);
  }
  .slide.active { opacity: 1; pointer-events: auto; transform: translateX(0); }
  .slide.exit-left  { opacity: 0; transform: translateX(-60px); }
  .slide.exit-right { opacity: 0; transform: translateX(60px); }
  @media (prefers-reduced-motion: reduce) {
    .slide { transition: opacity .15s ease; transform: none !important; }
  }

  /* ── EYEBROW / TITLE ── */
  .eyebrow { font-size: 12px; text-transform: uppercase; letter-spacing: 2.8px; color: var(--accent); margin-bottom: 8px; font-weight: 700; }
  .slide-title { font-size: clamp(25px, 3.4vw, 40px); font-weight: 800; color: var(--text); text-align: center; line-height: 1.2; margin-bottom: 26px; }
  .slide-title span { color: var(--accent); }

  /* ── NEU CARD ── */
  .card {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: 6px 6px 16px var(--shadow-dark), -4px -4px 12px var(--shadow-light);
    padding: 22px 26px;
  }
  .card-inset {
    background: var(--bg2);
    border-radius: var(--radius-sm);
    box-shadow: inset 3px 3px 8px var(--shadow-dark), inset -2px -2px 6px var(--shadow-light);
    padding: 16px 20px;
  }

  /* ── GRIDS ── */
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; width: 100%; }
  .grid-3 { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 16px; width: 100%; }
  .grid-2-wide { display: grid; grid-template-columns: 1.15fr 0.85fr; gap: 20px; width: 100%; }

  /* ── TEXT ── */
  p, li, td, th, .badge-text { font-size: 17px; line-height: 1.65; color: var(--text); }
  h3 { font-size: 19px; font-weight: 700; color: var(--accent); margin-bottom: 9px; }
  h4 { font-size: 17px; font-weight: 600; color: var(--accent2); margin-bottom: 7px; }
  ul { padding-left: 20px; }
  li { margin-bottom: 6px; }
  strong { color: var(--accent3); }
  code { font-family: 'Cascadia Code','Fira Code','Consolas',monospace; font-size: 15px; color: var(--accent); background: var(--bg2); padding: 2px 7px; border-radius: 5px; }

  /* ── BADGE ── */
  .badge {
    display: inline-flex; align-items: center; gap: 7px;
    background: var(--card);
    box-shadow: 3px 3px 8px var(--shadow-dark), -2px -2px 6px var(--shadow-light);
    border-radius: 50px; padding: 7px 15px; font-size: 16px; font-weight: 600; color: var(--text);
  }
  .badge.green  { color: var(--accent);  }
  .badge.orange { color: var(--accent2); }
  .badge.blue   { color: var(--accent3); }
  .badge.purple { color: var(--accent4); }
  .badge.red    { color: var(--danger);  }
  .badge.yellow { color: var(--warning); }

  /* ── TABLE ── */
  .tbl-wrap { width: 100%; overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 16px; }
  th { background: var(--bg); color: var(--accent); padding: 11px 14px; text-align: left; font-size: 15px; text-transform: uppercase; letter-spacing: .8px; }
  td { padding: 10px 14px; border-bottom: 1px solid rgba(255,255,255,.07); vertical-align: top; }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: rgba(52,211,153,.05); }

  /* ── CODE ── */
  .code-wrap { position: relative; border-radius: var(--radius-sm); overflow: hidden; background: #0d1117; display: flex; flex-direction: column; min-height: 0; }
  .code-header { display: flex; align-items: center; justify-content: space-between; padding: 9px 16px; background: #161b22; flex-shrink: 0; }
  .code-lang { font-size: 16px; color: #8b949e; font-family: monospace; }
  .copy-btn {
    font-size: 15px; padding: 5px 13px; border-radius: 8px; border: none; cursor: pointer; font-weight: 600;
    background: var(--card); color: var(--text);
    box-shadow: 3px 3px 7px var(--shadow-dark), -2px -2px 5px var(--shadow-light);
    transition: all .15s;
  }
  .copy-btn.copied { box-shadow: inset 2px 2px 5px var(--shadow-dark), inset -1px -1px 4px var(--shadow-light); color: var(--accent); }
  pre { flex: 1; overflow: auto; padding: 16px; margin: 0; font-size: 14.5px; line-height: 1.65; font-family: 'Cascadia Code','Fira Code','Consolas',monospace; min-height: 0; }
  .kw  { color: #ff7b72; } .fn  { color: #d2a8ff; } .str { color: #a5d6ff; }
  .cm  { color: #8b949e; font-style: italic; } .num { color: #f0db4f; }
  .prop{ color: #7ee787; } .pp  { color: #ffa657; }

  /* ── TITLE SLIDE ── */
  .title-slide { background: radial-gradient(ellipse at 55% 45%, #1a2e22 0%, var(--bg) 68%); }
  .title-hero { text-align: center; max-width: 820px; }
  .title-hero h1 { font-size: clamp(30px, 5vw, 54px); font-weight: 800; line-height: 1.1; margin-bottom: 14px; }
  .logo-row { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; margin-top: 10px; }

  /* ── STEP / FLOW ── */
  .flow-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: center; }
  .flow-node { background: var(--card); box-shadow: 4px 4px 10px var(--shadow-dark), -3px -3px 8px var(--shadow-light); border-radius: var(--radius-sm); padding: 10px 16px; font-size: 16px; font-weight: 600; text-align: center; min-width: 110px; }
  .flow-arrow { color: var(--accent); font-size: 20px; font-weight: 900; }

  /* ── QUOTE ── */
  .quote-card { border-left: 4px solid var(--accent); padding-left: 20px; font-size: 18px; font-style: italic; color: var(--text-muted); line-height: 1.7; }

  /* ── MCQ ── */
  .mcq-card { background: var(--card); border-radius: var(--radius); box-shadow: 6px 6px 16px var(--shadow-dark), -4px -4px 12px var(--shadow-light); padding: 20px 24px; display: flex; flex-direction: column; gap: 11px; }
  .mcq-q { font-size: 17px; font-weight: 600; color: var(--text); line-height: 1.5; }
  .mcq-opts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .mcq-opt { background: var(--bg2); border-radius: 10px; padding: 9px 13px; font-size: 16px; box-shadow: inset 2px 2px 5px var(--shadow-dark), inset -1px -1px 4px var(--shadow-light); }

  /* ── ANSWER KEY ── */
  .ans-row { display: flex; align-items: flex-start; gap: 13px; padding: 11px 0; border-bottom: 1px solid rgba(255,255,255,.06); }
  .ans-num { background: var(--accent); color: #111; border-radius: 50%; width: 28px; height: 28px; min-width:28px; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 800; }
  .ans-text { font-size: 17px; line-height: 1.55; }
  .ans-correct { color: var(--accent); font-weight: 700; }

  /* ── SHORTCUTS ── */
  #shortcuts-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.72); z-index: 9999; align-items: center; justify-content: center; }
  #shortcuts-overlay.show { display: flex; }
  .shortcuts-box { background: var(--card); border-radius: var(--radius); padding: 34px 42px; box-shadow: 10px 10px 30px var(--shadow-dark); max-width: 400px; width: 90%; }
  .shortcuts-box h2 { font-size: 21px; color: var(--accent); margin-bottom: 16px; text-align: center; }
  .shortcut-row { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,.07); }
  .shortcut-row:last-child { border-bottom: none; }
  .shortcut-key  { background: var(--bg2); border-radius: 7px; padding: 4px 10px; font-size: 15px; font-family: monospace; color: var(--accent); }
  .shortcut-desc { font-size: 16px; color: var(--text-muted); }
  .close-btn { display: block; margin: 18px auto 0; background: var(--card); box-shadow: 4px 4px 10px var(--shadow-dark), -2px -2px 7px var(--shadow-light); border: none; border-radius: 12px; padding: 9px 26px; font-size: 17px; color: var(--text); cursor: pointer; }

  /* ── FINAL ── */
  .final-content { text-align: center; }

  /* ── UTILS ── */
  .w-full { width: 100%; }
  .mt-2 { margin-top: 10px; }
  .mt-3 { margin-top: 14px; }
  .mt-4 { margin-top: 20px; }
  .flex-col { display: flex; flex-direction: column; }
  .inner-scroll { overflow-y: auto; max-height: 57vh; padding-right: 4px; }
  .inner-scroll::-webkit-scrollbar { width: 5px; }
  .inner-scroll::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 10px; }

  /* circuit trace decoration on title */
  .trace { position: absolute; opacity: .07; pointer-events: none; }
</style>
</head>
<body>

<div id="progress-bar"></div>
<div id="counter">1 / 19</div>
<div id="deck"></div>

<div id="shortcuts-overlay">
  <div class="shortcuts-box">
    <h2>⌨️ Shortcuts</h2>
    <div class="shortcut-row"><span class="shortcut-key">→ / Right-click</span><span class="shortcut-desc">Next slide</span></div>
    <div class="shortcut-row"><span class="shortcut-key">←</span><span class="shortcut-desc">Prev slide</span></div>
    <div class="shortcut-row"><span class="shortcut-key">Home</span><span class="shortcut-desc">First slide</span></div>
    <div class="shortcut-row"><span class="shortcut-key">End</span><span class="shortcut-desc">Last slide</span></div>
    <div class="shortcut-row"><span class="shortcut-key">?</span><span class="shortcut-desc">Toggle this overlay</span></div>
    <div class="shortcut-row"><span class="shortcut-key">Swipe</span><span class="shortcut-desc">Mobile navigation</span></div>
    <button class="close-btn" onclick="closeShortcuts()">Close</button>
  </div>
</div>

<script>
const slides = [

/* ═══════════════════════════════════════════════════
   SLIDE 1 — TITLE
═══════════════════════════════════════════════════ */
`<div class="slide title-slide" data-index="0">
  <!-- circuit trace SVG background decoration -->
  <svg class="trace" style="right:0;top:0;width:420px;height:420px" viewBox="0 0 420 420" fill="none" aria-hidden="true">
    <path d="M400 0 L400 120 L280 120 L280 200 L380 200 L380 300 L260 300 L260 420" stroke="white" stroke-width="2"/>
    <path d="M420 60 L320 60 L320 180 L200 180" stroke="white" stroke-width="1.5"/>
    <circle cx="280" cy="120" r="5" fill="white"/><circle cx="380" cy="200" r="5" fill="white"/>
    <circle cx="260" cy="300" r="5" fill="white"/><circle cx="320" cy="60"  r="5" fill="white"/>
  </svg>
  <svg class="trace" style="left:0;bottom:0;width:360px;height:360px" viewBox="0 0 360 360" fill="none" aria-hidden="true">
    <path d="M0 360 L0 240 L120 240 L120 160 L40 160 L40 60 L180 60 L180 0" stroke="white" stroke-width="2"/>
    <circle cx="120" cy="240" r="5" fill="white"/><circle cx="40" cy="160" r="5" fill="white"/>
    <circle cx="180" cy="60"  r="5" fill="white"/>
  </svg>

  <div class="title-hero">
    <div class="eyebrow">System Integration &amp; Architecture · Module 13</div>
    <h1>Hardware Integration<br><span style="color:var(--accent)">Microcontrollers &amp; Embedded Systems</span></h1>
    <p style="font-size:19px;color:var(--text-muted);margin-bottom:26px">The tiny brains behind every smart device you own</p>
    <div class="logo-row">
      <span class="badge green">⚙️ MCU</span>
      <span class="badge orange">🔌 I/O Peripherals</span>
      <span class="badge blue">📐 Harvard / Von Neumann</span>
      <span class="badge purple">⚡ CISC vs RISC</span>
      <span class="badge yellow">🧪 Wokwi Lab</span>
    </div>
  </div>
</div>`,

/* ═══════════════════════════════════════════════════
   SLIDE 2 — LESSON PREVIEW
═══════════════════════════════════════════════════ */
`<div class="slide" data-index="1">
  <div class="eyebrow">Lesson Preview</div>
  <div class="slide-title">From Software Bridges to <span>Physical Chips</span></div>
  <div class="grid-2 w-full" style="max-width:900px;align-items:start">
    <div class="card">
      <h3>📡 Coming From M12…</h3>
      <p style="color:var(--text-muted)">Last module: <strong>Application Integration</strong> — software bridges (REST APIs) letting computers talk to each other.</p>
      <p class="mt-2">Now we shift to the <strong>physical layer</strong>: how tiny silicon chips control the real world around us.</p>
    </div>
    <div class="card">
      <h3>🎯 Learning Objectives</h3>
      <ul>
        <li>Define a <strong>Microcontroller (MCU)</strong> and its core components</li>
        <li>Explain how MCUs process input &amp; output</li>
        <li>Compare <strong>Harvard vs Von Neumann</strong> architectures</li>
        <li>Differentiate <strong>CISC vs RISC</strong> instruction sets</li>
        <li>Understand <strong>C and Python</strong> in hardware programming</li>
      </ul>
    </div>
  </div>
  <div class="card mt-4" style="max-width:900px;width:100%;background:linear-gradient(135deg,rgba(52,211,153,.08),rgba(96,165,250,.06))">
    <p style="text-align:center;font-size:17px">💡 There are dozens of microcontrollers in your car, washing machine, and even your TV remote!</p>
  </div>
</div>`,

/* ═══════════════════════════════════════════════════
   SLIDE 3 — WHAT IS A MICROCONTROLLER
═══════════════════════════════════════════════════ */
`<div class="slide" data-index="2">
  <div class="eyebrow">Core Concept</div>
  <div class="slide-title">What is a <span>Microcontroller</span>?</div>
  <div class="grid-2-wide w-full" style="max-width:940px;align-items:start">
    <div class="card">
      <h3>Compact Integrated Circuit (IC)</h3>
      <p>A microcontroller packs a <strong>processor, memory, and I/O peripherals</strong> onto a <em>single chip</em>. Also called an <strong>MCU</strong> or embedded controller.</p>
      <div class="card-inset mt-3">
        <h4>Found everywhere in:</h4>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px">
          <div style="display:flex;align-items:center;gap:8px;font-size:16px">🚗 Vehicles (ABS, fuel injection)</div>
          <div style="display:flex;align-items:center;gap:8px;font-size:16px">🤖 Robots</div>
          <div style="display:flex;align-items:center;gap:8px;font-size:16px">🏥 Medical devices</div>
          <div style="display:flex;align-items:center;gap:8px;font-size:16px">📻 Radio transceivers</div>
          <div style="display:flex;align-items:center;gap:8px;font-size:16px">🏧 Vending machines</div>
          <div style="display:flex;align-items:center;gap:8px;font-size:16px">🏠 Home appliances</div>
        </div>
      </div>
    </div>
    <div class="flex-col" style="gap:16px">
      <div class="card">
        <h3>Miniature PCs</h3>
        <p>Think of them as <strong>miniature personal computers</strong> — but designed to control <em>one specific function</em> of a device. They don't run complex operating systems like Windows or macOS.</p>
      </div>
      <div class="card">
        <h3>Multi-MCU Systems</h3>
        <p>A modern car may have <strong>dozens of MCUs</strong>. Some handle ABS brakes, others control fuel injectors. They talk to each other via a <strong>central computer bus</strong> to act as one system.</p>
      </div>
    </div>
  </div>
</div>`,

/* ═══════════════════════════════════════════════════
   SLIDE 4 — HOW IT WORKS (THE CYCLE)
═══════════════════════════════════════════════════ */
`<div class="slide" data-index="3">
  <div class="eyebrow">Operation</div>
  <div class="slide-title">How Does an MCU <span>Work?</span></div>
  <div style="max-width:860px;width:100%">
    <!-- flow diagram -->
    <div style="display:flex;align-items:stretch;gap:10px;margin-bottom:24px;flex-wrap:wrap;justify-content:center">
      <div class="card" style="text-align:center;min-width:160px;flex:1">
        <div style="font-size:36px;margin-bottom:8px">📥</div>
        <h3 style="font-size:18px">1. Input</h3>
        <p style="font-size:16px;color:var(--text-muted)">I/O Peripherals receive data from sensors, switches, buttons</p>
      </div>
      <div style="display:flex;align-items:center;font-size:28px;color:var(--accent);font-weight:900">→</div>
      <div class="card" style="text-align:center;min-width:160px;flex:1">
        <div style="font-size:36px;margin-bottom:8px">⚙️</div>
        <h3 style="font-size:18px">2. Process</h3>
        <p style="font-size:16px;color:var(--text-muted)">CPU fetches instructions from <em>Program Memory</em>, stores vars in <em>Data Memory</em></p>
      </div>
      <div style="display:flex;align-items:center;font-size:28px;color:var(--accent);font-weight:900">→</div>
      <div class="card" style="text-align:center;min-width:160px;flex:1">
        <div style="font-size:36px;margin-bottom:8px">📤</div>
        <h3 style="font-size:18px">3. Output</h3>
        <p style="font-size:16px;color:var(--text-muted)">I/O Peripherals send signals to motors, LEDs, displays, chips</p>
      </div>
    </div>
    <div class="card-inset" style="border-left:4px solid var(--accent2)">
      <p style="font-size:16px;color:var(--text-muted)">💡 <strong style="color:var(--accent2)">Continuous Loop:</strong> This Input → Process → Output cycle repeats endlessly as long as the device is powered. This is the heartbeat of every embedded system.</p>
    </div>
  </div>
</div>`,

/* ═══════════════════════════════════════════════════
   SLIDE 5 — THREE CORE ELEMENTS: CPU
═══════════════════════════════════════════════════ */
`<div class="slide" data-index="4">
  <div class="eyebrow">Core Elements — Part 1 of 3</div>
  <div class="slide-title">The <span>Processor</span> (CPU)</div>
  <div class="grid-2 w-full" style="max-width:880px;align-items:start">
    <div class="card">
      <div style="display:flex;align-items:center;gap:16px;margin-bottom:14px">
        <svg width="56" height="56" viewBox="0 0 56 56" fill="none" role="img" aria-label="CPU chip icon">
          <rect x="14" y="14" width="28" height="28" rx="5" stroke="var(--accent)" stroke-width="2.2"/>
          <rect x="20" y="20" width="16" height="16" rx="2" fill="rgba(52,211,153,.15)" stroke="var(--accent)" stroke-width="1.5"/>
          <!-- pins -->
          <line x1="21" y1="14" x2="21" y2="8"  stroke="var(--accent)" stroke-width="1.8" stroke-linecap="round"/>
          <line x1="28" y1="14" x2="28" y2="8"  stroke="var(--accent)" stroke-width="1.8" stroke-linecap="round"/>
          <line x1="35" y1="14" x2="35" y2="8"  stroke="var(--accent)" stroke-width="1.8" stroke-linecap="round"/>
          <line x1="21" y1="42" x2="21" y2="48" stroke="var(--accent)" stroke-width="1.8" stroke-linecap="round"/>
          <line x1="28" y1="42" x2="28" y2="48" stroke="var(--accent)" stroke-width="1.8" stroke-linecap="round"/>
          <line x1="35" y1="42" x2="35" y2="48" stroke="var(--accent)" stroke-width="1.8" stroke-linecap="round"/>
          <line x1="14" y1="21" x2="8"  y2="21" stroke="var(--accent)" stroke-width="1.8" stroke-linecap="round"/>
          <line x1="14" y1="28" x2="8"  y2="28" stroke="var(--accent)" stroke-width="1.8" stroke-linecap="round"/>
          <line x1="14" y1="35" x2="8"  y2="35" stroke="var(--accent)" stroke-width="1.8" stroke-linecap="round"/>
          <line x1="42" y1="21" x2="48" y2="21" stroke="var(--accent)" stroke-width="1.8" stroke-linecap="round"/>
          <line x1="42" y1="28" x2="48" y2="28" stroke="var(--accent)" stroke-width="1.8" stroke-linecap="round"/>
          <line x1="42" y1="35" x2="48" y2="35" stroke="var(--accent)" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
        <div>
          <h3 style="margin:0">The Brain</h3>
          <p style="font-size:16px;color:var(--text-muted)">Central Processing Unit</p>
        </div>
      </div>
      <p>The processor is the <strong>brain</strong> of the microcontroller. It is responsible for:</p>
      <ul class="mt-2">
        <li>Performing <strong>arithmetic operations</strong> (add, subtract, multiply)</li>
        <li>Performing <strong>logical operations</strong> (AND, OR, NOT)</li>
        <li>Handling <strong>I/O operations</strong></li>
        <li>Translating stored instructions into <strong>physical actions</strong></li>
      </ul>
    </div>
    <div class="card">
      <h3>GPIO Pins</h3>
      <p>MCUs feature <strong>GPIO (General Purpose Input/Output)</strong> pins that enable specific functions:</p>
      <div style="display:flex;flex-direction:column;gap:10px;margin-top:12px">

`<div class="slide" data-index="6">

        <div style="display:flex;align-items:center;gap:10px;margin-bottom:10px">

        <p>The physical world is <strong>analog</strong> (continuous voltages). Computers are <strong>digital</strong> (1s and 0s). The ADC converts analog signals — like temperature sensor readings — into digital data the CPU can understand.</p>
      </div>
      <div class="card">
        <div style="display:flex;align-items:center;gap:10px;margin-bottom:10px">

        </div>

</div>`,

/* ═══════════════════════════════════════════════════
   SLIDE 8 — ARCHITECTURE: HARVARD VS VON NEUMANN
═══════════════════════════════════════════════════ */
`<div class="slide" data-index="7">
  <div class="eyebrow">Microcontroller Architecture</div>
  <div class="slide-title">Harvard vs <span>Von Neumann</span></div>
  <div style="max-width:920px;width:100%">
    <div class="grid-2 w-full" style="margin-bottom:18px">
      <div class="card" style="border-left:4px solid var(--accent)">
        <h3>🏛️ Harvard Architecture</h3>
        <p>Uses <strong>separate buses</strong> and dedicated memory spaces for instructions and data.</p>
        <ul class="mt-2">
          <li>Instructions &amp; data transfer <strong>simultaneously</strong></li>
          <li>Faster processing speed</li>
          <li>More complex &amp; expensive</li>
          <li>Used in most modern MCUs (AVR, PIC)</li>
        </ul>
        <!-- mini diagram -->
        <div style="display:flex;align-items:center;justify-content:center;gap:12px;margin-top:14px;flex-wrap:wrap">
          <div class="card-inset" style="font-size:15px;text-align:center;min-width:90px">Program<br>Memory</div>
          <div style="display:flex;flex-direction:column;gap:5px;align-items:center">
            <span style="font-size:13px;color:var(--accent)">→ Instruction Bus →</span>
            <div style="width:100%;height:1.5px;background:var(--accent);border-radius:2px"></div>
            <div style="width:100%;height:1.5px;background:var(--accent3);border-radius:2px"></div>
            <span style="font-size:13px;color:var(--accent3)">→ Data Bus →</span>
          </div>
          <div class="card-inset" style="font-size:15px;text-align:center;min-width:70px">CPU</div>
          <div style="display:flex;flex-direction:column;gap:5px;align-items:center">
            <div style="width:100%;height:1.5px;background:var(--accent3);border-radius:2px"></div>
          </div>
          <div class="card-inset" style="font-size:15px;text-align:center;min-width:80px">Data<br>Memory</div>
        </div>
      </div>
      <div class="card" style="border-left:4px solid var(--accent2)">
        <h3 style="color:var(--accent2)">🔄 Von Neumann Architecture</h3>
        <p>Uses a <strong>single shared bus</strong> and memory space for both instructions and data.</p>
        <ul class="mt-2">
          <li>Requires <strong>sequential fetches</strong> — creates a bottleneck</li>
          <li>Simpler &amp; cheaper to implement</li>
          <li>Used in classic PCs and general-purpose systems</li>
        </ul>
        <!-- mini diagram -->
        <div style="display:flex;align-items:center;justify-content:center;gap:10px;margin-top:14px;flex-wrap:wrap">
          <div class="card-inset" style="font-size:14px;text-align:center;min-width:100px">Shared<br>Memory<br>(Programs + Data)</div>
          <div style="display:flex;flex-direction:column;align-items:center;gap:5px">
            <span style="font-size:12px;color:var(--accent2)">← Single Bus →</span>
            <div style="width:100%;height:2px;background:var(--accent2);border-radius:2px"></div>
          </div>
          <div class="card-inset" style="font-size:15px;text-align:center;min-width:60px">CPU</div>
        </div>
      </div>
    </div>
    <div class="card-inset" style="border-left:4px solid var(--warning)">
      <p style="font-size:16px">⚠️ <strong style="color:var(--warning)">The Von Neumann Bottleneck:</strong> Since instructions and data share one bus, the CPU must alternate fetching them — it can't do both at once. Harvard architecture solves this with dedicated lanes.</p>
    </div>
  </div>
</div>`,

/* ═══════════════════════════════════════════════════
   SLIDE 9 — CISC VS RISC
═══════════════════════════════════════════════════ */
`<div class="slide" data-index="8">
  <div class="eyebrow">Instruction Set Architecture</div>
  <div class="slide-title">CISC vs <span>RISC</span></div>
  <div style="max-width:900px;width:100%">
    <div class="card w-full">
      <div class="tbl-wrap">
        <table>
          <thead><tr><th>Feature</th><th style="color:var(--accent2)">CISC</th><th style="color:var(--accent)">RISC</th></tr></thead>
          <tbody>
            <tr>
              <td><strong>Full Name</strong></td>
              <td>Complex Instruction Set Computing</td>
              <td>Reduced Instruction Set Computing</td>
            </tr>
            <tr>
              <td><strong>No. of Instructions</strong></td>
              <td>High (~80+ instructions)</td>
              <td>Low (~30 instructions)</td>
            </tr>
            <tr>
              <td><strong>Addressing Modes</strong></td>
              <td>Many (12–24 modes)</td>
              <td>Few (3–5 modes)</td>
            </tr>
            <tr>
              <td><strong>Philosophy</strong></td>
              <td>Complex <strong>hardware</strong> handles tasks</td>
              <td>Simple hardware, workload on <strong>software/compiler</strong></td>
            </tr>
            <tr>
              <td><strong>Performance</strong></td>
              <td>Fewer code lines, but more cycles per instruction</td>
              <td>More code lines, but ~1 cycle per instruction → faster</td>
            </tr>
            <tr>
              <td><strong>Examples</strong></td>
              <td>Older Intel x86 (classic PCs)</td>
              <td><strong>ARM, AVR (Arduino), MIPS</strong> — modern MCUs</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
    <div class="grid-2 w-full mt-4">
      <div class="badge orange w-full" style="justify-content:center;padding:12px">CISC — "Do more with one instruction"</div>
      <div class="badge green w-full" style="justify-content:center;padding:12px">RISC — "Do one thing really fast"</div>
    </div>
  </div>
</div>`,

`<div class="slide" data-index="12">

            <tr><td><strong>Designed For</strong></td><td>Dedicated control tasks</td><td>General-purpose computing (OS)</td></tr>
            <tr><td><strong>Cost</strong></td><td>Cheap</td><td>More expensive</td></tr>
            <tr><td><strong>Found In</strong></td><td>Toasters, robots, cars</td><td>PCs, servers, phones</td></tr>

      </div>
    </div>

        <p style="font-size:16px">Arduino provides a free <strong>IDE</strong> to write C++ code and upload it to the physical board via USB.</p>

// "Hello World" for hardware!</span>

<span class="kw">void</span> <span class="fn">setup</span>() {
  <span class="cm">// Pin 13 = built-in LED on most Arduino boards</span>
  <span class="cm">// Set it as an OUTPUT (we write TO it)</span>
  <span class="fn">pinMode</span>(<span class="num">13</span>, OUTPUT);
}

<span class="kw">void</span> <span class="fn">loop</span>() {
  <span class="cm">// Turn the LED ON (send 5 Volts to pin 13)</span>
  <span class="fn">digitalWrite</span>(<span class="num">13</span>, HIGH);

  <span class="cm">// Wait 1000 milliseconds (1 second)</span>
  <span class="fn">delay</span>(<span class="num">1000</span>);

  <span class="cm">// Turn the LED OFF (send 0 Volts)</span>
  <span class="fn">digitalWrite</span>(<span class="num">13</span>, LOW);

  <span class="cm">// Wait 1 second before repeating</span>
  <span class="fn">delay</span>(<span class="num">1000</span>);

  <span class="cm">// loop() repeats forever — this IS the MCU cycle!</span>
}</pre>

/* ═══════════════════════════════════════════════════
   ENGINE
═══════════════════════════════════════════════════ */
const deck = document.getElementById('deck');
const totalSlides = slides.length;
let current = 0;

slides.forEach(html => {
  const wrap = document.createElement('div');
  wrap.innerHTML = html;
  deck.appendChild(wrap.firstElementChild);
});

const allSlides = document.querySelectorAll('.slide');
const progressBar = document.getElementById('progress-bar');
const counter = document.getElementById('counter');

function goTo(idx, dir = 1) {
  if (idx < 0 || idx >= totalSlides) return;
  const prev = allSlides[current];
  prev.classList.remove('active');
  prev.classList.add(dir > 0 ? 'exit-left' : 'exit-right');
  setTimeout(() => prev.classList.remove('exit-left','exit-right'), 400);
  current = idx;
  const next = allSlides[current];
  next.style.transform = dir > 0 ? 'translateX(60px)' : 'translateX(-60px)';
  next.classList.add('active');
  setTimeout(() => { next.style.transform = ''; }, 10);
  progressBar.style.width = ((current + 1) / totalSlides * 100) + '%';
  counter.textContent = (current + 1) + ' / ' + totalSlides;
}

allSlides[0].classList.add('active');
progressBar.style.width = (1 / totalSlides * 100) + '%';

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === 'ArrowDown') goTo(current + 1,  1);
  else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') goTo(current - 1, -1);
  else if (e.key === 'Home') goTo(0, -1);
  else if (e.key === 'End')  goTo(totalSlides - 1, 1);
  else if (e.key === '?') toggleShortcuts();
});

document.addEventListener('contextmenu', e => { e.preventDefault(); goTo(current + 1, 1); });
document.addEventListener('mousedown', e => {
  if (e.button === 3) { e.preventDefault(); e.stopImmediatePropagation(); goTo(current + 1,  1); }
  if (e.button === 4) { e.preventDefault(); e.stopImmediatePropagation(); goTo(current - 1, -1); }
}, true);

let touchX = 0;
document.addEventListener('touchstart', e => { touchX = e.touches[0].clientX; }, { passive: true });
document.addEventListener('touchend', e => {
  const dx = touchX - e.changedTouches[0].clientX;
  if (Math.abs(dx) > 40) dx > 0 ? goTo(current + 1, 1) : goTo(current - 1, -1);
});

function copyCode(btn, id) {
  const pre = document.getElementById(id);
  navigator.clipboard.writeText(pre ? pre.innerText : '').then(() => {
    btn.textContent = 'Copied!'; btn.classList.add('copied');
    setTimeout(() => { btn.textContent = 'Copy'; btn.classList.remove('copied'); }, 1800);
  });
}

function toggleShortcuts() { document.getElementById('shortcuts-overlay').classList.toggle('show'); }
function closeShortcuts()  { document.getElementById('shortcuts-overlay').classList.remove('show'); }
document.getElementById('shortcuts-overlay').addEventListener('click', e => {
  if (e.target === document.getElementById('shortcuts-overlay')) closeShortcuts();
});
</script>
