<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SIA M14 – Hardware Integration 2: The Arduino Platform</title>
<style>
  :root {
    --bg: #181c1f;
    --bg2: #1d2226;
    --card: #222a2e;
    --shadow-dark: #0f1315;
    --shadow-light: #2d3a40;
    --accent: #00b4d8;   /* Arduino teal/blue */
    --accent2: #fb923c;  /* amber/maker warm */
    --accent3: #34d399;  /* circuit green */
    --accent4: #a78bfa;  /* purple */
    --text: #e2e8f0;
    --text-muted: #94a3b8;
    --danger: #f87171;
    --warning: #fbbf24;
    --radius: 20px;
    --radius-sm: 12px;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); }

  #progress-bar { position: fixed; top: 0; left: 0; height: 3px; background: linear-gradient(90deg, var(--accent), var(--accent3)); transition: width .35s ease; z-index: 999; }
  #counter { position: fixed; bottom: 14px; right: 20px; font-size: 16px; color: var(--text-muted); z-index: 999; letter-spacing: .5px; }

  #deck { width: 100%; height: 100%; position: relative; }
  .slide {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; justify-content: center; align-items: center;
    padding: 36px 52px;
    opacity: 0; pointer-events: none;
    transition: opacity .35s ease, transform .35s ease;
    transform: translateX(60px);
  }
  .slide.active  { opacity: 1; pointer-events: auto; transform: translateX(0); }
  .slide.exit-left  { opacity: 0; transform: translateX(-60px); }
  .slide.exit-right { opacity: 0; transform: translateX(60px); }
  @media (prefers-reduced-motion: reduce) {
    .slide { transition: opacity .15s ease; transform: none !important; }
  }

  .eyebrow    { font-size: 12px; text-transform: uppercase; letter-spacing: 2.8px; color: var(--accent); margin-bottom: 8px; font-weight: 700; }
  .slide-title { font-size: clamp(24px, 3.3vw, 40px); font-weight: 800; color: var(--text); text-align: center; line-height: 1.2; margin-bottom: 24px; }
  .slide-title span { color: var(--accent); }

  .card { background: var(--card); border-radius: var(--radius); box-shadow: 6px 6px 16px var(--shadow-dark), -4px -4px 12px var(--shadow-light); padding: 22px 26px; }
  .card-inset { background: var(--bg2); border-radius: var(--radius-sm); box-shadow: inset 3px 3px 8px var(--shadow-dark), inset -2px -2px 6px var(--shadow-light); padding: 15px 19px; }

  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; width: 100%; }
  .grid-3 { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 16px; width: 100%; }
  .grid-2-wide { display: grid; grid-template-columns: 1.15fr 0.85fr; gap: 20px; width: 100%; }

  p, li, td, th { font-size: 17px; line-height: 1.65; color: var(--text); }
  h3  { font-size: 19px; font-weight: 700; color: var(--accent); margin-bottom: 9px; }
  h4  { font-size: 17px; font-weight: 600; color: var(--accent2); margin-bottom: 7px; }
  ul  { padding-left: 20px; }
  li  { margin-bottom: 6px; }
  strong { color: var(--accent3); }
  code   { font-family: 'Cascadia Code','Fira Code',Consolas,monospace; font-size: 15px; color: var(--accent); background: var(--bg2); padding: 2px 7px; border-radius: 5px; }

  .badge {
    display: inline-flex; align-items: center; gap: 7px;
    background: var(--card); box-shadow: 3px 3px 8px var(--shadow-dark), -2px -2px 6px var(--shadow-light);
    border-radius: 50px; padding: 7px 15px; font-size: 16px; font-weight: 600; color: var(--text);
  }
  .badge.teal   { color: var(--accent);  }
  .badge.orange { color: var(--accent2); }
  .badge.green  { color: var(--accent3); }
  .badge.purple { color: var(--accent4); }
  .badge.red    { color: var(--danger);  }
  .badge.yellow { color: var(--warning); }

  .tbl-wrap { width: 100%; overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 16px; }
  th { background: var(--bg); color: var(--accent); padding: 11px 14px; text-align: left; font-size: 15px; text-transform: uppercase; letter-spacing: .8px; }
  td { padding: 10px 14px; border-bottom: 1px solid rgba(255,255,255,.07); vertical-align: top; }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: rgba(0,180,216,.05); }

  .code-wrap { position: relative; border-radius: var(--radius-sm); overflow: hidden; background: #0d1117; display: flex; flex-direction: column; min-height: 0; }
  .code-header { display: flex; align-items: center; justify-content: space-between; padding: 9px 16px; background: #161b22; flex-shrink: 0; }
  .code-lang { font-size: 16px; color: #8b949e; font-family: monospace; }
  .copy-btn {
    font-size: 15px; padding: 5px 13px; border-radius: 8px; border: none; cursor: pointer; font-weight: 600;
    background: var(--card); color: var(--text); box-shadow: 3px 3px 7px var(--shadow-dark), -2px -2px 5px var(--shadow-light); transition: all .15s;
  }
  .copy-btn.copied { box-shadow: inset 2px 2px 5px var(--shadow-dark), inset -1px -1px 4px var(--shadow-light); color: var(--accent3); }
  pre { flex: 1; overflow: auto; padding: 16px; margin: 0; font-size: 14px; line-height: 1.65; font-family: 'Cascadia Code','Fira Code',Consolas,monospace; min-height: 0; }
  .kw { color: #ff7b72; } .fn { color: #d2a8ff; } .str { color: #a5d6ff; }
  .cm { color: #8b949e; font-style: italic; } .num { color: #f0db4f; }
  .prop { color: #7ee787; } .pp { color: #ffa657; } .inc { color: #ff7b72; }

  .title-slide { background: radial-gradient(ellipse at 50% 40%, #0a2030 0%, var(--bg) 68%); }
  .title-hero { text-align: center; max-width: 840px; }
  .title-hero h1 { font-size: clamp(30px, 5vw, 54px); font-weight: 800; line-height: 1.1; margin-bottom: 14px; }
  .logo-row { display: flex; gap: 13px; flex-wrap: wrap; justify-content: center; margin-top: 10px; }

  .quote-card { border-left: 4px solid var(--accent); padding-left: 20px; font-size: 18px; font-style: italic; color: var(--text-muted); line-height: 1.7; }

  .mcq-card { background: var(--card); border-radius: var(--radius); box-shadow: 6px 6px 16px var(--shadow-dark), -4px -4px 12px var(--shadow-light); padding: 20px 24px; display: flex; flex-direction: column; gap: 11px; }
  .mcq-q { font-size: 17px; font-weight: 600; color: var(--text); line-height: 1.5; }
  .mcq-opts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .mcq-opt { background: var(--bg2); border-radius: 10px; padding: 9px 13px; font-size: 16px; box-shadow: inset 2px 2px 5px var(--shadow-dark), inset -1px -1px 4px var(--shadow-light); }

  .ans-row { display: flex; align-items: flex-start; gap: 13px; padding: 11px 0; border-bottom: 1px solid rgba(255,255,255,.06); }
  .ans-num { background: var(--accent); color: #0a1a24; border-radius: 50%; width: 28px; height: 28px; min-width: 28px; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 800; }
  .ans-text { font-size: 17px; line-height: 1.55; }
  .ans-correct { color: var(--accent3); font-weight: 700; }

  #shortcuts-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.72); z-index: 9999; align-items: center; justify-content: center; }
  #shortcuts-overlay.show { display: flex; }
  .shortcuts-box { background: var(--card); border-radius: var(--radius); padding: 34px 42px; box-shadow: 10px 10px 30px var(--shadow-dark); max-width: 400px; width: 90%; }
  .shortcuts-box h2 { font-size: 21px; color: var(--accent); margin-bottom: 16px; text-align: center; }
  .shortcut-row { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,.07); }
  .shortcut-row:last-child { border-bottom: none; }
  .shortcut-key  { background: var(--bg2); border-radius: 7px; padding: 4px 10px; font-size: 15px; font-family: monospace; color: var(--accent); }
  .shortcut-desc { font-size: 16px; color: var(--text-muted); }
  .close-btn { display: block; margin: 18px auto 0; background: var(--card); box-shadow: 4px 4px 10px var(--shadow-dark), -2px -2px 7px var(--shadow-light); border: none; border-radius: 12px; padding: 9px 26px; font-size: 17px; color: var(--text); cursor: pointer; }

  .w-full   { width: 100%; }
  .mt-2 { margin-top: 10px; }
  .mt-3 { margin-top: 14px; }
  .mt-4 { margin-top: 20px; }
  .flex-col { display: flex; flex-direction: column; }
  .inner-scroll { overflow-y: auto; max-height: 57vh; padding-right: 4px; }
  .inner-scroll::-webkit-scrollbar { width: 5px; }
  .inner-scroll::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 10px; }
  .trace { position: absolute; opacity: .06; pointer-events: none; }
</style>
</head>
<body>

<div id="progress-bar"></div>
<div id="counter">1 / 20</div>
<div id="deck"></div>

<div id="shortcuts-overlay">
  <div class="shortcuts-box">
    <h2>⌨️ Shortcuts</h2>
    <div class="shortcut-row"><span class="shortcut-key">→ / Right-click</span><span class="shortcut-desc">Next slide</span></div>
    <div class="shortcut-row"><span class="shortcut-key">←</span><span class="shortcut-desc">Prev slide</span></div>
    <div class="shortcut-row"><span class="shortcut-key">Home</span><span class="shortcut-desc">First slide</span></div>
    <div class="shortcut-row"><span class="shortcut-key">End</span><span class="shortcut-desc">Last slide</span></div>
    <div class="shortcut-row"><span class="shortcut-key">?</span><span class="shortcut-desc">Toggle this</span></div>
    <div class="shortcut-row"><span class="shortcut-key">Swipe</span><span class="shortcut-desc">Mobile nav</span></div>
    <button class="close-btn" onclick="closeShortcuts()">Close</button>
  </div>
</div>

<script>
const slides = [

/* ══════════════════════════════════════════════
   SLIDE 1 — TITLE
══════════════════════════════════════════════ */
`<div class="slide title-slide" data-index="0">
  <!-- decorative circuit traces -->
  <svg class="trace" style="right:0;top:0;width:380px;height:380px" viewBox="0 0 380 380" fill="none" aria-hidden="true">
    <path d="M360 0 L360 100 L240 100 L240 180 L340 180 L340 280 L220 280 L220 380" stroke="white" stroke-width="2"/>
    <path d="M380 50 L300 50 L300 160 L180 160" stroke="white" stroke-width="1.5"/>
    <circle cx="240" cy="100" r="5" fill="white"/><circle cx="340" cy="180" r="5" fill="white"/><circle cx="220" cy="280" r="5" fill="white"/>
  </svg>
  <svg class="trace" style="left:0;bottom:0;width:320px;height:320px" viewBox="0 0 320 320" fill="none" aria-hidden="true">
    <path d="M0 320 L0 200 L110 200 L110 130 L30 130 L30 40 L160 40 L160 0" stroke="white" stroke-width="2"/>
    <circle cx="110" cy="200" r="5" fill="white"/><circle cx="30" cy="130" r="5" fill="white"/><circle cx="160" cy="40" r="5" fill="white"/>
  </svg>

  <div class="title-hero">
    <div class="eyebrow">System Integration &amp; Architecture · Module 14</div>
    <h1>Hardware Integration 2<br><span style="color:var(--accent)">The Arduino Platform</span></h1>
    <p style="font-size:19px;color:var(--text-muted);margin-bottom:26px">Open-source hardware, the Maker Movement, and your first real project</p>
    <div class="logo-row">
      <!-- Arduino wordmark SVG inline -->
      <span class="badge teal">
        <svg width="22" height="22" viewBox="0 0 22 22" fill="none" role="img" aria-label="Arduino icon"><circle cx="11" cy="11" r="10" stroke="currentColor" stroke-width="1.8"/><path d="M6 11h3M13 11h3M8 8.5L6 11l2 2.5M14 8.5L16 11l-2 2.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Arduino
      </span>
      <span class="badge orange">🔌 Hardware</span>
      <span class="badge green">💻 IDE &amp; Sketch</span>
      <span class="badge purple">🧪 Wokwi Lab</span>
      <span class="badge yellow">🌐 Open Source</span>
    </div>
  </div>
</div>`,

/* ══════════════════════════════════════════════
   SLIDE 2 — LESSON PREVIEW
══════════════════════════════════════════════ */
`<div class="slide" data-index="1">
  <div class="eyebrow">Lesson Preview</div>
  <div class="slide-title">Zooming In on <span>Arduino</span></div>
  <div class="grid-2 w-full" style="max-width:900px;align-items:start">
    <div class="card">
      <h3>📡 Coming From M13…</h3>
      <p style="color:var(--text-muted)">Last module: <strong>Microcontrollers</strong> — the tiny ICs with CPU, Memory, and I/O on one chip. We learned about Harvard vs Von Neumann, CISC vs RISC.</p>
      <p class="mt-2">Now we zoom in on the world's most popular beginner microcontroller platform: <strong>Arduino</strong>.</p>
    </div>
    <div class="card">
      <h3>🎯 Learning Objectives</h3>
      <ul>
        <li>Discuss the concept, history, and purpose of <strong>Arduino</strong></li>
        <li>Identify and explain the <strong>hardware components</strong> of an Arduino project</li>
        <li>Understand the <strong>IDE and sketch workflow</strong></li>
        <li>Build simulations with <strong>Wokwi.com</strong></li>
      </ul>
    </div>
  </div>
  <div class="card mt-4" style="max-width:900px;width:100%;background:linear-gradient(135deg,rgba(0,180,216,.08),rgba(52,211,153,.06))">
    <p style="text-align:center;font-size:17px">🤖 Ever wanted to build a robot, a smart alarm, or an automated plant waterer? Arduino is your gateway.</p>
  </div>
</div>`,

/* ══════════════════════════════════════════════
   SLIDE 3 — WHAT IS ARDUINO
══════════════════════════════════════════════ */
`<div class="slide" data-index="2">
  <div class="eyebrow">Core Concept</div>
  <div class="slide-title">What is <span>Arduino</span>?</div>
  <div class="grid-2-wide w-full" style="max-width:940px;align-items:start">
    <div class="card">
      <h3>Open-Source Electronics Platform</h3>
      <p>Arduino combines <strong>easy-to-use hardware</strong> (physical circuit boards) and <strong>software</strong> (the IDE) into one accessible ecosystem.</p>
      <div class="grid-2 mt-3" style="gap:12px">
        <div class="card-inset">
          <h4>📥 Reads Inputs</h4>
          <p style="font-size:15px;color:var(--text-muted)">Light on a sensor, a finger on a button, a Twitter message, temperature readings…</p>
        </div>
        <div class="card-inset">
          <h4>📤 Produces Outputs</h4>
          <p style="font-size:15px;color:var(--text-muted)">Activating a motor, turning on an LED, publishing data online…</p>
        </div>
      </div>
      <div class="card-inset mt-3">
        <p style="font-size:16px">You program the board by sending <strong>instructions</strong> (a sketch) to the microcontroller using the <strong>Arduino IDE</strong>.</p>
      </div>
    </div>
    <div class="flex-col" style="gap:16px">
      <div class="card">
        <h3>🇮🇹 Brief History</h3>
        <p style="font-size:16px">Born at the <strong>Ivrea Interaction Design Institute</strong>, Italy. Created as a fast-prototyping tool for students <em>without</em> electronics or programming backgrounds.</p>
        <p style="font-size:16px;color:var(--text-muted);margin-top:8px">Evolved to handle IoT, 3D printing, and wearable tech. Now powers projects from consumer gadgets to scientific instruments.</p>
      </div>
      <div class="card">
        <h3>🌍 The Maker Movement</h3>
        <p style="font-size:16px">A worldwide community of <strong>makers, hobbyists, students, and professionals</strong> share knowledge freely, making Arduino the go-to platform for beginners and experts alike.</p>
      </div>
    </div>
  </div>
</div>`,

/* ══════════════════════════════════════════════
   SLIDE 4 — WHY ARDUINO
══════════════════════════════════════════════ */
`<div class="slide" data-index="3">
  <div class="eyebrow">Platform Advantages</div>
  <div class="slide-title">Why <span>Arduino</span>?</div>
  <div style="max-width:900px;width:100%">
    <div class="card w-full" style="margin-bottom:18px">
      <div class="tbl-wrap">
        <table>
          <thead><tr><th>Feature</th><th>Why It Matters</th></tr></thead>
          <tbody>
            <tr>
              <td><span style="color:var(--warning)">💰 Inexpensive</span></td>
              <td>Boards cost well under $50. The cheapest versions can be assembled by hand. Competing platforms often cost much more.</td>
            </tr>
            <tr>
              <td><span style="color:var(--accent3)">🖥️ Cross-Platform</span></td>
              <td>The Arduino IDE runs on <strong>Windows, macOS, and Linux</strong>. Many competing systems are Windows-only.</td>
            </tr>
            <tr>
              <td><span style="color:var(--accent)">🎯 Simple &amp; Clear IDE</span></td>
              <td>Incredibly easy for beginners, yet flexible enough for advanced users and complex projects.</td>
            </tr>
            <tr>
              <td><span style="color:var(--accent4)">🔓 Open Source &amp; Extensible</span></td>
              <td>Both software AND hardware are open-source. Hardware schematics are freely available — anyone can build their own version.</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
    <div class="grid-2 w-full" style="gap:14px">
      <div class="card-inset">
        <p style="font-size:16px">⚔️ <strong style="color:var(--text-muted)">Other platforms:</strong> Parallax Basic Stamp, Netmedia BX-24, MIT Handyboard — all more expensive and restricted.</p>
      </div>
      <div class="card-inset">
        <p style="font-size:16px">✅ <strong style="color:var(--accent)">Arduino wins</strong> on accessibility, community support, and open-source freedom across all platforms.</p>
      </div>
    </div>
  </div>
</div>`,

/* ══════════════════════════════════════════════
   SLIDE 5 — SOFTWARE & LANGUAGE
══════════════════════════════════════════════ */
`<div class="slide" data-index="4">
  <div class="eyebrow">Software Side</div>
  <div class="slide-title">The Arduino <span>Software &amp; Language</span></div>
  <div class="grid-2 w-full" style="max-width:900px;align-items:start">
    <div class="card">
      <div style="display:flex;align-items:center;gap:14px;margin-bottom:12px">
        <svg width="44" height="44" viewBox="0 0 44 44" fill="none" role="img" aria-label="C++ icon"><circle cx="22" cy="22" r="20" stroke="var(--accent3)" stroke-width="2"/><text x="22" y="28" text-anchor="middle" font-size="14" fill="var(--accent3)" font-family="monospace" font-weight="700">C++</text></svg>
        <h3 style="margin:0;color:var(--accent3)">Native Arduino Language (C++)</h3>
      </div>
      <p>The standard for writing <strong>sketches</strong> (programs) in the Arduino IDE. Built on C and C++, it abstracts away the messy low-level details of microcontroller programming.</p>
      <div class="card-inset mt-3">
        <p style="font-size:16px">📤 When you click <strong>Upload</strong>, the IDE:</p>
        <div style="display:flex;flex-direction:column;gap:8px;margin-top:8px">
          <div style="display:flex;align-items:center;gap:10px"><span class="badge teal" style="padding:4px 10px;font-size:14px">1</span><span style="font-size:15px"><strong>Compiles</strong> your C++ into Machine Code</span></div>
          <div style="display:flex;align-items:center;gap:10px"><span class="badge teal" style="padding:4px 10px;font-size:14px">2</span><span style="font-size:15px"><strong>Transfers</strong> it to Flash/EEPROM memory on the MCU</span></div>
          <div style="display:flex;align-items:center;gap:10px"><span class="badge teal" style="padding:4px 10px;font-size:14px">3</span><span style="font-size:15px">Board runs the code <strong>independently</strong></span></div>
        </div>
      </div>
    </div>
    <div class="card">
      <div style="display:flex;align-items:center;gap:14px;margin-bottom:12px">
        <svg width="44" height="44" viewBox="0 0 44 44" fill="none" role="img" aria-label="Python icon"><path d="M18 6c-6 0-8 3-8 7v4h12v2H8c-5 0-6 3-6 7s1 7 6 7h3v-5c0-4 3-6 7-6h8c4 0 6-3 6-6V13c0-4-3-7-7-7H18z" stroke="var(--accent2)" stroke-width="1.6" fill="none"/><path d="M26 38c6 0 8-3 8-7v-4H22v-2h12c5 0 6-3 6-7s-1-7-6-7h-3v5c0 4-3 6-7 6h-8c-4 0-6 3-6 6v7c0 4 3 7 7 7h9z" stroke="var(--accent4)" stroke-width="1.6" fill="none"/></svg>
        <h3 style="margin:0;color:var(--accent2)">MicroPython</h3>
      </div>
      <p>An implementation of <strong>Python 3</strong> designed to run on microcontrollers. If you already know Python, you can control Arduino I/O with it immediately.</p>
      <div class="card-inset mt-3">
        <h4>⚠️ Important Note</h4>
        <p style="font-size:15px">Installing MicroPython <em>replaces</em> the default C++ bootloader. To go back to C++ mode, you must <strong>re-flash the bootloader</strong> — guides available on the official Arduino website.</p>
      </div>
      <div class="badge orange mt-3" style="justify-content:flex-start">🔬 Uses a subset of Python's standard library</div>
    </div>
  </div>
</div>`,

/* ══════════════════════════════════════════════
   SLIDE 6 — HARDWARE COMPONENTS
══════════════════════════════════════════════ */
`<div class="slide" data-index="5">
  <div class="eyebrow">Hardware</div>
  <div class="slide-title">Arduino <span>Hardware Components</span></div>
  <div style="max-width:960px;width:100%">
    <div class="grid-2 w-full" style="align-items:start">
      <div class="card">
        <h3>🔧 Beginner Kit Essentials</h3>
        <div style="display:flex;flex-direction:column;gap:9px;margin-top:4px">
          <div style="display:flex;align-items:center;gap:12px">
            <span class="badge teal" style="padding:4px 10px;font-size:14px;min-width:28px;justify-content:center">1</span>
            <span style="font-size:16px"><strong>Arduino Uno</strong> — the most documented beginner board</span>
          </div>
          <div style="display:flex;align-items:center;gap:12px">

      </div>
      <div class="card-inset" style="border-left:3px solid var(--warning)">
        <p style="font-size:15px">🏆 <strong style="color:var(--warning)">Challenge:</strong> Change <code>1000</code> to <code>250</code> — the LED will blink 4× faster!</p>

    <div class="code-wrap" style="height:min(400px,46vh)">
      <div class="code-header">
        <span class="code-lang">sketch.ino — Blink</span>
        <button class="copy-btn" onclick="copyCode(this,'blink-code')">Copy</button>
      </div>
      <pre id="blink-code"><span class="cm">// Arduino "Blink" Sketch
// The "Hello World" of hardware!</span>

<span class="kw">void</span> <span class="fn">setup</span>() {
  <span class="cm">// Pin 13 = built-in LED on Arduino Uno
  // Set it as an OUTPUT pin</span>
  <span class="fn">pinMode</span>(<span class="num">13</span>, OUTPUT);
}

<span class="kw">void</span> <span class="fn">loop</span>() {
  <span class="cm">// Turn LED ON (send 5V to pin 13)</span>
  <span class="fn">digitalWrite</span>(<span class="num">13</span>, HIGH);

  <span class="cm">// Wait 1000 ms = 1 second</span>
  <span class="fn">delay</span>(<span class="num">1000</span>);

  <span class="cm">// Turn LED OFF (send 0V)</span>
  <span class="fn">digitalWrite</span>(<span class="num">13</span>, LOW);

  <span class="cm">// Wait 1 second before repeating</span>
  <span class="fn">delay</span>(<span class="num">1000</span>);

  <span class="cm">// loop() repeats forever!
  // This IS the MCU's endless cycle.</span>
}</pre>
    </div>
  </div>
</div>`,

/* ══════════════════════════════════════════════
   ENGINE
══════════════════════════════════════════════ */
const deck = document.getElementById('deck');
const totalSlides = slides.length;
let current = 0;

slides.forEach(html => {
  const wrap = document.createElement('div');
  wrap.innerHTML = html;
  deck.appendChild(wrap.firstElementChild);
});

const allSlides = document.querySelectorAll('.slide');
const progressBar = document.getElementById('progress-bar');
const counter = document.getElementById('counter');

function goTo(idx, dir = 1) {
  if (idx < 0 || idx >= totalSlides) return;
  const prev = allSlides[current];
  prev.classList.remove('active');
  prev.classList.add(dir > 0 ? 'exit-left' : 'exit-right');
  setTimeout(() => prev.classList.remove('exit-left','exit-right'), 400);
  current = idx;
  const next = allSlides[current];
  next.style.transform = dir > 0 ? 'translateX(60px)' : 'translateX(-60px)';
  next.classList.add('active');
  setTimeout(() => { next.style.transform = ''; }, 10);
  progressBar.style.width = ((current + 1) / totalSlides * 100) + '%';
  counter.textContent = (current + 1) + ' / ' + totalSlides;
}

allSlides[0].classList.add('active');
progressBar.style.width = (1 / totalSlides * 100) + '%';

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === 'ArrowDown') goTo(current + 1, 1);
  else if (e.key === 'ArrowLeft'  || e.key === 'ArrowUp')   goTo(current - 1, -1);
  else if (e.key === 'Home') goTo(0, -1);
  else if (e.key === 'End')  goTo(totalSlides - 1, 1);
  else if (e.key === '?') toggleShortcuts();
});

document.addEventListener('contextmenu', e => { e.preventDefault(); goTo(current + 1, 1); });
document.addEventListener('mousedown', e => {
  if (e.button === 3) { e.preventDefault(); e.stopImmediatePropagation(); goTo(current + 1,  1); }
  if (e.button === 4) { e.preventDefault(); e.stopImmediatePropagation(); goTo(current - 1, -1); }
}, true);

let touchX = 0;
document.addEventListener('touchstart', e => { touchX = e.touches[0].clientX; }, { passive: true });
document.addEventListener('touchend',   e => {
  const dx = touchX - e.changedTouches[0].clientX;
  if (Math.abs(dx) > 40) dx > 0 ? goTo(current + 1, 1) : goTo(current - 1, -1);
});

function copyCode(btn, id) {
  const pre = document.getElementById(id);
  navigator.clipboard.writeText(pre ? pre.innerText : '').then(() => {
    btn.textContent = 'Copied!'; btn.classList.add('copied');
    setTimeout(() => { btn.textContent = 'Copy'; btn.classList.remove('copied'); }, 1800);
  });
}
function toggleShortcuts() { document.getElementById('shortcuts-overlay').classList.toggle('show'); }
function closeShortcuts()  { document.getElementById('shortcuts-overlay').classList.remove('show'); }
document.getElementById('shortcuts-overlay').addEventListener('click', e => {
  if (e.target === document.getElementById('shortcuts-overlay')) closeShortcuts();
});
</script>
