<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SIA M15 – 2nd Periodical Quiz Review</title>
<style>
  :root {
    --bg: #181c1f;
    --bg2: #1d2226;
    --card: #222a2e;
    --shadow-dark: #0f1315;
    --shadow-light: #2d3a40;
    --accent:  #f59e0b;   /* gold / exam yellow */
    --accent2: #60a5fa;   /* blue */
    --accent3: #34d399;   /* green */
    --accent4: #a78bfa;   /* purple */
    --danger:  #f87171;
    --text: #e2e8f0;
    --text-muted: #94a3b8;
    --radius: 20px;
    --radius-sm: 12px;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); }

  #progress-bar { position: fixed; top: 0; left: 0; height: 3px; background: linear-gradient(90deg, var(--accent), var(--accent3)); transition: width .35s ease; z-index: 999; }
  #counter { position: fixed; bottom: 14px; right: 20px; font-size: 16px; color: var(--text-muted); z-index: 999; }

  #deck { width: 100%; height: 100%; position: relative; }
  .slide {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; justify-content: center; align-items: center;
    padding: 36px 52px;
    opacity: 0; pointer-events: none;
    transition: opacity .35s ease, transform .35s ease;
    transform: translateX(60px);
  }
  .slide.active { opacity: 1; pointer-events: auto; transform: translateX(0); }
  .slide.exit-left  { opacity: 0; transform: translateX(-60px); }
  .slide.exit-right { opacity: 0; transform: translateX(60px); }
  @media (prefers-reduced-motion: reduce) {
    .slide { transition: opacity .15s ease; transform: none !important; }
  }

  .eyebrow    { font-size: 12px; text-transform: uppercase; letter-spacing: 2.8px; color: var(--accent); margin-bottom: 8px; font-weight: 700; }
  .slide-title { font-size: clamp(24px, 3.2vw, 40px); font-weight: 800; color: var(--text); text-align: center; line-height: 1.2; margin-bottom: 24px; }
  .slide-title span { color: var(--accent); }

  .card { background: var(--card); border-radius: var(--radius); box-shadow: 6px 6px 16px var(--shadow-dark), -4px -4px 12px var(--shadow-light); padding: 22px 26px; }
  .card-inset { background: var(--bg2); border-radius: var(--radius-sm); box-shadow: inset 3px 3px 8px var(--shadow-dark), inset -2px -2px 6px var(--shadow-light); padding: 14px 18px; }

  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; width: 100%; }
  .grid-3 { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 16px; width: 100%; }

  p, li, td, th { font-size: 17px; line-height: 1.65; color: var(--text); }
  h3 { font-size: 19px; font-weight: 700; color: var(--accent); margin-bottom: 9px; }
  h4 { font-size: 17px; font-weight: 600; color: var(--accent2); margin-bottom: 7px; }
  ul { padding-left: 20px; }
  li { margin-bottom: 6px; }
  strong { color: var(--accent3); }

  .badge {
    display: inline-flex; align-items: center; gap: 7px;
    background: var(--card); box-shadow: 3px 3px 8px var(--shadow-dark), -2px -2px 6px var(--shadow-light);
    border-radius: 50px; padding: 7px 15px; font-size: 16px; font-weight: 600; color: var(--text);
  }
  .badge.gold   { color: var(--accent);  }
  .badge.blue   { color: var(--accent2); }
  .badge.green  { color: var(--accent3); }
  .badge.purple { color: var(--accent4); }
  .badge.red    { color: var(--danger);  }

  /* ── FILL-IN QUESTION CARD ── */
  .fib-card {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: 6px 6px 16px var(--shadow-dark), -4px -4px 12px var(--shadow-light);
    padding: 18px 22px;
    display: flex; flex-direction: column; gap: 8px;
  }
  .fib-q { font-size: 16px; color: var(--text-muted); line-height: 1.55; }
  .fib-a { font-size: 18px; font-weight: 700; color: var(--accent3); }
  .fib-num {
    width: 30px; height: 30px; min-width: 30px; border-radius: 50%; flex-shrink: 0;
    background: var(--accent); color: #1a1000; display: flex; align-items: center; justify-content: center;
    font-size: 15px; font-weight: 800; box-shadow: 3px 3px 7px var(--shadow-dark);
  }

  /* ── ERP DIAGRAM ── */
  .erp-center {
    background: linear-gradient(135deg, rgba(245,158,11,.2), rgba(96,165,250,.15));
    border: 2px solid var(--accent);
    border-radius: var(--radius-sm); padding: 14px 24px;
    font-size: 20px; font-weight: 800; color: var(--accent);
    box-shadow: 4px 4px 12px var(--shadow-dark), -3px -3px 9px var(--shadow-light);
    text-align: center;
  }
  .erp-node {
    background: var(--card);
    border-radius: var(--radius-sm);
    box-shadow: 5px 5px 12px var(--shadow-dark), -3px -3px 9px var(--shadow-light);
    padding: 12px 16px; text-align: center; font-size: 16px; font-weight: 700;
    display: flex; flex-direction: column; align-items: center; gap: 6px;
  }
  .erp-node .num { width: 24px; height: 24px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 800; }

  /* ── ANSWER REVEAL (interactive quiz) ── */
  .reveal-card {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: 6px 6px 16px var(--shadow-dark), -4px -4px 12px var(--shadow-light);
    padding: 20px 24px; cursor: pointer; transition: transform .15s;
    user-select: none;
  }
  .reveal-card:hover { transform: translateY(-2px); }
  .reveal-card .question { font-size: 17px; font-weight: 600; color: var(--text); line-height: 1.5; }
  .reveal-card .answer { display: none; margin-top: 10px; font-size: 18px; font-weight: 700; color: var(--accent3); border-top: 1px solid rgba(255,255,255,.08); padding-top: 10px; }
  .reveal-card.shown .answer { display: block; }
  .reveal-card .tap-hint { font-size: 13px; color: var(--text-muted); margin-top: 8px; text-align: right; }
  .reveal-card.shown .tap-hint { display: none; }

  .tbl-wrap { width: 100%; overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 16px; }
  th { background: var(--bg); color: var(--accent); padding: 11px 14px; text-align: left; font-size: 15px; text-transform: uppercase; letter-spacing: .8px; }
  td { padding: 10px 14px; border-bottom: 1px solid rgba(255,255,255,.07); vertical-align: top; }
  tr:last-child td { border-bottom: none; }

  #shortcuts-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.72); z-index: 9999; align-items: center; justify-content: center; }
  #shortcuts-overlay.show { display: flex; }
  .shortcuts-box { background: var(--card); border-radius: var(--radius); padding: 34px 42px; box-shadow: 10px 10px 30px var(--shadow-dark); max-width: 400px; width: 90%; }
  .shortcuts-box h2 { font-size: 21px; color: var(--accent); margin-bottom: 16px; text-align: center; }
  .shortcut-row { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,.07); }
  .shortcut-row:last-child { border-bottom: none; }
  .shortcut-key  { background: var(--bg2); border-radius: 7px; padding: 4px 10px; font-size: 15px; font-family: monospace; color: var(--accent); }
  .shortcut-desc { font-size: 16px; color: var(--text-muted); }
  .close-btn { display: block; margin: 18px auto 0; background: var(--card); box-shadow: 4px 4px 10px var(--shadow-dark), -2px -2px 7px var(--shadow-light); border: none; border-radius: 12px; padding: 9px 26px; font-size: 17px; color: var(--text); cursor: pointer; }

  .w-full { width: 100%; }
  .mt-2 { margin-top: 10px; }
  .mt-3 { margin-top: 14px; }
  .mt-4 { margin-top: 20px; }
  .flex-col { display: flex; flex-direction: column; }
  .inner-scroll { overflow-y: auto; max-height: 58vh; padding-right: 4px; }
  .inner-scroll::-webkit-scrollbar { width: 5px; }
  .inner-scroll::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 10px; }
</style>
</head>
<body>

<div id="progress-bar"></div>
<div id="counter">1 / 14</div>
<div id="deck"></div>

<div id="shortcuts-overlay">
  <div class="shortcuts-box">
    <h2>⌨️ Shortcuts</h2>
    <div class="shortcut-row"><span class="shortcut-key">→ / Right-click</span><span class="shortcut-desc">Next slide</span></div>
    <div class="shortcut-row"><span class="shortcut-key">←</span><span class="shortcut-desc">Prev slide</span></div>
    <div class="shortcut-row"><span class="shortcut-key">Home</span><span class="shortcut-desc">First slide</span></div>
    <div class="shortcut-row"><span class="shortcut-key">End</span><span class="shortcut-desc">Last slide</span></div>
    <div class="shortcut-row"><span class="shortcut-key">?</span><span class="shortcut-desc">Toggle this</span></div>
    <div class="shortcut-row"><span class="shortcut-key">Tap card</span><span class="shortcut-desc">Reveal answer</span></div>
    <button class="close-btn" onclick="closeShortcuts()">Close</button>
  </div>
</div>

<script>
const slides = [

/* ══════════════════════════════════════════════
   SLIDE 1 — TITLE
══════════════════════════════════════════════ */
`<div class="slide" data-index="0" style="background:radial-gradient(ellipse at 50% 40%, #1f1800 0%, var(--bg) 70%)">
  <!-- decorative star/sparkle -->
  <svg style="position:absolute;top:20px;right:40px;opacity:.12;pointer-events:none" width="200" height="200" viewBox="0 0 200 200" fill="none" aria-hidden="true">
    <path d="M100 10 L112 88 L190 100 L112 112 L100 190 L88 112 L10 100 L88 88 Z" fill="white"/>
  </svg>
  <svg style="position:absolute;bottom:30px;left:30px;opacity:.08;pointer-events:none" width="160" height="160" viewBox="0 0 160 160" fill="none" aria-hidden="true">
    <path d="M80 8 L90 70 L152 80 L90 90 L80 152 L70 90 L8 80 L70 70 Z" fill="white"/>
  </svg>

  <div style="text-align:center;max-width:800px">
    <div class="eyebrow">System Integration &amp; Architecture · Module 15</div>
    <h1 style="font-size:clamp(28px,5vw,52px);font-weight:800;line-height:1.1;margin-bottom:14px">
      2nd Periodical<br><span style="color:var(--accent)">Quiz Review</span>
    </h1>
    <p style="font-size:19px;color:var(--text-muted);margin-bottom:28px">
      Covering Modules 11–14 · Usability, APIs, REST, Microcontrollers &amp; Arduino
    </p>
    <div style="display:flex;gap:13px;flex-wrap:wrap;justify-content:center">
      <span class="badge gold">📋 13 Fill-in-the-Blanks</span>
      <span class="badge blue">📦 3 Resource Representations</span>
      <span class="badge green">🔗 4 REST Constraints</span>
      <span class="badge purple">🏢 6 ERP Components</span>
    </div>
    <div style="margin-top:28px;background:var(--card);border-radius:var(--radius-sm);padding:14px 20px;box-shadow:inset 3px 3px 8px var(--shadow-dark),inset -2px -2px 6px var(--shadow-light)">
      <p style="font-size:16px;color:var(--text-muted)">💡 <strong style="color:var(--accent)">How to use:</strong> Each card shows the question. <strong>Tap / click the card</strong> to reveal the answer. Use → to advance slides.</p>
    </div>
  </div>
</div>`,

/* ══════════════════════════════════════════════
   SLIDE 2 — QUESTIONS 1–4 (tap to reveal)
══════════════════════════════════════════════ */
`<div class="slide" data-index="1">
  <div class="eyebrow">Fill in the Blanks</div>
  <div class="slide-title">Questions <span>1 – 4</span></div>
  <div class="grid-2 w-full" style="max-width:920px;align-items:start">
    <div class="reveal-card" onclick="this.classList.toggle('shown')">
      <div style="display:flex;align-items:center;gap:12px;margin-bottom:8px">
        <div style="width:30px;height:30px;min-width:30px;border-radius:50%;background:var(--accent);color:#1a1000;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:800">1</div>
        <span style="font-size:13px;color:var(--text-muted);font-weight:600;text-transform:uppercase;letter-spacing:1px">Hardware</span>
      </div>
      <div class="question">A compact integrated circuit designed to govern a specific operation in an embedded system.</div>
      <div class="answer">✅ Microcontroller (MCU)</div>
      <div class="tap-hint">👆 Tap to reveal</div>
    </div>
    <div class="reveal-card" onclick="this.classList.toggle('shown')">
      <div style="display:flex;align-items:center;gap:12px;margin-bottom:8px">
        <div style="width:30px;height:30px;min-width:30px;border-radius:50%;background:var(--accent);color:#1a1000;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:800">2</div>
        <span style="font-size:13px;color:var(--text-muted);font-weight:600;text-transform:uppercase;letter-spacing:1px">Hardware</span>
      </div>
      <div class="question">It can be thought of as the brain of the device.</div>
      <div class="answer">✅ Processor / Central Processing Unit (CPU)</div>
      <div class="tap-hint">👆 Tap to reveal</div>
    </div>
    <div class="reveal-card" onclick="this.classList.toggle('shown')">
      <div style="display:flex;align-items:center;gap:12px;margin-bottom:8px">
        <div style="width:30px;height:30px;min-width:30px;border-radius:50%;background:var(--accent);color:#1a1000;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:800">3</div>
        <span style="font-size:13px;color:var(--text-muted);font-weight:600;text-transform:uppercase;letter-spacing:1px">Acronym</span>
      </div>
      <div class="question">CPU stands for?</div>
      <div class="answer">✅ Central Processing Unit</div>
      <div class="tap-hint">👆 Tap to reveal</div>
    </div>
    <div class="reveal-card" onclick="this.classList.toggle('shown')">
      <div style="display:flex;align-items:center;gap:12px;margin-bottom:8px">
        <div style="width:30px;height:30px;min-width:30px;border-radius:50%;background:var(--accent);color:#1a1000;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:800">4</div>
        <span style="font-size:13px;color:var(--text-muted);font-weight:600;text-transform:uppercase;letter-spacing:1px">Hardware</span>
      </div>
      <div class="question">It is used to store the data that the processor receives and uses to respond to instructions it's been programmed to carry out.</div>
      <div class="answer">✅ Memory / Data Memory</div>
      <div class="tap-hint">👆 Tap to reveal</div>
    </div>
  </div>
</div>`,

/* ══════════════════════════════════════════════
   SLIDE 3 — QUESTIONS 5–8
══════════════════════════════════════════════ */
`<div class="slide" data-index="2">
  <div class="eyebrow">Fill in the Blanks</div>
  <div class="slide-title">Questions <span>5 – 8</span></div>
  <div class="grid-2 w-full" style="max-width:920px;align-items:start">
    <div class="reveal-card" onclick="this.classList.toggle('shown')">
      <div style="display:flex;align-items:center;gap:12px;margin-bottom:8px">
        <div style="width:30px;height:30px;min-width:30px;border-radius:50%;background:var(--accent3);color:#071a0f;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:800">5</div>
        <span style="font-size:13px;color:var(--text-muted);font-weight:600;text-transform:uppercase;letter-spacing:1px">Memory</span>
      </div>
      <div class="question">It is non-volatile memory, meaning it holds information over time without needing a power source.</div>
      <div class="answer">✅ Program Memory<br><span style="font-size:15px;color:var(--text-muted)">(ROM, EPROM, Flash)</span></div>
      <div class="tap-hint">👆 Tap to reveal</div>
    </div>
    <div class="reveal-card" onclick="this.classList.toggle('shown')">
      <div style="display:flex;align-items:center;gap:12px;margin-bottom:8px">
        <div style="width:30px;height:30px;min-width:30px;border-radius:50%;background:var(--accent3);color:#071a0f;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:800">6</div>
        <span style="font-size:13px;color:var(--text-muted);font-weight:600;text-transform:uppercase;letter-spacing:1px">Memory</span>
      </div>
      <div class="question">The data it holds is temporary and is only maintained if the device is connected to a power source.</div>
      <div class="answer">✅ Data Memory / RAM<br><span style="font-size:15px;color:var(--text-muted)">(Volatile Memory)</span></div>
      <div class="tap-hint">👆 Tap to reveal</div>
    </div>
    <div class="reveal-card" onclick="this.classList.toggle('shown')">
      <div style="display:flex;align-items:center;gap:12px;margin-bottom:8px">
        <div style="width:30px;height:30px;min-width:30px;border-radius:50%;background:var(--accent2);color:#071224;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:800">7</div>
        <span style="font-size:13px;color:var(--text-muted);font-weight:600;text-transform:uppercase;letter-spacing:1px">Acronym</span>
      </div>
      <div class="question">API stands for?</div>
      <div class="answer">✅ Application Programming Interface</div>
      <div class="tap-hint">👆 Tap to reveal</div>
    </div>
    <div class="reveal-card" onclick="this.classList.toggle('shown')">
      <div style="display:flex;align-items:center;gap:12px;margin-bottom:8px">
        <div style="width:30px;height:30px;min-width:30px;border-radius:50%;background:var(--accent2);color:#071224;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:800">8</div>
        <span style="font-size:13px;color:var(--text-muted);font-weight:600;text-transform:uppercase;letter-spacing:1px">REST / APIs</span>
      </div>
      <div class="question">It can be a document or image, a temporal service, a collection of other resources, or a non-virtual object.</div>
      <div class="answer">✅ Resource</div>
      <div class="tap-hint">👆 Tap to reveal</div>
    </div>
  </div>
</div>`,

/* ══════════════════════════════════════════════
   SLIDE 4 — QUESTIONS 9–13
══════════════════════════════════════════════ */
`<div class="slide" data-index="3">
  <div class="eyebrow">Fill in the Blanks</div>
  <div class="slide-title">Questions <span>9 – 13</span></div>
  <div style="max-width:960px;width:100%;display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start">
    <div class="reveal-card" onclick="this.classList.toggle('shown')">
      <div style="display:flex;align-items:center;gap:12px;margin-bottom:8px">
        <div style="width:30px;height:30px;min-width:30px;border-radius:50%;background:var(--accent4);color:#0d0720;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:800">9</div>
        <span style="font-size:13px;color:var(--text-muted);font-weight:600;text-transform:uppercase;letter-spacing:1px">Acronym</span>

      <div class="question">URI stands for?</div>
      <div class="answer">✅ Uniform Resource Identifier</div>
      <div class="tap-hint">👆 Tap to reveal</div>

    <div class="reveal-card" onclick="this.classList.toggle('shown')">
      <div style="display:flex;align-items:center;gap:12px;margin-bottom:8px">
        <div style="width:30px;height:30px;min-width:30px;border-radius:50%;background:var(--accent4);color:#0d0720;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:800">10</div>
        <span style="font-size:13px;color:var(--text-muted);font-weight:600;text-transform:uppercase;letter-spacing:1px">Usability</span>
      </div>
      <div class="question">In user testing, an ___ is any wrong action performed while completing a task.</div>
      <div class="answer">✅ Error</div>
      <div class="tap-hint">👆 Tap to reveal</div>
    </div>
    <div class="reveal-card" onclick="this.classList.toggle('shown')">
      <div style="display:flex;align-items:center;gap:12px;margin-bottom:8px">
        <div style="width:30px;height:30px;min-width:30px;border-radius:50%;background:var(--danger);color:#1a0000;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:800">11</div>
        <span style="font-size:13px;color:var(--text-muted);font-weight:600;text-transform:uppercase;letter-spacing:1px">Usability</span>
      </div>
      <div class="question">Good usability typically means that users can perform their tasks successfully and fast.</div>
      <div class="answer">✅ Efficiency of Use</div>
      <div class="tap-hint">👆 Tap to reveal</div>
    </div>
    <div class="reveal-card" onclick="this.classList.toggle('shown')">
      <div style="display:flex;align-items:center;gap:12px;margin-bottom:8px">
        <div style="width:30px;height:30px;min-width:30px;border-radius:50%;background:var(--danger);color:#1a0000;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:800">12</div>
        <span style="font-size:13px;color:var(--text-muted);font-weight:600;text-transform:uppercase;letter-spacing:1px">Usability</span>
      </div>
      <div class="question">It is a quality of use, which means it's defined or measured for a given context in which a system is operated.</div>
      <div class="answer">✅ Usability</div>
      <div class="tap-hint">👆 Tap to reveal</div>
    </div>
    <div class="reveal-card" onclick="this.classList.toggle('shown')" style="grid-column:1/-1">
      <div style="display:flex;align-items:center;gap:12px;margin-bottom:8px">
        <div style="width:30px;height:30px;min-width:30px;border-radius:50%;background:var(--danger);color:#1a0000;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:800">13</div>
        <span style="font-size:13px;color:var(--text-muted);font-weight:600;text-transform:uppercase;letter-spacing:1px">Usability</span>
      </div>
      <div class="question">It refers to the controlled element of user experience design that makes sure that users do not face problems when using a website's user interface or product.</div>
      <div class="answer">✅ Software Usability</div>
      <div class="tap-hint">👆 Tap to reveal</div>
    </div>
  </div>
</div>`,

/* ══════════════════════════════════════════════
   SLIDE 5 — QUESTION 14: RESOURCE REPRESENTATIONS
══════════════════════════════════════════════ */
`<div class="slide" data-index="4">
  <div class="eyebrow">Question 14</div>
  <div class="slide-title">3 Resource <span>Representations</span></div>
  <div style="max-width:860px;width:100%">
    <div class="card" style="margin-bottom:18px;background:linear-gradient(135deg,rgba(96,165,250,.07),rgba(52,211,153,.05))">
      <p style="text-align:center;font-size:17px;color:var(--text-muted)">In REST, a <strong>Resource Representation</strong> consists of three parts that describe the state of a resource at any given moment.</p>
    </div>
    <div class="grid-3 w-full">
      <div class="card" style="text-align:center;border-top:3px solid var(--accent2)">
        <svg width="48" height="48" viewBox="0 0 48 48" fill="none" style="margin:0 auto 12px" role="img" aria-label="Data icon">
          <rect x="8" y="8" width="32" height="32" rx="7" stroke="var(--accent2)" stroke-width="2"/>
          <path d="M15 20h18M15 28h12" stroke="var(--accent2)" stroke-width="2" stroke-linecap="round"/>
        </svg>
        <h3 style="color:var(--accent2)">1. The Data</h3>
        <p style="font-size:16px;color:var(--text-muted)">The actual content — e.g., a user's profile info, a list of products, weather readings.</p>
      </div>
      <div class="card" style="text-align:center;border-top:3px solid var(--accent)">
        <svg width="48" height="48" viewBox="0 0 48 48" fill="none" style="margin:0 auto 12px" role="img" aria-label="Metadata icon">
          <circle cx="24" cy="24" r="18" stroke="var(--accent)" stroke-width="2"/>
          <path d="M24 14v10l5 5" stroke="var(--accent)" stroke-width="2" stroke-linecap="round"/>
        </svg>
        <h3 style="color:var(--accent)">2. The Metadata</h3>
        <p style="font-size:16px;color:var(--text-muted)">Information describing the data — content type, cache controls, authentication tokens.</p>
      </div>
      <div class="card" style="text-align:center;border-top:3px solid var(--accent3)">
        <svg width="48" height="48" viewBox="0 0 48 48" fill="none" style="margin:0 auto 12px" role="img" aria-label="Hypermedia links icon">
          <path d="M18 24h12M30 24l-5-5M30 24l-5 5" stroke="var(--accent3)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="24" cy="24" r="18" stroke="var(--accent3)" stroke-width="2"/>
        </svg>
        <h3 style="color:var(--accent3)">3. Hypermedia Links</h3>
        <p style="font-size:16px;color:var(--text-muted)">Links helping the client transition to the next state — e.g., a "next page" link in results.</p>
      </div>
    </div>
    <div class="card-inset mt-4" style="border-left:4px solid var(--accent)">
      <p style="font-size:16px">💡 <strong style="color:var(--accent)">Remember:</strong> A resource is an <em>abstraction</em>. Its current state = Data + Metadata + Hypermedia Links. The same resource can be returned as HTML, XML, or JSON depending on what the client accepts.</p>
    </div>
  </div>
</div>`,

/* ══════════════════════════════════════════════
   SLIDE 6 — QUESTION 15: REST CONSTRAINTS
══════════════════════════════════════════════ */
`<div class="slide" data-index="5">
  <div class="eyebrow">Question 15</div>
  <div class="slide-title">4 Formal <span>REST Constraints</span></div>
  <div style="max-width:880px;width:100%">
    <div class="grid-2 w-full">
      <div class="card" style="border-left:4px solid var(--accent2)">
        <div style="display:flex;align-items:center;gap:14px;margin-bottom:10px">
          <span style="font-size:32px">🔀</span>
          <div>
            <div style="font-size:13px;text-transform:uppercase;letter-spacing:1.5px;color:var(--accent2);font-weight:700;margin-bottom:3px">Constraint 1</div>
            <h3 style="margin:0;color:var(--accent2)">Client-Server Architecture</h3>
          </div>
        </div>
        <p style="font-size:16px"><strong>Separation of concerns</strong> — the UI (client) is entirely separated from data storage (server). Each can evolve independently without breaking the other.</p>
      </div>
      <div class="card" style="border-left:4px solid var(--accent3)">
        <div style="display:flex;align-items:center;gap:14px;margin-bottom:10px">
          <span style="font-size:32px">🧠</span>
          <div>
            <div style="font-size:13px;text-transform:uppercase;letter-spacing:1.5px;color:var(--accent3);font-weight:700;margin-bottom:3px">Constraint 2</div>
            <h3 style="margin:0;color:var(--accent3)">Statelessness</h3>
          </div>
        </div>
        <p style="font-size:16px">The server stores <strong>no session data</strong> between requests. Every request must contain all the info needed. Ideal for high-volume applications.</p>
      </div>
      <div class="card" style="border-left:4px solid var(--accent)">
        <div style="display:flex;align-items:center;gap:14px;margin-bottom:10px">
          <span style="font-size:32px">⚡</span>
          <div>
            <div style="font-size:13px;text-transform:uppercase;letter-spacing:1.5px;color:var(--accent);font-weight:700;margin-bottom:3px">Constraint 3</div>
            <h3 style="margin:0;color:var(--accent)">Cache-ability</h3>
          </div>
        </div>
        <p style="font-size:16px">Clients and intermediaries can <strong>cache API responses</strong>. Reusing previously fetched data dramatically improves performance and reduces server load.</p>
      </div>
      <div class="card" style="border-left:4px solid var(--accent4)">
        <div style="display:flex;align-items:center;gap:14px;margin-bottom:10px">
          <span style="font-size:32px">🏗️</span>
          <div>
            <div style="font-size:13px;text-transform:uppercase;letter-spacing:1.5px;color:var(--accent4);font-weight:700;margin-bottom:3px">Constraint 4</div>
            <h3 style="margin:0;color:var(--accent4)">Layered System</h3>
          </div>
        </div>
        <p style="font-size:16px">A client doesn't need to know if it's connected to the final server or an <strong>intermediary</strong> (CDN, load balancer). Improves scalability and security.</p>
      </div>
    </div>
  </div>
</div>`,

/* ══════════════════════════════════════════════
   ENGINE
══════════════════════════════════════════════ */
const deck = document.getElementById('deck');
const total = slides.length;
let current = 0;

slides.forEach(html => {
  const w = document.createElement('div');
  w.innerHTML = html;
  deck.appendChild(w.firstElementChild);
});

const allSlides = document.querySelectorAll('.slide');
const bar = document.getElementById('progress-bar');
const ctr = document.getElementById('counter');

function goTo(idx, dir = 1) {
  if (idx < 0 || idx >= total) return;
  const prev = allSlides[current];
  prev.classList.remove('active');
  prev.classList.add(dir > 0 ? 'exit-left' : 'exit-right');
  setTimeout(() => prev.classList.remove('exit-left','exit-right'), 400);
  current = idx;
  const next = allSlides[current];
  next.style.transform = dir > 0 ? 'translateX(60px)' : 'translateX(-60px)';
  next.classList.add('active');
  setTimeout(() => { next.style.transform = ''; }, 10);
  bar.style.width = ((current + 1) / total * 100) + '%';
  ctr.textContent = (current + 1) + ' / ' + total;
}

allSlides[0].classList.add('active');
bar.style.width = (1 / total * 100) + '%';

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === 'ArrowDown') goTo(current + 1,  1);
  else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') goTo(current - 1, -1);
  else if (e.key === 'Home') goTo(0, -1);
  else if (e.key === 'End')  goTo(total - 1, 1);
  else if (e.key === '?') toggleShortcuts();
});

document.addEventListener('contextmenu', e => { e.preventDefault(); goTo(current + 1, 1); });
document.addEventListener('mousedown', e => {
  if (e.button === 3) { e.preventDefault(); e.stopImmediatePropagation(); goTo(current + 1,  1); }
  if (e.button === 4) { e.preventDefault(); e.stopImmediatePropagation(); goTo(current - 1, -1); }
}, true);

let touchX = 0;
document.addEventListener('touchstart', e => { touchX = e.touches[0].clientX; }, { passive: true });
document.addEventListener('touchend', e => {
  const dx = touchX - e.changedTouches[0].clientX;
  if (Math.abs(dx) > 40) dx > 0 ? goTo(current + 1, 1) : goTo(current - 1, -1);
});

function toggleShortcuts() { document.getElementById('shortcuts-overlay').classList.toggle('show'); }
function closeShortcuts()  { document.getElementById('shortcuts-overlay').classList.remove('show'); }
document.getElementById('shortcuts-overlay').addEventListener('click', e => {
  if (e.target === document.getElementById('shortcuts-overlay')) closeShortcuts();
});
</script>
