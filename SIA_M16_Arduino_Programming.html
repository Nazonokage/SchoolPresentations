<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SIA M16 – Arduino Programming & Simulation</title>
<style>
  :root {
    --bg: #181c1f;
    --bg2: #1d2226;
    --card: #222a2e;
    --shadow-dark: #0f1315;
    --shadow-light: #2d3a40;
    --accent:  #e879f9;  /* vivid magenta/purple — IDE energy */
    --accent2: #38bdf8;  /* sky blue — wokwi */
    --accent3: #34d399;  /* green — circuit/code */
    --accent4: #fb923c;  /* orange — warning/tip */
    --text: #e2e8f0;
    --text-muted: #94a3b8;
    --danger: #f87171;
    --warning: #fbbf24;
    --radius: 20px;
    --radius-sm: 12px;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); }

  #progress-bar { position: fixed; top: 0; left: 0; height: 3px; background: linear-gradient(90deg, var(--accent), var(--accent2), var(--accent3)); transition: width .35s ease; z-index: 999; }
  #counter { position: fixed; bottom: 14px; right: 20px; font-size: 16px; color: var(--text-muted); z-index: 999; }

  #deck { width: 100%; height: 100%; position: relative; }
  .slide {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; justify-content: center; align-items: center;
    padding: 36px 52px;
    opacity: 0; pointer-events: none;
    transition: opacity .35s ease, transform .35s ease;
    transform: translateX(60px);
  }
  .slide.active  { opacity: 1; pointer-events: auto; transform: translateX(0); }
  .slide.exit-left  { opacity: 0; transform: translateX(-60px); }
  .slide.exit-right { opacity: 0; transform: translateX(60px); }
  @media (prefers-reduced-motion: reduce) {
    .slide { transition: opacity .15s ease; transform: none !important; }
  }

  .eyebrow    { font-size: 12px; text-transform: uppercase; letter-spacing: 2.8px; color: var(--accent); margin-bottom: 8px; font-weight: 700; }
  .slide-title { font-size: clamp(24px, 3.2vw, 40px); font-weight: 800; color: var(--text); text-align: center; line-height: 1.2; margin-bottom: 24px; }
  .slide-title span { color: var(--accent); }

  .card { background: var(--card); border-radius: var(--radius); box-shadow: 6px 6px 16px var(--shadow-dark), -4px -4px 12px var(--shadow-light); padding: 22px 26px; }
  .card-inset { background: var(--bg2); border-radius: var(--radius-sm); box-shadow: inset 3px 3px 8px var(--shadow-dark), inset -2px -2px 6px var(--shadow-light); padding: 14px 18px; }

  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; width: 100%; }
  .grid-3 { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 16px; width: 100%; }
  .grid-2-wide { display: grid; grid-template-columns: 1.1fr 0.9fr; gap: 20px; width: 100%; }

  p, li, td, th { font-size: 17px; line-height: 1.65; color: var(--text); }
  h3 { font-size: 19px; font-weight: 700; color: var(--accent); margin-bottom: 9px; }
  h4 { font-size: 17px; font-weight: 600; color: var(--accent2); margin-bottom: 7px; }
  ul { padding-left: 20px; }
  li { margin-bottom: 6px; }
  strong { color: var(--accent3); }
  code { font-family: 'Cascadia Code','Fira Code',Consolas,monospace; font-size: 15px; color: var(--accent3); background: var(--bg2); padding: 2px 7px; border-radius: 5px; }

  .badge {
    display: inline-flex; align-items: center; gap: 7px;
    background: var(--card); box-shadow: 3px 3px 8px var(--shadow-dark), -2px -2px 6px var(--shadow-light);
    border-radius: 50px; padding: 7px 15px; font-size: 16px; font-weight: 600; color: var(--text);
  }
  .badge.purple { color: var(--accent);  }
  .badge.blue   { color: var(--accent2); }
  .badge.green  { color: var(--accent3); }
  .badge.orange { color: var(--accent4); }
  .badge.red    { color: var(--danger);  }
  .badge.yellow { color: var(--warning); }

  /* code blocks */
  .code-wrap { position: relative; border-radius: var(--radius-sm); overflow: hidden; background: #0d1117; display: flex; flex-direction: column; min-height: 0; }
  .code-header { display: flex; align-items: center; justify-content: space-between; padding: 9px 16px; background: #161b22; flex-shrink: 0; }
  .code-lang { font-size: 16px; color: #8b949e; font-family: monospace; }
  .copy-btn {
    font-size: 15px; padding: 5px 13px; border-radius: 8px; border: none; cursor: pointer; font-weight: 600;
    background: var(--card); color: var(--text); box-shadow: 3px 3px 7px var(--shadow-dark), -2px -2px 5px var(--shadow-light); transition: all .15s;
  }
  .copy-btn.copied { box-shadow: inset 2px 2px 5px var(--shadow-dark), inset -1px -1px 4px var(--shadow-light); color: var(--accent3); }
  pre { flex: 1; overflow: auto; padding: 16px; margin: 0; font-size: 13.5px; line-height: 1.65; font-family: 'Cascadia Code','Fira Code',Consolas,monospace; min-height: 0; }
  .kw  { color: #ff7b72; } .fn  { color: #d2a8ff; } .str { color: #a5d6ff; }
  .cm  { color: #8b949e; font-style: italic; } .num { color: #f0db4f; }
  .prop{ color: #7ee787; } .inc { color: #ff7b72; } .tp  { color: #ffa657; }

  /* wokwi UI mockup */
  .wokwi-mock { border-radius: var(--radius-sm); overflow: hidden; box-shadow: 6px 6px 16px var(--shadow-dark); }
  .wokwi-bar { background: #1a1a2e; padding: 10px 16px; display: flex; align-items: center; gap: 10px; }
  .wokwi-dot { width: 12px; height: 12px; border-radius: 50%; }
  .wokwi-title { font-size: 14px; color: #8b949e; font-family: monospace; margin-left: 8px; }
  .wokwi-body { display: grid; grid-template-columns: 1fr 1fr; }
  .wokwi-left  { background: #12141a; padding: 14px; }
  .wokwi-right { background: #0d1117; padding: 14px; display: flex; align-items: center; justify-content: center; }
  .tab-row { display: flex; gap: 4px; margin-bottom: 10px; }
  .tab { background: #222; border-radius: 6px 6px 0 0; padding: 5px 12px; font-size: 13px; color: #8b949e; font-family: monospace; cursor: default; }
  .tab.active { background: #2a2a3a; color: var(--accent2); }

  /* MCQ */
  .mcq-card { background: var(--card); border-radius: var(--radius); box-shadow: 6px 6px 16px var(--shadow-dark), -4px -4px 12px var(--shadow-light); padding: 20px 24px; display: flex; flex-direction: column; gap: 11px; }
  .mcq-q { font-size: 17px; font-weight: 600; color: var(--text); line-height: 1.5; }
  .mcq-opts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .mcq-opt { background: var(--bg2); border-radius: 10px; padding: 9px 13px; font-size: 16px; box-shadow: inset 2px 2px 5px var(--shadow-dark), inset -1px -1px 4px var(--shadow-light); }

  /* answer key */
  .ans-row { display: flex; align-items: flex-start; gap: 13px; padding: 11px 0; border-bottom: 1px solid rgba(255,255,255,.06); }
  .ans-num { background: var(--accent); color: #1a001f; border-radius: 50%; width: 28px; height: 28px; min-width: 28px; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 800; }
  .ans-text { font-size: 17px; line-height: 1.55; }
  .ans-correct { color: var(--accent3); font-weight: 700; }

  /* shortcuts */
  #shortcuts-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.72); z-index: 9999; align-items: center; justify-content: center; }
  #shortcuts-overlay.show { display: flex; }
  .shortcuts-box { background: var(--card); border-radius: var(--radius); padding: 34px 42px; box-shadow: 10px 10px 30px var(--shadow-dark); max-width: 400px; width: 90%; }
  .shortcuts-box h2 { font-size: 21px; color: var(--accent); margin-bottom: 16px; text-align: center; }
  .shortcut-row { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,.07); }
  .shortcut-row:last-child { border-bottom: none; }
  .shortcut-key  { background: var(--bg2); border-radius: 7px; padding: 4px 10px; font-size: 15px; font-family: monospace; color: var(--accent); }
  .shortcut-desc { font-size: 16px; color: var(--text-muted); }
  .close-btn { display: block; margin: 18px auto 0; background: var(--card); box-shadow: 4px 4px 10px var(--shadow-dark), -2px -2px 7px var(--shadow-light); border: none; border-radius: 12px; padding: 9px 26px; font-size: 17px; color: var(--text); cursor: pointer; }

  .w-full { width: 100%; }
  .mt-2 { margin-top: 10px; }
  .mt-3 { margin-top: 14px; }
  .mt-4 { margin-top: 20px; }
  .flex-col { display: flex; flex-direction: column; }
  .inner-scroll { overflow-y: auto; max-height: 58vh; padding-right: 4px; }
  .inner-scroll::-webkit-scrollbar { width: 5px; }
  .inner-scroll::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 10px; }
  .trace { position: absolute; opacity: .05; pointer-events: none; }
</style>
</head>
<body>

<div id="progress-bar"></div>
<div id="counter">1 / 19</div>
<div id="deck"></div>

<div id="shortcuts-overlay">
  <div class="shortcuts-box">
    <h2>⌨️ Shortcuts</h2>
    <div class="shortcut-row"><span class="shortcut-key">→ / Right-click</span><span class="shortcut-desc">Next slide</span></div>
    <div class="shortcut-row"><span class="shortcut-key">←</span><span class="shortcut-desc">Prev slide</span></div>
    <div class="shortcut-row"><span class="shortcut-key">Home / End</span><span class="shortcut-desc">First / Last</span></div>
    <div class="shortcut-row"><span class="shortcut-key">?</span><span class="shortcut-desc">Toggle this</span></div>
    <button class="close-btn" onclick="closeShortcuts()">Close</button>
  </div>
</div>

<script>
const slides = [

/* ══════════════════════════════════════════════
   SLIDE 1 — TITLE
══════════════════════════════════════════════ */
`<div class="slide" data-index="0" style="background:radial-gradient(ellipse at 55% 40%, #1a0025 0%, var(--bg) 68%)">
  <svg class="trace" style="right:0;top:0;width:400px;height:400px" viewBox="0 0 400 400" fill="none" aria-hidden="true">
    <path d="M380 0 L380 120 L260 120 L260 200 L360 200 L360 300 L240 300 L240 400" stroke="white" stroke-width="2"/>

  </svg>
  <svg class="trace" style="left:0;bottom:0;width:340px;height:340px" viewBox="0 0 340 340" fill="none" aria-hidden="true">
    <path d="M0 340 L0 220 L120 220 L120 140 L40 140 L40 50 L180 50 L180 0" stroke="white" stroke-width="2"/>
    <circle cx="120" cy="220" r="5" fill="white"/><circle cx="40" cy="140" r="5" fill="white"/><circle cx="180" cy="50" r="5" fill="white"/>

  <div style="text-align:center;max-width:840px">
    <div class="eyebrow">System Integration &amp; Architecture · Module 16</div>

    <div style="display:flex;gap:13px;flex-wrap:wrap;justify-content:center">

/* ══════════════════════════════════════════════
   SLIDE 2 — LESSON PREVIEW
══════════════════════════════════════════════ */
`<div class="slide" data-index="1">
  <div class="eyebrow">Lesson Preview</div>
  <div class="slide-title">Bridging <span>Hardware &amp; Software</span></div>
  <div class="grid-2 w-full" style="max-width:900px;align-items:start">
    <div class="card">

      <p style="color:var(--text-muted)">M13: Microcontroller fundamentals (CPU, Memory, I/O)<br>M14: The Arduino ecosystem &amp; hardware components<br>M15: 2nd Periodical Quiz Review</p>

/* ══════════════════════════════════════════════
   SLIDE 3 — ARDUINO LANGUAGE & SKETCH
══════════════════════════════════════════════ */
`<div class="slide" data-index="2">
  <div class="eyebrow">Core Concept</div>
  <div class="slide-title">The Arduino <span>Language &amp; Sketch</span></div>
  <div class="grid-2 w-full" style="max-width:920px;align-items:start">
    <div class="card">
      <h3>📝 What is a Sketch?</h3>
      <p>A <strong>sketch</strong> is the official name for an Arduino code file. It is written in <strong>C++</strong> with built-in hardware-control methods that make it beginner-friendly.</p>
      <div class="card-inset mt-3">
        <h4>The Compile &amp; Upload Flow</h4>
        <div style="display:flex;flex-direction:column;gap:9px;margin-top:8px">
          <div style="display:flex;align-items:center;gap:10px">
            <span class="badge purple" style="padding:4px 11px;font-size:14px">1</span>
            <span style="font-size:16px">You write human-readable <strong>C++ code</strong></span>
          </div>
          <div style="display:flex;align-items:center;gap:10px">
            <span class="badge blue" style="padding:4px 11px;font-size:14px">2</span>
            <span style="font-size:16px">IDE <strong>compiles</strong> it → machine language (binary)</span>
          </div>
          <div style="display:flex;align-items:center;gap:10px">
            <span class="badge green" style="padding:4px 11px;font-size:14px">3</span>
            <span style="font-size:16px"><strong>Flashed</strong> to MCU's Flash/EEPROM memory</span>
          </div>
          <div style="display:flex;align-items:center;gap:10px">
            <span class="badge orange" style="padding:4px 11px;font-size:14px">4</span>
            <span style="font-size:16px">Board runs the sketch <strong>independently</strong>, forever</span>
          </div>
        </div>
      </div>
    </div>
    <div class="card">
      <h3>🔑 Every Sketch has Two Mandatory Functions</h3>
      <div class="card-inset mt-2" style="font-family:monospace;font-size:15px;line-height:1.8">
        <span style="color:#ff7b72">void</span> <span style="color:#d2a8ff">setup</span>() {<br>
        &nbsp;&nbsp;<span style="color:#8b949e;font-style:italic">// Runs ONCE on power-up</span><br>
        &nbsp;&nbsp;<span style="color:#8b949e;font-style:italic">// Pin modes, serial begin,</span><br>
        &nbsp;&nbsp;<span style="color:#8b949e;font-style:italic">// LCD init, etc.</span><br>
        }<br><br>
        <span style="color:#ff7b72">void</span> <span style="color:#d2a8ff">loop</span>() {<br>
        &nbsp;&nbsp;<span style="color:#8b949e;font-style:italic">// Repeats FOREVER</span><br>
        &nbsp;&nbsp;<span style="color:#8b949e;font-style:italic">// This IS the MCU's</span><br>
        &nbsp;&nbsp;<span style="color:#8b949e;font-style:italic">// endless cycle</span><br>
        }
      </div>
      <div class="card-inset mt-3" style="border-left:3px solid var(--accent4)">
        <p style="font-size:16px">⚠️ <strong style="color:var(--accent4)">Key rule:</strong> Arduino Uno can only run <strong>one sketch at a time</strong> — no OS means no multitasking.</p>
      </div>
    </div>
  </div>
</div>`,

/* ══════════════════════════════════════════════
   SLIDE 4 — WOKWI INTERFACE
══════════════════════════════════════════════ */
`<div class="slide" data-index="3">

          </div>
          <div style="font-family:monospace;font-size:12px;color:#8b949e;line-height:1.7">

/* ══════════════════════════════════════════════
   SLIDE 5 — ADDING COMPONENTS & diagram.json
══════════════════════════════════════════════ */
`<div class="slide" data-index="4">
  <div class="eyebrow">Wokwi Deep-Dive</div>
  <div class="slide-title">Components &amp; <span>diagram.json</span></div>
  <div class="grid-2 w-full" style="max-width:920px;align-items:start">
    <div class="card">
      <h3>➕ Adding Components</h3>
      <p>Two ways to add parts to your circuit:</p>
      <div style="display:flex;flex-direction:column;gap:12px;margin-top:12px">
        <div class="card-inset" style="border-left:3px solid var(--accent)">
          <h4 style="color:var(--accent)">Method 1 — Graphically</h4>

        </div>
        <div class="card-inset" style="border-left:3px solid var(--accent2)">
          <h4 style="color:var(--accent2)">Method 2 — Via Code</h4>
          <p style="font-size:16px">Edit the <code>diagram.json</code> tab directly to define components, positions, and wire connections. More precise.</p>
        </div>
      </div>
    </div>
    <div class="card">
      <h3>📋 diagram.json — The Blueprint</h3>
      <p>The <code>diagram.json</code> file is the <strong>definitive source of truth</strong> for your circuit's physical layout.</p>

`<div class="slide" data-index="10">
  <div class="eyebrow">Lab · Project 1 — Code</div>
  <div class="slide-title">Calculator <span>sketch.ino</span></div>
  <div style="max-width:960px;width:100%;height:min(560px,62vh);display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:stretch">
    <div class="code-wrap" style="height:100%">
      <div class="code-header">
        <span class="code-lang">sketch.ino — Part 1 (setup &amp; declarations)</span>
        <button class="copy-btn" onclick="copyCode(this,'calc-code-a')">Copy</button>
      </div>
      <pre id="calc-code-a"><span class="inc">#include</span> <span class="str">&lt;LiquidCrystal.h&gt;</span>
<span class="inc">#include</span> <span class="str">&lt;Keypad.h&gt;</span>
<span class="inc">#include</span> <span class="str">&lt;Servo.h&gt;</span>

<span class="cm">// LCD: RS, EN, D4, D5, D6, D7</span>
LiquidCrystal <span class="fn">lcd</span>(<span class="num">12</span>, <span class="num">11</span>, <span class="num">10</span>, <span class="num">9</span>, <span class="num">8</span>, <span class="num">7</span>);

<span class="cm">// Keypad layout</span>
<span class="kw">const</span> <span class="tp">byte</span> KEYPAD_ROWS = <span class="num">4</span>;
<span class="kw">const</span> <span class="tp">byte</span> KEYPAD_COLS = <span class="num">4</span>;
<span class="tp">byte</span> rowPins[KEYPAD_ROWS] = {<span class="num">5</span>, <span class="num">4</span>, <span class="num">3</span>, <span class="num">2</span>};
<span class="tp">byte</span> colPins[KEYPAD_COLS] = {A3, A2, A1, A0};

<span class="tp">char</span> keys[KEYPAD_ROWS][KEYPAD_COLS] = {
  {<span class="str">'1'</span>, <span class="str">'2'</span>, <span class="str">'3'</span>, <span class="str">'+'</span>},
  {<span class="str">'4'</span>, <span class="str">'5'</span>, <span class="str">'6'</span>, <span class="str">'-'</span>},
  {<span class="str">'7'</span>, <span class="str">'8'</span>, <span class="str">'9'</span>, <span class="str">'*'</span>},
  {<span class="str">'.'</span>, <span class="str">'0'</span>, <span class="str">'='</span>, <span class="str">'/'</span>}
};

Keypad keypad = <span class="fn">Keypad</span>(
  <span class="fn">makeKeymap</span>(keys),
  rowPins, colPins,
  KEYPAD_ROWS, KEYPAD_COLS
);

<span class="kw">char</span> operation = <span class="num">0</span>;
String memory = <span class="str">""</span>;
String current = <span class="str">""</span>;
<span class="tp">bool</span> decimalPoint = <span class="kw">false</span>;

<span class="kw">void</span> <span class="fn">setup</span>() {
  Serial.<span class="fn">begin</span>(<span class="num">115200</span>);
  lcd.<span class="fn">begin</span>(<span class="num">16</span>, <span class="num">2</span>);
  lcd.<span class="fn">print</span>(<span class="str">"GoodArduinoCode"</span>);
  lcd.<span class="fn">setCursor</span>(<span class="num">3</span>, <span class="num">1</span>);
  String msg = <span class="str">"Calculator"</span>;
  <span class="kw">for</span> (<span class="tp">byte</span> i = <span class="num">0</span>; i &lt; msg.<span class="fn">length</span>(); i++) {
    lcd.<span class="fn">print</span>(msg[i]);
    <span class="fn">delay</span>(<span class="num">50</span>);
  }
  <span class="fn">delay</span>(<span class="num">500</span>);
  lcd.<span class="fn">clear</span>();
  lcd.<span class="fn">cursor</span>();
  lcd.<span class="fn">setCursor</span>(<span class="num">1</span>, <span class="num">0</span>);
}</pre>
    </div>
    <div class="code-wrap" style="height:100%">
      <div class="code-header">
        <span class="code-lang">sketch.ino — Part 2 (logic &amp; loop)</span>
        <button class="copy-btn" onclick="copyCode(this,'calc-code-b')">Copy</button>
      </div>
      <pre id="calc-code-b"><span class="kw">double</span> <span class="fn">calculate</span>(<span class="tp">char</span> op, <span class="kw">double</span> l, <span class="kw">double</span> r) {
  <span class="kw">switch</span> (op) {
    <span class="kw">case</span> <span class="str">'+'</span>: <span class="kw">return</span> l + r;
    <span class="kw">case</span> <span class="str">'-'</span>: <span class="kw">return</span> l - r;
    <span class="kw">case</span> <span class="str">'*'</span>: <span class="kw">return</span> l * r;
    <span class="kw">case</span> <span class="str">'/'</span>: <span class="kw">return</span> l / r;
  }
}

<span class="kw">void</span> <span class="fn">processInput</span>(<span class="tp">char</span> key) {
  <span class="kw">if</span> (<span class="str">'-'</span> == key && current == <span class="str">""</span>) {
    current = <span class="str">"-"</span>;
    lcd.<span class="fn">print</span>(<span class="str">"-"</span>);
    <span class="kw">return</span>;
  }
  <span class="kw">switch</span> (key) {
    <span class="kw">case</span> <span class="str">'+'</span>: <span class="kw">case</span> <span class="str">'-'</span>:
    <span class="kw">case</span> <span class="str">'*'</span>: <span class="kw">case</span> <span class="str">'/'</span>:
      <span class="kw">if</span> (!operation) {
        memory = current;
        current = <span class="str">""</span>;
      }
      operation = key;
      lcd.<span class="fn">setCursor</span>(<span class="num">0</span>, <span class="num">1</span>);
      lcd.<span class="fn">print</span>(key);
      <span class="kw">return</span>;
    <span class="kw">case</span> <span class="str">'='</span>:
      <span class="kw">float</span> L = memory.<span class="fn">toDouble</span>();
      <span class="kw">float</span> R = current.<span class="fn">toDouble</span>();
      memory = String(<span class="fn">calculate</span>(operation,L,R));
      lcd.<span class="fn">clear</span>();
      lcd.<span class="fn">setCursor</span>(<span class="num">0</span>, <span class="num">0</span>);
      lcd.<span class="fn">print</span>(memory);
      lcd.<span class="fn">setCursor</span>(<span class="num">0</span>, <span class="num">1</span>);
      lcd.<span class="fn">print</span>(operation);
      operation = <span class="num">0</span>;
      current = <span class="str">""</span>;
      <span class="kw">return</span>;
    <span class="kw">case</span> <span class="str">'.'</span>:
      <span class="kw">if</span> (current.<span class="fn">indexOf</span>(<span class="str">'.'</span>) == -<span class="num">1</span>) {
        current += key; lcd.<span class="fn">print</span>(key);
      }
      <span class="kw">return</span>;
    <span class="kw">default</span>:
      <span class="kw">if</span> (!operation) memory = <span class="str">""</span>;
      <span class="kw">if</span> (current == <span class="str">"0"</span>) current = key;

/* ══════════════════════════════════════════════ ENGINE */
const deck = document.getElementById('deck');
const total = slides.length;
let current = 0;

slides.forEach(html => {
  const w = document.createElement('div');
  w.innerHTML = html;
  deck.appendChild(w.firstElementChild);
});

const allSlides = document.querySelectorAll('.slide');
const bar = document.getElementById('progress-bar');
const ctr = document.getElementById('counter');

function goTo(idx, dir = 1) {
  if (idx < 0 || idx >= total) return;
  const prev = allSlides[current];
  prev.classList.remove('active');
  prev.classList.add(dir > 0 ? 'exit-left' : 'exit-right');
  setTimeout(() => prev.classList.remove('exit-left','exit-right'), 400);
  current = idx;
  const next = allSlides[current];
  next.style.transform = dir > 0 ? 'translateX(60px)' : 'translateX(-60px)';
  next.classList.add('active');
  setTimeout(() => { next.style.transform = ''; }, 10);
  bar.style.width = ((current + 1) / total * 100) + '%';
  ctr.textContent = (current + 1) + ' / ' + total;
}

allSlides[0].classList.add('active');
bar.style.width = (1 / total * 100) + '%';

document.addEventListener('keydown', e => {
  if (e.key==='ArrowRight'||e.key==='ArrowDown') goTo(current+1, 1);
  else if (e.key==='ArrowLeft'||e.key==='ArrowUp') goTo(current-1,-1);
  else if (e.key==='Home') goTo(0,-1);
  else if (e.key==='End')  goTo(total-1,1);
  else if (e.key==='?') toggleShortcuts();
});
document.addEventListener('contextmenu', e => { e.preventDefault(); goTo(current+1,1); });
document.addEventListener('mousedown', e => {
  if (e.button===3){e.preventDefault();e.stopImmediatePropagation();goTo(current+1, 1);}
  if (e.button===4){e.preventDefault();e.stopImmediatePropagation();goTo(current-1,-1);}
}, true);
let touchX=0;
document.addEventListener('touchstart',e=>{touchX=e.touches[0].clientX;},{passive:true});
document.addEventListener('touchend',e=>{
  const dx=touchX-e.changedTouches[0].clientX;
  if(Math.abs(dx)>40) dx>0?goTo(current+1,1):goTo(current-1,-1);
});

function copyCode(btn,id){
  const pre=document.getElementById(id);
  navigator.clipboard.writeText(pre?pre.innerText:'').then(()=>{
    btn.textContent='Copied!';btn.classList.add('copied');
    setTimeout(()=>{btn.textContent='Copy';btn.classList.remove('copied');},1800);
  });
}
function toggleShortcuts(){document.getElementById('shortcuts-overlay').classList.toggle('show');}
function closeShortcuts() {document.getElementById('shortcuts-overlay').classList.remove('show');}
document.getElementById('shortcuts-overlay').addEventListener('click',e=>{
  if(e.target===document.getElementById('shortcuts-overlay'))closeShortcuts();
});
</script>
