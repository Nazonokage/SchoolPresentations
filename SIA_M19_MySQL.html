<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SIA M19 – Database Integration 1: MySQL</title>
<style>
  :root {
    --bg: #181c1f;
    --bg2: #1d2226;
    --card: #222a2e;
    --shadow-dark: #0f1315;
    --shadow-light: #2d3a40;
    --accent:  #4ade80;   /* MySQL green */
    --accent2: #38bdf8;   /* SQL blue */
    --accent3: #fb923c;   /* amber / data */
    --accent4: #a78bfa;   /* purple */
    --accent5: #f472b6;   /* pink */
    --text: #e2e8f0;
    --text-muted: #94a3b8;
    --danger: #f87171;
    --warning: #fbbf24;
    --radius: 20px;
    --radius-sm: 12px;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); }

  #progress-bar { position: fixed; top: 0; left: 0; height: 3px; background: linear-gradient(90deg, var(--accent), var(--accent2), var(--accent3)); transition: width .35s ease; z-index: 999; }
  #counter { position: fixed; bottom: 14px; right: 20px; font-size: 16px; color: var(--text-muted); z-index: 999; }

  #deck { width: 100%; height: 100%; position: relative; }
  .slide {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; justify-content: center; align-items: center;
    padding: 36px 52px;
    opacity: 0; pointer-events: none;
    transition: opacity .35s ease, transform .35s ease;
    transform: translateX(60px);
  }
  .slide.active  { opacity: 1; pointer-events: auto; transform: translateX(0); }
  .slide.exit-left  { opacity: 0; transform: translateX(-60px); }
  .slide.exit-right { opacity: 0; transform: translateX(60px); }
  @media (prefers-reduced-motion: reduce) {
    .slide { transition: opacity .15s ease; transform: none !important; }
  }

  .eyebrow    { font-size: 12px; text-transform: uppercase; letter-spacing: 2.8px; color: var(--accent); margin-bottom: 8px; font-weight: 700; }
  .slide-title { font-size: clamp(24px, 3.2vw, 40px); font-weight: 800; color: var(--text); text-align: center; line-height: 1.2; margin-bottom: 24px; }
  .slide-title span { color: var(--accent); }

  .card { background: var(--card); border-radius: var(--radius); box-shadow: 6px 6px 16px var(--shadow-dark), -4px -4px 12px var(--shadow-light); padding: 22px 26px; }
  .card-inset { background: var(--bg2); border-radius: var(--radius-sm); box-shadow: inset 3px 3px 8px var(--shadow-dark), inset -2px -2px 6px var(--shadow-light); padding: 14px 18px; }

  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; width: 100%; }
  .grid-3 { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 16px; width: 100%; }
  .grid-2-wide { display: grid; grid-template-columns: 1.15fr 0.85fr; gap: 20px; width: 100%; }

  p, li, td, th { font-size: 17px; line-height: 1.65; color: var(--text); }
  h3 { font-size: 19px; font-weight: 700; color: var(--accent); margin-bottom: 9px; }
  h4 { font-size: 17px; font-weight: 600; color: var(--accent2); margin-bottom: 7px; }
  ul { padding-left: 20px; }
  li { margin-bottom: 6px; }
  strong { color: var(--accent2); }

  .badge {
    display: inline-flex; align-items: center; gap: 7px;
    background: var(--card); box-shadow: 3px 3px 8px var(--shadow-dark), -2px -2px 6px var(--shadow-light);
    border-radius: 50px; padding: 7px 15px; font-size: 16px; font-weight: 600; color: var(--text);
  }
  .badge.green  { color: var(--accent);  }
  .badge.blue   { color: var(--accent2); }
  .badge.orange { color: var(--accent3); }
  .badge.purple { color: var(--accent4); }
  .badge.pink   { color: var(--accent5); }
  .badge.yellow { color: var(--warning); }
  .badge.red    { color: var(--danger);  }

  /* SQL code blocks */
  .code-wrap { position: relative; border-radius: var(--radius-sm); overflow: hidden; background: #0d1117; display: flex; flex-direction: column; min-height: 0; }
  .code-header { display: flex; align-items: center; justify-content: space-between; padding: 9px 16px; background: #161b22; flex-shrink: 0; }
  .code-lang { font-size: 16px; color: #8b949e; font-family: monospace; }
  .copy-btn {
    font-size: 15px; padding: 5px 13px; border-radius: 8px; border: none; cursor: pointer; font-weight: 600;
    background: var(--card); color: var(--text); box-shadow: 3px 3px 7px var(--shadow-dark), -2px -2px 5px var(--shadow-light); transition: all .15s;
  }
  .copy-btn.copied { box-shadow: inset 2px 2px 5px var(--shadow-dark), inset -1px -1px 4px var(--shadow-light); color: var(--accent); }
  pre { flex: 1; overflow: auto; padding: 16px; margin: 0; font-size: 15px; line-height: 1.75; font-family: 'Cascadia Code','Fira Code',Consolas,monospace; min-height: 0; }
  .kw  { color: #ff7b72; font-weight: 700; }  /* SQL keywords */
  .fn  { color: #d2a8ff; }
  .str { color: #a5d6ff; }
  .cm  { color: #8b949e; font-style: italic; }
  .num { color: #f0db4f; }
  .tbl { color: #7ee787; }  /* table/column names */
  .op  { color: #ffa657; }  /* operators */

  /* SQL drill card */
  .drill-card { background: var(--card); border-radius: var(--radius); box-shadow: 6px 6px 16px var(--shadow-dark), -4px -4px 12px var(--shadow-light); padding: 18px 22px; }
  .drill-q { font-size: 16px; color: var(--text-muted); margin-bottom: 8px; }
  .drill-blank { font-family: monospace; font-size: 15px; background: var(--bg2); border-radius: 8px; padding: 10px 14px; color: var(--text); border: 1px solid rgba(74,222,128,.2); line-height: 1.8; }
  .drill-ans { font-family: monospace; font-size: 15px; color: var(--accent); font-weight: 700; margin-top: 8px; cursor: pointer; }
  .drill-reveal { display: none; background: rgba(74,222,128,.08); border-radius: 8px; padding: 10px 14px; margin-top: 6px; font-family: monospace; font-size: 15px; color: var(--accent); border: 1px solid rgba(74,222,128,.25); }
  .drill-card.shown .drill-reveal { display: block; }
  .drill-hint { font-size: 13px; color: var(--text-muted); margin-top: 6px; text-align: right; }
  .drill-card.shown .drill-hint { display: none; }

  /* table styling */
  .tbl-wrap { width: 100%; overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 16px; }
  th { background: var(--bg); color: var(--accent); padding: 11px 14px; text-align: left; font-size: 15px; text-transform: uppercase; letter-spacing: .8px; }
  td { padding: 10px 14px; border-bottom: 1px solid rgba(255,255,255,.07); vertical-align: top; }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: rgba(74,222,128,.04); }

  /* MCQ */
  .mcq-card { background: var(--card); border-radius: var(--radius); box-shadow: 6px 6px 16px var(--shadow-dark), -4px -4px 12px var(--shadow-light); padding: 20px 24px; display: flex; flex-direction: column; gap: 11px; }
  .mcq-q { font-size: 17px; font-weight: 600; color: var(--text); line-height: 1.5; }
  .mcq-opts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .mcq-opt { background: var(--bg2); border-radius: 10px; padding: 9px 13px; font-size: 16px; box-shadow: inset 2px 2px 5px var(--shadow-dark), inset -1px -1px 4px var(--shadow-light); }

  /* answer key */
  .ans-row { display: flex; align-items: flex-start; gap: 13px; padding: 11px 0; border-bottom: 1px solid rgba(255,255,255,.06); }
  .ans-num { background: var(--accent); color: #051a0a; border-radius: 50%; width: 28px; height: 28px; min-width: 28px; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 800; }
  .ans-text { font-size: 17px; line-height: 1.55; }
  .ans-correct { color: var(--accent); font-weight: 700; }

  /* shortcuts */
  #shortcuts-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.72); z-index: 9999; align-items: center; justify-content: center; }
  #shortcuts-overlay.show { display: flex; }
  .shortcuts-box { background: var(--card); border-radius: var(--radius); padding: 34px 42px; box-shadow: 10px 10px 30px var(--shadow-dark); max-width: 400px; width: 90%; }
  .shortcuts-box h2 { font-size: 21px; color: var(--accent); margin-bottom: 16px; text-align: center; }
  .shortcut-row { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,.07); }
  .shortcut-row:last-child { border-bottom: none; }
  .shortcut-key  { background: var(--bg2); border-radius: 7px; padding: 4px 10px; font-size: 15px; font-family: monospace; color: var(--accent); }
  .shortcut-desc { font-size: 16px; color: var(--text-muted); }
  .close-btn { display: block; margin: 18px auto 0; background: var(--card); box-shadow: 4px 4px 10px var(--shadow-dark), -2px -2px 7px var(--shadow-light); border: none; border-radius: 12px; padding: 9px 26px; font-size: 17px; color: var(--text); cursor: pointer; }

  .w-full { width: 100%; }
  .mt-2 { margin-top: 10px; }
  .mt-3 { margin-top: 14px; }
  .mt-4 { margin-top: 20px; }
  .flex-col { display: flex; flex-direction: column; }
  .inner-scroll { overflow-y: auto; max-height: 58vh; padding-right: 4px; }
  .inner-scroll::-webkit-scrollbar { width: 5px; }
  .inner-scroll::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 10px; }
  .trace { position: absolute; opacity: .05; pointer-events: none; }
</style>
</head>
<body>

<div id="progress-bar"></div>
<div id="counter">1 / 20</div>
<div id="deck"></div>

<div id="shortcuts-overlay">
  <div class="shortcuts-box">
    <h2>⌨️ Shortcuts</h2>
    <div class="shortcut-row"><span class="shortcut-key">→ / Right-click</span><span class="shortcut-desc">Next slide</span></div>
    <div class="shortcut-row"><span class="shortcut-key">←</span><span class="shortcut-desc">Prev slide</span></div>
    <div class="shortcut-row"><span class="shortcut-key">Home / End</span><span class="shortcut-desc">First / Last</span></div>
    <div class="shortcut-row"><span class="shortcut-key">?</span><span class="shortcut-desc">Toggle this</span></div>
    <div class="shortcut-row"><span class="shortcut-key">Tap drill card</span><span class="shortcut-desc">Reveal SQL answer</span></div>
    <button class="close-btn" onclick="closeShortcuts()">Close</button>
  </div>
</div>

`<div class="slide" data-index="0" style="background:radial-gradient(ellipse at 50% 40%, #051a0a 0%, var(--bg) 68%)">

/* ══════════════════════════════════════════════
   SLIDE 2 — LESSON PREVIEW

`<div class="slide" data-index="1">

/* ══════════════════════════════════════════════
   SLIDE 3 — WHAT IS DATABASE INTEGRATION
══════════════════════════════════════════════ */
`<div class="slide" data-index="2">
  <div class="eyebrow">Core Concept</div>
  <div class="slide-title">What is <span>Database Integration</span>?</div>
  <div class="grid-2-wide w-full" style="max-width:940px;align-items:start">

`<div class="slide" data-index="8">
  <div class="eyebrow">SQL in Action</div>
  <div class="slide-title">The <span>SELECT</span> Statement</div>
  <div style="max-width:960px;width:100%;height:min(520px,58vh);display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:stretch">
    <div class="code-wrap" style="height:100%">
      <div class="code-header">
        <span class="code-lang">SELECT — Basic Queries</span>
        <button class="copy-btn" onclick="copyCode(this,'sql-select')">Copy</button>
      </div>
      <pre id="sql-select"><span class="cm">-- Get ALL columns from Customers</span>
<span class="kw">SELECT</span> * <span class="kw">FROM</span> <span class="tbl">Customers</span>;

<span class="cm">-- Get only the City column</span>
<span class="kw">SELECT</span> <span class="tbl">City</span> <span class="kw">FROM</span> <span class="tbl">Customers</span>;

<span class="cm">-- Get unique/distinct countries only</span>
<span class="kw">SELECT DISTINCT</span> <span class="tbl">Country</span>
<span class="kw">FROM</span> <span class="tbl">Customers</span>;

<span class="cm">-- Filter rows: only customers in Berlin</span>
<span class="kw">SELECT</span> * <span class="kw">FROM</span> <span class="tbl">Customers</span>
<span class="kw">WHERE</span> <span class="tbl">City</span> <span class="op">=</span> <span class="str">'Berlin'</span>;

<span class="cm">-- Exclude Berlin (NOT keyword)</span>
<span class="kw">SELECT</span> * <span class="kw">FROM</span> <span class="tbl">Customers</span>
<span class="kw">WHERE NOT</span> <span class="tbl">City</span> <span class="op">=</span> <span class="str">'Berlin'</span>;

<span class="cm">-- Multiple conditions with AND</span>
<span class="kw">SELECT</span> * <span class="kw">FROM</span> <span class="tbl">Customers</span>
<span class="kw">WHERE</span> <span class="tbl">Country</span> <span class="op">=</span> <span class="str">'Germany'</span>
  <span class="kw">AND</span> <span class="tbl">City</span> <span class="op">=</span> <span class="str">'Berlin'</span>;

<span class="cm">-- Sort results A→Z by country</span>
<span class="kw">SELECT</span> * <span class="kw">FROM</span> <span class="tbl">Customers</span>
<span class="kw">ORDER BY</span> <span class="tbl">Country</span> <span class="kw">ASC</span>;</pre>
    </div>
    <div class="flex-col" style="gap:14px;height:100%">
      <div class="card">
        <h3>🔍 Key Clauses</h3>
        <div style="display:flex;flex-direction:column;gap:9px;margin-top:4px">
          <div class="card-inset"><p style="font-size:15px"><code style="color:var(--accent)">SELECT *</code> — the <code>*</code> means "all columns"</p></div>
          <div class="card-inset"><p style="font-size:15px"><code style="color:var(--accent)">DISTINCT</code> — removes duplicate values from results</p></div>
          <div class="card-inset"><p style="font-size:15px"><code style="color:var(--accent)">WHERE</code> — filters rows based on a condition</p></div>
          <div class="card-inset"><p style="font-size:15px"><code style="color:var(--accent)">NOT</code> — inverts a condition (exclude matches)</p></div>
          <div class="card-inset"><p style="font-size:15px"><code style="color:var(--accent)">ORDER BY</code> — sorts results (ASC = A→Z, DESC = Z→A)</p></div>
        </div>
      </div>
      <div class="card-inset" style="flex:1;border-left:3px solid var(--accent3)">
        <h4 style="color:var(--accent3)">💡 Practice Tip</h4>
        <p style="font-size:15px;color:var(--text-muted)">Open <strong>phpMyAdmin</strong> (via WampServer at <code>localhost/phpmyadmin</code>), create a test database, and paste these queries into the SQL tab to see them execute in real-time.</p>
      </div>
    </div>
  </div>
</div>`,

`<div class="slide" data-index="9">
  <div class="eyebrow">SQL in Action</div>
  <div class="slide-title">INSERT · UPDATE · <span>DELETE</span></div>
  <div style="max-width:960px;width:100%;height:min(520px,58vh);display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:stretch">
    <div class="code-wrap" style="height:100%">
      <div class="code-header">
        <span class="code-lang">Data Manipulation (DML)</span>
        <button class="copy-btn" onclick="copyCode(this,'sql-dml')">Copy</button>
      </div>
      <pre id="sql-dml"><span class="cm">-- CREATE a Customers table</span>
<span class="kw">CREATE TABLE</span> <span class="tbl">Customers</span> (
  <span class="tbl">CustomerID</span>  INT <span class="kw">PRIMARY KEY</span>,
  <span class="tbl">Name</span>        VARCHAR(<span class="num">100</span>),
  <span class="tbl">City</span>        VARCHAR(<span class="num">100</span>),
  <span class="tbl">Country</span>     VARCHAR(<span class="num">100</span>)
);

<span class="cm">-- INSERT a new customer record</span>
<span class="kw">INSERT INTO</span> <span class="tbl">Customers</span>
  (<span class="tbl">CustomerID</span>, <span class="tbl">Name</span>, <span class="tbl">City</span>, <span class="tbl">Country</span>)
<span class="kw">VALUES</span>
  (<span class="num">5</span>, <span class="str">'Zara Hoffmann'</span>, <span class="str">'Munich'</span>, <span class="str">'Germany'</span>);

<span class="cm">-- UPDATE an existing record</span>
<span class="kw">UPDATE</span> <span class="tbl">Customers</span>
<span class="kw">SET</span> <span class="tbl">City</span> <span class="op">=</span> <span class="str">'Hamburg'</span>
<span class="kw">WHERE</span> <span class="tbl">CustomerID</span> <span class="op">=</span> <span class="num">5</span>;

<span class="cm">-- DELETE a specific record</span>
<span class="kw">DELETE FROM</span> <span class="tbl">Customers</span>
<span class="kw">WHERE</span> <span class="tbl">CustomerID</span> <span class="op">=</span> <span class="num">5</span>;

<span class="cm">-- DROP the entire table</span>
<span class="kw">DROP TABLE</span> <span class="tbl">Customers</span>;</pre>
    </div>
    <div class="flex-col" style="gap:14px;height:100%">
      <div class="card">
        <h3>⚡ CRUD in SQL</h3>
        <div style="display:flex;flex-direction:column;gap:10px;margin-top:4px">
          <div class="card-inset" style="border-left:3px solid var(--accent)">
            <p style="font-size:15px"><strong style="color:var(--accent)">C</strong>reate → <code>INSERT INTO</code> + <code>CREATE TABLE</code></p>
          </div>
          <div class="card-inset" style="border-left:3px solid var(--accent2)">
            <p style="font-size:15px"><strong style="color:var(--accent2)">R</strong>ead → <code>SELECT</code></p>
          </div>
          <div class="card-inset" style="border-left:3px solid var(--accent3)">
            <p style="font-size:15px"><strong style="color:var(--accent3)">U</strong>pdate → <code>UPDATE ... SET</code></p>
          </div>
          <div class="card-inset" style="border-left:3px solid var(--danger)">
            <p style="font-size:15px"><strong style="color:var(--danger)">D</strong>elete → <code>DELETE FROM</code> / <code>DROP TABLE</code></p>
          </div>
        </div>
      </div>
      <div class="card-inset" style="flex:1;border-left:3px solid var(--warning)">
        <h4 style="color:var(--warning)">⚠️ Always use WHERE with UPDATE/DELETE!</h4>
        <p style="font-size:15px;color:var(--text-muted)"><code>DELETE FROM Customers;</code> without a WHERE clause <strong>deletes every single row</strong> in the table. Always specify which record you want to change!</p>
      </div>
    </div>
  </div>
</div>`,

/* ENGINE */
const deck = document.getElementById('deck');
const total = slides.length;
let current = 0;

slides.forEach(html => {
  const w = document.createElement('div');
  w.innerHTML = html;
  deck.appendChild(w.firstElementChild);
});

const allSlides = document.querySelectorAll('.slide');
const bar = document.getElementById('progress-bar');
const ctr = document.getElementById('counter');

function goTo(idx, dir = 1) {
  if (idx < 0 || idx >= total) return;
  const prev = allSlides[current];
  prev.classList.remove('active');
  prev.classList.add(dir > 0 ? 'exit-left' : 'exit-right');
  setTimeout(() => prev.classList.remove('exit-left','exit-right'), 400);
  current = idx;
  const next = allSlides[current];
  next.style.transform = dir > 0 ? 'translateX(60px)' : 'translateX(-60px)';
  next.classList.add('active');
  setTimeout(() => { next.style.transform = ''; }, 10);
  bar.style.width = ((current + 1) / total * 100) + '%';
  ctr.textContent = (current + 1) + ' / ' + total;
}

allSlides[0].classList.add('active');
bar.style.width = (1 / total * 100) + '%';

document.addEventListener('keydown', e => {
  if (e.key==='ArrowRight'||e.key==='ArrowDown') goTo(current+1, 1);
  else if (e.key==='ArrowLeft'||e.key==='ArrowUp') goTo(current-1,-1);
  else if (e.key==='Home') goTo(0,-1);
  else if (e.key==='End')  goTo(total-1,1);
  else if (e.key==='?') toggleShortcuts();
});
document.addEventListener('contextmenu', e => { e.preventDefault(); goTo(current+1,1); });
document.addEventListener('mousedown', e => {
  if (e.button===3){e.preventDefault();e.stopImmediatePropagation();goTo(current+1, 1);}
  if (e.button===4){e.preventDefault();e.stopImmediatePropagation();goTo(current-1,-1);}
}, true);
let touchX=0;
document.addEventListener('touchstart',e=>{touchX=e.touches[0].clientX;},{passive:true});
document.addEventListener('touchend',e=>{
  const dx=touchX-e.changedTouches[0].clientX;
  if(Math.abs(dx)>40) dx>0?goTo(current+1,1):goTo(current-1,-1);
});

function copyCode(btn,id){
  const pre=document.getElementById(id);
  navigator.clipboard.writeText(pre?pre.innerText:'').then(()=>{
    btn.textContent='Copied!';btn.classList.add('copied');
    setTimeout(()=>{btn.textContent='Copy';btn.classList.remove('copied');},1800);
  });
}
function toggleShortcuts(){document.getElementById('shortcuts-overlay').classList.toggle('show');}
function closeShortcuts() {document.getElementById('shortcuts-overlay').classList.remove('show');}
document.getElementById('shortcuts-overlay').addEventListener('click',e=>{
  if(e.target===document.getElementById('shortcuts-overlay'))closeShortcuts();
});
</script>
