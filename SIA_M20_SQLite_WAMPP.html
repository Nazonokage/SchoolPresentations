<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SIA M20 – Database Integration 2: SQLite, MySQL & WAMPP</title>
<style>
  :root {
    --bg: #181c1f;
    --bg2: #1d2226;
    --card: #222a2e;
    --shadow-dark: #0f1315;
    --shadow-light: #2d3a40;
    --accent:  #60a5fa;   /* SQLite blue */
    --accent2: #4ade80;   /* MySQL green */
    --accent3: #fb923c;   /* WAMPP amber */
    --accent4: #a78bfa;   /* phpMyAdmin purple */
    --accent5: #f472b6;   /* pink highlight */
    --text: #e2e8f0;
    --text-muted: #94a3b8;
    --danger: #f87171;
    --warning: #fbbf24;
    --radius: 20px;
    --radius-sm: 12px;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); }

  #progress-bar { position: fixed; top: 0; left: 0; height: 3px; background: linear-gradient(90deg, var(--accent), var(--accent2), var(--accent3)); transition: width .35s ease; z-index: 999; }
  #counter { position: fixed; bottom: 14px; right: 20px; font-size: 16px; color: var(--text-muted); z-index: 999; }

  #deck { width: 100%; height: 100%; position: relative; }
  .slide {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; justify-content: center; align-items: center;
    padding: 36px 52px;
    opacity: 0; pointer-events: none;
    transition: opacity .35s ease, transform .35s ease;
    transform: translateX(60px);
  }
  .slide.active  { opacity: 1; pointer-events: auto; transform: translateX(0); }
  .slide.exit-left  { opacity: 0; transform: translateX(-60px); }
  .slide.exit-right { opacity: 0; transform: translateX(60px); }
  @media (prefers-reduced-motion: reduce) {
    .slide { transition: opacity .15s ease; transform: none !important; }
  }

  .eyebrow    { font-size: 12px; text-transform: uppercase; letter-spacing: 2.8px; color: var(--accent); margin-bottom: 8px; font-weight: 700; }
  .slide-title { font-size: clamp(24px, 3.2vw, 40px); font-weight: 800; color: var(--text); text-align: center; line-height: 1.2; margin-bottom: 24px; }
  .slide-title span { color: var(--accent); }

  .card { background: var(--card); border-radius: var(--radius); box-shadow: 6px 6px 16px var(--shadow-dark), -4px -4px 12px var(--shadow-light); padding: 22px 26px; }
  .card-inset { background: var(--bg2); border-radius: var(--radius-sm); box-shadow: inset 3px 3px 8px var(--shadow-dark), inset -2px -2px 6px var(--shadow-light); padding: 14px 18px; }

  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; width: 100%; }
  .grid-3 { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 16px; width: 100%; }
  .grid-2-wide { display: grid; grid-template-columns: 1.1fr 0.9fr; gap: 20px; width: 100%; }

  p, li, td, th { font-size: 17px; line-height: 1.65; color: var(--text); }
  h3 { font-size: 19px; font-weight: 700; color: var(--accent); margin-bottom: 9px; }
  h4 { font-size: 17px; font-weight: 600; color: var(--accent3); margin-bottom: 7px; }
  ul { padding-left: 20px; }
  li { margin-bottom: 6px; }
  strong { color: var(--accent2); }

  .badge {
    display: inline-flex; align-items: center; gap: 7px;
    background: var(--card); box-shadow: 3px 3px 8px var(--shadow-dark), -2px -2px 6px var(--shadow-light);
    border-radius: 50px; padding: 7px 15px; font-size: 16px; font-weight: 600; color: var(--text);
  }
  .badge.blue   { color: var(--accent);  }
  .badge.green  { color: var(--accent2); }
  .badge.orange { color: var(--accent3); }
  .badge.purple { color: var(--accent4); }
  .badge.pink   { color: var(--accent5); }
  .badge.yellow { color: var(--warning); }
  .badge.red    { color: var(--danger);  }

  /* code */
  .code-wrap { position: relative; border-radius: var(--radius-sm); overflow: hidden; background: #0d1117; display: flex; flex-direction: column; min-height: 0; }
  .code-header { display: flex; align-items: center; justify-content: space-between; padding: 9px 16px; background: #161b22; flex-shrink: 0; }
  .code-lang { font-size: 16px; color: #8b949e; font-family: monospace; }
  .copy-btn { font-size: 15px; padding: 5px 13px; border-radius: 8px; border: none; cursor: pointer; font-weight: 600; background: var(--card); color: var(--text); box-shadow: 3px 3px 7px var(--shadow-dark), -2px -2px 5px var(--shadow-light); transition: all .15s; }
  .copy-btn.copied { box-shadow: inset 2px 2px 5px var(--shadow-dark), inset -1px -1px 4px var(--shadow-light); color: var(--accent2); }
  pre { flex: 1; overflow: auto; padding: 16px; margin: 0; font-size: 14.5px; line-height: 1.75; font-family: 'Cascadia Code','Fira Code',Consolas,monospace; min-height: 0; }
  .kw  { color: #ff7b72; font-weight: 700; }
  .str { color: #a5d6ff; }
  .cm  { color: #8b949e; font-style: italic; }
  .num { color: #f0db4f; }
  .tbl { color: #7ee787; }
  .op  { color: #ffa657; }
  .tp  { color: #d2a8ff; }

  /* drill cards */
  .drill-card { background: var(--card); border-radius: var(--radius); box-shadow: 6px 6px 16px var(--shadow-dark), -4px -4px 12px var(--shadow-light); padding: 18px 22px; cursor: pointer; transition: transform .15s; user-select: none; }
  .drill-card:hover { transform: translateY(-2px); }
  .drill-q { font-size: 16px; color: var(--text-muted); margin-bottom: 8px; line-height: 1.5; }
  .drill-blank { font-family: monospace; font-size: 14px; background: var(--bg2); border-radius: 8px; padding: 10px 14px; color: var(--text); border: 1px solid rgba(96,165,250,.2); line-height: 1.8; }
  .drill-reveal { display: none; background: rgba(74,222,128,.07); border-radius: 8px; padding: 10px 14px; margin-top: 8px; font-family: monospace; font-size: 15px; color: var(--accent2); border: 1px solid rgba(74,222,128,.2); line-height: 1.8; }
  .drill-card.shown .drill-reveal { display: block; }
  .drill-hint { font-size: 13px; color: var(--text-muted); margin-top: 6px; text-align: right; }
  .drill-card.shown .drill-hint { display: none; }

  /* table */
  .tbl-wrap { width: 100%; overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 16px; }
  th { background: var(--bg); color: var(--accent); padding: 11px 14px; text-align: left; font-size: 15px; text-transform: uppercase; letter-spacing: .8px; }
  td { padding: 10px 14px; border-bottom: 1px solid rgba(255,255,255,.07); vertical-align: top; }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: rgba(96,165,250,.04); }

  /* MCQ */
  .mcq-card { background: var(--card); border-radius: var(--radius); box-shadow: 6px 6px 16px var(--shadow-dark), -4px -4px 12px var(--shadow-light); padding: 20px 24px; display: flex; flex-direction: column; gap: 11px; }
  .mcq-q { font-size: 17px; font-weight: 600; color: var(--text); line-height: 1.5; }
  .mcq-opts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .mcq-opt { background: var(--bg2); border-radius: 10px; padding: 9px 13px; font-size: 16px; box-shadow: inset 2px 2px 5px var(--shadow-dark), inset -1px -1px 4px var(--shadow-light); }

  /* answer key */
  .ans-row { display: flex; align-items: flex-start; gap: 13px; padding: 11px 0; border-bottom: 1px solid rgba(255,255,255,.06); }
  .ans-num { background: var(--accent); color: #001020; border-radius: 50%; width: 28px; height: 28px; min-width: 28px; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 800; }
  .ans-text { font-size: 17px; line-height: 1.55; }
  .ans-correct { color: var(--accent2); font-weight: 700; }

  /* shortcuts */
  #shortcuts-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.72); z-index: 9999; align-items: center; justify-content: center; }
  #shortcuts-overlay.show { display: flex; }
  .shortcuts-box { background: var(--card); border-radius: var(--radius); padding: 34px 42px; box-shadow: 10px 10px 30px var(--shadow-dark); max-width: 400px; width: 90%; }
  .shortcuts-box h2 { font-size: 21px; color: var(--accent); margin-bottom: 16px; text-align: center; }
  .shortcut-row { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,.07); }
  .shortcut-row:last-child { border-bottom: none; }
  .shortcut-key  { background: var(--bg2); border-radius: 7px; padding: 4px 10px; font-size: 15px; font-family: monospace; color: var(--accent); }
  .shortcut-desc { font-size: 16px; color: var(--text-muted); }
  .close-btn { display: block; margin: 18px auto 0; background: var(--card); box-shadow: 4px 4px 10px var(--shadow-dark), -2px -2px 7px var(--shadow-light); border: none; border-radius: 12px; padding: 9px 26px; font-size: 17px; color: var(--text); cursor: pointer; }

  .w-full { width: 100%; }
  .mt-2 { margin-top: 10px; }
  .mt-3 { margin-top: 14px; }
  .mt-4 { margin-top: 20px; }
  .flex-col { display: flex; flex-direction: column; }
  .inner-scroll { overflow-y: auto; max-height: 58vh; padding-right: 4px; }
  .inner-scroll::-webkit-scrollbar { width: 5px; }
  .inner-scroll::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 10px; }
  .trace { position: absolute; opacity: .05; pointer-events: none; }

  /* vs divider */
  .vs-pill { background: var(--card); box-shadow: 4px 4px 10px var(--shadow-dark), -3px -3px 8px var(--shadow-light); border-radius: 50px; padding: 8px 18px; font-size: 18px; font-weight: 800; color: var(--text-muted); }
</style>
</head>
<body>

<div id="progress-bar"></div>
<div id="counter">1 / 20</div>
<div id="deck"></div>

<div id="shortcuts-overlay">
  <div class="shortcuts-box">
    <h2>⌨️ Shortcuts</h2>
    <div class="shortcut-row"><span class="shortcut-key">→ / Right-click</span><span class="shortcut-desc">Next slide</span></div>
    <div class="shortcut-row"><span class="shortcut-key">←</span><span class="shortcut-desc">Prev slide</span></div>
    <div class="shortcut-row"><span class="shortcut-key">Home / End</span><span class="shortcut-desc">First / Last</span></div>
    <div class="shortcut-row"><span class="shortcut-key">?</span><span class="shortcut-desc">Toggle this</span></div>
    <div class="shortcut-row"><span class="shortcut-key">Tap drill</span><span class="shortcut-desc">Reveal answer</span></div>
    <button class="close-btn" onclick="closeShortcuts()">Close</button>
  </div>
</div>

<script>
const slides = [

/* ══════════════════════════════════════════════
   SLIDE 1 — TITLE
══════════════════════════════════════════════ */
`<div class="slide" data-index="0" style="background:radial-gradient(ellipse at 50% 40%, #001020 0%, var(--bg) 68%)">
  <!-- tiny file icon trace (SQLite) -->
  <svg class="trace" style="right:30px;top:30px;width:280px;height:280px" viewBox="0 0 280 280" fill="none" aria-hidden="true">
    <rect x="60" y="20" width="160" height="200" rx="12" stroke="white" stroke-width="1.5"/>
    <path d="M140 20 L140 80 L200 80" stroke="white" stroke-width="1.5" fill="none"/>
    <line x1="80" y1="110" x2="200" y2="110" stroke="white" stroke-width="1"/>
    <line x1="80" y1="135" x2="200" y2="135" stroke="white" stroke-width="1"/>
    <line x1="80" y1="160" x2="160" y2="160" stroke="white" stroke-width="1"/>
    <text x="140" y="220" text-anchor="middle" font-size="11" fill="white" font-family="monospace">.sqlite</text>
  </svg>
  <!-- server cylinders trace (MySQL) -->
  <svg class="trace" style="left:20px;bottom:20px;width:240px;height:240px" viewBox="0 0 240 240" fill="none" aria-hidden="true">
    <ellipse cx="120" cy="50" rx="70" ry="20" stroke="white" stroke-width="1.5"/>
    <path d="M50 50 L50 150" stroke="white" stroke-width="1.5"/>
    <path d="M190 50 L190 150" stroke="white" stroke-width="1.5"/>
    <ellipse cx="120" cy="150" rx="70" ry="20" stroke="white" stroke-width="1.5"/>
    <ellipse cx="120" cy="100" rx="70" ry="20" stroke="white" stroke-width="1" opacity=".5"/>
  </svg>

  <div style="text-align:center;max-width:840px">
    <div class="eyebrow">System Integration &amp; Architecture · Module 20</div>
    <h1 style="font-size:clamp(28px,4.8vw,52px);font-weight:800;line-height:1.1;margin-bottom:14px">
      Database Integration 2<br><span style="color:var(--accent)">SQLite, MySQL &amp; WAMPP</span>
    </h1>
    <p style="font-size:19px;color:var(--text-muted);margin-bottom:26px">Knowing <em>which</em> database to use is as important as knowing <em>how</em> to use one.</p>
    <div style="display:flex;gap:13px;flex-wrap:wrap;justify-content:center">
      <span class="badge blue">📄 SQLite</span>
      <span class="badge green">🗄️ MySQL</span>
      <span class="badge orange">🧪 WAMPP Stack</span>
      <span class="badge purple">🖥️ phpMyAdmin</span>
      <span class="badge yellow">💻 SQL Drills</span>
    </div>
  </div>
</div>`,

/* ══════════════════════════════════════════════
   SLIDE 2 — LESSON PREVIEW
══════════════════════════════════════════════ */
`<div class="slide" data-index="1">
  <div class="eyebrow">Lesson Preview</div>
  <div class="slide-title">Broadening Our <span>Database Landscape</span></div>
  <div class="grid-2 w-full" style="max-width:900px;align-items:start">
    <div class="card">
      <h3>📡 Coming From M19…</h3>
      <p style="color:var(--text-muted)">Last module: <strong>MySQL fundamentals</strong> — tables, rows, columns, SELECT, WHERE, INSERT, UPDATE, DELETE.</p>
      <p class="mt-2">Now: we meet <strong>SQLite</strong> (the lightweight alternative), understand when to use each, and set up <strong>WAMPP</strong> for local practice.</p>
    </div>
    <div class="card">
      <h3>🎯 Learning Objectives</h3>
      <ul>
        <li>Identify key features of <strong>SQLite</strong> (serverless, embedded)</li>
        <li>Compare <strong>SQLite vs MySQL</strong> (embedded vs client-server)</li>
        <li>Set up <strong>WAMPP</strong> + <strong>phpMyAdmin</strong></li>
        <li>Execute SQL: <code style="color:var(--accent2);background:var(--bg2);padding:2px 6px;border-radius:4px">CREATE DATABASE</code>, <code style="color:var(--accent2);background:var(--bg2);padding:2px 6px;border-radius:4px">DROP TABLE</code>, <code style="color:var(--accent2);background:var(--bg2);padding:2px 6px;border-radius:4px">UPDATE</code></li>
      </ul>
    </div>
  </div>
  <div class="card mt-4" style="max-width:900px;width:100%;background:linear-gradient(135deg,rgba(96,165,250,.08),rgba(74,222,128,.06))">
    <p style="text-align:center;font-size:17px">💡 The right database choice can make or break a system — from a smartwatch to Facebook's global infrastructure.</p>
  </div>
</div>`,

/* ══════════════════════════════════════════════
   SLIDE 3 — WHAT IS SQLITE
══════════════════════════════════════════════ */
`<div class="slide" data-index="2">
  <div class="eyebrow">Core Concept</div>
  <div class="slide-title">What is <span>SQLite</span>?</div>
  <div class="grid-2-wide w-full" style="max-width:940px;align-items:start">
    <div class="card">
      <h3>Embedded, Server-less RDBMS</h3>
      <p>SQLite is one of the most popular relational database systems available today. Unlike MySQL, it is an <strong>embedded, server-less RDBMS</strong> — an in-memory open-source library.</p>
      <div style="display:flex;flex-direction:column;gap:12px;margin-top:14px">
        <div class="card-inset" style="border-left:3px solid var(--accent)">
          <h4 style="color:var(--accent)">Zero Configuration</h4>
          <p style="font-size:16px">Requires <strong>absolutely no setup, no installation, no license</strong>. No server process to start or stop. Just a file.</p>
        </div>
        <div class="card-inset" style="border-left:3px solid var(--accent2)">
          <h4 style="color:var(--accent2)">Single Cross-Platform File</h4>
          <p style="font-size:16px">The <strong>entire database</strong> lives in one portable <code style="color:var(--accent2)">.sqlite</code> file — works on Windows, macOS, and Linux without conversion.</p>
        </div>
        <div class="card-inset" style="border-left:3px solid var(--accent3)">
          <h4 style="color:var(--accent3)">Incredibly Lightweight</h4>
          <p style="font-size:16px">Often <strong>less than 500kB</strong> in size. Small enough to be embedded directly into device firmware.</p>
        </div>
      </div>
    </div>
    <div class="flex-col" style="gap:16px">
      <div class="card" style="border-top:3px solid var(--accent)">
        <h3 style="font-size:18px">🎨 Adobe Lightroom</h3>
        <p style="font-size:15px;color:var(--text-muted)"><strong>Adobe</strong> uses SQLite as the application file format for <strong>Photoshop Lightroom</strong> — your entire photo library catalog is a single .sqlite file.</p>
      </div>
      <div class="card" style="border-top:3px solid var(--accent2)">
        <h3 style="font-size:18px">✈️ Airbus A350 XWB</h3>
        <p style="font-size:15px;color:var(--text-muted)"><strong>Airbus</strong> uses SQLite in the <strong>flight software</strong> of their A350 XWB aircraft — proving its reliability in safety-critical, embedded systems.</p>
      </div>
      <div class="card-inset" style="border-left:3px solid var(--warning)">
        <p style="font-size:15px">📱 Also used in: iPhones, Android devices, Firefox, Chrome, Skype, iTunes, and virtually every mobile app that stores local data.</p>
      </div>
    </div>
  </div>
</div>`,

/* ══════════════════════════════════════════════
   SLIDE 4 — WHY USE SQLITE (FEATURES TABLE)
══════════════════════════════════════════════ */
`<div class="slide" data-index="3">
  <div class="eyebrow">SQLite Deep-Dive</div>
  <div class="slide-title">Why Use <span>SQLite</span>?</div>
  <div style="max-width:920px;width:100%">
    <div class="card w-full" style="margin-bottom:18px">
      <div class="tbl-wrap">
        <table>
          <thead><tr><th>Feature</th><th>Description</th></tr></thead>
          <tbody>
            <tr><td><strong style="color:var(--accent)">Zero Setup &amp; Admin</strong></td><td>No license, installation, or admin configuration needed. No server process to start, stop, or maintain.</td></tr>
            <tr><td><strong style="color:var(--accent2)">Serverless Design</strong></td><td>Reads and writes directly to ordinary disk files. No separate server process required whatsoever.</td></tr>
            <tr><td><strong style="color:var(--accent3)">Cross-Platform</strong></td><td>A SQLite file is compatible across macOS, Windows, and Linux without any conversion.</td></tr>
            <tr><td><strong style="color:var(--accent4)">Flexibility</strong></td><td>Work on multiple databases simultaneously within the same session — great for testing and temporary operations.</td></tr>
          </tbody>
        </table>
      </div>
    </div>
    <div class="grid-3 w-full" style="gap:14px">
      <div class="card-inset" style="text-align:center">
        <div style="font-size:28px;margin-bottom:8px">📱</div>
        <h4>Mobile &amp; Embedded</h4>
        <p style="font-size:14px;color:var(--text-muted)">Phones, TVs, digital cameras, IoT devices — limited power, zero overhead</p>
      </div>
      <div class="card-inset" style="text-align:center">
        <div style="font-size:28px;margin-bottom:8px">🌐</div>
        <h4>Low-Medium Traffic Web</h4>
        <p style="font-size:14px;color:var(--text-muted)">Efficiently handles HTTP requests for smaller web apps without a separate server</p>
      </div>
      <div class="card-inset" style="text-align:center">
        <div style="font-size:28px;margin-bottom:8px">🎓</div>
        <h4>Education &amp; Prototyping</h4>
        <p style="font-size:14px;color:var(--text-muted)">Zero headache for beginners — learn SQL instantly with no server setup</p>
      </div>
    </div>
  </div>
</div>`,

/* ══════════════════════════════════════════════
   SLIDE 5 — SQLITE vs MYSQL (HEAD-TO-HEAD)
══════════════════════════════════════════════ */
`<div class="slide" data-index="4">
  <div class="eyebrow">The Big Comparison</div>
  <div class="slide-title"><span>SQLite</span> vs <span style="color:var(--accent2)">MySQL</span></div>
  <div style="max-width:940px;width:100%">
    <!-- VS header -->
    <div style="display:flex;align-items:center;gap:16px;justify-content:center;margin-bottom:18px">
      <div class="badge blue" style="font-size:18px;padding:10px 22px">📄 SQLite</div>
      <div class="vs-pill">VS</div>
      <div class="badge green" style="font-size:18px;padding:10px 22px">🗄️ MySQL</div>
    </div>
    <div class="card w-full">
      <div class="tbl-wrap">
        <table>
          <thead><tr><th>Dimension</th><th style="color:var(--accent)">SQLite</th><th style="color:var(--accent2)">MySQL</th></tr></thead>
          <tbody>
            <tr><td><strong>Architecture</strong></td><td>Embedded, <strong>server-less</strong></td><td><strong>Client-Server</strong> model</td></tr>
            <tr><td><strong>Setup</strong></td><td>Zero config — just a file</td><td>Requires server install &amp; config</td></tr>
            <tr><td><strong>Size</strong></td><td>Under 500kB</td><td>Much larger (server software)</td></tr>
            <tr><td><strong>Concurrent Users</strong></td><td>Low — file locks on writes</td><td>Very high — built for thousands</td></tr>
            <tr><td><strong>Best For</strong></td><td>Mobile, embedded, local, testing</td><td>Global web apps, enterprise</td></tr>
            <tr><td><strong>Who Made It</strong></td><td>D. Richard Hipp (open source)</td><td>MySQL AB (now Oracle, 1994)</td></tr>
            <tr><td><strong>License</strong></td><td>Public Domain (free forever)</td><td>Open-source (GPL) + paid enterprise</td></tr>
            <tr><td><strong>Examples</strong></td><td>Lightroom, A350, Chrome, iOS</td><td>Facebook, YouTube, Uber, Wikipedia</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>`,

/* ══════════════════════════════════════════════
   SLIDE 6 — WHEN TO USE WHICH

`<div class="slide" data-index="11">
  <div class="eyebrow">SQL Reference</div>
  <div class="slide-title">CREATE &amp; DROP <span>Commands</span></div>
  <div style="max-width:960px;width:100%;height:min(520px,58vh);display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:stretch">
    <div class="code-wrap" style="height:100%">
      <div class="code-header">
        <span class="code-lang">Database &amp; Table Management</span>
        <button class="copy-btn" onclick="copyCode(this,'create-drop')">Copy</button>
      </div>
      <pre id="create-drop"><span class="cm">-- Create a brand new database</span>
<span class="kw">CREATE DATABASE</span> testDB;

<span class="cm">-- Delete an entire database (careful!)</span>
<span class="kw">DROP DATABASE</span> testDB;

<span class="cm">-- Create a table with typed columns</span>
<span class="kw">CREATE TABLE</span> <span class="tbl">Person</span> (
  <span class="tbl">PersonID</span>   <span class="tp">INT</span>,
  <span class="tbl">LastName</span>   <span class="tp">VARCHAR</span>(<span class="num">255</span>),
  <span class="tbl">FirstName</span>  <span class="tp">VARCHAR</span>(<span class="num">255</span>),
  <span class="tbl">Address</span>    <span class="tp">VARCHAR</span>(<span class="num">255</span>),
  <span class="tbl">City</span>       <span class="tp">VARCHAR</span>(<span class="num">255</span>)
);

<span class="cm">-- Delete an entire table and its data</span>
<span class="kw">DROP TABLE</span> <span class="tbl">Person</span>;

<span class="cm">-- Just remove all rows (keep structure)</span>
<span class="kw">TRUNCATE TABLE</span> <span class="tbl">Person</span>;

<span class="cm">-- Add a new column to existing table</span>
<span class="kw">ALTER TABLE</span> <span class="tbl">Person</span>
<span class="kw">ADD</span> <span class="tbl">Email</span> <span class="tp">VARCHAR</span>(<span class="num">255</span>);</pre>
    </div>
    <div class="flex-col" style="gap:14px;height:100%">
      <div class="card">
        <h3>⚡ Command Quick-Reference</h3>
        <div style="display:flex;flex-direction:column;gap:9px;margin-top:4px">
          <div class="card-inset" style="border-left:3px solid var(--accent2)"><p style="font-size:15px"><code style="color:var(--accent2)">CREATE DATABASE</code> — makes a new empty database</p></div>
          <div class="card-inset" style="border-left:3px solid var(--danger)"><p style="font-size:15px"><code style="color:var(--danger)">DROP DATABASE</code> — permanently deletes the whole DB</p></div>
          <div class="card-inset" style="border-left:3px solid var(--accent2)"><code style="color:var(--accent2);font-size:15px">CREATE TABLE</code><p style="font-size:15px;margin-top:4px">Define column names &amp; data types (INT, VARCHAR, DATE…)</p></div>
          <div class="card-inset" style="border-left:3px solid var(--danger)"><p style="font-size:15px"><code style="color:var(--danger)">DROP TABLE</code> — deletes the table AND all its data</p></div>
          <div class="card-inset" style="border-left:3px solid var(--accent)"><p style="font-size:15px"><code style="color:var(--accent)">TRUNCATE TABLE</code> — empties the table, keeps structure</p></div>

</div>`,

`<div class="slide" data-index="12">
  <div class="eyebrow">SQL Reference</div>
  <div class="slide-title">UPDATE with <span>WHERE</span></div>
  <div style="max-width:960px;width:100%;height:min(480px,55vh);display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:stretch">
    <div class="code-wrap" style="height:100%">
      <div class="code-header">
        <span class="code-lang">UPDATE — The Right Way</span>
        <button class="copy-btn" onclick="copyCode(this,'update-code')">Copy</button>
      </div>
      <pre id="update-code"><span class="cm">-- ✅ CORRECT — only updates Norway rows</span>
<span class="kw">UPDATE</span> <span class="tbl">Customers</span>
<span class="kw">SET</span>    <span class="tbl">City</span> <span class="op">=</span> <span class="str">'Oslo'</span>
<span class="kw">WHERE</span>  <span class="tbl">Country</span> <span class="op">=</span> <span class="str">'Norway'</span>;

<span class="cm">-- ❌ WRONG — updates EVERY row!</span>
<span class="cm">-- (no WHERE clause = catastrophe)</span>
<span class="kw">UPDATE</span> <span class="tbl">Customers</span>
<span class="kw">SET</span>    <span class="tbl">City</span> <span class="op">=</span> <span class="str">'Oslo'</span>;

<span class="cm">-- ✅ Update multiple columns at once</span>
<span class="kw">UPDATE</span> <span class="tbl">Customers</span>
<span class="kw">SET</span>    <span class="tbl">City</span>    <span class="op">=</span> <span class="str">'Bergen'</span>,
       <span class="tbl">Country</span> <span class="op">=</span> <span class="str">'Norway'</span>
<span class="kw">WHERE</span>  <span class="tbl">CustomerID</span> <span class="op">=</span> <span class="num">42</span>;

<span class="cm">-- ✅ Delete only specific rows</span>
<span class="kw">DELETE FROM</span> <span class="tbl">Customers</span>
<span class="kw">WHERE</span>  <span class="tbl">Country</span> <span class="op">=</span> <span class="str">'Norway'</span>;

<span class="cm">-- ❌ Deletes ALL rows — avoid!</span>
<span class="kw">DELETE FROM</span> <span class="tbl">Customers</span>;</pre>
    </div>
    <div class="flex-col" style="gap:14px;height:100%">
      <div class="card">
        <h3>🚨 The Golden Rule</h3>
        <div class="card-inset" style="border:2px solid var(--warning);margin-top:6px">
          <p style="font-size:17px;text-align:center;color:var(--warning);font-weight:700">Always use WHERE<br>with UPDATE and DELETE</p>
        </div>
        <p style="font-size:16px;color:var(--text-muted);margin-top:12px">Without a WHERE clause, you change or delete <strong>every single row</strong> in the table. This is one of the most common and catastrophic SQL mistakes — and there is no Ctrl+Z.</p>
      </div>
      <div class="card-inset" style="flex:1;border-left:3px solid var(--accent3)">
        <h4 style="color:var(--accent3)">💡 Test in phpMyAdmin</h4>
        <p style="font-size:15px;color:var(--text-muted)">Open WAMPP → go to <code>localhost/phpmyadmin</code> → click the SQL tab → paste any UPDATE above → click <strong>"Go"</strong> to see it execute safely on a test table.</p>
      </div>
    </div>
  </div>
</div>`,

/* ENGINE */
const deck = document.getElementById('deck');
const total = slides.length;
let current = 0;

slides.forEach(html => {
  const w = document.createElement('div');
  w.innerHTML = html;
  deck.appendChild(w.firstElementChild);
});

const allSlides = document.querySelectorAll('.slide');
const bar = document.getElementById('progress-bar');
const ctr = document.getElementById('counter');

function goTo(idx, dir = 1) {
  if (idx < 0 || idx >= total) return;
  const prev = allSlides[current];
  prev.classList.remove('active');
  prev.classList.add(dir > 0 ? 'exit-left' : 'exit-right');
  setTimeout(() => prev.classList.remove('exit-left','exit-right'), 400);
  current = idx;
  const next = allSlides[current];
  next.style.transform = dir > 0 ? 'translateX(60px)' : 'translateX(-60px)';
  next.classList.add('active');
  setTimeout(() => { next.style.transform = ''; }, 10);
  bar.style.width = ((current + 1) / total * 100) + '%';
  ctr.textContent = (current + 1) + ' / ' + total;
}

allSlides[0].classList.add('active');
bar.style.width = (1 / total * 100) + '%';

document.addEventListener('keydown', e => {
  if (e.key==='ArrowRight'||e.key==='ArrowDown') goTo(current+1, 1);
  else if (e.key==='ArrowLeft'||e.key==='ArrowUp') goTo(current-1,-1);
  else if (e.key==='Home') goTo(0,-1);
  else if (e.key==='End')  goTo(total-1,1);
  else if (e.key==='?') toggleShortcuts();
});
document.addEventListener('contextmenu', e => { e.preventDefault(); goTo(current+1,1); });
document.addEventListener('mousedown', e => {
  if (e.button===3){e.preventDefault();e.stopImmediatePropagation();goTo(current+1, 1);}
  if (e.button===4){e.preventDefault();e.stopImmediatePropagation();goTo(current-1,-1);}
}, true);
let touchX=0;
document.addEventListener('touchstart',e=>{touchX=e.touches[0].clientX;},{passive:true});
document.addEventListener('touchend',e=>{
  const dx=touchX-e.changedTouches[0].clientX;
  if(Math.abs(dx)>40) dx>0?goTo(current+1,1):goTo(current-1,-1);
});
function copyCode(btn,id){
  const pre=document.getElementById(id);
  navigator.clipboard.writeText(pre?pre.innerText:'').then(()=>{
    btn.textContent='Copied!';btn.classList.add('copied');
    setTimeout(()=>{btn.textContent='Copy';btn.classList.remove('copied');},1800);
  });
}
function toggleShortcuts(){document.getElementById('shortcuts-overlay').classList.toggle('show');}
function closeShortcuts() {document.getElementById('shortcuts-overlay').classList.remove('show');}
document.getElementById('shortcuts-overlay').addEventListener('click',e=>{
  if(e.target===document.getElementById('shortcuts-overlay'))closeShortcuts();
});
</script>
