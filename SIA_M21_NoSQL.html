<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SIA M21 – NoSQL Database Integration</title>
<style>
  :root {
    --bg: #181c1f;
    --bg2: #1d2226;
    --card: #222a2e;
    --shadow-dark: #0f1315;
    --shadow-light: #2d3a40;
    --accent:  #f59e0b;   /* amber / NoSQL gold */
    --accent2: #60a5fa;   /* SQL blue (contrast) */
    --accent3: #34d399;   /* green — JSON/docs */
    --accent4: #f472b6;   /* pink — graph/social */
    --accent5: #a78bfa;   /* purple */
    --text: #e2e8f0;
    --text-muted: #94a3b8;
    --danger: #f87171;
    --warning: #fbbf24;
    --radius: 20px;
    --radius-sm: 12px;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); }

  #progress-bar { position: fixed; top: 0; left: 0; height: 3px; background: linear-gradient(90deg, var(--accent), var(--accent3), var(--accent4)); transition: width .35s ease; z-index: 999; }
  #counter { position: fixed; bottom: 14px; right: 20px; font-size: 16px; color: var(--text-muted); z-index: 999; }

  #deck { width: 100%; height: 100%; position: relative; }
  .slide {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; justify-content: center; align-items: center;
    padding: 36px 52px;
    opacity: 0; pointer-events: none;
    transition: opacity .35s ease, transform .35s ease;
    transform: translateX(60px);
  }
  .slide.active  { opacity: 1; pointer-events: auto; transform: translateX(0); }
  .slide.exit-left  { opacity: 0; transform: translateX(-60px); }
  .slide.exit-right { opacity: 0; transform: translateX(60px); }
  @media (prefers-reduced-motion: reduce) {
    .slide { transition: opacity .15s ease; transform: none !important; }
  }

  .eyebrow    { font-size: 12px; text-transform: uppercase; letter-spacing: 2.8px; color: var(--accent); margin-bottom: 8px; font-weight: 700; }
  .slide-title { font-size: clamp(24px, 3.2vw, 40px); font-weight: 800; color: var(--text); text-align: center; line-height: 1.2; margin-bottom: 24px; }
  .slide-title span { color: var(--accent); }

  .card { background: var(--card); border-radius: var(--radius); box-shadow: 6px 6px 16px var(--shadow-dark), -4px -4px 12px var(--shadow-light); padding: 22px 26px; }
  .card-inset { background: var(--bg2); border-radius: var(--radius-sm); box-shadow: inset 3px 3px 8px var(--shadow-dark), inset -2px -2px 6px var(--shadow-light); padding: 14px 18px; }

  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; width: 100%; }
  .grid-3 { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 16px; width: 100%; }
  .grid-4 { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 14px; width: 100%; }
  .grid-2-wide { display: grid; grid-template-columns: 1.1fr 0.9fr; gap: 20px; width: 100%; }

  p, li, td, th { font-size: 17px; line-height: 1.65; color: var(--text); }
  h3 { font-size: 19px; font-weight: 700; color: var(--accent); margin-bottom: 9px; }
  h4 { font-size: 17px; font-weight: 600; color: var(--accent2); margin-bottom: 7px; }
  ul { padding-left: 20px; }
  li { margin-bottom: 6px; }
  strong { color: var(--accent3); }
  code { font-family: 'Cascadia Code','Fira Code',Consolas,monospace; font-size: 15px; color: var(--accent3); background: var(--bg2); padding: 2px 7px; border-radius: 5px; }

  .badge {
    display: inline-flex; align-items: center; gap: 7px;
    background: var(--card); box-shadow: 3px 3px 8px var(--shadow-dark), -2px -2px 6px var(--shadow-light);
    border-radius: 50px; padding: 7px 15px; font-size: 16px; font-weight: 600; color: var(--text);
  }
  .badge.gold   { color: var(--accent);  }
  .badge.blue   { color: var(--accent2); }
  .badge.green  { color: var(--accent3); }
  .badge.pink   { color: var(--accent4); }
  .badge.purple { color: var(--accent5); }
  .badge.yellow { color: var(--warning); }
  .badge.red    { color: var(--danger);  }

  /* code blocks */
  .code-wrap { position: relative; border-radius: var(--radius-sm); overflow: hidden; background: #0d1117; display: flex; flex-direction: column; min-height: 0; }
  .code-header { display: flex; align-items: center; justify-content: space-between; padding: 9px 16px; background: #161b22; flex-shrink: 0; }
  .code-lang { font-size: 16px; color: #8b949e; font-family: monospace; }
  .copy-btn { font-size: 15px; padding: 5px 13px; border-radius: 8px; border: none; cursor: pointer; font-weight: 600; background: var(--card); color: var(--text); box-shadow: 3px 3px 7px var(--shadow-dark), -2px -2px 5px var(--shadow-light); transition: all .15s; }
  .copy-btn.copied { box-shadow: inset 2px 2px 5px var(--shadow-dark), inset -1px -1px 4px var(--shadow-light); color: var(--accent3); }
  pre { flex: 1; overflow: auto; padding: 16px; margin: 0; font-size: 14.5px; line-height: 1.75; font-family: 'Cascadia Code','Fira Code',Consolas,monospace; min-height: 0; }
  .kw  { color: #ff7b72; font-weight: 700; }
  .str { color: #a5d6ff; }
  .cm  { color: #8b949e; font-style: italic; }
  .num { color: #f0db4f; }
  .tbl { color: #7ee787; }
  .op  { color: #ffa657; }
  .tp  { color: #d2a8ff; }
  .jk  { color: #f0db4f; }   /* JSON key */
  .jv  { color: #a5d6ff; }   /* JSON value */
  .ja  { color: #34d399; }   /* JSON array/bracket */

  /* drill cards */
  .drill-card { background: var(--card); border-radius: var(--radius); box-shadow: 6px 6px 16px var(--shadow-dark), -4px -4px 12px var(--shadow-light); padding: 18px 22px; cursor: pointer; transition: transform .15s; user-select: none; }
  .drill-card:hover { transform: translateY(-2px); }
  .drill-q { font-size: 16px; color: var(--text-muted); margin-bottom: 8px; line-height: 1.5; }
  .drill-blank { font-family: monospace; font-size: 14px; background: var(--bg2); border-radius: 8px; padding: 10px 14px; color: var(--text); border: 1px solid rgba(245,158,11,.2); line-height: 1.8; }
  .drill-reveal { display: none; background: rgba(52,211,153,.07); border-radius: 8px; padding: 10px 14px; margin-top: 8px; font-family: monospace; font-size: 15px; color: var(--accent3); border: 1px solid rgba(52,211,153,.2); line-height: 1.8; }
  .drill-card.shown .drill-reveal { display: block; }
  .drill-hint { font-size: 13px; color: var(--text-muted); margin-top: 6px; text-align: right; }
  .drill-card.shown .drill-hint { display: none; }

  /* table */
  .tbl-wrap { width: 100%; overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 16px; }
  th { background: var(--bg); color: var(--accent); padding: 11px 14px; text-align: left; font-size: 15px; text-transform: uppercase; letter-spacing: .8px; }
  td { padding: 10px 14px; border-bottom: 1px solid rgba(255,255,255,.07); vertical-align: top; }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: rgba(245,158,11,.04); }

  /* MCQ */
  .mcq-card { background: var(--card); border-radius: var(--radius); box-shadow: 6px 6px 16px var(--shadow-dark), -4px -4px 12px var(--shadow-light); padding: 20px 24px; display: flex; flex-direction: column; gap: 10px; }
  .mcq-q { font-size: 16px; font-weight: 600; color: var(--text); line-height: 1.5; }
  .mcq-opts { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; }
  .mcq-opt { background: var(--bg2); border-radius: 10px; padding: 8px 12px; font-size: 15px; box-shadow: inset 2px 2px 5px var(--shadow-dark), inset -1px -1px 4px var(--shadow-light); }

  /* answer key */
  .ans-row { display: flex; align-items: flex-start; gap: 13px; padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,.06); }
  .ans-num { background: var(--accent); color: #1a0a00; border-radius: 50%; width: 28px; height: 28px; min-width: 28px; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 800; }
  .ans-text { font-size: 17px; line-height: 1.55; }
  .ans-correct { color: var(--accent3); font-weight: 700; }

  /* shortcuts */
  #shortcuts-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.72); z-index: 9999; align-items: center; justify-content: center; }
  #shortcuts-overlay.show { display: flex; }
  .shortcuts-box { background: var(--card); border-radius: var(--radius); padding: 34px 42px; box-shadow: 10px 10px 30px var(--shadow-dark); max-width: 400px; width: 90%; }
  .shortcuts-box h2 { font-size: 21px; color: var(--accent); margin-bottom: 16px; text-align: center; }
  .shortcut-row { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,.07); }
  .shortcut-row:last-child { border-bottom: none; }
  .shortcut-key  { background: var(--bg2); border-radius: 7px; padding: 4px 10px; font-size: 15px; font-family: monospace; color: var(--accent); }
  .shortcut-desc { font-size: 16px; color: var(--text-muted); }
  .close-btn { display: block; margin: 18px auto 0; background: var(--card); box-shadow: 4px 4px 10px var(--shadow-dark), -2px -2px 7px var(--shadow-light); border: none; border-radius: 12px; padding: 9px 26px; font-size: 17px; color: var(--text); cursor: pointer; }

  .w-full { width: 100%; }
  .mt-2 { margin-top: 10px; }
  .mt-3 { margin-top: 14px; }
  .mt-4 { margin-top: 20px; }
  .flex-col { display: flex; flex-direction: column; }
  .inner-scroll { overflow-y: auto; max-height: 58vh; padding-right: 4px; }
  .inner-scroll::-webkit-scrollbar { width: 5px; }
  .inner-scroll::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 10px; }
  .trace { position: absolute; opacity: .05; pointer-events: none; }
</style>
</head>
<body>

<div id="progress-bar"></div>
<div id="counter">1 / 22</div>
<div id="deck"></div>

<div id="shortcuts-overlay">
  <div class="shortcuts-box">
    <h2>⌨️ Shortcuts</h2>
    <div class="shortcut-row"><span class="shortcut-key">→ / Right-click</span><span class="shortcut-desc">Next slide</span></div>
    <div class="shortcut-row"><span class="shortcut-key">←</span><span class="shortcut-desc">Prev slide</span></div>
    <div class="shortcut-row"><span class="shortcut-key">Home / End</span><span class="shortcut-desc">First / Last</span></div>
    <div class="shortcut-row"><span class="shortcut-key">?</span><span class="shortcut-desc">Toggle this</span></div>
    <div class="shortcut-row"><span class="shortcut-key">Tap drill</span><span class="shortcut-desc">Reveal answer</span></div>
    <button class="close-btn" onclick="closeShortcuts()">Close</button>
  </div>
</div>

<script>
const slides = [

/* ══════════════════════════════════════════════
   SLIDE 1 — TITLE
══════════════════════════════════════════════ */
`<div class="slide" data-index="0" style="background:radial-gradient(ellipse at 55% 40%, #1a1000 0%, var(--bg) 68%)">
  <!-- JSON doc trace decoration -->
  <svg class="trace" style="right:20px;top:20px;width:300px;height:300px" viewBox="0 0 300 300" fill="none" aria-hidden="true">
    <path d="M40 20C20 20 14 30 14 50v20c0 20-10 30-10 30s10 10 10 30v20c0 20 6 30 26 30" stroke="white" stroke-width="2" stroke-linecap="round"/>
    <path d="M260 20c20 0 26 10 26 30v20c0 20 10 30 10 30s-10 10-10 30v20c0 20-6 30-26 30" stroke="white" stroke-width="2" stroke-linecap="round"/>
    <line x1="60"  y1="80"  x2="140" y2="80"  stroke="white" stroke-width="1.5"/>
    <line x1="60"  y1="110" x2="180" y2="110" stroke="white" stroke-width="1.5"/>
    <line x1="60"  y1="140" x2="160" y2="140" stroke="white" stroke-width="1.5"/>
    <line x1="60"  y1="170" x2="200" y2="170" stroke="white" stroke-width="1.5"/>
    <line x1="60"  y1="200" x2="120" y2="200" stroke="white" stroke-width="1"/>
    <circle cx="50"  cy="80"  r="4" fill="white"/>
    <circle cx="50"  cy="110" r="4" fill="white"/>
    <circle cx="50"  cy="140" r="4" fill="white"/>
    <circle cx="50"  cy="170" r="4" fill="white"/>
  </svg>
  <!-- graph nodes trace -->
  <svg class="trace" style="left:10px;bottom:10px;width:260px;height:260px" viewBox="0 0 260 260" fill="none" aria-hidden="true">
    <circle cx="130" cy="130" r="20" stroke="white" stroke-width="1.5"/>
    <circle cx="60"  cy="80"  r="14" stroke="white" stroke-width="1.2"/>
    <circle cx="200" cy="80"  r="14" stroke="white" stroke-width="1.2"/>
    <circle cx="60"  cy="180" r="14" stroke="white" stroke-width="1.2"/>
    <circle cx="200" cy="180" r="14" stroke="white" stroke-width="1.2"/>
    <line x1="130" y1="110" x2="74"  y2="91"  stroke="white" stroke-width="1"/>
    <line x1="130" y1="110" x2="186" y2="91"  stroke="white" stroke-width="1"/>
    <line x1="130" y1="150" x2="74"  y2="169" stroke="white" stroke-width="1"/>
    <line x1="130" y1="150" x2="186" y2="169" stroke="white" stroke-width="1"/>
    <line x1="74"  y1="80"  x2="186" y2="80"  stroke="white" stroke-width="1" stroke-dasharray="5 3"/>
  </svg>

  <div style="text-align:center;max-width:840px">
    <div class="eyebrow">System Integration &amp; Architecture · Module 21</div>
    <h1 style="font-size:clamp(28px,4.8vw,52px);font-weight:800;line-height:1.1;margin-bottom:14px">
      NoSQL Database Integration<br><span style="color:var(--accent)">The Flexible Alternative</span>
    </h1>
    <p style="font-size:19px;color:var(--text-muted);margin-bottom:26px">"Not Only SQL" — where rigid tables give way to flexible JSON documents</p>
    <div style="display:flex;gap:13px;flex-wrap:wrap;justify-content:center">
      <span class="badge gold">📄 NoSQL / JSON</span>
      <span class="badge green">🗂️ Document DB</span>
      <span class="badge blue">🔑 Key-Value</span>
      <span class="badge purple">📊 Wide-Column</span>
      <span class="badge pink">🕸️ Graph DB</span>
      <span class="badge yellow">🔗 SQL JOINs Review</span>
    </div>
  </div>
</div>`,

/* ══════════════════════════════════════════════
   SLIDE 2 — LESSON PREVIEW
══════════════════════════════════════════════ */
`<div class="slide" data-index="1">
  <div class="eyebrow">Lesson Preview</div>
  <div class="slide-title">Beyond the <span>Rigid Table</span></div>
  <div class="grid-2 w-full" style="max-width:900px;align-items:start">
    <div class="card">
      <h3>📡 Coming From M19–M20…</h3>
      <p style="color:var(--text-muted)">We mastered <strong>MySQL</strong> and <strong>SQLite</strong> — relational databases with rigid rows, columns, and SQL queries.</p>
      <p class="mt-2">Now: as the digital economy exploded, traditional databases struggled with the <strong>massive scale, variety, and speed</strong> of modern web and mobile apps.</p>
      <p class="mt-2">Enter: <strong>NoSQL</strong>.</p>
    </div>
    <div class="card">
      <h3>🎯 Learning Objectives</h3>
      <ul>
        <li>Define <strong>NoSQL</strong> and differentiate from SQL</li>
        <li>Identify the <strong>4 types</strong> of NoSQL databases</li>
        <li>Explain <strong>5 digital trends</strong> driving NoSQL adoption</li>
        <li>Understand the <strong>Impedance Mismatch</strong> problem</li>
        <li>Review <strong>SQL JOINs</strong> and <code>BETWEEN</code></li>
      </ul>
    </div>
  </div>
  <div class="card mt-4" style="max-width:900px;width:100%;background:linear-gradient(135deg,rgba(245,158,11,.08),rgba(52,211,153,.06))">
    <p style="text-align:center;font-size:17px">💡 Facebook, Google, and Twitter collect <strong>terabytes of user data daily</strong> — traditional SQL alone can't handle it.</p>
  </div>
</div>`,

/* ══════════════════════════════════════════════
   SLIDE 3 — WHAT IS NOSQL
══════════════════════════════════════════════ */
`<div class="slide" data-index="2">
  <div class="eyebrow">Core Concept</div>
  <div class="slide-title">What is <span>NoSQL</span>?</div>
  <div class="grid-2-wide w-full" style="max-width:940px;align-items:start">
    <div class="card">
      <h3>"Not Only SQL"</h3>
      <p>NoSQL stores information in <strong>JSON documents</strong> rather than the columns and rows of relational databases.</p>
      <div class="card-inset mt-3" style="border-left:4px solid var(--warning)">
        <p style="font-size:16px">⚠️ <strong style="color:var(--warning)">Common Misconception:</strong> NoSQL does NOT mean "No SQL." It means <strong>"Not Only SQL."</strong></p>
        <p style="font-size:15px;color:var(--text-muted);margin-top:6px">A NoSQL database can still use SQL syntax — OR you can combine JSON flexibility with SQL power for the "best of both worlds."</p>
      </div>
      <div style="display:flex;flex-direction:column;gap:10px;margin-top:14px">
        <div class="card-inset" style="border-left:3px solid var(--accent)">
          <h4 style="color:var(--accent)">Flexible</h4>
          <p style="font-size:15px">Data structure can change from document to document — no fixed schema required.</p>
        </div>
        <div class="card-inset" style="border-left:3px solid var(--accent3)">
          <h4 style="color:var(--accent3)">Scalable</h4>
          <p style="font-size:15px">Built to scale horizontally across many servers — handles massive data volumes.</p>
        </div>
        <div class="card-inset" style="border-left:3px solid var(--accent4)">
          <h4 style="color:var(--accent4)">Rapid Response</h4>
          <p style="font-size:15px">Optimized for the complex, high-speed data management demands of modern apps.</p>
        </div>
      </div>
    </div>
    <div class="flex-col" style="gap:14px">
      <div class="card">
        <h3 style="font-size:17px">🕰️ History</h3>
        <p style="font-size:16px">The term <strong>"NoSQL"</strong> was first introduced by <strong>Carl Strozz</strong> in <strong>1998</strong>. It has become one of the fastest-growing categories in database technology.</p>
      </div>
      <div class="card">
        <h3 style="font-size:17px">🌐 Who Uses NoSQL?</h3>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px">
          ${['📘 Facebook','🐦 Twitter (X)','🔍 Google','📸 Instagram','🎬 Netflix','🛒 Amazon','🎵 Spotify','📍 Foursquare'].map(s=>`<div class="card-inset" style="font-size:15px;padding:8px 11px">${s}</div>`).join('')}
        </div>
      </div>
    </div>
  </div>
</div>`,

/* ══════════════════════════════════════════════
   SLIDE 4 — 4 TYPES OF NOSQL
══════════════════════════════════════════════ */
`<div class="slide" data-index="3">
  <div class="eyebrow">NoSQL Types</div>
  <div class="slide-title">The 4 Types of <span>NoSQL Databases</span></div>
  <div class="grid-4 w-full" style="max-width:960px;align-items:start">
    <div class="card" style="text-align:center;border-top:3px solid var(--accent3)">
      <svg width="50" height="50" viewBox="0 0 50 50" fill="none" style="margin:0 auto 10px" role="img" aria-label="Document DB icon">
        <rect x="8" y="6" width="34" height="38" rx="6" fill="rgba(52,211,153,.1)" stroke="var(--accent3)" stroke-width="1.8"/>
        <line x1="15" y1="18" x2="35" y2="18" stroke="var(--accent3)" stroke-width="1.5"/>
        <line x1="15" y1="26" x2="35" y2="26" stroke="var(--accent3)" stroke-width="1.5"/>
        <line x1="15" y1="34" x2="26" y2="34" stroke="var(--accent3)" stroke-width="1.5"/>
      </svg>
      <h3 style="color:var(--accent3);font-size:17px">Document</h3>
      <p style="font-size:14px;color:var(--text-muted);margin-bottom:10px">Stores data as flexible JSON/XML documents. Great for complex hierarchical data like user profiles.</p>
      <div class="card-inset" style="font-size:13px;color:var(--accent3)">MongoDB<br>CouchDB</div>
    </div>
    <div class="card" style="text-align:center;border-top:3px solid var(--accent)">
      <svg width="50" height="50" viewBox="0 0 50 50" fill="none" style="margin:0 auto 10px" role="img" aria-label="Key-Value icon">
        <rect x="4" y="14" width="20" height="22" rx="4" fill="rgba(245,158,11,.1)" stroke="var(--accent)" stroke-width="1.8"/>
        <text x="14" y="30" text-anchor="middle" font-size="10" fill="var(--accent)" font-family="monospace" font-weight="700">KEY</text>
        <path d="M24 25 L30 25" stroke="var(--accent)" stroke-width="2" stroke-linecap="round"/>
        <rect x="30" y="14" width="20" height="22" rx="4" fill="rgba(245,158,11,.1)" stroke="var(--accent)" stroke-width="1.8"/>
        <text x="40" y="30" text-anchor="middle" font-size="9" fill="var(--accent)" font-family="monospace">VAL</text>
      </svg>
      <h3 style="color:var(--accent);font-size:17px">Key-Value</h3>
      <p style="font-size:14px;color:var(--text-muted);margin-bottom:10px">Simplest NoSQL form. Data stored as key-value pairs (like a dictionary). Ideal for caching and sessions.</p>
      <div class="card-inset" style="font-size:13px;color:var(--accent)">Redis<br>Memcached</div>
    </div>
    <div class="card" style="text-align:center;border-top:3px solid var(--accent2)">
      <svg width="50" height="50" viewBox="0 0 50 50" fill="none" style="margin:0 auto 10px" role="img" aria-label="Wide-Column DB icon">
        <rect x="4" y="8" width="42" height="34" rx="4" fill="rgba(96,165,250,.08)" stroke="var(--accent2)" stroke-width="1.8"/>

`<div class="slide" data-index="10">
  <div class="eyebrow">SQL Review</div>
  <div class="slide-title">SQL <span>JOIN</span> Types</div>
  <div style="max-width:960px;width:100%;display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:start">
    <div class="code-wrap" style="min-height:320px">
      <div class="code-header">
        <span class="code-lang">JOIN Examples</span>
        <button class="copy-btn" onclick="copyCode(this,'join-code')">Copy</button>
      </div>
      <pre id="join-code"><span class="cm">-- INNER JOIN: matching rows in BOTH tables</span>
<span class="kw">SELECT</span> *
<span class="kw">FROM</span> <span class="tbl">Orders</span>
<span class="kw">JOIN</span> <span class="tbl">Customers</span>
<span class="kw">ON</span> <span class="tbl">Orders</span>.<span class="tbl">CustomerID</span>
 <span class="op">=</span> <span class="tbl">Customers</span>.<span class="tbl">CustomerID</span>;

<span class="cm">-- LEFT JOIN: ALL rows from Orders
--           + matching Customers</span>
<span class="kw">SELECT</span> *
<span class="kw">FROM</span> <span class="tbl">Orders</span>
<span class="kw">LEFT JOIN</span> <span class="tbl">Customers</span>
<span class="kw">ON</span> <span class="tbl">Orders</span>.<span class="tbl">CustomerID</span>
 <span class="op">=</span> <span class="tbl">Customers</span>.<span class="tbl">CustomerID</span>;

<span class="cm">-- RIGHT JOIN: ALL rows from Customers
--            + matching Orders</span>
<span class="kw">SELECT</span> *
<span class="kw">FROM</span> <span class="tbl">Orders</span>
<span class="kw">RIGHT JOIN</span> <span class="tbl">Customers</span>
<span class="kw">ON</span> <span class="tbl">Orders</span>.<span class="tbl">CustomerID</span>
 <span class="op">=</span> <span class="tbl">Customers</span>.<span class="tbl">CustomerID</span>;</pre>
    </div>
    <div class="flex-col" style="gap:14px">
      <div class="card">
        <h3>🔗 JOIN Types At a Glance</h3>
        <div style="display:flex;flex-direction:column;gap:10px;margin-top:4px">
          <div class="card-inset" style="border-left:3px solid var(--accent3)">
            <p style="font-size:15px"><code>(INNER) JOIN</code> — only rows matching in <strong>both</strong> tables</p>
          </div>
          <div class="card-inset" style="border-left:3px solid var(--accent2)">
            <p style="font-size:15px"><code>LEFT JOIN</code> — all from left table + any matches from right</p>
          </div>
          <div class="card-inset" style="border-left:3px solid var(--accent4)">
            <p style="font-size:15px"><code>RIGHT JOIN</code> — all from right table + any matches from left</p>
          </div>
          <div class="card-inset" style="border-left:3px solid var(--accent)">
            <p style="font-size:15px"><code>FULL OUTER JOIN</code> — all rows from both tables (with NULLs)</p>
          </div>
        </div>
      </div>
      <div class="card-inset" style="border-left:3px solid var(--accent)">
        <h4 style="color:var(--accent)">The ON clause</h4>
        <p style="font-size:15px;color:var(--text-muted)">Specifies the <strong>shared column</strong> that links the two tables. Usually a Primary Key (PK) matching a Foreign Key (FK).</p>
      </div>
    </div>
  </div>
</div>`,

`<div class="slide" data-index="11">
  <div class="eyebrow">SQL Review</div>
  <div class="slide-title">BETWEEN · ORDER BY · <span>DISTINCT</span></div>
  <div style="max-width:960px;width:100%;display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:start">
    <div class="code-wrap" style="min-height:300px">
      <div class="code-header">
        <span class="code-lang">Filtering & Sorting</span>
        <button class="copy-btn" onclick="copyCode(this,'filter-code')">Copy</button>
      </div>
      <pre id="filter-code"><span class="cm">-- BETWEEN: numeric range (inclusive)</span>
<span class="kw">SELECT</span> * <span class="kw">FROM</span> <span class="tbl">Products</span>
<span class="kw">WHERE</span> <span class="tbl">Price</span> <span class="kw">BETWEEN</span> <span class="num">10</span> <span class="kw">AND</span> <span class="num">20</span>;

<span class="cm">-- BETWEEN: alphabetical range</span>
<span class="kw">SELECT</span> * <span class="kw">FROM</span> <span class="tbl">Products</span>
<span class="kw">WHERE</span> <span class="tbl">ProductName</span>
  <span class="kw">BETWEEN</span> <span class="str">'Geitost'</span> <span class="kw">AND</span> <span class="str">'Pavlova'</span>;

<span class="cm">-- ORDER BY: sort ascending (A→Z)</span>
<span class="kw">SELECT</span> * <span class="kw">FROM</span> <span class="tbl">Customers</span>
<span class="kw">ORDER BY</span> <span class="tbl">Country</span> <span class="kw">ASC</span>;

<span class="cm">-- ORDER BY: sort descending (Z→A)</span>
<span class="kw">SELECT</span> * <span class="kw">FROM</span> <span class="tbl">Customers</span>
<span class="kw">ORDER BY</span> <span class="tbl">Country</span> <span class="kw">DESC</span>;

<span class="cm">-- SELECT DISTINCT: unique values only</span>

/* ENGINE */
const deck = document.getElementById('deck');
const total = slides.length;
let current = 0;

slides.forEach(html => {
  const w = document.createElement('div');
  w.innerHTML = html;
  deck.appendChild(w.firstElementChild);
});

const allSlides = document.querySelectorAll('.slide');
const bar = document.getElementById('progress-bar');
const ctr = document.getElementById('counter');

function goTo(idx, dir = 1) {
  if (idx < 0 || idx >= total) return;
  const prev = allSlides[current];
  prev.classList.remove('active');
  prev.classList.add(dir > 0 ? 'exit-left' : 'exit-right');
  setTimeout(() => prev.classList.remove('exit-left','exit-right'), 400);
  current = idx;
  const next = allSlides[current];
  next.style.transform = dir > 0 ? 'translateX(60px)' : 'translateX(-60px)';
  next.classList.add('active');
  setTimeout(() => { next.style.transform = ''; }, 10);
  bar.style.width = ((current + 1) / total * 100) + '%';
  ctr.textContent = (current + 1) + ' / ' + total;
}

allSlides[0].classList.add('active');
bar.style.width = (1 / total * 100) + '%';

document.addEventListener('keydown', e => {
  if (e.key==='ArrowRight'||e.key==='ArrowDown') goTo(current+1, 1);
  else if (e.key==='ArrowLeft'||e.key==='ArrowUp') goTo(current-1,-1);
  else if (e.key==='Home') goTo(0,-1);
  else if (e.key==='End')  goTo(total-1,1);
  else if (e.key==='?') toggleShortcuts();
});
document.addEventListener('contextmenu', e => { e.preventDefault(); goTo(current+1,1); });
document.addEventListener('mousedown', e => {
  if (e.button===3){e.preventDefault();e.stopImmediatePropagation();goTo(current+1, 1);}
  if (e.button===4){e.preventDefault();e.stopImmediatePropagation();goTo(current-1,-1);}
}, true);
let touchX=0;
document.addEventListener('touchstart',e=>{touchX=e.touches[0].clientX;},{passive:true});
document.addEventListener('touchend',e=>{
  const dx=touchX-e.changedTouches[0].clientX;
  if(Math.abs(dx)>40) dx>0?goTo(current+1,1):goTo(current-1,-1);
});
function copyCode(btn,id){
  const pre=document.getElementById(id);
  navigator.clipboard.writeText(pre?pre.innerText:'').then(()=>{
    btn.textContent='Copied!';btn.classList.add('copied');
    setTimeout(()=>{btn.textContent='Copy';btn.classList.remove('copied');},1800);
  });
}
function toggleShortcuts(){document.getElementById('shortcuts-overlay').classList.toggle('show');}
function closeShortcuts() {document.getElementById('shortcuts-overlay').classList.remove('show');}
document.getElementById('shortcuts-overlay').addEventListener('click',e=>{
  if(e.target===document.getElementById('shortcuts-overlay'))closeShortcuts();
});
</script>

</html>
