<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SIA M23 – Web Frameworks</title>
<style>
  :root {
    --bg:  #191c22;
    --bg2: #1e2229;
    --card: #242b34;
    --sd: #10141a;   /* shadow dark */
    --sl: #2e3849;   /* shadow light */
    --a1: #7c3aed;   /* deep violet  — Django/framework */
    --a2: #38bdf8;   /* sky blue     — client-side */
    --a3: #34d399;   /* green        — correct/code */
    --a4: #fb923c;   /* amber        — tip/warning */
    --a5: #f472b6;   /* pink         — Ruby/Rails */
    --text: #e2e8f0;
    --muted: #94a3b8;
    --danger: #f87171;
    --warn: #fbbf24;
    --r: 20px;
    --rs: 12px;
  }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
  html,body{width:100%;height:100%;overflow:hidden;font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);}

  /* ── progress + counter ── */
  #pb{position:fixed;top:0;left:0;height:3px;background:linear-gradient(90deg,var(--a1),var(--a2),var(--a3));transition:width .35s;z-index:999;}
  #ctr{position:fixed;bottom:14px;right:20px;font-size:16px;color:var(--muted);z-index:999;}

  /* ── deck / slides ── */
  #deck{width:100%;height:100%;position:relative;}
  .slide{
    position:absolute;inset:0;
    display:flex;flex-direction:column;justify-content:center;align-items:center;
    padding:34px 50px;
    opacity:0;pointer-events:none;
    transition:opacity .35s ease,transform .35s ease;
    transform:translateX(60px);
  }
  .slide.active {opacity:1;pointer-events:auto;transform:translateX(0);}
  .slide.exit-l {opacity:0;transform:translateX(-60px);}
  .slide.exit-r {opacity:0;transform:translateX(60px);}
  @media(prefers-reduced-motion:reduce){.slide{transition:opacity .15s;transform:none!important;}}

  /* ── typography ── */
  .eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:2.8px;color:var(--a1);margin-bottom:7px;font-weight:700;}
  .slide-title{font-size:clamp(24px,3.2vw,40px);font-weight:800;text-align:center;line-height:1.2;margin-bottom:22px;}
  .slide-title span{color:var(--a1);}
  p,li,td,th{font-size:17px;line-height:1.65;color:var(--text);}
  h3{font-size:19px;font-weight:700;color:var(--a1);margin-bottom:8px;}
  h4{font-size:17px;font-weight:600;color:var(--a2);margin-bottom:6px;}
  ul{padding-left:20px;}li{margin-bottom:6px;}
  strong{color:var(--a3);}
  code{font-family:'Cascadia Code','Fira Code',Consolas,monospace;font-size:15px;color:var(--a3);background:var(--bg2);padding:2px 7px;border-radius:5px;}

  /* ── neu primitives ── */
  .card{background:var(--card);border-radius:var(--r);box-shadow:6px 6px 16px var(--sd),-4px -4px 12px var(--sl);padding:22px 26px;}
  .inset{background:var(--bg2);border-radius:var(--rs);box-shadow:inset 3px 3px 8px var(--sd),inset -2px -2px 6px var(--sl);padding:14px 18px;}

  /* ── grids ── */
  .g2{display:grid;grid-template-columns:1fr 1fr;gap:18px;width:100%;}
  .g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;width:100%;}
  .g2w{display:grid;grid-template-columns:1.1fr 0.9fr;gap:20px;width:100%;}

  /* ── badge ── */
  .badge{display:inline-flex;align-items:center;gap:7px;background:var(--card);box-shadow:3px 3px 8px var(--sd),-2px -2px 6px var(--sl);border-radius:50px;padding:7px 15px;font-size:16px;font-weight:600;}
  .bv{color:var(--a1);} .bb{color:var(--a2);} .bg{color:var(--a3);} .bo{color:var(--a4);} .bp{color:var(--a5);} .by{color:var(--warn);} .br{color:var(--danger);}

  /* ── table ── */
  .tw{width:100%;overflow-x:auto;}
  table{width:100%;border-collapse:collapse;font-size:16px;}
  th{background:var(--bg);color:var(--a1);padding:11px 14px;text-align:left;font-size:15px;text-transform:uppercase;letter-spacing:.8px;}
  td{padding:10px 14px;border-bottom:1px solid rgba(255,255,255,.07);vertical-align:top;}
  tr:last-child td{border-bottom:none;}
  tr:hover td{background:rgba(124,58,237,.05);}

  /* ── code block ── */
  .cw{border-radius:var(--rs);overflow:hidden;background:#0d1117;display:flex;flex-direction:column;min-height:0;}
  .ch{display:flex;align-items:center;justify-content:space-between;padding:9px 16px;background:#161b22;flex-shrink:0;}
  .cl{font-size:16px;color:#8b949e;font-family:monospace;}
  .cp{font-size:15px;padding:5px 13px;border-radius:8px;border:none;cursor:pointer;font-weight:600;background:var(--card);color:var(--text);box-shadow:3px 3px 7px var(--sd),-2px -2px 5px var(--sl);transition:all .15s;}
  .cp.ok{box-shadow:inset 2px 2px 5px var(--sd),inset -1px -1px 4px var(--sl);color:var(--a3);}
  pre{flex:1;overflow:auto;padding:16px;margin:0;font-size:14px;line-height:1.7;font-family:'Cascadia Code','Fira Code',Consolas,monospace;min-height:0;}
  .kw{color:#ff7b72;font-weight:700;} .fn{color:#d2a8ff;} .st{color:#a5d6ff;} .cm{color:#8b949e;font-style:italic;} .nm{color:#f0db4f;} .tg{color:#7ee787;} .at{color:#ffa657;}

  /* ── MCQ ── */
  .mq{background:var(--card);border-radius:var(--r);box-shadow:6px 6px 16px var(--sd),-4px -4px 12px var(--sl);padding:20px 24px;display:flex;flex-direction:column;gap:10px;}
  .mq-q{font-size:17px;font-weight:600;line-height:1.5;}
  .mq-o{display:grid;grid-template-columns:1fr 1fr;gap:7px;}
  .mq-opt{background:var(--bg2);border-radius:10px;padding:9px 13px;font-size:16px;box-shadow:inset 2px 2px 5px var(--sd),inset -1px -1px 4px var(--sl);}

  /* ── answer row ── */
  .ar{display:flex;align-items:flex-start;gap:13px;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.06);}
  .an{background:var(--a1);color:#fff;border-radius:50%;width:28px;height:28px;min-width:28px;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:800;}
  .at2{font-size:17px;line-height:1.55;}
  .ac{color:var(--a3);font-weight:700;}

  /* ── shortcuts ── */
  #sh{display:none;position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:9999;align-items:center;justify-content:center;}
  #sh.on{display:flex;}
  .shb{background:var(--card);border-radius:var(--r);padding:34px 42px;box-shadow:10px 10px 30px var(--sd);max-width:400px;width:90%;}
  .shb h2{font-size:21px;color:var(--a1);margin-bottom:16px;text-align:center;}
  .shr{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.07);}
  .shr:last-child{border-bottom:none;}
  .shk{background:var(--bg2);border-radius:7px;padding:4px 10px;font-size:15px;font-family:monospace;color:var(--a1);}
  .shd{font-size:16px;color:var(--muted);}
  .cbt{display:block;margin:18px auto 0;background:var(--card);box-shadow:4px 4px 10px var(--sd),-2px -2px 7px var(--sl);border:none;border-radius:12px;padding:9px 26px;font-size:17px;color:var(--text);cursor:pointer;}

  /* ── utils ── */
  .w100{width:100%;} .mt2{margin-top:10px;} .mt3{margin-top:14px;} .mt4{margin-top:20px;}
  .fcol{display:flex;flex-direction:column;}
  .scroll{overflow-y:auto;max-height:57vh;padding-right:4px;}
  .scroll::-webkit-scrollbar{width:5px;}
  .scroll::-webkit-scrollbar-thumb{background:var(--a1);border-radius:10px;}
  .trace{position:absolute;opacity:.05;pointer-events:none;}
</style>
</head>
<body>
<div id="pb"></div>
<div id="ctr">1 / 20</div>
<div id="deck"></div>

<div id="sh">
  <div class="shb">
    <h2>⌨️ Shortcuts</h2>
    <div class="shr"><span class="shk">→ / Right-click</span><span class="shd">Next slide</span></div>
    <div class="shr"><span class="shk">←</span><span class="shd">Prev slide</span></div>
    <div class="shr"><span class="shk">Home / End</span><span class="shd">First / Last</span></div>
    <div class="shr"><span class="shk">?</span><span class="shd">Toggle this</span></div>
    <button class="cbt" onclick="closeSh()">Close</button>
  </div>
</div>

<script>
const slides = [

/* ══ 1 TITLE ══════════════════════════════════════════════════════ */
`<div class="slide" data-index="0" style="background:radial-gradient(ellipse at 55% 40%,#1a0d3a 0%,var(--bg) 68%)">
  <!-- framework glyph traces -->
  <svg class="trace" style="right:10px;top:10px;width:320px;height:320px" viewBox="0 0 320 320" fill="none" aria-hidden="true">
    <rect x="40" y="40" width="240" height="180" rx="14" stroke="white" stroke-width="1.5"/>
    <line x1="40" y1="80" x2="280" y2="80" stroke="white" stroke-width="1"/>
    <circle cx="60"  cy="60" r="6" fill="none" stroke="white" stroke-width="1.5"/>
    <circle cx="80"  cy="60" r="6" fill="none" stroke="white" stroke-width="1.5"/>
    <circle cx="100" cy="60" r="6" fill="none" stroke="white" stroke-width="1.5"/>
    <rect x="56"  y="104" width="60" height="44" rx="6" stroke="white" stroke-width="1.2"/>
    <rect x="130" y="104" width="60" height="44" rx="6" stroke="white" stroke-width="1.2"/>
    <rect x="204" y="104" width="60" height="44" rx="6" stroke="white" stroke-width="1.2"/>
    <path d="M86 178 L86 240 M160 178 L160 240 M234 178 L234 240" stroke="white" stroke-width="1" stroke-dasharray="4 3"/>
    <rect x="50" y="240" width="220" height="30" rx="6" stroke="white" stroke-width="1.2"/>
  </svg>
  <svg class="trace" style="left:10px;bottom:10px;width:260px;height:200px" viewBox="0 0 260 200" fill="none" aria-hidden="true">
    <path d="M20 100 L80 100 M80 100 L80 40 M80 100 L80 160 M80 40 L200 40 M80 100 L200 100 M80 160 L200 160" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
    <circle cx="80"  cy="40"  r="7" fill="none" stroke="white" stroke-width="1.5"/>
    <circle cx="80"  cy="100" r="7" fill="none" stroke="white" stroke-width="1.5"/>
    <circle cx="80"  cy="160" r="7" fill="none" stroke="white" stroke-width="1.5"/>
    <circle cx="200" cy="40"  r="7" fill="none" stroke="white" stroke-width="1.5"/>
    <circle cx="200" cy="100" r="7" fill="none" stroke="white" stroke-width="1.5"/>
    <circle cx="200" cy="160" r="7" fill="none" stroke="white" stroke-width="1.5"/>
  </svg>

  <div style="text-align:center;max-width:840px">
    <div class="eyebrow">System Integration &amp; Architecture · Module 23</div>
    <h1 style="font-size:clamp(28px,4.8vw,52px);font-weight:800;line-height:1.1;margin-bottom:14px">
      Web Frameworks<br><span style="color:var(--a1)">Engines of Modern Web Development</span>
    </h1>
    <p style="font-size:19px;color:var(--muted);margin-bottom:26px">"Stop building with raw lumber — start building with pre-fabricated kits."</p>
    <!-- tech logo row -->
    <div style="display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-bottom:20px">
      <!-- Django -->
      <div class="badge bv">
        <svg width="22" height="22" viewBox="0 0 22 22" fill="none" role="img" aria-label="Django"><rect x="1" y="1" width="20" height="20" rx="4" fill="rgba(9,121,105,.3)" stroke="#0d9488" stroke-width="1.5"/><text x="11" y="15" text-anchor="middle" font-size="8" fill="#34d399" font-family="monospace" font-weight="700">DJ</text></svg>
        Django
      </div>
      <!-- Rails -->
      <div class="badge bp">
        <svg width="22" height="22" viewBox="0 0 22 22" fill="none" role="img" aria-label="Ruby on Rails"><circle cx="11" cy="11" r="10" fill="rgba(220,38,38,.2)" stroke="#f87171" stroke-width="1.5"/><text x="11" y="15" text-anchor="middle" font-size="8" fill="#f87171" font-family="monospace" font-weight="700">RR</text></svg>
        Rails
      </div>
      <!-- React -->
      <div class="badge bb">
        <svg width="22" height="22" viewBox="0 0 22 22" fill="none" role="img" aria-label="React"><circle cx="11" cy="11" r="3.5" stroke="#38bdf8" stroke-width="1.5"/><ellipse cx="11" cy="11" rx="10" ry="4" stroke="#38bdf8" stroke-width="1.2"/><ellipse cx="11" cy="11" rx="10" ry="4" stroke="#38bdf8" stroke-width="1.2" transform="rotate(60 11 11)"/><ellipse cx="11" cy="11" rx="10" ry="4" stroke="#38bdf8" stroke-width="1.2" transform="rotate(120 11 11)"/></svg>
        ReactJS
      </div>
      <!-- Laravel -->
      <div class="badge bo">
        <svg width="22" height="22" viewBox="0 0 22 22" fill="none" role="img" aria-label="Laravel"><path d="M11 2L20 7V15L11 20L2 15V7L11 2Z" stroke="#fb923c" stroke-width="1.5" fill="rgba(251,146,60,.15)"/><text x="11" y="15" text-anchor="middle" font-size="8" fill="#fb923c" font-family="monospace" font-weight="700">L</text></svg>
        Laravel
      </div>
      <!-- Vue -->
      <div class="badge bg">
        <svg width="22" height="22" viewBox="0 0 22 22" fill="none" role="img" aria-label="Vue.js"><path d="M11 18L2 4h5l4 7 4-7h5L11 18Z" stroke="#34d399" stroke-width="1.5" fill="rgba(52,211,153,.15)"/></svg>
        Vue.js
      </div>
    </div>
    <div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center">
      <span class="badge bv">🏗️ MVC Architecture</span>
      <span class="badge bb">🌐 Client vs Server</span>
      <span class="badge bg">⚙️ 7 Core Features</span>
      <span class="badge bp">📦 Convention Over Config</span>
    </div>
  </div>
</div>`,

/* ══ 2 LESSON PREVIEW ═════════════════════════════════════════════ */
`<div class="slide" data-index="1">
  <div class="eyebrow">Lesson Preview</div>
  <div class="slide-title">From <span>Managing Data</span> to Building Apps</div>
  <div class="g2 w100" style="max-width:900px;align-items:start">
    <div class="card">
      <h3>📡 Coming From M22…</h3>
      <p style="color:var(--muted)">3rd Periodical Quiz — MySQL, SQL queries, NoSQL. We mastered how to <strong>store and retrieve data</strong>.</p>
      <p class="mt2">Now: how do we build the <strong>web applications that present that data</strong> to the world?</p>
      <div class="inset mt3">
        <p style="font-size:16px">💡 Think of a web framework as a powerful, <strong>pre-built toolkit</strong> — no more writing the same code over and over for every new site.</p>
      </div>
    </div>
    <div class="card">
      <h3>🎯 Learning Objectives</h3>
      <ul>
        <li>Explain the core concept of a <strong>Web Framework</strong></li>
        <li>Differentiate <strong>MVC, Three-tier, and Push/Pull</strong> architectures</li>
        <li>Categorize <strong>client-side vs server-side</strong> frameworks</li>
        <li>Describe the <strong>7 core features</strong> of modern frameworks</li>
        <li>Identify <strong>Django</strong> and <strong>Ruby on Rails</strong> characteristics</li>
      </ul>
    </div>
  </div>
</div>`,

/* ══ 3 WHAT IS A WEB FRAMEWORK ════════════════════════════════════ */
`<div class="slide" data-index="2">
  <div class="eyebrow">Core Concept</div>
  <div class="slide-title">What is a <span>Web Framework</span>?</div>
  <div class="g2w w100" style="max-width:940px;align-items:start">
    <div class="card">
      <h3>Web Application Framework (WAF)</h3>
      <p>A <strong>software framework</strong> designed to support the development of web applications, web services, and web APIs.</p>
      <p class="mt2">Their primary goal: <strong>automate the overhead</strong> associated with common web activities so developers focus on their unique application logic.</p>
      <div class="inset mt3">
        <h4>Frameworks typically provide:</h4>
        <ul style="margin-top:8px">
          <li style="font-size:16px">📚 Libraries for <strong>database access</strong></li>
          <li style="font-size:16px">🖼️ <strong>Templating engines</strong> for generating HTML</li>
          <li style="font-size:16px">🔐 <strong>Session management</strong> tools</li>
          <li style="font-size:16px">♻️ <strong>Code reuse</strong> structures</li>
          <li style="font-size:16px">🔗 URL <strong>routing</strong> utilities</li>
        </ul>
      </div>
    </div>
    <div class="fcol" style="gap:16px">
      <div class="card" style="border-top:3px solid var(--a1)">
        <h3 style="font-size:17px">Without a Framework</h3>
        <p style="font-size:16px;color:var(--muted)">Every feature — login forms, database queries, URL patterns — must be hand-coded from scratch <em>for every project</em>.</p>
      </div>
      <div class="card" style="border-top:3px solid var(--a3)">
        <h3 style="font-size:17px;color:var(--a3)">With a Framework</h3>
        <p style="font-size:16px;color:var(--muted)">Common patterns are already built. Focus only on the <strong>business logic unique to your app</strong>. Deploy faster, with fewer bugs.</p>
      </div>
      <div class="inset" style="border-left:3px solid var(--a4)">
        <p style="font-size:15px">⚠️ Frameworks enforce <strong>Inversion of Control</strong> — instead of you calling the library, the <em>framework</em> calls your code when an event (like an HTTP request) happens.</p>
      </div>
    </div>
  </div>
</div>`,

/* ══ 4 BRIEF HISTORY ══════════════════════════════════════════════ */
`<div class="slide" data-index="3">
  <div class="eyebrow">Historical Context</div>
  <div class="slide-title">A Brief <span>History</span></div>
  <div style="max-width:880px;width:100%">
    <!-- timeline -->
    <div style="display:flex;flex-direction:column;gap:0">
      ${[
        ['a2','Early 1990s','Static HTML Era','The web consisted of hand-coded static HTML files. To change a page, the author manually edited the server file.'],
        ['a4','1993','Common Gateway Interface (CGI)','The CGI standard was introduced — the first way to interface external applications with web servers, creating dynamic pages based on user input. Problem: high overhead — each request started a separate server process.'],
        ['a3','1995','Integrated Languages','ColdFusion, PHP, and Active Server Pages (ASP) emerged. Libraries existed, but tools were fragmented.'],
        ['a5','Late 1990s','Full-Stack Frameworks','Mature frameworks gathered multiple libraries into a single cohesive software stack — the modern web framework was born.'],
      ].map(([col,year,title,desc],i,a)=>`
        <div style="display:grid;grid-template-columns:130px 1fr;gap:0 16px;align-items:stretch">
          <div style="display:flex;flex-direction:column;align-items:flex-end;padding-right:0">
            <div class="badge b${col}" style="font-size:15px;padding:6px 14px;white-space:nowrap">${year}</div>
            ${i<a.length-1?`<div style="flex:1;width:2px;background:linear-gradient(to bottom,var(--${col}),var(--a1));margin:6px 14px 0 auto;border-radius:2px;min-height:14px"></div>`:''}
          </div>
          <div class="card" style="margin-bottom:${i<a.length-1?'12px':'0'}">
            <h4 style="margin:0 0 4px;color:var(--${col})">${title}</h4>
            <p style="font-size:15px">${desc}</p>
          </div>
        </div>`).join('')}
    </div>
  </div>
</div>`,

/* ══ 5 MVC ARCHITECTURE ═══════════════════════════════════════════ */
`<div class="slide" data-index="4">
  <div class="eyebrow">Framework Architecture · 1 of 3</div>
  <div class="slide-title">Model–View–<span>Controller</span> (MVC)</div>
  <div style="max-width:940px;width:100%">
    <!-- MVC diagram -->
    <div style="display:flex;align-items:stretch;gap:0;justify-content:center;margin-bottom:20px">
      ${[
        ['a3','M','Model','Manages data &amp; business logic. Interacts directly with the database (MySQL, etc.).'],
        ['a2','V','View','Manages the user interface. What the user actually sees in their browser.'],
        ['a1','C','Controller','Handles user input. Processes requests via the Model and updates the View.'],
      ].map(([col,letter,name,desc],i,a)=>`
        <div class="card" style="flex:1;text-align:center;border-top:4px solid var(--${col})">
          <div style="font-size:42px;font-weight:900;color:var(--${col});margin-bottom:6px">${letter}</div>
          <h3 style="color:var(--${col});margin:0 0 8px;font-size:17px">${name}</h3>
          <p style="font-size:15px;color:var(--muted)">${desc}</p>
        </div>
        ${i<a.length-1?`<div style="display:flex;align-items:center;padding:0 8px"><svg width="30" height="30" viewBox="0 0 30 30" fill="none" aria-hidden="true"><path d="M5 15 L22 15 M16 9 L22 15 L16 21" stroke="var(--a1)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg></div>`:''}`).join('')}
    </div>
    <div class="g2 w100" style="gap:14px">
      <div class="inset" style="border-left:3px solid var(--a3)">
        <p style="font-size:16px">✅ <strong>Best Practice</strong> — MVC modularizes code, promotes <strong>code reuse</strong>, and lets multiple interfaces (desktop, mobile, JSON API) use the same core data logic.</p>
      </div>
      <div class="inset" style="border-left:3px solid var(--a4)">
        <p style="font-size:16px">⚠️ <strong>Don't confuse MVC with Three-tier.</strong> MVC is an <em>internal code pattern</em> within one tier; Three-tier is an <em>infrastructure deployment</em> across separate servers.</p>
      </div>
    </div>
  </div>
</div>`,

/* ══ 6 PUSH vs PULL + THREE-TIER ═════════════════════════════════ */
`<div class="slide" data-index="5">
  <div class="eyebrow">Framework Architecture · 2 of 3 &amp; 3 of 3</div>
  <div class="slide-title">Push/Pull &amp; <span>Three-Tier</span></div>
  <div class="g2 w100" style="max-width:920px;align-items:start">
    <div class="card">
      <h3>🔀 Push vs Pull Architecture</h3>
      <div class="inset mt2" style="border-left:3px solid var(--a4)">
        <h4 style="color:var(--a4)">Push-based (Action-based) — Most Common</h4>
        <p style="font-size:15px">Controllers perform business logic then <strong>push</strong> data to the View layer to render.</p>
        <p style="font-size:14px;color:var(--muted);margin-top:6px">Examples: <strong>Django, Ruby on Rails, Spring MVC, CodeIgniter</strong></p>

        <h4 style="color:var(--a2)">Pull-based (Component-based)</h4>
        <p style="font-size:15px">Starts with the View layer. The View <strong>pulls</strong> results from multiple controllers as needed.</p>
        <p style="font-size:14px;color:var(--muted);margin-top:6px">Examples: <strong>Lift, Tapestry, JSF, Wicket</strong></p>
      </div>
    </div>

          ['a3','🗄️','Database Tier','Server running the RDBMS (MySQL, PostgreSQL). Stores and retrieves all application data.'],

      </div>
    </div>
  </div>
</div>`,

/* ═══════════════════════════════════════════════════════════════
   ENGINE
═══════════════════════════════════════════════════════════════ */
const deck = document.getElementById('deck');
const total = slides.length;
let current = 0;

slides.forEach(html => {
  const w = document.createElement('div');
  w.innerHTML = html;
  deck.appendChild(w.firstElementChild);
});

const all = document.querySelectorAll('.slide');
const bar = document.getElementById('pb');
const ctr = document.getElementById('ctr');

function goTo(idx, dir = 1) {
  if (idx < 0 || idx >= total) return;
  const prev = all[current];
  prev.classList.remove('active');
  prev.classList.add(dir > 0 ? 'exit-l' : 'exit-r');
  setTimeout(() => prev.classList.remove('exit-l','exit-r'), 400);
  current = idx;
  const next = all[current];
  next.style.transform = dir > 0 ? 'translateX(60px)' : 'translateX(-60px)';
  next.classList.add('active');
  setTimeout(() => { next.style.transform = ''; }, 10);
  bar.style.width = ((current + 1) / total * 100) + '%';
  ctr.textContent = (current + 1) + ' / ' + total;
}

all[0].classList.add('active');
bar.style.width = (1 / total * 100) + '%';

document.addEventListener('keydown', e => {
  if (e.key==='ArrowRight'||e.key==='ArrowDown') goTo(current+1, 1);
  else if (e.key==='ArrowLeft'||e.key==='ArrowUp') goTo(current-1,-1);
  else if (e.key==='Home') goTo(0,-1);
  else if (e.key==='End')  goTo(total-1,1);
  else if (e.key==='?') toggleSh();
});
document.addEventListener('contextmenu', e => { e.preventDefault(); goTo(current+1,1); });
document.addEventListener('mousedown', e => {
  if (e.button===3){e.preventDefault();e.stopImmediatePropagation();goTo(current+1, 1);}
  if (e.button===4){e.preventDefault();e.stopImmediatePropagation();goTo(current-1,-1);}
}, true);
let tx=0;
document.addEventListener('touchstart',e=>{tx=e.touches[0].clientX;},{passive:true});
document.addEventListener('touchend',e=>{
  const dx=tx-e.changedTouches[0].clientX;
  if(Math.abs(dx)>40) dx>0?goTo(current+1,1):goTo(current-1,-1);
});

function copyCode(btn,id){
  const pre=document.getElementById(id);
  navigator.clipboard.writeText(pre?pre.innerText:'').then(()=>{
    btn.textContent='Copied!';btn.classList.add('ok');
    setTimeout(()=>{btn.textContent='Copy';btn.classList.remove('ok');},1800);
  });
}
function toggleSh(){document.getElementById('sh').classList.toggle('on');}
function closeSh()  {document.getElementById('sh').classList.remove('on');}
document.getElementById('sh').addEventListener('click',e=>{
  if(e.target===document.getElementById('sh'))closeSh();
});
</script>
</body>
</html>
