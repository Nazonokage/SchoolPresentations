<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Module 12 — Node.js Basics</title>
<style>
  :root{
    --bg:#0B1220;
    --surface:#111B2E;
    --surface2:#182644;
    --border: rgba(140,163,199,0.16);
    --border-strong: rgba(140,163,199,0.30);
    --text:#E9EEF6;
    --muted:#8CA0BF;
    --muted-dim:#5E7191;
    --accent:#6CC24A;
    --accent-soft: rgba(108,194,74,0.14);
    --accent-line: rgba(108,194,74,0.4);
    --accent2:#F5A623;
    --accent2-soft: rgba(245,166,35,0.14);
    --danger:#E76A6A;
    --code-bg:#0A101E;
    --radius: 16px;
    --font-display: 'Century Gothic','Avenir Next','Trebuchet MS','Segoe UI',sans-serif;
    --font-body: -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    --font-mono: 'JetBrains Mono','Fira Code',Consolas,'SFMono-Regular',Menlo,monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;background:var(--bg);color:var(--text);font-family:var(--font-body);}
  ::selection{background:var(--accent-soft);color:var(--text);}

  .deck{position:relative;width:100vw;height:100vh;overflow:hidden;background:
      radial-gradient(1200px 600px at 85% -10%, rgba(108,194,74,0.08), transparent 60%),
      radial-gradient(900px 500px at -10% 110%, rgba(245,166,35,0.06), transparent 60%),
      var(--bg);
  }

  .slide{
    position:absolute; inset:0;
    display:flex; flex-direction:column;
    padding: 56px 88px 70px;
    opacity:0; transform: translateX(48px);
    transition: opacity 350ms ease, transform 350ms ease;
    pointer-events:none; overflow-y:auto;
  }
  .slide.active{ opacity:1; transform:translateX(0); pointer-events:auto; z-index:2;}
  .slide.exit-left{ transform: translateX(-48px); }
  @media (prefers-reduced-motion: reduce){
    .slide{ transition:none; }
  }

  .eyebrow{
    display:inline-flex; align-items:center; gap:8px;
    font-family:var(--font-mono); font-size:12.5px; letter-spacing:0.06em; text-transform:uppercase;
    color:var(--accent); background:var(--accent-soft); border:1px solid var(--accent-line);
    padding:6px 12px; border-radius:999px; width:fit-content; margin-bottom:22px;
  }
  .eyebrow .dot{width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 8px var(--accent);}

  h1.title{ font-family:var(--font-display); font-weight:700; font-size:clamp(30px,3.6vw,46px); line-height:1.12; margin:0 0 18px; letter-spacing:-0.01em;}
  h2.subtitle{ font-family:var(--font-body); font-weight:400; font-size:17px; color:var(--muted); margin:0 0 28px; max-width:760px; line-height:1.55;}

  .content{ flex:1; min-height:0; display:flex; flex-direction:column; gap:18px;}

  p{ line-height:1.6; color:var(--text); font-size:15.5px; margin:0 0 10px;}
  p.muted{ color:var(--muted); }
  strong{ color:var(--text); font-weight:650; }
  code.inline{ font-family:var(--font-mono); font-size:0.88em; background:var(--surface2); border:1px solid var(--border); color:var(--accent); padding:1.5px 6px; border-radius:5px;}

  .grid-2{ display:grid; grid-template-columns:1fr 1fr; gap:22px; min-height:0;}
  .grid-3{ display:grid; grid-template-columns:repeat(3,1fr); gap:20px; min-height:0;}

  .card{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:22px 24px;}
  .card h3{ margin:0 0 8px; font-family:var(--font-display); font-size:17px; font-weight:700;}
  .card p{ font-size:14.5px; }

  .callout{ border-radius:var(--radius); padding:16px 20px; border:1px solid; display:flex; gap:12px; align-items:flex-start;}
  .callout.tip{ background:var(--accent-soft); border-color:var(--accent-line); }
  .callout.note{ background:var(--accent2-soft); border-color:rgba(245,166,35,0.4); }
  .callout .icon{ font-family:var(--font-mono); font-weight:700; font-size:13px; padding:3px 8px; border-radius:6px; flex-shrink:0; margin-top:1px;}
  .callout.tip .icon{ background:var(--accent); color:#04240a;}
  .callout.note .icon{ background:var(--accent2); color:#2a1900;}
  .callout p{ margin:0; font-size:14.5px; color:var(--text);}

  ol.steps, ul.list{ margin:0; padding-left:22px; }
  ol.steps li, ul.list li{ font-size:15px; line-height:1.6; margin-bottom:8px; color:var(--text);}
  ul.list{ list-style:none; padding-left:0;}
  ul.list li{ padding-left:26px; position:relative;}
  ul.list li::before{ content:"›"; position:absolute; left:0; color:var(--accent); font-weight:700;}

  /* code cards */
  .code-card{ background:var(--code-bg); border:1px solid var(--border); border-radius:var(--radius); display:flex; flex-direction:column; overflow:hidden; min-height:0;}
  .code-card .code-head{ flex-shrink:0; display:flex; align-items:center; justify-content:space-between; padding:10px 16px; background:var(--surface2); border-bottom:1px solid var(--border);}
  .code-head .fname{ font-family:var(--font-mono); font-size:12.5px; color:var(--muted); display:flex; align-items:center; gap:8px;}
  .code-head .fname .lang-pill{ background:var(--accent-soft); color:var(--accent); border-radius:5px; padding:2px 7px; font-size:10.5px; letter-spacing:0.04em; text-transform:uppercase;}
  .copy-btn{ font-family:var(--font-mono); font-size:11.5px; color:var(--muted); background:transparent; border:1px solid var(--border-strong); padding:5px 10px; border-radius:6px; cursor:pointer; transition:all .15s ease;}
  .copy-btn:hover{ color:var(--text); border-color:var(--accent-line); background:var(--accent-soft); }
  .copy-btn.copied{ color:var(--accent); border-color:var(--accent-line); background:var(--accent-soft);}
  .code-card pre{ margin:0; flex:1; overflow:auto; min-height:0; padding:16px 18px; }
  .code-card code{ font-family:var(--font-mono); font-size:13.2px; line-height:1.65; white-space:pre; color:#CBD6E6;}
  .tok-k{ color:#7FB9F0; } .tok-s{ color:var(--accent); } .tok-c{ color:var(--muted-dim); font-style:italic;} .tok-n{ color:var(--accent2); }

  .fixed-row{ display:grid; grid-template-columns:1fr 1fr; gap:22px; height:min(520px,58vh); min-height:0;}
  .fixed-row > *{ height:100%; min-height:0; }
  .panel{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); display:flex; flex-direction:column; overflow:hidden; min-height:0;}
  .panel .panel-head{ flex-shrink:0; padding:10px 16px; background:var(--surface2); border-bottom:1px solid var(--border); font-family:var(--font-mono); font-size:12px; color:var(--muted); letter-spacing:0.04em; text-transform:uppercase;}
  .panel .panel-body{ flex:1; overflow:auto; min-height:0; padding:16px 18px; display:flex; flex-direction:column; gap:12px;}
  .panel .panel-body p{ font-size:14px; }
  .term-line{ font-family:var(--font-mono); font-size:13px; color:var(--muted); }
  .term-line .prompt{ color:var(--accent); margin-right:6px;}
  .term-out{ font-family:var(--font-mono); font-size:13px; background:var(--code-bg); border:1px solid var(--border); border-radius:8px; padding:10px 12px; color:#CBD6E6;}

  /* diagram */
  .diagram{ display:flex; flex-direction:column; gap:10px; }
  .diag-step{ display:flex; align-items:center; gap:16px; background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:14px 18px;}
  .diag-num{ font-family:var(--font-mono); font-size:13px; color:var(--accent); background:var(--accent-soft); border:1px solid var(--accent-line); width:30px; height:30px; border-radius:8px; display:flex; align-items:center; justify-content:center; flex-shrink:0;}
  .diag-step h4{ margin:0 0 3px; font-size:14.5px; font-family:var(--font-display);}
  .diag-step p{ margin:0; font-size:13px; color:var(--muted);}
  .diag-arrow{ text-align:center; color:var(--muted-dim); font-size:15px; margin:-2px 0;}

  /* MCQ */
  .mcq-grid{ display:grid; grid-template-columns:1fr 1fr; gap:18px; }
  .mcq{ background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:18px 20px;}
  .mcq .qnum{ font-family:var(--font-mono); color:var(--accent); font-size:12px; margin-bottom:8px; display:flex; align-items:center; justify-content:space-between;}
  .pts{ font-family:var(--font-mono); font-size:10.5px; color:var(--accent2); background:var(--accent2-soft); border:1px solid rgba(245,166,35,0.4); padding:2px 8px; border-radius:999px; letter-spacing:0.03em;}
  .points-strip{ display:flex; gap:10px; margin-bottom:4px; flex-wrap:wrap; }
  .points-strip .chip{ font-family:var(--font-mono); font-size:11.5px; color:var(--muted); background:var(--surface); border:1px solid var(--border); padding:5px 12px; border-radius:999px;}
  .points-strip .chip b{ color:var(--accent);}
  .scenario-card{ background:var(--surface); border:1px solid var(--border); border-left:3px solid var(--accent2); border-radius:14px; padding:18px 22px;}
  .scenario-card h3{ margin:0 0 8px; font-family:var(--font-display); font-size:15.5px; display:flex; align-items:center; gap:10px;}
  .scenario-card p{ font-size:14.5px; margin:0;}
  .paper-note{ display:flex; align-items:center; gap:10px; font-family:var(--font-mono); font-size:12px; color:var(--muted); background:var(--surface2); border:1px dashed var(--border-strong); border-radius:10px; padding:10px 14px;}
  .mcq .qtext{ font-size:14.5px; margin:0 0 12px; font-weight:600; line-height:1.5;}
  .mcq .opts{ display:flex; flex-direction:column; gap:7px;}
  .mcq .opt{ font-size:13.5px; color:var(--muted); background:var(--surface2); border:1px solid var(--border); border-radius:8px; padding:8px 11px;}
  .mcq .opt b{ color:var(--text); margin-right:6px;}
  .mcq.center-last{ grid-column: 1 / -1; max-width:calc(50% - 9px); margin:0 auto;}

  /* answer key */
  .akey{ background:var(--surface); border:1px solid var(--border); border-left:3px solid var(--accent); border-radius:10px; padding:12px 16px; margin-bottom:10px;}
  .akey .q{ font-size:13.5px; color:var(--muted); margin:0 0 4px;}
  .akey .a{ font-size:14px; margin:0 0 4px;}
  .akey .a b{ color:var(--accent);}
  .akey .exp{ font-size:12.8px; color:var(--muted); margin:0; line-height:1.5;}

  /* title slide */
  .hero{ flex:1; display:flex; flex-direction:column; justify-content:center; gap:26px; max-width:900px;}
  .hero .badge-row{ display:flex; gap:10px; align-items:center; margin-top:6px;}
  .logo-chip{ display:flex; align-items:center; gap:8px; background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:8px 14px;}
  .logo-chip img{ width:22px; height:22px;}
  .logo-chip span{ font-family:var(--font-mono); font-size:12.5px; color:var(--muted);}
  .hero-visual{ position:absolute; right:70px; top:50%; transform:translateY(-50%); opacity:0.9;}

  .quote-card{ background:var(--surface); border:1px solid var(--border); border-left:3px solid var(--accent2); border-radius:12px; padding:20px 24px; margin-bottom:14px;}
  .quote-card p{ font-size:16px; font-style:italic; margin:0; color:var(--text); line-height:1.6;}
  .quote-card .src{ margin-top:10px; font-family:var(--font-mono); font-size:11.5px; color:var(--muted); font-style:normal;}

  .recap-list{ display:grid; grid-template-columns:1fr 1fr; gap:14px;}
  .recap-item{ display:flex; gap:12px; background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:14px 16px;}
  .recap-item .check{ color:var(--accent); font-family:var(--font-mono); flex-shrink:0;}

  .closing-wrap{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; gap:22px;}
  .closing-wrap .status{ font-family:var(--font-mono); font-size:12.5px; color:var(--accent); letter-spacing:0.08em;}

  /* progress + nav chrome */
  .progress-bar{ position:fixed; top:0; left:0; height:3px; background:var(--accent); box-shadow:0 0 10px var(--accent); z-index:50; transition:width 300ms ease;}
  .counter{ position:fixed; bottom:20px; right:28px; font-family:var(--font-mono); font-size:12px; color:var(--muted); background:rgba(11,18,32,0.7); border:1px solid var(--border); padding:6px 12px; border-radius:999px; z-index:50; backdrop-filter:blur(6px);}
  .hint{ position:fixed; bottom:20px; left:28px; font-family:var(--font-mono); font-size:11px; color:var(--muted-dim); z-index:50; display:flex; gap:14px;}
  .hint kbd{ border:1px solid var(--border-strong); border-radius:4px; padding:1px 6px; font-family:var(--font-mono); color:var(--muted); margin-right:4px;}

  .shortcuts-overlay{ position:fixed; inset:0; background:rgba(6,10,18,0.82); backdrop-filter:blur(4px); z-index:100; display:none; align-items:center; justify-content:center;}
  .shortcuts-overlay.show{ display:flex; }
  .shortcuts-box{ background:var(--surface); border:1px solid var(--border-strong); border-radius:16px; padding:32px 36px; width:380px;}
  .shortcuts-box h3{ margin:0 0 18px; font-family:var(--font-display);}
  .shortcuts-box .row{ display:flex; justify-content:space-between; align-items:center; padding:8px 0; border-bottom:1px solid var(--border); font-size:13.5px; color:var(--muted);}
  .shortcuts-box .row:last-child{ border-bottom:none;}

  @media (max-width: 900px){
    .slide{ padding:38px 24px 84px; }
    .grid-2, .fixed-row, .grid-3, .mcq-grid, .recap-list{ grid-template-columns:1fr; height:auto;}
    .fixed-row{ height:auto; }
    .fixed-row > *{ height:min(360px,50vh);}
    .hero-visual{ display:none; }
    .mcq.center-last{ max-width:100%; }
  }
</style>
</head>
<body>

<div class="deck" id="deck">
  <div class="progress-bar" id="progressBar" style="width:0%"></div>
  <div id="slideContainer"></div>
  <div class="counter" id="counter">1 / 1</div>
  <div class="hint"><span><kbd>&#8594;</kbd>next</span><span><kbd>&#8592;</kbd>prev</span><span><kbd>?</kbd>shortcuts</span></div>
</div>

<div class="shortcuts-overlay" id="shortcutsOverlay">
  <div class="shortcuts-box">
    <h3>Shortcuts</h3>
    <div class="row"><span>Next slide</span><span><kbd>&#8594;</kbd> / Right-click / Mouse4</span></div>
    <div class="row"><span>Previous slide</span><span><kbd>&#8592;</kbd> / Mouse3</span></div>
    <div class="row"><span>First slide</span><span><kbd>Home</kbd></span></div>
    <div class="row"><span>Last slide</span><span><kbd>End</kbd></span></div>
    <div class="row"><span>Toggle this menu</span><span><kbd>?</kbd></span></div>
    <div class="row"><span>Close menu</span><span><kbd>Esc</kbd></span></div>
  </div>
</div>

<script>
(function(){

  function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

  function hlJS(code){
    let s = esc(code);
    s = s.replace(/(\/\/[^\n]*)/g, '<span class="tok-c">$1</span>');
    s = s.replace(/('(?:[^'\\]|\\.)*'|"(?:[^"\\]|\\.)*")/g, function(m){
      if(/tok-c/.test(m)) return m;
      return '<span class="tok-s">'+m+'</span>';
    });
    s = s.replace(/\b(const|let|var|function|require|return)\b/g, '<span class="tok-k">$1</span>');
    s = s.replace(/\b(\d+)\b/g, '<span class="tok-n">$1</span>');
    return s;
  }
  function hlBash(code){
    let s = esc(code);
    s = s.replace(/(#[^\n]*)/g, '<span class="tok-c">$1</span>');
    s = s.replace(/\b(mkdir|cd|npm|node|curl|init|install)\b/g, '<span class="tok-k">$1</span>');
    s = s.replace(/(-{1,2}[a-zA-Z]+)/g, '<span class="tok-n">$1</span>');
    return s;
  }

  function codeCard(id, filename, lang, rawCode){
    const html = lang === 'bash' ? hlBash(rawCode) : hlJS(rawCode);
    return '<div class="code-card">'
      + '<div class="code-head"><div class="fname"><span class="lang-pill">'+lang+'</span>'+filename+'</div>'
      + '<button class="copy-btn" data-code-id="'+id+'">Copy</button></div>'
      + '<pre><code id="'+id+'">'+html+'</code></pre></div>';
  }

  // raw code snippets (kept in plain strings, single-line strings preserved)
  const CODE = {
    hello: "// app.js\nconst greeting = 'Hello, World!';\nconsole.log(greeting);",
    imports: "const http = require('http');\nconst fs = require('fs'); // The file system module, often used alongside http",
    createServer: "const server = http.createServer((req, res) => {\n  // Request handling logic goes here\n});",
    handleReq: "const server = http.createServer((req, res) => {\n  res.statusCode = 200; // OK\n  res.setHeader('Content-Type', 'text/plain'); // Tell the browser it's plain text\n  res.end('Hello, World!'); // Send the response and end the request\n});",
    listen: "server.listen(3000, () => {\n  console.log('Server is listening on port 3000');\n});",
    complete: "// Import the built-in http module\nconst http = require('http');\n\n// Create the server\nconst server = http.createServer((req, res) => {\n  // Set the HTTP status code and content type\n  res.statusCode = 200;\n  res.setHeader('Content-Type', 'text/plain');\n\n  // Send the response back to the client\n  res.end('Hello from my first Node.js server!');\n});\n\n// Bind the server to port 3000\nserver.listen(3000, () => {\n  console.log('Server running at http://localhost:3000/');\n});",
    run: "node server.js",
    mkdir: "mkdir my-web-server\ncd my-web-server",
    npminit: "npm init -y",
    npminstall: "npm install http",
    drillServer: "// 1. Import the built-in http module\nconst http = require('http');\n\n// 2. Create the server\nconst server = http.createServer((req, res) => {\n  // Set status code to 200 (Success)\n  res.statusCode = 200;\n\n  // Set the response header so the client knows it's plain text\n  res.setHeader('Content-Type', 'text/plain');\n\n  // Send the custom message and signal the end of the response\n  res.end('This is a custom message from the server!');\n});\n\n// 3. Start the server and listen on port 3000\nserver.listen(3000, () => {\n  console.log('Server is running and listening on port 3000');\n});",
    curl: "curl http://localhost:3000",
    cafeStarter: "// your-server.js\nconst http = require('http');\n\nconst server = http.createServer((req, res) => {\n  res.statusCode = 200;\n  res.setHeader('Content-Type', 'text/plain');\n\n  // TODO: write your own confirmation message\n  res.end('___________________________');\n});\n\n// TODO: pick a port and log a startup message\nserver.listen(____, () => {\n  console.log('___________________________');\n});",
    cafeSample: "// cafe-server.js — one possible take\nconst http = require('http');\n\nconst server = http.createServer((req, res) => {\n  res.statusCode = 200;\n  res.setHeader('Content-Type', 'text/plain');\n  res.end('Order received! Your coffee will be ready in 5 minutes.');\n});\n\nserver.listen(4000, () => {\n  console.log('Cafe order server listening on port 4000');\n});"
  };

  const NODE_LOGO = 'https://cdn.simpleicons.org/nodedotjs/6CC24A';
  const JS_LOGO = 'https://cdn.simpleicons.org/javascript/F5A623';
  const NPM_LOGO = 'https://cdn.simpleicons.org/npm/E9EEF6';

  const slides = [];

  // 1. Title
  slides.push({ eyebrow: 'MODULE 12 &middot; BACKEND FOUNDATIONS', body: `
    <div class="hero">
      <h1 class="title" style="font-size:clamp(34px,4.6vw,58px);">Node.js Basics<br>Structure, Syntax &amp; Your First Server</h1>
      <h2 class="subtitle">You've learned how Node.js thinks &mdash; event-driven, non-blocking, single-threaded. Now it's time to write real code and stand up a working web server from scratch.</h2>
      <div class="badge-row">
        <div class="logo-chip"><img src="${NODE_LOGO}" alt="Node.js logo" role="img"><span>Node.js runtime</span></div>
        <div class="logo-chip"><img src="${JS_LOGO}" alt="JavaScript logo" role="img"><span>JavaScript</span></div>
        <div class="logo-chip"><img src="${NPM_LOGO}" alt="npm logo" role="img"><span>npm</span></div>
      </div>
    </div>
  `});

  // 2. Lesson Preview & Review
  slides.push({ eyebrow: 'A &middot; LESSON PREVIEW &amp; REVIEW', body: `
    <h1 class="title">Where we left off, where we're headed</h1>
    <div class="content">
      <div class="grid-2" style="flex:1;">
        <div class="card">
          <h3>What we've covered so far</h3>
          <p>Node.js relies on an <strong>event-driven, non-blocking I/O model</strong>. Rather than blocking a thread while a file read or database query finishes, Node.js uses a single-threaded <strong>event loop</strong>.</p>
          <p class="muted">Slow operations are delegated to the system kernel, and the loop immediately moves on to the next task.</p>
        </div>
        <div class="card">
          <h3>What's coming up</h3>
          <ol class="steps">
            <li>Creating a new JavaScript file with the <code class="inline">.js</code> extension</li>
            <li>Exploring the basic structure of a Node.js application &mdash; importing modules and creating servers</li>
            <li>Writing and running a simple HTTP server that responds with a custom message</li>
          </ol>
        </div>
      </div>
      <div class="callout tip">
        <span class="icon">TIP</span>
        <p>By the end of this lesson, you will have built a fully functioning web server on your own computer.</p>
      </div>
    </div>
  `});

  // 3. Core Concept
  slides.push({ eyebrow: 'B &middot; MAIN LESSON', body: `
    <h1 class="title">Core concept: the modular approach</h1>
    <div class="content" style="justify-content:center;">
      <p style="font-size:17px;max-width:760px;">Node.js promotes a <strong>modular approach</strong> to development. Instead of writing every piece of functionality from scratch, you lean on a vast ecosystem of built-in modules and third-party packages distributed through the npm registry.</p>

  function last(){ render(slides.length - 1, 1); }

  // keyboard
  const overlay = document.getElementById('shortcutsOverlay');
  document.addEventListener('keydown', (e) => {
    if(e.key === '?'){ overlay.classList.toggle('show'); return; }
    if(e.key === 'Escape'){ overlay.classList.remove('show'); return; }
    if(overlay.classList.contains('show')) return;
    if(e.key === 'ArrowRight' || e.key === 'PageDown'){ next(); }
    else if(e.key === 'ArrowLeft' || e.key === 'PageUp'){ prev(); }
    else if(e.key === 'Home'){ first(); }
    else if(e.key === 'End'){ last(); }
  });

  // right-click / mouse buttons for navigation
  document.addEventListener('contextmenu', (e) => { e.preventDefault(); if(!overlay.classList.contains('show')) next(); });
  document.addEventListener('mousedown', (e) => {
    if(e.button === 3 || e.button === 4){
      e.preventDefault(); e.stopImmediatePropagation();
      if(!overlay.classList.contains('show')){ e.button === 3 ? prev() : next(); }
    }
  }, true);
  document.addEventListener('mouseup', (e) => {
    if(e.button === 3 || e.button === 4){ e.preventDefault(); e.stopImmediatePropagation(); }
  }, true);

  // swipe
  let touchStartX = null;
  document.addEventListener('touchstart', (e) => { touchStartX = e.changedTouches[0].clientX; }, {passive:true});
  document.addEventListener('touchend', (e) => {
    if(touchStartX === null) return;
    const dx = e.changedTouches[0].clientX - touchStartX;
    if(Math.abs(dx) > 50){ dx < 0 ? next() : prev(); }
    touchStartX = null;
  }, {passive:true});

  // copy buttons (delegated)
  document.addEventListener('click', (e) => {
    const btn = e.target.closest('.copy-btn');
    if(!btn) return;
    const codeEl = document.getElementById(btn.getAttribute('data-code-id'));
    if(!codeEl) return;
    const text = codeEl.textContent;
    navigator.clipboard.writeText(text).then(() => {
      const original = btn.textContent;
      btn.textContent = 'Copied!';
      btn.classList.add('copied');
      setTimeout(() => { btn.textContent = original; btn.classList.remove('copied'); }, 1400);
    });
  });

  // close shortcuts overlay on outside click
  overlay.addEventListener('click', (e) => { if(e.target === overlay) overlay.classList.remove('show'); });

})();
</script>
</body>
</html>
