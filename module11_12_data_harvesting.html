<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Module 11–12 — Data Harvesting & Interaction Platforms</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#06080f;--surf:#0d1220;--card:#121b2e;--card2:#18233a;--bord:#1c2b42;--bord2:#243350;
  --a1:#38bdf8;--a2:#818cf8;--a3:#34d399;--gold:#fbbf24;--rose:#fb7185;--violet:#c084fc;
  --txt:#e8f0ff;--mute:#6b83aa;--dim:#374f6e;
  --r:13px;--ff:'Segoe UI',system-ui,-apple-system,sans-serif;--mono:'Cascadia Code','Fira Code',Consolas,monospace;
}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--txt);font-family:var(--ff)}
#prog{position:fixed;top:0;left:0;height:3px;background:linear-gradient(90deg,var(--a1),var(--a2),var(--a3));z-index:900;transition:width .3s ease;box-shadow:0 0 10px var(--a1)}
#ctr{position:fixed;bottom:18px;right:22px;font-size:13px;color:var(--mute);z-index:900;letter-spacing:.05em;font-weight:600}
#hint{position:fixed;bottom:18px;left:22px;font-size:13px;color:var(--dim);z-index:900}
#deck{width:100%;height:100%;position:relative;overflow:hidden}
.slide{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:44px 64px;opacity:0;pointer-events:none;transition:opacity .35s ease,transform .35s ease;transform:translateX(54px);overflow-y:auto}
.slide.active{opacity:1;pointer-events:all;transform:translateX(0)}
.slide.out{opacity:0;transform:translateX(-54px)}
@media(prefers-reduced-motion:reduce){.slide{transition:opacity .15s;transform:none!important}}
.W{width:100%;max-width:1420px}
.eye{font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--a1);margin-bottom:9px}
.T{font-size:clamp(28px,3.8vw,52px);font-weight:900;line-height:1.08;margin-bottom:7px}
.sub{font-size:clamp(15px,1.2vw,18px);color:var(--mute);margin-bottom:24px;line-height:1.55}
.hr{width:46px;height:3px;background:linear-gradient(90deg,var(--a1),var(--a2));border-radius:2px;margin-bottom:22px}
.card{background:var(--card);border:1px solid var(--bord);border-radius:var(--r);padding:18px 22px}
.card2{background:var(--card2);border:1px solid var(--bord2);border-radius:var(--r);padding:16px 20px}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.g4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.badge{display:inline-flex;align-items:center;font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;padding:3px 10px;border-radius:20px;margin-bottom:6px}
.bA{background:#0a2033;color:var(--a1)} .bB{background:#16194a;color:#a5b4fc}
.bC{background:#082a1e;color:var(--a3)} .bD{background:#2a1f08;color:var(--gold)}
.bE{background:#2a0c18;color:var(--rose)} .bF{background:#1e0a2a;color:var(--violet)}
.qt{background:var(--card);border-left:4px solid var(--a1);border-radius:0 var(--r) var(--r) 0;padding:18px 26px;font-style:italic;font-size:clamp(15px,1.2vw,18px);line-height:1.7}
.qt cite{display:block;font-size:15px;font-style:normal;color:var(--mute);margin-top:9px;font-weight:600}
/* steps */
.step{display:flex;gap:14px;padding:10px 0;border-bottom:1px solid var(--bord);align-items:flex-start}
.step:last-child{border-bottom:none}
.snum{min-width:30px;height:30px;background:linear-gradient(135deg,var(--a1),var(--a2));border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;color:#fff;flex-shrink:0;margin-top:1px}
.stxt h4{font-size:15px;font-weight:700;margin-bottom:3px;color:var(--a1)}
.stxt p{font-size:15px;color:var(--mute);line-height:1.5}
/* feature bullet */
.fb{display:flex;gap:12px;padding:9px 0;border-bottom:1px solid var(--bord);align-items:flex-start}
.fb:last-child{border-bottom:none}
.ficon{min-width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;background:var(--card2)}
.ftxt h4{font-size:15px;font-weight:700;margin-bottom:2px}
.ftxt p{font-size:15px;color:var(--mute);line-height:1.5}
/* code */
.cw{background:#060a10;border:1px solid #182030;border-radius:var(--r);overflow:hidden}
.ch{display:flex;align-items:center;justify-content:space-between;padding:9px 15px;background:#0b1220;border-bottom:1px solid #182030}
.cl{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--dim)}
.cpbtn{font-size:12px;padding:4px 12px;border-radius:6px;border:1px solid var(--bord2);background:var(--card2);color:var(--mute);cursor:pointer;font-family:var(--ff);transition:all .15s}
.cpbtn:hover{background:var(--bord);color:var(--txt)}
.cpbtn.ok{background:#082a1e;color:#34d399;border-color:#34d399}
pre{padding:17px 20px;overflow:auto;font-family:var(--mono);font-size:13px;line-height:1.7;color:#c8d8f0}
pre.scroll{max-height:320px}
.kw{color:#f472b6}.at{color:#7dd3fc}.st{color:#86efac}.tg{color:#60a5fa}.cm{color:#374f6e;font-style:italic}.fn{color:#c084fc}.nm{color:#fda4af}
/* breakdown item */
.bd{display:flex;gap:12px;padding:8px 0;border-bottom:1px solid var(--bord);align-items:flex-start}
.bd:last-child{border-bottom:none}
.bdn{min-width:24px;font-size:13px;font-weight:800;color:var(--a1)}
.bdt{font-size:14px;color:var(--mute);line-height:1.5}
.bdt code{background:var(--bord);padding:1px 5px;border-radius:4px;font-family:var(--mono);font-size:12px;color:var(--a3)}
/* MCQ */
.qcard{background:var(--card);border:1px solid var(--bord);border-radius:var(--r);padding:15px 18px}
.qnum{font-size:11px;font-weight:700;color:var(--a1);letter-spacing:.08em;text-transform:uppercase;margin-bottom:4px}
.qtext{font-size:15px;font-weight:600;line-height:1.4;margin-bottom:10px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.opt{background:var(--bg);border:1px solid var(--bord);border-radius:7px;padding:7px 12px;font-size:15px;color:var(--mute);line-height:1.4}
.opt span{color:var(--a1);font-weight:700;margin-right:4px}
/* ID */
.idq{background:var(--card);border:1px solid var(--bord);border-radius:var(--r);padding:13px 17px;display:flex;gap:12px;align-items:flex-start}
.idnum{min-width:27px;height:27px;background:var(--a1);color:#06080f;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;flex-shrink:0;margin-top:2px}
.idtxt{font-size:15px;line-height:1.55}
.blank{display:inline-block;width:120px;border-bottom:1.5px solid var(--a1);margin:0 5px;vertical-align:bottom}
/* answers */
.arow{display:flex;align-items:flex-start;gap:11px;padding:8px 0;border-bottom:1px solid var(--bord)}
.arow:last-child{border-bottom:none}
.anum{min-width:32px;font-size:12px;font-weight:700;color:var(--a1)}
.aans{font-size:15px;font-weight:700;color:#34d399;min-width:180px;flex-shrink:0}
.aexp{font-size:14px;color:var(--mute);line-height:1.45}
/* recap */
.ri{display:flex;gap:11px;padding:8px 0;align-items:flex-start}
.ric{min-width:28px;height:28px;background:var(--a2);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0}
.rit{font-size:15px;line-height:1.55}
/* modal */
#modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:9999;align-items:center;justify-content:center}
#modal.show{display:flex}
.mbox{background:var(--surf);border:1px solid var(--bord2);border-radius:16px;padding:30px 38px;min-width:340px}
.mbox h3{font-size:18px;font-weight:800;margin-bottom:18px}
.mrow{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--bord);font-size:14px}
.mrow:last-child{border-bottom:none}
.mrow span:first-child{color:var(--mute)}
kbd{background:var(--card);border:1px solid var(--bord2);border-radius:5px;padding:2px 7px;font-size:11px;font-family:var(--mono)}
.mclose{display:block;text-align:center;margin-top:18px;font-size:13px;color:var(--mute);cursor:pointer}
.mclose:hover{color:var(--txt)}
.grad{background:linear-gradient(135deg,#e0f0ff,#7dd3fc 40%,#818cf8);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
</style>
</head>
<body>
<div id="prog"></div>
<div id="ctr"></div>
<div id="hint">→ next · ← prev · ? help</div>
<div id="deck"></div>
<div id="modal">
  <div class="mbox">
    <h3>⌨ Shortcuts</h3>
    <div class="mrow"><span>Next</span><span><kbd>→</kbd> / right-click</span></div>
    <div class="mrow"><span>Prev</span><span><kbd>←</kbd></span></div>
    <div class="mrow"><span>First / Last</span><span><kbd>Home</kbd> / <kbd>End</kbd></span></div>
    <div class="mrow"><span>This menu</span><span><kbd>?</kbd></span></div>
    <span class="mclose" id="mclose">✕ Close</span>
  </div>
</div>

<script>
const S = [

// ── 0 TITLE ──────────────────────────────────────────────────────────────────
`<div class="W" style="text-align:center;display:flex;flex-direction:column;align-items:center">
  <div class="eye" style="margin-bottom:14px">Platform Technologies · Module 11–12</div>
  <div class="T grad" style="font-size:clamp(36px,5.5vw,68px);margin-bottom:14px">Data Harvesting &amp;<br>Interaction Platforms</div>
  <div style="font-size:clamp(15px,1.3vw,19px);color:var(--mute);max-width:640px;line-height:1.65;margin-bottom:32px">
    How platforms gather, process, and interact with data — plus building live widgets with HTML, CSS &amp; JavaScript.
  </div>
  <div style="display:flex;gap:16px;flex-wrap:wrap;justify-content:center;margin-bottom:34px">
    <div class="card" style="min-width:148px;text-align:left"><div style="font-size:11px;color:var(--mute);font-weight:700;letter-spacing:.07em;text-transform:uppercase;margin-bottom:5px">Topics</div><div style="font-size:15px">Data Harvesting + Interactive Platforms</div></div>
    <div class="card" style="min-width:148px;text-align:left"><div style="font-size:11px;color:var(--mute);font-weight:700;letter-spacing:.07em;text-transform:uppercase;margin-bottom:5px">Activities</div><div style="font-size:15px">Google Maps embed + Chat app</div></div>
    <div class="card" style="min-width:148px;text-align:left"><div style="font-size:11px;color:var(--mute);font-weight:700;letter-spacing:.07em;text-transform:uppercase;margin-bottom:5px">Languages</div><div style="font-size:15px">HTML · CSS · JavaScript</div></div>
  </div>
  <div style="font-size:13px;color:var(--dim)">Right-click or → to advance · Press ? for shortcuts</div>
</div>`,

// ── 1 LEARNING TARGETS ───────────────────────────────────────────────────────
`<div class="W">
  <div class="eye">Lesson Preview</div>
  <div class="T">Learning Targets</div>
  <div class="hr"></div>
  <div class="g2" style="gap:18px">
    <div class="card" style="border-top:3px solid var(--a1);padding:22px">
      <div style="font-size:34px;font-weight:900;color:var(--a1);line-height:1;margin-bottom:11px">01</div>
      <div style="font-size:16px;font-weight:700;margin-bottom:7px">Know Data Harvesting</div>
      <div style="font-size:15px;color:var(--mute);line-height:1.6">Understand what data harvesting is, its benefits, and the 5-step process from source identification to storage.</div>
    </div>
    <div class="card" style="border-top:3px solid var(--a2);padding:22px">
      <div style="font-size:34px;font-weight:900;color:var(--a2);line-height:1;margin-bottom:11px">02</div>
      <div style="font-size:16px;font-weight:700;margin-bottom:7px">Interaction Platforms</div>
      <div style="font-size:15px;color:var(--mute);line-height:1.6">Define interactive platforms, list their 7 types, and identify their 6 key characteristics.</div>
    </div>
    <div class="card" style="border-top:3px solid var(--a3);padding:22px">
      <div style="font-size:34px;font-weight:900;color:var(--a3);line-height:1;margin-bottom:11px">03</div>
      <div style="font-size:16px;font-weight:700;margin-bottom:7px">Embed Google Maps</div>
      <div style="font-size:15px;color:var(--mute);line-height:1.6">Use an HTML iframe to embed a live Google Maps widget into a web page.</div>
    </div>
    <div class="card" style="border-top:3px solid var(--gold);padding:22px">
      <div style="font-size:34px;font-weight:900;color:var(--gold);line-height:1;margin-bottom:11px">04</div>
      <div style="font-size:16px;font-weight:700;margin-bottom:7px">Build a Chat App</div>
      <div style="font-size:15px;color:var(--mute);line-height:1.6">Create a functional blog chat interface using HTML structure, CSS styling, and JavaScript logic.</div>
    </div>
  </div>
</div>`,

// ── 2 WHAT IS DATA HARVESTING ────────────────────────────────────────────────
`<div class="W">
  <div class="eye">Main Lesson · Data Harvesting</div>
  <div class="T">What is Data Harvesting?</div>
  <div class="hr"></div>
  <div class="g2" style="gap:18px;align-items:start">
    <div>
      <div class="card" style="border-left:4px solid var(--a1);margin-bottom:14px">
        <div style="font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--a1);margin-bottom:8px">Definition</div>
        <div style="font-size:15px;line-height:1.7">Data harvesting is a process that <strong style="color:var(--a1)">copies datasets and their metadata</strong> between two or more data catalogs — a critical step in making data useful. It is also known as <strong style="color:var(--txt)">web scraping</strong> or <strong style="color:var(--txt)">data scraping</strong>.</div>
      </div>
      <div class="card" style="border-left:4px solid var(--a3)">
        <div style="font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--a3);margin-bottom:8px">Analogy</div>
        <div style="font-size:15px;color:var(--mute);line-height:1.65">Similar to how <strong style="color:var(--txt)">search engines</strong> use websites to look for, catalog, and index content from different websites — making it searchable in a single location. APIs act as the communication lines between different databases.</div>
      </div>
    </div>
    <div class="card">
      <div style="font-size:12px;font-weight:700;color:var(--gold);letter-spacing:.08em;text-transform:uppercase;margin-bottom:13px">Benefits of Data Harvesting</div>
      <div class="fb">
        <div class="ficon">🏪</div>
        <div class="ftxt">
          <h4>One-Stop Shop</h4>
          <p>Users can search one DDH (Data Driven Hub) and find information across several different catalogs — without searching each one separately or even knowing they exist.</p>
        </div>
      </div>
      <div class="fb">
        <div class="ficon">📡</div>
        <div class="ftxt">
          <h4>Broader Exposure</h4>
          <p>The DDH harvests metadata and exposes it to a larger audience, so data added to other catalogs will be seen by far more users than it would otherwise reach.</p>
        </div>
      </div>
    </div>
  </div>
</div>`,

// ── 3 5-STEP PROCESS ─────────────────────────────────────────────────────────
`<div class="W">
  <div class="eye">Main Lesson · Data Harvesting Process</div>
  <div class="T">The 5-Step Data Harvesting Process</div>
  <div class="hr"></div>
  <div class="g2" style="gap:18px;align-items:start">
    <div class="card">
      <div class="step">
        <div class="snum">1</div>
        <div class="stxt"><h4>Data Source Identification</h4><p>Determine the target websites or data sources from which you want to extract data.</p></div>
      </div>
      <div class="step">
        <div class="snum">2</div>
        <div class="stxt"><h4>Data Extraction</h4><p>Use automated scripts or tools to fetch and download data — via HTTP requests, APIs, or specialized scraping libraries.</p></div>
      </div>
      <div class="step">
        <div class="snum">3</div>
        <div class="stxt"><h4>Data Parsing</h4><p>Raw data in HTML, XML, or JSON is parsed to extract relevant information and converted into structured formats like CSV, Excel, or a database.</p></div>
      </div>
    </div>
    <div>
      <div class="card" style="margin-bottom:14px">
        <div class="step">
          <div class="snum">4</div>
          <div class="stxt"><h4>Data Cleaning</h4><p>Cleanse the extracted data by removing irrelevant or duplicate information, and fixing errors or inconsistencies.</p></div>
        </div>
        <div class="step">
          <div class="snum">5</div>
          <div class="stxt"><h4>Data Storage</h4><p>Save the processed data in a database or file for further analysis or use.</p></div>
        </div>
      </div>
      <div class="card" style="padding:14px 18px;text-align:center">
        <div style="font-size:15px;color:var(--mute)">⚙ This pipeline transforms raw, scattered web data into clean, actionable, structured information.</div>
      </div>
    </div>
  </div>
</div>`,

// ── 4 INTERACTIVE PLATFORMS ───────────────────────────────────────────────────
`<div class="W">
  <div class="eye">Main Lesson · Interactive Platforms</div>
  <div class="T">What is an Interactive Platform?</div>
  <div class="hr"></div>
  <div class="g2" style="gap:18px;align-items:start">
    <div>
      <div class="card" style="border-left:4px solid var(--a2);margin-bottom:14px">
        <div style="font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--a2);margin-bottom:8px">Definition</div>
        <div style="font-size:15px;line-height:1.7">A <strong style="color:var(--a2)">web-based platform</strong> that provides users with a dynamic and engaging experience. Unlike static websites that only display information, interactive platforms allow users to <strong style="color:var(--txt)">actively participate, contribute, and interact</strong> with the content, features, and other users.</div>
      </div>
      <div class="card">
        <div style="font-size:12px;font-weight:700;color:var(--mute);letter-spacing:.07em;text-transform:uppercase;margin-bottom:10px">Tech Stack Required</div>
        <div style="display:flex;flex-wrap:wrap;gap:7px">
          <span class="badge bA">HTML</span>
          <span class="badge bB">CSS</span>
          <span class="badge bC">JavaScript</span>
          <span class="badge bD">React / Angular / Vue</span>
          <span class="badge bE">Server-side Languages</span>
        </div>
        <div style="font-size:14px;color:var(--mute);margin-top:10px;line-height:1.55">Modern frameworks like React, Angular, and Vue.js enhance interactivity and user experience of these platforms.</div>
      </div>
    </div>
    <div class="card">
      <div style="font-size:12px;font-weight:700;color:var(--gold);letter-spacing:.08em;text-transform:uppercase;margin-bottom:12px">7 Types of Interactive Platforms</div>
      <div style="display:flex;flex-direction:column;gap:7px">
        <div style="display:flex;gap:10px;padding:7px 0;border-bottom:1px solid var(--bord)"><span style="color:var(--a1);font-weight:700;min-width:20px">1.</span><div><strong style="font-size:15px">Social Media Platforms</strong><br><span style="font-size:14px;color:var(--mute)">Facebook, Twitter, Instagram, LinkedIn — share posts, comments, likes, discussions.</span></div></div>
        <div style="display:flex;gap:10px;padding:7px 0;border-bottom:1px solid var(--bord)"><span style="color:var(--a1);font-weight:700;min-width:20px">2.</span><div><strong style="font-size:15px">Online Forums</strong><br><span style="font-size:14px;color:var(--mute)">Post questions, share knowledge, engage in topic-based conversations.</span></div></div>
        <div style="display:flex;gap:10px;padding:7px 0;border-bottom:1px solid var(--bord)"><span style="color:var(--a1);font-weight:700;min-width:20px">3.</span><div><strong style="font-size:15px">E-Learning Platforms</strong><br><span style="font-size:14px;color:var(--mute)">Engaging educational content, quizzes, interactive exercises, and assessments.</span></div></div>
        <div style="display:flex;gap:10px;padding:7px 0;border-bottom:1px solid var(--bord)"><span style="color:var(--a1);font-weight:700;min-width:20px">4.</span><div><strong style="font-size:15px">Web-based Games</strong><br><span style="font-size:14px;color:var(--mute)">Online games allowing multiple players to interact and compete in real-time.</span></div></div>
        <div style="display:flex;gap:10px;padding:7px 0;border-bottom:1px solid var(--bord)"><span style="color:var(--a1);font-weight:700;min-width:20px">5.</span><div><strong style="font-size:15px">Collaborative Tools</strong><br><span style="font-size:14px;color:var(--mute)">Google Docs, Trello, Slack — collaborate in real-time, share files, communicate.</span></div></div>
        <div style="display:flex;gap:10px;padding:7px 0;border-bottom:1px solid var(--bord)"><span style="color:var(--a1);font-weight:700;min-width:20px">6.</span><div><strong style="font-size:15px">Interactive Data Visualization</strong><br><span style="font-size:14px;color:var(--mute)">Explore complex datasets through interactive charts, graphs, and maps.</span></div></div>
        <div style="display:flex;gap:10px;padding:7px 0"><span style="color:var(--a1);font-weight:700;min-width:20px">7.</span><div><strong style="font-size:15px">Virtual Events &amp; Conferences</strong><br><span style="font-size:14px;color:var(--mute)">Webinars with live Q&amp;A, polls, and networking opportunities.</span></div></div>
      </div>
    </div>
  </div>
</div>`,

// ── 5 KEY CHARACTERISTICS ─────────────────────────────────────────────────────
`<div class="W">
  <div class="eye">Main Lesson · Interactive Platforms</div>
  <div class="T">6 Key Characteristics of Interactive Platforms</div>
  <div class="hr"></div>
  <div class="g2" style="gap:16px">
    <div class="card">

`<div class="W">
  <div class="eye">Skill-Building Activity · Code Project 2</div>
  <div class="T">Build a Blog Chat App — JavaScript Logic</div>
  <div class="hr"></div>
  <div class="g2" style="gap:18px;align-items:start">
    <div class="cw" style="min-width:0">
      <div class="ch"><span class="cl">JavaScript · script.js</span><button class="cpbtn" id="cb4" onclick="doCopy('pre4','cb4')">Copy</button></div>
      <pre id="pre4" class="scroll"><span class="kw">function</span> <span class="fn">sendMessage</span>() {
  <span class="kw">const</span> messageInput =
    document.<span class="fn">getElementById</span>(<span class="st">'message-input'</span>);
  <span class="kw">const</span> message =
    messageInput.value.<span class="fn">trim</span>();

  <span class="kw">if</span> (message !== <span class="st">''</span>) {
    <span class="kw">const</span> chatMessages =
      document.<span class="fn">getElementById</span>(<span class="st">'chat-messages'</span>);
    <span class="kw">const</span> newMessage =
      document.<span class="fn">createElement</span>(<span class="st">'div'</span>);

    newMessage.classList.<span class="fn">add</span>(<span class="st">'message'</span>, <span class="st">'outgoing'</span>);
    newMessage.textContent = message;
    chatMessages.<span class="fn">appendChild</span>(newMessage);

    messageInput.value = <span class="st">''</span>;
    messageInput.<span class="fn">focus</span>();

    <span class="cm">// Simulate a reply after 1 second</span>
    <span class="fn">setTimeout</span>(sendReply, <span class="nm">1000</span>);
  }
}

<span class="kw">function</span> <span class="fn">sendReply</span>() {
  <span class="kw">const</span> chatMessages =
    document.<span class="fn">getElementById</span>(<span class="st">'chat-messages'</span>);
  <span class="kw">const</span> replyMessage =
    document.<span class="fn">createElement</span>(<span class="st">'div'</span>);

  replyMessage.classList.<span class="fn">add</span>(<span class="st">'message'</span>, <span class="st">'incoming'</span>);
  replyMessage.textContent =
    <span class="st">'This is a sample reply.'</span>;
  chatMessages.<span class="fn">appendChild</span>(replyMessage);
}</pre>

// ── Engine ──────────────────────────────────────────────────────────────────
let cur = 0;
const total = S.length;
const deck  = document.getElementById('deck');
const prog  = document.getElementById('prog');
const ctr   = document.getElementById('ctr');

function build() {
  S.forEach((html, i) => {
    const el = document.createElement('div');
    el.className = 'slide' + (i === 0 ? ' active' : '');
    el.innerHTML = html;
    deck.appendChild(el);
  });
  ui();
}

function all() { return deck.querySelectorAll('.slide'); }

function go(n, dir) {
  if (n < 0 || n >= total) return;
  const ss = all();
  ss[cur].classList.remove('active');
  ss[cur].classList.add('out');
  setTimeout(() => ss[cur].classList.remove('out'), 380);
  cur = n;
  const nx = ss[cur];
  nx.style.transform = dir === 'f' ? 'translateX(54px)' : 'translateX(-54px)';
  nx.classList.add('active');
  requestAnimationFrame(() => requestAnimationFrame(() => { nx.style.transform = ''; }));
  ui();
}

function ui() {
  prog.style.width = ((cur + 1) / total * 100) + '%';
  ctr.textContent  = (cur + 1) + ' / ' + total;
}

function next() { go(cur + 1, 'f'); }
function prev() { go(cur - 1, 'b'); }

document.addEventListener('keydown', e => {
  if      (e.key === 'ArrowRight' || e.key === 'ArrowDown')  next();
  else if (e.key === 'ArrowLeft'  || e.key === 'ArrowUp')    prev();
  else if (e.key === 'Home')  go(0, 'b');
  else if (e.key === 'End')   go(total - 1, 'f');
  else if (e.key === '?' || e.key === '/') document.getElementById('modal').classList.toggle('show');
  else if (e.key === 'Escape') document.getElementById('modal').classList.remove('show');
});

['contextmenu','auxclick'].forEach(ev =>
  document.addEventListener(ev, e => { e.preventDefault(); e.stopImmediatePropagation(); }, { capture:true, passive:false })
);
document.addEventListener('mousedown', e => {
  if (e.target.closest('button,a,input,select,textarea,label')) return;
  if      (e.button === 2) { e.preventDefault(); e.stopImmediatePropagation(); next(); }
  else if (e.button === 3) { e.preventDefault(); e.stopImmediatePropagation(); prev(); }
  else if (e.button === 4) { e.preventDefault(); e.stopImmediatePropagation(); next(); }
}, { capture:true, passive:false });

let tx = null;
document.addEventListener('touchstart', e => { tx = e.touches[0].clientX; }, { passive:true });
document.addEventListener('touchend', e => {
  if (tx === null) return;
  const dx = e.changedTouches[0].clientX - tx;
  if (Math.abs(dx) > 42) dx < 0 ? next() : prev();
  tx = null;
}, { passive:true });

document.getElementById('mclose').addEventListener('click', () =>
  document.getElementById('modal').classList.remove('show')
);

function doCopy(preId, btnId) {
  const pre = document.getElementById(preId);
  const btn = document.getElementById(btnId);
  navigator.clipboard.writeText(pre.innerText).then(() => {
    btn.textContent = 'Copied!';
    btn.classList.add('ok');
    setTimeout(() => { btn.textContent = 'Copy'; btn.classList.remove('ok'); }, 2200);
  });
}

build();
</script>
