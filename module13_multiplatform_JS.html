<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Module 13 — Multi-Platform Technology</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#07090e;--surf:#0d1119;--card:#111a28;--card2:#172032;--bord:#1a2a3e;--bord2:#213348;
  --a1:#34d399;--a2:#818cf8;--a3:#f59e0b;--rose:#fb7185;--sky:#38bdf8;--violet:#c084fc;
  --txt:#eef4ff;--mute:#6b83a8;--dim:#364e6a;
  --r:13px;--ff:'Segoe UI',system-ui,-apple-system,sans-serif;--mono:'Cascadia Code','Fira Code',Consolas,monospace;
}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--txt);font-family:var(--ff)}
#prog{position:fixed;top:0;left:0;height:3px;background:linear-gradient(90deg,var(--a1),var(--a2),var(--a3));z-index:900;transition:width .3s ease;box-shadow:0 0 8px var(--a1)}
#ctr{position:fixed;bottom:18px;right:22px;font-size:13px;color:var(--mute);z-index:900;letter-spacing:.05em;font-weight:600}
#hint{position:fixed;bottom:18px;left:22px;font-size:13px;color:var(--dim);z-index:900}
#deck{width:100%;height:100%;position:relative;overflow:hidden}
.slide{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:42px 62px;opacity:0;pointer-events:none;transition:opacity .35s ease,transform .35s ease;transform:translateX(54px);overflow-y:auto}
.slide.active{opacity:1;pointer-events:all;transform:translateX(0)}
.slide.out{opacity:0;transform:translateX(-54px)}
@media(prefers-reduced-motion:reduce){.slide{transition:opacity .15s;transform:none!important}}
.W{width:100%;max-width:1420px}
.eye{font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--a1);margin-bottom:9px}
.T{font-size:clamp(27px,3.6vw,50px);font-weight:900;line-height:1.08;margin-bottom:7px}
.sub{font-size:clamp(15px,1.2vw,18px);color:var(--mute);margin-bottom:22px;line-height:1.55}
.hr{width:46px;height:3px;background:linear-gradient(90deg,var(--a1),var(--a2));border-radius:2px;margin-bottom:22px}
.card{background:var(--card);border:1px solid var(--bord);border-radius:var(--r);padding:18px 22px}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.g4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.badge{display:inline-flex;align-items:center;font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;padding:3px 10px;border-radius:20px;margin-bottom:6px}
.bG{background:#082a1e;color:var(--a1)} .bB{background:#16194a;color:#a5b4fc}
.bD{background:#2a1f08;color:var(--a3)} .bR{background:#2a0c18;color:var(--rose)}
.bS{background:#072030;color:var(--sky)} .bV{background:#1e0a2a;color:var(--violet)}
.qt{background:var(--card);border-left:4px solid var(--a1);border-radius:0 var(--r) var(--r) 0;padding:18px 26px;font-style:italic;font-size:clamp(15px,1.2vw,18px);line-height:1.7}
.qt cite{display:block;font-size:15px;font-style:normal;color:var(--mute);margin-top:9px;font-weight:600}
/* code */
.cw{background:#060a10;border:1px solid #182030;border-radius:var(--r);overflow:hidden}
.ch{display:flex;align-items:center;justify-content:space-between;padding:9px 15px;background:#0b1018;border-bottom:1px solid #182030}
.cl{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--dim)}
.cpbtn{font-size:12px;padding:4px 12px;border-radius:6px;border:1px solid var(--bord2);background:var(--card2);color:var(--mute);cursor:pointer;font-family:var(--ff);transition:all .15s}
.cpbtn:hover{background:var(--bord);color:var(--txt)}
.cpbtn.ok{background:#082a1e;color:#34d399;border-color:#34d399}
pre{padding:17px 20px;overflow:auto;font-family:var(--mono);font-size:13px;line-height:1.7;color:#c8d8f0}
pre.sc{max-height:320px;overflow-y:auto}
.kw{color:#f472b6}.at{color:#7dd3fc}.st{color:#86efac}.tg{color:#60a5fa}.cm{color:#364e6a;font-style:italic}.fn{color:#c084fc}.nm{color:#fda4af}.kt{color:#34d399}
/* type cards */
.tc{background:var(--card);border:1px solid var(--bord);border-radius:var(--r);padding:15px 18px}
.tc h4{font-size:15px;font-weight:700;margin-bottom:5px}
.tc p{font-size:14px;color:var(--mute);line-height:1.55;margin-bottom:7px}
.tc ul{list-style:none;display:flex;flex-direction:column;gap:3px}
.tc ul li{font-size:13px;color:var(--txt)}.tc ul li::before{content:'→ ';color:var(--mute)}
/* feature rows */
.fr{display:flex;gap:12px;padding:9px 0;border-bottom:1px solid var(--bord);align-items:flex-start}
.fr:last-child{border-bottom:none}
.fi{min-width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0;background:var(--card2)}
.ft h4{font-size:15px;font-weight:700;margin-bottom:2px}
.ft p{font-size:14px;color:var(--mute);line-height:1.5}
/* MCQ */
.qcard{background:var(--card);border:1px solid var(--bord);border-radius:var(--r);padding:14px 18px}
.qnum{font-size:11px;font-weight:700;color:var(--a1);letter-spacing:.08em;text-transform:uppercase;margin-bottom:4px}
.qtext{font-size:15px;font-weight:600;line-height:1.4;margin-bottom:9px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.opt{background:var(--bg);border:1px solid var(--bord);border-radius:7px;padding:7px 11px;font-size:14px;color:var(--mute);line-height:1.4}
.opt span{color:var(--a1);font-weight:700;margin-right:4px}
/* ID */
.idq{background:var(--card);border:1px solid var(--bord);border-radius:var(--r);padding:13px 17px;display:flex;gap:12px;align-items:flex-start}
.idn{min-width:26px;height:26px;background:var(--a1);color:#06080e;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;flex-shrink:0;margin-top:2px}
.idt{font-size:15px;line-height:1.55}
.blank{display:inline-block;width:120px;border-bottom:1.5px solid var(--a1);margin:0 5px;vertical-align:bottom}
/* answers */
.ar{display:flex;align-items:flex-start;gap:11px;padding:8px 0;border-bottom:1px solid var(--bord)}
.ar:last-child{border-bottom:none}
.an{min-width:32px;font-size:12px;font-weight:700;color:var(--a1)}
.aa{font-size:15px;font-weight:700;color:#34d399;min-width:185px;flex-shrink:0}
.ae{font-size:14px;color:var(--mute);line-height:1.45}
/* recap */
.ri{display:flex;gap:11px;padding:8px 0;align-items:flex-start}
.ric{min-width:28px;height:28px;background:var(--a2);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0}
.rit{font-size:15px;line-height:1.55}
/* step */
.sp{display:flex;gap:13px;padding:9px 0;border-bottom:1px solid var(--bord);align-items:flex-start}
.sp:last-child{border-bottom:none}
.sn{min-width:28px;height:28px;background:linear-gradient(135deg,var(--a1),var(--a2));border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:#06080e;flex-shrink:0;margin-top:1px}
.st2 h4{font-size:15px;font-weight:700;margin-bottom:2px;color:var(--a1)}
.st2 p{font-size:14px;color:var(--mute);line-height:1.5}
/* modal */
#modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:9999;align-items:center;justify-content:center}
#modal.show{display:flex}
.mbox{background:var(--surf);border:1px solid var(--bord2);border-radius:16px;padding:30px 38px;min-width:340px}
.mbox h3{font-size:18px;font-weight:800;margin-bottom:18px}
.mrow{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--bord);font-size:14px}
.mrow:last-child{border-bottom:none}
.mrow span:first-child{color:var(--mute)}
kbd{background:var(--card);border:1px solid var(--bord2);border-radius:5px;padding:2px 7px;font-size:11px;font-family:var(--mono)}
.mclose{display:block;text-align:center;margin-top:18px;font-size:13px;color:var(--mute);cursor:pointer}
.mclose:hover{color:var(--txt)}
.grad{background:linear-gradient(135deg,#e0f8f0,#34d399 40%,#818cf8);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
</style>
</head>

<div id="ctr"></div>
<div id="hint">→ next · ← prev · ? help</div>
<div id="deck"></div>
<div id="modal">
  <div class="mbox">
    <h3>⌨ Shortcuts</h3>
    <div class="mrow"><span>Next</span><span><kbd>→</kbd> / right-click</span></div>
    <div class="mrow"><span>Prev</span><span><kbd>←</kbd></span></div>
    <div class="mrow"><span>First / Last</span><span><kbd>Home</kbd> / <kbd>End</kbd></span></div>
    <div class="mrow"><span>This menu</span><span><kbd>?</kbd></span></div>
    <span class="mclose" id="mclose">✕ Close</span>
  </div>
</div>

// ── 2 WHAT IS MULTI-PLATFORM / CROSS-PLATFORM ────────────────────────────────
`<div class="W">
  <div class="eye">Main Lesson · Core Concepts</div>
  <div class="T">What is Multi-Platform / Cross-Platform?</div>
  <div class="hr"></div>
  <div class="g2" style="gap:18px;align-items:start">
    <div>
      <div class="card" style="border-left:4px solid var(--a1);margin-bottom:14px">
        <div style="font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--a1);margin-bottom:8px">Multi-Platform Software</div>
        <div style="font-size:15px;line-height:1.7">Programs that can be <strong style="color:var(--a1)">run on multiple hardware platforms</strong> — compatible with both Windows and Mac desktop environments, as well as iOS and Android mobile devices. An interpreter is often considered multi-platform as it can be used across various operating systems.</div>
      </div>
      <div class="card" style="border-left:4px solid var(--a2)">
        <div style="font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--a2);margin-bottom:8px">Cross-Platform (also: Multi-Platform)</div>
        <div style="font-size:15px;line-height:1.7">Describes the ability of software applications or services to <strong style="color:var(--a2)">operate and be utilized on various computing platforms or operating systems</strong> — allowing developers to design apps seamlessly across desktops, laptops, smartphones, tablets, and OSes like Windows, macOS, Linux, Android, and iOS.</div>
      </div>
    </div>
    <div class="card">
      <div style="font-size:12px;font-weight:700;color:var(--a3);letter-spacing:.08em;text-transform:uppercase;margin-bottom:12px">Key Benefit</div>
      <div style="font-size:15px;color:var(--mute);line-height:1.7;margin-bottom:14px">With cross-platform technology, <strong style="color:var(--txt)">users can access and use software regardless of the device or operating system they are using</strong> — maximizing reach and reducing development duplication.</div>
      <div style="border-top:1px solid var(--bord);padding-top:13px">

// ── 4 PLATFORM AGNOSTIC ───────────────────────────────────────────────────────
`<div class="W">
  <div class="eye">Main Lesson · Platform Agnostic</div>
  <div class="T">What is Platform Agnostic?</div>
  <div class="hr"></div>
  <div class="g2" style="gap:18px;align-items:start">
    <div>
      <div class="card" style="border-left:4px solid var(--a3);margin-bottom:14px">
        <div style="font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--a3);margin-bottom:8px">Definition</div>
        <div style="font-size:15px;line-height:1.7">A concept or approach where a software application, code, or technology is <strong style="color:var(--a3)">designed and developed in a way that does not rely on or favor any specific operating system, hardware architecture, or underlying platform</strong>.</div>
      </div>
      <div class="card" style="padding:14px 18px;text-align:center">
        <div style="font-size:15px;color:var(--mute)">💡 Platform agnosticism = <strong style="color:var(--txt)">write once, run anywhere</strong> — the philosophy behind universal compatibility.</div>
      </div>
    </div>
    <div class="card">
      <div style="font-size:12px;font-weight:700;color:var(--a3);letter-spacing:.08em;text-transform:uppercase;margin-bottom:13px">5 Contexts Where Platform Agnosticism Is Valuable</div>
      <div class="sp">
        <div class="sn">1</div>
        <div class="st2"><h4>Software Development</h4><p>Platform-agnostic code is not tied to a specific OS — making it portable, easy to run on different environments, reducing development effort and maintenance costs.</p></div>
      </div>
      <div class="sp">
        <div class="sn">2</div>
        <div class="st2"><h4>Data Formats</h4><p>Formats like CSV and JSON ensure data can be easily exchanged and interpreted across different systems without compatibility issues.</p></div>
      </div>
      <div class="sp">
        <div class="sn">3</div>
        <div class="st2"><h4>Cloud Services</h4><p>Platform-agnostic cloud services allow apps to be deployed and scaled across various providers without major code changes.</p></div>
      </div>
      <div class="sp">
        <div class="sn">4</div>
        <div class="st2"><h4>Web Standards</h4><p>HTML, CSS, and JavaScript are designed to be platform agnostic — enabling web apps that run on any device with a compatible browser.</p></div>
      </div>
      <div class="sp">
        <div class="sn">5</div>
        <div class="st2"><h4>Cross-Platform Development</h4><p>Frameworks aim to create apps on multiple platforms using a single codebase — by being platform agnostic, they cater to a broader audience and save development resources.</p></div>
      </div>
    </div>
  </div>
</div>`,

`<div class="W">
  <div class="eye">Project Drill · Portfolio · JavaScript</div>

  <div class="hr"></div>
  <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;height:min(560px,62vh);align-items:stretch">

      <div class="ch"><span class="cl">JavaScript · survey.js</span><button class="cpbtn" id="cb2" onclick="doCopy('pre2','cb2')">Copy</button></div>
      <pre id="pre2" style="flex:1;overflow:auto;min-height:0;padding:17px 20px;font-family:var(--mono);font-size:13px;line-height:1.7;color:#c8d8f0"><span class="cm">// survey.js — runs in Node.js</span>
<span class="kw">const</span> readline = <span class="fn">require</span>(<span class="st">'readline'</span>);
<span class="kw">const</span> rl = readline.<span class="fn">createInterface</span>({
  input: process.stdin, output: process.stdout
});

<span class="kw">function</span> <span class="fn">ask</span>(q) {
  <span class="kw">return new</span> <span class="fn">Promise</span>(res => rl.<span class="fn">question</span>(q, res));
}

<span class="kw">async function</span> <span class="fn">runSurvey</span>() {
  <span class="fn">console</span>.<span class="fn">log</span>(<span class="st">"Welcome to the Online Product Feedback Survey!"</span>);

  <span class="kw">const</span> name  = <span class="kw">await</span> <span class="fn">ask</span>(<span class="st">"Name: "</span>);
  <span class="kw">const</span> email = <span class="kw">await</span> <span class="fn">ask</span>(<span class="st">"Email: "</span>);
  <span class="fn">console</span>.<span class="fn">log</span>(<span class="st">"Thank you, "</span> + name + <span class="st">"!"</span>);

  <span class="fn">console</span>.<span class="fn">log</span>(<span class="st">"Rate 1-5 (1=Strongly Disagree, 5=Strongly Agree)"</span>);
  <span class="kw">const</span> ui  = <span class="kw">await</span> <span class="fn">ask</span>(<span class="st">"User Interface: "</span>);
  <span class="kw">const</span> ps  = <span class="kw">await</span> <span class="fn">ask</span>(<span class="st">"Product Selection: "</span>);
  <span class="kw">const</span> ds  = <span class="kw">await</span> <span class="fn">ask</span>(<span class="st">"Delivery Speed: "</span>);
  <span class="kw">const</span> cs  = <span class="kw">await</span> <span class="fn">ask</span>(<span class="st">"Customer Support: "</span>);
  <span class="kw">const</span> comments = <span class="kw">await</span> <span class="fn">ask</span>(<span class="st">"Additional comments: "</span>);

  <span class="fn">console</span>.<span class="fn">log</span>(<span class="st">"\n--- Summary ---"</span>);
  <span class="fn">console</span>.<span class="fn">log</span>(<span class="st">"Name:"</span>, name, <span class="st">"| Email:"</span>, email);
  <span class="fn">console</span>.<span class="fn">log</span>(<span class="st">"UI:"</span>, ui, <span class="st">"| Selection:"</span>, ps,
              <span class="st">"| Delivery:"</span>, ds, <span class="st">"| Support:"</span>, cs);
  <span class="fn">console</span>.<span class="fn">log</span>(<span class="st">"Comments:"</span>, comments);
  rl.<span class="fn">close</span>();
}

<span class="fn">runSurvey</span>();</pre>

// ── Engine ──────────────────────────────────────────────────────────────────
let cur = 0;
const total = S.length;
const deck  = document.getElementById('deck');
const prog  = document.getElementById('prog');
const ctr   = document.getElementById('ctr');

function build() {
  S.forEach((html, i) => {
    const el = document.createElement('div');
    el.className = 'slide' + (i === 0 ? ' active' : '');
    el.innerHTML = html;
    deck.appendChild(el);
  });
  ui();
}

function all() { return deck.querySelectorAll('.slide'); }

function go(n, dir) {
  if (n < 0 || n >= total) return;
  const ss = all();
  ss[cur].classList.remove('active');
  ss[cur].classList.add('out');
  setTimeout(() => ss[cur].classList.remove('out'), 380);
  cur = n;
  const nx = ss[cur];
  nx.style.transform = dir === 'f' ? 'translateX(54px)' : 'translateX(-54px)';
  nx.classList.add('active');
  requestAnimationFrame(() => requestAnimationFrame(() => { nx.style.transform = ''; }));
  ui();
}

function ui() {
  prog.style.width = ((cur + 1) / total * 100) + '%';
  ctr.textContent  = (cur + 1) + ' / ' + total;
}

function next() { go(cur + 1, 'f'); }
function prev() { go(cur - 1, 'b'); }

document.addEventListener('keydown', e => {
  if      (e.key === 'ArrowRight' || e.key === 'ArrowDown')  next();
  else if (e.key === 'ArrowLeft'  || e.key === 'ArrowUp')    prev();
  else if (e.key === 'Home')  go(0, 'b');
  else if (e.key === 'End')   go(total - 1, 'f');
  else if (e.key === '?' || e.key === '/') document.getElementById('modal').classList.toggle('show');
  else if (e.key === 'Escape') document.getElementById('modal').classList.remove('show');
});

['contextmenu','auxclick'].forEach(ev =>
  document.addEventListener(ev, e => { e.preventDefault(); e.stopImmediatePropagation(); }, { capture:true, passive:false })
);
document.addEventListener('mousedown', e => {
  if (e.target.closest('button,a,input,select,textarea,label')) return;
  if      (e.button === 2) { e.preventDefault(); e.stopImmediatePropagation(); next(); }
  else if (e.button === 3) { e.preventDefault(); e.stopImmediatePropagation(); prev(); }
  else if (e.button === 4) { e.preventDefault(); e.stopImmediatePropagation(); next(); }
}, { capture:true, passive:false });

let tx = null;
document.addEventListener('touchstart', e => { tx = e.touches[0].clientX; }, { passive:true });
document.addEventListener('touchend', e => {
  if (tx === null) return;
  const dx = e.changedTouches[0].clientX - tx;
  if (Math.abs(dx) > 42) dx < 0 ? next() : prev();
  tx = null;
}, { passive:true });

document.getElementById('mclose').addEventListener('click', () =>
  document.getElementById('modal').classList.remove('show')
);

function doCopy(preId, btnId) {
  const pre = document.getElementById(preId);
  const btn = document.getElementById(btnId);
  navigator.clipboard.writeText(pre.innerText).then(() => {
    btn.textContent = 'Copied!';
    btn.classList.add('ok');
    setTimeout(() => { btn.textContent = 'Copy'; btn.classList.remove('ok'); }, 2200);
  });
}

build();
</script>
