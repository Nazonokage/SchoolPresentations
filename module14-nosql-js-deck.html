<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Module 14 — NoSQL Databases, Cross-Platform Backends &amp; JavaScript Setup</title>
<style>
  :root{
    --bg: #0E161F;
    --bg-soft: #121C27;
    --surface: #16212D;
    --surface-2: #1C2938;
    --line: rgba(230,240,247,0.09);
    --line-strong: rgba(230,240,247,0.16);
    --text: #E9F1F7;
    --text-muted: #90A4B8;
    --text-dim: #5D7086;
    --teal: #43D9C4;
    --teal-dim: rgba(67,217,196,0.14);
    --amber: #F5B942;
    --amber-dim: rgba(245,185,66,0.14);
    --violet: #A98BFA;
    --violet-dim: rgba(169,139,250,0.14);
    --coral: #F2735C;
    --shadow: 0 24px 60px -20px rgba(0,0,0,0.55);
    --radius: 14px;
    --mono: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, "Courier New", monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; padding:0; height:100%;
    background:
      radial-gradient(1100px 700px at 8% -10%, rgba(67,217,196,0.10), transparent 60%),
      radial-gradient(900px 620px at 105% 10%, rgba(169,139,250,0.08), transparent 55%),
      var(--bg);
    color:var(--text);
    font-family:var(--sans);
    overflow:hidden;
    -webkit-font-smoothing:antialiased;
  }
  ::selection{ background: var(--teal); color:#062420; }

  /* ---------- deck shell ---------- */
  #deck{
    position:relative; width:100vw; height:100vh;
    display:flex; align-items:center; justify-content:center;
  }
  #progressTrack{
    position:fixed; top:0; left:0; width:100%; height:3px;
    background:var(--line); z-index:60;
  }
  #progressBar{
    height:100%; width:0%;
    background:linear-gradient(90deg,var(--teal),var(--violet));
    transition:width .35s ease;
  }
  #counter{
    position:fixed; bottom:18px; right:22px; z-index:60;
    font-family:var(--mono); font-size:12px; letter-spacing:.06em;
    color:var(--text-muted); background:rgba(18,28,39,0.75);
    border:1px solid var(--line); padding:6px 12px; border-radius:999px;
    backdrop-filter:blur(6px);
  }
  #hint{
    position:fixed; bottom:18px; left:22px; z-index:60;
    font-family:var(--mono); font-size:11px; color:var(--text-dim);
    display:flex; align-items:center; gap:8px;
  }
  #hint kbd{
    border:1px solid var(--line-strong); border-radius:5px; padding:1px 6px;
    font-family:var(--mono); color:var(--text-muted); background:var(--surface);
  }

  .slide-wrap{
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
    padding:64px 72px;
    opacity:0; visibility:hidden;
    transform:translateX(28px);
    transition:opacity .35s ease, transform .35s ease, visibility 0s linear .35s;
    pointer-events:none;
  }
  .slide-wrap.active{
    opacity:1; visibility:visible; transform:translateX(0);
    transition:opacity .35s ease, transform .35s ease;
    pointer-events:auto;
  }
  .slide-wrap.leaving-left{ transform:translateX(-28px); }
  .slide-wrap.leaving-right{ transform:translateX(28px); }
  @media (prefers-reduced-motion: reduce){
    .slide-wrap{ transition:opacity .01s linear; transform:none !important; }
  }

  .slide{
    width:min(1180px, 100%); max-height:100%;
    overflow:auto; padding:6px 4px 18px;
  }
  .slide::-webkit-scrollbar{ width:8px; }
  .slide::-webkit-scrollbar-thumb{ background:var(--line-strong); border-radius:8px; }

  .eyebrow{
    font-family:var(--mono); font-size:13.5px; letter-spacing:.13em;
    color:var(--teal); text-transform:uppercase;
    display:inline-flex; align-items:center; gap:8px; margin-bottom:14px;
  }
  .eyebrow::before{ content:"{"; color:var(--text-dim); font-weight:700; }
  .eyebrow::after{ content:"}"; color:var(--text-dim); font-weight:700; }
  .eyebrow.amber{ color:var(--amber); }
  .eyebrow.violet{ color:var(--violet); }

  h1.title{
    font-size:clamp(28px, 3.4vw, 42px);
    line-height:1.12; margin:0 0 18px; font-weight:800;
    letter-spacing:-0.01em;
  }
  h1.title .accent{ color:var(--teal); }
  p.lede{ font-size:17px; color:var(--text-muted); line-height:1.65; max-width:74ch; margin:0 0 22px; }

  .grid2{ display:grid; grid-template-columns:1fr 1fr; gap:20px; }
  .grid3{ display:grid; grid-template-columns:repeat(3,1fr); gap:18px; }

  .card{
    position:relative;
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:22px 24px;
    box-shadow: var(--shadow);
  }
  .card::before{
    content:""; position:absolute; top:0; right:0; width:16px; height:16px;
    background:var(--bg);
    clip-path:polygon(0 0, 100% 0, 100% 100%);
    border-bottom:1px solid var(--line);
    border-left:1px solid var(--line);
  }
  .card h3{ margin:0 0 8px; font-size:18.5px; font-weight:700; }
  .card p{ margin:0; font-size:16.5px; line-height:1.65; color:var(--text-muted); }
  .card.accent-teal{ border-left:3px solid var(--teal); }
  .card.accent-amber{ border-left:3px solid var(--amber); }
  .card.accent-violet{ border-left:3px solid var(--violet); }

  .badge-row{ display:flex; gap:16px; align-items:center; flex-wrap:wrap; margin:10px 0 28px; }
  .badge{
    display:flex; align-items:center; gap:11px;
    background:var(--surface-2); border:1px solid var(--line);
    padding:10px 18px 10px 12px; border-radius:999px;
    font-family:var(--mono); font-size:14.5px; color:var(--text-muted);
  }
  .badge svg{ width:34px; height:34px; flex-shrink:0; }
  .badge-row.hero{ gap:20px; }
  .badge-row.hero .badge{ padding:12px 22px 12px 14px; font-size:15.5px; }
  .badge-row.hero .badge svg{ width:42px; height:42px; }
  .badge-row > svg{ width:34px; height:34px; flex-shrink:0; vertical-align:middle; }
  .badge-row.hero > svg{ width:48px; height:48px; }

  ol.steps{ counter-reset:step; list-style:none; margin:0; padding:0; display:grid; gap:12px; }
  ol.steps li{
    counter-increment:step; display:grid; grid-template-columns:34px 1fr; gap:14px;
    background:var(--surface); border:1px solid var(--line); border-radius:10px;
    padding:12px 16px; align-items:start;
  }
  ol.steps li::before{
    content: counter(step);
    width:34px; height:34px; border-radius:8px;
    background:var(--teal-dim); color:var(--teal);
    font-family:var(--mono); font-weight:700; font-size:15px;
    display:flex; align-items:center; justify-content:center;
  }
  ol.steps li .stxt b{ display:block; font-size:16.5px; margin-bottom:3px; }
  ol.steps li .stxt span{ font-size:16px; color:var(--text-muted); line-height:1.5; }

  table.cmp{ width:100%; border-collapse:collapse; font-size:16.5px; }
  table.cmp th, table.cmp td{ text-align:left; padding:11px 14px; border-bottom:1px solid var(--line); vertical-align:top; }
  table.cmp th{ font-family:var(--mono); font-size:13px; letter-spacing:.06em; text-transform:uppercase; color:var(--text-dim); }
  table.cmp td b{ color:var(--text); }
  table.cmp td.sql-col{ color:var(--amber); }
  table.cmp td.nosql-col{ color:var(--teal); }
  table.cmp tr:last-child td{ border-bottom:none; }

  blockquote.pullquote{
    margin:0; border-left:3px solid var(--teal);
    background:var(--teal-dim);
    padding:20px 24px; border-radius:0 10px 10px 0;
    font-size:18.5px; line-height:1.65; color:var(--text);
  }
  blockquote.pullquote .cite{ display:block; margin-top:12px; font-family:var(--mono); font-size:13px; color:var(--text-dim); }

  .diagram-box{
    background:var(--bg-soft); border:1px solid var(--line); border-radius:12px;
    padding:18px 20px; font-family:var(--mono); font-size:14.5px; color:var(--text-muted);
    overflow:auto; white-space:pre; line-height:1.55;
  }
  .diagram-box .k1{ color:var(--amber); }
  .diagram-box .k2{ color:var(--teal); }

  /* --- code + preview split --- */
  .split-row{
    display:grid; grid-template-columns:1.15fr 0.85fr; gap:20px;
    height:min(560px, 62vh);
  }
  .panel{
    background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
    display:flex; flex-direction:column; height:100%; min-height:0; overflow:hidden;
  }
  .panel-head{
    flex-shrink:0; display:flex; align-items:center; justify-content:space-between;
    padding:10px 16px; border-bottom:1px solid var(--line); background:var(--surface-2);
  }
  .panel-head .dots{ display:flex; gap:6px; }
  .panel-head .dots span{ width:9px; height:9px; border-radius:50%; display:inline-block; }
  .panel-head .dots span:nth-child(1){ background:#F2735C; }
  .panel-head .dots span:nth-child(2){ background:#F5B942; }
  .panel-head .dots span:nth-child(3){ background:#43D9C4; }
  .panel-head .fname{ font-family:var(--mono); font-size:13px; color:var(--text-muted); }
  .copy-btn{
    font-family:var(--mono); font-size:12.5px; color:var(--text); background:var(--surface);
    border:1px solid var(--line-strong); padding:5px 11px; border-radius:6px; cursor:pointer;
  }
  .copy-btn:hover{ border-color:var(--teal); color:var(--teal); }
  .copy-btn.copied{ background:var(--teal-dim); color:var(--teal); border-color:var(--teal); }
  .panel pre{
    flex:1; overflow:auto; min-height:0; margin:0; padding:16px 18px;
  }
  .panel pre code{
    font-family:var(--mono); font-size:14px; line-height:1.65; white-space:pre;
    color:var(--text);
  }
  .tok-tag{ color:#7FB7FF; }
  .tok-string{ color:#9FE39A; }
  .tok-keyword{ color:var(--violet); }
  .tok-comment{ color:var(--text-dim); font-style:italic; }
  .tok-number{ color:var(--amber); }
  .panel iframe{ flex:1; width:100%; border:0; min-height:0; background:#fff; }
  .panel .live-label{
    flex-shrink:0; padding:10px 16px; font-family:var(--mono); font-size:12.5px;
    color:var(--text-dim); border-top:1px solid var(--line); background:var(--surface-2);
  }

  /* activities */
  .qa-grid{ display:grid; grid-template-columns:1fr 1fr; gap:16px; }
  .qa-grid.odd-last > *:last-child{ grid-column:1 / -1; max-width:560px; margin:0 auto; }
  .qcard{ background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:16px 18px; }
  .qcard .qnum{ font-family:var(--mono); font-size:12.5px; color:var(--teal); margin-bottom:7px; }
  .qcard .qtext{ font-size:16.5px; line-height:1.6; margin-bottom:12px; }
  .qcard ul.opts{ list-style:none; margin:0; padding:0; display:grid; gap:6px; }
  .qcard ul.opts li{
    font-size:16px; padding:8px 11px; border-radius:7px; background:var(--surface-2);
    border:1px solid var(--line); color:var(--text-muted);
  }
  .qcard ul.opts li b{ color:var(--text); font-family:var(--mono); margin-right:6px; }
  .id-tag{
    display:inline-block; font-family:var(--mono); font-size:12px; color:var(--violet);
    background:var(--violet-dim); padding:2px 8px; border-radius:5px; margin-bottom:8px;
  }

  .answer-grid{ display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  .ans-item{ background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:13px 16px; }
  .ans-item .a-head{ display:flex; gap:8px; align-items:baseline; margin-bottom:4px; }
  .ans-item .a-head .qn{ font-family:var(--mono); font-size:13px; color:var(--text-dim); }
  .ans-item .a-head .ans{ font-weight:700; color:var(--teal); font-size:16.5px; }
  .ans-item p{ margin:0; font-size:15.5px; color:var(--text-muted); line-height:1.55; }

  .closing-quote{
    text-align:center; max-width:720px; margin:40px auto 0;
  }
  .closing-quote p.q{ font-size:24px; line-height:1.5; font-weight:600; color:var(--text); margin:0 0 14px; }
  .closing-quote p.a{ font-family:var(--mono); font-size:15px; color:var(--text-dim); }

  /* shortcuts overlay */
  #shortcuts{
    position:fixed; inset:0; background:rgba(6,10,15,0.72); backdrop-filter:blur(4px);
    display:none; align-items:center; justify-content:center; z-index:80;
  }
  #shortcuts.show{ display:flex; }
  #shortcuts .box{
    background:var(--surface); border:1px solid var(--line-strong); border-radius:16px;
    padding:30px 34px; width:min(440px,90vw); box-shadow:var(--shadow);
  }
  #shortcuts h4{ margin:0 0 16px; font-size:16px; }
  #shortcuts .row{ display:flex; justify-content:space-between; padding:9px 0; border-bottom:1px solid var(--line); font-size:15px; color:var(--text-muted); }
  #shortcuts .row:last-child{ border-bottom:none; }
  #shortcuts kbd{ font-family:var(--mono); background:var(--surface-2); border:1px solid var(--line-strong); border-radius:5px; padding:2px 8px; color:var(--text); }

  h2.sec{ font-size:22px; margin:0 0 4px; }
  ul.plain{ margin:0; padding-left:20px; }
  ul.plain li{ margin-bottom:9px; font-size:16.5px; line-height:1.6; color:var(--text-muted); }
  ul.plain li b{ color:var(--text); }

  @media (max-width: 880px){
    .slide-wrap{ padding:34px 20px; }
    .grid2, .grid3, .qa-grid, .answer-grid{ grid-template-columns:1fr; }
    .split-row{ grid-template-columns:1fr; height:auto; }
    .panel{ height:min(420px,58vh); }
    h1.title{ font-size:26px; }
  }
</style>
</head>

<div id="hint"><kbd>&#8594;</kbd> next &nbsp; <kbd>&#8592;</kbd> prev &nbsp; <kbd>?</kbd> shortcuts</div>

<div id="deck"></div>

<div id="shortcuts" role="dialog" aria-label="Keyboard shortcuts">

    <div class="row"><span>Next slide</span><span><kbd>&#8594;</kbd> / right-click / Mouse4</span></div>

    <div class="row"><span>Close panel</span><span><kbd>Esc</kbd></span></div>
  </div>
</div>

/* ================= engine ================= */
const deck = document.getElementById('deck');
const total = slides.length;
let current = 0;

slides.forEach((html, i)=>{
  const wrap = document.createElement('div');
  wrap.className = 'slide-wrap';
  wrap.id = 'slide-' + i;
  const inner = document.createElement('div');
  inner.className = 'slide';
  inner.innerHTML = html;
  wrap.appendChild(inner);
  deck.appendChild(wrap);
});

const counterEl = document.getElementById('counter');
const progressBar = document.getElementById('progressBar');
const wraps = Array.from(document.querySelectorAll('.slide-wrap'));

function render(prevIndex, dir){
  wraps.forEach((w,i)=>{
    w.classList.remove('active','leaving-left','leaving-right');
    if(i === current){ w.classList.add('active'); }
  });
  if(prevIndex !== null && prevIndex !== current){
    const pw = wraps[prevIndex];
    pw.classList.add(dir === 1 ? 'leaving-left' : 'leaving-right');
  }
  counterEl.textContent = (current+1) + ' / ' + total;
  progressBar.style.width = (((current+1)/total)*100) + '%';

  if(current === 11){ initCodeSlide(); } // slide 12 (index 11)
}

function goTo(idx){
  if(idx < 0 || idx >= total || idx === current) return;
  const dir = idx > current ? 1 : -1;
  const prev = current;
  current = idx;
  render(prev, dir);
}
function next(){ goTo(Math.min(current+1, total-1)); }
function prev(){ goTo(Math.max(current-1, 0)); }

render(null, 1);

/* code slide init (runs once content is in DOM) */
let codeSlideInit = false;
function initCodeSlide(){
  if(codeSlideInit) return;
  codeSlideInit = true;
  const codeBlock = document.getElementById('codeBlock');
  const iframe = document.getElementById('livePreview');
  const copyBtn = document.getElementById('copyBtn');
  if(codeBlock){ codeBlock.innerHTML = highlightCode(CODE_SAMPLE); }
  if(iframe){ iframe.srcdoc = CODE_SAMPLE; }
  if(copyBtn){
    copyBtn.addEventListener('click', function(){
      navigator.clipboard.writeText(CODE_SAMPLE).then(function(){
        copyBtn.textContent = 'Copied!';
        copyBtn.classList.add('copied');
        setTimeout(function(){ copyBtn.textContent = 'Copy'; copyBtn.classList.remove('copied'); }, 1600);
      }).catch(function(){
        copyBtn.textContent = 'Press Ctrl+C';
      });
    });
  }
}

/* ================= keyboard nav ================= */
const shortcutsEl = document.getElementById('shortcuts');
document.addEventListener('keydown', function(e){
  if(e.key === '?' ){ shortcutsEl.classList.toggle('show'); return; }
  if(e.key === 'Escape'){ shortcutsEl.classList.remove('show'); return; }
  if(shortcutsEl.classList.contains('show')) return;
  if(e.key === 'ArrowRight' || e.key === 'PageDown'){ next(); }
  else if(e.key === 'ArrowLeft' || e.key === 'PageUp'){ prev(); }
  else if(e.key === 'Home'){ goTo(0); }
  else if(e.key === 'End'){ goTo(total-1); }
});

/* ================= mouse nav: right-click, side buttons ================= */
document.addEventListener('contextmenu', function(e){
  e.preventDefault();
  next();
});

// Block browser back/forward on mouse4/mouse3 at the earliest possible point
document.addEventListener('mousedown', function(e){
  if(e.button === 3 || e.button === 4){
    e.preventDefault();
    e.stopImmediatePropagation();
  }
}, true);

document.addEventListener('mouseup', function(e){
  if(e.button === 3){ e.preventDefault(); prev(); }
  else if(e.button === 4){ e.preventDefault(); next(); }
});

// Extra safety net against history navigation
window.addEventListener('popstate', function(){ /* no-op, history nav suppressed at source */ });

/* ================= touch swipe ================= */
let touchStartX = null, touchStartY = null;
document.addEventListener('touchstart', function(e){
  if(e.touches.length !== 1) return;
  touchStartX = e.touches[0].clientX;
  touchStartY = e.touches[0].clientY;
}, {passive:true});
document.addEventListener('touchend', function(e){
  if(touchStartX === null) return;
  const dx = (e.changedTouches[0].clientX - touchStartX);
  const dy = (e.changedTouches[0].clientY - touchStartY);
  if(Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)){
    if(dx < 0) next(); else prev();
  }
  touchStartX = null; touchStartY = null;
}, {passive:true});

/* close shortcuts on outside click */
shortcutsEl.addEventListener('click', function(e){
  if(e.target === shortcutsEl) shortcutsEl.classList.remove('show');
});

})();
</script>
