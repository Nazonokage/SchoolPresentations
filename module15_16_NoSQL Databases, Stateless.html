<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>NoSQL, Stateless Architecture, Drivers &amp; JavaScript</title>
<style>
  :root{
    --ink:#0A0E17;
    --panel:#121A2C;
    --panel-2:#0E1524;
    --panel-border: rgba(148,169,209,0.16);
    --line: rgba(148,169,209,0.14);
    --text:#E9EEF7;
    --muted:#8A97B5;
    --muted-2:#5E6B8C;
    --cyan:#37D6C0;
    --cyan-dim: rgba(55,214,192,0.14);
    --amber:#F5A623;
    --amber-dim: rgba(245,166,35,0.14);
    --red:#EF6461;
    --radius: 12px;
    --font-display: -apple-system, "Segoe UI Variable", "Segoe UI Semibold", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    --font-body: -apple-system, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    --font-mono: ui-monospace, "SFMono-Regular", "JetBrains Mono", "Cascadia Code", Menlo, Consolas, monospace;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; padding:0; width:100%; height:100%;
    background:var(--ink); color:var(--text);
    font-family:var(--font-body);
    overflow:hidden;
    -webkit-font-smoothing:antialiased;
  }
  body{
    background-image:
      radial-gradient(circle at 12% 8%, rgba(55,214,192,0.06), transparent 40%),
      radial-gradient(circle at 88% 92%, rgba(245,166,35,0.05), transparent 45%),
      repeating-linear-gradient(0deg, rgba(148,169,209,0.035) 0px, rgba(148,169,209,0.035) 1px, transparent 1px, transparent 42px),
      repeating-linear-gradient(90deg, rgba(148,169,209,0.035) 0px, rgba(148,169,209,0.035) 1px, transparent 1px, transparent 42px);
  }
  #deck{
    position:relative; width:100vw; height:100vh;
    display:flex; align-items:center; justify-content:center;
  }
  .slide{
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
    padding: 64px 72px 84px;
    opacity:0; visibility:hidden;
    transform: translateX(24px);
    transition: opacity 350ms ease, transform 350ms ease, visibility 0s linear 350ms;
    pointer-events:none;
  }
  .slide.active{
    opacity:1; visibility:visible; transform:translateX(0);
    transition: opacity 350ms ease, transform 350ms ease, visibility 0s linear 0s;
    pointer-events:auto;
  }
  .slide.leaving-back{ transform: translateX(-24px); }
  @media (prefers-reduced-motion: reduce){
    .slide{ transition: opacity 1ms linear, visibility 0s linear 0s !important; transform:none !important; }
  }
  .slide-inner{
    width:100%; max-width:1180px; height:100%;
    max-height: 720px;
    display:flex; flex-direction:column;
    min-height:0;
  }
  .kicker{
    display:inline-flex; align-items:center; gap:10px;
    font-family:var(--font-mono); font-size:13.5px; letter-spacing:0.06em;
    color:var(--cyan); text-transform:uppercase;
    padding:6px 12px 6px 10px;
    border:1px solid var(--panel-border);
    border-radius:4px;
    position:relative;
    background:linear-gradient(180deg, rgba(55,214,192,0.07), transparent);
    width:fit-content;
    margin-bottom:18px;
  }
  .kicker::before, .kicker::after{
    content:""; position:absolute; width:7px; height:7px;
    border-color:var(--cyan); border-style:solid; opacity:0.85;
  }
  .kicker::before{ top:-1px; left:-1px; border-width:1.5px 0 0 1.5px; }
  .kicker::after{ bottom:-1px; right:-1px; border-width:0 1.5px 1.5px 0; }
  .kicker .dot{ width:6px; height:6px; border-radius:50%; background:var(--cyan); box-shadow:0 0 8px var(--cyan); }
  .h1{
    font-family:var(--font-display); font-weight:800;
    font-size:38px; letter-spacing:-0.02em; line-height:1.12;
    margin:0 0 6px 0; color:var(--text);
  }
  .h1 .accent{ color:var(--cyan); }
  .sub{
    font-size:17px; color:var(--muted); margin:0 0 24px 0; line-height:1.6; max-width:840px;
  }
  .body-scroll{
    flex:1; min-height:0; overflow:auto; padding-right:4px;
  }
  .body-scroll::-webkit-scrollbar{ width:8px; }
  .body-scroll::-webkit-scrollbar-thumb{ background:var(--panel-border); border-radius:8px; }
  p, li{ font-size:16.5px; line-height:1.68; color:#D3DAEA; }
  strong{ color:var(--text); }
  .grid{ display:grid; gap:16px; min-height:0; }
  .grid-2{ grid-template-columns: minmax(0,1fr) minmax(0,1fr); }
  .grid-3{ grid-template-columns: repeat(3, minmax(0,1fr)); }
  .grid-4{ grid-template-columns: repeat(4, minmax(0,1fr)); }
  .grid-5{ grid-template-columns: repeat(5, minmax(0,1fr)); }
  .card{
    background:var(--panel); border:1px solid var(--panel-border); border-radius:var(--radius);
    padding:18px 20px; min-width:0; position:relative;
  }
  .card h3{ margin:0 0 9px 0; font-size:17px; font-family:var(--font-display); font-weight:700; color:var(--text); display:flex; align-items:center; gap:10px;}
  .card p{ margin:0; font-size:16px; color:var(--muted); line-height:1.58; }
  .num-badge{
    width:24px; height:24px; border-radius:5px; flex-shrink:0;
    background:var(--cyan-dim); color:var(--cyan); border:1px solid rgba(55,214,192,0.35);
    display:flex; align-items:center; justify-content:center;
    font-family:var(--font-mono); font-size:13px; font-weight:700;
  }
  .badge-row{ display:flex; flex-wrap:wrap; gap:12px; margin-top:4px; }
  .badge{
    display:flex; align-items:center; gap:9px;
    background:var(--panel-2); border:1px solid var(--panel-border);
    padding:9px 16px 9px 10px; border-radius:22px; font-size:14.5px; color:var(--muted); font-family:var(--font-mono);
  }
  .badge svg{ width:24px; height:24px; flex-shrink:0; }
  .icon-inline{ display:inline-flex; align-items:center; justify-content:center; vertical-align:-0.3em; margin-right:9px; }
  .icon-inline svg{ width:1.3em; height:1.3em; }
  .callout{
    border-left:3px solid var(--amber); background:var(--amber-dim);
    border-radius:0 8px 8px 0; padding:14px 18px; margin-top:6px;
  }
  .callout .tag{ font-family:var(--font-mono); font-size:12.5px; letter-spacing:0.06em; color:var(--amber); text-transform:uppercase; display:block; margin-bottom:6px;}
  .callout p{ color:#EADFC8; margin:0; font-size:16.5px; line-height:1.6; }
  table{ width:100%; border-collapse:collapse; font-size:16px; }
  th{ text-align:left; font-family:var(--font-mono); font-size:12.5px; text-transform:uppercase; letter-spacing:0.05em; color:var(--muted-2); padding:0 14px 10px; border-bottom:1px solid var(--panel-border); font-weight:600;}
  td{ padding:12px 14px; border-bottom:1px solid var(--line); color:#D3DAEA; vertical-align:top;}
  tr:last-child td{ border-bottom:none; }
  td strong{ color:var(--cyan); }
  .diagram-wrap{ display:flex; align-items:center; justify-content:center; flex:1; min-height:0; }
  .code-row{ display:grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr); gap:16px; height:min(500px,58vh); min-height:0; }
  .code-row.single{ grid-template-columns: minmax(0,1fr); }
  .code-card{
    display:flex; flex-direction:column; height:100%; min-height:0;
    background:#0B111D; border:1px solid var(--panel-border); border-radius:var(--radius);
    overflow:hidden;
  }
  .code-head{
    flex-shrink:0; display:flex; align-items:center; justify-content:space-between;
    padding:10px 14px; border-bottom:1px solid var(--panel-border); background:var(--panel-2);
  }
  .code-head .fname{ font-family:var(--font-mono); font-size:13px; color:var(--muted); display:flex; gap:8px; align-items:center;}
  .dots{ display:flex; gap:5px; }
  .dots span{ width:8px; height:8px; border-radius:50%; background:#2A3450; }
  .copy-btn{
    font-family:var(--font-mono); font-size:12.5px; color:var(--muted);
    background:var(--panel); border:1px solid var(--panel-border); border-radius:6px;
    padding:5px 10px; cursor:pointer; transition: all 150ms ease;
  }
  .copy-btn:hover{ color:var(--cyan); border-color:var(--cyan); }
  .copy-btn.copied{ color:var(--ink); background:var(--cyan); border-color:var(--cyan); }
  .code-card pre{
    flex:1; min-height:0; overflow:auto; margin:0; padding:16px 18px;
    font-family:var(--font-mono); font-size:15px; line-height:1.65; color:#C6CFE4;
  }
  .code-card pre::-webkit-scrollbar{ width:8px; height:8px; }
  .code-card pre::-webkit-scrollbar-thumb{ background:var(--panel-border); border-radius:8px; }
  .panel-notes{ flex:1; min-height:0; overflow:auto; padding:16px 18px; font-size:16px; color:var(--muted); line-height:1.7; }
  .panel-notes h4{ margin:0 0 9px; color:var(--text); font-size:14.5px; font-family:var(--font-mono); text-transform:uppercase; letter-spacing:0.04em;}
  .panel-notes ul{ margin:0 0 14px 18px; padding:0; }
  .tok-kw{ color:#37D6C0; } .tok-str{ color:#F5A623; } .tok-com{ color:#5E6B8C; font-style:italic;}
  .tok-tag{ color:#EF6461; } .tok-attr{ color:#8FD6FF; } .tok-num{ color:#C9A6FF; } .tok-fn{ color:#8FD6FF; }
  .qa-grid{ display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  .qa-card{
    background:var(--panel); border:1px solid var(--panel-border); border-radius:var(--radius);
    padding:16px 18px;
  }
  .qa-card.centered{ grid-column: 1 / -1; max-width:560px; margin:0 auto; }
  .qa-num{ font-family:var(--font-mono); color:var(--cyan); font-size:13px; margin-bottom:7px; display:block;}
  .qa-q{ font-size:16.5px; color:var(--text); margin:0 0 12px; line-height:1.5; font-weight:600;}
  .qa-opts{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:7px;}
  .qa-opts li{ font-size:16px; color:#B9C2DA; padding:8px 11px; border:1px solid var(--panel-border); border-radius:6px; background:var(--panel-2); }
  .qa-opts li b{ color:var(--muted-2); font-family:var(--font-mono); margin-right:6px; }
  .id-card{ background:var(--panel); border:1px solid var(--panel-border); border-radius:var(--radius); padding:14px 16px;}
  .id-card .tag{ font-family:var(--font-mono); font-size:12px; color:var(--amber); text-transform:uppercase; letter-spacing:0.05em; margin-bottom:7px; display:block;}
  .id-card p{ margin:0; font-size:16px; color:#D3DAEA; line-height:1.55;}
  .answer-grid{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .ans-row{ display:flex; gap:10px; background:var(--panel); border:1px solid var(--panel-border); border-radius:10px; padding:12px 14px;}
  .ans-check{ width:24px; height:24px; border-radius:5px; background:var(--cyan-dim); color:var(--cyan); flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:13px; margin-top:2px;}
  .ans-body b{ display:block; font-size:16px; color:var(--text); margin-bottom:4px;}
  .ans-body span{ font-size:15px; color:var(--muted); line-height:1.5; }
  .quote-block{
    border-left:3px solid var(--cyan); padding:14px 22px; margin-bottom:16px; background:var(--panel);
    border-radius:0 10px 10px 0;
  }
  .quote-block p{ font-size:18px; color:var(--text); font-style:italic; margin:0 0 8px; line-height:1.55;}
  .quote-block .src{ font-family:var(--font-mono); font-size:12.5px; color:var(--cyan); text-transform:uppercase; letter-spacing:0.04em;}
  .title-slide{ text-align:left; }
  .title-slide .eyebrow-line{ display:flex; align-items:center; gap:14px; margin-bottom:26px; }
  .title-slide .rule{ height:1px; flex:1; background:linear-gradient(90deg, var(--cyan), transparent); }
  .title-slide h1{ font-family:var(--font-display); font-size:56px; font-weight:800; letter-spacing:-0.025em; line-height:1.06; margin:0 0 18px; }
  .title-slide h1 span{ color:var(--cyan); }
  .title-slide .desc{ font-size:17.5px; color:var(--muted); max-width:620px; line-height:1.6; margin-bottom:34px;}
  .closing-slide{ text-align:center; display:flex; flex-direction:column; align-items:center; justify-content:center; height:100%; }
  .closing-slide .quote{ font-family:var(--font-display); font-size:26px; font-weight:700; max-width:720px; line-height:1.4; color:var(--text); margin-bottom:22px;}
  .closing-slide .quote::before, .closing-slide .quote::after{ color:var(--cyan); }
  .closing-slide .bye{ font-size:17px; color:var(--muted); }
  .flow-analogy{ display:grid; grid-template-columns:1fr auto 1fr; gap:20px; align-items:stretch; }
  .flow-analogy .vs{ display:flex; align-items:center; justify-content:center; font-family:var(--font-mono); color:var(--muted-2); font-size:14px; }
  .col-title{ font-family:var(--font-mono); font-size:13px; text-transform:uppercase; letter-spacing:0.05em; margin-bottom:10px; display:flex; align-items:center; gap:8px;}

  /* progress + chrome */
  #progress-track{ position:fixed; top:0; left:0; width:100%; height:3px; background:rgba(148,169,209,0.12); z-index:50; }
  #progress-fill{ height:100%; background:linear-gradient(90deg, var(--cyan), var(--amber)); transition: width 350ms ease; position:relative; }
  #progress-fill::after{ content:""; position:absolute; right:-3px; top:-2.5px; width:8px; height:8px; border-radius:50%; background:var(--amber); box-shadow:0 0 8px var(--amber); }
  #counter{
    position:fixed; bottom:22px; right:28px; font-family:var(--font-mono); font-size:12px; color:var(--muted-2);
    z-index:50; letter-spacing:0.03em; background:rgba(10,14,23,0.6); padding:5px 10px; border-radius:6px; border:1px solid var(--panel-border);
  }
  #counter b{ color:var(--cyan); }
  #hint{
    position:fixed; bottom:22px; left:28px; font-family:var(--font-mono); font-size:11.5px; color:var(--muted-2);
    z-index:50; opacity:0.7;
  }
  #shortcuts-overlay{
    position:fixed; inset:0; background:rgba(6,9,16,0.82); backdrop-filter:blur(3px);
    display:none; align-items:center; justify-content:center; z-index:100;
  }
  #shortcuts-overlay.show{ display:flex; }
  .shortcuts-box{
    background:var(--panel); border:1px solid var(--panel-border); border-radius:14px; padding:28px 34px;
    max-width:420px; width:90%;
  }
  .shortcuts-box h2{ font-family:var(--font-display); font-size:19px; margin:0 0 16px; color:var(--text);}
  .shortcuts-box .row{ display:flex; justify-content:space-between; padding:10px 0; border-bottom:1px solid var(--line); font-size:15px; color:var(--muted); }
  .shortcuts-box .row:last-child{ border-bottom:none; }
  .shortcuts-box kbd{ font-family:var(--font-mono); background:var(--panel-2); border:1px solid var(--panel-border); padding:2px 8px; border-radius:5px; color:var(--text); font-size:12px;}
  @media (max-width:900px){
    .slide{ padding:40px 22px 70px; }
    .h1{ font-size:26px; }
    .title-slide h1{ font-size:34px; }
    .grid-2, .grid-3, .grid-4, .grid-5{ grid-template-columns:1fr; }
    .code-row{ grid-template-columns:1fr; height:auto; max-height:70vh; }
    .qa-grid, .answer-grid{ grid-template-columns:1fr; }
    .flow-analogy{ grid-template-columns:1fr; }
    .flow-analogy .vs{ padding:6px 0; }
    #hint{ display:none; }
  }
</style>
</head>
<body>

<div id="progress-track"><div id="progress-fill" style="width:0%"></div></div>
<div id="counter"><b id="cur">1</b> / <span id="tot">1</span></div>
<div id="hint">Right-click or → next &nbsp;·&nbsp; ← previous &nbsp;·&nbsp; ? for help</div>

<div id="deck"></div>

<div id="shortcuts-overlay">
  <div class="shortcuts-box">
    <h2>Keyboard &amp; mouse shortcuts</h2>
    <div class="row"><span>Next slide</span><span><kbd>→</kbd> or <kbd>Right-click</kbd> or <kbd>Mouse4</kbd></span></div>
    <div class="row"><span>Previous slide</span><span><kbd>←</kbd> or <kbd>Mouse3</kbd></span></div>
    <div class="row"><span>First slide</span><span><kbd>Home</kbd></span></div>
    <div class="row"><span>Last slide</span><span><kbd>End</kbd></span></div>
    <div class="row"><span>This overlay</span><span><kbd>?</kbd></span></div>
    <div class="row"><span>Swipe (mobile)</span><span>left / right</span></div>
  </div>
</div>

<script>
/* ============================= ICON LIBRARY (inline SVG badges) ============================= */
const ICONS = {
  nosql: `<svg viewBox="0 0 24 24" width="1.2em" height="1.2em" style="vertical-align:-0.22em;flex-shrink:0" fill="none" role="img"><title>NoSQL document icon</title><rect x="4" y="2" width="16" height="20" rx="2" stroke="#37D6C0" stroke-width="1.6"/><path d="M8 7h8M8 11h8M8 15h5" stroke="#37D6C0" stroke-width="1.6" stroke-linecap="round"/></svg>`,
  keyvalue: `<svg viewBox="0 0 24 24" width="1.2em" height="1.2em" style="vertical-align:-0.22em;flex-shrink:0" fill="none" role="img"><title>Key-value store icon</title><circle cx="8" cy="12" r="4.2" stroke="#F5A623" stroke-width="1.6"/><path d="M12 12h9M16 12v3M19 12v3" stroke="#F5A623" stroke-width="1.6" stroke-linecap="round"/></svg>`,
  column: `<svg viewBox="0 0 24 24" width="1.2em" height="1.2em" style="vertical-align:-0.22em;flex-shrink:0" fill="none" role="img"><title>Column-family database icon</title><rect x="3" y="4" width="4" height="16" rx="1" stroke="#8FD6FF" stroke-width="1.5"/><rect x="10" y="8" width="4" height="12" rx="1" stroke="#8FD6FF" stroke-width="1.5"/><rect x="17" y="2" width="4" height="18" rx="1" stroke="#8FD6FF" stroke-width="1.5"/></svg>`,
  graph: `<svg viewBox="0 0 24 24" width="1.2em" height="1.2em" style="vertical-align:-0.22em;flex-shrink:0" fill="none" role="img"><title>Graph database icon</title><circle cx="5" cy="6" r="2.4" stroke="#C9A6FF" stroke-width="1.5"/><circle cx="19" cy="6" r="2.4" stroke="#C9A6FF" stroke-width="1.5"/><circle cx="12" cy="18" r="2.4" stroke="#C9A6FF" stroke-width="1.5"/><path d="M7 7.4L10.2 16M17 7.4L13.8 16M7.4 6h9.2" stroke="#C9A6FF" stroke-width="1.4"/></svg>`,
  kotlin: `<svg viewBox="0 0 24 24" width="1.2em" height="1.2em" style="vertical-align:-0.22em;flex-shrink:0" role="img"><title>Kotlin logo</title><path d="M2 2h20L12 12l10 10H2z" fill="url(#kg)"/><defs><linearGradient id="kg" x1="2" y1="2" x2="22" y2="22"><stop offset="0" stop-color="#37D6C0"/><stop offset="0.5" stop-color="#8FD6FF"/><stop offset="1" stop-color="#F5A623"/></linearGradient></defs></svg>`,
  driver: `<svg viewBox="0 0 24 24" width="1.2em" height="1.2em" style="vertical-align:-0.22em;flex-shrink:0" fill="none" role="img"><title>Device driver icon</title><rect x="3" y="9" width="18" height="6" rx="1.5" stroke="#EF6461" stroke-width="1.6"/><circle cx="7.5" cy="12" r="1.3" fill="#EF6461"/><circle cx="12" cy="12" r="1.3" fill="#EF6461"/><path d="M3 5.5h18M3 18.5h18" stroke="#EF6461" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="1 3"/></svg>`,
  html: `<svg viewBox="0 0 24 24" width="1.2em" height="1.2em" style="vertical-align:-0.22em;flex-shrink:0" role="img"><title>HTML icon</title><path d="M4 3l1.6 17L12 22l6.4-2L20 3H4z" fill="#F5A623" opacity="0.18"/><path d="M4 3l1.6 17L12 22l6.4-2L20 3H4z" stroke="#F5A623" stroke-width="1.4" fill="none"/><path d="M7 7h10l-.4 4H8l.2 2h9l-.6 6.4-4.6 1.4-4.6-1.4-.3-3" stroke="#F5A623" stroke-width="1.3" fill="none"/></svg>`,
  gear: `<svg viewBox="0 0 24 24" width="1.2em" height="1.2em" style="vertical-align:-0.22em;flex-shrink:0" fill="none" role="img"><title>Operating system icon</title><circle cx="12" cy="12" r="3" stroke="#8FD6FF" stroke-width="1.5"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1" stroke="#8FD6FF" stroke-width="1.5" stroke-linecap="round"/></svg>`,
};

function badge(icon, label){
  return `<div class="badge">${ICONS[icon]||''}<span>${label}</span></div>`;
}

/* ============================= SYNTAX HIGHLIGHTER (single pass) ============================= */
function esc(s){ return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

function highlight(code, lang){
  code = esc(code);
  if(lang === 'kotlin' || lang === 'javascript' || lang === 'js'){
    const kw = lang==='kotlin' // legacy fallback
      ? /\b(fun|val|var|if|else|return|class|object|null|true|false|for|while|when|import|package|companion|private|public)\b/g
      : /\b(function|const|let|var|if|else|return|new|class|for|while|null|true|false|typeof|document|window)\b/g;
    code = code.replace(/(\/\/.*$)/gm, '§C§$1§/C§');
    code = code.replace(/("(?:[^"\\]|\\.)*"|'(?:[^'\\]|\\.)*')/g, '§S§$1§/S§');
    code = code.replace(kw, '§K§$1§/K§');
    code = code.replace(/\b(\d+(?:\.\d+)?)\b/g, '§N§$1§/N§');
    code = code.replace(/\b([a-zA-Z_][\w]*)(?=\()/g, '§F§$1§/F§');
  } else if(lang === 'html'){
    code = code.replace(/(&lt;!--[\s\S]*?--&gt;)/g, '§C§$1§/C§');
    code = code.replace(/(&lt;\/?)([a-zA-Z0-9-]+)/g, '$1§T§$2§/T§');
    code = code.replace(/([a-zA-Z-]+)(=)("(?:[^"\\]|\\.)*")/g, '§A§$1§/A§$2§S§$3§/S§');
  } else if(lang === 'css'){
    code = code.replace(/([.#]?[a-zA-Z0-9_-]+)(\s*\{)/g, '§F§$1§/F§$2');
    code = code.replace(/([a-zA-Z-]+)(:)/g, '§A§$1§/A§$2');
  }
  code = code
    .replace(/§C§/g,'<span class="tok-com">').replace(/§\/C§/g,'</span>')
    .replace(/§S§/g,'<span class="tok-str">').replace(/§\/S§/g,'</span>')
    .replace(/§K§/g,'<span class="tok-kw">').replace(/§\/K§/g,'</span>')
    .replace(/§N§/g,'<span class="tok-num">').replace(/§\/N§/g,'</span>')
    .replace(/§F§/g,'<span class="tok-fn">').replace(/§\/F§/g,'</span>')
    .replace(/§T§/g,'<span class="tok-tag">').replace(/§\/T§/g,'</span>')
    .replace(/§A§/g,'<span class="tok-attr">').replace(/§\/A§/g,'</span>');
  return code;
}

let copyCounter = 0;
function codeCard(title, lang, code){
  const id = 'code-' + (copyCounter++);
  return `<div class="code-card">
    <div class="code-head">
      <div class="fname"><span class="dots"><span></span><span></span><span></span></span>${title}</div>
      <button class="copy-btn" onclick="copyCode('${id}', this)">Copy</button>
    </div>
    <pre id="${id}" data-raw="${encodeURIComponent(code)}">${highlight(code, lang)}</pre>
  </div>`;
}
function copyCode(id, btn){
  const raw = decodeURIComponent(document.getElementById(id).dataset.raw);
  navigator.clipboard.writeText(raw).then(()=>{
    const prev = btn.textContent;
    btn.textContent = 'Copied!'; btn.classList.add('copied');
    setTimeout(()=>{ btn.textContent = prev; btn.classList.remove('copied'); }, 1400);
  });
}

/* ============================= RENDER & NAVIGATION ============================= */
const deckEl = document.getElementById('deck');
let current = 0;
SLIDES.forEach((html, i)=>{
  const div = document.createElement('div');
  div.className = 'slide';
  div.innerHTML = `<div class="slide-inner-wrap" style="width:100%;height:100%;display:flex;">${html}</div>`;
  deckEl.appendChild(div);
});
const slideEls = Array.from(document.querySelectorAll('.slide'));
document.getElementById('tot').textContent = SLIDES.length;

function render(prevIndex){
  slideEls.forEach((el, i)=>{
    el.classList.remove('active','leaving-back');
    if(i === current){
      el.classList.add('active');
      if(prevIndex !== undefined && prevIndex > current) el.classList.add('leaving-back');
    }
  });
  document.getElementById('cur').textContent = current + 1;
  document.getElementById('progress-fill').style.width = ((current+1)/SLIDES.length*100) + '%';
}
function goTo(i){
  const prev = current;
  current = Math.max(0, Math.min(SLIDES.length-1, i));
  render(prev);
}
function next(){ if(current < SLIDES.length-1) goTo(current+1); }
function prev(){ if(current > 0) goTo(current-1); }

render();

/* ============================= INPUT HANDLING ============================= */
document.addEventListener('keydown', (e)=>{
  if(e.key === '?' ){ toggleShortcuts(); return; }
  if(document.getElementById('shortcuts-overlay').classList.contains('show')){
    if(e.key === 'Escape') toggleShortcuts();
    return;
  }
  if(e.key === 'ArrowRight' || e.key === ' '){ next(); e.preventDefault(); }
  else if(e.key === 'ArrowLeft'){ prev(); e.preventDefault(); }
  else if(e.key === 'Home'){ goTo(0); e.preventDefault(); }
  else if(e.key === 'End'){ goTo(SLIDES.length-1); e.preventDefault(); }
});

function toggleShortcuts(){
  document.getElementById('shortcuts-overlay').classList.toggle('show');
}
document.getElementById('shortcuts-overlay').addEventListener('click', (e)=>{
  if(e.target.id === 'shortcuts-overlay') toggleShortcuts();
});

// Right-click = next (left-click stays free for selection/buttons)
document.addEventListener('contextmenu', (e)=>{ e.preventDefault(); next(); });

// Block browser back/forward mouse buttons (Mouse3/Mouse4) at capture, and repurpose them
document.addEventListener('mousedown', (e)=>{
  if(e.button === 3 || e.button === 4){
    e.preventDefault();
    e.stopImmediatePropagation();
  }
}, true);
document.addEventListener('mouseup', (e)=>{
  if(e.button === 3){ prev(); e.preventDefault(); e.stopImmediatePropagation(); }
  else if(e.button === 4){ next(); e.preventDefault(); e.stopImmediatePropagation(); }
}, true);
window.addEventListener('popstate', (e)=>{ /* prevent history nav from disrupting deck */ });

// Swipe support
let touchStartX = null;
document.addEventListener('touchstart', (e)=>{ touchStartX = e.touches[0].clientX; }, {passive:true});
document.addEventListener('touchend', (e)=>{
  if(touchStartX === null) return;
  const dx = e.changedTouches[0].clientX - touchStartX;
  if(Math.abs(dx) > 50){ dx < 0 ? next() : prev(); }
  touchStartX = null;
}, {passive:true});
</script>
