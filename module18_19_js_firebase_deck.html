<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Module 18-19 — JavaScript Core &amp; Firebase</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#07090f;--surf:#0d1220;--card:#101828;--card2:#16212e;--bord:#1a2d42;--bord2:#22364e;
  --a1:#38bdf8;--a2:#a78bfa;--a3:#34d399;--gold:#fbbf24;--rose:#fb7185;--violet:#c084fc;
  --fire:#FFCA28;--txt:#eef4ff;--mute:#6b84aa;--dim:#374e6c;
  --r:13px;--ff:'Segoe UI',system-ui,-apple-system,sans-serif;--mono:'Cascadia Code','Fira Code',Consolas,monospace;
}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--txt);font-family:var(--ff)}
#prog{position:fixed;top:0;left:0;height:3px;background:linear-gradient(90deg,var(--a2),var(--fire),var(--a3));z-index:900;transition:width .3s ease;box-shadow:0 0 8px var(--a2)}
#ctr{position:fixed;bottom:18px;right:22px;font-size:13px;color:var(--mute);z-index:900;letter-spacing:.05em;font-weight:600}
#hint{position:fixed;bottom:18px;left:22px;font-size:13px;color:var(--dim);z-index:900}
#deck{width:100%;height:100%;position:relative;overflow:hidden}
.slide{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;padding:48px 62px;opacity:0;pointer-events:none;transition:opacity .35s ease,transform .35s ease;transform:translateX(54px);overflow-y:auto}
.slide.active{opacity:1;pointer-events:all;transform:translateX(0)}
.slide.out{opacity:0;transform:translateX(-54px)}
@media(prefers-reduced-motion:reduce){.slide{transition:opacity .15s;transform:none!important}}
.W{width:100%;max-width:1420px;min-width:0;margin-top:auto;margin-bottom:auto}
.eye{font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--a2);margin-bottom:9px}
.T{font-size:clamp(27px,3.6vw,50px);font-weight:900;line-height:1.08;margin-bottom:7px}
.sub{font-size:clamp(15px,1.2vw,18px);color:var(--mute);margin-bottom:22px;line-height:1.55}
.hr{width:46px;height:3px;background:linear-gradient(90deg,var(--a2),var(--fire));border-radius:2px;margin-bottom:22px}
.card{background:var(--card);border:1px solid var(--bord);border-radius:var(--r);padding:18px 22px}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.badge{display:inline-flex;align-items:center;font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;padding:3px 10px;border-radius:20px;margin-bottom:6px}
.qt{background:var(--card);border-left:4px solid var(--a2);border-radius:0 var(--r) var(--r) 0;padding:18px 26px;font-style:italic;font-size:clamp(15px,1.2vw,18px);line-height:1.7}
.qt cite{display:block;font-size:15px;font-style:normal;color:var(--mute);margin-top:9px;font-weight:600}
table{width:100%;border-collapse:collapse;font-size:15px}
th{background:var(--bord);color:var(--a2);text-align:left;padding:10px 14px;font-size:12px;letter-spacing:.07em;text-transform:uppercase;font-weight:700}
td{padding:10px 14px;border-bottom:1px solid var(--bord);vertical-align:middle;line-height:1.55}
tr:last-child td{border-bottom:none}
td strong{color:var(--a2)}
.code-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;height:min(560px,62vh);align-items:stretch}
.cw{background:#060a10;border:1px solid #182030;border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;height:100%}
.ch{display:flex;align-items:center;justify-content:space-between;padding:9px 15px;background:#0b1018;border-bottom:1px solid #182030;flex-shrink:0}
.cl{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--dim)}
.cpbtn{font-size:12px;padding:4px 12px;border-radius:6px;border:1px solid var(--bord2);background:var(--card2);color:var(--mute);cursor:pointer;font-family:var(--ff);transition:all .15s}
.cpbtn:hover{background:var(--bord);color:var(--txt)}
.cpbtn.ok{background:#082a1e;color:#34d399;border-color:#34d399}
pre{flex:1;overflow:auto;min-height:0;padding:17px 20px;font-family:var(--mono);font-size:13px;line-height:1.7;color:#c8d8f0}
.kw{color:#f472b6}.at{color:#7dd3fc}.st{color:#86efac}.tg{color:#60a5fa}.cm{color:#374e6c;font-style:italic}.fn{color:#c084fc}.nm{color:#fda4af}
.fr{display:flex;gap:12px;padding:9px 0;border-bottom:1px solid var(--bord);align-items:flex-start}
.fr:last-child{border-bottom:none}
.fi{min-width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0;background:var(--card2)}
.ft h4{font-size:15px;font-weight:700;margin-bottom:2px}
.ft p{font-size:14px;color:var(--mute);line-height:1.5}
.qcard{background:var(--card);border:1px solid var(--bord);border-radius:var(--r);padding:14px 18px}
.qnum{font-size:11px;font-weight:700;color:var(--a2);letter-spacing:.08em;text-transform:uppercase;margin-bottom:4px}
.qtext{font-size:15px;font-weight:600;line-height:1.4;margin-bottom:9px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.opt{background:var(--bg);border:1px solid var(--bord);border-radius:7px;padding:7px 11px;font-size:14px;color:var(--mute);line-height:1.4}
.opt span{color:var(--a2);font-weight:700;margin-right:4px}
.idq{background:var(--card);border:1px solid var(--bord);border-radius:var(--r);padding:13px 17px;display:flex;gap:12px;align-items:flex-start}
.idn{min-width:26px;height:26px;background:var(--a2);color:#06080e;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;flex-shrink:0;margin-top:2px}
.idt{font-size:15px;line-height:1.55}
.blank{display:inline-block;width:120px;border-bottom:1.5px solid var(--a2);margin:0 5px;vertical-align:bottom}
.ar{display:flex;align-items:flex-start;gap:11px;padding:8px 0;border-bottom:1px solid var(--bord)}
.ar:last-child{border-bottom:none}
.an{min-width:32px;font-size:12px;font-weight:700;color:var(--a2)}
.aa{font-size:14px;font-weight:700;color:#34d399;min-width:185px;flex-shrink:0}
.ae{font-size:14px;color:var(--mute);line-height:1.45}
.ri{display:flex;gap:11px;padding:8px 0;align-items:flex-start}
.ric{min-width:28px;height:28px;background:var(--a2);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0}
.rit{font-size:15px;line-height:1.55}
#modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:9999;align-items:center;justify-content:center}
#modal.show{display:flex}
.mbox{background:var(--surf);border:1px solid var(--bord2);border-radius:16px;padding:30px 38px;min-width:340px}
.mbox h3{font-size:18px;font-weight:800;margin-bottom:18px}
.mrow{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--bord);font-size:14px}
.mrow:last-child{border-bottom:none}
.mrow span:first-child{color:var(--mute)}
kbd{background:var(--card);border:1px solid var(--bord2);border-radius:5px;padding:2px 7px;font-size:11px;font-family:var(--mono)}
.mclose{display:block;text-align:center;margin-top:18px;font-size:13px;color:var(--mute);cursor:pointer}
.mclose:hover{color:var(--txt)}
.grad{background:linear-gradient(135deg,#e8d8ff,#a78bfa 40%,#FFCA28);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
</style>

vely in <strong style="color:var(--txt)">browsers</strong> and on the server via <strong style="color:var(--txt)">Node.js</strong>. The backbone of the modern web, offering concise syntax and a massive ecosystem.</div></div><div class="qt" style="border-color:var(--a2)">Think of JavaScript as the universal language of the web — one language for the browser, the server, mobile apps (React Native), and even desktop apps (Electron).<cite>— Module Analogy</cite></div></div><div style="display:flex;flex-direction:column;gap:13px"><div class="card" style="border-left:4px solid var(--a3)"><div style="font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--a3);margin-bottom:9px">Key Features at a Glance</div><div style="display:flex;flex-direction:column;gap:8px;font-size:15px"><div>&#128737; <strong>Null Safety</strong> — eliminates NullPointerException crashes</div><div>&#128269; <strong>Type Inference</strong> — compiler deduces types automatically</div><div>&#128268; <strong>Extension Functions</strong> — add methods to existing classes</div><div>&#128230; <strong>Data Classes</strong> — auto-generate equals, hashCode, toString</div><div>&#127919; <strong>Smart Casts</strong> — automatic casting after type checks</div><div>&#9889; <strong>Coroutines</strong> — asynchronous code in sequential style</div></div></div><div style="display:flex;gap:10px;flex-wrap:wrap"><div style="display:flex;align-items:center;justify-content:center;flex-direction:column;gap:4px"><svg style="width:34px;height:34px;display:inline-block;vertical-align:middle;margin-right:6px;flex-shrink:0" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 448 512" width="48" height="48" role="img"><title>Node.js</title><path fill="#339933" d="M224 508c-6.7 0-13.5-1.8-19.4-5.2l-61.7-36.5c-9.2-5.1-4.7-6.9-1.7-7.9 12.3-4.3 14.8-5.3 27.9-12.8 1.4-.8 3.2-.5 4.6.4l47.4 28.1c1.7 1 4.1 1 5.7 0l184.7-106.6c1.7-1 2.8-3 2.8-5V149.3c0-2.1-1.1-4-2.9-5.1L226.8 37.7c-1.7-1-4-1-5.7 0L36.6 144.3 `<div class="W"><div class="eye">JavaScript Core · Features A &amp; B</div><div class="T">Async/Await &amp; Template Literals</div><div class="hr"></div><div class="code-grid"><div style="display:flex;flex-direction:column;gap:14px;height:100%;overflow:auto"><div class="card" style="border-top:3px solid var(--rose);flex-shrink:0"><div style="font-size:13px;font-weight:700;color:var(--rose);letter-spacing:.08em;text-transform:uppercase;margin-bottom:9px">A. Async/Await</div><div style="font-size:15px;color:var(--mute);line-height:1.65">Eliminates <strong style="color:var(--txt)">NullPointerException</strong> — the "billion-dollar mistake". Add <code style="background:var(--bord);padding:1px 5px;border-radius:3px;font-family:var(--mono);color:var(--a3)">?</code> to declare a nullable type. Forces you to handle null proactively at compile time — no runtime crashes.</div></div><div class="card" style="border-top:3px solid var(--a1);flex-shrink:0"><div style="font-size:13px;font-weight:700;color:var(--a1);letter-spacing:.08em;text-transform:uppercase;margin-bottom:9px">B. Template Literals</div><div style="font-size:15px;color:var(--mute);line-height:1.65">Embed expressions directly inside strings using backticks and <code style="background:var(--bord);padding:1px 5px;border-radius:3px;font-family:var(--mono);color:var(--a3)">\${}</code> — <strong style="color:var(--txt)">no more string concatenation</strong>. Supports multi-line strings natively.</div></div></div><div class="cw"><div style="display:flex;align-items:center;justify-content:center;flex-direction:column;gap:4px"><svg style="width:34px;height:34px;display:inline-block;vertical-align:middle;margin-right:6px;flex-shrink:0" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 448 512" width="48" height="48" role="img"><title>Node.js</title><path fill="#339933" d="M224 508c-6.7 0-13.5-1.8-19.4-5.2l-61.7-36.5c-9.2-5.1-4.7-6.9-1.7-7.9 12.3-4.3 14.8-5.3 27.9-12.8 1.4-.8 3.2-.5 4.6.4l47.4 28.1c1.7 1 4.1 1 5.7 0l184.7-106.6c1.7-1 2.8-3 2.8-5V149.3c0-2.1-1.1-4-2.9-5.1L226.8 37.7c-1.7-1-4-1-5.7 0L36.6 144.3c-1.8 1.1-2.9 3-2.9 5.1v213.1c0 2 1.1 4 2.9 4.9l50.6 29.2c27.5 13.7 44.3-2.4 44.3-18.7V167.5c0-3 2.4-5.3 5.4-5.3h23.4c2.9 0 5.4 2.3 5.4 5.3V378c0 36.6-20 57.6-54.7 57.6-10.7 0-19.1 0-42.5-11.6l-48.4-27.9C8.1 389.2.7 376.3.7 362.4V149.3c0-13.8 7.4-26.8 19.4-33.7L184.6 9c11.7-6.6 27.2-6.6 38.8 0l164.5 106.7c12 6.9 19.4 19.8 19.4 33.7v213.1c0 13.8-7.4 26.7-19.4 33.7L243.4 502.8c-5.9 3.4-12.6 5.2-19.4 5.2zm51.5-147.4c-80.9 0-97.8-37.2-97.8-68.4 0-3 2.4-5.3 5.4-5.3h23.9c2.7 0 4.9 1.9 5.4 4.5 3.7 24.9 14.7 37.4 63.4 37.4 39 0 55.6-8.8 55.6-29.5 0-11.9-4.7-20.8-65.4-26.7-50.8-5-82.2-16.2-82.2-56.8 0-37.4 31.5-59.7 84.3-59.7 59.3 0 88.5 20.6 92.2 64.9.1 1.5-.4 3-1.4 4.1-1 1.1-2.4 1.7-3.9 1.7h-24c-2.5 0-4.7-1.8-5.3-4.2-5.8-25.7-19.8-33.9-57.7-33.9-42.5 0-47.4 14.8-47.4 25.9 0 13.5 5.8 17.4 63.4 25 57 7.5 84.2 18.1 84.2 58.1-.1 40.6-33.8 63.6-92.5 63.6z"/></svg><span style="font-size:11px;color:var(--mute)">Node.js</span></div><pre id="pre1"><span class="cm">// A. Async/Await</span>
<span class="kw">async</span> <span class="kw">function</span> <span class="fn">fetchUser</span>() {
  <span class="kw">try</span> {
    <span class="kw">const</span> res = <span class="kw">await</span> <span class="fn">fetch</span>(<span class="st">'/api/user'</span>);
    <span class="kw">const</span> data = <span class="kw">await</span> res.<span class="fn">json</span>();
    <span class="fn">console</span>.<span class="fn">log</span>(data);
  } <span class="kw">catch</span> (err) {
    <span class="fn">console</span>.<span class="fn">error</span>(<span class="st">'Error:'</span>, err);
  }
}

<span class="cm">// B. Template Literals</span>
<span class="kw">const</span> name = <span class="st">'Callista'</span>;
<span class="kw">const</span> age  = <span class="st">30</span>;

<span class="cm">// No concatenation needed</span>
<span class="fn">console</span>.<span class="fn">log</span>(<span class="st">\`Hello, <span class="kw">\${name}</span>! You are <span class="kw">\${age}</span> years old.\`</span>);

<span class="cm">// Multi-line string</span>
<span class="kw">const</span> html = <span class="st">\`
  &lt;div&gt;
    &lt;p&gt;Name: <span class="kw">\${name}</span>&lt;/p&gt;
  &lt;/div&gt;
\`</span>;</pre></div></div></div>`,

`<div class="W"><div class="eye">JavaScript Core · Features C &amp; D</div><div class="T">Arrow Functions &amp; Destructuring</div><div class="hr"></div><div class="code-grid"><div style="display:flex;flex-direction:column;gap:14px;height:100%;overflow:auto"><div class="card" style="border-top:3px solid var(--violet);flex-shrink:0"><div style="font-size:13px;font-weight:700;color:var(--violet);letter-spacing:.08em;text-transform:uppercase;margin-bottom:9px">C. Arrow Functions</div><div style="font-size:15px;color:var(--mute);line-height:1.65">A concise syntax for writing functions using <code style="background:var(--bord);padding:1px 5px;border-radius:3px;font-family:var(--mono);color:var(--a3)">=&gt;</code>. Arrow functions inherit <strong style="color:var(--txt)"><code>this</code></strong> from their surrounding scope — no more binding issues.</div></div><div class="card" style="border-top:3px solid var(--gold);flex-shrink:0"><div style="font-size:13px;font-weight:700;color:var(--gold);letter-spacing:.08em;text-transform:uppercase;margin-bottom:9px">D. Destructuring</div><div style="font-size:15px;color:var(--mute);line-height:1.65">Unpack <strong style="color:var(--txt)">arrays or objects</strong> into variables in a single line. Works with function parameters, default values, and nested structures — less repetitive property access.</div></div></div><div class="cw"><div style="display:flex;align-items:center;justify-content:center;flex-direction:column;gap:4px"><svg style="width:34px;height:34px;display:inline-block;vertical-align:middle;margin-right:6px;flex-shrink:0" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 448 512" width="48" height="48" role="img"><title>Node.js</title><path fill="#339933" d="M224 508c-6.7 0-13.5-1.8-19.4-5.2l-61.7-36.5c-9.2-5.1-4.7-6.9-1.7-7.9 12.3-4.3 14.8-5.3 27.9-12.8 1.4-.8 3.2-.5 4.6.4l47.4 28.1c1.7 1 4.1 1 5.7 0l184.7-106.6c1.7-1 2.8-3 2.8-5V149.3c0-2.1-1.1-4-2.9-5.1L226.8 37.7c-1.7-1-4-1-5.7 0L36.6 144.3c-1.8 1.1-2.9 3-2.9 5.1v213.1c0 2 1.1 4 2.9 4.9l50.6 29.2c27.5 13.7 44.3-2.4 44.3-18.7V167.5c0-3 2.4-5.3 5.4-5.3h23.4c2.9 0 5.4 2.3 5.4 5.3V378c0 36.6-20 57.6-54.7 57.6-10.7 0-19.1 0-42.5-11.6l-48.4-27.9C8.1 389.2.7 376.3.7 362.4V149.3c0-13.8 7.4-26.8 19.4-33.7L184.6 9c11.7-6.6 27.2-6.6 38.8 0l164.5 106.7c12 6.9 19.4 19.8 19.4 33.7v213.1c0 13.8-7.4 26.7-19.4 33.7L243.4 502.8c-5.9 3.4-12.6 5.2-19.4 5.2zm51.5-147.4c-80.9 0-97.8-37.2-97.8-68.4 0-3 2.4-5.3 5.4-5.3h23.9c2.7 0 4.9 1.9 5.4 4.5 3.7 24.9 14.7 37.4 63.4 37.4 39 0 55.6-8.8 55.6-29.5 0-11.9-4.7-20.8-65.4-26.7-50.8-5-82.2-16.2-82.2-56.8 0-37.4 31.5-59.7 84.3-59.7 59.3 0 88.5 20.6 92.2 64.9.1 1.5-.4 3-1.4 4.1-1 1.1-2.4 1.7-3.9 1.7h-24c-2.5 0-4.7-1.8-5.3-4.2-5.8-25.7-19.8-33.9-57.7-33.9-42.5 0-47.4 14.8-47.4 25.9 0 13.5 5.8 17.4 63.4 25 57 7.5 84.2 18.1 84.2 58.1-.1 40.6-33.8 63.6-92.5 63.6z"/></svg><span style="font-size:11px;color:var(--mute)">Node.js</span></div><pre id="pre2"><span class="cm">// C. Arrow Functions</span>
<span class="cm">// Traditional function</span>
<span class="kw">function</span> <span class="fn">square</span>(x) { <span class="kw">return</span> x * x; }

<span class="cm">// Arrow function — same thing, shorter</span>
<span class="kw">const</span> square = x => x * x;

<span class="cm">// Arrow with multiple params</span>
<span class="kw">const</span> add = (a, b) => a + b;
<span class="fn">console</span>.<span class="fn">log</span>(<span class="fn">add</span>(3, 7)); <span class="cm">// 10</span>

<span class="cm">// D. Destructuring</span>
<span class="cm">// Object destructuring</span>
<span class="kw">const</span> user = { name: <span class="st">'Callista'</span>, age: 30 };
<span class="kw">const</span> { name, age } = user;
<span class="fn">console</span>.<span class="fn">log</span>(name, age); <span class="cm">// Callista 30</span>

<span class="cm">// Array destructuring</span>
<span class="kw">const</span> [first, second] = [<span class="st">'alpha'</span>, <span class="st">'beta'</span>];
<span class="fn">console</span>.<span class="fn">log</span>(first); <span class="cm">// alpha</span></pre></div></div></div>`,

`<div class="W"><div class="eye">JavaScript Core · Features E, F &amp; G</div><div class="T">Modules, Spread Operator &amp; the Event Loop</div><div class="hr"></div><div class="code-grid"><div style="display:flex;flex-direction:column;gap:11px;height:100%;overflow:auto"><div class="card" style="border-left:3px solid var(--a3);flex-shrink:0"><div style="font-size:13px;font-weight:700;color:var(--a3);letter-spacing:.08em;text-transform:uppercase;margin-bottom:6px">E. ES6 Modules</div><div style="font-size:15px;color:var(--mute);line-height:1.55">Use <code style="background:var(--bord);padding:1px 4px;border-radius:3px;font-family:var(--mono);font-size:12px">export</code> and <code style="background:var(--bord);padding:1px 4px;border-radius:3px;font-family:var(--mono);font-size:12px">import</code> to share code across files. Keeps concerns separated, enables tree-shaking, and makes large codebases <strong style="color:var(--txt)">maintainable</strong>.</div></div><div class="card" style="border-left:3px solid var(--a1);flex-shrink:0"><div style="font-size:13px;font-weight:700;color:var(--a1);letter-spacing:.08em;text-transform:uppercase;margin-bottom:6px">F. Spread Operator</div><div style="font-size:15px;color:var(--mute);line-height:1.55">The <code style="background:var(--bord);padding:1px 4px;border-radius:3px;font-family:var(--mono);font-size:12px">...</code> syntax expands arrays or objects. Use it to clone, merge, or pass items to functions — powerful with higher-order functions like <code style="background:var(--bord);padding:1px 4px;border-radius:3px;font-family:var(--mono);font-size:12px">map</code>, <code style="background:var(--bord);padding:1px 4px;border-radius:3px;font-family:var(--mono);font-size:12px">filter</code>, <code style="background:var(--bord);padding:1px 4px;border-radius:3px;font-family:var(--mono);font-size:12px">reduce</code>.</div></div><div class="card" style="border-left:3px solid var(--a2);flex-shrink:0"><div style="font-size:13px;font-weight:700;color:var(--a2);letter-spacing:.08em;text-transform:uppercase;margin-bottom:6px">G. Event Loop</div><div style="font-size:15px;color:var(--mute);line-height:1.55">JavaScript is single-threaded but non-blocking. The <strong style="color:var(--txt)">Event Loop</strong> queues async callbacks, keeping the UI responsive while I/O tasks run in the background.</div></div></div><div class="cw"><div style="display:flex;align-items:center;justify-content:center;flex-direction:column;gap:4px"><svg style="width:34px;height:34px;display:inline-block;vertical-align:middle;margin-right:6px;flex-shrink:0" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 448 512" width="48" height="48" role="img"><title>Node.js</title><path fill="#339933" d="M224 508c-6.7 0-13.5-1.8-19.4-5.2l-61.7-36.5c-9.2-5.1-4.7-6.9-1.7-7.9 12.3-4.3 14.8-5.3 27.9-12.8 1.4-.8 3.2-.5 4.6.4l47.4 28.1c1.7 1 4.1 1 5.7 0l184.7-106.6c1.7-1 2.8-3 2.8-5V149.3c0-2.1-1.1-4-2.9-5.1L226.8 37.7c-1.7-1-4-1-5.7 0L36.6 144.3c-1.8 1.1-2.9 3-2.9 5.1v213.1c0 2 1.1 4 2.9 4.9l50.6 29.2c27.5 13.7 44.3-2.4 44.3-18.7V167.5c0-3 2.4-5.3 5.4-5.3h23.4c2.9 0 5.4 2.3 5.4 5.3V378c0 36.6-20 57.6-54.7 57.6-10.7 0-19.1 0-42.5-11.6l-48.4-27.9C8.1 389.2.7 376.3.7 362.4V149.3c0-13.8 7.4-26.8 19.4-33.7L184.6 9c11.7-6.6 27.2-6.6 38.8 0l164.5 106.7c12 6.9 19.4 19.8 19.4 33.7v213.1c0 13.8-7.4 26.7-19.4 33.7L243.4 502.8c-5.9 3.4-12.6 5.2-19.4 5.2zm51.5-147.4c-80.9 0-97.8-37.2-97.8-68.4 0-3 2.4-5.3 5.4-5.3h23.9c2.7 0 4.9 1.9 5.4 4.5 3.7 24.9 14.7 37.4 63.4 37.4 39 0 55.6-8.8 55.6-29.5 0-11.9-4.7-20.8-65.4-26.7-50.8-5-82.2-16.2-82.2-56.8 0-37.4 31.5-59.7 84.3-59.7 59.3 0 88.5 20.6 92.2 64.9.1 1.5-.4 3-1.4 4.1-1 1.1-2.4 1.7-3.9 1.7h-24c-2.5 0-4.7-1.8-5.3-4.2-5.8-25.7-19.8-33.9-57.7-33.9-42.5 0-47.4 14.8-47.4 25.9 0 13.5 5.8 17.4 63.4 25 57 7.5 84.2 18.1 84.2 58.1-.1 40.6-33.8 63.6-92.5 63.6z"/></svg><span style="font-size:11px;color:var(--mute)">Node.js</span></div><pre id="pre3"><span class="cm">// E. ES6 Modules</span>
<span class="cm">// math.js — export</span>
<span class="kw">export</span> <span class="kw">const</span> PI = 3.14159;
<span class="kw">export function</span> <span class="fn">double</span>(n) { <span class="kw">return</span> n * 2; }

<span class="cm">// main.js — import</span>
<span class="kw">import</span> { PI, double } <span class="kw">from</span> <span class="st">'./math.js'</span>;
<span class="fn">console</span>.<span class="fn">log</span>(<span class="fn">double</span>(PI)); <span class="cm">// 6.28318</span>

<span class="cm">// F. Spread Operator</span>
<span class="kw">const</span> nums = [1, 2, 3];
<span class="kw">const</span> more = [...nums, 4, 5];
<span class="fn">console</span>.<span class="fn">log</span>(more); <span class="cm">// [1, 2, 3, 4, 5]</span>

<span class="cm">// G. Event Loop</span>
<span class="fn">console</span>.<span class="fn">log</span>(<span class="st">'start'</span>);
<span class="fn">setTimeout</span>(() => <span class="fn">console</span>.<span class="fn">log</span>(<span class="st">'async'</span>), 0);
<span class="fn">console</span>.<span class="fn">log</span>(<span class="st">'end'</span>);
<span class="cm">// Output: start → end → async</span></pre></div></div></div>`,

<span class="kw">import</span> { initializeApp } <span class="kw">from</span> <span class="st">'firebase/app'</span>;
<span class="kw">import</span> { getFirestore, doc, getDoc } <span class="kw">from</span> <span class="st">'firebase/firestore'</span>;

<span class="cm">// Step 4: Initialize + get Firestore reference</span>
<span class="kw">const</span> app = <span class="fn">initializeApp</span>(firebaseConfig);

}

<span class="cm">// Arrow function</span>
<span class="kw">const</span> isEven = n => n % 2 === 0;

<span class="fn">console</span>.<span class="fn">log</span>(<span class="fn">isEven</span>(10)); <span class="cm">// true</span>
<span class="fn">console</span>.<span class="fn">log</span>(<span class="fn">isEven</span>(5));  <span class="cm">// false</span>
<span class="fn">console</span>.<span class="fn">log</span>(<span class="fn">isEven</span>(4));  <span class="cm">// true</span>

<span class="cm">// Bonus: use with filter</span>
<span class="kw">const</span> nums = [1, 2, 3, 4, 5, 6];
<span class="kw">const</span> evens = nums.<span class="fn">filter</span>(isEven);
<span class="fn">console</span>.<span class="fn">log</span>(evens); <span class="cm">// [2, 4, 6]</span></pre></div><div class="cw"><div style="display:flex;align-items:center;justify-content:center;flex-direction:column;gap:4px"><svg style="width:34px;height:34px;display:inline-block;vertical-align:middle;margin-right:6px;flex-shrink:0" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 448 512" width="48" height="48" role="img"><title>Node.js</title><path fill="#339933" d="M224 508c-6.7 0-13.5-1.8-19.4-5.2l-61.7-36.5c-9.2-5.1-4.7-6.9-1.7-7.9 12.3-4.3 14.8-5.3 27.9-12.8 1.4-.8 3.2-.5 4.6.4l47.4 28.1c1.7 1 4.1 1 5.7 0l184.7-106.6c1.7-1 2.8-3 2.8-5V149.3c0-2.1-1.1-4-2.9-5.1L226.8 37.7c-1.7-1-4-1-5.7 0L36.6 144.3c-1.8 1.1-2.9 3-2.9 5.1v213.1c0 2 1.1 4 2.9 4.9l50.6 29.2c27.5 13.7 44.3-2.4 44.3-18.7V167.5c0-3 2.4-5.3 5.4-5.3h23.4c2.9 0 5.4 2.3 5.4 5.3V378c0 36.6-20 57.6-54.7 57.6-10.7 0-19.1 0-42.5-11.6l-48.4-27.9C8.1 389.2.7 376.3.7 362.4V149.3c0-13.8 7.4-26.8 19.4-33.7L184.6 9c11.7-6.6 27.2-6.6 38.8 0l164.5 106.7c12 6.9 19.4 19.8 19.4 33.7v213.1c0 13.8-7.4 26.7-19.4 33.7L243.4 502.8c-5.9 3.4-12.6 5.2-19.4 5.2zm51.5-147.4c-80.9 0-97.8-37.2-97.8-68.4 0-3 2.4-5.3 5.4-5.3h23.9c2.7 0 4.9 1.9 5.4 4.5 3.7 24.9 14.7 37.4 63.4 37.4 39 0 55.6-8.8 55.6-29.5 0-11.9-4.7-20.8-65.4-26.7-50.8-5-82.2-16.2-82.2-56.8 0-37.4 31.5-59.7 84.3-59.7 59.3 0 88.5 20.6 92.2 64.9.1 1.5-.4 3-1.4 4.1-1 1.1-2.4 1.7-3.9 1.7h-24c-2.5 0-4.7-1.8-5.3-4.2-5.8-25.7-19.8-33.9-57.7-33.9-42.5 0-47.4 14.8-47.4 25.9 0 13.5 5.8 17.4 63.4 25 57 7.5 84.2 18.1 84.2 58.1-.1 40.6-33.8 63.6-92.5 63.6z"/></svg><span style="font-size:11px;color:var(--mute)">Node.js</span></div><pre id="pre6"><span class="cm">// Drill 2: Destructuring + Async/Await</span>

<span class="cm">// Object representing a vehicle</span>
<span class="kw">const</span> vehicle = { type: <span class="st">'Motorcycle'</span>, wheels: 2 };

<span class="cm">// Destructure properties</span>
<span class="kw">const</span> { type, wheels } = vehicle;
<span class="fn">console</span>.<span class="fn">log</span>(<span class="st">\`This <span class="kw">\${type}</span> has <span class="kw">\${wheels}</span> wheels.\`</span>);

<span class="cm">// Async fetch simulation</span>
<span class="kw">async function</span> <span class="fn">getVehicle</span>() {
  <span class="kw">const</span> res  = <span class="kw">await</span> <span class="fn">fetch</span>(<span class="st">'/api/vehicle'</span>);
  <span class="kw">const</span> { type, wheels } = <span class="kw">await</span> res.<span class="fn">json</span>();
  <span class="fn">console</span>.<span class="fn">log</span>(<span class="st">\`\${type} — \${wheels} wheels\`</span>);
}
<span class="fn">getVehicle</span>();</pre></div></div></div>`,

`<div class="W"><div class="eye">Real-World Application · Analogies</div><div class="T">Connecting Concepts to Real Life</div><div class="hr"></div><div class="g2" style="gap:18px;align-items:start"><div style="display:flex;flex-direction:column;gap:14px"><div style="font-size:15px;font-weight:700;color:var(--a2);letter-spacing:.06em;text-transform:uppercase;margin-bottom:4px">Async/Await = The Delivery Driver</div><div class="card" style="border-left:3px solid var(--a2)"><div style="font-size:15px;color:var(--mute);line-height:1.65"><strong style="color:var(--rose)">Callback approach:</strong> "Start driving; when you arrive, honk to start the next delivery." Honks pile up, and you're stuck waiting in nested traffic.<br><br><strong style="color:var(--a3)">Async/Await approach:</strong> Hands you a clipboard: "Wait here until the package arrives, then drive." Reads sequentially — no nested honking.</div></div><div style="font-size:15px;font-weight:700;color:var(--violet);letter-spacing:.06em;text-transform:uppercase;margin-top:4px;margin-bottom:4px">Arrow Functions = Compact Delivery Note</div><div class="card" style="border-left:3px solid var(--violet)"><div style="font-size:15px;color:var(--mute);line-height:1.65">Traditional functions are full delivery manifests. Arrow functions are compact sticky notes — <strong style="color:var(--txt)">same instruction, half the paper</strong>. And they always remember whose desk they came from (lexical <code>this</code>).</div></div></div><div style="display:flex;flex-direction:column;gap:14px"><div style="font-size:15px;font-weight:700;color:var(--fire);letter-spacing:.06em;text-transform:uppercase;margin-bottom:4px"><img src="data:image/svg+xml;base64,PHN2ZyBmaWxsPSIjRkZDQTI4IiB3aWR0aD0iNDgiIGhlaWdodD0iNDgiIHJvbGU9ImltZyIgdmlld0JveD0iMCAwIDI0IDI0IiB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciPjx0aXRsZT5GaXJlYmFzZTwvdGl0bGU+PHBhdGggZD0iTTE5LjQ1NSA4LjM2OWMtLjUzOC0uNzQ4LTEuNzc4LTIuMjg1LTMuNjgxLTQuNTY5LS44MjYtLjk5MS0xLjUzNS0xLj `<div class="W"><div class="eye">Lesson Wrap-Up · FAQs</div><div class="T">Frequently Asked Questions</div><div class="hr"></div><div style="display:flex;flex-direction:column;gap:13px;max-width:920px"><div class="card" style="border-left:3px solid var(--a2)"><div style="font-size:14px;font-weight:700;color:var(--a2);margin-bottom:7px">Q1 — Who uses JavaScript at scale?</div><div style="font-size:15px;color:var(--mute);line-height:1.65">Virtually every major web company — Google, Facebook, Netflix, Airbnb, and GitHub. JavaScript powers the front end of the entire web and, via Node.js, large-scale server backends too.</div></div><div class="card" style="border-left:3px solid var(--fire)"><div style="font-size:14px;font-weight:700;color:var(--fire);margin-bottom:7px">Q2 — Why is JavaScript considered cross-platform?</div><div style="font-size:15px;color:var(--mute);line-height:1.65">JavaScript runs natively in every browser, on any OS. Node.js brings it to the server. Frameworks like React Native and Electron extend it to mobile and desktop — <strong style="color:var(--txt)">one language, every platform</strong>.</div></div><div class="card" style="border-left:3px solid var(--a3)"><div style="font-size:14px;font-weight:700;color:var(--a3);margin-bottom:7px">Q3 — Can JavaScript be used with MongoDB or other NoSQL databases?</div><div style="font-size:15px;color:var(--mute);line-height:1.65">Yes. The official MongoDB Node.js driver and the Mongoose ODM let you query MongoDB with JavaScript's async/await syntax. Documents map naturally to JS objects, making NoSQL a very natural fit for JavaScript development.</div></div></div></div>`,

`<div class="W"><div class="eye">Skill-Building Check · Activities</div><div class="T">Multiple Choice</div><div class="sub">Select the best answer — answers on the Answer Key slide.</div><div class="g2" style="gap:11px"><div class="qcard"><div class="qnum">Question 1</div><div class="qtext">Which JavaScript feature unpacks arrays or objects into named variables in a single line?</div><div class="opts"><div class="opt"><span>A.</span>Arrow Functions</div><div class="opt"><span>B.</span>Destructuring</div><div class="opt"><span>C.</span>Template Literals</div><div class="opt"><span>D.</span>Modules</div></div></div><div class="qcard"><div class="qnum">Question 2</div><div class="qtext">JavaScript's Async/Await is built on top of which concept?</div><div class="opts"><div class="opt"><span>A.</span>Callbacks only</div><div class="opt"><span>B.</span>Generators</div><div class="opt"><span>C.</span>Promises</div><div class="opt"><span>D.</span>The DOM</div></div></div><div class="qcard"><div class="qnum">Question 3</div><div class="qtext">Which JavaScript syntax allows you to expand arrays or objects in place?</div><div class="opts"><div class="opt"><span>A.</span>Destructuring</div><div class="opt"><span>B.</span>Arrow Functions</div><div class="opt"><span>C.</span>Spread Operator</div><div class="opt"><span>D.</span>Template Literals</div></div></div><div class="qcard"><div class="qnum">Question 4</div><div class="qtext">Which JavaScript feature lets you split code across files using export and import?</div><div class="opts"><div class="opt"><span>A.</span>Data Classes</div><div class="opt"><span>B.</span>Extension Functions</div><div class="opt"><span>C.</span>Coroutines</div><div class="opt"><span>D.</span>ES6 Modules</div></div></div><div class="qcard"><div class="qnum">Question 5</div><div class="qtext">What is the Google-provided platform discussed in this module that offers a JS SDK for web apps?</div><div class="opts"><div class="opt"><span>A.</span>JavaScript</div><div class="opt"><span>B.</span>Firebase</div><div class="opt"><span>C.</span>Node.js</div><div class="opt"><span>D.</span>VS Code</div></div></div><div class="qcard"><div class="qnum">Question 6</div><div class="qtext">Why is the Event Loop important in JavaScript development?</div><div class="opts"><div class="opt"><span>A.</span>To make the app less secure</div><div class="opt"><span>B.</span>To create extension functions</div><div class="opt"><span>C.</span>To handle async tasks without blocking the main thread</div><div class="opt"><span>D.</span>To store data offline</div></div></div><div class="qcard" style="grid-column:span 2"><div class="qnum">Question 7</div><div class="qtext">What does "Firebase KTX" primarily provide?</div><div class="opts"><div class="opt"><span>A.</span>A new programming language</div><div class="opt"><span>B.</span>JavaScript-friendly APIs and async support for Firebase services</div><div class="opt"><span>C.</span>A way to migrate from JS to Python</div><div class="opt"><span>D.</span>A database replacement</div></div></div></div></div>`,

`<div class="W"><div class="eye">Skill-Building Check · Activities</div><div class="T">Identification</div><div class="sub">Fill in the blank with the correct Kotlin feature, Firebase service, or concept.</div><div style="display:flex;flex-direction:column;gap:10px"><div class="idq"><div class="idn">1</div><div class="idt">This JavaScript feature lets you write async code that reads like synchronous code, using the keywords async and await. It is called <span class="blank"></span>.</div></div><div class="idq"><div class="idn">2</div><div class="idt">In JavaScript, you can write functions using the concise <code style="background:var(--bord);padding:1px 5px;border-radius:3px;font-family:var(--mono);font-size:13px">=></code> syntax that also fixes the <code style="background:var(--bord);padding:1px 5px;border-radius:3px;font-family:var(--mono);font-size:13px">this</code> binding. This is called <span class="blank"></span>.</div></div><div class="idq"><div class="idn">3</div><div class="idt">The JavaScript syntax used to unpack arrays or objects into individual variables in a single line is called <span class="blank"></span>.</div></div><div class="idq"><div class="idn">4</div><div class="idt">JavaScript's mechanism that schedules and runs async callbacks without blocking the main thread is called <span class="blank"></span>.</div></div><div class="idq"><div class="idn">5</div><div class="idt">Google's official set of JavaScript libraries for connecting web apps to Firebase services — enabling async data fetching and real-time updates — is called <span class="blank"></span>.</div></div></div></div>`,

`<div class="W"><div class="eye">Answer Key</div><div class="T">Activity Answers &amp; Explanations</div><div class="hr"></div><div class="g2" style="gap:18px;align-items:start"><div><div style="font-size:12px;font-weight:700;color:var(--a2);letter-spacing:.09em;text-transform:uppercase;margin-bottom:10px">Multiple Choice</div><div class="card" style="padding:12px 16px"><div class="ar"><div class="an">Q1</div><div class="aa">B. Destructuring</div><div class="ae">Destructuring unpacks arrays/objects into named variables — tailor-made for working with data with zero repetition.</div></div><div class="ar"><div class="an">Q2</div><div class="aa">C. Promises</div><div class="ae">Async/Await is syntactic sugar built on top of Promises — it makes promise chains readable as sequential code.</div></div><div class="ar"><div class="an">Q3</div><div class="aa">C. Arrow Functions</div><div class="ae">Extension functions extend a class with new methods without inheriting from it or modifying its source.</div></div><div class="ar"><div class="an">Q4</div><div class="aa">D. ES6 Modules</div><div class="ae">ES6 Modules use export and import to share code across files — enabling modular, maintainable codebases.</div></div><div class="ar"><div class="an">Q5</div><div class="aa">B. Firebase</div><div class="ae">Firebase is Google's comprehensive BaaS platform with a first-class JavaScript SDK for web apps.</div></div><div class="ar"><div class="an">Q6</div><div class="aa">C. Async tasks, non-blocking</div><div class="ae">The Event Loop queues async callbacks, keeping the main thread free while I/O tasks run in the background.</div></div><div class="ar"><div class="an">Q7</div><div class="aa">B. JavaScript-friendly Firebase APIs</div><div class="ae">The Firebase JS SDK provides JavaScript-first APIs with async/await support for Firestore, Auth, Storage, and more.</div></div></div></div><div><div style="font-size:12px;font-weight:700;color:var(--fire);letter-spacing:.09em;text-transform:uppercase;margin-bottom:10px">Identification</div><div class="card" style="padding:12px 16px"><div class="ar"><div class="an">I1</div><div class="aa">Async/Await</div><div class="ae">async marks a function as returning a Promise; await pauses execution inside it until the Promise resolves — no callbacks needed.</div></div><div class="ar"><div class="an">I2</div><div class="aa">Arrow Functions</div><div class="ae">Written as (params) => expression — concise, and they inherit <code>this</code> from their enclosing scope, solving the classic <code>this</code> binding problem.</div></div><div class="ar"><div class="an">I3</div><div class="aa">Destructuring</div><div class="ae">Array: const [a, b] = arr; Object: const { name, age } = obj — both unpack values into named variables in one line.</div></div><div class="ar"><div class="an">I4</div><div class="aa">Event Loop</div><div class="ae">The Event Loop continuously checks the call stack and the callback queue, pushing queued async callbacks onto the stack when it's empty.</div></div><div class="ar"><div class="an">I5</div><div class="aa">Firebase JS SDK</div><div class="ae">The Firebase JS SDK (firebase npm package) provides modular APIs for Firestore, Auth, Storage, and more — all async/await friendly.</div></div></div></div></div></div>`,

let cur = 0;
const total = S.length;
const deck = document.getElementById('deck');
const prog = document.getElementById('prog');
const ctr  = document.getElementById('ctr');

function build() {
  S.forEach((html, i) => {
    const el = document.createElement('div');
    el.className = 'slide' + (i === 0 ? ' active' : '');
    el.innerHTML = html;
    deck.appendChild(el);
  });
  ui();
}

function all() { return deck.querySelectorAll('.slide'); }

function go(n, dir) {
  if (n < 0 || n >= total) return;
  const ss = all();
  ss[cur].classList.remove('active');
  ss[cur].classList.add('out');
  setTimeout(() => ss[cur].classList.remove('out'), 380);
  cur = n;
  const nx = ss[cur];
  nx.style.transform = dir === 'f' ? 'translateX(54px)' : 'translateX(-54px)';
  nx.classList.add('active');
  requestAnimationFrame(() => requestAnimationFrame(() => { nx.style.transform = ''; }));
  ui();
}

function ui() {
  prog.style.width = ((cur + 1) / total * 100) + '%';
  ctr.textContent  = (cur + 1) + ' / ' + total;
}

function next() { go(cur + 1, 'f'); }
function prev() { go(cur - 1, 'b'); }

document.addEventListener('keydown', e => {
  if      (e.key === 'ArrowRight' || e.key === 'ArrowDown')  next();
  else if (e.key === 'ArrowLeft'  || e.key === 'ArrowUp')    prev();
  else if (e.key === 'Home')  go(0, 'b');
  else if (e.key === 'End')   go(total - 1, 'f');
  else if (e.key === '?' || e.key === '/') document.getElementById('modal').classList.toggle('show');
  else if (e.key === 'Escape') document.getElementById('modal').classList.remove('show');
});

['contextmenu','auxclick'].forEach(ev =>
  document.addEventListener(ev, e => { e.preventDefault(); e.stopImmediatePropagation(); }, { capture:true, passive:false })
);
document.addEventListener('mousedown', e => {
  if (e.target.closest('button,a,input,select,textarea,label')) return;
  if      (e.button === 2) { e.preventDefault(); e.stopImmediatePropagation(); next(); }
  else if (e.button === 3) { e.preventDefault(); e.stopImmediatePropagation(); prev(); }
  else if (e.button === 4) { e.preventDefault(); e.stopImmediatePropagation(); next(); }
}, { capture:true, passive:false });

let tx = null;
document.addEventListener('touchstart', e => { tx = e.touches[0].clientX; }, { passive:true });
document.addEventListener('touchend', e => {
  if (tx === null) return;
  const dx = e.changedTouches[0].clientX - tx;
  if (Math.abs(dx) > 42) dx < 0 ? next() : prev();
  tx = null;
}, { passive:true });

document.getElementById('mclose').addEventListener('click', () =>
  document.getElementById('modal').classList.remove('show')
);

function doCopy(preId, btnId) {
  const pre = document.getElementById(preId);
  const btn = document.getElementById(btnId);
  navigator.clipboard.writeText(pre.innerText).then(() => {
    btn.textContent = 'Copied!';
    btn.classList.add('ok');
    setTimeout(() => { btn.textContent = 'Copy'; btn.classList.remove('ok'); }, 2200);
  });
}

build();
</script>
