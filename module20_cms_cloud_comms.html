<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Module 20 — CMS &amp; Cloud Communications</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#070a0f;--surf:#0d1320;--card:#101c2c;--card2:#162234;--bord:#1c2e44;--bord2:#243650;
  --a1:#38bdf8;--a2:#a78bfa;--a3:#34d399;--gold:#fbbf24;--rose:#fb7185;
  --wp:#21759B;--jo:#F44321;--dr:#0678BE;--tw:#F22F46;--gm:#EA4335;--google:#4285F4;
  --txt:#eef4ff;--mute:#6b84aa;--dim:#374e6c;
  --r:13px;--ff:'Segoe UI',system-ui,-apple-system,sans-serif;--mono:'Cascadia Code','Fira Code',Consolas,monospace;
}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--txt);font-family:var(--ff)}
#prog{position:fixed;top:0;left:0;height:3px;background:linear-gradient(90deg,var(--wp),var(--tw),var(--gm));z-index:900;transition:width .3s ease;box-shadow:0 0 8px var(--wp)}
#ctr{position:fixed;bottom:18px;right:22px;font-size:13px;color:var(--mute);z-index:900;letter-spacing:.05em;font-weight:600}
#hint{position:fixed;bottom:18px;left:22px;font-size:13px;color:var(--dim);z-index:900}
#deck{width:100%;height:100%;position:relative;overflow:hidden}
.slide{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;padding:48px 62px;opacity:0;pointer-events:none;transition:opacity .35s ease,transform .35s ease;transform:translateX(54px);overflow-y:auto}
.slide.active{opacity:1;pointer-events:all;transform:translateX(0)}
.slide.out{opacity:0;transform:translateX(-54px)}
@media(prefers-reduced-motion:reduce){.slide{transition:opacity .15s;transform:none!important}}
.W{width:100%;max-width:1420px;min-width:0;margin-top:auto;margin-bottom:auto}
.eye{font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--a1);margin-bottom:9px}
.T{font-size:clamp(27px,3.6vw,50px);font-weight:900;line-height:1.08;margin-bottom:7px}
.sub{font-size:clamp(15px,1.2vw,18px);color:var(--mute);margin-bottom:22px;line-height:1.55}
.hr{width:46px;height:3px;background:linear-gradient(90deg,var(--wp),var(--dr));border-radius:2px;margin-bottom:22px}
.card{background:var(--card);border:1px solid var(--bord);border-radius:var(--r);padding:18px 22px}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.qt{background:var(--card);border-left:4px solid var(--a1);border-radius:0 var(--r) var(--r) 0;padding:18px 26px;font-style:italic;font-size:clamp(15px,1.2vw,18px);line-height:1.7}
.qt cite{display:block;font-size:15px;font-style:normal;color:var(--mute);margin-top:9px;font-weight:600}
table{width:100%;border-collapse:collapse;font-size:15px}
th{background:var(--bord);color:var(--a1);text-align:left;padding:10px 14px;font-size:12px;letter-spacing:.07em;text-transform:uppercase;font-weight:700}
td{padding:10px 14px;border-bottom:1px solid var(--bord);vertical-align:middle;line-height:1.55}
tr:last-child td{border-bottom:none}
.code-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;height:min(560px,62vh);align-items:stretch}
.cw{background:#060a10;border:1px solid #182030;border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;height:100%}
.ch{display:flex;align-items:center;justify-content:space-between;padding:9px 15px;background:#0b1018;border-bottom:1px solid #182030;flex-shrink:0}
.cl{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--dim)}
.cpbtn{font-size:12px;padding:4px 12px;border-radius:6px;border:1px solid var(--bord2);background:var(--card2);color:var(--mute);cursor:pointer;font-family:var(--ff);transition:all .15s}
.cpbtn:hover{background:var(--bord);color:var(--txt)}
.cpbtn.ok{background:#082a1e;color:#34d399;border-color:#34d399}
pre{flex:1;overflow:auto;min-height:0;padding:17px 20px;font-family:var(--mono);font-size:13px;line-height:1.7;color:#c8d8f0}
.kw{color:#f472b6}.at{color:#7dd3fc}.st{color:#86efac}.tg{color:#60a5fa}.cm{color:#374e6c;font-style:italic}.fn{color:#c084fc}.nm{color:#fda4af}
.fr{display:flex;gap:12px;padding:9px 0;border-bottom:1px solid var(--bord);align-items:flex-start}
.fr:last-child{border-bottom:none}
.fi{min-width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0;background:var(--card2)}
.ft h4{font-size:15px;font-weight:700;margin-bottom:2px}
.ft p{font-size:14px;color:var(--mute);line-height:1.5}
.qcard{background:var(--card);border:1px solid var(--bord);border-radius:var(--r);padding:14px 18px}
.qnum{font-size:11px;font-weight:700;color:var(--a1);letter-spacing:.08em;text-transform:uppercase;margin-bottom:4px}
.qtext{font-size:15px;font-weight:600;line-height:1.4;margin-bottom:9px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.opt{background:var(--bg);border:1px solid var(--bord);border-radius:7px;padding:7px 11px;font-size:14px;color:var(--mute);line-height:1.4}
.opt span{color:var(--a1);font-weight:700;margin-right:4px}
.idq{background:var(--card);border:1px solid var(--bord);border-radius:var(--r);padding:13px 17px;display:flex;gap:12px;align-items:flex-start}
.idn{min-width:26px;height:26px;background:var(--a1);color:#06080e;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;flex-shrink:0;margin-top:2px}
.idt{font-size:15px;line-height:1.55}
.blank{display:inline-block;width:120px;border-bottom:1.5px solid var(--a1);margin:0 5px;vertical-align:bottom}
.ar{display:flex;align-items:flex-start;gap:11px;padding:8px 0;border-bottom:1px solid var(--bord)}
.ar:last-child{border-bottom:none}
.an{min-width:32px;font-size:12px;font-weight:700;color:var(--a1)}
.aa{font-size:14px;font-weight:700;color:#34d399;min-width:160px;flex-shrink:0}
.ae{font-size:14px;color:var(--mute);line-height:1.45}
.ri{display:flex;gap:11px;padding:8px 0;align-items:flex-start}
.ric{min-width:28px;height:28px;background:var(--a2);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0}
.rit{font-size:15px;line-height:1.55}
#modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:9999;align-items:center;justify-content:center}
#modal.show{display:flex}
.mbox{background:var(--surf);border:1px solid var(--bord2);border-radius:16px;padding:30px 38px;min-width:340px}
.mbox h3{font-size:18px;font-weight:800;margin-bottom:18px}
.mrow{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--bord);font-size:14px}
.mrow:last-child{border-bottom:none}
.mrow span:first-child{color:var(--mute)}
kbd{background:var(--card);border:1px solid var(--bord2);border-radius:5px;padding:2px 7px;font-size:11px;font-family:var(--mono)}
.mclose{display:block;text-align:center;margin-top:18px;font-size:13px;color:var(--mute);cursor:pointer}
.mclose:hover{color:var(--txt)}
.grad{background:linear-gradient(135deg,#e0f0ff,var(--wp) 35%,var(--tw) 65%,var(--gm));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
</style>
</head>

`<div class="W"><div class="eye">Main Lesson · Core Concept</div><div class="T">What is a Content Management System?</div><div class="hr"></div><div class="g2" style="gap:18px;align-items:start"><div><div class="card" style="border-left:4px solid var(--a1);margin-bottom:14px"><div style="font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--a1);margin-bottom:8px">Definition</div><div style="font-size:15px;line-height:1.7">A <strong style="color:var(--a1)">Content Management System (CMS)</strong> is computer software designed to manage the creation and modification of digital content. It <strong style="color:var(--txt)">separates the website's design (look/feel) from its content (text, images, videos)</strong> — so writers and business owners can update their site without knowing how to code.</div></div><div class="qt" style="border-color:var(--a1)">A CMS is like the difference between building a house from scratch vs. moving into one — you still decide where to put the furniture (your content), but the walls and roof are already done.<cite>— Module 20 Analogy</cite></div></div><div style="display:flex;flex-direction:column;gap:14px"><div class="card" style="border-left:4px solid var(--a3)"><div style="font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--a3);margin-bottom:9px">What a CMS Handles For You</div><div class="fr" style="padding:7px 0;border-bottom:1px solid var(--bord)"><div class="fi">&#128396;</div><div class="ft"><h4>Content Editing</h4><p>Rich text editors (like Gutenberg) let anyone write and format pages visually.</p></div></div><div class="fr" style="padding:7px 0;border-bottom:1px solid var(--bord)"><div class="fi">&#127912;</div><div class="ft"><h4>Design / Themes</h4><p>Change the entire visual look of a site by swapping a theme — no code needed.</p></div></div><div class="fr" style="padding:7px 0;border-bottom:1px solid var(--bord)"><div class="fi">&#128274;</div><div class=" t:800">WordPress</div><div style="font-size:13px;color:var(--mute)">The most popular CMS · 40%+ of the web</div></div></div><div style="font-size:15px;color:var(--mute);line-height:1.7">Originally a blogging platform, evolved into a versatile CMS capable of hosting blogs, business sites, e-commerce stores, and portfolios. Powers a massive portion of the internet.</div></div><div class="card" style="padding:14px 18px;background:transparent;border:1px dashed var(--bord2)"><div style="font-size:13px;font-weight:700;color:var(--wp);letter-spacing:.07em;text-transform:uppercase;margin-bottom:8px">Best For</div><div style="font-size:15px;color:var(--mute)">Beginner developers · Personal blogs · Small-to-medium business websites · Basic e-commerce</div></div></div><div class="card"><div style="font-size:12px;font-weight:700;color:var(--wp);letter-spacing:.08em;text-transform:uppercase;margin-bottom:12px">Key Features</div><div class="fr"><div class="fi">&#128640;</div><div class="ft"><h4>Beginner-Friendly</h4><p>Easy installation, intuitive admin dashboard, visual Gutenberg content editor.</p></div></div><div class="fr"><div class="fi">&#127758;</div><div class="ft"><h4>Massive Ecosystem</h4><p>Thousands of free and premium plugins (WooCommerce, contact forms, SEO) and themes.</p></div></div><div class="fr"><div class="fi">&#128101;</div><div class="ft"><h4>Community Support</h4><p>Largest CMS community — countless tutorials, forums, and online resources.</p></div></div><div class="fr"><div class="fi">&#128737;</div><div class="ft"><h4>Strong Security</h4><p>Active development team releases regular security patches and automated updates.</p></div></div><div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap"><div style="display:inline-flex;align-items:center;gap:6px;background:var(--card2);border:1px solid var(--bord);border-radius:8px;padding:5px 10px"><img src="data:image/svg+xml;base64,PHN2ZyBmaWxsPSIjOTY1ODhBIiB3aWR0aD0iNDgiIGhlaWdodD0iNDgiIHJvbGU9ImltZyIgdmlld <span class="kw">from</span> email.mime.text <span class="kw">import</span> MIMEText
<span class="kw">from</span> email.mime.multipart <span class="kw">import</span> MIMEMultipart

<span class="cm"># --- Configuration ---</span>
smtp_server = <span class="st">"smtp.gmail.com"</span>
smtp_port = <span class="nm">587</span>
sender_email = <span class="st">"your_email@gmail.com"</span>
password = <span class="st">"your_app_password_here"</span>

<span class="cm"># --- Message Construction ---</span>
receiver_email = <span class="st">"recipient_email@example.com"</span>
subject = <span class="st">"Google Mailer Notification"</span>
body = <span class="st">"Hello from Python! Free Twilio alternative."</span>

msg = <span class="fn">MIMEMultipart</span>()
msg[<span class="st">"From"</span>] = sender_email
msg[<span class="st">"To"</span>] = receiver_email
msg[<span class="st">"Subject"</span>] = subject
msg.<span class="fn">attach</span>(<span class="fn">MIMEText</span>(body, <span class="st">"plain"</span>))

<span class="cm"># --- Send the Email ---</span>
<span class="kw">try</span>:
    server = smtplib.<span class="fn">SMTP</span>(smtp_server, smtp_port)
    server.<span class="fn">starttls</span>()  <span class="cm"># Upgrade to TLS</span>
    server.<span class="fn">login</span>(sender_email, password)
    server.<span class="fn">sendmail</span>(
        sender_email,
        receiver_email,
        msg.<span class="fn">as_string</span>()
    )
    server.<span class="fn">quit</span>()
    <span class="fn">print</span>(<span class="st">"Email sent successfully!"</span>)
<span class="kw">except</span> <span class="at">Exception</span> <span class="kw">as</span> e:
    <span class="fn">print</span>(<span class="st">"Error: "</span>, e)</pre></div><div style="display:flex;flex-direction:column;gap:14px;overflow:auto;height:100%"><div class="card" style="flex-shrink:0"><div style="font-size:12px;font-weight:700;color:var(--gold);letter-spacing:.09em;text-transform:uppercase;margin-bottom:9px">How to Run</div><div style="display:flex;flex-direction:column;gap:7px;font-size:15px;color:var(--mute)"><div style="display:flex;gap:9px"><span style="color:var(--a1);font-weight:700;min-width:18px">1.</span>Install Python (any version 3.x)</div><div style="display:flex;gap:9px"><span style="color:var(--a1);font-weight:700;min-width:18px">2.</span>No extra packages needed — <code style="background:var(--bord);padding:1px 5px;border-radius:3px;font-family:var(--mono);font-size:12px">smtplib</code> is built-in</div><div style="display:flex;gap:9px"><span style="color:var(--a1);font-weight:700;min-width:18px">3.</span>Replace <code style="background:var(--bord);padding:1px 5px;border-radius:3px;font-family:var(--mono);font-size:12px">your_email</code> and <code style="background:var(--bord);padding:1px 5px;border-radius:3px;font-family:var(--mono);font-size:12px">your_app_password_here</code></div><div style="display:flex;gap:9px"><span style="color:var(--a1);font-weight:700;min-width:18px">4.</span>Run: <code style="background:var(--bord);padding:1px 5px;border-radius:3px;font-family:var(--mono);font-size:12px">python send_email.py</code></div></div></div><div class="card" style="border-left:3px solid var(--gm);flex-shrink:0"><div style="font-size:12px;font-weight:700;color:var(--gm);letter-spacing:.07em;text-transform:uppercase;margin-bottom:7px">What Each Part Does</div><div style="display:flex;flex-direction:column;gap:6px;font-size:14px;color:var(--mute)"><div><code style="background:var(--bord);padding:1px 4px;border-radius:3px;font-family:var(--mono);font-size:12px;color:var(--a3)">MIMEMultipart</code> — builds the email envelope (From `<div class="W"><div class="eye">Lesson Wrap-Up · FAQs</div><div class="T">Frequently Asked Questions</div><div class="hr"></div><div style="display:flex;flex-direction:column;gap:13px;max-width:920px"><div class="card" style="border-left:3px solid var(--wp)"><div style="font-size:14px;font-weight:700;color:var(--wp);margin-bottom:7px">Q1 — Can I move from WordPress to Joomla later?</div><div style="font-size:15px;color:var(--mute);line-height:1.65">Yes, but it is challenging. Each CMS organizes its database differently — migration requires scripts or automated tools for data conversion. It is much easier to <strong style="color:var(--txt)">choose the correct platform from the start</strong>.</div></div><div class="card" style="border-left:3px solid var(--tw)"><div style="font-size:14px;font-weight:700;color:var(--tw);margin-bottom:7px">Q2 — Do I need to know how to code to use Twilio?</div><div style="font-size:15px;color:var(--mute);line-height:1.65">Yes. While their documentation is excellent, Twilio is a <strong style="color:var(--txt)">developer tool</strong>. You need basic coding skills in Python, JavaScript, Java, or similar to make API calls. Their documentation provides ready-to-run samples to help you get started within minutes.</div></div><div class="card" style="border-left:3px solid var(--dr)"><div style="font-size:14px;font-weight:700;color:var(--dr);margin-bottom:7px">Q3 — Is a CMS more secure than a custom-coded website?</div><div style="font-size:15px;color:var(--mute);line-height:1.65">Not necessarily. A widely-used CMS like WordPress is frequently targeted by hackers. However, its massive community means security holes are quickly discovered and patched. <strong style="color:var(--txt)">Rule of thumb: keep your core, themes, and plugins 100% up to date</strong>.</div></div><div class="card" style="border-left:3px solid var(--gm)"><div style="font-size:14px;font-weight:700;color:var(--gm);margin-bottom:7px">Q4 — Why use Gmail SMTP instead of Twilio?</div><div style="font-size:15px;color:var(--mute);line-height:1.65">Twilio is the industry standard for global telephony but is a <strong style="color:var(--txt)">paid service</strong> (per SMS, per minute of voice). For students or hobbyists wanting to send automated alert messages for free, <strong style="color:var(--txt)">Google's Gmail SMTP</strong> is an excellent free alternative — sending emails instead of SMS.</div></div></div></div>`,

`<div class="W"><div class="eye">Skill-Building Check · Activities</div><div class="T">Multiple Choice</div><div class="sub">Select the best answer — answers on the Answer Key slide.</div><div class="g2" style="gap:11px"><div class="qcard"><div class="qnum">Question 1</div><div class="qtext">What is a "Communications Platform as a Service" (CPaaS) that developers use to integrate SMS, voice, and video into their apps?</div><div class="opts"><div class="opt"><span>A.</span>WordPress</div><div class="opt"><span>B.</span>Drupal</div><div class="opt"><span>C.</span>Twilio</div><div class="opt"><span>D.</span>Gmail</div></div></div><div class="qcard"><div class="qnum">Question 2</div><div class="qtext">Which type of software is used to manage the creation and modification of digital content without requiring deep coding knowledge?</div><div class="opts"><div class="opt"><span>A.</span>A Web Server</div><div class="opt"><span>B.</span>A Content Management System (CMS)</div><div class="opt"><span>C.</span>An Operating System</div><div class="opt"><span>D.</span>A Database Engine</div></div></div><div class="qcard"><div class="qnum">Question 3</div><div class="qtext">Which CMS is known for enterprise-grade scalability, strong built-in security, and ability to handle large complex websites with heavy traffic?</div><div class="opts"><div class="opt"><span>A.</span>WordPress</div><div class="opt"><span>B.</span>Joomla</div><div class="opt"><span>C.</span>Drupal</div><div class="opt"><span>D.</span>Twilio</div></div></div><div class="qcard"><div class="qnum">Question 4</div><div class="qtext">Which CMS is renowned for its flexibility, powerful built-in user management (ACL), and sits in the middle of the ease-of-use spectrum?</div><div class="opts"><div class="opt"><span>A.</span>WordPress</div><div class="opt"><span>B.</span>Joomla</div><div class="opt"><span>C.</span>Drupal</div><div class="opt"><span>D.</span>Magento</div></div></div><div class="qcard"><div class="qnum">Question 5</div><div class="qtext">Which CMS is the most popular globally, powers the largest portion of the internet, and is best suited for small-to-medium websites and beginners?</div><div class="opts"><div class="opt"><span>A.</span>Joomla</div><div class="opt"><span>B.</span>Drupal</div><div class="opt"><span>C.</span>WordPress</div><div class="opt"><span>D.</span>Twilio</div></div></div><div class="qcard"><div class="qnum">Question 6</div><div class="qtext">If you want to add Two-Factor Authentication (2FA) to your app via SMS, which service should you use?</div><div class="opts"><div class="opt"><span>A.</span>WordPress</div><div class="opt"><span>B.</span>Twilio</div><div class="opt"><span>C.</span>Gmail SMTP</div><div class="opt"><span>D.</span>Drupal</div></div></div><div class="qcard" style="grid-column:span 2"><div class="qnum">Question 7</div><div class="qtext">According to the supplementary guide, what is the primary free Google alternative to Twilio for sending automated alerts to users?</div><div class="opts"><div class="opt"><span>A.</span>Google Cloud Functions</div><div class="opt"><span>B.</span>Gmail's SMTP server</div><div class="opt"><span>C.</span>Firebase Authentication</div><div class="opt"><span>D.</span>Google Sites</div></div></div></div></div>`,

`<div class="W"><div class="eye">Skill-Building Check · Activities</div><div class="T">Identification</div><div class="sub">Fill in the blank with the correct CMS, service, or concept name.</div><div style="display:flex;flex-direction:column;gap:10px"><div class="idq"><div class="idn">1</div><div class="idt">This software separates a website's design from its content, allowing non-technical users to create and modify digital content without coding. It is called a <span class="blank"></span>.</div></div><div class="idq"><div class="idn">2</div><div class="idt">The most popular CMS in the world — powering over 40% of all websites — originally built as a blogging platform and best suited for beginners and small-to-medium businesses. It is called <span class="blank"></span>.</div></div><div class="idq"><div class="idn">3</div><div class="idt">The enterprise-grade CMS favored by governments, financial institutions, and news agencies for its built-in security, scalability, and advanced multilingual support including RTL languages. It is called <span class="blank"></span>.</div></div><div class="idq"><div class="idn">4</div><div class="idt">The cloud communications platform (CPaaS) that provides developer APIs for SMS, Voice, Video, WhatsApp, and 2FA integration into web and mobile applications. It is called <span class="blank"></span>.</div></div><div class="idq"><div class="idn">5</div><div class="idt">The free Python-based method for sending automated email alerts using Google's mail infrastructure — configured using a 16-character App Password instead of your regular Gmail password. This method uses <span class="blank"></span>.</div></div></div></div>`,

`<div class="W"><div class="eye">Answer Key</div><div class="T">Activity Answers &amp; Explanations</div><div class="hr"></div><div class="g2" style="gap:18px;align-items:start"><div><div style="font-size:12px;font-weight:700;color:var(--a1);letter-spacing:.09em;text-transform:uppercase;margin-bottom:10px">Multiple Choice</div><div class="card" style="padding:12px 16px"><div class="ar"><div class="an">Q1</div><div class="aa">C. Twilio</div><div class="ae">Twilio is the specific CPaaS mentioned that lets developers integrate communication channels seamlessly into apps.</div></div><div class="ar"><div class="an">Q2</div><div class="aa">B. CMS</div><div class="ae">A CMS separates content from design, allowing non-coders to manage websites through a visual admin interface.</div></div><div class="ar"><div class="an">Q3</div><div class="aa">C. Drupal</div><div class="ae">Drupal is the powerhouse CMS built for enterprise — used by governments, military, and high-traffic news sites.</div></div><div class="ar"><div class="an">Q4</div><div class="aa">B. Joomla</div><div class="ae">Joomla sits in the middle — advanced built-in ACL user management without needing the developer expertise that Drupal requires.</div></div><div class="ar"><div class="an">Q5</div><div class="aa">C. WordPress</div><div class="ae">WordPress is easiest to use, has the largest theme/plugin ecosystem, and is the top choice for beginners and small businesses.</div></div><div class="ar"><div class="an">Q6</div><div class="aa">B. Twilio</div><div class="ae">Twilio's dedicated APIs let you send OTP verification codes via SMS or Voice programmatically for 2FA.</div></div><div class="ar"><div class="an">Q7</div><div class="aa">B. Gmail's SMTP server</div><div class="ae">Gmail SMTP via Python's smtplib lets you send emails programmatically for free using Google's infrastructure.</div></div></div></div><div><div style="font-size:12px;font-weight:700;color:var(--gm);letter-spacing:.09em;text-transform:uppercase;margin-bottom:10px">Identification</div><div class="card" style="padding:12px 16px"><div class="ar"><div class="an">I1</div><div class="aa">CMS</div><div class="ae">Content Management System — software that separates design from content so anyone can manage a website without coding.</div></div><div class="ar"><div class="an">I2</div><div class="aa">WordPress</div><div class="ae">The world's most popular CMS, originally a blogging platform, now powering 40%+ of all websites on the internet.</div></div><div class="ar"><div class="an">I3</div><div class="aa">Drupal</div><div class="ae">Enterprise-grade CMS with built-in security, massive scalability, advanced multilingual including RTL — favored by governments.</div></div><div class="ar"><div class="an">I4</div><div class="aa">Twilio</div><div class="ae">Communications Platform as a Service (CPaaS) — APIs for SMS, Voice, Video, WhatsApp, and 2FA in web/mobile apps.</div></div><div class="ar"><div class="an">I5</div><div class="aa">Gmail SMTP (smtplib)</div><div class="ae">Python's built-in smtplib connects to smtp.gmail.com:587 using an App Password to send emails via Google's free infrastructure.</div></div></div></div></div></div>`,

let cur = 0;
const total = S.length;
const deck = document.getElementById('deck');
const prog = document.getElementById('prog');
const ctr  = document.getElementById('ctr');

function build() {
  S.forEach((html, i) => {
    const el = document.createElement('div');
    el.className = 'slide' + (i === 0 ? ' active' : '');
    el.innerHTML = html;
    deck.appendChild(el);
  });
  ui();
}
function all() { return deck.querySelectorAll('.slide'); }
function go(n, dir) {
  if (n < 0 || n >= total) return;
  const ss = all();
  ss[cur].classList.remove('active');
  ss[cur].classList.add('out');
  setTimeout(() => ss[cur].classList.remove('out'), 380);
  cur = n;
  const nx = ss[cur];
  nx.style.transform = dir === 'f' ? 'translateX(54px)' : 'translateX(-54px)';
  nx.classList.add('active');
  requestAnimationFrame(() => requestAnimationFrame(() => { nx.style.transform = ''; }));
  ui();
}
function ui() {
  prog.style.width = ((cur + 1) / total * 100) + '%';
  ctr.textContent  = (cur + 1) + ' / ' + total;
}
function next() { go(cur + 1, 'f'); }
function prev() { go(cur - 1, 'b'); }

document.addEventListener('keydown', e => {
  if      (e.key === 'ArrowRight' || e.key === 'ArrowDown') next();
  else if (e.key === 'ArrowLeft'  || e.key === 'ArrowUp')   prev();
  else if (e.key === 'Home') go(0, 'b');
  else if (e.key === 'End')  go(total - 1, 'f');
  else if (e.key === '?' || e.key === '/') document.getElementById('modal').classList.toggle('show');
  else if (e.key === 'Escape') document.getElementById('modal').classList.remove('show');
});
['contextmenu','auxclick'].forEach(ev =>
  document.addEventListener(ev, e => { e.preventDefault(); e.stopImmediatePropagation(); }, { capture:true, passive:false })
);
document.addEventListener('mousedown', e => {
  if (e.target.closest('button,a,input,select,textarea,label')) return;
  if      (e.button === 2) { e.preventDefault(); e.stopImmediatePropagation(); next(); }
  else if (e.button === 3) { e.preventDefault(); e.stopImmediatePropagation(); prev(); }
  else if (e.button === 4) { e.preventDefault(); e.stopImmediatePropagation(); next(); }
}, { capture:true, passive:false });
let tx = null;
document.addEventListener('touchstart', e => { tx = e.touches[0].clientX; }, { passive:true });
document.addEventListener('touchend', e => {
  if (tx === null) return;
  const dx = e.changedTouches[0].clientX - tx;
  if (Math.abs(dx) > 42) dx < 0 ? next() : prev();
  tx = null;
}, { passive:true });
document.getElementById('mclose').addEventListener('click', () =>
  document.getElementById('modal').classList.remove('show')
);
function doCopy(preId, btnId) {
  const pre = document.getElementById(preId);
  const btn = document.getElementById(btnId);
  navigator.clipboard.writeText(pre.innerText).then(() => {
    btn.textContent = 'Copied!';
    btn.classList.add('ok');
    setTimeout(() => { btn.textContent = 'Copy'; btn.classList.remove('ok'); }, 2200);
  });
}
build();
</script>
