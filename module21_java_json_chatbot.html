*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{

  --a1:#38bdf8;--a2:#a78bfa;--a3:#34d399;--gold:#fbbf24;--rose:#fb7185;

}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--txt);font-family:var(--ff)}
#prog{position:fixed;top:0;left:0;height:3px;background:linear-gradient(90deg,#ED8B00,var(--a1),var(--a2));z-index:900;transition:width .3s ease;box-shadow:0 0 8px #ED8B00}
#ctr{position:fixed;bottom:18px;right:22px;font-size:13px;color:var(--mute);z-index:900;letter-spacing:.05em;font-weight:600}
#hint{position:fixed;bottom:18px;left:22px;font-size:13px;color:var(--dim);z-index:900}
#deck{width:100%;height:100%;position:relative;overflow:hidden}
.slide{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;padding:48px 62px;opacity:0;pointer-events:none;transition:opacity .35s ease,transform .35s ease;transform:translateX(54px);overflow-y:auto}
.slide.active{opacity:1;pointer-events:all;transform:translateX(0)}
.slide.out{opacity:0;transform:translateX(-54px)}

.W{width:100%;max-width:1420px;min-width:0;margin-top:auto;margin-bottom:auto}
.eye{font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--a1);margin-bottom:9px}
.T{font-size:clamp(27px,3.6vw,50px);font-weight:900;line-height:1.08;margin-bottom:7px}
.sub{font-size:clamp(15px,1.2vw,18px);color:var(--mute);margin-bottom:22px;line-height:1.55}
.hr{width:46px;height:3px;background:linear-gradient(90deg,#ED8B00,var(--a1));border-radius:2px;margin-bottom:22px}
.card{background:var(--card);border:1px solid var(--bord);border-radius:var(--r);padding:18px 22px}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.qt{background:var(--card);border-left:4px solid var(--a1);border-radius:0 var(--r) var(--r) 0;padding:18px 26px;font-style:italic;font-size:clamp(15px,1.2vw,18px);line-height:1.7}
.qt cite{display:block;font-size:15px;font-style:normal;color:var(--mute);margin-top:9px;font-weight:600}
.code-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;height:min(560px,62vh);align-items:stretch}
.cw{background:#060a10;border:1px solid #182030;border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;height:100%}
.ch{display:flex;align-items:center;justify-content:space-between;padding:9px 15px;background:#0b1018;border-bottom:1px solid #182030;flex-shrink:0}
.cl{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--dim)}
.cpbtn{font-size:12px;padding:4px 12px;border-radius:6px;border:1px solid var(--bord2);background:var(--card2);color:var(--mute);cursor:pointer;font-family:var(--ff);transition:all .15s}
.cpbtn:hover{background:var(--bord);color:var(--txt)}
.cpbtn.ok{background:#082a1e;color:#34d399;border-color:#34d399}
pre{flex:1;overflow:auto;min-height:0;padding:17px 20px;font-family:var(--mono);font-size:13px;line-height:1.7;color:#c8d8f0}
.kw{color:#f472b6}.at{color:#7dd3fc}.st{color:#86efac}.tg{color:#60a5fa}.cm{color:#374e6c;font-style:italic}.fn{color:#c084fc}.nm{color:#fda4af}
.fr{display:flex;gap:12px;padding:9px 0;border-bottom:1px solid var(--bord);align-items:flex-start}
.fr:last-child{border-bottom:none}
.fi{min-width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0;background:var(--card2)}
.ft h4{font-size:15px;font-weight:700;margin-bottom:2px}
.ft p{font-size:14px;color:var(--mute);line-height:1.5}
.qcard{background:var(--card);border:1px solid var(--bord);border-radius:var(--r);padding:14px 18px}
.qnum{font-size:11px;font-weight:700;color:var(--a1);letter-spacing:.08em;text-transform:uppercase;margin-bottom:4px}
.qtext{font-size:15px;font-weight:600;line-height:1.4;margin-bottom:9px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.opt{background:var(--bg);border:1px solid var(--bord);border-radius:7px;padding:7px 11px;font-size:14px;color:var(--mute);line-height:1.4}
.opt span{color:var(--a1);font-weight:700;margin-right:4px}
.idq{background:var(--card);border:1px solid var(--bord);border-radius:var(--r);padding:13px 17px;display:flex;gap:12px;align-items:flex-start}
.idn{min-width:26px;height:26px;background:var(--a1);color:#06080e;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;flex-shrink:0;margin-top:2px}
.idt{font-size:15px;line-height:1.55}
.blank{display:inline-block;width:120px;border-bottom:1.5px solid var(--a1);margin:0 5px;vertical-align:bottom}
.ar{display:flex;align-items:flex-start;gap:11px;padding:8px 0;border-bottom:1px solid var(--bord)}
.ar:last-child{border-bottom:none}
.an{min-width:32px;font-size:12px;font-weight:700;color:var(--a1)}
.aa{font-size:14px;font-weight:700;color:#34d399;min-width:160px;flex-shrink:0}
.ae{font-size:14px;color:var(--mute);line-height:1.45}
.ri{display:flex;gap:11px;padding:8px 0;align-items:flex-start}
.ric{min-width:28px;height:28px;background:var(--a2);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0}
.rit{font-size:15px;line-height:1.55}
#modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:9999;align-items:center;justify-content:center}
#modal.show{display:flex}
.mbox{background:var(--surf);border:1px solid var(--bord2);border-radius:16px;padding:30px 38px;min-width:340px}
.mbox h3{font-size:18px;font-weight:800;margin-bottom:18px}
.mrow{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--bord);font-size:14px}
.mrow:last-child{border-bottom:none}
.mrow span:first-child{color:var(--mute)}
kbd{background:var(--card);border:1px solid var(--bord2);border-radius:5px;padding:2px 7px;font-size:11px;font-family:var(--mono)}
.mclose{display:block;text-align:center;margin-top:18px;font-size:13px;color:var(--mute);cursor:pointer}
.mclose:hover{color:var(--txt)}
.grad{background:linear-gradient(135deg,#ffe0b0,#ED8B00 40%,#38bdf8);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}

olor:var(--mute);line-height:1.65">A lightweight text format for storing and transporting data. When you convert a Java List to JSON, it looks like: <code style="background:var(--bord);padding:2px 6px;border-radius:3px;font-family:var(--mono);font-size:13px;color:var(--a3)">["Place A", "Place B", "Place C"]</code>.</div></div><div class="card" style="border-top:3px solid var(--rose)"><div style="font-size:16px;font-weight:800;color:var(--rose);margin-bottom:8px">&#128260; The Interaction Loop</div><div style="font-size:15px;color:var(--mute);line-height:1.65">A <code style="background:var(--bord);padding:1px 4px;border-radius:3px;font-family:var(--mono);font-size:12px">while(true)</code> loop keeps the program running continuously until a specific condition (like the user typing "bye" or "exit") triggers a <code style="background:var(--bord);padding:1px 4px;border-radius:3px;font-family:var(--mono);font-size:12px">break</code>.</div></div></div></div>`,

`<div class="W"><div class="eye">Real-World Application · Analogies</div><div class="T">Making Java Click in Real Life</div><div class="hr"></div><div class="g2" style="gap:18px;align-items:start"><div style="display:flex;flex-direction:column;gap:14px"><div style="font-size:15px;font-weight:700;color:var(--a1);letter-spacing:.06em;text-transform:uppercase;margin-bottom:4px">&#128722; ArrayList = Shopping Cart</div><div class="card" style="border-left:3px solid var(--a1)"><div style="font-size:15px;color:var(--mute);line-height:1.65">A standard Java array is like a shopping list with exactly <strong style="color:var(--rose)">10 fixed slots</strong>. If you find 11 items, tough luck. An <code style="background:var(--bord);padding:1px 4px;border-radius:3px;font-family:var(--mono);font-size:12px">ArrayList</code> is like a <strong style="color:var(--a3)">shopping cart</strong> — keep throwing items in, and it magically expands to hold everything.</div></div><div style="font-size:15px;font-weight:700;color:var(--a2);letter-spacing:.06em;text-transform:uppercase;margin-top:6px;margin-bottom:4px">&#127860; HashMap = Restaurant Menu</div><div class="card" style="border-left:3px solid var(--a2)"><div style="font-size:15px;color:var(--mute);line-height:1.65">A <code style="background:var(--bord);padding:1px 4px;border-radius:3px;font-family:var(--mono);font-size:12px">HashMap</code> is like a restaurant menu. The <strong style="color:var(--txt)">Keys</strong> are dish names ("Burger", "Pizza"), and the <strong style="color:var(--txt)">Values</strong> are descriptions/prices. When someone asks for "Burger" (Key), the waiter instantly looks up the menu and provides the answer (Value).</div></div></div><div style="display:flex;flex-direction:column;gap:14px"><div style="font-size:15px;font-weight:700;color:var(--gold);letter-spacing:.06em;text-transform:uppercase;margin-bottom:4px">&#128241; Use Case: Mobile App Settings</div><div class="card" style="border-left:3px solid var(--gold)"><div style="font-size:15px;color:var(--mute);line-height:1.65">Developers often use <strong style="color:var(--txt)">JSON</strong> (like we build in Challenge #1) to save app settings to a file. When a user changes settings, the app turns Java data into a JSON string and saves it. On restart, it reads that JSON and converts it back into Java objects.</div></div><div class="card" style="padding:14px 18px;text-align:center;margin-top:6px"><div style="font-size:15px;color:var(--mute)"><img src="data:image/svg+xml;base64,PHN2ZyBmaWxsPSIjRUQ4QjAwIiB3aWR0aD0iNDgiIGhlaWdodD0iNDgiIHJvbGU9ImltZyIgdmlld0JveD0iMCAwIDI0IDI0IiB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciPjx0aXRsZT5PcGVuSkRLPC90aXRsZT48cGF0aCBkPSJNMTEuOTE1IDAgMTEuNy4yMTVDOS41MTUgMi40IDcuNDcgNi4zOSA2LjA0NiAxMC40ODNjLTEuMDY0IDEuMDI0LTMuNjMzIDIuODEtMy43MTEgMy41NTEtLjA5My44NyAxLjc0NiAyLjYxMSAxLjU1IDMuMjM1LS4xOTguNjI1LTEuMzA0IDEuNDA4LTEuMDE0IDEuOTM5LjEuMTg4LjgyMy4wMTEgMS4yNzctLjQ5MWExMy4zODkgMTMuMzg5IDAgMCAwLS4wMTcgMi4xNGMuMDc2LjkwNi4yNyAxLjY2OC42NDMgMi4yMzIuMzcyLjU2My45NTYuOTExIDEuNjY3LjkxMS4zOTcgMCAuNzI3LS4xMTQgMS4wMjQtLjI2NC4yOTgtLjE0OS41NzEtLjMzLjkxLS41LjY4LS4zNCAxLjYzNC0uNjY2IDMuNTMtLjYwNCAxLjkwMy4wNjIgMi44NzIuMzkgMy41NTkuNzA0LjY4Ny4zMTQgMS4xNS42NjQgMS45MjUuNjY0Ljc2NyAwIDEuMzk1LS4zMzYgMS44MDctLjkuNDEyLS41NjMuNjMxLTEuMzMuNzItMi4yNC4wNi0uNjIzLjA1NS0xLjMyIDAtMi4wNjYuNDU0LjQ1IDEuMTE3LjYwNCAxLjIxMy40MjQuMjktLjUzLS44MTYtMS4zMTQtMS4wMTMtMS45MzctLjE5OC0uNjI0IDEuNjQyLTIuMzY2IDEuNTQ5LTMuMjM2LS4wOC0uNzQ4LTIuNzA3LTIuNTY4LTMuNzQ4LTMuNTg2QzE2LjQyOCA2LjM3NCAxNC4zMDggMi4zOTQgMTIuMTMuMjE1em0uMTc1IDYuMDM4YTIuOTUgMi45NSAwIDAgMSAyLjk0MyAyLjk0MiAyLjk1IDIuOTUgMCAwIDEtMi45NDMgMi45NDNBMi45NSAyLjk1IDAgMCAxIDkuMTQ4IDguOThhMi45NSAyLjk1IDAgMCAxIDIuOTQyLTIuOTQyek04LjY4NSA3Ljk4M2EzLjUxNSAzLjUxNSAwIDAgMC0uMTQ1Ljk5N2MwIDEuOTUxIDEuNiAzLjU1IDMuNTUgMy41NSAxLjk1IDAgMy41NS0xLjU5OCAzLjU1LTMuNTUgMC0uMzI5LS4wNDYtLjY0OC0uMTMyLS45NTEuMzM0LjA5NS42NC4yMDguOTE1LjMzNmE0Mi42OTkgNDIuNjk5IDAgMCAxIDIuMDQyIDUuODI5Yy42NzggMi41NDUgMS4wMSA0LjkyLjg0NiA2LjYwN                 <span class="kw">break</span>;
            }

            <span class="cm">// 3. Add place if not empty</span>
            <span class="kw">if</span> (!place.<span class="fn">isEmpty</span>()) {
                places.<span class="fn">add</span>(place);
            }
        }

        <span class="cm">// 4. Convert to JSON array manually</span>
        <span class="at">StringBuilder</span> jb = <span class="kw">new</span> <span class="at">StringBuilder</span>(<span class="st">"["</span>);
        <span class="kw">for</span> (<span class="kw">int</span> i = <span class="nm">0</span>; i &lt; places.<span class="fn">size</span>(); i++) {
            jb.<span class="fn">append</span>(<span class="st">"\""</span>).<span class="fn">append</span>(places.<span class="fn">get</span>(i)).<span class="fn">append</span>(<span class="st">"\""</span>);
            <span class="kw">if</span> (i &lt; places.<span class="fn">size</span>() - <span class="nm">1</span>) jb.<span class="fn">append</span>(<span class="st">", "</span>);
        }
        jb.<span class="fn">append</span>(<span class="st">"]"</span>);

        <span class="cm">// 5. Display output</span>
        System.out.<span class="fn">println</span>(<span class="st">"\n--- Final Output ---"</span>);
        System.out.<span class="fn">println</span>(<span class="st">"Java List: "</span> + places);
        System.out.<span class="fn">println</span>(<span class="st">"JSON Array: "</span> + jb);
        scanner.<span class="fn">close</span>();
    }
}</pre></div><div style="display:flex;flex-direction:column;gap:14px;overflow:auto;height:100%"><div class="card" style="flex-shrink:0"><div style="font-size:12px;font-weight:700;color:var(--gold);letter-spacing:.09em;text-transform:uppercase;margin-bottom:9px">Goal</div><div style="font-size:15px;color:var(--mute);line-height:1.65">Let the user type in place names until "exit". Then convert the <code style="background:var(--bord);padding:1px 4px;border-radius:3px;font-family:var(--mono);font-size:12px">ArrayList</code> to a JSON array string using <code style="background:var(--bord);padding:1px 4px;border-radius:3px;font-family:var(--mono);font-size:12px">StringBuilder</code> and display both.</div></div><div class="card" style="flex-shrink:0;background:#060a10;border:1px solid #182030"><div style="font-size:12px;font-weight:700;color:var(--a3);letter-spacing:.07em;text-transform:uppercase;margin-bottom:9px">Sample Output</div><div style="font-family:var(--mono);font-size:13px;color:#86efac;line-height:1.8">--- Place Storage System ---<br>Enter names of places. Type 'exit' to stop.<br><br>Enter a place name: <span style="color:#7dd3fc">Manila</span><br>Enter a place name: <span style="color:#7dd3fc">Cebu</span><br>Enter a place name: <span style="color:#7dd3fc">Davao</span><br>Enter a place name: <span style="color:#7dd3fc">exit</span><br><br>--- Final Output ---<br>Java List: [Manila, Cebu, Davao]<br>JSON Array: ["Manila", "Cebu", "Davao"]</div></div><div class="card" style="flex-shrink:0;border-left:3px solid var(--gold)"><div style="font-size:13px;font-weight:700;color:var(--gold);margin-bottom:6px">Pro Tip</div><div style="font-size:15px;color:var(--mute);line-height:1.55">The manual JSON builder wraps each item in quotes and separates them with commas — matching the exact standard JSON array format!</div></div></div></div></div>`,

<span class="kw">import</span> java.util.HashMap;

<span class="kw">public class</span> <span class="at">Challenge2Chatbot</span> {

    <span class="kw">static</span> <span class="at">HashMap</span>&lt;<span class="at">String</span>, <span class="at">String</span>&gt; responses
        = <span class="kw">new</span> <span class="at">HashMap</span>&lt;&gt;();

    <span class="kw">public static</span> <span class="at">String</span> <span class="fn">getBotResponse</span>(
            <span class="at">String</span> userMessage) {
        <span class="at">String</span> lower = userMessage.<span class="fn">toLowerCase</span>();
        <span class="kw">if</span> (responses.<span class="fn">containsKey</span>(lower)) {
            <span class="kw">return</span> responses.<span class="fn">get</span>(lower);
        } <span class="kw">else</span> {
            <span class="kw">return</span> responses.<span class="fn">get</span>(<span class="st">"default"</span>);
        }
    }

    <span class="kw">public static void</span> <span class="fn">main</span>(<span class="at">String</span>[] args) {
        <span class="at">Scanner</span> scanner = <span class="kw">new</span> <span class="at">Scanner</span>(System.in);

        <span class="cm">// Step 1: Define responses</span>
        responses.<span class="fn">put</span>(<span class="st">"hello"</span>,
            <span class="st">"Hi there! I'm a simple Java bot."</span>);
        responses.<span class="fn">put</span>(<span class="st">"how are you"</span>,
            <span class="st">"I'm just a program, but running great!"</span>);
        responses.<span class="fn">put</span>(<span class="st">"tell me about java"</span>,
            <span class="st">"Java is a high-level, class-based, OOP language!"</span>);
        responses.<span class="fn">put</span>(<span class="st">"bye"</span>,
            <span class="st">"Goodbye! Have an awesome day!"</span>);
        responses.<span class="fn">put</span>(<span class="st">"default"</span>,
            <span class="st">"I don't quite understand. Try 'hello'."</span>);

        <span class="cm">// Step 2: Greeting</span>
        System.out.<span class="fn">println</span>(<span class="st">"--- Java Chatbot ---"</span>);
        System.out.<span class="fn">println</span>(
            <span class="st">"Bot: Hello! Type a query. 'bye' to exit."</span>);

        <span class="cm">// Step 3: Interaction loop</span>
        <span class="kw">while</span> (<span class="kw">true</span>) {
            System.out.<span class="fn">print</span>(<span class="st">"You: "</span>);
            <span class="at">String</span> input = scanner.<span class="fn">nextLine</span>().<span class="fn">trim</span>();

            <span class="kw">if</span> (input.<span class="fn">equalsIgnoreCase</span>(<span class="st">"bye"</span>)) {
                System.out.<span class="fn">println</span>(
                    <span class="st">"Bot: "</span> + responses.<span class="fn">get</span>(<span class="st">"bye"</span>));
                <span class="kw">break</span>;
            }

            <span class="at">String</span> reply = <span class="fn">getBotResponse</span>(input);
            System.out.<span class="fn">println</span>(<span class="st">"Bot: "</span> + reply);
        }
        scanner.<span class="fn">close</span>();
    }
}</pre></div><div style="display:flex;flex-direction:column;gap:14px;overflow:auto;height:100%"><div class="card" style="flex-shrink:0"><div style="font-size:12px;font-weight:700;color:var(--a2);letter-spacing:.09em;text-transform:uppercase;margin-bottom:9px">Goal</div><div style="font-size:15px;color:var(--mute);line-height:1.65">Build a chatbot using a <code style="background:var(--bord);padding:1px 4px;border-radius:3px;font-family:var(--mono);font-size:12px">HashMap</code> for pre-defined responses. It greets the user, responds to keywords, and exits on "bye".</div></div><div class="card" style="flex-shrink:0;background:#060a10;border:1px solid #182030"><div style="font-size:12px;font-weight:700;color:var(--a3);letter-spacing:.07em;text-transform:uppercase;margin-bottom:9px">Sample Output</div><div style="font-family:var(--mono);font-size:13px;color:#86efac;line-height:1.8">--- Java Chatbot ---<br>Bot: Hello! Type a query. 'bye' to exit.<br><br>You: <span style="color:#7dd3fc">hello</span><br>Bot: Hi there! I'm a simple Java bot.<br><br>You: <span style="color:#7dd3fc">tell me about java</span><br>Bot: Java is a high-level, class-based, OOP language!<br><br>You: <span style="color:#7dd3fc">bye</span><br>Bot: Goodbye! Have an awesome day!</div></div><div class="card" style="flex-shrink:0;border-left:3px solid var(--a2)"><div style="font-size:13px;font-weight:700;color:var(--a2);margin-bottom:6px">.toLowerCase() Key Pattern</div><div style="font-size:15px;color:var(--mute);line-height:1.55">The user input is converted to lowercase before lookup so "Hello", "HELLO", and "hello" all match the same HashMap key — <strong style="color:var(--txt)">case-insensitive matching</strong>.</div></div></div></div></div>`,

`<div class="W"><div class="eye">Key Quotes</div><div class="T">Words That Frame the Module</div><div class="hr"></div><div style="display:flex;flex-direction:column;gap:20px;max-width:860px;margin:0 auto"><div class="qt" style="border-color:var(--a1)">Welcome to the Activity Module! In this hands-on session, we take foundational Java knowledge and apply it to two practical scenarios: managing user data using Lists and JSON, and building a simple conversational chatbot using HashMaps. Let's level up your coding skills!<cite>— Module 21 Introduction</cite></div><div class="qt" style="border-color:var(--gold)">Standard Java does not have a built-in JSON parser in its core libraries. To keep this activity truly simple and runnable without needing to download external .jar files, we implemented the JSON array building logic manually using StringBuilder. This is an excellent way to understand how JSON strings are actually constructed.<cite>— Module 21 FAQ</cite></div></div><div class="card" style="margin-top:20px;max-width:860px;margin-left:auto;margin-right:auto;padding:13px 18px"><div style="display:flex;justify-content:center;gap:12px;margin-bottom:8px"><img src="data:image/svg+xml;base64,PHN2ZyBmaWxsPSIjRUQ4QjAwIiB3aWR0aD0iNDgiIGhlaWdodD0iNDgiIHJvbGU9ImltZyIgdmlld0JveD0iMCAwIDI0IDI0IiB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciPjx0aXRsZT5PcGVuSkRLPC90aXRsZT48cGF0aCBkPSJNMTEuOTE1IDAgMTEuNy4yMTVDOS41MTUgMi40IDcuNDcgNi4zOSA2LjA0NiAxMC40ODNjLTEuMDY0IDEuMDI0LTMuNjMzIDIuODEtMy43MTEgMy41NTEtLjA5My44NyAxLjc0NiAyLjYxMSAxLjU1IDMuMjM1LS4xOTguNjI1LTEuMzA0IDEuNDA4LTEuMDE0IDEuOTM5LjEuMTg4LjgyMy4wMTEgMS4yNzctLjQ5MWExMy4zODkgMTMuMzg5IDAgMCAwLS4wMTcgMi4xNGMuMDc2LjkwNi4yNyAxLjY2OC42NDMgMi4yMzIuMzcyLjU2My45NTYuOTExIDEuNjY3LjkxMS4zOTcgMCAuNzI3LS4xMTQgMS4wMjQtLjI2NC4yOTgtLjE0OS41NzEtLjMzLjkxLS41LjY4LS4zNCAxLjYzNC0uNjY2IDMuNTMtLjYwNCAxLjkwMy4wNjIgMi44NzIuMzkgMy41NTkuNzA0LjY4Ny4zMTQgMS4xNS42NjQgMS45MjUuNjY0Ljc2NyAwIDEuMzk1LS4zMzYgMS44MDctLjkuNDEyLS41NjMuNjMxLTEuMzMuNzItMi4yNC4wNi0uNjIzLj `<div class="W"><div class="eye">Lesson Wrap-Up · FAQs</div><div class="T">Frequently Asked Questions</div><div class="hr"></div><div style="display:flex;flex-direction:column;gap:13px;max-width:920px"><div class="card" style="border-left:3px solid var(--gold)"><div style="font-size:14px;font-weight:700;color:var(--gold);margin-bottom:7px">Q1 — Why not use Gson or org.json?</div><div style="font-size:15px;color:var(--mute);line-height:1.65">Standard Java has no built-in JSON parser. To keep this simple and runnable without external <code style="background:var(--bord);padding:1px 4px;border-radius:3px;font-family:var(--mono);font-size:12px">.jar</code> files, we use <strong style="color:var(--txt)">StringBuilder</strong> to manually build the JSON string — a great way to understand how JSON is actually constructed.</div></div><div class="card" style="border-left:3px solid var(--a2)"><div style="font-size:14px;font-weight:700;color:var(--a2);margin-bottom:7px">Q2 — Can I use if...else instead of HashMap for the chatbot?</div><div style="font-size:15px;color:var(--mute);line-height:1.65">Yes — for 3–4 responses an <code style="background:var(--bord);padding:1px 4px;border-radius:3px;font-family:var(--mono);font-size:12px">if...else if</code> chain works fine. But if you had 100 responses, a <strong style="color:var(--txt)">HashMap</strong> is far faster to execute and much easier to maintain. It keeps your code clean and organized.</div></div><div class="card" style="border-left:3px solid var(--a1)"><div style="font-size:14px;font-weight:700;color:var(--a1);margin-bottom:7px">Q3 — What is the difference between .nextLine() and .next()?</div><div style="font-size:15px;color:var(--mute);line-height:1.65"><code style="background:var(--bord);padding:1px 4px;border-radius:3px;font-family:var(--mono);font-size:12px">.nextLine()</code> reads the <strong style="color:var(--txt)">entire line</strong> including spaces (like "tell me about Java"). <code style="background:var(--bord);padding:1px 4px;border-radius:3px;font-family:var(--mono);font-size:12px">.next()</code> reads only the <strong style="color:var(--txt)">first word</strong>, stopping at the first space. For a chatbot, <code style="background:var(--bord);padding:1px 4px;border-radius:3px;font-family:var(--mono);font-size:12px">.nextLine()</code> is crucial!</div></div></div></div>`,

`<div class="W"><div class="eye">Skill-Building Check · Activities</div><div class="T">Multiple Choice</div><div class="sub">Select the best answer — answers on the Answer Key slide.</div><div class="g2" style="gap:11px"><div class="qcard"><div class="qnum">Question 1</div><div class="qtext">What is the specific reason for calling <code style="background:var(--bord);padding:1px 4px;border-radius:3px;font-family:var(--mono);font-size:12px">.toLowerCase()</code> on user input in the Chatbot?</div><div class="opts"><div class="opt"><span>A.</span>It makes the program run faster</div><div class="opt"><span>B.</span>It ensures case-insensitive matching</div><div class="opt"><span>C.</span>It prevents the program from crashing</div><div class="opt"><span>D.</span>It converts input to JSON</div></div></div><div class="qcard"><div class="qnum">Question 2</div><div class="qtext">Which Java data structure stores the list of places and dynamically grows as the user enters more?</div><div class="opts"><div class="opt"><span>A.</span>String[]</div><div class="opt"><span>B.</span>HashMap</div><div class="opt"><span>C.</span>ArrayList</div><div class="opt"><span>D.</span>StringBuilder</div></div></div><div class="qcard"><div class="qnum">Question 3</div><div class="qtext">What does <code style="background:var(--bord);padding:1px 4px;border-radius:3px;font-family:var(--mono);font-size:12px">StringBuilder</code> allow us to do in Challenge #1?</div><div class="opts"><div class="opt"><span>A.</span>Collect input from the user</div><div class="opt"><span>B.</span>Efficiently build a custom JSON string by appending text</div><div class="opt"><span>C.</span>Look up dictionary values</div><div class="opt"><span>D.</span>End the program</div></div></div><div class="qcard"><div class="qnum">Question 4</div><div class="qtext">Which part of the Java code prevents the program from running indefinitely?</div><div class="opts"><div class="opt"><span>A.</span>The import statement</div><div class="opt"><span>B.</span>The break command inside while(true) when the user types "exit"/"bye"</div><div class="opt"><span>C.</span>The getBotResponse method</div><div class="opt"><span>D.</span>The HashMap initialization</div></div></div></div></div>`,

`<div class="W"><div class="eye">Skill-Building Check · Activities</div><div class="T">Identification</div><div class="sub">Fill in the blank with the correct Java class, method, or concept.</div><div style="display:flex;flex-direction:column;gap:10px"><div class="idq"><div class="idn">1</div><div class="idt">This dynamic array data structure automatically grows as you add items using <code style="background:var(--bord);padding:1px 4px;border-radius:3px;font-family:var(--mono);font-size:13px">.add()</code>, unlike standard Java arrays with a fixed size. It is called <span class="blank"></span>.</div></div><div class="idq"><div class="idn">2</div><div class="idt">This Java class stores key-value pairs — used in our chatbot to map user messages to bot replies. It is called <span class="blank"></span>.</div></div><div class="idq"><div class="idn">3</div><div class="idt">The lightweight text format for storing and transporting data, where an array looks like <code style="background:var(--bord);padding:1px 4px;border-radius:3px;font-family:var(--mono);font-size:13px">["A", "B", "C"]</code>, is called <span class="blank"></span>.</div></div><div class="idq"><div class="idn">4</div><div class="idt">The Scanner method that reads the <strong>entire line</strong> of input (including spaces) — essential for multi-word chatbot queries — is called <span class="blank"></span>.</div></div><div class="idq"><div class="idn">5</div><div class="idt">The Java class used to efficiently build a custom string by appending text pieces together (used to manually construct our JSON output) is called <span class="blank"></span>.</div></div></div></div>`,

`<div class="W"><div class="eye">Answer Key</div><div class="T">Activity Answers &amp; Explanations</div><div class="hr"></div><div class="g2" style="gap:18px;align-items:start"><div><div style="font-size:12px;font-weight:700;color:var(--a1);letter-spacing:.09em;text-transform:uppercase;margin-bottom:10px">Multiple Choice</div><div class="card" style="padding:12px 16px"><div class="ar"><div class="an">Q1</div><div class="aa">B. Case-insensitive matching</div><div class="ae">.toLowerCase() ensures "hello", "HELLO", and "Hello" all match the same HashMap key.</div></div><div class="ar"><div class="an">Q2</div><div class="aa">C. ArrayList</div><div class="ae">ArrayList is dynamic — it grows with .add(). Standard arrays have fixed length; HashMap stores key-value pairs, not simple lists.</div></div><div class="ar"><div class="an">Q3</div><div class="aa">B. Build a JSON string</div><div class="ae">StringBuilder efficiently constructs the JSON array string by appending quotes, values, and commas without creating new strings each time.</div></div><div class="ar"><div class="an">Q4</div><div class="aa">B. break inside while(true)</div><div class="ae">while(true) runs forever unless break is called. Checking for "exit"/"bye" then calling break gracefully stops the program.</div></div></div></div><div><div style="font-size:12px;font-weight:700;color:var(--a2);letter-spacing:.09em;text-transform:uppercase;margin-bottom:10px">Identification</div><div class="card" style="padding:12px 16px"><div class="ar"><div class="an">I1</div><div class="aa">ArrayList</div><div class="ae">Dynamic array that grows automatically — use when you don't know how many items a user might enter.</div></div><div class="ar"><div class="an">I2</div><div class="aa">HashMap</div><div class="ae">Stores key-value pairs — maps user messages (keys) to bot responses (values) for instant lookup.</div></div><div class="ar"><div class="an">I3</div><div class="aa">JSON</div><div class="ae">JavaScript Object Notation — lightweight, portable text format for data exchange between systems.</div></div><div class="ar"><div class="an">I4</div><div class="aa">.nextLine()</div><div class="ae">Reads the full line including spaces — .next() only reads the first word, which breaks multi-word chatbot queries.</div></div><div class="ar"><div class="an">I5</div><div class="aa">StringBuilder</div><div class="ae">Efficiently builds strings by appending pieces — avoids creating new String objects for each concatenation.</div></div></div></div></div></div>`,

`<div class="W" style="text-align:center;display:flex;flex-direction:column;align-items:center"><div class="eye" style="margin-bottom:16px">Module 21 Complete</div><div class="qt" style="max-width:700px;margin-bottom:26px;font-size:clamp(16px,1.5vw,21px);border-color:var(--a1)">The best way to learn programming is by doing. Every line of code you write, every bug you fix, every program you run — that is the real education.<cite>— Coding Wisdom</cite></div><div style="font-size:clamp(26px,3.5vw,46px);font-weight:900;line-height:1.1;margin-bottom:16px" class="grad">Module 21 complete! &#127881;</div><div style="font-size:clamp(15px,1.2vw,18px);color:var(--mute);max-width:580px;line-height:1.7;margin-bottom:30px">You've built two real Java programs — a dynamic place collector that serializes to JSON, and an interactive chatbot powered by HashMap lookups. That's practical programming in action.</div><div style="display:flex;gap:14px;flex-wrap:wrap;justify-content:center"><div class="card" style="min-width:130px;display:flex;flex-direction:column;align-items:center;gap:8px;padding:16px"><img src="data:image/svg+xml;base64,PHN2ZyBmaWxsPSIjRUQ4QjAwIiB3aWR0aD0iNDgiIGhlaWdodD0iNDgiIHJvbGU9ImltZyIgdmlld0JveD0iMCAwIDI0IDI0IiB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciPjx0aXRsZT5PcGVuSkRLPC90aXRsZT48cGF0aCBkPSJNMTEuOTE1IDAgMTEuNy4yMTVDOS41MTUgMi40IDcuNDcgNi4zOSA2LjA0NiAxMC40ODNjLTEuMDY0IDEuMDI0LTMuNjMzIDIuODEtMy43MTEgMy41NTEtLjA5My44NyAxLjc0NiAyLjYxMSAxLjU1IDMuMjM1LS4xOTguNjI1LTEuMzA0IDEuNDA4LTEuMDE0IDEuOTM5LjEuMTg4LjgyMy4wMTEgMS4yNzctLjQ5MWExMy4zODkgMTMuMzg5IDAgMCAwLS4wMTcgMi4xNGMuMDc2LjkwNi4yNyAxLjY2OC42NDMgMi4yMzIuMzcyLjU2My45NTYuOTExIDEuNjY3LjkxMS4zOTcgMCAuNzI3LS4xMTQgMS4wMjQtLjI2NC4yOTgtLjE0OS41NzEtLjMzLjkxLS41LjY4LS4zNCAxLjYzNC0uNjY2IDMuNTMtLjYwNCAxLjkwMy4wNjIgMi44NzIuMzkgMy41NTkuNzA0LjY4Ny4zMTQgMS4xNS42NjQgMS45MjUuNjY0Ljc2NyAwIDEuMzk1LS4zMzYgMS44MDctLjkuNDEyLS41NjMuNjMxLTEuMzMuNzItMi4yNC4wNi0uNjIzLjA1NS0xLjMyIDAtMi4wNjYuNDU0LjQ1IDEuMTE3LjYwNCAxLjIxMy40MjQuMjktLjUzLS44M let cur = 0;
const total = S.length;
const deck = document.getElementById('deck');
const prog = document.getElementById('prog');
const ctr  = document.getElementById('ctr');
function build() {
  S.forEach((html, i) => {
    const el = document.createElement('div');
    el.className = 'slide' + (i === 0 ? ' active' : '');
    el.innerHTML = html;
    deck.appendChild(el);
  });
  ui();
}
function all() { return deck.querySelectorAll('.slide'); }
function go(n, dir) {
  if (n < 0 || n >= total) return;
  const ss = all();
  ss[cur].classList.remove('active');
  ss[cur].classList.add('out');
  setTimeout(() => ss[cur].classList.remove('out'), 380);
  cur = n;
  const nx = ss[cur];
  nx.style.transform = dir === 'f' ? 'translateX(54px)' : 'translateX(-54px)';
  nx.classList.add('active');
  requestAnimationFrame(() => requestAnimationFrame(() => { nx.style.transform = ''; }));
  ui();
}
function ui() {
  prog.style.width = ((cur + 1) / total * 100) + '%';
  ctr.textContent  = (cur + 1) + ' / ' + total;
}
function next() { go(cur + 1, 'f'); }
function prev() { go(cur - 1, 'b'); }
document.addEventListener('keydown', e => {
  if      (e.key === 'ArrowRight' || e.key === 'ArrowDown') next();
  else if (e.key === 'ArrowLeft'  || e.key === 'ArrowUp')   prev();
  else if (e.key === 'Home') go(0, 'b');
  else if (e.key === 'End')  go(total - 1, 'f');
  else if (e.key === '?' || e.key === '/') document.getElementById('modal').classList.toggle('show');
  else if (e.key === 'Escape') document.getElementById('modal').classList.remove('show');
});
['contextmenu','auxclick'].forEach(ev =>
  document.addEventListener(ev, e => { e.preventDefault(); e.stopImmediatePropagation(); }, { capture:true, passive:false })
);
document.addEventListener('mousedown', e => {
  if (e.target.closest('button,a,input,select,textarea,label')) return;
  if      (e.button === 2) { e.preventDefault(); e.stopImmediatePropagation(); next(); }
  else if (e.button === 3) { e.preventDefault(); e.stopImmediatePropagation(); prev(); }
  else if (e.button === 4) { e.preventDefault(); e.stopImmediatePropagation(); next(); }
}, { capture:true, passive:false });
let tx = null;
document.addEventListener('touchstart', e => { tx = e.touches[0].clientX; }, { passive:true });
document.addEventListener('touchend', e => {
  if (tx === null) return;
  const dx = e.changedTouches[0].clientX - tx;
  if (Math.abs(dx) > 42) dx < 0 ? next() : prev();
  tx = null;
}, { passive:true });
document.getElementById('mclose').addEventListener('click', () =>
  document.getElementById('modal').classList.remove('show')
);
function doCopy(preId, btnId) {
  const pre = document.getElementById(preId);
  const btn = document.getElementById(btnId);
  navigator.clipboard.writeText(pre.innerText).then(() => {
    btn.textContent = 'Copied!';
    btn.classList.add('ok');
    setTimeout(() => { btn.textContent = 'Copy'; btn.classList.remove('ok'); }, 2200);
  });
}
build();
</script>
