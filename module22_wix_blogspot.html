<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Module 22: Applied Prototyping with Wix, Blogspot &amp; Custom UI/UX</title>
<style>
  :root{
    --bg:#252b3a;
    --ink:#eef2fa;
    --ink-soft:#aab4cc;
    --accent:#5b8cff;
    --accent-2:#2dd4b6;
    --accent-grad: linear-gradient(135deg,#5b8cff 0%,#2dd4b6 100%);
    --sh-dark: #13161f;
    --sh-light: #333c52;
    --sh-dark-strong: #0d0f16;
    --radius:20px;
    --code-bg:#11141d;
    --code-ink:#e7edf5;
    --code-key:#7dd3fc;
    --code-str:#a5d6a7;
    --code-com:#7c88a5;
    --code-fn:#f6c177;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background:var(--bg);
    color:var(--ink);
    overflow:hidden;
  }
  #deck{
    position:relative;
    width:100vw;
    height:100vh;
    overflow:hidden;
    background:var(--bg);
  }
  .slide{
    position:absolute;
    inset:0;
    display:flex;
    flex-direction:column;
    padding:56px 72px 40px;
    opacity:0;
    visibility:hidden;
    transform:translateX(40px);
    transition: opacity 350ms ease, transform 350ms ease;
    overflow-y:auto;
  }
  .slide.active{
    opacity:1;
    visibility:visible;
    transform:translateX(0);
    z-index:2;
  }
  .slide.exit-left{ transform:translateX(-40px); }
  .slide.exit-right{ transform:translateX(40px); }
  @media (prefers-reduced-motion: reduce){
    .slide{ transition:none; transform:none; }
  }
  .eyebrow{
    display:inline-flex;
    align-items:center;
    gap:8px;
    font-size:16px;
    font-weight:700;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:var(--accent);
    margin-bottom:12px;
  }
  .eyebrow::before{
    content:"";
    width:22px;height:3px;border-radius:2px;
    background:var(--accent-grad);
    display:inline-block;
  }
  h1.slide-title{
    font-size:36px;
    line-height:1.15;
    margin:0 0 24px 0;
    font-weight:800;
    letter-spacing:-.01em;
  }
  .slide-body{
    font-size:17px;
    line-height:1.65;
    color:var(--ink-soft);
    flex:1;
    min-height:0;
  }
  .slide-body p{margin:0 0 16px 0;}
  .slide-body strong{color:var(--ink);}
  .grid{ display:grid; gap:20px; }
  .grid-2{ grid-template-columns: 1fr 1fr; }
  .grid-3{ grid-template-columns: repeat(3,1fr); }
  .card{
    background:var(--bg);
    border:none;
    border-radius:var(--radius);
    padding:20px 22px;
    box-shadow: 8px 8px 16px var(--sh-dark), -8px -8px 16px var(--sh-light);
  }
  .card h3{ margin:0 0 10px 0; font-size:17px; color:var(--ink);}
  .card p{ margin:0; font-size:16px; color:var(--ink-soft); line-height:1.55;}
  .badge-row{ display:flex; gap:16px; flex-wrap:wrap; align-items:center; margin:12px 0 4px;}
  .badge{
    display:flex; align-items:center; gap:9px;
    background:var(--bg); border:none;
    border-radius:999px; padding:9px 18px 9px 10px;
    font-size:16px; font-weight:600;
    box-shadow: 6px 6px 12px var(--sh-dark), -6px -6px 12px var(--sh-light);
  }
  .badge svg,.badge img{ width:26px; height:26px; }
  table.cmp{
    width:100%; border-collapse:separate; border-spacing:0; font-size:16px;
    background:var(--bg); border-radius:var(--radius); overflow:hidden;
    box-shadow: 8px 8px 16px var(--sh-dark), -8px -8px 16px var(--sh-light);
  }
  table.cmp th, table.cmp td{ padding:14px 18px; text-align:left; }
  table.cmp th{
    background:var(--bg); font-size:16px; text-transform:uppercase; letter-spacing:.04em; color:var(--ink-soft);
    box-shadow: inset 4px 4px 8px var(--sh-dark), inset -4px -4px 8px var(--sh-light);
  }
  table.cmp tr:not(:last-child) td{ border-bottom:1px solid rgba(255,255,255,0.06); }
  .col-wix{ color:var(--accent); font-weight:700;}
  .col-blog{ color:var(--accent-2); font-weight:700;}
  ol.steps, ul.plain{ margin:0; padding-left:22px; }
  ol.steps li, ul.plain li{ margin-bottom:12px; font-size:17px; }
  .callout{
    background:var(--bg); border:none;
    border-radius:var(--radius); padding:18px 20px; font-size:16px;
    display:flex; gap:12px; align-items:flex-start;
    box-shadow: 8px 8px 16px var(--sh-dark), -8px -8px 16px var(--sh-light);
  }
  .callout .icon{ font-size:22px; line-height:1;}
  .quote-card{
    background:var(--bg); color:var(--ink); border-radius:var(--radius);
    padding:34px 42px; font-size:23px; line-height:1.55;
    font-weight:600; position:relative;
    box-shadow: 10px 10px 20px var(--sh-dark-strong), -10px -10px 20px var(--sh-light);
    border-left:6px solid transparent;
    background-image: linear-gradient(var(--bg), var(--bg)), var(--accent-grad);
    background-origin: border-box;
    background-clip: padding-box, border-box;
  }
  .quote-card .attrib{ display:block; margin-top:16px; font-size:16px; font-weight:500; color:var(--ink-soft);}
  /* code panels */
  .code-row{ display:grid; grid-template-columns: 1fr 1fr; gap:20px; height:min(560px,62vh); align-items:stretch; }
  .code-row.single{ grid-template-columns: 1fr; }
  .code-card{
    display:flex; flex-direction:column; height:100%; min-height:0;
    background:var(--bg); border-radius:var(--radius); overflow:hidden;
    box-shadow: 8px 8px 16px var(--sh-dark), -8px -8px 16px var(--sh-light);
    padding:10px;
  }
  .code-card .code-head{
    flex-shrink:0; display:flex; align-items:center; justify-content:space-between;
    padding:10px 14px; color:var(--ink);
    font-size:16px; font-weight:700; letter-spacing:.03em;
  }
  .code-card .copy-btn{
    background:var(--bg); border:none;
    color:var(--ink); border-radius:10px; padding:7px 14px; font-size:16px;
    cursor:pointer; transition: box-shadow 150ms ease;
    box-shadow: 4px 4px 8px var(--sh-dark), -4px -4px 8px var(--sh-light);
  }
  .code-card .copy-btn:hover{
    box-shadow: 2px 2px 5px var(--sh-dark), -2px -2px 5px var(--sh-light);
  }
  .code-card .copy-btn.copied{
    color:var(--accent-2);
    box-shadow: inset 3px 3px 6px var(--sh-dark), inset -3px -3px 6px var(--sh-light);
  }
  .code-card pre{
    flex:1; overflow:auto; min-height:0; margin:0; padding:18px 20px;
    font-family: "SF Mono", Menlo, Consolas, monospace;
    font-size:16px; line-height:1.6; color:var(--code-ink);
    background:var(--code-bg); border-radius:14px;
    box-shadow: inset 4px 4px 10px rgba(0,0,0,0.45), inset -2px -2px 6px rgba(255,255,255,0.03);
  }
  .panel-card{
    display:flex; flex-direction:column; height:100%; min-height:0;
    background:var(--bg); border:none; border-radius:var(--radius);
    overflow:hidden;
    box-shadow: 8px 8px 16px var(--sh-dark), -8px -8px 16px var(--sh-light);
    padding:10px;
  }
  .panel-card .panel-head{
    flex-shrink:0; padding:10px 14px;
    font-size:16px; font-weight:700; letter-spacing:.03em; color:var(--ink-soft);
  }
  .panel-card .panel-body{
    flex:1; overflow:auto; min-height:0; padding:16px 18px; font-size:16px; color:var(--ink-soft);
    background:var(--bg); border-radius:14px;
    box-shadow: inset 4px 4px 10px var(--sh-dark), inset -4px -4px 10px var(--sh-light);
  }
  .panel-body ol{ padding-left:20px; margin:0; }
  .panel-body li{ margin-bottom:12px; }
  .tok-key{color:var(--code-key);} .tok-str{color:var(--code-str);} .tok-com{color:var(--code-com);font-style:italic;} .tok-fn{color:var(--code-fn);}
  .mcq-grid{ display:grid; grid-template-columns:1fr 1fr; gap:18px; }
  .mcq-card{
    background:var(--bg); border:none; border-radius:var(--radius); padding:18px 20px;
    box-shadow: 8px 8px 16px var(--sh-dark), -8px -8px 16px var(--sh-light);
  }
  .mcq-card p.q{ margin:0 0 14px 0; font-weight:700; color:var(--ink); font-size:20px;}
  .mcq-card ul{ list-style:none; margin:0; padding:0; }
  .mcq-card li{ padding:8px 0 8px 26px; position:relative; font-size:18px; color:var(--ink-soft);}
  .mcq-card li::before{ content: attr(data-letter); position:absolute; left:0; font-weight:700; color:var(--accent);}
  .mcq-card.center-last{ grid-column: 1 / -1; max-width:600px; margin:0 auto; }
  .id-card{
    background:var(--bg); border:none; border-radius:var(--radius); padding:22px 24px;
    box-shadow: 8px 8px 16px var(--sh-dark), -8px -8px 16px var(--sh-light);
  }
  .id-card h4{ margin:0 0 12px 0; font-size:19px; color:var(--ink);}
  .answer-list{ display:grid; gap:14px; }
  .answer-item{
    background:var(--bg); border:none; border-radius:16px; padding:14px 18px;
    box-shadow: 6px 6px 12px var(--sh-dark), -6px -6px 12px var(--sh-light);
  }
  .answer-item .a-head{ font-weight:700; font-size:16px; color:var(--accent-2); margin-bottom:6px;}
  .answer-item .a-body{ font-size:16px; color:var(--ink-soft); }
  .hero-grid{
    display:grid; grid-template-columns: 1.1fr 0.9fr; align-items:center; gap:36px; height:100%;
  }
  .hero-title{
    display:flex; flex-direction:column; justify-content:center; align-items:flex-start;
    gap:20px;
  }
  .hero-title h1{ font-size:52px; line-height:1.05; margin:0; font-weight:800; letter-spacing:-.02em;}
  .hero-title .subtitle{ font-size:19px; color:var(--ink-soft); max-width:600px; }
  .hero-visual{
    background:var(--bg); border-radius:24px; padding:22px;
    box-shadow: 10px 10px 22px var(--sh-dark), -10px -10px 22px var(--sh-light);
  }
  .hero-visual svg{ width:100%; height:auto; display:block; }
  .figure-card{
    background:var(--bg); border-radius:var(--radius); padding:14px;
    box-shadow: 8px 8px 16px var(--sh-dark), -8px -8px 16px var(--sh-light);
    overflow:hidden;
    display:flex; flex-direction:column;
  }
  .figure-card img{
    width:100%; height:clamp(160px, 24vh, 260px); object-fit:cover;
    display:block; border-radius:14px; flex-shrink:0;
  }
  .figure-card .cap{ font-size:16px; color:var(--ink-soft); padding:10px 6px 2px; font-style:italic; }
  .diagram-card{
    background:var(--bg); border-radius:var(--radius); padding:18px;
    box-shadow: 8px 8px 16px var(--sh-dark), -8px -8px 16px var(--sh-light);
  }
  .diagram-card svg{ width:100%; height:min(230px, 28vh); display:block; margin:0 auto; }
  .icon-chip{
    background:var(--bg); border-radius:16px; padding:12px; display:inline-flex;
    box-shadow: 6px 6px 12px var(--sh-dark), -6px -6px 12px var(--sh-light);
    margin-bottom:12px;
  }
  .closing-wrap{ display:flex; flex-direction:column; align-items:center; justify-content:center; height:100%; text-align:center; gap:26px;}
  .closing-wrap h2{ font-size:30px; margin:0; }
  /* progress + counter */
  #progress-bar{
    position:fixed; top:0; left:0; height:5px; background:var(--accent-grad); z-index:20;
    transition:width 300ms ease; border-radius: 0 4px 4px 0;
  }
  #counter{
    position:fixed; bottom:20px; right:26px; z-index:20;
    font-size:16px; font-weight:700; color:var(--ink-soft);
    background:var(--bg); border:none; border-radius:999px;
    padding:8px 18px;
    box-shadow: 5px 5px 10px var(--sh-dark), -5px -5px 10px var(--sh-light);
  }
  #shortcuts-overlay{
    position:fixed; inset:0; background:rgba(5,7,12,.65); display:none;
    align-items:center; justify-content:center; z-index:50;
  }
  #shortcuts-overlay.show{ display:flex; }
  #shortcuts-overlay .box{
    background:var(--bg); border-radius:22px; padding:32px 36px; max-width:440px;
    box-shadow: 14px 14px 28px var(--sh-dark-strong), -10px -10px 24px var(--sh-light);
  }
  #shortcuts-overlay h3{ margin-top:0; font-size:19px; }
  #shortcuts-overlay table{ width:100%; font-size:16px; border-collapse:collapse; }
  #shortcuts-overlay td{ padding:8px 0; color:var(--ink-soft); }
  #shortcuts-overlay td.key{ font-weight:700; color:var(--ink); width:140px; }
  kbd{
    background:var(--bg); border:none; border-radius:7px; padding:3px 9px; font-size:16px;
    box-shadow: 3px 3px 6px var(--sh-dark), -3px -3px 6px var(--sh-light);
  }
  code.inline{
    background:var(--bg); border:none; border-radius:7px; padding:2px 8px; font-size:16px;
    color:var(--accent); font-family:"SF Mono",Menlo,Consolas,monospace;
    box-shadow: inset 2px 2px 5px var(--sh-dark), inset -2px -2px 5px var(--sh-light);
  }
  ::-webkit-scrollbar{ width:8px; height:8px; }
  ::-webkit-scrollbar-thumb{ background:#c7d2e0; border-radius:8px; }
</style>

</head>
<body>

<div id="progress-bar"></div>
<div id="counter">1 / 19</div>
<div id="deck"></div>

<div id="shortcuts-overlay">
  <div class="box">
    <h3>Keyboard Shortcuts</h3>
    <table>
      <tr><td class="key"><kbd>&rarr;</kbd> / right-click</td><td>Next slide</td></tr>
      <tr><td class="key"><kbd>&larr;</kbd></td><td>Previous slide</td></tr>
      <tr><td class="key"><kbd>Home</kbd></td><td>First slide</td></tr>
      <tr><td class="key"><kbd>End</kbd></td><td>Last slide</td></tr>
      <tr><td class="key"><kbd>?</kbd></td><td>Toggle this overlay</td></tr>
      <tr><td class="key">Swipe</td><td>Navigate on mobile</td></tr>
    </table>
  </div>
</div>

<script>
(function(){

// ---------- Inline SVG logo helpers ----------
const wixLogo = `<svg width="28" height="28" viewBox="0 0 48 48" role="img" aria-label="Wix logo"><title>Wix</title><rect width="48" height="48" rx="10" fill="#0C0C0C"/><path d="M13 17c.6 0 1.1.4 1.3 1l2.4 8.6L19.2 18c.3-1 1-1.6 2-1.6s1.7.6 2 1.6l2.5 8.6L28.1 18c.2-.6.7-1 1.3-1 .9 0 1.5.7 1.5 1.5 0 .2 0 .4-.1.6l-3.5 11.4c-.3 1-1 1.6-2 1.6s-1.7-.6-2-1.6L21 22.2l-2.3 8.3c-.3 1-1 1.6-2 1.6s-1.7-.6-2-1.6L11.2 19c-.1-.2-.1-.4-.1-.6 0-.8.7-1.4 1.9-1.4z" fill="#fff"/><path d="M35.5 16.6c-.9 0-1.6.7-1.6 1.6v11.3c0 .9.7 1.6 1.6 1.6s1.6-.7 1.6-1.6V18.2c0-.9-.7-1.6-1.6-1.6z" fill="#fff"/><circle cx="35.5" cy="12.4" r="1.9" fill="#fff"/></svg>`;
const bloggerLogo = `<svg width="28" height="28" viewBox="0 0 48 48" role="img" aria-label="Blogger logo"><title>Blogger</title><rect width="48" height="48" rx="10" fill="#FF8000"/><rect x="12" y="10" width="24" height="28" rx="4" fill="#fff"/><rect x="17" y="17" width="10" height="4" rx="2" fill="#FF8000"/><rect x="17" y="24" width="14" height="3" rx="1.5" fill="#FFCC99"/><rect x="17" y="29" width="14" height="3" rx="1.5" fill="#FFCC99"/></svg>`;
const jsLogo = `<svg width="28" height="28" viewBox="0 0 48 48" role="img" aria-label="JavaScript logo"><title>JavaScript</title><rect width="48" height="48" rx="8" fill="#F0DB4F"/><text x="24" y="33" font-family="Arial,sans-serif" font-weight="700" font-size="18" text-anchor="middle" fill="#141414">JS</text></svg>`;
const htmlLogo = `<svg width="28" height="28" viewBox="0 0 48 48" role="img" aria-label="HTML logo"><title>HTML5</title><polygon points="8,4 40,4 37,38 24,42 11,38" fill="#E44D26"/><polygon points="24,7 24,39 34,36 36.5,10" fill="#F16529"/><text x="24" y="27" font-family="Arial,sans-serif" font-weight="700" font-size="12" text-anchor="middle" fill="#fff">5</text></svg>`;
const cssLogo = `<svg width="28" height="28" viewBox="0 0 48 48" role="img" aria-label="CSS logo"><title>CSS3</title><polygon points="8,4 40,4 37,38 24,42 11,38" fill="#1572B6"/><polygon points="24,7 24,39 34,36 36.5,10" fill="#33A9DC"/><text x="24" y="27" font-family="Arial,sans-serif" font-weight="700" font-size="12" text-anchor="middle" fill="#fff">3</text></svg>`;

function logoRow(){
  return `<div class="badge-row">
    <span class="badge">${wixLogo} Wix</span>
    <span class="badge">${bloggerLogo} Blogspot</span>
    <span class="badge">${htmlLogo} HTML</span>
    <span class="badge">${cssLogo} CSS</span>
    <span class="badge">${jsLogo} JavaScript</span>
  </div>`;
}

// ---------- Illustrative diagram SVGs ----------
const heroBuilderSvg = `<svg viewBox="0 0 460 340" role="img" aria-label="Illustration of a drag-and-drop website builder interface" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="hg1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5b8cff"/><stop offset="100%" stop-color="#2dd4b6"/>

  </defs>
  <rect x="20" y="20" width="420" height="300" rx="18" fill="#1b2130" stroke="#333c52" stroke-width="2"/>
  <rect x="20" y="20" width="420" height="34" rx="18" fill="#232a3c"/>
  <circle cx="42" cy="37" r="5" fill="#5b8cff"/><circle cx="60" cy="37" r="5" fill="#2dd4b6"/><circle cx="78" cy="37" r="5" fill="#aab4cc"/>
  <rect x="44" y="74" width="110" height="226" rx="10" fill="#232a3c"/>
  <rect x="58" y="90" width="82" height="10" rx="3" fill="#5b8cff"/>
  <rect x="58" y="112" width="82" height="34" rx="6" fill="url(#hg1)" opacity="0.85"/>
  <rect x="58" y="154" width="82" height="34" rx="6" fill="#2b3548"/>
  <rect x="58" y="196" width="82" height="34" rx="6" fill="#2b3548"/>
  <rect x="58" y="238" width="82" height="34" rx="6" fill="#2b3548"/>
  <rect x="172" y="74" width="252" height="226" rx="10" fill="#12161f"/>
  <rect x="192" y="96" width="140" height="14" rx="4" fill="#eef2fa"/>
  <rect x="192" y="120" width="200" height="8" rx="4" fill="#5b6c8a"/>
  <rect x="192" y="140" width="160" height="8" rx="4" fill="#5b6c8a"/>
  <rect x="192" y="166" width="92" height="60" rx="8" fill="url(#hg1)" opacity="0.9"/>
  <rect x="296" y="166" width="92" height="60" rx="8" fill="#2b3548" stroke="#5b8cff" stroke-width="2" stroke-dasharray="6 5"/>
  <rect x="192" y="240" width="196" height="34" rx="8" fill="#2b3548"/>
  <circle cx="352" cy="150" r="14" fill="#eef2fa"/>
  <path d="M346 150 l4 4 8 -9" stroke="#12161f" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <g>
    <path d="M300 240 L330 205" stroke="#2dd4b6" stroke-width="2.5" stroke-linecap="round"/>
    <polygon points="330,205 322,207 328,213" fill="#2dd4b6"/>
  </g>
</svg>`;

function wixAccountFlowSvg(){
  const steps = ['Visit wix.com','Sign Up','Verify Email','Choose Type','Publish'];
  const w = 900, h = 190, n = steps.length;
  const cx = i => 90 + i*((w-180)/(n-1));
  let nodes = '', lines = '';
  steps.forEach((label,i)=>{
    const x = cx(i);
    if(i < n-1){
      lines += `<line x1="${x+34}" y1="70" x2="${cx(i+1)-34}" y2="70" stroke="#3a4359" stroke-width="3" stroke-dasharray="1 10" stroke-linecap="round"/>`;
    }
    nodes += `<g>
      <circle cx="${x}" cy="70" r="34" fill="#1b2130" stroke="url(#fg1)" stroke-width="3"/>
      <text x="${x}" y="78" text-anchor="middle" font-family="Arial,sans-serif" font-weight="800" font-size="22" fill="#eef2fa">${i+1}</text>
      <text x="${x}" y="128" text-anchor="middle" font-family="Arial,sans-serif" font-weight="600" font-size="15" fill="#aab4cc">${label}</text>
    </g>`;
  });
  return `<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="Flow diagram of the five steps to create a Wix account" xmlns="http://www.w3.org/2000/svg">
    <defs><linearGradient id="fg1" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#5b8cff"/><stop offset="100%" stop-color="#2dd4b6"/></linearGradient></defs>
    ${lines}${nodes}
  </svg>`;
}

const sandboxSvg = `<svg viewBox="0 0 520 260" role="img" aria-label="Diagram showing custom JavaScript running inside a sandboxed iframe, isolated from the main Wix page layout" xmlns="http://www.w3.org/2000/svg">
  <rect x="10" y="10" width="500" height="240" rx="18" fill="#1b2130" stroke="#333c52" stroke-width="2"/>

// ---------- Tiny syntax highlighter (single pass) ----------
function esc(s){ return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function highlight(code, lang){
  code = esc(code);
  const rules = {
    html: [
      [/(&lt;!--[\s\S]*?--&gt;)/g, 'tok-com'],
      [/(&lt;\/?[a-zA-Z0-9-]+)/g, 'tok-key'],
      [/(&quot;[^&]*?&quot;|"[^"]*")/g, 'tok-str']
    ],
    css: [
      [/(\/\*[\s\S]*?\*\/)/g, 'tok-com'],
      [/([.#]?[a-zA-Z-]+)(?=\s*\{)/g, 'tok-key'],
      [/(#[0-9a-fA-F]{3,6}|\b\d+px\b|\b\d+%\b)/g, 'tok-fn']
    ],
    javascript: [
      [/(\/\/.*$)/gm, 'tok-com'],
      [/('[^']*'|"[^"]*")/g, 'tok-str'],
      [/\b(const|let|var|function|return|if|else|forEach|new|document|addEventListener|textContent|createElement|getElementById|appendChild)\b/g, 'tok-key']
    ]
  };
  const set = rules[lang] || rules.javascript;
  set.forEach(([re, cls])=>{ code = code.replace(re, m => `<span class="${cls}">${m}</span>`); });
  return code;
}
function codeBlock(id, lang, raw, label){
  const highlighted = highlight(raw, lang);
  return `<div class="code-card">
    <div class="code-head"><span>${label}</span><button class="copy-btn" data-code-id="${id}">Copy</button></div>
    <pre id="${id}"><code>${highlighted}</code></pre>
  </div>`;
}

// ---------------- ENGINE ----------------
const deck = document.getElementById('deck');
let current = 0;
let lastDir = 1;

function renderSlide(el, s){
  el.innerHTML = s.hideHeader
    ? s.html
    : `<span class="eyebrow">${s.eyebrow}</span><h1 class="slide-title">${s.title}</h1><div class="slide-body">${s.html}</div>`;
}

slides.forEach((s, i)=>{
  const el = document.createElement('div');
  el.className = 'slide';
  el.dataset.index = i;
  renderSlide(el, s);
  deck.appendChild(el);
});

function update(){
  const els = deck.querySelectorAll('.slide');
  els.forEach((el, i)=>{
    el.classList.remove('active','exit-left','exit-right');
    if(i === current){ el.classList.add('active'); }
  });
  document.getElementById('progress-bar').style.width = ((current+1)/slides.length*100)+'%';
  document.getElementById('counter').textContent = (current+1)+' / '+slides.length;
}
function goTo(i){
  if(i < 0 || i >= slides.length || i === current) return;
  lastDir = i > current ? 1 : -1;
  current = i;
  update();
}
function next(){ if(current < slides.length-1) goTo(current+1); }
function prev(){ if(current > 0) goTo(current-1); }

update();

// ---------- Copy buttons ----------
deck.addEventListener('click', function(e){
  const btn = e.target.closest('.copy-btn');
  if(!btn) return;
  const id = btn.getAttribute('data-code-id');
  const raw = RAW[id.replace('code-','')];
  navigator.clipboard.writeText(raw).then(()=>{
    const orig = btn.textContent;
    btn.textContent = 'Copied!';
    btn.classList.add('copied');
    setTimeout(()=>{ btn.textContent = orig; btn.classList.remove('copied'); }, 1400);
  });
});

// ---------- Navigation: keyboard ----------
document.addEventListener('keydown', function(e){
  if(e.key === '?'){ toggleShortcuts(); return; }
  if(document.getElementById('shortcuts-overlay').classList.contains('show')){
    if(e.key === 'Escape'){ toggleShortcuts(); }
    return;
  }
  if(e.key === 'ArrowRight'){ next(); }
  else if(e.key === 'ArrowLeft'){ prev(); }
  else if(e.key === 'Home'){ goTo(0); }
  else if(e.key === 'End'){ goTo(slides.length-1); }
});

// ---------- Navigation: right-click + mouse buttons ----------
document.addEventListener('contextmenu', function(e){ e.preventDefault(); next(); });
document.addEventListener('mousedown', function(e){
  if(e.button === 3){ e.preventDefault(); e.stopImmediatePropagation(); prev(); }
  else if(e.button === 4){ e.preventDefault(); e.stopImmediatePropagation(); next(); }
}, true);

// ---------- Swipe (mobile) ----------
let touchStartX = null, touchStartY = null;
document.addEventListener('touchstart', function(e){
  touchStartX = e.changedTouches[0].clientX;
  touchStartY = e.changedTouches[0].clientY;
}, {passive:true});
document.addEventListener('touchend', function(e){
  if(touchStartX === null) return;
  const dx = e.changedTouches[0].clientX - touchStartX;
  const dy = e.changedTouches[0].clientY - touchStartY;
  if(Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)){
    if(dx < 0){ next(); } else { prev(); }
  }
  touchStartX = null; touchStartY = null;
}, {passive:true});

// ---------- Shortcuts overlay ----------
function toggleShortcuts(){
  document.getElementById('shortcuts-overlay').classList.toggle('show');
}
document.getElementById('shortcuts-overlay').addEventListener('click', function(e){
  if(e.target === this){ toggleShortcuts(); }
});

})();
</script>
