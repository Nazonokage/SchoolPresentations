<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Interactive Web Mapping with Leaflet.js</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap');
  :root{
    --bg:#12151f;
    --bg-raised:#1a1f2e;
    --bg-raised-2:#171c29;
    --shadow-dark:#090b11;
    --shadow-light:#252c40;
    --text:#eef1f8;
    --text-dim:#b3bcd4;
    --text-faint:#8791ab;
    --accent:#4fd6c4;
    --accent-soft:rgba(79,214,196,0.14);
    --accent-2:#f5a962;
    --accent-2-soft:rgba(245,169,98,0.14);
    --accent-3:#7c9eff;
    --accent-3-soft:rgba(124,158,255,0.14);
    --danger:#ef7b8c;
    --grid-line:rgba(124,158,255,0.05);
    --hairline:rgba(238,241,248,0.055);
    --radius-lg:24px;
    --radius-md:18px;
    --radius-sm:12px;
    --code-bg:#0c0f17;
    --font-display:'Space Grotesk',-apple-system,"Segoe UI",Roboto,sans-serif;
    --font-body:'Inter',-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    --font-mono:'JetBrains Mono',"SFMono-Regular",Consolas,"Liberation Mono",Menlo,monospace;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:var(--font-body);
    overflow:hidden;
    -webkit-tap-highlight-color:transparent;
    user-select:none;
  }
  ::selection{ background:var(--accent); color:#0c1016; }
  input, textarea{ user-select:text; }

  .deck{
    position:relative; width:100vw; height:100vh; overflow:hidden;
    background:
      radial-gradient(ellipse 1100px 750px at 12% -8%, rgba(124,158,255,0.09), transparent 60%),
      radial-gradient(ellipse 1000px 700px at 105% 108%, rgba(79,214,196,0.08), transparent 60%),
      var(--bg);
  }
  .deck::before{
    content:"";
    position:absolute; inset:0; z-index:0; pointer-events:none;
    background-image:
      linear-gradient(var(--grid-line) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
    background-size:66px 66px;
    -webkit-mask-image:radial-gradient(ellipse 78% 68% at 50% 42%, #000 0%, transparent 78%);
    mask-image:radial-gradient(ellipse 78% 68% at 50% 42%, #000 0%, transparent 78%);
  }
  .slides{ position:relative; z-index:1; }

  /* ---------- progress + counter ---------- */
  .progress-track{
    position:fixed; top:0; left:0; right:0; height:5px; z-index:50;
    background:var(--shadow-dark);
    box-shadow:inset 2px 2px 4px var(--shadow-dark), inset -2px -2px 4px var(--shadow-light);
  }
  .progress-bar{
    height:100%; width:0%;
    background:linear-gradient(90deg,var(--accent),var(--accent-3));
    transition:width 350ms ease;
  }
  .counter{
    position:fixed; bottom:22px; right:26px; z-index:50;
    font-family:var(--font-mono);
    font-size:15px; font-weight:500; letter-spacing:0.02em;
    color:var(--text-dim);
    background:var(--bg-raised);
    border:1px solid var(--hairline);
    padding:9px 18px; border-radius:999px;
    box-shadow:6px 6px 12px var(--shadow-dark), -6px -6px 12px var(--shadow-light);
  }
  .hint{
    position:fixed; bottom:22px; left:26px; z-index:50;
    font-size:15px; color:var(--text-faint);
    background:var(--bg-raised);
    border:1px solid var(--hairline);
    padding:9px 18px; border-radius:999px;
    box-shadow:6px 6px 12px var(--shadow-dark), -6px -6px 12px var(--shadow-light);
  }
  .hint kbd{
    font-family:var(--font-mono);
    background:var(--bg); border-radius:6px; padding:1px 7px; font-size:14px;
    box-shadow:inset 2px 2px 4px var(--shadow-dark), inset -2px -2px 4px var(--shadow-light);
    color:var(--accent);
  }

  /* ---------- slides ---------- */
  .slides{ position:relative; width:100%; height:100%; }
  .slide{
    position:absolute; inset:0;
    display:none;
    flex-direction:column;
    padding:64px 84px 90px 84px;
    overflow-y:auto;
  }
  .slide.active{ display:flex; }
  @keyframes enterNext{ from{opacity:0; transform:translateX(56px);} to{opacity:1; transform:translateX(0);} }
  @keyframes enterPrev{ from{opacity:0; transform:translateX(-56px);} to{opacity:1; transform:translateX(0);} }
  .slide.enter-next{ animation:enterNext 350ms ease; }
  .slide.enter-prev{ animation:enterPrev 350ms ease; }
  @media (prefers-reduced-motion:reduce){
    .slide.enter-next, .slide.enter-prev{ animation:none; }
    .progress-bar{ transition:none; }
  }

  .eyebrow{
    display:flex; align-items:center; gap:10px;
    font-family:var(--font-mono);
    font-size:13px; font-weight:500; letter-spacing:0.1em; text-transform:uppercase;
    color:var(--accent); margin:0 0 16px 0;
  }
  .eyebrow::before{
    content:""; width:22px; height:1px; flex-shrink:0;
    background:linear-gradient(90deg,var(--accent),transparent);
  }
  h1.title, h2.title{ font-family:var(--font-display); }
  h1.title{ font-size:48px; line-height:1.12; margin:0 0 12px 0; font-weight:700; letter-spacing:-0.015em; }
  h2.title{ font-size:34px; line-height:1.2; margin:0 0 22px 0; font-weight:700; letter-spacing:-0.015em; }
  .subtitle{ font-size:19px; color:var(--text-dim); max-width:760px; line-height:1.65; margin:0 0 8px 0; }

  .content{ flex:1; min-height:0; display:flex; flex-direction:column; }

  .card{
    background:var(--bg-raised);
    border:1px solid var(--hairline);
    border-radius:var(--radius-md);
    box-shadow:10px 10px 24px var(--shadow-dark), -10px -10px 24px var(--shadow-light);
    padding:26px 28px;
  }
  .card.inset{
    box-shadow:inset 6px 6px 12px var(--shadow-dark), inset -6px -6px 12px var(--shadow-light);
  }
  .grid{ display:grid; gap:22px; }
  .grid-2{ grid-template-columns:minmax(0,1fr) minmax(0,1fr); }
  .grid-3{ grid-template-columns:repeat(3,minmax(0,1fr)); }
  .grid-4{ grid-template-columns:repeat(4,minmax(0,1fr)); }

  p{ font-size:17px; line-height:1.7; color:var(--text-dim); margin:0 0 12px 0; }
  li{ font-size:17px; line-height:1.65; color:var(--text-dim); }
  strong{ color:var(--text); }
  a{ color:var(--accent); }

  .badge{
    display:inline-flex; align-items:center; gap:8px;
    font-family:var(--font-display);
    font-size:15px; font-weight:600; color:var(--text);
    background:var(--bg-raised); border:1px solid var(--hairline);
    padding:9px 16px; border-radius:999px;
    box-shadow:5px 5px 10px var(--shadow-dark), -5px -5px 10px var(--shadow-light);
  }
  .badge svg{ width:22px; height:22px; flex-shrink:0; }
  .badge-row{ display:flex; gap:14px; flex-wrap:wrap; margin-top:18px; }

  .icon-chip{
    width:52px; height:52px; border-radius:16px; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    background:var(--bg-raised); border:1px solid var(--hairline);
    box-shadow:5px 5px 10px var(--shadow-dark), -5px -5px 10px var(--shadow-light);
  }
  .icon-chip svg{ width:28px; height:28px; }

  .num-chip{
    width:40px; height:40px; border-radius:12px; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    font-family:var(--font-mono);
    background:var(--bg); font-weight:600; font-size:16px; color:var(--accent);
    box-shadow:inset 3px 3px 6px var(--shadow-dark), inset -3px -3px 6px var(--shadow-light);
  }

  .img-box{
    border-radius:var(--radius-md); overflow:hidden;
    border:1px solid var(--hairline);
    box-shadow:10px 10px 24px var(--shadow-dark), -10px -10px 24px var(--shadow-light);
  }
  .img-box img{ width:100%; height:100%; object-fit:cover; display:block; }

  .footnote{ font-size:15px; color:var(--text-faint); margin-top:6px; }

  .quote-mark{ font-family:var(--font-display); font-size:44px; color:var(--accent); line-height:1; margin-bottom:4px; display:block; }

  /* code panels */
  .code-row{ display:grid; grid-template-columns:minmax(0,1.35fr) minmax(0,1fr); gap:22px; height:min(540px,60vh); min-height:0; }
  .code-row.single{ grid-template-columns:minmax(0,1fr); }
  .code-card{
    display:flex; flex-direction:column; height:100%; min-height:0;
    background:var(--code-bg); border:1px solid var(--hairline); border-radius:var(--radius-md); overflow:hidden;
    box-shadow:10px 10px 24px var(--shadow-dark), -10px -10px 24px var(--shadow-light);
  }
  .code-head{
    flex-shrink:0; display:flex; align-items:center; justify-content:space-between;
    padding:14px 18px; background:var(--bg-raised-2);
    border-bottom:1px solid var(--hairline);
  }
  .code-head .fname{ font-family:var(--font-mono); font-size:14px; font-weight:500; color:var(--text-dim); letter-spacing:0.02em; }
  .copy-btn{
    font-family:var(--font-display);
    font-size:14px; font-weight:600; color:var(--text);
    background:var(--bg-raised); border:1px solid var(--hairline); cursor:pointer;
    padding:8px 16px; border-radius:10px;
    box-shadow:4px 4px 8px var(--shadow-dark), -4px -4px 8px var(--shadow-light);
  }
  .copy-btn:active, .copy-btn.copied{
    box-shadow:inset 3px 3px 6px var(--shadow-dark), inset -3px -3px 6px var(--shadow-light);
    color:var(--accent);
  }
  .code-card pre{
    flex:1; overflow:auto; min-height:0; margin:0;
    padding:18px 20px; font-size:15px; line-height:1.65;
    font-family:var(--font-mono);
  }
  .code-card code{ white-space:pre; }
  .tok-tag{ color:#7c9eff; } .tok-attr{ color:#f5a962; } .tok-str{ color:#8ee6b0; }
  .tok-kw{ color:#c792ea; } .tok-fn{ color:#82d4f0; } .tok-com{ color:#6d7690; }
  .tok-num{ color:#f5a962; } .tok-punct{ color:#9aa4ba; }

  .notes-panel{
    height:100%; min-height:0; overflow-y:auto;
    display:flex; flex-direction:column; gap:14px;
    background:var(--bg-raised); border:1px solid var(--hairline); border-radius:var(--radius-md);
    padding:22px 24px;
    box-shadow:10px 10px 24px var(--shadow-dark), -10px -10px 24px var(--shadow-light);
  }
  .notes-panel h3{ font-size:19px; margin:0 0 2px 0; color:var(--text); }
  .step-line{ display:flex; gap:12px; align-items:flex-start; }
  .step-line p{ margin:0; }
  .step-line svg{ width:20px; height:20px; flex-shrink:0; margin-top:3px; }

  /* MCQ */
  .mcq-card{
    background:var(--bg-raised); border:1px solid var(--hairline); border-radius:var(--radius-md);
    padding:22px 24px;
    box-shadow:8px 8px 18px var(--shadow-dark), -8px -8px 18px var(--shadow-light);
  }
  .mcq-q{ font-family:var(--font-display); font-size:18px; font-weight:600; color:var(--text); margin-bottom:12px; }
  .mcq-opt{
    font-size:15px; color:var(--text-dim); padding:9px 12px; border-radius:10px;
    margin-bottom:7px; background:var(--bg);
    box-shadow:inset 3px 3px 6px var(--shadow-dark), inset -3px -3px 6px var(--shadow-light);
  }
  .mcq-opt b{ font-family:var(--font-mono); color:var(--accent); margin-right:8px; }
  .mcq-grid{ display:grid; grid-template-columns:1fr 1fr; gap:20px; }
  .mcq-centered{ max-width:calc(50% - 10px); margin:0 auto; }

  .answer-card{
    background:var(--bg-raised); border:1px solid var(--hairline); border-radius:var(--radius-md);
    padding:18px 22px; box-shadow:8px 8px 18px var(--shadow-dark), -8px -8px 18px var(--shadow-light);
  }
  .answer-card .ans{ font-family:var(--font-mono); color:var(--accent); font-weight:600; font-size:16px; }
  .answer-card p{ margin:6px 0 0 0; font-size:15px; }

  /* shortcuts overlay */
  .overlay{
    position:fixed; inset:0; z-index:100; display:none;
    align-items:center; justify-content:center;
    background:rgba(6,7,11,0.78); backdrop-filter:blur(4px);
  }
  .overlay.show{ display:flex; }
  .overlay-card{
    background:var(--bg-raised); border:1px solid var(--hairline); border-radius:var(--radius-lg);
    padding:40px 44px; max-width:560px; width:90%;
    box-shadow:16px 16px 32px var(--shadow-dark), -16px -16px 32px var(--shadow-light);
  }
  .overlay-card h2{ font-family:var(--font-display); font-size:25px; font-weight:600; margin:0 0 20px 0; }
  .shortcut-row{ display:flex; justify-content:space-between; align-items:center; padding:11px 0; border-bottom:1px solid var(--hairline); font-size:16px; color:var(--text-dim); }
  .shortcut-row:last-child{ border-bottom:none; }
  .shortcut-row kbd{
    font-family:var(--font-mono);
    background:var(--bg); color:var(--accent); font-weight:600;
    padding:5px 12px; border-radius:8px; font-size:14px;
    box-shadow:inset 3px 3px 6px var(--shadow-dark), inset -3px -3px 6px var(--shadow-light);
  }

  h3{ font-family:var(--font-display); font-size:19px; font-weight:600; color:var(--text); margin:0 0 8px 0; }

  ::-webkit-scrollbar{ width:10px; height:10px; }
  ::-webkit-scrollbar-track{ background:transparent; }
  ::-webkit-scrollbar-thumb{ background:var(--shadow-light); border-radius:10px; }

  @media (max-width:900px){
    .slide{ padding:36px 22px 80px 22px; }
    h1.title{ font-size:32px; }
    h2.title{ font-size:26px; }
    .grid-2, .grid-3, .grid-4{ grid-template-columns:1fr; }
    .code-row{ grid-template-columns:1fr; height:auto; }
    .code-row .code-card{ height:min(360px,50vh); }
    .mcq-grid{ grid-template-columns:1fr; }
    .mcq-centered{ max-width:100%; }
  }
</style>
</head>
<body>

<div class="deck">
  <div class="progress-track"><div class="progress-bar" id="progressBar"></div></div>
  <div class="counter" id="counter">1 / 21</div>
  <div class="hint">Right-click or <kbd>&#8594;</kbd> next &nbsp;·&nbsp; <kbd>?</kbd> shortcuts</div>

  <div class="slides" id="slides"></div>

  <div class="overlay" id="shortcutsOverlay">
    <div class="overlay-card">
      <h2>Keyboard &amp; Mouse Shortcuts</h2>
      <div class="shortcut-row"><span>Next slide</span><span><kbd>&#8594;</kbd> or right-click or Mouse4</span></div>
      <div class="shortcut-row"><span>Previous slide</span><span><kbd>&#8592;</kbd> or Mouse3</span></div>
      <div class="shortcut-row"><span>First slide</span><span><kbd>Home</kbd></span></div>
      <div class="shortcut-row"><span>Last slide</span><span><kbd>End</kbd></span></div>
      <div class="shortcut-row"><span>Toggle this panel</span><span><kbd>?</kbd></span></div>
      <div class="shortcut-row"><span>Close panel</span><span><kbd>Esc</kbd></span></div>
    </div>
  </div>
</div>

  '<div style="margin-bottom:18px;">' + ICONS.spark.replace('viewBox="0 0 24 24"','viewBox="0 0 24 24" width="52" height="52"') + '</div>' +
  '<div class="eyebrow">NICE WORK</div>' +
  '<h1 class="title">You Just Mapped Your First App</h1>' +
  '<div class="card inset" style="max-width:760px; margin:18px 0 22px 0;">' +
    '<span class="quote-mark">&ldquo;</span>' +
    '<p style="color:var(--text); font-size:19px; margin:0;">Leaflet is 100% open-source, and OpenStreetMap tiles are available for free &mdash; making it the go-to choice for student and hobbyist mapping.</p>' +
  '</div>' +
  '<p class="subtitle">From here, try swapping the hardcoded dictionary for a real Nominatim lookup, or add more cities of your own. Great work getting &ldquo;Where You At?&rdquo; up and running!</p>' +
'</div>'
);

/* =========================================================
   Render slides
   ========================================================= */
var container = document.getElementById("slides");
for (var i = 0; i < slides.length; i++){
  var sec = document.createElement("section");
  sec.className = "slide";
  sec.setAttribute("data-index", String(i));
  sec.innerHTML = slides[i];
  container.appendChild(sec);
}

var slideEls = document.querySelectorAll(".slide");
var currentIndex = 0;
var progressBar = document.getElementById("progressBar");
var counterEl = document.getElementById("counter");
var overlay = document.getElementById("shortcutsOverlay");
var reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

function updateChrome(){
  var pct = (currentIndex / (slideEls.length - 1)) * 100;
  progressBar.style.width = pct + "%";
  counterEl.textContent = (currentIndex + 1) + " / " + slideEls.length;
}

function goTo(newIndex){
  if (newIndex < 0 || newIndex >= slideEls.length || newIndex === currentIndex) return;
  var dir = newIndex > currentIndex ? "next" : "prev";
  var oldEl = slideEls[currentIndex];
  oldEl.classList.remove("active", "enter-next", "enter-prev");
  oldEl.style.display = "none";
  currentIndex = newIndex;
  var newEl = slideEls[currentIndex];
  newEl.style.display = "flex";
  newEl.classList.remove("enter-next", "enter-prev");
  if (!reduceMotion){
    void newEl.offsetWidth;
    newEl.classList.add(dir === "next" ? "enter-next" : "enter-prev");
  }
  newEl.classList.add("active");
  updateChrome();
}

function next(){ goTo(currentIndex + 1); }
function prev(){ goTo(currentIndex - 1); }
function first(){ goTo(0); }
function last(){ goTo(slideEls.length - 1); }

slideEls[0].style.display = "flex";
slideEls[0].classList.add("active");
updateChrome();

/* ---------- keyboard ---------- */
document.addEventListener("keydown", function(e){
  if (overlay.classList.contains("show")){
    if (e.key === "Escape" || e.key === "?"){ overlay.classList.remove("show"); }
    return;
  }
  if (e.key === "ArrowRight" || e.key === "PageDown"){ next(); }
  else if (e.key === "ArrowLeft" || e.key === "PageUp"){ prev(); }
  else if (e.key === "Home"){ first(); }
  else if (e.key === "End"){ last(); }
  else if (e.key === "?"){ overlay.classList.add("show"); }
});

/* ---------- right-click = next, block context menu ---------- */
document.addEventListener("contextmenu", function(e){
  e.preventDefault();
  next();
});

/* ---------- Mouse4 / Mouse5 (browser back/forward buttons) ---------- */
document.addEventListener("mousedown", function(e){
  if (e.button === 3){
    e.preventDefault();
    e.stopImmediatePropagation();
    prev();
  } else if (e.button === 4){
    e.preventDefault();
    e.stopImmediatePropagation();
    next();
  }
}, true);

/* ---------- swipe on mobile ---------- */
var touchStartX = 0, touchStartY = 0;
document.addEventListener("touchstart", function(e){
  if (!e.changedTouches || !e.changedTouches.length) return;
  touchStartX = e.changedTouches[0].clientX;
  touchStartY = e.changedTouches[0].clientY;
}, { passive:true });

document.addEventListener("touchend", function(e){
  if (!e.changedTouches || !e.changedTouches.length) return;
  var dx = e.changedTouches[0].clientX - touchStartX;
  var dy = e.changedTouches[0].clientY - touchStartY;
  if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)){
    if (dx < 0){ next(); } else { prev(); }
  }
}, { passive:true });

/* ---------- copy buttons ---------- */
document.addEventListener("click", function(e){
  var btn = e.target.closest ? e.target.closest(".copy-btn") : null;
  if (!btn) return;
  var targetId = btn.getAttribute("data-copy-target");
  var codeEl = document.getElementById(targetId);
  if (!codeEl) return;
  var text = codeEl.textContent;
  var restore = btn.textContent;
  function markCopied(){
    btn.textContent = "Copied!";
    btn.classList.add("copied");
    setTimeout(function(){
      btn.textContent = restore;
      btn.classList.remove("copied");
    }, 1600);
  }
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(markCopied, markCopied);
  } else {
    markCopied();
  }
});

})();
</script>
</body>
</html>
