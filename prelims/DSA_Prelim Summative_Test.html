<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DSA Summative Test — Prelims</title>
<style>
  :root{
    --bg:#0a0e14;
    --surface:#11161f;
    --surface-2:#171e29;
    --border:#232c3a;
    --text:#e9eef4;
    --text-dim:#8a96a8;
    --accent:#5eead4;      /* terminal cyan - primary */
    --accent-dim:#2e6f66;
    --mc:#8ab4ff;           /* periwinkle - MC section */
    --out:#ffab70;          /* soft coral - output section */
    --warn:#f5c451;
    --danger:#ff6b6b;
    --good:#5eead4;
    --font-mono: 'SF Mono','Cascadia Code','Consolas','Roboto Mono',monospace;
    --font-sans: -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;padding:0;height:100%;
    background:var(--bg);color:var(--text);
    font-family:var(--font-sans);
    overflow:hidden;
  }
  body{cursor:pointer;}
  #progress-wrap{
    position:fixed;top:0;left:0;right:0;height:4px;
    background:var(--surface-2);z-index:1000;
  }
  #progress-bar{
    height:100%;width:0%;
    background:linear-gradient(90deg,var(--accent),var(--mc));
    transition:width .35s ease;
  }
  #counter{
    position:fixed;bottom:18px;right:22px;
    font-family:var(--font-mono);font-size:13px;color:var(--text-dim);
    background:var(--surface);border:1px solid var(--border);
    padding:6px 12px;border-radius:6px;z-index:1000;
    letter-spacing:.03em;
  }
  #hint{
    position:fixed;bottom:18px;left:22px;
    font-family:var(--font-mono);font-size:12px;color:var(--text-dim);
    z-index:1000;opacity:.7;
  }
  #deck{
    position:relative;width:100vw;height:100vh;
  }
  .slide{
    position:absolute;inset:0;
    display:flex;flex-direction:column;
    justify-content:center;align-items:center;
    padding:64px 8vw;
    opacity:0;pointer-events:none;
    transform:translateX(24px);
    transition:opacity .35s ease, transform .35s ease;
    overflow:auto;
  }
  .slide.active{
    opacity:1;pointer-events:auto;transform:translateX(0);
  }
  .slide.exit-left{transform:translateX(-24px);}
  @media (prefers-reduced-motion: reduce){
    .slide{transition:opacity .01s linear;transform:none !important;}
  }
  .slide-inner{
    width:100%;max-width:1180px;margin:0 auto;
    min-width:0;
  }
  .eyebrow{
    font-family:var(--font-mono);font-size:13px;letter-spacing:.08em;
    color:var(--accent);text-transform:uppercase;
    display:flex;align-items:center;gap:10px;margin-bottom:18px;
  }
  .eyebrow .tab{
    background:var(--surface-2);border:1px solid var(--border);
    border-bottom:2px solid var(--accent);
    padding:4px 10px;border-radius:4px 4px 0 0;
  }
  .eyebrow.mc{color:var(--mc);}
  .eyebrow.mc .tab{border-bottom-color:var(--mc);}
  .eyebrow.out{color:var(--out);}
  .eyebrow.out .tab{border-bottom-color:var(--out);}
  h1.title{
    font-size:clamp(32px,4.4vw,58px);
    line-height:1.08;margin:0 0 18px 0;font-weight:800;
    letter-spacing:-.01em;
  }
  h2.title{
    font-size:clamp(25px,2.6vw,36px);
    line-height:1.2;margin:0 0 22px 0;font-weight:750;
    letter-spacing:-.01em;
  }
  p.lead{font-size:17px;line-height:1.6;color:var(--text-dim);max-width:760px;}
  .grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:22px;width:100%;}
  .grid2 > *{min-width:0;}
  .card{
    background:var(--surface);border:1px solid var(--border);
    border-radius:10px;padding:22px 24px;min-width:0;
  }
  .q-card{
    background:var(--surface);border:1px solid var(--border);
    border-radius:10px;padding:24px 26px;
    display:flex;flex-direction:column;gap:14px;min-width:0;
  }
  .q-num{
    font-family:var(--font-mono);font-size:12px;color:var(--text-dim);
    letter-spacing:.05em;
  }
  .q-text{font-size:17px;font-weight:650;line-height:1.45;}
  .options{display:flex;flex-direction:column;gap:8px;margin-top:4px;}
  .opt{
    display:flex;gap:10px;align-items:flex-start;
    font-size:14.5px;color:var(--text);
    background:var(--surface-2);border:1px solid var(--border);
    border-radius:7px;padding:9px 12px;line-height:1.4;
  }
  .opt b{color:var(--mc);font-family:var(--font-mono);font-size:13px;flex-shrink:0;}
  .single-q{max-width:820px;margin:0 auto;}
  .single-q .q-text{font-size:19px;}
  pre.code{
    background:#0d1117;border:1px solid var(--border);border-radius:8px;
    padding:16px 18px;font-family:var(--font-mono);font-size:13.5px;
    line-height:1.55;overflow-x:auto;position:relative;margin:0;min-width:0;
  }
  .code-wrap{position:relative;min-width:0;}
  .copy-btn{
    position:absolute;top:8px;right:8px;
    font-family:var(--font-mono);font-size:11px;color:var(--text-dim);
    background:var(--surface-2);border:1px solid var(--border);
    border-radius:5px;padding:4px 9px;cursor:pointer;
    transition:color .15s, border-color .15s;
  }
  .copy-btn:hover{color:var(--text);border-color:var(--accent);}
  .copy-btn.copied{color:var(--good);border-color:var(--good);}
  .tok-kw{color:#ff7b9c;}
  .tok-str{color:#a5d6a7;}
  .tok-num{color:#ffcb6b;}
  .tok-com{color:#5c6773;font-style:italic;}
  .tok-pre{color:#82aaff;}
  .prompt-line{
    font-family:var(--font-mono);font-size:13.5px;color:var(--out);
    margin-top:10px;
  }
  .recap-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;width:100%;}
  .recap-item{
    background:var(--surface);border:1px solid var(--border);border-radius:9px;
    padding:16px 18px;min-width:0;
  }
  .recap-item .k{font-family:var(--font-mono);font-size:12px;color:var(--accent);margin-bottom:6px;}
  .recap-item .v{font-size:14px;color:var(--text-dim);line-height:1.5;}
  .answers-scroll{
    max-height:68vh;overflow-y:auto;padding-right:6px;width:100%;
  }
  .ans-row{
    display:grid;grid-template-columns:52px minmax(0,1fr);gap:14px;
    padding:11px 0;border-bottom:1px solid var(--border);
    font-size:13.5px;align-items:start;
  }
  .ans-row:last-child{border-bottom:none;}
  .ans-num{font-family:var(--font-mono);color:var(--accent);font-weight:700;}
  .ans-correct{color:var(--good);font-weight:700;}
  .ans-explain{color:var(--text-dim);margin-top:3px;}
  .ans-out{color:var(--out);font-family:var(--font-mono);font-weight:700;}
  #shortcuts-modal{
    position:fixed;inset:0;background:rgba(5,8,12,.72);
    display:none;align-items:center;justify-content:center;z-index:2000;
  }
  #shortcuts-modal.show{display:flex;}
  .modal-box{
    background:var(--surface);border:1px solid var(--border);
    border-radius:12px;padding:28px 32px;max-width:420px;width:90%;
  }
  .modal-box h3{margin-top:0;font-size:19px;}
  .modal-box .row{display:flex;justify-content:space-between;font-size:14px;padding:7px 0;border-bottom:1px solid var(--border);color:var(--text-dim);}
  .modal-box .row:last-child{border-bottom:none;}
  .modal-box kbd{
    background:var(--surface-2);border:1px solid var(--border);
    border-radius:5px;padding:2px 8px;font-family:var(--font-mono);color:var(--text);
  }
  .cover-badges{display:flex;gap:10px;margin-top:26px;flex-wrap:wrap;}
  .badge{
    font-family:var(--font-mono);font-size:12px;color:var(--text-dim);
    border:1px solid var(--border);border-radius:20px;padding:6px 14px;
  }
  .lec-table{width:100%;border-collapse:collapse;font-size:13.5px;margin-top:12px;}
  .lec-table th,.lec-table td{border:1px solid var(--border);padding:7px 12px;text-align:left;}
  .lec-table th{color:var(--accent);font-family:var(--font-mono);font-size:11.5px;
    text-transform:uppercase;letter-spacing:.04em;background:var(--surface-2);}
  .lec-table td{color:var(--text-dim);}
  .lec-table td b, .lec-table td.hl{color:var(--text);font-weight:700;}
  .lec-flow{font-family:var(--font-mono);font-size:13.5px;line-height:1.85;color:var(--text-dim);
    background:var(--surface);border:1px solid var(--border);border-radius:8px;
    padding:16px 20px;white-space:pre;overflow-x:auto;}
  .lec-note{font-size:14px;color:var(--text-dim);margin-top:12px;line-height:1.55;}
  .lec-note b{color:var(--text);}
  .two-col-lec{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:22px;}
  .two-col-lec > *{min-width:0;}
  ::-webkit-scrollbar{width:8px;height:8px;}
  ::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px;}
  ::-webkit-scrollbar-track{background:transparent;}
</style>
</head>

/* ============ SINGLE-PASS TOKENIZER ============ */
const KEYWORDS = "public|private|protected|static|void|class|int|double|float|long|short|byte|char|boolean|String|string|if|else|for|while|do|return|new|true|false|null|import|package|break|continue|switch|case|default|try|catch|finally|throw|this|super|extends|implements|interface|enum|final|abstract|using|namespace|struct|const|unsigned|signed|template|typename|auto|vector|ArrayList";
const TOKEN_RE = new RegExp(
  "(//.*)" +                              // 1 comment
  "|(\"(?:[^\"\\\\]|\\\\.)*\")" +          // 2 string
  "|('(?:[^'\\\\]|\\\\.)*')" +             // 3 char
  "|(#\\w+(?:\\s*<[^>]*>)?)" +             // 4 preprocessor
  "|(\\b\\d[\\d_]*\\.?\\d*\\b)" +          // 5 number
  "|(\\b(?:" + KEYWORDS + ")\\b)",         // 6 keyword
  "g"
);
function escHtml(s){
  return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}
function highlight(code){
  let out = "";
  let last = 0;
  let m;
  TOKEN_RE.lastIndex = 0;
  while((m = TOKEN_RE.exec(code)) !== null){
    out += escHtml(code.slice(last, m.index));
    if(m[1]) out += '<span class="tok-com">'+escHtml(m[1])+'</span>';
    else if(m[2]) out += '<span class="tok-str">'+escHtml(m[2])+'</span>';
    else if(m[3]) out += '<span class="tok-str">'+escHtml(m[3])+'</span>';
    else if(m[4]) out += '<span class="tok-pre">'+escHtml(m[4])+'</span>';
    else if(m[5]) out += '<span class="tok-num">'+escHtml(m[5])+'</span>';
    else if(m[6]) out += '<span class="tok-kw">'+escHtml(m[6])+'</span>';
    last = TOKEN_RE.lastIndex;
  }
  out += escHtml(code.slice(last));
  return out;
}
let codeBlockCounter = 0;
function codeBlock(code, lang){
  codeBlockCounter++;
  const id = "cb"+codeBlockCounter;
  const encoded = encodeURIComponent(code);
  return `<div class="code-wrap">
    <button class="copy-btn" data-code="${encoded}" onclick="copyCode(this)">Copy</button>
    <pre class="code" id="${id}"><code>${highlight(code)}</code></pre>
  </div>`;
}
function copyCode(btn){
  const text = decodeURIComponent(btn.getAttribute("data-code"));
  navigator.clipboard.writeText(text).then(()=>{
    btn.textContent = "Copied \u2713";
    btn.classList.add("copied");
    setTimeout(()=>{btn.textContent="Copy";btn.classList.remove("copied");}, 1400);
  }).catch(()=>{
    btn.textContent = "Failed";
    setTimeout(()=>{btn.textContent="Copy";}, 1400);
  });
}

/* ============ SLIDE BUILDERS ============ */
const letters = ["A","B","C","D"];

function mcCard(qObj, num){
  const opts = qObj.opts.map((o,i)=>`<div class="opt"><b>${letters[i]})</b><span>${o}</span></div>`).join("");
  return `<div class="q-card">
    <div class="q-num">QUESTION ${num} / 13</div>
    <div class="q-text">${qObj.q}</div>
    <div class="options">${opts}</div>
  </div>`;
}

function mcPairSlide(i1, i2, eyebrowLabel){
  const c1 = mcCard(mcQuestions[i1], i1+1);
  const c2 = i2!=null ? mcCard(mcQuestions[i2], i2+1) : "";
  const gridClass = i2!=null ? "grid2" : "";
  return `<div class="slide-inner">
    <div class="eyebrow mc"><span class="tab">MultipleChoice.test</span> ${eyebrowLabel}</div>
    <div class="${gridClass}" style="${i2==null?'max-width:640px;margin:0 auto;':''}">${c1}${c2}</div>
  </div>`;
}

function outSlideSingle(q, num){
  const answers = q.ans.map(a=>`<div class="prompt-line">&gt; ${escHtml(a)}</div>`).join("");
  return `<div class="slide-inner single-q">
    <div class="eyebrow out"><span class="tab">Output_Q${num}.log</span> GUESS THE OUTPUT ${num} / 15</div>
    <div class="q-card">
      <div class="q-text">What does this code print?</div>
      ${codeBlock(q.code, q.lang)}
    </div>
  </div>`;
}

function outSlidePair(qA, numA, qB, numB){
  const cardA = `<div class="q-card"><div class="q-num">OUTPUT ${numA} / 15</div><div class="q-text">What does this print?</div>${codeBlock(qA.code, qA.lang)}</div>`;
  const cardB = `<div class="q-card"><div class="q-num">OUTPUT ${numB} / 15</div><div class="q-text">What does this print?</div>${codeBlock(qB.code, qB.lang)}</div>`;
  return `<div class="slide-inner">
    <div class="eyebrow out"><span class="tab">Output_Q${numA}-${numB}.log</span> GUESS THE OUTPUT</div>
    <div class="grid2">${cardA}${cardB}</div>
  </div>`;
}

/* ============ STATIC SLIDES ============ */
const slideCover = `<div class="slide-inner">

const deck = document.getElementById("deck");

  const div = document.createElement("div");

  div.innerHTML = html;
  deck.appendChild(div);

const slideEls = Array.from(document.querySelectorAll(".slide"));
let current = 0;

function render(){
  slideEls.forEach((el,i)=>{
    el.classList.toggle("active", i===current);
  });
  document.getElementById("counter").textContent = (current+1)+" / "+slideEls.length;
  document.getElementById("progress-bar").style.width = (((current+1)/slideEls.length)*100)+"%";
}
function goTo(i){
  current = Math.max(0, Math.min(slideEls.length-1, i));
  render();
}
function next(){ goTo(current+1); }
function prev(){ goTo(current-1); }

render();

/* click-anywhere-except-interactive navigation */
document.addEventListener("click", (e)=>{
  if(e.target.closest("button, a, input, textarea, select, .copy-btn, #shortcuts-modal")) return;
  if(document.getElementById("shortcuts-modal").classList.contains("show")) return;
  next();
});

/* keyboard */
document.addEventListener("keydown", (e)=>{
  const modal = document.getElementById("shortcuts-modal");
  if(e.key === "?"){
    modal.classList.toggle("show");
    e.preventDefault();
    return;
  }
  if(modal.classList.contains("show")){
    if(e.key === "Escape") modal.classList.remove("show");
    return;
  }
  if(e.key === "ArrowRight"){ next(); }
  else if(e.key === "ArrowLeft"){ prev(); }
  else if(e.key === "Home"){ goTo(0); }
  else if(e.key === "End"){ goTo(slideEls.length-1); }
});

/* mouse side buttons: back(3)/forward(4) */
window.addEventListener("mousedown", (e)=>{
  if(e.button === 3){
    e.preventDefault(); e.stopImmediatePropagation();
    prev();
  } else if(e.button === 4){
    e.preventDefault(); e.stopImmediatePropagation();
    next();
  }
}, true);
window.addEventListener("auxclick", (e)=>{
  if(e.button === 3 || e.button === 4){
    e.preventDefault(); e.stopImmediatePropagation();
  }
}, true);

/* swipe */
let touchStartX = null;
document.addEventListener("touchstart", (e)=>{
  touchStartX = e.changedTouches[0].screenX;
}, {passive:true});
document.addEventListener("touchend", (e)=>{
  if(touchStartX === null) return;
  const dx = e.changedTouches[0].screenX - touchStartX;
  if(Math.abs(dx) > 50){
    if(dx < 0) next(); else prev();
  }
  touchStartX = null;
}, {passive:true});
</script>
