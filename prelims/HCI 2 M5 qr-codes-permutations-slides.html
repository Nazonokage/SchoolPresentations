<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QR Codes &amp; Python Permutations — Module 05</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-deep: #080c16;
      --bg-mid: #0e1526;
      --glass-bg: rgba(255,255,255,0.055);
      --glass-border: rgba(255,255,255,0.14);
      --glass-border-strong: rgba(255,255,255,0.24);
      --accent-cyan: #4fd8e8;
      --accent-violet: #9d8cff;
      --accent-amber: #f5c26b;
      --text-primary: #f2f5fb;
      --text-secondary: #a9b4c9;
      --text-faint: #6b7690;
      --code-bg: rgba(6,10,20,0.55);
      --shadow-deep: 0 20px 60px -20px rgba(0,0,0,0.6);
      --radius-lg: 22px;
      --radius-md: 14px;
      --dur: 400ms;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; height: 100%; }
    body {
      font-family: 'Inter', sans-serif;
      background:
        radial-gradient(60% 50% at 12% 8%, rgba(157,140,255,0.20), transparent 60%),
        radial-gradient(50% 45% at 88% 15%, rgba(79,216,232,0.16), transparent 60%),
        radial-gradient(70% 60% at 50% 100%, rgba(79,216,232,0.08), transparent 60%),
        linear-gradient(180deg, var(--bg-deep), var(--bg-mid) 60%, var(--bg-deep));
      color: var(--text-primary);
      overflow: hidden;
      height: 100vh;
      width: 100vw;
      cursor: pointer;
      -webkit-font-smoothing: antialiased;
    }
    ::selection { background: rgba(79,216,232,0.35); }

    .ambient { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
    .blob {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.5;
    }
    .blob1 { width: 420px; height: 420px; top: -120px; left: -100px; background: radial-gradient(circle, rgba(157,140,255,0.35), transparent 70%); }
    .blob2 { width: 380px; height: 380px; bottom: -140px; right: -80px; background: radial-gradient(circle, rgba(79,216,232,0.30), transparent 70%); }

    .finder {
      position: fixed;
      width: 46px;
      height: 46px;
      z-index: 5;
      pointer-events: none;
      opacity: 0.55;
    }
    .finder svg { width: 100%; height: 100%; display: block; }
    .finder.tl { top: 22px; left: 22px; }
    .finder.br { bottom: 22px; right: 22px; transform: rotate(180deg); }

    #deck { position: relative; width: 100vw; height: 100vh; z-index: 1; }

    .slide {
      position: absolute; inset: 0;
      overflow-y: auto; overflow-x: hidden;
      transition: transform var(--dur) cubic-bezier(.22,.68,.35,1), opacity var(--dur) ease;
      -webkit-overflow-scrolling: touch;
    }
    .slide.pos-current { transform: translateX(0) scale(1); opacity: 1; z-index: 3; }
    .slide.pos-next { transform: translateX(4.5%) scale(0.97); opacity: 0; z-index: 2; }
    .slide.pos-prev { transform: translateX(-4.5%) scale(0.97); opacity: 0; z-index: 2; }
    .slide.pos-far { transform: translateX(0) scale(0.97); opacity: 0; z-index: 1; }

    .slide-outer {
      min-height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 88px 56px 96px;
    }
    .slide-content { width: 100%; max-width: 1120px; min-width: 0; }

    .eyebrow {
      display: inline-flex; align-items: center; gap: 10px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 12.5px; letter-spacing: 0.16em; text-transform: uppercase;
      color: var(--accent-cyan);
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      padding: 6px 14px 6px 10px;
      border-radius: 100px;
      margin-bottom: 26px;
    }
    .eyebrow::before {
      content: "";
      width: 8px; height: 8px; border-radius: 2px;
      background: linear-gradient(135deg, var(--accent-cyan), var(--accent-violet));
      display: inline-block;
    }
    h1.title {
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700;
      font-size: clamp(30px, 4.4vw, 54px);
      line-height: 1.08;
      margin: 0 0 20px;
      letter-spacing: -0.01em;
      background: linear-gradient(180deg, #ffffff 30%, #c9d3ea 100%);
      -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    p.subtitle {
      font-size: clamp(15px, 1.5vw, 18px);
      color: var(--text-secondary);
      max-width: 70ch;
      line-height: 1.6;
      margin: 0 0 34px;
    }
    .analogy {
      margin-top: 28px;
      padding: 16px 20px;
      border-radius: var(--radius-md);
      background: linear-gradient(120deg, rgba(157,140,255,0.10), rgba(79,216,232,0.07));
      border: 1px solid var(--glass-border);
      font-size: 14.5px;
      color: var(--text-secondary);
      line-height: 1.6;
    }
    .analogy b { color: var(--text-primary); font-weight: 600; }
    .analogy .tag {
      font-family: 'JetBrains Mono', monospace; font-size: 10.5px; letter-spacing: 0.1em;
      text-transform: uppercase; color: var(--accent-amber); display: block; margin-bottom: 6px;
    }

    .glass {
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-lg);
      backdrop-filter: blur(20px) saturate(140%);
      -webkit-backdrop-filter: blur(20px) saturate(140%);
      box-shadow: var(--shadow-deep), inset 0 1px 0 rgba(255,255,255,0.08);
    }

    ul.bullets { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 14px; }
    ul.bullets li {
      display: flex; gap: 14px; align-items: flex-start;
      font-size: 16.5px; line-height: 1.55; color: var(--text-primary);
      padding: 16px 20px; min-width: 0;
    }
    ul.bullets li .dot {
      flex: 0 0 auto; width: 9px; height: 9px; border-radius: 50%; margin-top: 8px;
      background: linear-gradient(135deg, var(--accent-cyan), var(--accent-violet));
    }
    ul.bullets li b { color: var(--accent-cyan); font-weight: 600; }

    .cols2 { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr); gap: 22px; }
    .col-card { padding: 26px 26px 28px; min-width: 0; }
    .col-card h3 {
      font-family: 'Space Grotesk', sans-serif; font-size: 19px; margin: 0 0 14px;
      display: flex; align-items: center; gap: 10px;
    }
    .col-card h3 .chip {
      font-family: 'JetBrains Mono', monospace; font-size: 11px; padding: 3px 9px; border-radius: 6px;
      background: rgba(255,255,255,0.08); color: var(--text-secondary); letter-spacing: 0.05em;
    }
    .col-card ul { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 11px; }
    .col-card li { font-size: 14.5px; line-height: 1.55; color: var(--text-secondary); padding-left: 16px; position: relative; }
    .col-card li::before { content: "—"; position: absolute; left: 0; color: var(--text-faint); }
    .col-card.accent-a { border-color: rgba(245,194,107,0.35); }
    .col-card.accent-b { border-color: rgba(79,216,232,0.35); }

    .grid-cards { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 16px; }
    .grid-cards.cols2g { grid-template-columns: repeat(2, minmax(0,1fr)); }
    .card { padding: 20px 20px 22px; min-width: 0; display: flex; flex-direction: column; gap: 10px; }
    .card .badge {
      width: 30px; height: 30px; border-radius: 9px;
      background: linear-gradient(135deg, rgba(79,216,232,0.25), rgba(157,140,255,0.25));
      border: 1px solid var(--glass-border-strong);
      display: flex; align-items: center; justify-content: center;
      font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--accent-cyan);
    }
    .card .badge.photo-badge {
      width: 64px; height: 64px; border-radius: 12px;
      background: #0e1526; padding: 0; overflow: hidden;
    }
    .card .badge.photo-badge img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .card .badge.photo-badge.model1-bg img { background: white; object-fit: contain; padding: 4px; }
    .card .badge.photo-badge.iqr-bg img { object-fit: contain; background: transparent; transform: scale(1.25); }
    .card h4 { margin: 2px 0 0; font-family: 'Space Grotesk', sans-serif; font-size: 16px; }
    .card p { margin: 0; font-size: 13.3px; line-height: 1.55; color: var(--text-secondary); }
    .card .capacity {
      margin-top: auto; font-family: 'JetBrains Mono', monospace; font-size: 11px;
      color: var(--accent-amber); padding-top: 8px; border-top: 1px solid var(--glass-border);
    }

    .steps { display: flex; flex-direction: column; gap: 14px; }
    .step { display: flex; gap: 18px; align-items: flex-start; padding: 18px 22px; min-width: 0; }
    .step .num {
      flex: 0 0 auto; width: 36px; height: 36px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 14px;
      background: linear-gradient(135deg, var(--accent-cyan), var(--accent-violet)); color: #0b0f1a;
    }
    .step h4 { margin: 0 0 4px; font-size: 15.5px; font-family: 'Space Grotesk', sans-serif; }
    .step p { margin: 0; font-size: 13.8px; color: var(--text-secondary); line-height: 1.5; }

    .code-layout { display: grid; grid-template-columns: minmax(0,1.2fr) minmax(0,0.9fr); gap: 22px; align-items: stretch; }
    .code-panel { padding: 0; overflow: hidden; min-width: 0; }
    .code-head {
      display: flex; align-items: center; gap: 8px; padding: 12px 18px;
      border-bottom: 1px solid var(--glass-border);
      font-family: 'JetBrains Mono', monospace; font-size: 11.5px; color: var(--text-faint);
    }
    .code-head .dots { display: flex; gap: 6px; margin-right: 6px; }
    .code-head .dots span { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
    .code-head .dots span:nth-child(1) { background: #ff5f57; }
    .code-head .dots span:nth-child(2) { background: #febc2e; }
    .code-head .dots span:nth-child(3) { background: #28c840; }
    pre.code {
      margin: 0; padding: 20px; background: var(--code-bg);
      font-family: 'JetBrains Mono', monospace; font-size: 13.3px; line-height: 1.65;
      color: #dbe4f3; overflow-x: auto; min-width: 0;
    }
    .tok-comment { color: #6b7690; font-style: italic; }
    .tok-string { color: #a8e6b8; }
    .tok-keyword { color: #9d8cff; font-weight: 600; }
    .tok-builtin { color: #4fd8e8; }
    .tok-number { color: #f5c26b; }
    .explain { padding: 24px 24px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
    .explain h4 { margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 16px; }
    .explain p { margin: 0; font-size: 14px; line-height: 1.6; color: var(--text-secondary); }
    .output-box {
      font-family: 'JetBrains Mono', monospace; font-size: 12.5px; color: var(--accent-cyan);
      background: rgba(79,216,232,0.07); border: 1px solid rgba(79,216,232,0.25);
      border-radius: 10px; padding: 10px 14px; white-space: pre-wrap; word-break: break-word;
    }

    .qr-layout { display: grid; grid-template-columns: minmax(0,0.85fr) minmax(0,1.15fr); gap: 32px; align-items: center; }
    .qr-visual { display: flex; align-items: center; justify-content: center; padding: 28px; }
    .qr-visual svg { width: min(280px, 90%); height: auto; filter: drop-shadow(0 20px 40px rgba(0,0,0,0.5)); }
    .callouts { display: flex; flex-direction: column; gap: 12px; }
    .callout { display: flex; gap: 12px; padding: 14px 18px; min-width: 0; }
    .callout .mark {
      flex: 0 0 auto; width: 8px; border-radius: 4px;
      background: linear-gradient(180deg, var(--accent-cyan), var(--accent-violet));
    }
    .callout h5 { margin: 0 0 3px; font-size: 14.5px; font-family: 'Space Grotesk', sans-serif; }
    .callout p { margin: 0; font-size: 13px; color: var(--text-secondary); line-height: 1.5; }

    .statement { display: flex; flex-direction: column; align-items: flex-start; }
    .statement .big {
      font-family: 'Space Grotesk', sans-serif; font-weight: 700;
      font-size: clamp(26px, 3.6vw, 44px); line-height: 1.2; max-width: 18ch;
      background: linear-gradient(120deg, #fff, var(--accent-cyan) 60%, var(--accent-violet));
      -webkit-background-clip: text; background-clip: text; color: transparent;
    }

    .recap-grid { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr); gap: 18px; }
    .recap-card { padding: 26px; min-width: 0; }
    .recap-card .tag {
      font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase;
      color: var(--accent-violet); margin-bottom: 10px; display: block;
    }
    .recap-card h4 { margin: 0 0 10px; font-size: 18px; font-family: 'Space Grotesk', sans-serif; }
    .recap-card p { margin: 0; font-size: 14px; line-height: 1.6; color: var(--text-secondary); }

    .quiz-item {
      padding: 14px 22px;
      margin-bottom: 10px;
      display: flex;
      align-items: flex-start;
      gap: 16px;
      font-size: 15px;
      line-height: 1.5;
    }
    .quiz-item .qnum {
      flex: 0 0 28px;
      font-weight: 600;
      color: var(--accent-cyan);
      font-family: 'JetBrains Mono', monospace;
    }
    .quiz-item .qtext { color: var(--text-primary); }
    .quiz-item .qtext code {
      background: rgba(255,255,255,0.08);
      padding: 2px 8px;
      border-radius: 4px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      color: var(--accent-amber);
    }

    /* answer key two-column layout */
    .answer-grid-2col {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px 40px;
      padding: 8px 0;
    }
    .answer-col {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .answer-col .ans-row {
      display: flex;
      gap: 10px;
      font-size: 14px;
      padding: 4px 0;
      border-bottom: 1px solid rgba(255,255,255,0.04);
      align-items: baseline;
    }
    .answer-col .ans-num {
      color: var(--text-faint);
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      width: 28px;
      flex-shrink: 0;
    }
    .answer-col .ans-val {
      font-family: 'JetBrains Mono', monospace;
      font-weight: 600;
      font-size: 13px;
      min-width: 20px;
      flex-shrink: 0;
    }
    .answer-col .ans-val.true { color: var(--accent-cyan); }
    .answer-col .ans-val.false { color: #ff7b72; }
    .answer-col .ans-val.neutral { color: var(--accent-amber); }
    .answer-col .ans-explain {
      color: var(--text-secondary);
      font-size: 13px;
    }

    #progress-wrap {
      position: fixed; top: 0; left: 0; width: 100%; height: 3px; z-index: 50;
      background: rgba(255,255,255,0.06);
    }
    #progress-bar {
      height: 100%; width: 0%;
      background: linear-gradient(90deg, var(--accent-violet), var(--accent-cyan));
      box-shadow: 0 0 14px 1px rgba(79,216,232,0.6);
      transition: width var(--dur) ease;
    }
    #counter {
      position: fixed; bottom: 22px; right: 28px; z-index: 50;
      font-family: 'JetBrains Mono', monospace; font-size: 12.5px; color: var(--text-secondary);
      background: var(--glass-bg); border: 1px solid var(--glass-border);
      padding: 7px 14px; border-radius: 100px; backdrop-filter: blur(14px);
      pointer-events: none;
    }
    #hint {
      position: fixed; bottom: 22px; left: 28px; z-index: 50;
      font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--text-faint);
      letter-spacing: 0.04em; pointer-events: none;
    }

    @media (max-width: 860px) {
      .cols2, .code-layout, .qr-layout, .recap-grid, .answer-grid-2col { grid-template-columns: minmax(0,1fr); }
      .grid-cards { grid-template-columns: repeat(2, minmax(0,1fr)); }
      .grid-cards.cols2g { grid-template-columns: minmax(0,1fr); }
      .slide-outer { padding: 70px 22px 90px; }
      #hint { display: none; }
    }
    @media (max-width: 520px) {
      .grid-cards { grid-template-columns: minmax(0,1fr); }
    }

    @media (prefers-reduced-motion: reduce) {
      .slide { transition: opacity 180ms linear !important; transform: none !important; }
      .slide.pos-next, .slide.pos-prev, .slide.pos-far { transform: none !important; }
    }
  </style>
</head>
<body>

  <div class="ambient">
    <div class="blob blob1"></div>
    <div class="blob blob2"></div>
  </div>

  <div class="finder tl">
    <svg viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">
      <rect x="1" y="1" width="38" height="38" rx="7" fill="none" stroke="#4fd8e8" stroke-width="2.4"/>
      <rect x="12" y="12" width="16" height="16" rx="3" fill="#4fd8e8"/>
    </svg>
  </div>
  <div class="finder br">
    <svg viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">
      <rect x="1" y="1" width="38" height="38" rx="7" fill="none" stroke="#9d8cff" stroke-width="2.4"/>
      <rect x="12" y="12" width="16" height="16" rx="3" fill="#9d8cff"/>
    </svg>
  </div>

  <div id="progress-wrap"><div id="progress-bar"></div></div>
  <div id="counter">1 / 1</div>
  <div id="hint">click or → to advance · ← back</div>

  <div id="deck"></div>

  <script>
    (function() {

      // ---------- highlighter ----------
      function escapeHtml(str) {
        return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
      }
      function highlightPython(code) {
        var escaped = escapeHtml(code);
        var tokenRe = /(?<comment>#[^\n]*)|(?<string>'(?:[^'\\]|\\.)*'|"(?:[^"\\]|\\.)*")|(?<keyword>\b(?:import|for|in|def|return|as|from)\b)|(?<builtin>\b(?:itertools|permutations|print|join|range|list)\b)|(?<number>\b\d+(?:\.\d+)?\b)/g;
        return escaped.replace(tokenRe, function(match, comment, string, keyword, builtin, number, offset, whole, groups) {
          var g = groups || {comment:comment, string:string, keyword:keyword, builtin:builtin, number:number};
          if (g.comment) return '<span class="tok-comment">' + match + '</span>';
          if (g.string)  return '<span class="tok-string">' + match + '</span>';
          if (g.keyword) return '<span class="tok-keyword">' + match + '</span>';
          if (g.builtin) return '<span class="tok-builtin">' + match + '</span>';
          if (g.number)  return '<span class="tok-number">' + match + '</span>';
          return match;
        });
      }

      // ---------- helpers ----------
      function eyebrow(text) { return '<div class="eyebrow">' + text + '</div>'; }
      function renderAnalogy(a) {
        return '<div class="analogy"><span class="tag">Think of it like</span><b>' + a.lead + '</b> ' + a.body + '</div>';
      }
      function bulletsList(items) {
        var html = '<ul class="bullets">';
        items.forEach(function(it) {
          html += '<li class="glass"><span class="dot"></span><span class="body">' + it + '</span></li>';
        });
        html += '</ul>';
        return html;
      }

      // ---------- renderers ----------
      var renderers = {
        title: function(s) {
          return '<div class="slide-content">' +
            eyebrow(s.eyebrow) +
            '<h1 class="title">' + s.title + '</h1>' +
            '<p class="subtitle">' + s.subtitle + '</p>' +
            (s.analogy ? renderAnalogy(s.analogy) : '') +
          '</div>';
        },
        bullets: function(s) {
          return '<div class="slide-content">' +
            eyebrow(s.eyebrow) +
            '<h1 class="title">' + s.title + '</h1>' +
            (s.subtitle ? '<p class="subtitle">' + s.subtitle + '</p>' : '') +
            bulletsList(s.items) +
            (s.analogy ? renderAnalogy(s.analogy) : '') +
          '</div>';
        },
        cols2: function(s) {
          var c = s.columns;
          return '<div class="slide-content">' +
            eyebrow(s.eyebrow) +
            '<h1 class="title">' + s.title + '</h1>' +
            (s.subtitle ? '<p class="subtitle">' + s.subtitle + '</p>' : '') +
            '<div class="cols2">' +
              c.map(function(col, i) {
                return '<div class="glass col-card ' + (i===0?'accent-a':'accent-b') + '">' +
                  '<h3>' + col.title + ' <span class="chip">' + col.chip + '</span></h3>' +
                  '<ul>' + col.points.map(function(p){ return '<li>' + p + '</li>'; }).join('') + '</ul>' +
                '</div>';
              }).join('') +
            '</div>' +
            (s.analogy ? renderAnalogy(s.analogy) : '') +
          '</div>';
        },
        cards: function(s) {
          return '<div class="slide-content">' +
            eyebrow(s.eyebrow) +
            '<h1 class="title">' + s.title + '</h1>' +
            (s.subtitle ? '<p class="subtitle">' + s.subtitle + '</p>' : '') +
            '<div class="grid-cards' + (s.cols2 ? ' cols2g' : '') + '">' +
              s.cards.map(function(c) {
                var cls = 'photo-badge';
                if (c.model1Bg) cls += ' model1-bg';
                if (c.iqrBg) cls += ' iqr-bg';
                return '<div class="glass card">' +
                  (c.img ? '<div class="badge ' + cls + '"><img src="' + c.img + '" alt="' + c.title + '" loading="lazy"></div>' : '<div class="badge">#</div>') +
                  '<h4>' + c.title + '</h4>' +
                  '<p>' + c.body + '</p>' +

          else if (i === current + 1) el.classList.add('pos-next');

        if (idx < 0 || idx > total - 1 || idx === current) return;

      function next() { if (current < total - 1) goTo(current + 1); }
