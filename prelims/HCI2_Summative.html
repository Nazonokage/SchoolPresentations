<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>HCI 2 — Summative Review & Exam</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:#0a0c14;color:#eef2f7}
#presentation{position:relative;width:100vw;height:100vh;overflow:hidden}
.slide-wrapper{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:30px 50px 50px;opacity:0;transform:translateX(40px);transition:opacity .35s ease,transform .35s ease;pointer-events:none;will-change:transform,opacity;overflow-y:auto}
.slide-wrapper.active{opacity:1;transform:translateX(0);pointer-events:auto}
.slide-wrapper.exit-left{opacity:0;transform:translateX(-40px)}
.slide-wrapper.exit-right{opacity:0;transform:translateX(40px)}
@media(prefers-reduced-motion:reduce){.slide-wrapper{transition:none!important;transform:none!important}.slide-wrapper.exit-left,.slide-wrapper.exit-right{opacity:0;transform:none!important}}
.slide{width:100%;max-width:1240px;max-height:100%;background:#131724;border-radius:22px;padding:34px 44px 38px;box-shadow:0 24px 64px rgba(0,0,0,.7);display:flex;flex-direction:column;overflow-y:auto;scrollbar-width:thin;scrollbar-color:#2e3448 transparent}
.slide::-webkit-scrollbar{width:5px}.slide::-webkit-scrollbar-track{background:transparent}.slide::-webkit-scrollbar-thumb{background:#2e3448;border-radius:4px}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;color:#5a7a9a;border-bottom:2px solid #1e2538;padding-bottom:7px;margin-bottom:8px}
.slide-title{font-size:clamp(24px,3.2vw,40px);font-weight:800;line-height:1.15;color:#fff;letter-spacing:-.4px;margin-bottom:6px}
.accent{color:#5eb8ff}.accent-g{color:#5de8a0}.accent-o{color:#ffa86e}.accent-p{color:#c084fc}.accent-r{color:#f87171}.accent-c{color:#22d3ee}
.slide-sub{font-size:15px;color:#8a9fba;margin-bottom:12px}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px 22px;min-width:0}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px 18px;min-width:0}
.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px 14px;min-width:0}
.grid-2>*,.grid-3>*,.grid-4>*{min-width:0}
.card{background:#1c2235;border-radius:14px;padding:15px 18px;border-left:4px solid #5eb8ff;min-width:0}
.card.g{border-left-color:#5de8a0}.card.o{border-left-color:#ffa86e}.card.p{border-left-color:#c084fc}.card.r{border-left-color:#f87171}.card.c{border-left-color:#22d3ee}.card.y{border-left-color:#fbbf24}.card.nb{border-left:none;border-left-color:transparent}
.card-title{font-size:13px;font-weight:700;color:#a8bcd4;letter-spacing:.3px;margin-bottom:5px}
.card-body{font-size:13.5px;line-height:1.6;color:#ccd6e8}
.card-body strong{color:#f0f4fa}
.card-body ul{list-style:none;padding:0;margin:4px 0 0}
.card-body ul li{padding:2px 0 2px 18px;position:relative;font-size:13px;line-height:1.5}
.card-body ul li::before{content:"▸";position:absolute;left:0;color:#5eb8ff;font-weight:700}
.table-wrap{overflow-x:auto;border-radius:12px;border:1px solid #1e2538;margin:6px 0}
.table-wrap table{width:100%;border-collapse:collapse;font-size:13px;min-width:340px}
.table-wrap th{background:#1a2030;color:#8a9fba;font-size:11.5px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;padding:8px 12px;text-align:left;border-bottom:1px solid #1e2538}
.table-wrap td{padding:7px 12px;border-bottom:1px solid #181e2c;color:#ccd6e8;vertical-align:top}
.table-wrap tr:last-child td{border-bottom:none}
.table-wrap tr:hover td{background:rgba(94,184,255,.04)}
/* Progress */
#progress-bar{position:fixed;top:0;left:0;height:3px;background:linear-gradient(90deg,#5eb8ff,#5de8a0);transition:width .3s ease;z-index:100;border-radius:0 2px 2px 0}
#slide-counter{position:fixed;bottom:18px;right:24px;font-size:12px;font-weight:700;color:#4a6080;letter-spacing:.5px;z-index:100}
/* Shortcuts overlay */
#shortcuts-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:200;align-items:center;justify-content:center}
#shortcuts-overlay.show{display:flex}
#shortcuts-box{background:#1c2235;border-radius:18px;padding:32px 40px;max-width:480px;width:90%}
#shortcuts-box h3{font-size:18px;font-weight:800;color:#fff;margin-bottom:16px}
#shortcuts-box .sk{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #1e2538;font-size:14px;color:#ccd6e8}
#shortcuts-box .sk:last-child{border-bottom:none}
#shortcuts-box .key{font-family:monospace;background:#131724;padding:2px 8px;border-radius:6px;color:#5eb8ff;font-size:13px}
#shortcuts-box .close-btn{margin-top:18px;background:#5eb8ff;color:#0a0c14;border:none;border-radius:10px;padding:8px 24px;font-size:14px;font-weight:700;cursor:pointer;width:100%}
/* MC question blocks */
.q-block{background:#1c2235;border-radius:16px;padding:20px 24px;border-left:5px solid #c084fc;flex:1;min-height:0}
.q-num{font-size:11px;font-weight:800;color:#c084fc;text-transform:uppercase;letter-spacing:1px;margin-bottom:6px}
.q-text{font-size:15.5px;color:#e8edf5;font-weight:600;margin-bottom:14px;line-height:1.55}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:8px 20px}
.choice{font-size:13.5px;color:#9aafca;padding:4px 0;line-height:1.4}
.choice span{color:#c084fc;font-weight:800;margin-right:5px}
/* ID blocks */
.id-block{background:#1c2235;border-radius:16px;padding:20px 24px;border-left:5px solid #ffa86e;flex:1}
.id-num{font-size:11px;font-weight:800;color:#ffa86e;text-transform:uppercase;letter-spacing:1px;margin-bottom:6px}
.id-text{font-size:15px;color:#e8edf5;line-height:1.6}
.blank{display:inline-block;min-width:160px;border-bottom:2px solid #5eb8ff;margin:0 6px;vertical-align:bottom}
/* Answer key */
.ak-row{display:flex;gap:12px;align-items:flex-start;background:#182e22;border-radius:12px;padding:10px 16px}
.ak-num{font-size:13px;font-weight:900;color:#5de8a0;min-width:30px;padding-top:1px}
.ak-answer{font-size:14px;font-weight:700;color:#5de8a0}
.ak-explain{font-size:12.5px;color:#6a8f7a;margin-top:2px}
.ak-row.id-ans{background:#2a1e10}
.ak-row.id-ans .ak-num{color:#ffa86e}
.ak-row.id-ans .ak-answer{color:#ffa86e}
.ak-row.id-ans .ak-explain{color:#8a6840}
/* Title slide */
.title-giant{font-size:clamp(36px,5vw,66px);font-weight:900;line-height:1.08;color:#fff;letter-spacing:-1px}
.title-sub{font-size:clamp(14px,1.5vw,19px);color:#6a8aaa;margin-top:12px}
.m-pill{background:#1c2235;border-radius:30px;padding:6px 16px;font-size:12px;font-weight:700;color:#5eb8ff;border:1px solid #2a3a52;display:inline-block;margin:3px}
/* Summative intro */
.stat-box{background:#1c2235;border-radius:16px;padding:18px 32px;border:1px solid #2a3a52;text-align:center}
.stat-num{font-size:32px;font-weight:900}
.stat-label{font-size:12px;color:#6a8aaa;font-weight:600;margin-top:4px}
/* 3-column question layout */
.q-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:18px;flex:1;min-height:0}
.id-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:18px;flex:1;min-height:0}
</style>
</head>
<body>
<div id="progress-bar"></div>
<div id="slide-counter"></div>
<div id="presentation"></div>
<div id="shortcuts-overlay">
  <div id="shortcuts-box">
    <h3>⌨️ Keyboard Shortcuts</h3>
    <div class="sk"><span>Next slide</span><span><span class="key">→</span> <span class="key">Right-click</span> <span class="key">Mouse 4</span></span></div>
    <div class="sk"><span>Previous slide</span><span><span class="key">←</span> <span class="key">Mouse 3</span></span></div>
    <div class="sk"><span>First / Last</span><span><span class="key">Home</span> / <span class="key">End</span></span></div>
    <div class="sk"><span>This help</span><span><span class="key">?</span></span></div>
    <button class="close-btn" onclick="document.getElementById('shortcuts-overlay').classList.remove('show')">Close</button>
  </div>
</div>
<script>
const S = [];

// ── 0: TITLE ──
S.push(`<div class="slide-content" style="display:flex;flex-direction:column;gap:0">
  <div class="eyebrow">ITE 380 · Human Computer Interaction 2</div>
  <div class="title-giant" style="margin-top:8px">Summative<br><span class="accent">Review</span> &<br><span class="accent-g">Exam</span></div>
  <div class="title-sub">Modules 2–7 · Handheld Devices · Touch Interfaces · Auditory Systems · Visual Perception · QR Codes & Itertools</div>
  <div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:20px">
    <span class="m-pill">M2 Handheld & Wearable</span>
    <span class="m-pill" style="color:#5de8a0;border-color:#1f3d2a">M3 Touch Interfaces</span>
    <span class="m-pill" style="color:#ffa86e;border-color:#3d2a14">M4 Auditory Interfaces</span>
    <span class="m-pill" style="color:#c084fc;border-color:#2a1f3e">M5 QR & Permutations</span>
    <span class="m-pill" style="color:#22d3ee;border-color:#1a2e3d">M6 Visual Cognition</span>
    <span class="m-pill" style="color:#fbbf24;border-color:#3d2e14">M7 Advanced QR & Chunks</span>
  </div>
  <div style="margin-top:18px;font-size:13px;color:#4a6080">Right-click or → to navigate · Press ? for shortcuts</div>
</div>`);

// ── 1: RECAP OVERVIEW ──
S.push(`<div class="slide-content" style="display:flex;flex-direction:column;gap:12px">
  <div class="eyebrow">Recap</div>
  <div class="slide-title">What We Covered — <span class="accent">All 6 Modules</span></div>
  <div class="grid-2" style="flex:1">
    <div class="card"><div class="card-title">📱 M2 · Handheld & Wearable</div><div class="card-body">Technological device definition · anatomy · 1985→2009+ timeline · PDAs, Tablets, PMPs · wearable classifications: smart jewelry, biosensors, fitness trackers, smart clothing, hearables</div></div>
    <div class="card g"><div class="card-title">👆 M3 · Touch User Interfaces</div><div class="card-body">TUI vs GUI · 4 design considerations (Wigdor & Wixon 2011) · 3 interaction techniques · 5 touchscreen technologies: Resistive, Surface Cap, P-Cap, SAW, Infrared</div></div>
    <div class="card o"><div class="card-title">🔊 M4 · Auditory Interfaces</div><div class="card-body">Why auditory? · Processing loop (Data→A→B→C→D) · 4 types: Audification · Sonification · Earcon · Voicemail System</div></div>
    <div class="card p"><div class="card-title">📷 M5 · QR Codes & Permutations</div><div class="card-body">QR history & anatomy · 6 variants · Error correction L/M/Q/H · Python qrcode generation · itertools.permutations()</div></div>
    <div class="card c"><div class="card-title">👁 M6 · Visual Sensation & Cognition</div><div class="card-body">Light → Sensation → Perception → Cognition pipeline · Eye anatomy · Sensation vs Perception · 4 UI design principles</div></div>
    <div class="card y"><div class="card-title">⚙️ M7 · Advanced QR & Chunking</div><div class="card-body">grouper() recipe · itertools.zip_longest · chunking workflow · full QR generation + OpenCV decoding pipeline</div></div>
  </div>
</div>`);

// ── 2: RECAP M2 ──
S.push(`<div class="slide-content" style="display:flex;flex-direction:column;gap:12px">
  <div class="eyebrow">Recap · Module 2</div>
  <div class="slide-title">Handheld & <span class="accent">Wearable Devices</span></div>
  <div class="grid-2" style="flex:1">
    <div style="display:flex;flex-direction:column;gap:12px">
      <div class="card"><div class="card-title">📌 Core Definition</div><div class="card-body">A <strong>handheld device</strong> operates entirely within the palm of one hand. Displays: LCD/OLED. Connectivity: Wi-Fi, Bluetooth, 3G+, NFC.</div></div>
      <div class="card g"><div class="card-title">📅 Timeline Milestones</div><div class="card-body"><ul>
        <li><strong>1985–95:</strong> First voice transceivers</li>
        <li><strong>2000:</strong> Color screens, WAP internet</li>
        <li><strong>2005:</strong> GPRS/3G, high-res displays, MP3</li>
        <li><strong>2007:</strong> Apple iPhone + Microsoft Surface 🚀</li>
        <li><strong>2009+:</strong> Full capacitive touchscreens, GPS</li>
      </ul></div></div>
    </div>
    <div style="display:flex;flex-direction:column;gap:12px">
      <div class="card o"><div class="card-title">📦 Handheld Form Factors</div><div class="card-body"><ul>
        <li><strong>PDAs</strong> — displaced by Android/iOS</li>
        <li><strong>Tablets/Slates</strong> — between phone and laptop</li>
        <li><strong>PMPs</strong> — audio, image, video playback</li>
        <li><strong>Aux:</strong> pagers, game consoles, GPS units</li>
      </ul></div></div>
      <div class="card p"><div class="card-title">⌚ Wearable Classifications</div><div class="card-body"><ul>
        <li>Smart Jewelry (rings, bracelets, pins)</li>
        <li>Body-Mounted Biosensors</li>
        <li>Fitness Trackers (wristbands)</li>
        <li>Smart Clothing / Tech Textiles</li>
        <li>AI Hearing Aids / Hearables</li>
      </ul></div></div>
    </div>
  </div>
</div>`);

// ── 3: RECAP M3 ──
S.push(`<div class="slide-content" style="display:flex;flex-direction:column;gap:12px">
  <div class="eyebrow">Recap · Module 3</div>
  <div class="slide-title">Touch <span class="accent-g">User Interfaces</span></div>
  <div class="grid-2" style="flex:1">
    <div style="display:flex;flex-direction:column;gap:12px">
      <div class="card g"><div class="card-title">🖐 Design Considerations (Wigdor & Wixon, 2011)</div><div class="card-body"><ul>
        <li><strong>Extension of Body</strong> — natural physical extension</li>
        <li><strong>Natural Experience</strong> — mimic real-world physics</li>
        <li><strong>Immediate Feedback</strong> — instant response to touch</li>
        <li><strong>Size Factor</strong> — account for ergonomic constraints</li>
      </ul></div></div>
      <div class="card"><div class="card-title">👆 Interaction Techniques</div><div class="card-body"><ul>
        <li><strong>Tapping-it</strong> — most common; brief touch to select</li>
        <li><strong>Crossing-in</strong> — drag across target; great for motor-impaired</li>
        <li><strong>Directional Gesturing</strong> — no predefined target space needed</li>
      </ul></div></div>
    </div>
    <div class="card nb" style="padding:0"><div class="table-wrap" style="height:100%"><table>
      <thead><tr><th>Technology</th><th>Activation</th><th>Multi-touch</th><th>Clarity</th></tr></thead>
      <tbody>
        <tr><td>Wire Resistive</td><td>Any object</td><td>No</td><td>Low</td></tr>
        <tr><td>Surface Capacitive</td><td>Skin only</td><td>No</td><td>Good</td></tr>
        <tr><td>P-Cap</td><td>Skin/thin glove</td><td>✅ Yes</td><td>Excellent</td></tr>
        <tr><td>SAW</td><td>Bare/soft glove</td><td>✅ Yes</td><td>Excellent</td></tr>
        <tr><td>Infrared (IR)</td><td>Any (blocks beam)</td><td>✅ Yes</td><td>🏆 Highest</td></tr>
      </tbody>
    </table></div></div>
  </div>
</div>`);

// ── 4: RECAP M4 ──
S.push(`<div class="slide-content" style="display:flex;flex-direction:column;gap:12px">
  <div class="eyebrow">Recap · Module 4</div>
  <div class="slide-title">Auditory <span class="accent-o">Interfaces</span> & Sonification</div>
  <div class="grid-4" style="margin-bottom:14px">
    <div class="card"><div class="card-title">🌊 Audification</div><div class="card-body"><strong>Direct translation</strong> of data waveform → audible domain. Needs large datasets with <em>periodic features</em>.<br><br><em>Ex: Seismic data sped up to rumble</em></div></div>
    <div class="card o"><div class="card-title">📊 Sonification</div><div class="card-body"><strong>Non-speech audio</strong> conveying information. Excels at temporal, spatial, amplitude, frequency resolution.<br><br><em>Ex: Geiger counter click rate</em></div></div>
    <div class="card p"><div class="card-title">🔔 Earcon</div><div class="card-body">Brief <strong>distinctive sound</strong> for a specific event. Coined by <em>D.A. Sumikawa, 1985</em> as pun on "icon".<br><br><em>Ex: OS error beep, NBC chime</em></div></div>
    <div class="card g"><div class="card-title">📞 Voicemail System</div><div class="card-body">Computer-based <strong>voice message exchange</strong>. Can deliver info AND process transactions.<br><br><em>Ex: *98 US voicemail code</em></div></div>
  </div>
  <div class="card nb" style="padding:0"><div class="table-wrap"><table>
    <thead><tr><th>Type</th><th>Key Feature</th><th>Sound Nature</th><th>Coined By</th></tr></thead>
    <tbody>
      <tr><td>Audification</td><td>Direct waveform → audio</td><td>Sped-up raw data</td><td>—</td></tr>
      <tr><td>Sonification</td><td>Non-speech audio as data</td><td>Structured mapping</td><td>ICAD community</td></tr>
      <tr><td>Earcon</td><td>Event-specific sound</td><td>Synthesized tones/patterns</td><td>D.A. Sumikawa, 1985</td></tr>
      <tr><td>Voicemail</td><td>Voice message exchange</td><td>Human voice / speech</td><td>—</td></tr>
    </tbody>
  </table></div></div>
</div>`);

// ── 5: RECAP M5 ──
S.push(`<div class="slide-content" style="display:flex;flex-direction:column;gap:12px">
  <div class="eyebrow">Recap · Module 5</div>
  <div class="slide-title">QR Codes & <span class="accent-p">Python Permutations</span></div>
  <div class="grid-2" style="flex:1">
    <div style="display:flex;flex-direction:column;gap:12px">
      <div class="card p"><div class="card-title">📷 QR Code Anatomy & History</div><div class="card-body"><ul>
        <li><strong>Finder Patterns</strong> (3 corners) — orientation markers</li>
        <li><strong>Data Modules</strong> — scattered squares encoding bits</li>
        <li><strong>Quiet Zone</strong> — outer safety margin (min 4 modules)</li>
        <li><strong>Frame/Logo Area</strong> — branding zone (Frame QR)</li>
      </ul><br><strong>Invented 1994</strong> by Denso Wave (Toyota). ISO standard: 2000.</div></div>
      <div class="card nb" style="padding:0"><div class="table-wrap"><table>
        <thead><tr><th>Error Level</th><th>Corrects</th><th>Use Case</th></tr></thead>
        <tbody>
          <tr><td>L</td><td>7%</td><td>Clean environment</td></tr>
          <tr><td>M (default)</td><td>15%</td><td>General use</td></tr>
          <tr><td>Q</td><td>25%</td><td>Business/commercial</td></tr>
          <tr><td>H</td><td>30%</td><td>Logos, high damage</td></tr>
        </tbody>
      </table></div></div>
    </div>
    <div style="display:flex;flex-direction:column;gap:12px">
      <div class="card"><div class="card-title">🔢 itertools.permutations()</div><div class="card-body"><strong>Order matters.</strong> 4! = 24 · 7! = 5,040<br><ul style="margin-top:6px">
        <li>Lazy evaluation — generates on demand</li>
        <li>Memory-efficient — no pre-storing</li>
        <li>Works on any iterable</li>
      </ul></div></div>
      <div class="card g"><div class="card-title">⚡ Python Snippet</div><div class="card-body" style="font-family:monospace;font-size:12.5px;color:#a8d8b0;line-height:1.8">
        import itertools<br>
        items = [1,2,3,4]<br>
        for p in itertools.permutations(items):<br>
        &nbsp;&nbsp;&nbsp;&nbsp;print(p)<br>
        <span style="color:#5a7a9a"># 24 tuples total (4!)</span>
      </div></div>
    </div>
  </div>
</div>`);

// ── 6: RECAP M6 ──
S.push(`<div class="slide-content" style="display:flex;flex-direction:column;gap:12px">
  <div class="eyebrow">Recap · Module 6</div>
  <div class="slide-title">Visual Sensation, Perception & <span class="accent-c">Cognition</span></div>
  <div style="background:#1a2035;border-radius:14px;padding:14px 20px;text-align:center;margin-bottom:2px">
    <div style="font-size:12px;color:#8a9fba;font-weight:700;letter-spacing:.5px;margin-bottom:10px">THE VISUAL PIPELINE</div>
    <div style="display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap">
      <div style="background:#1c2235;border-radius:10px;padding:10px 18px;border:1px solid #5eb8ff;color:#5eb8ff;font-weight:700;font-size:14px">💡 Light Stimulus</div>
      <div style="color:#4a6080;font-size:20px">→</div>
      <div style="background:#1c2235;border-radius:10px;padding:10px 18px;border:1px solid #5de8a0;color:#5de8a0;font-weight:700;font-size:14px">👁 Sensation</div>
      <div style="color:#4a6080;font-size:20px">→</div>
      <div style="background:#1c2235;border-radius:10px;padding:10px 18px;border:1px solid #ffa86e;color:#ffa86e;font-weight:700;font-size:14px">🧠 Perception</div>
      <div style="color:#4a6080;font-size:20px">→</div>
      <div style="background:#1c2235;border-radius:10px;padding:10px 18px;border:1px solid #c084fc;color:#c084fc;font-weight:700;font-size:14px">⚡ Cognition</div>
    </div>
  </div>
  <div class="grid-2" style="flex:1">
    <div class="card"><div class="card-title">👁 Sensation vs. Perception</div><div class="card-body"><ul>
      <li><strong>Sensation:</strong> physical — same for all (cornea → retina → rods/cones → optic nerve)</li>
      <li><strong>Perception:</strong> mental/psychological — subjective, varies by experience & culture</li>
      <li><em>Camera sensor (sensation) vs. photo editor (perception)</em></li>
    </ul></div></div>
    <div class="card c"><div class="card-title">⚡ Cognition & UI Design Principles</div><div class="card-body"><strong>Cognition</strong> = transforms perception into action<br><br><strong>4 UI Principles:</strong><ul>
      <li>High Contrast Elements</li>
      <li>Consistent Luminance</li>
      <li>Clear Structure / Grouping</li>

// ── RENDER ENGINE ──
let current = 0;
const total = S.length;
const container = document.getElementById('presentation');
const progressBar = document.getElementById('progress-bar');
const slideCounter = document.getElementById('slide-counter');
let isAnimating = false;

const wrappers = S.map((html, i) => {
  const w = document.createElement('div');
  w.className = 'slide-wrapper';
  w.innerHTML = `<div class="slide">${html}</div>`;
  container.appendChild(w);
  return w;
});

function updateUI() {
  progressBar.style.width = ((current + 1) / total * 100) + '%';
  slideCounter.textContent = (current + 1) + ' / ' + total;
}

function goTo(index, dir) {
  if (isAnimating || index === current || index < 0 || index >= total) return;
  isAnimating = true;
  const prev = wrappers[current];
  const next = wrappers[index];
  prev.classList.remove('active');
  prev.classList.add(dir === 1 ? 'exit-left' : 'exit-right');
  next.style.transform = dir === 1 ? 'translateX(40px)' : 'translateX(-40px)';
  next.style.opacity = '0';
  next.classList.add('active');
  requestAnimationFrame(() => requestAnimationFrame(() => {
    next.style.transform = '';
    next.style.opacity = '';
  }));
  current = index;
  updateUI();
  setTimeout(() => {
    prev.classList.remove('exit-left', 'exit-right');
    isAnimating = false;
  }, 380);
}

wrappers[0].classList.add('active');
updateUI();

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === 'ArrowDown') goTo(current + 1, 1);
  else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') goTo(current - 1, -1);
  else if (e.key === 'Home') goTo(0, -1);
  else if (e.key === 'End') goTo(total - 1, 1);
  else if (e.key === '?') document.getElementById('shortcuts-overlay').classList.toggle('show');
  else if (e.key === 'Escape') document.getElementById('shortcuts-overlay').classList.remove('show');
});
document.addEventListener('mousedown', e => {
  if (e.button === 2) { e.preventDefault(); e.stopImmediatePropagation(); goTo(current + 1, 1); }
  else if (e.button === 3) { e.preventDefault(); e.stopImmediatePropagation(); goTo(current - 1, -1); }
  else if (e.button === 4) { e.preventDefault(); e.stopImmediatePropagation(); goTo(current + 1, 1); }
}, true);
document.addEventListener('contextmenu', e => e.preventDefault(), true);
document.addEventListener('auxclick', e => { if (e.button !== 0) e.preventDefault(); }, true);
let tx = 0;
document.addEventListener('touchstart', e => { tx = e.touches[0].clientX; }, { passive: true });
document.addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - tx;
  if (Math.abs(dx) > 50) goTo(current + (dx < 0 ? 1 : -1), dx < 0 ? 1 : -1);
}, { passive: true });
</script>
