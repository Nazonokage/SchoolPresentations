<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MySQL + WAMP + PHP — Full Guide</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap');

    * { box-sizing: border-box; }
    html, body { margin:0; padding:0; height:100%; overflow:hidden; }
    body {
      font-family:'Inter', system-ui, sans-serif;
      background:var(--bg);
      color:var(--ink);
      transition: background 300ms ease, color 300ms ease;
    }
    h1,h2,h3 { font-family:'Fraunces', Georgia, serif; margin:0; }
    code, pre, .mono { font-family:'JetBrains Mono', 'Courier New', monospace; }

    /* ——— DATA BLUEPRINT THEME ——— */
    :root {
      --bg: #1A2634;
      --bg-alt: #243447;
      --accent: #00D4FF;
      --accent-strong: #0099CC;
      --card: #2A3A4A;
      --card-border: rgba(0, 180, 255, 0.2);
      --shadow: rgba(0, 0, 0, 0.45);
      --ink: #E8F0F8;
      --ink-soft: #8AB0D4;
      --eyebrow-ink: #66D9FF;
      --card-ink: #E8F0F8;
      --card-ink-soft: #8AB0D4;
      --card-accent: #0099CC;
      --step-num-ink: #FFFFFF;
      --tick: 300ms;
      --table-border: rgba(0, 180, 255, 0.25);
    }

    #app { position:relative; width:100vw; height:100vh; overflow:hidden; }

    .progress-track { position:fixed; top:0; left:0; right:0; height:5px; background:rgba(0,180,255,0.15); z-index:50; }
    .progress-fill { height:100%; width:0%; background:linear-gradient(90deg, var(--accent-strong), var(--accent)); transition: width 350ms ease; }

    .query-gauge {
      position:fixed; top:18px; right:22px; z-index:50;
      display:flex; flex-direction:column; align-items:center; gap:4px;
      font-family:'JetBrains Mono', monospace; font-size:10px; letter-spacing:0.14em;
      color:var(--ink-soft); user-select:none; pointer-events:none;
      transition: color var(--tick) ease;
    }
    .query-gauge svg { width:34px; height:34px; display:block; }
    .query-gauge .db-icon { transform-origin:center bottom; }
    @media (prefers-reduced-motion: no-preference) {
      .query-gauge .db-icon { animation: pulseGlow 2.8s ease-in-out infinite; }
    }
    @keyframes pulseGlow {
      0% { opacity:0.5; transform:scale(1); }
      50% { opacity:1; transform:scale(1.08); }
      100% { opacity:0.5; transform:scale(1); }
    }
    .heat-label { text-transform:uppercase; font-weight:700; }

    .stage { position:absolute; inset:0; }
    .slide {
      position:absolute; inset:0;
      overflow-y:auto; overflow-x:hidden;
      display:flex; flex-direction:column; align-items:stretch; justify-content:safe center;
      padding: 76px clamp(28px, 7vw, 120px) 90px;
      opacity:0; transform:translateX(0) scale(1);
      will-change: transform, opacity;
    }
    .slide.active { opacity:1; transform:translateX(0) scale(1); transition: opacity var(--tick) ease, transform var(--tick) ease; z-index:5; }
    .slide.enter-fwd { transform:translateX(64px) scale(0.985); opacity:0; }
    .slide.enter-bwd { transform:translateX(-64px) scale(0.985); opacity:0; }
    .slide.exit-fwd { transform:translateX(-64px) scale(0.985); opacity:0; transition: opacity var(--tick) ease, transform var(--tick) ease; z-index:4; }
    .slide.exit-bwd { transform:translateX(64px) scale(0.985); opacity:0; transition: opacity var(--tick) ease, transform var(--tick) ease; z-index:4; }
    @media (prefers-reduced-motion: reduce) {
      .slide, .slide.active, .slide.enter-fwd, .slide.enter-bwd, .slide.exit-fwd, .slide.exit-bwd {
        transition: opacity 120ms linear !important; transform:none !important;
      }
    }
    .slide-inner { max-width:1000px; width:100%; margin:0 auto; }

    .eyebrow {
      font-family:'JetBrains Mono', monospace; font-size:12.5px; letter-spacing:0.16em;
      text-transform:uppercase; font-weight:700; color:var(--eyebrow-ink);
      display:flex; align-items:center; gap:10px; margin-bottom:14px;
      transition: color var(--tick) ease;
    }
    .eyebrow::after { content:''; flex:1; height:0; border-top:2px dashed var(--card-border); }
    h2.slide-title { font-size:clamp(28px, 4vw, 44px); font-weight:700; line-height:1.12; margin-bottom:22px; letter-spacing:-0.01em; }
    .lede { font-size:17px; color:var(--ink-soft); margin:-8px 0 22px; max-width:70ch; line-height:1.55; }

    .card {
      background:var(--card); border:1px solid var(--card-border); border-radius:10px;
      padding:18px 20px; min-width:0;
      box-shadow: 0 4px 18px var(--shadow);
      transition: background var(--tick) ease, border-color var(--tick) ease;
    }
    .card h3 { font-size:15px; font-weight:700; margin-bottom:6px; font-family:'Inter',sans-serif; color:var(--card-ink); }
    .card p, .card li { font-size:14.5px; color:var(--card-ink-soft); line-height:1.5; }

    .card-grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(0, 1fr)); gap:14px; min-width:0; }
    .card-grid.cols-2 { grid-template-columns:repeat(2, minmax(0,1fr)); }
    .card-grid.cols-3 { grid-template-columns:repeat(3, minmax(0,1fr)); }
    .card-grid.cols-4 { grid-template-columns:repeat(4, minmax(0,1fr)); }
    @media (max-width:760px){ .card-grid.cols-4{grid-template-columns:repeat(2, minmax(0,1fr));} .card-grid.cols-3{grid-template-columns:repeat(2, minmax(0,1fr));} .card-grid.cols-2{grid-template-columns:minmax(0,1fr);} }

    .two-col { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:26px; align-items:start; min-width:0; }
    @media (max-width:760px){ .two-col { grid-template-columns:minmax(0,1fr); } }
    .two-col > * { min-width:0; }

    ul.ticket-list { list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:9px; }
    ul.ticket-list li { position:relative; padding-left:22px; font-size:15.5px; line-height:1.5; color:var(--ink); }
    ul.ticket-list li::before { content:'▹'; position:absolute; left:0; color:var(--accent); font-weight:700; }

    ol.step-list { list-style:none; counter-reset:step; margin:0; padding:0; display:flex; flex-direction:column; gap:12px; }
    ol.step-list li { position:relative; padding-left:40px; font-size:15.5px; line-height:1.55; min-width:0; }
    ol.step-list li::before { counter-increment:step; content:counter(step); position:absolute; left:0; top:-1px; width:26px; height:26px; border-radius:50%; background:var(--card-accent); color:var(--step-num-ink); display:flex; align-items:center; justify-content:center; font-family:'JetBrains Mono',monospace; font-weight:700; font-size:13px; transition: background var(--tick) ease; }
    ol.step-list b { font-family:'JetBrains Mono',monospace; font-size:13.5px; background:var(--card); padding:1px 6px; border-radius:4px; border:1px solid var(--card-border); }

    .quote-block { font-family:'Fraunces', serif; font-style:italic; font-size:19px; line-height:1.5; color:var(--ink); border-left:3px solid var(--accent); padding:4px 0 4px 18px; margin:6px 0 20px; }
    .note { background:var(--card); border:1px dashed var(--card-border); border-radius:10px; padding:12px 16px; font-size:14px; color:var(--card-ink-soft); margin-top:14px; }
    .note b { color:var(--card-ink); }

    pre.code-block {
      background:#0E151E; color:#D4E6F5; border-radius:10px; padding:18px 20px;
      font-size:14px; line-height:1.6; overflow-x:auto; margin:0; min-width:0;
      box-shadow: inset 0 0 0 1px rgba(0,180,255,0.08), 0 6px 18px var(--shadow);
    }
    pre.code-block code { white-space:pre; }
    .tok-kw{ color:#FFB86C; font-weight:600; }
    .tok-str{ color:#A3D9A5; }
    .tok-com{ color:#7A8BA3; font-style:italic; }
    .tok-type{ color:#7FB0D6; }
    .tok-num{ color:#D99A6C; }
    .tok-fn{ color:#66D9FF; }

    .code-cap { font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:0.08em; text-transform:uppercase; color:var(--ink-soft); margin-bottom:8px; }

    .op-grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(0,1fr)); gap:10px; min-width:0; }
    .op-chip { background:var(--card); border:1px solid var(--card-border); border-radius:8px; padding:10px 12px; text-align:center; min-width:0; }
    .op-chip .sym { font-family:'JetBrains Mono',monospace; font-size:18px; font-weight:700; color:var(--card-accent); }
    .op-chip .desc { font-size:12px; color:var(--card-ink-soft); margin-top:2px; }

    .two-col pre.code-block { max-width:100%; overflow-x:auto; white-space:pre-wrap; word-break:break-word; }
    .two-col .code-block code { white-space:pre-wrap; word-break:break-word; }

    /* tables */
    .compare-table { width:100%; border-collapse:collapse; font-size:14px; }
    .compare-table th, .compare-table td { text-align:left; padding:10px 12px; border-bottom:1px solid var(--table-border); }
    .compare-table th { font-family:'JetBrains Mono',monospace; font-size:11.5px; text-transform:uppercase; letter-spacing:0.08em; color:var(--accent); }
    .compare-table td { color:var(--ink-soft); }
    .compare-table td:first-child { font-weight:600; color:var(--ink); }

    .param-table { width:100%; border-collapse:collapse; font-size:14px; }
    .param-table th, .param-table td { text-align:left; padding:8px 12px; border-bottom:1px solid var(--table-border); }
    .param-table th { font-family:'JetBrains Mono',monospace; font-size:11px; text-transform:uppercase; letter-spacing:0.08em; color:var(--accent); }
    .param-table td { color:var(--ink-soft); }

    /* HUD */
    .hud { position:fixed; bottom:16px; right:20px; z-index:50; display:flex; align-items:center; gap:12px; }
    .counter { font-family:'JetBrains Mono',monospace; font-size:13px; font-weight:700; background:var(--card); border:1px solid var(--card-border); color:var(--card-ink); padding:8px 16px; border-radius:999px; box-shadow:0 4px 14px var(--shadow); transition: background var(--tick) ease, color var(--tick) ease, border-color var(--tick) ease; }
    .hint { font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--ink-soft); letter-spacing:0.05em; display:none; }
    @media (min-width:640px){ .hint { display:block; } }

    .click-zone { position:fixed; inset:0; z-index:1; cursor:pointer; }
    .slide::-webkit-scrollbar { width:8px; }
    .slide::-webkit-scrollbar-thumb { background:var(--card-border); border-radius:8px; }
  </style>
</head>
<body>
<div id="app">
  <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>

  <div class="query-gauge" id="queryGauge">
    <svg viewBox="0 0 40 40" fill="none">
      <rect x="6" y="12" width="22" height="18" rx="2" stroke="var(--ink)" stroke-width="1.4" fill="var(--accent)" opacity="0.2" />
      <rect x="10" y="16" width="14" height="3" rx="1" fill="var(--accent)" opacity="0.7" class="db-icon" />
      <rect x="10" y="22" width="14" height="3" rx="1" fill="var(--accent)" opacity="0.5" class="db-icon" style="animation-delay:0.3s;" />
      <circle cx="28" cy="18" r="3" stroke="var(--accent)" stroke-width="1.2" fill="none" />
      <path d="M30 20 L34 24 M30 16 L34 12" stroke="var(--accent)" stroke-width="1.2" />
    </svg>
    <span class="heat-label" id="heatLabel">Query Cool</span>
  </div>

  <div class="click-zone" id="clickZone"></div>
  <div class="stage" id="stage"></div>

  <div class="hud">
    <span class="hint">click / → to continue</span>
    <div class="counter" id="counter">1 / 22</div>
  </div>
</div>

<script>
(function(){
  "use strict";

  function escapeHtml(s){
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  var KEYWORDS = ['SELECT','INSERT','UPDATE','DELETE','FROM','WHERE','JOIN','INNER','LEFT','RIGHT','GROUP','BY','ORDER','HAVING','LIMIT','OFFSET','CREATE','TABLE','DROP','ALTER','ADD','COLUMN','PRIMARY','KEY','FOREIGN','UNIQUE','INDEX','DATABASE','USE','SHOW','DESCRIBE','EXPLAIN','VALUES','INTO','SET','ON','AS','AND','OR','NOT','NULL','DEFAULT','CASCADE','RESTRICT','UNION','ALL','DISTINCT','COUNT','SUM','AVG','MAX','MIN','LIKE','BETWEEN','IS','TRUE','FALSE','BOOLEAN','INT','VARCHAR','TEXT','DATE','DATETIME','TIMESTAMP','FLOAT','DOUBLE','DECIMAL','CHAR','BLOB','ENUM','SET','TRIGGER','PROCEDURE','FUNCTION','VIEW','TEMPORARY','IF','ELSE','WHILE','LOOP','REPEAT','BEGIN','END','DECLARE','EXIT','CONTINUE','ITERATE','LEAVE','RETURN','CALL','DO','HANDLER','CONDITION','SIGNAL','RESIGNAL','GET','DIAGNOSTICS','STACKED','NO','SQL','EXCEPTION','CONTINUE','UNDO','READS','MODIFIES','SQL','SECURITY','DEFINER','INVOKER','DETERMINISTIC','NOT','DETERMINISTIC','CONTAINS','SQL','NO','SQL','READS','SQL','DATA','MODIFIES','SQL','DATA','COMMIT','ROLLBACK','START','TRANSACTION','SAVEPOINT','RELEASE','LOCK','TABLES','UNLOCK','function','OpenCon','CloseCon','mysqli'];
  var KW_RE = new RegExp('\\b(' + KEYWORDS.join('|') + ')\\b', 'i');
  var TOKEN_RE = /(\/\/.*$)|("(?:\\.|[^"\\])*")|('(?:\\.|[^'\\])')|\b([A-Za-z_][A-Za-z0-9_]*)\b|\b(\d+\.?\d*)\b/gm;

  function highlightSQL(src){
    var esc = escapeHtml(src);
    return esc.replace(TOKEN_RE, function(match, comment, str, chr, word, num){
      if(comment !== undefined) return '<span class="tok-com">' + comment + '</span>';
      if(str !== undefined) return '<span class="tok-str">' + str + '</span>';
      if(chr !== undefined) return '<span class="tok-str">' + chr + '</span>';
      if(word !== undefined){
        if(KW_RE.test(word)) return '<span class="tok-kw">' + word + '</span>';
        if(/^[A-Z]/.test(word)) return '<span class="tok-type">' + word + '</span>';
        return word;
      }
      if(num !== undefined) return '<span class="tok-num">' + num + '</span>';
      return match;
    });
  }
  function code(src){
    return '<pre class="code-block"><code>' + highlightSQL(src.replace(/^\n/,'').replace(/\n$/,'')) + '</code></pre>';
  }

  var S = [];

  // ——— SLIDES ———
  S.push({
    eyebrow: 'Data Blueprint — Intro',
    title: 'MySQL + WAMP + PHP',
    lede: 'A comprehensive guide to setting up your local web development environment and mastering database integration.',
    body:
      '<div class="quote-block">"Databases are the backbone of modern web apps. Let\'s get you started with MySQL, WAMP, and PHP."</div>' +
      '<div class="card-grid cols-3">' +
        '<div class="card"><h3>⚡ What is WAMP?</h3><p>Windows + Apache + MySQL + PHP — a complete local server stack for development.</p></div>' +
        '<div class="card"><h3>🗄️ Why MySQL?</h3><p>The world\'s most popular open-source relational database. Reliable, fast, and easy to learn.</p></div>' +
        '<div class="card"><h3>🐘 PHP + MySQL</h3><p>PHP provides built-in extensions to connect and interact with MySQL databases securely.</p></div>' +
      '</div>'
  });

  S.push({
    eyebrow: '1. What is SQL?',
    title: 'Structured Query Language',
    lede: 'SQL is a computer language designed for storing, manipulating, and retrieving data stored in a relational database.',
    body:
      '<div class="card-grid cols-3">' +
        '<div class="card"><h3>📝 DML</h3><p>Data Manipulation Language — manage data within schema objects.</p><p style="font-size:13px; color:var(--accent);"><b>SELECT · INSERT · UPDATE · DELETE</b></p></div>' +
        '<div class="card"><h3>🏗️ DDL</h3><p>Data Definition Language — define the database structure or schema.</p><p style="font-size:13px; color:var(--accent);"><b>CREATE · ALTER · DROP</b></p></div>' +
        '<div class="card"><h3>🔐 DCL</h3><p>Data Control Language — control privileges and permissions.</p><p style="font-size:13px; color:var(--accent);"><b>GRANT · REVOKE</b></p></div>' +
      '</div>'
  });

  S.push({
    eyebrow: '2. What is MySQL?',
    title: 'MySQL — The World\'s Most Popular RDBMS',
    lede: 'MySQL is an Oracle-backed, open-source Relational Database Management System (RDBMS) based on SQL.',
    body:
      '<div class="two-col">' +
        '<div class="card"><h3>🌐 Cross-Platform</h3><p>MySQL runs on virtually all platforms — Linux, UNIX, and Windows.</p><h3 style="margin-top:12px;">📱 Common Use Cases</h3><p>Most often associated with web applications and online publishing.</p></div>' +
        '<div class="card"><h3>📖 Standard Language</h3><p>SQL is the standard language for all modern RDBMS platforms:</p><ul class="ticket-list"><li>MySQL · MS Access · Oracle</li><li>Sybase · Informix · Postgres</li><li>SQL Server · and more</li></ul></div>' +
      '</div>'
  });

  // ——— NEW: WAMP vs XAMPP ———
  S.push({
    eyebrow: '3. Local Stack Environments',
    title: 'WAMP vs. XAMPP',
    lede: 'To host dynamic PHP scripts and run MySQL databases locally, developers use integrated stack packages.',
    body:
      '<div style="overflow-x:auto; margin-bottom:16px;">' +
      '<table class="compare-table">' +
        '<thead><tr><th>Feature</th><th>WAMP (WampServer)</th><th>XAMPP</th></tr></thead>' +
        '<tbody>' +
          '<tr><td>OS Focus</td><td><b>Strictly Windows</b> (Windows, Apache, MySQL, PHP)</td><td>Cross-Platform (Linux, Windows, macOS)</td></tr>' +
          '<tr><td>Root Web Directory</td><td><code>C:\\wamp64\\www\\</code> or <code>C:\\wamp\\www\\</code></td><td><code>C:\\xampp\\htdocs\\</code></td></tr>' +
          '<tr><td>Default Database Engine</td><td>Often prompts/defaults to MariaDB (easily toggles to MySQL)</td><td>Defaults to MariaDB</td></tr>' +
          '<tr><td>Control Interface</td><td>System Tray Menu (Lightweight dashboard)</td><td>Dedicated Control Panel window</td></tr>' +
        '</tbody>' +
      '</table>' +
      '</div>' +
      '<div class="note"><b>Why Focus on WAMP?</b> WAMP is highly optimized for Windows environments. It allows you to shift PHP versions, switch between MySQL and MariaDB ports, and manage virtual hosts directly from the Windows taskbar with minimal configuration overhead.</div>'
  });

  // ——— SQL Execution Process ———
  S.push({
    eyebrow: '4. SQL Execution Process',
    title: 'How SQL Queries Are Processed',
    lede: 'When you execute an SQL command, the system determines the best way to carry out your request.',
    body:
      '<div class="card"><h3>Architecture Components</h3><ol class="step-list">' +
        '<li><b>SQL Query</b> → Submitted by the client application.</li>' +
        '<li><b>Query Language Processor</b> → Parses and processes the incoming query text.</li>' +
        '<li><b>Parser + Optimizer</b> → Checks syntax and optimizes the query execution path for performance.</li>' +
        '<li><b>DBMS Engine</b> → Coordinates execution routines and interfaces with the storage engine.</li>' +
        '<li><b>File Manager + Transaction Manager</b> → Handles lock control, logging, data files, and blocks.</li>' +
        '<li><b>Physical Database</b> → The actual data storage on disk.</li>' +
      '</ol></div>'
  });

  // ——— MySQL Connections ———
  S.push({
    eyebrow: '5. MySQL Database Connections',
    title: 'Connecting to MySQL',
    lede: 'A connection allows a user to connect with database server software — whether on the same machine or remotely.',
    body:
      '<div class="two-col">' +
        '<div class="card"><h3>🔌 Connection Types</h3><ul class="ticket-list">' +
          '<li><b>Command-line client</b> — using <code>mysql.exe</code></li>' +
          '<li><b>PHP Script</b> — via <code>mysqli</code> or <code>PDO</code></li>' +
        '</ul></div>' +
        '<div class="card"><h3>📁 WAMP Binary Path</h3><p>WAMP stores its executable binaries systematically by version numbers.</p><p style="font-size:13px; color:var(--ink-soft);">Typical path: <code>C:\\wamp64\\bin\\mysql\\mysqlx.x.xx\\bin\\</code></p></div>' +
      '</div>'
  });

  // ——— Starting MySQL from WAMP Command-Line ———
  S.push({
    eyebrow: '5a. Command-Line Client',
    title: 'Starting MySQL from WAMP CMD',
    body:
      '<ol class="step-list">' +
        '<li>Left-click the <b>WampServer icon</b> in your system tray, navigate to <b>MySQL</b>, and ensure the service is <b>running</b>.</li>' +
        '<li>Open the Windows <b>Command Prompt</b> (cmd).</li>' +
        '<li>Navigate to your specific WAMP binary folder path (tweak the version number):<br><code>cd c:\\wamp64\\bin\\mysql\\mysqlx.x.xx\\bin</code></li>' +
        '<li>Type the connection command:<br><code>mysql -u root -p</code></li>' +
        '<li>When prompted for a password, simply hit <b>Enter</b> (default root has no password).</li>' +
      '</ol>' +
      '<div class="note"><b>💡 Tip:</b> The root user is installed with no password by default in WAMP. This is fine for local development.</div>'
  });

  // ——— PHP Script Connection ———
  S.push({
    eyebrow: '6. PHP Script Connection',
    title: 'Connecting to MySQL Using PHP',
    lede: 'The classic way to connect uses mysqli_connect() with basic parameters.',
    body:
      '<div style="overflow-x:auto; margin-bottom:16px;">' +
      '<table class="param-table">' +
        '<thead><tr><th>Parameter</th><th>Description</th></tr></thead>' +
        '<tbody>' +
          '<tr><td><b>server</b></td><td>The host running the database server. For WAMP, this is <code>localhost</code>.</td></tr>' +
          '<tr><td><b>user</b></td><td>The username accessing the database. Default for WAMP is <code>root</code>.</td></tr>' +
          '<tr><td><b>password</b></td><td>The target security password. WAMP defaults this to an empty value (<code>""</code>).</td></tr>' +
          '<tr><td><b>database</b></td><td>Optional. The default database name to look at when queries run.</td></tr>' +
          '<tr><td><b>port</b></td><td>Optional. WAMP generally defaults to port <code>3306</code> for MySQL.</td></tr>' +
        '</tbody>' +
      '</table>' +
      '</div>' +
      code('mysqli_connect(server, user, password, database, port);')
  });

  // ——— Skill Building: Part A ———
  S.push({
    eyebrow: '7a. Database Configuration',
    title: 'WAMP phpMyAdmin Setup',
    lede: 'Create your first database using phpMyAdmin.',
    body:
      '<ol class="step-list">' +

  // ——— HEAT GAUGE ———
  function applyHeat(t){
    var label = t < 0.4 ? 'Query Cool' : (t < 0.7 ? 'Index Warm' : 'Join Hot');
    document.getElementById('heatLabel').textContent = label;
  }

  // ——— RENDER & NAVIGATION ———
  var stage = document.getElementById('stage');
  var counterEl = document.getElementById('counter');
  var progressFill = document.getElementById('progressFill');
  var total = S.length;
  var current = 0;
  var animating = false;

  function buildSlideEl(idx){
    var d = S[idx];
    var el = document.createElement('div');
    el.className = 'slide';
    el.innerHTML =
      '<div class="slide-inner">' +
        '<div class="eyebrow">' + d.eyebrow + '</div>' +
        '<h2 class="slide-title">' + d.title + '</h2>' +
        (d.lede ? '<div class="lede">' + d.lede + '</div>' : '') +
        d.body +
      '</div>';
    return el;
  }

  function updateHud(){
    counterEl.textContent = (current+1) + ' / ' + total;
    progressFill.style.width = ((current) / (total-1) * 100) + '%';
    applyHeat(current / (total-1));
  }

  var curEl = buildSlideEl(0);
  curEl.classList.add('active');
  stage.appendChild(curEl);
  updateHud();

  function goTo(idx, dir){
    if(animating || idx === current || idx < 0 || idx >= total) return;
    animating = true;
    var nextEl = buildSlideEl(idx);
    nextEl.classList.add(dir > 0 ? 'enter-fwd' : 'enter-bwd');
    stage.appendChild(nextEl);
    void nextEl.offsetWidth;
    var oldEl = curEl;
    requestAnimationFrame(function(){
      oldEl.classList.remove('active');
      oldEl.classList.add(dir > 0 ? 'exit-fwd' : 'exit-bwd');
      nextEl.classList.remove('enter-fwd','enter-bwd');
      nextEl.classList.add('active');
    });
    current = idx;
    curEl = nextEl;
    updateHud();
    setTimeout(function(){
      if(oldEl && oldEl.parentNode) oldEl.parentNode.removeChild(oldEl);
      animating = false;
    }, 420);
  }

  function next(){ goTo(current+1, 1); }
  function prev(){ goTo(current-1, -1); }

  document.getElementById('clickZone').addEventListener('click', function(e){
    var w = window.innerWidth;
    if(e.clientX < w * 0.25){ prev(); } else { next(); }
  });

  document.addEventListener('keydown', function(e){
    if(e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown'){ e.preventDefault(); next(); }
    else if(e.key === 'ArrowLeft' || e.key === 'PageUp'){ e.preventDefault(); prev(); }
    else if(e.key === 'Home'){ e.preventDefault(); goTo(0, -1); }
    else if(e.key === 'End'){ e.preventDefault(); goTo(total-1, 1); }
    else if(e.key === 'ArrowUp'){ e.preventDefault(); prev(); }
    else if(e.key === 'ArrowDown'){ e.preventDefault(); next(); }
  });
})();
