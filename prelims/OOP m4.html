<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Module 4 — Java Objects &amp; Class Members — Roast-Level Crash Course</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap');

        * {
            box-sizing: border-box;
        }
        html,
        body {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
        }
        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: var(--bg);
            color: var(--ink);
            transition: background 300ms ease, color 300ms ease;
        }
        h1,
        h2,
        h3 {
            font-family: 'Fraunces', Georgia, serif;
            margin: 0;
        }
        code,
        pre,
        .mono {
            font-family: 'JetBrains Mono', 'Courier New', monospace;
        }

        :root {
            --bg: #F5E3B8;
            --bg-alt: #FBF1DA;
            --accent: #C27B22;
            --accent-strong: #9C5A15;
            --card: #FFF7E6;
            --card-border: rgba(64, 43, 24, 0.18);
            --shadow: rgba(64, 43, 24, 0.15);
            --ink: #2E1408;
            --ink-soft: #3F2210;
            --eyebrow-ink: #33170A;
            --card-ink: #2E1408;
            --card-ink-soft: #3F2210;
            --card-accent: #33170A;
            --step-num-ink: #FFEDDD;
            --success-ink: #1C4225;
            --tick: 300ms;
        }

        #app {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }

        .progress-track {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 5px;
            background: rgba(64, 43, 24, 0.12);
            z-index: 50;
        }
        .progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--accent-strong), var(--accent));
            transition: width 350ms ease;
        }

        .roast-gauge {
            position: fixed;
            top: 18px;
            right: 22px;
            z-index: 50;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 10px;
            letter-spacing: 0.14em;
            color: var(--ink-soft);
            user-select: none;
            pointer-events: none;
            transition: color var(--tick) ease;
        }
        .roast-gauge svg {
            width: 34px;
            height: 34px;
            display: block;
        }
        .roast-gauge .steam {
            transform-origin: center bottom;
        }
        @media (prefers-reduced-motion: no-preference) {
            .roast-gauge .steam {
                animation: steamRise 2.6s ease-in-out infinite;
            }
            .roast-gauge .steam.s2 {
                animation-delay: 0.5s;
            }
        }
        @keyframes steamRise {
            0% {
                opacity: 0;
                transform: translateY(0) scaleY(1);
            }
            30% {
                opacity: 0.65;
            }
            100% {
                opacity: 0;
                transform: translateY(-7px) scaleY(1.3);
            }
        }
        .roast-label {
            text-transform: uppercase;
            font-weight: 700;
        }

        .stage {
            position: absolute;
            inset: 0;
        }
        .slide {
            position: absolute;
            inset: 0;
            overflow-y: auto;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            align-items: stretch;
            justify-content: safe center;
            padding: 76px clamp(28px, 7vw, 120px) 90px;
            opacity: 0;
            transform: translateX(0) scale(1);
            will-change: transform, opacity;
        }
        .slide.active {
            opacity: 1;
            transform: translateX(0) scale(1);
            transition: opacity var(--tick) ease, transform var(--tick) ease;
            z-index: 5;
        }
        .slide.enter-fwd {
            transform: translateX(64px) scale(0.985);
            opacity: 0;
        }
        .slide.enter-bwd {
            transform: translateX(-64px) scale(0.985);
            opacity: 0;
        }
        .slide.exit-fwd {
            transform: translateX(-64px) scale(0.985);
            opacity: 0;
            transition: opacity var(--tick) ease, transform var(--tick) ease;
            z-index: 4;
        }
        .slide.exit-bwd {
            transform: translateX(64px) scale(0.985);
            opacity: 0;
            transition: opacity var(--tick) ease, transform var(--tick) ease;
            z-index: 4;
        }
        @media (prefers-reduced-motion: reduce) {
            .slide,
            .slide.active,
            .slide.enter-fwd,
            .slide.enter-bwd,
            .slide.exit-fwd,
            .slide.exit-bwd {
                transition: opacity 120ms linear !important;
                transform: none !important;
            }
        }
        .slide-inner {
            max-width: 1060px;
            width: 100%;
            margin: 0 auto;
        }

        .eyebrow {
            font-family: 'JetBrains Mono', monospace;
            font-size: 12.5px;
            letter-spacing: 0.16em;
            text-transform: uppercase;
            font-weight: 700;
            color: var(--eyebrow-ink);
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 14px;
            transition: color var(--tick) ease;
        }
        .eyebrow::after {
            content: '';
            flex: 1;
            height: 0;
            border-top: 2px dashed var(--card-border);
        }
        h2.slide-title {
            font-size: clamp(28px, 4vw, 44px);
            font-weight: 700;
            line-height: 1.12;
            margin-bottom: 16px;
            letter-spacing: -0.01em;
        }
        .lede {
            font-size: 17px;
            color: var(--ink-soft);
            margin: -4px 0 18px;
            max-width: 72ch;
            line-height: 1.55;
        }

        .card {
            background: var(--card);
            border: 1px solid var(--card-border);
            border-radius: 10px;
            padding: 18px 20px;
            min-width: 0;
            box-shadow: 0 2px 10px var(--shadow);
            transition: background var(--tick) ease, border-color var(--tick) ease;
        }
        .card h3 {
            font-size: 15px;
            font-weight: 700;
            margin-bottom: 6px;
            font-family: 'Inter', sans-serif;
            color: var(--card-ink);
        }
        .card p,
        .card li {
            font-size: 14.5px;
            color: var(--card-ink-soft);
            line-height: 1.5;
        }

        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(0, 1fr));
            gap: 14px;
            min-width: 0;
        }
        .card-grid.cols-2 {
            grid-template-columns: repeat(2, minmax(0, 1fr));
        }
        .card-grid.cols-3 {
            grid-template-columns: repeat(3, minmax(0, 1fr));
        }
        .card-grid.cols-4 {
            grid-template-columns: repeat(4, minmax(0, 1fr));
        }
        @media (max-width:760px) {
            .card-grid.cols-4 {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }
            .card-grid.cols-3 {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }
            .card-grid.cols-2 {
                grid-template-columns: minmax(0, 1fr);
            }
        }

        .two-col {
            display: grid;
            grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
            gap: 26px;
            align-items: start;
            min-width: 0;
        }
        @media (max-width:760px) {
            .two-col {
                grid-template-columns: minmax(0, 1fr);
            }
        }
        .two-col>* {
            min-width: 0;
        }

        ul.ticket-list {
            list-style: none;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            gap: 9px;
        }
        ul.ticket-list li {
            position: relative;
            padding-left: 22px;
            font-size: 15.5px;
            line-height: 1.5;
            color: var(--ink);
        }
        ul.ticket-list li::before {
            content: '—';
            position: absolute;
            left: 0;
            color: var(--accent);
            font-weight: 700;
        }

        ol.step-list {
            list-style: none;
            counter-reset: step;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        ol.step-list li {
            position: relative;
            padding-left: 40px;
            font-size: 15.5px;
            line-height: 1.55;
            min-width: 0;
        }
        ol.step-list li::before {
            counter-increment: step;
            content: counter(step);
            position: absolute;
            left: 0;
            top: -1px;
            width: 26px;
            height: 26px;
            border-radius: 50%;
            background: var(--card-accent);
            color: var(--step-num-ink);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'JetBrains Mono', monospace;
            font-weight: 700;
            font-size: 13px;
            transition: background var(--tick) ease;
        }
        ol.step-list b {
            font-family: 'JetBrains Mono', monospace;
            font-size: 13.5px;
            background: var(--card);
            padding: 1px 6px;
            border-radius: 4px;
            border: 1px solid var(--card-border);
        }

        .quote-block {
            font-family: 'Fraunces', serif;
            font-style: italic;
            font-size: 19px;
            line-height: 1.5;
            color: var(--ink);
            border-left: 3px solid var(--accent);
            padding: 4px 0 4px 18px;
            margin: 6px 0 20px;
        }
        .note {
            background: var(--card);
            border: 1px dashed var(--card-border);
            border-radius: 10px;
            padding: 12px 16px;
            font-size: 14px;
            color: var(--card-ink-soft);
            margin-top: 14px;
        }
        .note b {
            color: var(--card-ink);
        }

        pre.code-block {
            background: #1e1710;
            color: #f1e6d3;
            border-radius: 0 0 10px 10px;
            padding: 18px 20px;
            font-size: 14px;
            line-height: 1.6;
            overflow-x: auto;
            margin: 0;
            min-width: 0;
            box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.05), 0 6px 18px var(--shadow);
        }

        .code-wrap {
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 2px 10px var(--shadow);
        }
        .code-wrap pre.code-block {
            border-radius: 0 0 10px 10px;
            box-shadow: none;
        }
        .code-wrap-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255,255,255,0.08);
            border-bottom: 1px solid rgba(255,255,255,0.06);
            padding: 6px 12px;
            background: #2a1e14;
        }
        .code-wrap-label {
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            font-weight: 600;
            color: #d99a6c;
            letter-spacing: 0.04em;
        }
        .copy-btn {
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            font-weight: 700;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.15);
            color: #f1e6d3;
            padding: 3px 12px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 150ms ease;
            position: relative;
            z-index: 10;
        }
        .copy-btn:hover {
            background: var(--accent);
            color: #fff;
            border-color: var(--accent);
        }
        .copy-btn.copied {
            background: #4a8c5c;
            color: #fff;
            border-color: #4a8c5c;
        }
        pre.code-block code {
            white-space: pre;
        }
        .tok-kw {
            color: #e39a5a;
            font-weight: 600;
        }
        .tok-str {
            color: #a8c98f;
        }
        .tok-com {
            color: #7d7166;
            font-style: italic;
        }
        .tok-type {
            color: #7fb0d6;
        }
        .tok-num {
            color: #d99a6c;
        }

        .code-cap {
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--ink-soft);
            margin-bottom: 8px;
        }

        .op-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(0, 1fr));
            gap: 10px;
            min-width: 0;
        }
        .op-chip {
            background: var(--card);
            border: 1px solid var(--card-border);
            border-radius: 8px;
            padding: 10px 12px;
            text-align: center;
            min-width: 0;
        }
        .op-chip .sym {
            font-family: 'JetBrains Mono', monospace;
            font-size: 18px;
            font-weight: 700;
            color: var(--card-accent);
        }
        .op-chip .desc {
            font-size: 12px;
            color: var(--card-ink-soft);
            margin-top: 2px;
        }

        .hud {
            position: fixed;
            bottom: 16px;
            right: 20px;
            z-index: 50;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .counter {
            font-family: 'JetBrains Mono', monospace;
            font-size: 13px;
            font-weight: 700;
            background: var(--card);
            border: 1px solid var(--card-border);
            color: var(--card-ink);
            padding: 8px 16px;
            border-radius: 999px;
            box-shadow: 0 4px 14px var(--shadow);
            transition: background var(--tick) ease, color var(--tick) ease, border-color var(--tick) ease;
        }
        .hint {
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            color: var(--ink-soft);
            letter-spacing: 0.05em;
            display: none;
        }
        @media (min-width:640px) {
            .hint {
                display: block;
            }
        }

        .click-zone {
            position: fixed;
            inset: 0;
            z-index: 1;
            cursor: pointer;
        }

        .slide::-webkit-scrollbar {
            width: 8px;
        }
        .slide::-webkit-scrollbar-thumb {
            background: var(--card-border);
            border-radius: 8px;
        }

        .two-col pre.code-block {
            max-width: 100%;
            overflow-x: auto;
            white-space: pre-wrap;
            word-break: break-word;
        }
        .two-col .code-block code {
            white-space: pre-wrap;
            word-break: break-word;
        }

        .activity-box {
            background: var(--card);
            border: 2px solid var(--accent);
            border-radius: 12px;
            padding: 18px 22px;
            margin-top: 10px;
        }
        .activity-box h3 {
            font-family: 'Inter', sans-serif;
            font-size: 16px;
            font-weight: 700;
            color: var(--card-accent);
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .activity-box .prompt {
            font-size: 15px;
            line-height: 1.6;
            color: var(--card-ink-soft);
        }
        .activity-box .prompt code {
            background: var(--bg);
            padding: 1px 6px;
            border-radius: 4px;
            font-size: 13px;
        }

        .answer-key {
            background: var(--bg-alt);
            border: 1px solid var(--accent);
            border-radius: 10px;
            padding: 16px 20px;
            margin-top: 14px;
        }
        .answer-key h4 {
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            font-weight: 700;
            color: var(--card-ink);
            margin-bottom: 8px;
        }
        .answer-key .answer-pill {
            display: inline-block;
            font-family: 'JetBrains Mono', monospace;
            font-weight: 700;
            color: var(--success-ink);
        }
        .answer-key code {
            background: var(--card);
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 13px;
            border: 1px solid var(--card-border);
        }
        .answer-key pre {
            margin: 6px 0 0;
        }
        .answer-key pre.code-block code {
            background: none;
            padding: 0;
            border: none;
            border-radius: 0;
            font-size: 14px;
        }

        .tag {
            display: inline-block;
            font-family: 'JetBrains Mono', monospace;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            background: var(--accent);
            color: #fff;
            padding: 2px 10px;
            border-radius: 999px;
            margin-right: 6px;
        }
        .tag.green {
            background: #4a8c5c;
        }
        .tag.blue {
            background: #3f7a9e;
        }
        .tag.purple {
            background: #7a5f9e;
        }
        .tag.orange {
            background: #c27b3a;
        }

        .quiz-option {
            display: block;
            padding: 6px 0 6px 28px;
            position: relative;
            font-size: 14.5px;
            line-height: 1.5;
            color: var(--card-ink-soft);
        }
        .quiz-option::before {
            content: '';
            position: absolute;
            left: 4px;
            top: 10px;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            border: 2px solid var(--card-border);
            background: var(--card);
        }
        .quiz-option.correct::before {
            background: #4a8c5c;
            border-color: #4a8c5c;
        }
        .quiz-option.correct::after {
            content: '✓';
            position: absolute;
            left: 6px;
            top: 7px;
            color: #fff;
            font-size: 12px;
            font-weight: 700;
        }
        .quiz-option.wrong::before {
            background: #b14a4a;
            border-color: #b14a4a;
        }
        .quiz-option.wrong::after {
            content: '✗';
            position: absolute;
            left: 6px;
            top: 7px;
            color: #fff;
            font-size: 12px;
            font-weight: 700;
        }

        .hierarchy-diagram {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 10px 0;
            font-family: 'JetBrains Mono', monospace;
        }
        .hierarchy-diagram .top {
            background: var(--accent);
            color: #fff;
            padding: 8px 24px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 16px;
        }
        .hierarchy-diagram .connector {
            width: 2px;
            height: 24px;
            background: var(--accent-strong);
            margin: 2px 0;
        }
        .hierarchy-diagram .bottom {
            display: flex;
            gap: 24px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .hierarchy-diagram .bottom span {
            background: var(--card);
            border: 2px solid var(--accent);
            padding: 6px 18px;
            border-radius: 6px;
            font-weight: 600;
            font-size: 14px;
            color: var(--card-ink);
        }

        .file-tree {
            background: #1e1710;
            border-radius: 10px;
            padding: 18px 22px;
            box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.05), 0 6px 18px var(--shadow);
            font-family: 'JetBrains Mono', monospace;
            font-size: 14px;
            line-height: 1.9;
            color: #f1e6d3;
        }
        .file-tree .ft-row {
            white-space: pre;
        }
        .file-tree .ft-folder {
            color: #e39a5a;
            font-weight: 700;
        }
        .file-tree .ft-file {
            color: #7fb0d6;
        }
        .file-tree .ft-comment {
            color: #7d7166;
            font-style: italic;
        }

        .file-tabs {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 8px;
        }
        .file-tabs .tab {
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            font-weight: 600;
            background: var(--card);
            border: 1px solid var(--card-border);
            padding: 4px 14px;
            border-radius: 999px;
            color: var(--card-ink-soft);
        }
        .file-tabs .tab.active {
            background: var(--accent);
            color: #fff;
            border-color: var(--accent);
        }

        /* ----- code-breakdown panel ----- */
        .code-breakdown {
            background: #f5efe8;
            border-radius: 10px;
            padding: 14px 18px;
            margin-top: 10px;
            font-size: 13.5px;
            line-height: 1.75;
            color: #1e1710;
            border-left: 4px solid var(--accent);
            box-shadow: inset 0 0 0 1px rgba(0,0,0,0.05);
        }
        .code-breakdown .bd-title {
            font-family: 'Inter', sans-serif;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--accent-strong);
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .code-breakdown .bd-row {
            display: flex;
            align-items: baseline;
            gap: 10px;
            padding: 5px 0;
            border-bottom: 1px solid rgba(64,43,24,0.08);
        }
        .code-breakdown .bd-row:last-child { border-bottom: none; }
        .code-breakdown .bd-num {
            flex-shrink: 0;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: var(--accent);
            color: #fff;
            font-size: 11px;
            font-weight: 700;
            font-family: 'JetBrains Mono', monospace;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .code-breakdown .bd-text { flex: 1; font-size: 13.5px; color: #1e1710; line-height: 1.6; }
        .code-breakdown strong { color: #2E1408; font-family: 'JetBrains Mono', monospace; font-size: 13px; }
        .code-breakdown .highlight {
            background: rgba(255,255,240,0.85);
            padding: 1px 6px;
            border-radius: 4px;
            border: 1px solid rgba(64,43,24,0.22);
            font-family: 'JetBrains Mono', monospace;
            font-size: 12.5px;
            color: #1e1710;
        }
        .code-breakdown .highlight code { background: transparent; padding: 0; border: none; color: inherit; }
        .code-breakdown code {
            background: rgba(255,255,255,0.6);
            padding: 0 4px;
            border-radius: 3px;
            font-size: 12.5px;
            color: #1e1710;
        }

        /* ----- memory / object diagram ----- */
        .mem-diagram {
            display: flex;
            gap: 14px;
            flex-wrap: wrap;
            margin-top: 10px;
        }

        (function() {
            "use strict";

            function escapeHtml(s) {
                return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
            }
            var KEYWORDS = ['public', 'private', 'protected', 'static', 'void', 'final', 'class', 'new', 'if', 'else',
                'return',
                'for', 'while', 'do', 'int', 'double', 'float', 'long', 'short', 'byte', 'char', 'boolean', 'true', 'false',
                'null',
                'this', 'super', 'package', 'import', 'extends', 'implements', 'instanceof', 'try', 'catch', 'finally',
                'throw', 'throws', 'abstract'
            ];
            var KW_RE = new RegExp('\\b(' + KEYWORDS.join('|') + ')\\b');
            var TOKEN_RE = /(\/\/.*$)|("(?:\\.|[^"\\])*")|('(?:\\.|[^'\\])')|\b([A-Za-z_][A-Za-z0-9_]*)\b|\b(\d+\.?\d*)\b/gm;

            function highlightJava(src) {
                var esc = escapeHtml(src);
                return esc.replace(TOKEN_RE, function(match, comment, str, chr, word, num) {
                    if (comment !== undefined) return '<span class="tok-com">' + comment + '</span>';
                    if (str !== undefined) return '<span class="tok-str">' + str + '</span>';
                    if (chr !== undefined) return '<span class="tok-str">' + chr + '</span>';
                    if (word !== undefined) {
                        if (KW_RE.test(word)) return '<span class="tok-kw">' + word + '</span>';
                        if (/^[A-Z]/.test(word)) return '<span class="tok-type">' + word + '</span>';
                        return word;
                    }
                    if (num !== undefined) return '<span class="tok-num">' + num + '</span>';
                    return match;
                });
            }

            function reindentJava(src) {
                var INDENT = '    ';
                var lines = src.split('\n').map(function(l) { return l.trim(); });
                var depth = 0;
                var out = [];
                for (var i = 0; i < lines.length; i++) {
                    var line = lines[i];
                    if (line === '') { out.push(''); continue; }
                    var leadingClose = /^[}\)\]]/.test(line);
                    if (leadingClose) depth = Math.max(0, depth - 1);
                    out.push(INDENT.repeat(depth) + line);
                    var opens = (line.match(/[{(\[]/g) || []).length;
                    var closes = (line.match(/[}\)\]]/g) || []).length;
                    var net = opens - closes;
                    if (leadingClose) net += 1;
                    depth = Math.max(0, depth + net);
                }
                return out.join('\n');
            }

            var codeBlockId = 0;
            function code(src, label) {
                src = src.replace(/^\n/, '').replace(/\n$/, '');
                src = reindentJava(src);

        { bg: '#331014', bgAlt: '#4A1B1F', accent: '#C24B4F', accentStrong: '#E06B6E', card: '#4A1E22',

      var BG_CROSSOVER_T = 11 / 21;

        TEXT_LIGHT_SOFT = '#F2E6D6';
      var ACCENT_DARK_TEXT = '#33170A',
        ACCENT_LIGHT_TEXT = '#FFEDDD';
      var SUCCESS_DARK = '#1C4225',
        SUCCESS_LIGHT = '#9FE6AC';

      function hexToRgb(h) { h = h.replace('#', ''); return [parseInt(h.substring(0, 2), 16), parseInt(h.substring(2, 4),
            16), parseInt(h.substring(4, 6), 16)]; }

      function rgbToHex(r, g, b) {
        function c(x) { x = Math.round(Math.max(0, Math.min(255, x))); return x.toString(16).padStart(2, '0'); }
        return '#' + c(r) + c(g) + c(b);
      }

      function lerp(a, b, t) { return a + (b - a) * t; }

      function lerpHex(h1, h2, t) { var c1 = hexToRgb(h1),
          c2 = hexToRgb(h2); return rgbToHex(lerp(c1[0], c2[0], t), lerp(c1[1], c2[1], t), lerp(c1[2], c2[2], t)); }

      function lerpRgba(a, b, t) { return 'rgba(' + Math.round(lerp(a[0], b[0], t)) + ',' + Math.round(lerp(a[1], b[1],
          t)) + ',' + Math.round(lerp(a[2], b[2], t)) + ',' + lerp(a[3], b[3], t).toFixed(2) + ')'; }

      function roastVarsAt(t) {
        var seg, localT;
        if (t <= 0.5) { seg = [STOPS[0], STOPS[1]];
          localT = t / 0.5; } else { seg = [STOPS[1], STOPS[2]];
          localT = (t - 0.5) / 0.5; }
        var A = seg[0],
          B = seg[1];
        return {
          '--bg': lerpHex(A.bg, B.bg, localT),
          '--bg-alt': lerpHex(A.bgAlt, B.bgAlt, localT),
          '--accent': lerpHex(A.accent, B.accent, localT),
          '--accent-strong': lerpHex(A.accentStrong, B.accentStrong, localT),
          '--card': lerpHex(A.card, B.card, localT),
          '--card-border': lerpRgba(A.cardBorder, B.cardBorder, localT),
          '--shadow': lerpRgba(A.shadow, B.shadow, localT)
        };
      }

      function applyRoast(t) {
        var vars = roastVarsAt(t);
        var root = document.documentElement.style;
        for (var k in vars) { root.setProperty(k, vars[k]); }
        var onBg = t < BG_CROSSOVER_T;
        root.setProperty('--ink', onBg ? TEXT_DARK : TEXT_LIGHT);
        root.setProperty('--ink-soft', onBg ? TEXT_DARK_SOFT : TEXT_LIGHT_SOFT);
        root.setProperty('--eyebrow-ink', onBg ? ACCENT_DARK_TEXT : ACCENT_LIGHT_TEXT);
        var onCard = t < CARD_CROSSOVER_T;
        root.setProperty('--card-ink', onCard ? TEXT_DARK : TEXT_LIGHT);
        root.setProperty('--card-ink-soft', onCard ? TEXT_DARK_SOFT : TEXT_LIGHT_SOFT);
        root.setProperty('--card-accent', onCard ? ACCENT_DARK_TEXT : ACCENT_LIGHT_TEXT);
        root.setProperty('--step-num-ink', onCard ? TEXT_LIGHT : TEXT_DARK);
        root.setProperty('--success-ink', onCard ? SUCCESS_DARK : SUCCESS_LIGHT);
        var label = t < 0.34 ? 'Light Roast' : (t < 0.67 ? 'Medium Roast' : 'Dark Roast');
        document.getElementById('roastLabel').textContent = label;
      }

      // ---- render & navigate ----
      var stage = document.getElementById('stage');
      var counterEl = document.getElementById('counter');
      var progressFill = document.getElementById('progressFill');
      var total = S.length;
      var current = 0;
      var animating = false;

      function buildSlideEl(idx) {
        var d = S[idx];
        var el = document.createElement('div');
        el.className = 'slide';
        el.innerHTML =
          '<div class="slide-inner">' +
          '<div class="eyebrow">' + d.eyebrow + '</div>' +
          '<h2 class="slide-title">' + d.title + '</h2>' +
          (d.lede ? '<div class="lede">' + d.lede + '</div>' : '') +
          d.body +
          '</div>';
        return el;
      }

      function updateHud() {
        counterEl.textContent = (current + 1) + ' / ' + total;
        progressFill.style.width = ((current) / (total - 1) * 100) + '%';
        applyRoast(current / (total - 1));
      }

      var curEl = buildSlideEl(0);
      curEl.classList.add('active');
      stage.appendChild(curEl);
      updateHud();

      function goTo(idx, dir) {
        if (animating || idx === current || idx < 0 || idx >= total) return;
        animating = true;
        var nextEl = buildSlideEl(idx);
        nextEl.classList.add(dir > 0 ? 'enter-fwd' : 'enter-bwd');
        stage.appendChild(nextEl);
        void nextEl.offsetWidth;
        var oldEl = curEl;
        requestAnimationFrame(function() {
          oldEl.classList.remove('active');
          oldEl.classList.add(dir > 0 ? 'exit-fwd' : 'exit-bwd');
          nextEl.classList.remove('enter-fwd', 'enter-bwd');
          nextEl.classList.add('active');
        });
        current = idx;
        curEl = nextEl;
        updateHud();
        setTimeout(function() {
          if (oldEl && oldEl.parentNode) oldEl.parentNode.removeChild(oldEl);
          animating = false;
        }, 420);
      }

      function next() { goTo(current + 1, 1); }

      function prev() { goTo(current - 1, -1); }

      document.getElementById('clickZone').addEventListener('click', function(e) {
        var w = window.innerWidth;
        if (e.clientX < w * 0.25) { prev(); } else { next(); }
      });

      document.addEventListener('keydown', function(e) {
        if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown') { e.preventDefault();
          next(); } else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault();
          prev(); } else if (e.key === 'Home') { e.preventDefault();
          goTo(0, -1); } else if (e.key === 'End') { e.preventDefault();
          goTo(total - 1, 1); } else if (e.key === 'ArrowUp') { e.preventDefault();
          prev(); } else if (e.key === 'ArrowDown') { e.preventDefault();
          next(); }
      });
      // ─── copy button handler ───
      document.addEventListener('click', function(e) {
        var btn = e.target.closest ? e.target.closest('.copy-btn') : null;
        if (!btn) return;
        e.stopPropagation();
        var targetId = btn.getAttribute('data-copy');
        var codeEl = document.getElementById(targetId);
        if (!codeEl) return;
        var text = codeEl.textContent;
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text).then(function() {
            btn.textContent = 'Copied!';
            btn.classList.add('copied');
            setTimeout(function() { btn.textContent = 'Copy'; btn.classList.remove('copied'); }, 1500);
          });
        } else {
          var ta = document.createElement('textarea');
          ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
          document.body.appendChild(ta); ta.select();
          try { document.execCommand('copy'); } catch(err) {}
          document.body.removeChild(ta);
          btn.textContent = 'Copied!';
          btn.classList.add('copied');
          setTimeout(function() { btn.textContent = 'Copy'; btn.classList.remove('copied'); }, 1500);
        }
      });
