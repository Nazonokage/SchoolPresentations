<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Module 2 · Foundations of SIA — Activity</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&family=JetBrains+Mono:wght@400;500;600&display=swap');

    * { box-sizing: border-box; margin:0; padding:0; }
    html, body { height:100%; overflow:hidden; background:var(--bg); color:var(--ink); font-family:'Inter', sans-serif; }
    h1,h2,h3 { font-family:'Inter', sans-serif; font-weight:600; letter-spacing:-0.01em; }
    code, pre, .mono { font-family:'JetBrains Mono', monospace; }

    /* ——— ENTERPRISE THEME ——— */
    :root {
      --bg: #0F1724;
      --bg-alt: #192237;
      --accent: #4B9EFF;
      --accent-soft: #7BB8FF;
      --accent-strong: #1A6FD9;
      --card: #1C2840;
      --card-border: rgba(75, 158, 255, 0.18);
      --shadow: rgba(0, 0, 0, 0.5);
      --ink: #EAF0F8;
      --ink-soft: #9BB0C8;
      --eyebrow-ink: #7BB8FF;
      --card-ink: #EAF0F8;
      --card-ink-soft: #9BB0C8;
      --card-accent: #4B9EFF;
      --step-num-ink: #0F1724;
      --tick: 300ms;
      --table-border: rgba(75, 158, 255, 0.15);
      --answer-bg: #1A2D3D;
    }

    #app { position:relative; width:100vw; height:100vh; overflow:hidden; }

    .progress-track { position:fixed; top:0; left:0; right:0; height:3px; background:rgba(75,158,255,0.12); z-index:50; }
    .progress-fill { height:100%; width:0%; background:linear-gradient(90deg, var(--accent-strong), var(--accent)); transition: width 350ms ease; }

    .enterprise-gauge {
      position:fixed; top:18px; right:22px; z-index:50;
      display:flex; flex-direction:column; align-items:center; gap:4px;
      font-family:'JetBrains Mono', monospace; font-size:9px; letter-spacing:0.12em;
      color:var(--ink-soft); user-select:none; pointer-events:none;
      transition: color var(--tick) ease;
    }
    .enterprise-gauge svg { width:32px; height:32px; display:block; }
    .enterprise-gauge .pulse { transform-origin:center; }
    @media (prefers-reduced-motion: no-preference) {
      .enterprise-gauge .pulse { animation: entPulse 3s ease-in-out infinite; }
    }
    @keyframes entPulse {
      0% { opacity:0.5; transform:scale(0.95); }
      50% { opacity:1; transform:scale(1.05); }
      100% { opacity:0.5; transform:scale(0.95); }
    }
    .gauge-label { text-transform:uppercase; font-weight:600; letter-spacing:0.08em; }

    .stage { position:absolute; inset:0; }
    .slide {
      position:absolute; inset:0;
      overflow-y:auto; overflow-x:hidden;
      display:flex; flex-direction:column; align-items:stretch; justify-content:safe center;
      padding: 76px clamp(28px, 7vw, 120px) 90px;
      opacity:0; transform:translateX(0) scale(1);
      will-change: transform, opacity;
    }
    .slide.active { opacity:1; transform:translateX(0) scale(1); transition: opacity var(--tick) ease, transform var(--tick) ease; z-index:5; }
    .slide.enter-fwd { transform:translateX(64px) scale(0.985); opacity:0; }
    .slide.enter-bwd { transform:translateX(-64px) scale(0.985); opacity:0; }
    .slide.exit-fwd { transform:translateX(-64px) scale(0.985); opacity:0; transition: opacity var(--tick) ease, transform var(--tick) ease; z-index:4; }
    .slide.exit-bwd { transform:translateX(64px) scale(0.985); opacity:0; transition: opacity var(--tick) ease, transform var(--tick) ease; z-index:4; }
    @media (prefers-reduced-motion: reduce) {
      .slide, .slide.active, .slide.enter-fwd, .slide.enter-bwd, .slide.exit-fwd, .slide.exit-bwd {
        transition: opacity 120ms linear !important; transform:none !important;
      }
    }
    .slide-inner { max-width:1000px; width:100%; margin:0 auto; }

    .eyebrow {
      font-family:'JetBrains Mono', monospace; font-size:11px; letter-spacing:0.14em;
      text-transform:uppercase; font-weight:500; color:var(--eyebrow-ink);
      display:flex; align-items:center; gap:10px; margin-bottom:12px;
      transition: color var(--tick) ease;
    }
    .eyebrow::after { content:''; flex:1; height:0; border-top:1.5px dashed var(--card-border); }
    h2.slide-title { font-size:clamp(26px, 3.8vw, 42px); font-weight:700; line-height:1.15; margin-bottom:18px; letter-spacing:-0.02em; }
    .lede { font-size:16px; color:var(--ink-soft); margin:-6px 0 20px; max-width:70ch; line-height:1.5; }

    .card {
      background:var(--card); border:1px solid var(--card-border); border-radius:10px;
      padding:18px 20px; min-width:0;
      box-shadow: 0 4px 16px var(--shadow);
      transition: background var(--tick) ease, border-color var(--tick) ease;
    }
    .card h3 { font-size:15px; font-weight:600; margin-bottom:5px; color:var(--card-ink); }
    .card p, .card li { font-size:14.5px; color:var(--card-ink-soft); line-height:1.5; }
    .card strong { color:var(--card-ink); }

    .card-grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(0, 1fr)); gap:14px; min-width:0; }
    .card-grid.cols-2 { grid-template-columns:repeat(2, minmax(0,1fr)); }
    .card-grid.cols-3 { grid-template-columns:repeat(3, minmax(0,1fr)); }
    .card-grid.cols-4 { grid-template-columns:repeat(4, minmax(0,1fr)); }
    @media (max-width:760px){ .card-grid.cols-4{grid-template-columns:repeat(2, minmax(0,1fr));} .card-grid.cols-3{grid-template-columns:repeat(2, minmax(0,1fr));} .card-grid.cols-2{grid-template-columns:minmax(0,1fr);} }

    .two-col { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:24px; align-items:start; min-width:0; }
    @media (max-width:760px){ .two-col { grid-template-columns:minmax(0,1fr); } }
    .two-col > * { min-width:0; }

    ul.ticket-list { list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:8px; }
    ul.ticket-list li { position:relative; padding-left:22px; font-size:15px; line-height:1.5; color:var(--ink); }
    ul.ticket-list li::before { content:'▹'; position:absolute; left:0; color:var(--accent); font-weight:700; }

    .quote-block { font-family:'Inter', sans-serif; font-weight:500; font-size:18px; line-height:1.5; color:var(--ink); border-left:3px solid var(--accent); padding:4px 0 4px 18px; margin:6px 0 18px; }
    .note { background:var(--card); border:1px dashed var(--card-border); border-radius:10px; padding:12px 16px; font-size:14px; color:var(--card-ink-soft); margin-top:14px; }
    .note b { color:var(--card-ink); }

    .answer-box {
      background:var(--answer-bg);
      border:1px solid var(--card-border);
      border-radius:10px;
      padding:14px 18px;
      margin-top:10px;
    }
    .answer-box .label { font-weight:600; color:var(--accent-soft); font-size:13px; letter-spacing:0.05em; }
    .answer-box .value { font-size:16px; color:var(--card-ink); margin-top:2px; }

    .analogy-grid {
      display:grid;
      grid-template-columns:repeat(auto-fit, minmax(150px, 1fr));
      gap:16px;
      margin:10px 0 6px;
    }
    .analogy-item {
      background:var(--card);
      border:1px solid var(--card-border);
      border-radius:12px;
      padding:14px 12px 12px;
      text-align:center;
      box-shadow: 0 4px 12px var(--shadow);
      transition: background var(--tick) ease;
    }
    .analogy-item .emoji-big { font-size:38px; line-height:1.2; display:block; margin-bottom:4px; }
    .analogy-item .label { font-weight:600; color:var(--card-ink); font-size:14px; letter-spacing:-0.01em; }
    .analogy-item .desc { font-size:12.5px; color:var(--card-ink-soft); margin-top:3px; line-height:1.4; }

    pre.code-block {
      background:#0B111E; color:#D4E4F0; border-radius:10px; padding:16px 18px;
      font-size:13px; line-height:1.6; overflow-x:auto; margin:0; min-width:0;
      box-shadow: inset 0 0 0 1px rgba(75,158,255,0.06), 0 6px 16px var(--shadow);
      border:1px solid rgba(75,158,255,0.06);
    }
    pre.code-block code { white-space:pre; }
    .tok-kw{ color:#FFB86C; font-weight:600; }
    .tok-str{ color:#A3D9A5; }
    .tok-com{ color:#6A8A9E; font-style:italic; }
    .tok-type{ color:#6AB0D6; }
    .tok-num{ color:#D99A6C; }
    .tok-fn{ color:#66D9FF; }
    .tok-prop{ color:#B5A9E8; }
    .tok-tag{ color:#4B9EFF; }
    .tok-attr{ color:#FFB86C; }
    .tok-selector{ color:#A3D9A5; }

    .code-cap { font-family:'JetBrains Mono',monospace; font-size:10px; letter-spacing:0.08em; text-transform:uppercase; color:var(--ink-soft); margin-bottom:6px; }

    .two-col pre.code-block { max-width:100%; overflow-x:auto; white-space:pre-wrap; word-break:break-word; }
    .two-col .code-block code { white-space:pre-wrap; word-break:break-word; }

    /* hierarchy diagram */
    .hierarchy {
      display:flex; flex-direction:column; align-items:center; gap:6px;
      background:var(--card); border:1px solid var(--card-border); border-radius:12px;
      padding:16px 20px; margin:10px 0;
    }
    .hier-item {
      background:var(--bg); border:1px solid var(--card-border); border-radius:8px;
      padding:10px 18px; width:100%; max-width:500px; text-align:center;
      font-size:15px; font-weight:500; color:var(--card-ink);
    }
    .hier-item .sub { font-weight:400; font-size:13px; color:var(--card-ink-soft); display:block; }
    .hier-arrow { color:var(--accent-soft); font-size:20px; line-height:1; }

    .hud { position:fixed; bottom:16px; right:20px; z-index:50; display:flex; align-items:center; gap:12px; }
    .counter { font-family:'JetBrains Mono',monospace; font-size:12px; font-weight:500; background:var(--card); border:1px solid var(--card-border); color:var(--card-ink); padding:6px 14px; border-radius:999px; box-shadow:0 4px 14px var(--shadow); transition: background var(--tick) ease, color var(--tick) ease, border-color var(--tick) ease; }
    .hint { font-family:'JetBrains Mono',monospace; font-size:10px; color:var(--ink-soft); letter-spacing:0.05em; display:none; }
    @media (min-width:640px){ .hint { display:block; } }

    .click-zone { position:fixed; inset:0; z-index:1; cursor:pointer; }
    .slide::-webkit-scrollbar { width:5px; }
    .slide::-webkit-scrollbar-thumb { background:var(--card-border); border-radius:8px; }
  </style>
</head>
<body>
<div id="app">
  <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>

  <div class="enterprise-gauge" id="enterpriseGauge">
    <svg viewBox="0 0 32 32" fill="none">
      <rect x="4" y="8" width="24" height="18" rx="2" stroke="var(--accent)" stroke-width="1.2" fill="var(--accent)" opacity="0.12" />
      <rect x="8" y="12" width="16" height="2" rx="1" fill="var(--accent)" opacity="0.5" class="pulse" />
      <rect x="8" y="16" width="12" height="2" rx="1" fill="var(--accent)" opacity="0.3" class="pulse" style="animation-delay:0.4s;" />
      <rect x="8" y="20" width="14" height="2" rx="1" fill="var(--accent)" opacity="0.4" class="pulse" style="animation-delay:0.8s;" />
    </svg>
    <span class="gauge-label" id="gaugeLabel">Module 2</span>
  </div>

  <div class="click-zone" id="clickZone"></div>

  <div class="hud">
    <span class="hint">click / → to continue</span>
    <div class="counter" id="counter">1 / 21</div>
  </div>
</div>

<script>
(function(){
  "use strict";

  function escapeHtml(s){
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  // Single-pass tokenizer
  var KEYWORDS = ['class','def','__init__','self','print','input','int','if','elif','else','while','return','True','False','None','and','or','not','in','is','for','break','continue','try','except','finally','raise','import','from','as','with','global','nonlocal','lambda','yield','del','pass','quit','main','cashieringsystem','foods','a','r','recieve','change','temp','c','d','system','integration','architecture','erp','sia','is','information','systems','organizational','management','business','enterprise','planning','resource','data','analytics','decision','storage','behavioral','value','chain','silos','strategic','operational','efficiency','quality','supply','connectivity','dashboard','manual','communication','budgeting','competitive','market','costs','revenue','forecast','risk','compliance','governance','scalability','interoperability','middleware','api','legacy','modernization','digital','transformation','workflow','automation','orchestration','cloud','onpremise','hybrid','container','microservices','devops','agile','waterfall','sdlc','itil','cobit','togaf','zachman','soa','esb','bpm','crm','scm','hcm','bi','iot','ai','ml','blockchain','cybersecurity','privacy','gdpr','hipaa','soc','iso','nist','transaction','processing','expert','decision','support','management','knowledge','batch','online','point','sale','pos'];
  var KW_RE = new RegExp('\\b(' + KEYWORDS.join('|') + ')\\b', 'i');
  var TOKEN_RE = /(\/\/.*$)|("(?:\\.|[^"\\])*")|('(?:\\.|[^'\\])')|\b([A-Za-z_][A-Za-z0-9_]*)\b|\b(\d+\.?\d*)\b/gm;

  function highlightCode(src){
    var esc = escapeHtml(src);
    return esc.replace(TOKEN_RE, function(match, comment, str, chr, word, num){
      if(comment !== undefined) return '<span class="tok-com">' + comment + '</span>';
      if(str !== undefined) return '<span class="tok-str">' + str + '</span>';
      if(chr !== undefined) return '<span class="tok-str">' + chr + '</span>';
      if(word !== undefined){
        if(KW_RE.test(word)) return '<span class="tok-kw">' + word + '</span>';
        if(/^[A-Z]/.test(word)) return '<span class="tok-type">' + word + '</span>';
        return word;
      }
      if(num !== undefined) return '<span class="tok-num">' + num + '</span>';
      return match;
    });
  }
  function code(src){
    return '<pre class="code-block"><code>' + highlightCode(src.replace(/^\n/,'').replace(/\n$/,'')) + '</code></pre>';
  }

  var S = [];

  // ——— SLIDES ———
  S.push({
    eyebrow: 'Module 2 · Foundations',
    title: 'System Integration & Information Systems',
    lede: 'Business culture, architecture, integration phases, and IS categories — with a hands-on Python activity.',
    body:
      '<div class="card-grid cols-3">' +
        '<div class="card"><h3>🏢 Business Culture</h3><p>Understanding the environment where systems operate is critical for IT professionals.</p></div>' +
        '<div class="card"><h3>🔗 Integration Architecture</h3><p>The blueprint that turns heterogeneous parts into a unified whole.</p></div>' +
        '<div class="card"><h3>📊 IS Categories</h3><p>From TPS to Expert Systems — each level serves a distinct organizational need.</p></div>' +
      '</div>'
  });

  S.push({

    body:
      '<div class="two-col">' +
        '<div class="card"><h3>💻 IT Advantage</h3><ul class="ticket-list"><li>IT students have natural familiarity with computer operations.</li><li>Adjusting to IT Marketing, IT-Based Projects, and IT Financial Systems is highly manageable.</li><li>Training directly matches these requirements.</li></ul></div>' +
        '<div class="card"><h3>🌍 Market Alignment</h3><ul class="ticket-list"><li><strong>Business Culture:</strong> Model of operations determining communication and client interaction.</li><li>Systems must address real-world needs.</li><li>Like selling ice cream in hot climates — identify the target environment before building.</li></ul></div>' +

  S.push({

    lede: 'A SYSTEM is composed of heterogeneous parts — individual pieces with entirely different characteristics.',
    body:
      '<div class="two-col">' +
        '<div class="card"><h3>🔗 System Integration</h3><p>The process of assembling scattered components according to their functional lines to turn a complicated environment into an uncomplicated, unified approach.</p><p style="margin-top:8px;"><strong>Components:</strong> varying platforms, operating systems, APIs, memory management, and threads.</p></div>' +
        '<div class="card"><h3>🏛️ Architecture & Drivers</h3><ul class="ticket-list"><li><strong>Architecture:</strong> Dictates the overall blueprint, standards, and strategic compass of the DESIGN.</li><li><strong>Modern Drivers:</strong> Increased automation creates demand to simplify complex processes.</li><li>Integrated systems streamline workflows, reduce costs, and ensure efficiency.</li></ul></div>' +
      '</div>'
  });

  S.push({
    eyebrow: 'Practical Example',
    title: 'Point-of-Sale (POS) Program',
    body:
      '<div class="card-grid cols-2">' +
        '<div class="card"><h3>🏷️ Product IDs & Database</h3><ul class="ticket-list"><li>Every item features a unique ID or barcode.</li><li>Prevents data duplication and system glitches.</li><li>Scanning fetches the index key, logging into the database.</li></ul></div>' +
        '<div class="card"><h3>📊 Batch Processing & Decisions</h3><ul class="ticket-list"><li>Automated schedules run Batch Processing to post receipts.</li><li>Manages daily inventory and cash flows.</li><li>End-of-day sales compile into graphical summaries for administrative Decision Making.</li></ul></div>' +
      '</div>' +
      '<div class="analogy-grid"><div class="analogy-item"><span class="emoji-big">🛒</span><div class="label">POS as SIA</div><div class="desc">A real-world example of integration — barcodes, database, batch processing, and reporting work together.</div></div></div>'
  });

  S.push({
    eyebrow: 'Infrastructure Modernization',
    title: 'Strategic Benefits',
    body:
      '<div class="card-grid cols-4">' +
        '<div class="card"><h3>💰 Save Money</h3><p>Managing all data from a single platform slashes repetitive operational overhead.</p></div>' +
        '<div class="card"><h3>🔒 Security</h3><p>Unified mesh protects data cohesively — rather than securing dozens of loose applications.</p></div>' +
        '<div class="card"><h3>👁️ Real-Time Visibility</h3><p>Track data throughout its lifecycle. Access up-to-date information instantly from anywhere.</p></div>' +

  S.push({

  S.push({

    body:

        '<div class="hier-item">🧠 Expert Systems (ES)<span class="sub">Knowledge-based AI & Advanced Diagnostics</span></div>' +
        '<div class="hier-arrow">↓</div>' +

        '<div class="hier-arrow">↓</div>' +

  S.push({

        '<div class="card"><h3>📌 What is TPS?</h3><ul class="ticket-list"><li>Processes raw data from daily business operations.</li><li>Performs vital store-keeping functions and updates records.</li><li>Two main styles: <strong>Batch Processing</strong> and <strong>Online Transaction Processing</strong>.</li></ul></div>' +
        '<div class="card"><h3>📦 Examples</h3><ul class="ticket-list"><li>Bill systems</li><li>Payroll software</li><li>Stock control tools</li></ul></div>' +
      '</div>'
  });

  S.push({
    eyebrow: 'MIS · Management Information',
    title: 'Management Information System',
    body:
      '<div class="two-col">' +
        '<div class="card"><h3>📌 What is MIS?</h3><ul class="ticket-list"><li>Converts raw transactional data from TPS into summarized, clean report formats.</li><li>Provides operational summaries targeted at middle management and operational supervisors.</li></ul></div>' +
        '<div class="card"><h3>📦 Examples</h3><ul class="ticket-list"><li>Sales management systems</li><li>HR management platforms</li></ul></div>' +
      '</div>'
  });

  S.push({
    eyebrow: 'DSS · Decision Support',
    title: 'Decision Support System',
    body:

        '<div class="card"><h3>📌 What is DSS?</h3><ul class="ticket-list"><li>Interactive platform providing data models and manipulation toolsets.</li><li>Helps semi-structured or unstructured decision scenarios.</li><li>Assists end-users in gathering insights and analyzing choices.</li></ul></div>' +
        '<div class="card"><h3>📦 Examples</h3><ul class="ticket-list"><li>Financial planning systems</li><li>Bank loan evaluation systems</li></ul></div>' +
      '</div>'
  });

  S.push({
    eyebrow: 'ES · Expert Systems',
    title: 'Expert Systems',
    body:
      '<div class="two-col">' +
        '<div class="card"><h3>📌 What is ES?</h3><ul class="ticket-list"><li>Embeds specialized human expertise to assist in diagnosing problems.</li><li>Built on artificial intelligence and knowledge engineering.</li><li>Utilizes a dedicated <strong>Knowledgebase</strong> and an inference engine.</li></ul></div>' +
        '<div class="card"><h3>🧠 Key Features</h3><ul class="ticket-list"><li>Provides structured answers to user inquiries.</li><li>Mimics human expert decision-making.</li><li>Used in complex diagnostic scenarios.</li></ul></div>' +
      '</div>'
  });

  // ——— ACTIVITY: Python Code ———
  S.push({
    eyebrow: 'Skill-Building Activity',
    title: 'Code Architecture Study · sia1.py',
    body:
      '<div class="code-cap">Python Implementation Reference</div>' +
      code('class cashieringsystem:\n    def __init__(self, a=0, r=0, recieve=0, change=0, temp=0):\n        print("\\n\\n*****SIA SAS CASHIERING SYSTEM*****\\n")\n        self.a = a\n        self.r = r\n        self.recieve = recieve\n        self.change = change\n        self.temp = temp\n\n    def foods(self):\n        print("******Campus Restaurant******")\n        print("1.Adobo----->30", "\\n2.Nilaga----->35", "\\n3.Pork Chop--->50", "\\n4.Letchon Paksiw--->40", "\\n5.Cash Out", "\\n6.Exit")\n        \n        while True:\n            c = int(input("Choose:\\n"))\n            if c == 1:\n                d = int(input("Enter the quantity:\\n"))\n                self.r = self.r + 30 * d\n            elif c == 2:\n                d = int(input("Enter the quantity:\\n"))\n                self.r = self.r + 35 * d\n            elif c == 3:\n                d = int(input("Enter the quantity:\\n"))\n                self.r = self.r + 50 * d\n            elif c == 4:\n                d = int(input("Enter the quantity:\\n"))\n                self.r = self.r + 40 * d\n            elif c == 5:\n                if self.r:\n                    print("total:", self.r)\n                    self.recieve = int(input("Input Money Recieve:\\n"))\n                    self.change = self.recieve - self.r\n                    print("Change:", self.change)\n                    print("******Thank You Come Again!!!******")\n                    quit()\n            elif c == 6:\n                quit()\n            else:\n                print("Invalid option")\n\ndef main():\n    a = cashieringsystem()\n    a.foods()\n\nif __name__ == "__main__":\n    main()')
  });

  // ——— Check for Understanding (Questions) ———
  S.push({

  S.push({

  });

  // ——— GAUGE ———
  function applyGauge(t){
    var label = t < 0.4 ? 'Module 2' : (t < 0.7 ? 'Integration' : 'Systems');
    document.getElementById('gaugeLabel').textContent = label;
  }

  // ——— RENDER & NAV ———
  var stage = document.getElementById('stage');
  var counterEl = document.getElementById('counter');
  var progressFill = document.getElementById('progressFill');
  var total = S.length;
  var current = 0;
  var animating = false;

  function buildSlideEl(idx){
    var d = S[idx];
    var el = document.createElement('div');
    el.className = 'slide';
    el.innerHTML =
      '<div class="slide-inner">' +
        '<div class="eyebrow">' + d.eyebrow + '</div>' +
        '<h2 class="slide-title">' + d.title + '</h2>' +
        (d.lede ? '<div class="lede">' + d.lede + '</div>' : '') +
        d.body +
      '</div>';
    return el;
  }

  function updateHud(){
    counterEl.textContent = (current+1) + ' / ' + total;
    progressFill.style.width = ((current) / (total-1) * 100) + '%';
    applyGauge(current / (total-1));
  }

  var curEl = buildSlideEl(0);
  curEl.classList.add('active');
  stage.appendChild(curEl);
  updateHud();

  function goTo(idx, dir){
    if(animating || idx === current || idx < 0 || idx >= total) return;
    animating = true;
    var nextEl = buildSlideEl(idx);
    nextEl.classList.add(dir > 0 ? 'enter-fwd' : 'enter-bwd');
    stage.appendChild(nextEl);
    void nextEl.offsetWidth;
    var oldEl = curEl;
    requestAnimationFrame(function(){
      oldEl.classList.remove('active');
      oldEl.classList.add(dir > 0 ? 'exit-fwd' : 'exit-bwd');
      nextEl.classList.remove('enter-fwd','enter-bwd');
      nextEl.classList.add('active');
    });
    current = idx;
    curEl = nextEl;
    updateHud();
    setTimeout(function(){
      if(oldEl && oldEl.parentNode) oldEl.parentNode.removeChild(oldEl);
      animating = false;
    }, 420);
  }

  function next(){ goTo(current+1, 1); }
  function prev(){ goTo(current-1, -1); }

  document.getElementById('clickZone').addEventListener('click', function(e){
    var w = window.innerWidth;
    if(e.clientX < w * 0.25){ prev(); } else { next(); }
  });

  document.addEventListener('keydown', function(e){
    if(e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown'){ e.preventDefault(); next(); }
    else if(e.key === 'ArrowLeft' || e.key === 'PageUp'){ e.preventDefault(); prev(); }
    else if(e.key === 'Home'){ e.preventDefault(); goTo(0, -1); }
    else if(e.key === 'End'){ e.preventDefault(); goTo(total-1, 1); }
    else if(e.key === 'ArrowUp'){ e.preventDefault(); prev(); }
    else if(e.key === 'ArrowDown'){ e.preventDefault(); next(); }
  });
})();
</script>
