<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Module 3 · Data Manipulation Language</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    <style>
        /* ------------------------------------------------------------
           phpMyAdmin–inspired dark theme (same as Module 2)
           ------------------------------------------------------------ */
        :root {
            --bg: #151828;
            --bg-deep: #0e1120;
            --bg-card: #1e2340;
            --bg-card-hover: #282f52;
            --shadow-light: rgba(255, 255, 255, 0.04);
            --shadow-dark: rgba(0, 0, 0, 0.6);
            --shadow-dark-strong: rgba(0, 0, 0, 0.8);
            --text-primary: #e8e4d4;
            --text-muted: #9499b0;
            --text-dim: #636a82;
            --accent: #4a9eb5;
            --accent-soft: #1e334a;
            --accent-2: #ffffff;
            --accent-2-soft: #2a2a2a;
            --warn: #d97a5a;
            --warn-soft: #3a2824;
            --panel-dark: #0d1020;
            --panel-dark-2: #161a30;
            --tok-keyword: #ffffff;
            --tok-type: #ffffff;
            --tok-string: #ffffff;
            --tok-number: #ffffff;
            --tok-comment: #ffffff;
            --tok-punct: #ffffff;
            --tok-text: #ffffff;
            --radius-lg: 24px;
            --radius-md: 16px;
            --radius-sm: 10px;
            --font-display: 'Space Grotesk', sans-serif;
            --font-body: 'Inter', sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
        }

        * { box-sizing: border-box; }
        html, body {
            margin: 0; padding: 0; height: 100%;
            background: var(--bg);
            color: var(--text-primary);
            font-family: var(--font-body);
            -webkit-font-smoothing: antialiased;
        }
        body { overflow: hidden; }
        #app { position: fixed; inset: 0; }
        .stage { position: absolute; inset: 0; }
        .slide-panel {
            position: absolute; inset: 0;
            overflow-y: auto; overflow-x: hidden;
            opacity: 0; pointer-events: none;
            transform: translateX(0) scale(1);
            transition: opacity .38s ease, transform .38s ease;
            z-index: 1;
            -webkit-overflow-scrolling: touch;
        }
        .slide-panel.active {
            opacity: 1; transform: translateX(0) scale(1);
            pointer-events: auto; z-index: 2;
        }
        .slide-panel.from-right { transform: translateX(48px) scale(.98); }
        .slide-panel.from-left { transform: translateX(-48px) scale(.98); }
        .slide-panel.to-left { transform: translateX(-48px) scale(.98); opacity: 0; }
        .slide-panel.to-right { transform: translateX(48px) scale(.98); opacity: 0; }
        @media (prefers-reduced-motion: reduce) {
            .slide-panel { transition: opacity .15s linear !important; transform: none !important; }
            .slide-panel.from-right, .slide-panel.from-left, .slide-panel.to-left, .slide-panel.to-right { transform: none !important; }
        }

        .slide {
            min-height: 100%;
            display: flex;
            padding: clamp(28px, 5vw, 72px) clamp(24px, 8vw, 120px);
        }
        .slide-inner {
            margin: auto;
            width: 100%;
            max-width: 1000px;
            padding: 8px 0 40px;
        }

        .eyebrow {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-family: var(--font-mono);
            font-size: 12px;
            font-weight: 600;
            letter-spacing: .06em;
            color: var(--accent);
            background: var(--accent-soft);
            padding: 5px 14px 5px 12px;
            border-radius: 999px;
            box-shadow: inset 0 1px 0 rgba(74,158,181,0.25), 0 4px 12px rgba(0,0,0,0.3);
            margin-bottom: 18px;
            border: 1px solid rgba(74,158,181,0.15);
        }
        .eyebrow::before { content: "◆"; font-size: 10px; opacity: .7; }
        h1.title {
            font-family: var(--font-display);
            font-weight: 700;
            font-size: clamp(28px, 4.4vw, 46px);
            line-height: 1.12;
            margin: 0 0 12px;
            letter-spacing: -.01em;
            color: var(--text-primary);
        }
        p.subtitle {
            font-size: clamp(15px, 1.6vw, 18px);
            color: var(--text-muted);
            max-width: 640px;
            line-height: 1.55;
            margin: 0 0 28px;
        }

        .neu {
            background: var(--bg-card);
            border-radius: var(--radius-lg);
            box-shadow: 8px 8px 20px var(--shadow-dark), -4px -4px 12px var(--shadow-light);
            border: 1px solid rgba(255,255,255,0.04);
        }
        .neu-sm {
            border-radius: var(--radius-md);
            box-shadow: 6px 6px 14px var(--shadow-dark), -3px -3px 10px var(--shadow-light);
            border: 1px solid rgba(255,255,255,0.03);
        }
        .neu-inset {
            background: var(--bg-deep);
            border-radius: var(--radius-md);
            box-shadow: inset 4px 4px 12px var(--shadow-dark-strong), inset -3px -3px 10px var(--shadow-light);
            border: 1px solid rgba(255,255,255,0.03);
        }

        .content-card {
            padding: clamp(20px, 3vw, 32px);
            margin-top: 8px;
        }

        ul.bullets {
            list-style: none;
            margin: 0; padding: 0;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        ul.bullets li {
            position: relative;
            padding-left: 28px;
            font-size: clamp(15px, 1.5vw, 17px);
            line-height: 1.55;
            color: var(--text-primary);
        }
        ul.bullets li::before {
            content: "";
            position: absolute; left: 0; top: 7px;
            width: 9px; height: 9px;
            border-radius: 3px;
            background: var(--accent);
            box-shadow: 0 2px 6px rgba(74,158,181,0.4);
        }
        ul.bullets li b, ul.bullets li strong { color: #fff; font-weight: 700; }
        ul.bullets li code {
            font-family: var(--font-mono);
            background: var(--accent-soft);
            color: var(--accent);
            padding: 1px 6px; border-radius: 6px;
            font-size: .92em;
        }

        .tip {
            display: flex; gap: 14px; align-items: flex-start;
            margin-top: 22px;
            padding: 16px 20px;
            border-radius: var(--radius-md);
            background: var(--accent-2-soft);
            box-shadow: inset 2px 2px 8px rgba(0,0,0,0.5), inset -2px -2px 8px rgba(232,168,56,0.06);
            border: 1px solid rgba(232,168,56,0.12);
        }
        .tip .icon { font-size: 20px; line-height: 1.4; }
        .tip .txt { font-size: 14.5px; color: #e8d8a8; line-height: 1.55; }
        .tip .txt b { color: #f0d870; }

        .warning {
            display: flex; gap: 14px; align-items: flex-start;
            margin-top: 22px;
            padding: 16px 20px;
            border-radius: var(--radius-md);
            background: var(--warn-soft);
            box-shadow: inset 2px 2px 8px rgba(0,0,0,0.5), inset -2px -2px 8px rgba(217,122,90,0.05);
            border: 1px solid rgba(217,122,90,0.15);
        }
        .warning .icon { font-size: 20px; }
        .warning .txt { font-size: 14.5px; color: #e8b8a8; line-height: 1.55; }
        .warning .txt b { color: #f0b8a0; }

        table.data-table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            font-size: 14.5px;
        }
        table.data-table th {
            font-family: var(--font-mono);
            text-transform: uppercase;
            letter-spacing: .04em;
            font-size: 11.5px;
            color: var(--text-muted);
            text-align: left;
            padding: 10px 16px;
            border-bottom: 2px solid rgba(255,255,255,0.06);
        }
        table.data-table td {
            padding: 13px 16px;
            border-bottom: 1px solid rgba(255,255,255,0.04);
            vertical-align: top;
            color: var(--text-primary);
            line-height: 1.5;
        }
        table.data-table tr:last-child td { border-bottom: none; }
        table.data-table td.mono, table.data-table th.mono { font-family: var(--font-mono); }
        table.data-table code.cell-code {
            font-family: var(--font-mono);
            background: var(--accent-soft);
            color: var(--accent);
            padding: 2px 8px; border-radius: 6px;
            font-size: 13px;
        }

        .card-grid {
            display: grid;
            grid-template-columns: repeat(var(--cols, 3), minmax(0, 1fr));
            gap: 16px;
            margin-top: 6px;
        }
        .card {
            min-width: 0;
            padding: 18px 20px;
            border-radius: var(--radius-md);
            background: var(--bg-card);
            border: 1px solid rgba(255,255,255,0.04);
            box-shadow: 4px 4px 12px var(--shadow-dark), -2px -2px 8px var(--shadow-light);
        }
        .card .card-title {
            font-family: var(--font-mono);
            font-weight: 600;
            font-size: 14.5px;
            color: var(--accent);
            margin-bottom: 8px;
            word-break: break-word;
        }
        .card .card-desc {
            font-size: 13.8px;
            color: var(--text-muted);
            line-height: 1.5;
        }

        .twocol {
            display: grid;
            grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
            gap: 20px;
            margin-top: 6px;
        }
        .col {
            min-width: 0;
            padding: 22px 24px;
            border-radius: var(--radius-md);
            background: var(--bg-card);
            border: 1px solid rgba(255,255,255,0.04);
            box-shadow: 6px 6px 16px var(--shadow-dark), -3px -3px 10px var(--shadow-light);
        }
        .col-head {
            font-family: var(--font-display);
            font-weight: 700;
            font-size: 19px;
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 14px;
            color: var(--text-primary);
        }
        .col-head .dot {
            width: 11px; height: 11px;
            border-radius: 50%;
        }
        .col.dml .dot { background: var(--accent-2); }
        .col.ddl .dot { background: var(--accent); }
        .col ul {
            list-style: none;
            margin: 0 0 12px; padding: 0;
            display: flex;
            flex-direction: column;
            gap: 9px;
        }
        .col li {
            font-family: var(--font-mono);
            font-size: 14.5px;
            color: var(--text-primary);
        }
        .col .desc {
            font-size: 13.5px;
            color: var(--text-muted);
            line-height: 1.5;
        }
        .note-strip {
            margin-top: 18px;
            font-size: 13px;
            color: var(--text-muted);
            padding: 12px 18px;
            border-radius: 14px;
            grid-column: 1 / -1;
            background: var(--bg-deep);
            border: 1px solid rgba(255,255,255,0.04);
            box-shadow: inset 2px 2px 8px rgba(0,0,0,0.4);
        }

        .code-block { margin-top: 18px; }
        .code-label {
            font-family: var(--font-mono);
            font-size: 11.5px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: .06em;
            margin-bottom: 8px;
            padding-left: 4px;
        }
        .code-panel {
            background: var(--panel-dark);
            border-radius: var(--radius-md);
            box-shadow: 6px 6px 16px var(--shadow-dark), -4px -4px 12px var(--shadow-light);
            border: 1px solid rgba(255,255,255,0.04);
            overflow: hidden;
        }
        .code-panel .titlebar {
            display: flex; gap: 6px;
            padding: 10px 16px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            background: rgba(0,0,0,0.2);
        }
        .code-panel .titlebar span {
            width: 10px; height: 10px;
            border-radius: 50%;
        }
        .code-panel .titlebar span:nth-child(1) { background: #c96a56; }
        .code-panel .titlebar span:nth-child(2) { background: #d1a44e; }
        .code-panel .titlebar span:nth-child(3) { background: #6ea87e; }
        .code-panel pre {
            margin: 0;
            padding: 16px 22px 20px;
            font-family: var(--font-mono);
            font-size: clamp(12.5px, 1.35vw, 14.5px);
            line-height: 1.7;
            color: var(--tok-text);
            overflow-x: auto;
            white-space: pre;
        }
        .tok-keyword { color: var(--tok-keyword); font-weight: 600; }
        .tok-type { color: var(--tok-type); }
        .tok-string { color: var(--tok-string); }
        .tok-number { color: var(--tok-number); }
        .tok-comment { color: var(--tok-comment); font-style: italic; }
        .tok-punct { color: var(--tok-punct); }

        .code-grid { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; }
        .code-grid.two { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }

        .diagram-panel {
            padding: 24px clamp(16px, 3vw, 30px);
            margin-top: 6px;
            background: var(--bg-deep);
            border-radius: var(--radius-md);
            border: 1px solid rgba(255,255,255,0.04);
            box-shadow: inset 4px 4px 14px var(--shadow-dark-strong), inset -3px -3px 10px var(--shadow-light);
        }
        .diagram-panel pre {
            margin: 0;
            font-family: var(--font-mono);
            font-size: clamp(11px, 1.3vw, 14px);
            line-height: 1.7;
            color: var(--text-primary);
            text-align: center;
            overflow-x: auto;
            white-space: pre;
        }

        .term-steps {
            display: grid;
            grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
            gap: 18px;
            margin-top: 6px;
        }
        .term-step {
            padding: 20px 22px;
            min-width: 0;
            border-radius: var(--radius-md);
            background: var(--bg-card);
            border: 1px solid rgba(255,255,255,0.04);
            box-shadow: 6px 6px 16px var(--shadow-dark), -3px -3px 10px var(--shadow-light);
        }
        .term-step .step-badge {
            display: inline-flex;
            align-items: center; justify-content: center;
            width: 28px; height: 28px;
            border-radius: 50%;
            background: var(--accent);
            color: #fff;
            font-family: var(--font-mono);
            font-size: 13px;
            font-weight: 700;
            margin-bottom: 12px;
            box-shadow: 0 2px 8px rgba(74,158,181,0.3);
        }
        .term-step .step-title {
            font-family: var(--font-display);
            font-weight: 700;
            font-size: 16.5px;
            margin-bottom: 8px;
            color: var(--text-primary);
        }
        .term-step .step-title .win {
            color: var(--text-muted);
            font-weight: 400;
            font-size: 13px;
        }
        .term-step .step-path {
            font-family: var(--font-mono);
            font-size: 12px;
            color: var(--text-muted);
            background: var(--bg-deep);
            padding: 8px 10px;
            border-radius: 8px;
            word-break: break-all;
            margin-bottom: 12px;
            box-shadow: inset 2px 2px 6px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.03);
        }
        .term-step .step-note {
            font-size: 13px;
            color: var(--text-muted);
            margin-top: 10px;
            line-height: 1.5;
        }
        .term-step .code-panel { margin-top: 4px; }
        .term-step .code-panel pre { padding: 12px 16px 14px; font-size: 13px; }

        .hero-wrap {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }
        .hero-badge {
            font-family: var(--font-mono);
            font-size: 12.5px;
            letter-spacing: .08em;
            color: var(--text-muted);
            text-transform: uppercase;
            margin-bottom: 16px;
        }
        .hero-title {
            font-family: var(--font-display);
            font-weight: 700;
            font-size: clamp(38px, 6.4vw, 68px);
            line-height: 1.05;
            letter-spacing: -.015em;
            margin: 0 0 18px;
            color: var(--text-primary);
        }
        .hero-title .accent { color: var(--accent); }
        .hero-title .accent2 { color: var(--accent-2); }
        .hero-sub {
            font-size: clamp(15px, 1.7vw, 19px);
            color: var(--text-muted);
            max-width: 600px;
            line-height: 1.6;
            margin-bottom: 32px;
        }

        .stack-diagram {
            display: flex;
            gap: 16px;
            align-items: flex-end;
        }
        .stack-item {
            width: 96px;
            padding: 14px 10px;
            border-radius: 16px;
            background: var(--bg-card);
            box-shadow: 6px 6px 14px var(--shadow-dark), -4px -4px 12px var(--shadow-light);
            border: 1px solid rgba(255,255,255,0.04);
            display: flex;
            flex-direction: column;
            gap: 6px;
            align-items: center;
        }
        .stack-item .rows {
            display: flex;
            flex-direction: column;
            gap: 5px;
            width: 100%;
        }
        .stack-item .rows i {
            height: 6px;
            border-radius: 3px;
            background: var(--accent-soft);
            display: block;
        }
        .stack-item .rows i:nth-child(2) { background: var(--accent-2-soft); }
        .stack-item .rows i:nth-child(3) { background: var(--warn-soft); }
        .stack-item .lbl {
            font-family: var(--font-mono);
            font-size: 10.5px;
            color: var(--text-muted);
        }

        .quiz-list {
            display: flex;
            flex-direction: column;
            gap: 14px;
            margin-top: 6px;
        }
        .quiz-item {
            display: flex;
            gap: 16px;
            align-items: flex-start;
            padding: 18px 22px;
            border-radius: var(--radius-md);
            background: var(--bg-card);
            border: 1px solid rgba(255,255,255,0.04);
            box-shadow: 4px 4px 12px var(--shadow-dark), -2px -2px 8px var(--shadow-light);
        }
        .quiz-item .qnum {
            font-family: var(--font-mono);
            font-weight: 700;
            color: #fff;
            background: var(--accent);
            width: 30px; height: 30px;
            min-width: 30px;
            border-radius: 50%;
            display: flex;
            align-items: center; justify-content: center;
            font-size: 13.5px;
            box-shadow: 0 2px 8px rgba(74,158,181,0.3);
        }
        .quiz-item.answer .qnum {
            background: var(--accent-2);
            box-shadow: 0 2px 8px rgba(232,168,56,0.3);
        }
        .quiz-item .qtext {
            font-size: 15.5px;
            line-height: 1.55;
            padding-top: 3px;
            color: var(--text-primary);
        }
        .quiz-item .qtext .ans {
            font-family: var(--font-mono);
            font-weight: 700;
            color: var(--accent-2);
            display: block;
            margin-bottom: 5px;
            font-size: 16px;
        }
        .quiz-item .qtext .explain {
            color: var(--text-muted);
            font-size: 13.5px;
            line-height: 1.5;
        }
        .quiz-hint {
            margin-top: 20px;
            font-size: 13.5px;
            color: var(--text-muted);
        }

        .chip-row {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 22px;
        }
        .chip {
            font-family: var(--font-mono);
            font-size: 12.5px;
            padding: 8px 16px;
            border-radius: 999px;
            color: var(--accent);
            background: var(--accent-soft);
            border: 1px solid rgba(74,158,181,0.12);
        }
        .chip.gold {
            color: var(--accent-2);
            background: var(--accent-2-soft);
            border-color: rgba(232,168,56,0.12);
        }

        #chrome {
            position: fixed;
            left: 0; right: 0; bottom: 0;
            z-index: 10;
            pointer-events: none;
        }
        #progress-track {
            height: 5px;
            margin: 0 clamp(20px, 6vw, 90px) 0;
            background: var(--bg-deep);
            border-radius: 999px;
            box-shadow: inset 2px 2px 6px var(--shadow-dark-strong), inset -2px -2px 6px var(--shadow-light);
            overflow: hidden;
        }
        #progress-fill {
            height: 100%; width: 0%;
            background: linear-gradient(90deg, var(--accent), var(--accent-2));
            border-radius: 999px;
            transition: width .35s ease;
        }
        #counter {
            position: absolute;
            right: clamp(20px, 6vw, 90px);
            bottom: 18px;
            font-family: var(--font-mono);
            font-size: 12.5px;
            color: var(--text-muted);
            background: var(--bg-card);
            padding: 6px 14px;
            border-radius: 999px;
            box-shadow: 4px 4px 12px var(--shadow-dark), -2px -2px 8px var(--shadow-light);
            border: 1px solid rgba(255,255,255,0.04);
        }
        #nav-hint {
            position: absolute;
            left: clamp(20px, 6vw, 90px);
            bottom: 18px;
            font-family: var(--font-mono);
            font-size: 11.5px;
            color: var(--text-dim);
            opacity: .6;
        }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: var(--bg-deep); }
        ::-webkit-scrollbar-thumb { background: var(--text-dim); border-radius: 8px; }

        @media (max-width: 760px) {
            .twocol, .code-grid.two, .term-steps { grid-template-columns: minmax(0, 1fr); }
            .card-grid { --cols: 2 !important; }
            #nav-hint { display: none; }
        }
        @media (max-width: 480px) {
            .card-grid { --cols: 1 !important; }
            .stack-diagram { transform: scale(.85); transform-origin: left bottom; }
        }
    </style>
</head>
<body>
    <div id="app">
        <div class="stage">
            <div class="slide-panel active" id="panelA"></div>
            <div class="slide-panel" id="panelB"></div>
        </div>
        <div id="chrome">
            <div id="progress-track"><div id="progress-fill"></div></div>
            <div id="counter">1 / 1</div>
            <div id="nav-hint">click or → next · ← back</div>
        </div>
    </div>

    <script>
        /* ---------------------------------------------------------------
           SQL syntax highlighter (same as Module 2)
           ------------------------------------------------------------ */
        function escapeHtml(str) {
            return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        }

        function highlightSQL(raw) {
            var code = escapeHtml(raw);
            var KEYWORDS = ['CREATE', 'DATABASE', 'TABLE', 'ALTER', 'DROP', 'TRUNCATE', 'ADD', 'MODIFY', 'COLUMN',
                'SELECT', 'INSERT', 'INTO', 'VALUES', 'UPDATE', 'SET', 'DELETE', 'FROM', 'WHERE',
                'PRIMARY', 'KEY', 'FOREIGN', 'REFERENCES', 'NOT', 'NULL', 'DEFAULT', 'UNIQUE', 'CHECK',
                'AUTO_INCREMENT', 'USE', 'SHOW', 'DATABASES', 'TABLES', 'EXIT', 'AND', 'OR', 'CONSTRAINT',
                'ON', 'DELETE', 'CASCADE', 'SET', 'NULL', 'RESTRICT', 'NO', 'ACTION', 'INDEX',
                'BETWEEN', 'LIKE'
            ];
            var TYPES = ['INT', 'INTEGER', 'VARCHAR2', 'VARCHAR', 'CHAR', 'DECIMAL', 'NUMBER', 'SMALLINT', 'DATE',
                'TINYINT', 'BIGINT', 'FLOAT', 'DOUBLE', 'TEXT', 'BLOB'
            ];
            var kw = KEYWORDS.join('|');
            var ty = TYPES.join('|');
            var re = new RegExp(
                '(--[^\\n]*)' +
                "|('(?:[^']|'')*')" +
                '|\\b(' + kw + ')\\b' +
                '|\\b(' + ty + ')\\b' +
                '|\\b(\\d+(?:\\.\\d+)?)\\b' +
                '|([(),;.])',
                'gi'
            );
            return code.replace(re, function(match, comment, string, keyword, type, number, punct) {
                if (comment) return '<span class="tok-comment">' + comment + '</span>';
                if (string) return '<span class="tok-string">' + string + '</span>';
                if (keyword) return '<span class="tok-keyword">' + match + '</span>';
                if (type) return '<span class="tok-type">' + match + '</span>';
                if (number) return '<span class="tok-number">' + match + '</span>';
                if (punct) return '<span class="tok-punct">' + match + '</span>';
                return match;
            });
        }

        function renderBlock(b) {

            if (b.t === 'ul') {
                return '<ul class="bullets">' + b.items.map(function(i) { return '<li>' + i + '</li>'; }).join('') + '</ul>';
            }
            if (b.t === 'tip') {
                return '<div class="tip neu-inset"><div class="icon">💡</div><div class="txt">' + b.text + '</div></div>';
            }
            if (b.t === 'warning') {
                return '<div class="warning neu-inset"><div class="icon">⚠️</div><div class="txt">' + b.text + '</div></div>';
            }
            if (b.t === 'table') {
                var thead = '<thead><tr>' + b.headers.map(function(h) { return '<th>' + h + '</th>'; }).join('') + '</tr></thead>';
                var tbody = '<tbody>' + b.rows.map(function(r) {
                    return '<tr>' + r.map(function(c) { return '<td>' + c + '</td>'; }).join('') + '</tr>';
                }).join('') + '</tbody>';
                return '<div class="neu content-card"><table class="data-table">' + thead + tbody + '</table></div>';
            }
            if (b.t === 'cards') {
                var cols = b.cols || 3;
                var cards = b.items.map(function(c) {
                    return '<div class="card"><div class="card-title">' + c.title + '</div><div class="card-desc">' + c.desc + '</div></div>';
                }).join('');
                return '<div class="card-grid" style="--cols:' + cols + ';">' + cards + '</div>';
            }
            if (b.t === 'twocol') {
                var L = b.left, R = b.right;
                var lHtml = '<div class="col ddl"><div class="col-head"><span class="dot"></span>' + L.head + '</div><ul>' +
                    L.items.map(function(i) { return '<li>' + i + '</li>'; }).join('') +
                    '</ul><div class="desc">' + L.desc + '</div></div>';
                var rHtml = '<div class="col dml"><div class="col-head"><span class="dot"></span>' + R.head + '</div><ul>' +
                    R.items.map(function(i) { return '<li>' + i + '</li>'; }).join('') +
                    '</ul><div class="desc">' + R.desc + '</div></div>';
                var note = b.note ? '<div class="note-strip">' + b.note + '</div>' : '';
                return '<div class="twocol">' + lHtml + rHtml + note + '</div>';
            }
            if (b.t === 'code') {
                return '<div class="code-block"><div class="code-label">' + b.label + '</div>' +
                    '<div class="code-panel"><div class="titlebar"><span></span><span></span><span></span></div>' +
                    '<pre>' + highlightSQL(b.code) + '</pre></div></div>';
            }
            if (b.t === 'codegroup') {
                var cls = b.items.length > 1 ? 'code-grid two' : 'code-grid';
                var items = b.items.map(function(it) {
                    return '<div class="code-block" style="margin-top:0;"><div class="code-label">' + it.label + '</div>' +

                        '<pre>' + highlightSQL(it.code) + '</pre></div></div>';

            idlePanel.innerHTML = renderSlide(slides[index]);
            idlePanel.scrollTop = 0;

            if (reduceMotion) {
                idlePanel.className = 'slide-panel';
                void idlePanel.offsetWidth;
                idlePanel.classList.add('active');
                activePanel.classList.remove('active');
                swapPanels(index);
                return;
            }

            var enterCls = direction === 'back' ? 'from-left' : 'from-right';
            var exitCls = direction === 'back' ? 'to-right' : 'to-left';

            idlePanel.classList.remove('active');
            idlePanel.className = 'slide-panel ' + enterCls;
            void idlePanel.offsetWidth;

            requestAnimationFrame(function() {
                idlePanel.classList.add('active');
                idlePanel.classList.remove(enterCls);
                activePanel.classList.add(exitCls);
                activePanel.classList.remove('active');
            });

            setTimeout(function() {
                activePanel.className = 'slide-panel';
                swapPanels(index);
            }, 400);
        }

        function swapPanels(index) {
            current = index;
            var tmp = activePanel;
            activePanel = idlePanel;
            idlePanel = tmp;
            updateChrome();
            animating = false;
        }

        function next() { goTo(current + 1, 'forward'); }
        function prev() { goTo(current - 1, 'back'); }
        function first() { goTo(0, 'back'); }
        function last() { goTo(total - 1, 'forward'); }

        document.addEventListener('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === ' ') { next(); e.preventDefault(); }
            else if (e.key === 'ArrowLeft') { prev(); e.preventDefault(); }
            else if (e.key === 'Home') { first(); e.preventDefault(); }
            else if (e.key === 'End') { last(); e.preventDefault(); }
        });

        document.getElementById('app').addEventListener('click', function() {
            next();
        });

        // init
        panelA.innerHTML = renderSlide(slides[0]);
        updateChrome();
    </script>
</body>
</html>
