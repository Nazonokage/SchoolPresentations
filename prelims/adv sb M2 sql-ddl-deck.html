<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MySQL · Terminal &amp; DDL</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    <style>
        /* ------------------------------------------------------------
           phpMyAdmin–inspired dark theme
           ------------------------------------------------------------ */
        :root {
            --bg: #151828;
            --bg-deep: #0e1120;
            --bg-card: #1e2340;
            --bg-card-hover: #282f52;
            --shadow-light: rgba(255, 255, 255, 0.04);
            --shadow-dark: rgba(0, 0, 0, 0.6);
            --shadow-dark-strong: rgba(0, 0, 0, 0.8);
            --text-primary: #e8e4d4;
            --text-muted: #9499b0;
            --text-dim: #636a82;
            --accent: #4a9eb5;
            --accent-soft: #1e334a;
            --accent-2: #e8a838;
            --accent-2-soft: #2f2a1a;
            --warn: #d97a5a;
            --warn-soft: #3a2824;
            --panel-dark: #0d1020;
            --panel-dark-2: #161a30;
            --tok-keyword: #6fc2d0;
            --tok-type: #c8a8e0;
            --tok-string: #e8c86a;
            --tok-number: #e8916a;
            --tok-comment: #6a728a;
            --tok-punct: #8890a8;
            --tok-text: #e8e2d4;
            --radius-lg: 24px;
            --radius-md: 16px;
            --radius-sm: 10px;
            --font-display: 'Space Grotesk', sans-serif;
            --font-body: 'Inter', sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
        }

        * {
            box-sizing: border-box;
        }
        html,
        body {
            margin: 0;
            padding: 0;
            height: 100%;
            background: var(--bg);
            color: var(--text-primary);
            font-family: var(--font-body);
            -webkit-font-smoothing: antialiased;
        }
        body {
            overflow: hidden;
        }
        #app {
            position: fixed;
            inset: 0;
        }
        .stage {
            position: absolute;
            inset: 0;
        }
        .slide-panel {
            position: absolute;
            inset: 0;
            overflow-y: auto;
            overflow-x: hidden;
            opacity: 0;
            pointer-events: none;
            transform: translateX(0) scale(1);
            transition: opacity .38s ease, transform .38s ease;
            z-index: 1;
            -webkit-overflow-scrolling: touch;
        }
        .slide-panel.active {
            opacity: 1;
            transform: translateX(0) scale(1);
            pointer-events: auto;
            z-index: 2;
        }
        .slide-panel.from-right {
            transform: translateX(48px) scale(.98);
        }
        .slide-panel.from-left {
            transform: translateX(-48px) scale(.98);
        }
        .slide-panel.to-left {
            transform: translateX(-48px) scale(.98);
            opacity: 0;
        }
        .slide-panel.to-right {
            transform: translateX(48px) scale(.98);
            opacity: 0;
        }
        @media (prefers-reduced-motion: reduce) {
            .slide-panel {
                transition: opacity .15s linear !important;
                transform: none !important;
            }
            .slide-panel.from-right,
            .slide-panel.from-left,
            .slide-panel.to-left,
            .slide-panel.to-right {
                transform: none !important;
            }
        }

        .slide {
            min-height: 100%;
            display: flex;
            padding: clamp(28px, 5vw, 72px) clamp(24px, 8vw, 120px);
        }
        .slide-inner {
            margin: auto;
            width: 100%;
            max-width: 1000px;
            padding: 8px 0 40px;
        }

        /* ---- badges & headings ---- */
        .eyebrow {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-family: var(--font-mono);
            font-size: 12px;
            font-weight: 600;
            letter-spacing: .06em;
            color: var(--accent);
            background: var(--accent-soft);
            padding: 5px 14px 5px 12px;
            border-radius: 999px;
            box-shadow: inset 0 1px 0 rgba(74, 158, 181, 0.25), 0 4px 12px rgba(0, 0, 0, 0.3);
            margin-bottom: 18px;
            border: 1px solid rgba(74, 158, 181, 0.15);
        }
        .eyebrow::before {
            content: "◆";
            font-size: 10px;
            opacity: .7;
        }
        h1.title {
            font-family: var(--font-display);
            font-weight: 700;
            font-size: clamp(28px, 4.4vw, 46px);
            line-height: 1.12;
            margin: 0 0 12px;
            letter-spacing: -.01em;
            color: var(--text-primary);
        }
        p.subtitle {
            font-size: clamp(15px, 1.6vw, 18px);
            color: var(--text-muted);
            max-width: 640px;
            line-height: 1.55;
            margin: 0 0 28px;
        }

        /* ---- neumorphic surfaces (dark) ---- */
        .neu {
            background: var(--bg-card);
            border-radius: var(--radius-lg);
            box-shadow: 8px 8px 20px var(--shadow-dark), -4px -4px 12px var(--shadow-light);
            border: 1px solid rgba(255, 255, 255, 0.04);
        }
        .neu-sm {
            border-radius: var(--radius-md);
            box-shadow: 6px 6px 14px var(--shadow-dark), -3px -3px 10px var(--shadow-light);
            border: 1px solid rgba(255, 255, 255, 0.03);
        }
        .neu-inset {
            background: var(--bg-deep);
            border-radius: var(--radius-md);
            box-shadow: inset 4px 4px 12px var(--shadow-dark-strong), inset -3px -3px 10px var(--shadow-light);
            border: 1px solid rgba(255, 255, 255, 0.03);
        }

        .content-card {
            padding: clamp(20px, 3vw, 32px);
            margin-top: 8px;
        }

        /* ---- lists ---- */
        ul.bullets {
            list-style: none;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        ul.bullets li {
            position: relative;
            padding-left: 28px;
            font-size: clamp(15px, 1.5vw, 17px);
            line-height: 1.55;
            color: var(--text-primary);
        }
        ul.bullets li::before {
            content: "";
            position: absolute;
            left: 0;
            top: 7px;
            width: 9px;
            height: 9px;
            border-radius: 3px;
            background: var(--accent);
            box-shadow: 0 2px 6px rgba(74, 158, 181, 0.4);
        }
        ul.bullets li b,
        ul.bullets li strong {
            color: #fff;
            font-weight: 700;
        }
        ul.bullets li code {
            font-family: var(--font-mono);
            background: var(--accent-soft);
            color: var(--accent);
            padding: 1px 6px;
            border-radius: 6px;
            font-size: .92em;
        }

        /* ---- tips & warnings ---- */
        .tip {
            display: flex;
            gap: 14px;
            align-items: flex-start;
            margin-top: 22px;
            padding: 16px 20px;
            border-radius: var(--radius-md);
            background: var(--accent-2-soft);
            box-shadow: inset 2px 2px 8px rgba(0, 0, 0, 0.5), inset -2px -2px 8px rgba(232, 168, 56, 0.06);
            border: 1px solid rgba(232, 168, 56, 0.12);
        }
        .tip .icon {
            font-size: 20px;
            line-height: 1.4;
        }
        .tip .txt {
            font-size: 14.5px;
            color: #e8d8a8;
            line-height: 1.55;
        }
        .tip .txt b {
            color: #f0d870;
        }

        .warning {
            display: flex;
            gap: 14px;
            align-items: flex-start;
            margin-top: 22px;
            padding: 16px 20px;
            border-radius: var(--radius-md);
            background: var(--warn-soft);
            box-shadow: inset 2px 2px 8px rgba(0, 0, 0, 0.5), inset -2px -2px 8px rgba(217, 122, 90, 0.05);
            border: 1px solid rgba(217, 122, 90, 0.15);
        }
        .warning .icon {
            font-size: 20px;
        }
        .warning .txt {
            font-size: 14.5px;
            color: #e8b8a8;
            line-height: 1.55;
        }
        .warning .txt b {
            color: #f0b8a0;
        }

        /* ---- tables ---- */
        table.data-table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            font-size: 14.5px;
        }
        table.data-table th {
            font-family: var(--font-mono);
            text-transform: uppercase;
            letter-spacing: .04em;
            font-size: 11.5px;
            color: var(--text-muted);
            text-align: left;
            padding: 10px 16px;
            border-bottom: 2px solid rgba(255, 255, 255, 0.06);
        }
        table.data-table td {
            padding: 13px 16px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            vertical-align: top;
            color: var(--text-primary);
            line-height: 1.5;
        }
        table.data-table tr:last-child td {
            border-bottom: none;
        }
        table.data-table td.mono,
        table.data-table th.mono {
            font-family: var(--font-mono);
        }
        table.data-table code.cell-code {
            font-family: var(--font-mono);
            background: var(--accent-soft);
            color: var(--accent);
            padding: 2px 8px;
            border-radius: 6px;
            font-size: 13px;
        }

        /* ---- card grids ---- */
        .card-grid {
            display: grid;
            grid-template-columns: repeat(var(--cols, 3), minmax(0, 1fr));
            gap: 16px;
            margin-top: 6px;
        }
        .card {
            min-width: 0;
            padding: 18px 20px;
            border-radius: var(--radius-md);
            background: var(--bg-card);
            border: 1px solid rgba(255, 255, 255, 0.04);
            box-shadow: 4px 4px 12px var(--shadow-dark), -2px -2px 8px var(--shadow-light);
        }
        .card .card-title {
            font-family: var(--font-mono);
            font-weight: 600;
            font-size: 14.5px;
            color: var(--accent);
            margin-bottom: 8px;
            word-break: break-word;
        }
        .card .card-desc {
            font-size: 13.8px;
            color: var(--text-muted);
            line-height: 1.5;
        }

        /* ---- two column ---- */
        .twocol {
            display: grid;
            grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
            gap: 20px;
            margin-top: 6px;
        }
        .col {
            min-width: 0;
            padding: 22px 24px;
            border-radius: var(--radius-md);
            background: var(--bg-card);
            border: 1px solid rgba(255, 255, 255, 0.04);
            box-shadow: 6px 6px 16px var(--shadow-dark), -3px -3px 10px var(--shadow-light);
        }
        .col-head {
            font-family: var(--font-display);
            font-weight: 700;
            font-size: 19px;
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 14px;
            color: var(--text-primary);
        }
        .col-head .dot {
            width: 11px;
            height: 11px;
            border-radius: 50%;
        }
        .col.dml .dot {
            background: var(--accent-2);
        }
        .col.ddl .dot {
            background: var(--accent);
        }
        .col ul {
            list-style: none;
            margin: 0 0 12px;
            padding: 0;
            display: flex;
            flex-direction: column;
            gap: 9px;
        }
        .col li {
            font-family: var(--font-mono);
            font-size: 14.5px;
            color: var(--text-primary);
        }
        .col .desc {
            font-size: 13.5px;
            color: var(--text-muted);
            line-height: 1.5;
        }
        .note-strip {
            margin-top: 18px;
            font-size: 13px;
            color: var(--text-muted);
            padding: 12px 18px;
            border-radius: 14px;
            grid-column: 1 / -1;
            background: var(--bg-deep);
            border: 1px solid rgba(255, 255, 255, 0.04);
            box-shadow: inset 2px 2px 8px rgba(0, 0, 0, 0.4);
        }

        /* ---- code panels ---- */
        .code-block {
            margin-top: 18px;
        }
        .code-label {
            font-family: var(--font-mono);
            font-size: 11.5px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: .06em;
            margin-bottom: 8px;
            padding-left: 4px;
        }
        .code-panel {
            background: var(--panel-dark);
            border-radius: var(--radius-md);
            box-shadow: 6px 6px 16px var(--shadow-dark), -4px -4px 12px var(--shadow-light);
            border: 1px solid rgba(255, 255, 255, 0.04);
            overflow: hidden;
        }
        .code-panel .titlebar {
            display: flex;
            gap: 6px;
            padding: 10px 16px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            background: rgba(0, 0, 0, 0.2);
        }
        .code-panel .titlebar span {
            width: 10px;
            height: 10px;
            border-radius: 50%;
        }
        .code-panel .titlebar span:nth-child(1) {
            background: #c96a56;
        }
        .code-panel .titlebar span:nth-child(2) {
            background: #d1a44e;
        }
        .code-panel .titlebar span:nth-child(3) {
            background: #6ea87e;
        }
        .code-panel pre {
            margin: 0;
            padding: 16px 22px 20px;
            font-family: var(--font-mono);
            font-size: clamp(12.5px, 1.35vw, 14.5px);
            line-height: 1.7;
            color: var(--tok-text);
            overflow-x: auto;
            white-space: pre;
        }
        .tok-keyword {
            color: var(--tok-keyword);
            font-weight: 600;
        }
        .tok-type {
            color: var(--tok-type);
        }
        .tok-string {
            color: var(--tok-string);
        }
        .tok-number {
            color: var(--tok-number);
        }
        .tok-comment {
            color: var(--tok-comment);
            font-style: italic;
        }
        .tok-punct {
            color: var(--tok-punct);
        }

        .code-grid {
            display: grid;
            grid-template-columns: minmax(0, 1fr);
            gap: 16px;
        }
        .code-grid.two {
            grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
        }

        /* ---- diagram ---- */
        .diagram-panel {
            padding: 24px clamp(16px, 3vw, 30px);
            margin-top: 6px;
            background: var(--bg-deep);
            border-radius: var(--radius-md);
            border: 1px solid rgba(255, 255, 255, 0.04);
            box-shadow: inset 4px 4px 14px var(--shadow-dark-strong), inset -3px -3px 10px var(--shadow-light);
        }
        .diagram-panel pre {
            margin: 0;
            font-family: var(--font-mono);
            font-size: clamp(11px, 1.3vw, 14px);
            line-height: 1.7;
            color: var(--text-primary);
            text-align: center;
            overflow-x: auto;
            white-space: pre;
        }
        .diagram-panel .arrow {
            color: var(--accent);
        }
        .diagram-panel .highlight {
            color: var(--accent-2);
        }

        /* ---- terminal steps ---- */
        .term-steps {
            display: grid;
            grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
            gap: 18px;
            margin-top: 6px;
        }
        .term-step {
            padding: 20px 22px;
            min-width: 0;
            border-radius: var(--radius-md);
            background: var(--bg-card);
            border: 1px solid rgba(255, 255, 255, 0.04);
            box-shadow: 6px 6px 16px var(--shadow-dark), -3px -3px 10px var(--shadow-light);
        }
        .term-step .step-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: var(--accent);
            color: #fff;
            font-family: var(--font-mono);
            font-size: 13px;
            font-weight: 700;
            margin-bottom: 12px;
            box-shadow: 0 2px 8px rgba(74, 158, 181, 0.3);
        }
        .term-step .step-title {
            font-family: var(--font-display);
            font-weight: 700;
            font-size: 16.5px;
            margin-bottom: 8px;
            color: var(--text-primary);
        }
        .term-step .step-title .win {
            color: var(--text-muted);
            font-weight: 400;
            font-size: 13px;
        }
        .term-step .step-path {
            font-family: var(--font-mono);
            font-size: 12px;
            color: var(--text-muted);
            background: var(--bg-deep);
            padding: 8px 10px;
            border-radius: 8px;
            word-break: break-all;
            margin-bottom: 12px;
            box-shadow: inset 2px 2px 6px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.03);
        }
        .term-step .step-note {
            font-size: 13px;
            color: var(--text-muted);
            margin-top: 10px;
            line-height: 1.5;
        }
        .term-step .code-panel {
            margin-top: 4px;
        }
        .term-step .code-panel pre {
            padding: 12px 16px 14px;
            font-size: 13px;
        }

        /* ---- hero / title slide ---- */
        .hero-wrap {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }
        .hero-badge {
            font-family: var(--font-mono);
            font-size: 12.5px;
            letter-spacing: .08em;
            color: var(--text-muted);
            text-transform: uppercase;
            margin-bottom: 16px;
        }
        .hero-title {
            font-family: var(--font-display);
            font-weight: 700;
            font-size: clamp(38px, 6.4vw, 68px);
            line-height: 1.05;
            letter-spacing: -.015em;
            margin: 0 0 18px;
            color: var(--text-primary);
        }
        .hero-title .accent {
            color: var(--accent);
        }
        .hero-title .accent2 {
            color: var(--accent-2);
        }
        .hero-sub {
            font-size: clamp(15px, 1.7vw, 19px);
            color: var(--text-muted);
            max-width: 600px;
            line-height: 1.6;
            margin-bottom: 32px;
        }
        .stack-diagram {
            display: flex;
            gap: 16px;
            align-items: flex-end;
        }
        .stack-item {
            width: 96px;
            padding: 14px 10px;
            border-radius: 16px;
            background: var(--bg-card);
            box-shadow: 6px 6px 14px var(--shadow-dark), -4px -4px 12px var(--shadow-light);
            border: 1px solid rgba(255, 255, 255, 0.04);
            display: flex;
            flex-direction: column;
            gap: 6px;
            align-items: center;
        }
        .stack-item .rows {
            display: flex;
            flex-direction: column;
            gap: 5px;
            width: 100%;
        }
        .stack-item .rows i {
            height: 6px;
            border-radius: 3px;
            background: var(--accent-soft);
            display: block;
        }
        .stack-item .rows i:nth-child(2) {
            background: var(--accent-2-soft);
        }
        .stack-item .rows i:nth-child(3) {
            background: var(--warn-soft);
        }
        .stack-item .lbl {
            font-family: var(--font-mono);
            font-size: 10.5px;
            color: var(--text-muted);
        }

        /* ---- quiz ---- */
        .quiz-list {
            display: flex;
            flex-direction: column;
            gap: 14px;
            margin-top: 6px;
        }
        .quiz-item {
            display: flex;
            gap: 16px;
            align-items: flex-start;
            padding: 18px 22px;
            border-radius: var(--radius-md);
            background: var(--bg-card);
            border: 1px solid rgba(255, 255, 255, 0.04);
            box-shadow: 4px 4px 12px var(--shadow-dark), -2px -2px 8px var(--shadow-light);
        }
        .quiz-item .qnum {
            font-family: var(--font-mono);
            font-weight: 700;
            color: #fff;
            background: var(--accent);
            width: 30px;
            height: 30px;
            min-width: 30px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13.5px;
            box-shadow: 0 2px 8px rgba(74, 158, 181, 0.3);
        }
        .quiz-item.answer .qnum {
            background: var(--accent-2);
            box-shadow: 0 2px 8px rgba(232, 168, 56, 0.3);
        }
        .quiz-item .qtext {
            font-size: 15.5px;
            line-height: 1.55;
            padding-top: 3px;
            color: var(--text-primary);
        }
        .quiz-item .qtext .ans {
            font-family: var(--font-mono);
            font-weight: 700;
            color: var(--accent-2);
            display: block;
            margin-bottom: 5px;
            font-size: 16px;
        }
        .quiz-item .qtext .explain {
            color: var(--text-muted);
            font-size: 13.5px;
            line-height: 1.5;
        }
        .quiz-hint {
            margin-top: 20px;
            font-size: 13.5px;
            color: var(--text-muted);
        }

        /* ---- closing ---- */
        .chip-row {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 22px;
        }
        .chip {
            font-family: var(--font-mono);
            font-size: 12.5px;
            padding: 8px 16px;
            border-radius: 999px;
            color: var(--accent);
            background: var(--accent-soft);
            border: 1px solid rgba(74, 158, 181, 0.12);
        }
        .chip.gold {
            color: var(--accent-2);
            background: var(--accent-2-soft);
            border-color: rgba(232, 168, 56, 0.12);
        }

        /* ---- progress + counter ---- */
        #chrome {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 10;
            pointer-events: none;
        }
        #progress-track {
            height: 5px;
            margin: 0 clamp(20px, 6vw, 90px) 0;
            background: var(--bg-deep);
            border-radius: 999px;
            box-shadow: inset 2px 2px 6px var(--shadow-dark-strong), inset -2px -2px 6px var(--shadow-light);
            overflow: hidden;
        }
        #progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--accent), var(--accent-2));
            border-radius: 999px;
            transition: width .35s ease;
        }
        #counter {
            position: absolute;
            right: clamp(20px, 6vw, 90px);
            bottom: 18px;

<body>
    <div id="app">
        <div class="stage">
            <div class="slide-panel active" id="panelA"></div>
            <div class="slide-panel" id="panelB"></div>
        </div>
        <div id="chrome">
            <div id="progress-track"><div id="progress-fill"></div></div>
            <div id="counter">1 / 1</div>
            <div id="nav-hint">click or → next · ← back</div>
        </div>
    </div>

    <script>
        /* ---------------------------------------------------------------
           SQL syntax highlighter
           ------------------------------------------------------------ */
        function escapeHtml(str) {
            return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        }

        function highlightSQL(raw) {
            var code = escapeHtml(raw);
            var KEYWORDS = ['CREATE', 'DATABASE', 'TABLE', 'ALTER', 'DROP', 'TRUNCATE', 'ADD', 'MODIFY', 'COLUMN',
                'SELECT', 'INSERT', 'INTO', 'VALUES', 'UPDATE', 'SET', 'DELETE', 'FROM', 'WHERE',
                'PRIMARY', 'KEY', 'FOREIGN', 'REFERENCES', 'NOT', 'NULL', 'DEFAULT', 'UNIQUE', 'CHECK',
                'AUTO_INCREMENT', 'USE', 'SHOW', 'DATABASES', 'TABLES', 'EXIT', 'AND', 'OR', 'CONSTRAINT',
                'ON', 'DELETE', 'CASCADE', 'SET', 'NULL', 'RESTRICT', 'NO', 'ACTION', 'INDEX'
            ];
            var TYPES = ['INT', 'INTEGER', 'VARCHAR2', 'VARCHAR', 'CHAR', 'DECIMAL', 'NUMBER', 'SMALLINT', 'DATE',
                'TINYINT', 'BIGINT', 'FLOAT', 'DOUBLE', 'TEXT', 'BLOB'
            ];
            var kw = KEYWORDS.join('|');
            var ty = TYPES.join('|');
            var re = new RegExp(
                '(--[^\\n]*)' +
                "|('(?:[^']|'')*')" +
                '|\\b(' + kw + ')\\b' +
                '|\\b(' + ty + ')\\b' +
                '|\\b(\\d+(?:\\.\\d+)?)\\b' +
                '|([(),;.])',
                'gi'
            );
            return code.replace(re, function(match, comment, string, keyword, type, number, punct) {
                if (comment) return '<span class="tok-comment">' + comment + '</span>';
                if (string) return '<span class="tok-string">' + string + '</span>';
                if (keyword) return '<span class="tok-keyword">' + match + '</span>';
                if (type) return '<span class="tok-type">' + match + '</span>';
                if (number) return '<span class="tok-number">' + match + '</span>';
                if (punct) return '<span class="tok-punct">' + match + '</span>';
                return match;
            });
        }

        /* ---------------------------------------------------------------
           Slide content
           ------------------------------------------------------------ */
        var slides = [];

        // ---- 0: HERO ----
        slides.push({
            type: 'hero',
            badge: 'MODULE 2 · MYSQL &amp; DDL',
            title: 'MySQL <span class="accent">Terminal</span> &amp; <span class="accent2">DDL</span>',
            sub: 'Master the MySQL command line — start the server, connect, create databases, and build related tables with primary &amp; foreign keys.',
            stack: [{ rows: 3, lbl: 'CUSTOMERS' }, { rows: 2, lbl: 'ORDERS' }, { rows: 4, lbl: 'PRODUCTS' }]
        });

        // ---- 1: What is MySQL ----
        slides.push({
            type: 'content',
            eyebrow: 'MYSQL · INTRO',
            title: 'What is MySQL?',
            blocks: [{
                t: 'ul',
                items: [
                    'An <b>Oracle-backed, open-source RDBMS</b> built on SQL.',
                    'Runs on nearly every platform: <code>Linux</code>, <code>UNIX</code>, <code>Windows</code>.',
                    'The engine behind a huge share of web applications and online publishing.',
                    'You interact with it via the <b>MySQL terminal</b> — a powerful command-line interface.'
                ]
            }, {
                t: 'tip',
                text: 'If SQL is the language, MySQL is one specific "engine" that speaks it. The terminal is your direct line to that engine.'
            }]
        });

        // ---- 2: MySQL Terminal - Start Server ----
        slides.push({
            type: 'terminal',
            eyebrow: 'MYSQL · TERMINAL',
            title: 'Starting the MySQL Server',
            intro: 'To work with MySQL from the command line, you need two terminal windows: one for the server, one for your queries.',
            steps: [{
                n: '1',
                title: 'Start the Server',
                win: 'Window 1',
                path: 'C:\\wamp64\\\WamppDB\\bin\\mysql\\mysql8.4.7\\bin\\',
                code: '.\\mysqld.exe --console',
                note: 'Keep this window open the whole time you\'re working — closing it shuts the server down.'
            }, {
                n: '2',
                title: 'Connect to the Database',
                win: 'Window 2',
                path: '(same folder as above)',
                code: '.\\mysql.exe -u root -p',
                note: 'This opens a second window where you\'ll type your SQL commands. Enter your password when prompted.'
            }]
        });

        // ---- 3: Common Terminal Commands ----
        slides.push({
            type: 'content',
            eyebrow: 'MYSQL · TERMINAL',
            title: 'Common MySQL Terminal Commands',
            blocks: [{
                t: 'p',
                text: 'A handful of commands you\'ll reach for constantly once you\'re connected:'
            }, {
                t: 'table',
                headers: ['What it does', 'Command'],
                rows: [
                    ['Show all databases', '<code class="cell-code">SHOW DATABASES;</code>'],
                    ['Use a database', '<code class="cell-code">USE your_database_name;</code>'],
                    ['Show tables', '<code class="cell-code">SHOW TABLES;</code>'],
                    ['Describe a table', '<code class="cell-code">DESCRIBE table_name;</code>'],
                    ['Exit MySQL', '<code class="cell-code">EXIT;</code>']
                ]
            }, {
                t: 'tip',
                text: 'Getting "stuck" in the console? <b>EXIT;</b> always gets you back out safely. And don\'t forget the semicolon — MySQL won\'t run a command without it!'
            }]
        });

        // ---- 4: Creating a Database ----
        slides.push({
            type: 'content',
            eyebrow: 'DDL · CREATE DATABASE',
            title: 'Creating a Database from the Terminal',
            blocks: [{
                t: 'p',
                text: 'The very first step: give your data somewhere to live. The name must be unique within your MySQL instance.'
            }, {
                t: 'codegroup',
                items: [
                    { label: 'Syntax', code: 'CREATE DATABASE DatabaseName;' },
                    { label: 'Example', code: 'CREATE DATABASE dbStore;' },
                    { label: 'Switch to it', code: 'USE dbStore;' }
                ]
            }, {
                t: 'tip',
                text: 'After creating a database, always run <b>USE dbName;</b> so your next commands apply to the right place.'
            }]
        });

        // ---- 5: Two Tables with PK & FK ----
        slides.push({
            type: 'content',
            eyebrow: 'DDL · RELATIONSHIPS',
            title: 'Two Tables with Primary &amp; Foreign Keys',
            blocks: [{
                t: 'p',
                text: 'A real-world database rarely has just one table. Here\'s how to create <b>two related tables</b> — <code>CUSTOMERS</code> and <code>ORDERS</code> — where each order belongs to a customer.'
            }, {
                t: 'twocol',
                left: {
                    cls: 'ddl',
                    head: 'CUSTOMERS (parent)',
                    items: ['<b>CustomerID</b> PK', 'FirstName', 'LastName', 'Email'],
                    desc: 'The <b>primary key</b> uniquely identifies each customer. Orders will reference this.'
                },
                right: {
                    cls: 'dml',
                    head: 'ORDERS (child)',
                    items: ['<b>OrderID</b> PK', 'OrderDate', 'Amount', '<b>CustomerID</b> FK'],
                    desc: 'The <b>foreign key</b> points back to the customer who placed the order.'
                },
                note: 'The foreign key <b>CustomerID</b> in ORDERS references the primary key <b>CustomerID</b> in CUSTOMERS — this links every order to a valid customer.'
            }]
        });

        // ---- 6: SQL for both tables ----
        slides.push({
            type: 'content',
            eyebrow: 'DDL · CREATE TABLES',
            title: 'SQL: Creating CUSTOMERS &amp; ORDERS',
            blocks: [{
                t: 'p',
                text: 'Run these commands in your MySQL terminal (after <code>USE dbStore;</code>) to build the two related tables.'
            }, {
                t: 'codegroup',
                items: [{
                    label: 'CUSTOMERS table',
                    code: 'CREATE TABLE CUSTOMERS(\n' +
                        '    CustomerID INT AUTO_INCREMENT,\n' +
                        '    FirstName VARCHAR(50) NOT NULL,\n' +
                        '    LastName VARCHAR(50) NOT NULL,\n' +
                        '    Email VARCHAR(100) UNIQUE,\n' +
                        '    PRIMARY KEY (CustomerID)\n' +
                        ');'
                }, {
                    label: 'ORDERS table (with FK)',
                    code: 'CREATE TABLE ORDERS(\n' +
                        '    OrderID INT AUTO_INCREMENT,\n' +
                        '    OrderDate DATE NOT NULL,\n' +
                        '    Amount DECIMAL(10,2) NOT NULL,\n' +
                        '    CustomerID INT,\n' +
                        '    PRIMARY KEY (OrderID),\n' +
                        '    FOREIGN KEY (CustomerID) REFERENCES CUSTOMERS(CustomerID)\n' +
                        ');'
                }]
            }, {
                t: 'tip',
                text: 'The <b>FOREIGN KEY</b> line tells MySQL: "Every CustomerID in ORDERS must exist in CUSTOMERS." This protects your data from orphaned orders.'
            }]
        });

        // ---- 7: Visual Relationship Diagram ----
        slides.push({
            type: 'content',
            eyebrow: 'DDL · RELATIONSHIP',
            title: 'How the Tables Connect',
            blocks: [{
                t: 'diagram',
                text:
                    '┌─────────────────────┐          ┌─────────────────────────┐\n' +
                    '│     CUSTOMERS       │          │        ORDERS           │\n' +
                    '├─────────────────────┤          ├─────────────────────────┤\n' +
                    '│ ▶ CustomerID (PK)   │◄─────────│ CustomerID (FK)        │\n' +
                    '│   FirstName         │          │ ▶ OrderID (PK)          │\n' +
                    '│   LastName          │          │   OrderDate             │\n' +
                    '│   Email             │          │   Amount                │\n' +
                    '└─────────────────────┘          └─────────────────────────┘\n' +
                    '         ▲                                        │\n' +
                    '         │   One customer can have               │\n' +
                    '         └─── many orders (1-to-many) ───────────┘'
            }, {
                t: 'tip',
                text: 'This is a <b>one-to-many</b> relationship: one customer can place many orders, but each order belongs to exactly one customer.'
            }]
        });

        // ---- 8: Inserting Data & Querying ----
        slides.push({
            type: 'content',
            eyebrow: 'DML · DATA &amp; QUERIES',
            title: 'Inserting Data &amp; Joining Tables',
            blocks: [{
                t: 'p',
                text: 'Once your tables exist, you can add data and then <b>join</b> them to see customer orders together.'
            }, {
                t: 'codegroup',
                items: [{
                    label: 'Insert a customer',
                    code: 'INSERT INTO CUSTOMERS (FirstName, LastName, Email)\n' +
                        'VALUES (\'Juan\', \'Dela Cruz\', \'juan@email.com\');'
                }, {
                    label: 'Insert an order for that customer',
                    code: 'INSERT INTO ORDERS (OrderDate, Amount, CustomerID)\n' +
                        'VALUES (\'2026-07-13\', 149.99, 1);'
                }, {
                    label: 'Query: customers + their orders',
                    code: 'SELECT C.FirstName, C.LastName, O.OrderDate, O.Amount\n' +
                        'FROM CUSTOMERS C\n' +
                        'JOIN ORDERS O ON C.CustomerID = O.CustomerID;'
                }]
            }, {
                t: 'tip',
                text: 'The <b>JOIN</b> uses the foreign key to pull matching rows from both tables — that\'s the power of relational databases!'
            }]
        });

        // ---- 9: ALTER & DROP ----
        slides.push({
            type: 'content',
            eyebrow: 'DDL · ALTER &amp; DROP',
            title: 'Changing and Removing Tables',
            blocks: [{
                t: 'p',
                text: 'Sometimes you need to tweak a table after it\'s created — or remove it entirely.'
            }, {
                t: 'codegroup',
                items: [{
                    label: 'Add a column',
                    code: 'ALTER TABLE CUSTOMERS ADD Phone VARCHAR(20);'
                }, {
                    label: 'Modify a column type',
                    code: 'ALTER TABLE CUSTOMERS MODIFY Phone VARCHAR(30);'
                }, {
                    label: 'Drop a column',
                    code: 'ALTER TABLE CUSTOMERS DROP COLUMN Phone;'
                }, {
                    label: 'Drop the ORDERS table (careful!)',
                    code: 'DROP TABLE ORDERS;'
                }]
            }, {
                t: 'warning',
                text: '<b>DROP TABLE</b> removes the table and all its data permanently. There\'s no undo. Always double-check before running it — especially on tables with foreign key relationships.'
            }]
        });

        // ---- 10: Constraints Recap ----
        slides.push({
            type: 'content',
            eyebrow: 'DATA RULES · CONSTRAINTS',
            title: 'The Six Main Constraints',
            blocks: [{
                t: 'cards',
                cols: 3,
                items: [
                    { title: 'NOT NULL', desc: 'The column can never be left empty.' },
                    { title: 'DEFAULT', desc: 'Gives a fallback value when none is provided.' },
                    { title: 'UNIQUE', desc: 'No two rows may share the same value.' },
                    { title: 'PRIMARY KEY', desc: 'Uniquely identifies each row in the table.' },
                    { title: 'FOREIGN KEY', desc: 'References a primary key in another table.' },
                    { title: 'CHECK', desc: 'Values must satisfy a specific condition.' }
                ]
            }, {
                t: 'tip',
                text: 'Constraints are like bouncers at a door — they decide what data is allowed in, and turn away anything that breaks the rules.'
            }]
        });

        // ---- 11: Quiz Questions ----
        slides.push({
            type: 'content',
            eyebrow: 'QUIZ · QUESTIONS',
            title: 'Check Your Understanding',
            blocks: [{
                t: 'p',
                text: 'Four quick questions — try answering each one before you flip to the next slide, where all the answers are waiting.'
            }, {
                t: 'qlist',
                mode: 'q',
                items: [
                    'What command do you use in the MySQL terminal to switch to a specific database?',
                    'What keyword creates a link between two tables by referencing another table\'s primary key?',
                    'In a one-to-many relationship, which table typically holds the foreign key?',
                    'What\'s the difference between <b>DROP TABLE</b> and <b>TRUNCATE TABLE</b>?'
                ]
            }]
        });

        // ---- 12: Quiz Answers ----
        slides.push({
            type: 'content',
            eyebrow: 'QUIZ · ANSWERS',
            title: 'How Did You Do?',
            blocks: [{
                t: 'qlist',
                mode: 'a',
                items: [
                    { ans: 'USE database_name;',
                    explain: 'Example: USE dbStore; — everything you do next applies to this database.' },
                    { ans: 'FOREIGN KEY', explain: 'FOREIGN KEY (column) REFERENCES other_table(column) — that\'s the link.' },
                    { ans: 'The "many" side (child table)', explain: 'In CUSTOMERS ↔ ORDERS, ORDERS holds the foreign key because many orders belong to one customer.' },
                    { ans: 'DROP removes the entire table structure; TRUNCATE keeps the structure but removes all rows.',
                        explain: 'TRUNCATE is like "empty the filing cabinet but keep the cabinet." DROP is "throw away the cabinet and everything in it."' }
                ]
            }, {
                t: 'tip',
                text: 'If you can explain foreign keys and the difference between DROP and TRUNCATE, you\'re well on your way to mastering MySQL DDL.'
            }]
        });

        // ---- 13: Closing ----
        slides.push({
            type: 'closing',
            title: 'Nice work — Module 2 complete!',
            sub: 'You now know how to fire up the MySQL server, connect via the terminal, create databases, and build related tables with primary and foreign keys. You\'ve also seen ALTER, DROP, and TRUNCATE in action.',
            chips: ['CREATE TABLE', 'PRIMARY KEY', 'FOREIGN KEY', 'ALTER', 'DROP', 'TRUNCATE', 'USE', 'SHOW']
        });

        /* ---------------------------------------------------------------
           Rendering
           ------------------------------------------------------------ */
        function renderBlock(b) {
            if (b.t === 'p') {
                return '<p style="font-size:15.5px;color:var(--text-muted);line-height:1.6;margin:0 0 6px;">' + b.text +
                '</p>';
            }
            if (b.t === 'ul') {
                return '<ul class="bullets">' + b.items.map(function(i) { return '<li>' + i + '</li>'; }).join('') +
                '</ul>';
            }
            if (b.t === 'tip') {
                return '<div class="tip neu-inset"><div class="icon">💡</div><div class="txt">' + b.text + '</div></div>';
            }
            if (b.t === 'warning') {
                return '<div class="warning neu-inset"><div class="icon">⚠️</div><div class="txt">' + b.text +
                '</div></div>';
            }
            if (b.t === 'table') {
                var thead = '<thead><tr>' + b.headers.map(function(h) { return '<th>' + h + '</th>'; }).join('') +
                    '</tr></thead>';
                var tbody = '<tbody>' + b.rows.map(function(r) {
                    return '<tr>' + r.map(function(c) { return '<td>' + c + '</td>'; }).join('') + '</tr>';
                }).join('') + '</tbody>';
                return '<div class="neu content-card"><table class="data-table">' + thead + tbody + '</table></div>';
            }
            if (b.t === 'cards') {
                var cols = b.cols || 3;
                var cards = b.items.map(function(c) {
                    return '<div class="card"><div class="card-title">' + c.title +
                        '</div><div class="card-desc">' + c.desc + '</div></div>';
                }).join('');
                return '<div class="card-grid" style="--cols:' + cols + ';">' + cards + '</div>';
            }
            if (b.t === 'twocol') {
                var L = b.left,
                    R = b.right;
                var lHtml = '<div class="col ddl"><div class="col-head"><span class="dot"></span>' + L.head +
                    '</div><ul>' +
                    L.items.map(function(i) { return '<li>' + i + '</li>'; }).join('') +
                    '</ul><div class="desc">' + L.desc + '</div></div>';
                var rHtml = '<div class="col dml"><div class="col-head"><span class="dot"></span>' + R.head +
                    '</div><ul>' +
                    R.items.map(function(i) { return '<li>' + i + '</li>'; }).join('') +
                    '</ul><div class="desc">' + R.desc + '</div></div>';
                var note = b.note ? '<div class="note-strip">' + b.note + '</div>' : '';
                return '<div class="twocol">' + lHtml + rHtml + note + '</div>';
            }
            if (b.t === 'code') {
                return '<div class="code-block"><div class="code-label">' + b.label + '</div>' +
                    '<div class="code-panel"><div class="titlebar"><span></span><span></span><span></span></div>' +
                    '<pre>' + highlightSQL(b.code) + '</pre></div></div>';
            }
            if (b.t === 'codegroup') {
                var cls = b.items.length > 1 ? 'code-grid two' : 'code-grid';
                var items = b.items.map(function(it) {
                    return '<div class="code-block" style="margin-top:0;"><div class="code-label">' + it.label +
                        '</div>' +
                        '<div class="code-panel"><div class="titlebar"><span></span><span></span><span></span></div>' +
                        '<pre>' + highlightSQL(it.code) + '</pre></div></div>';
                }).join('');
                return '<div class="' + cls + '" style="margin-top:18px;">' + items + '</div>';
            }
            if (b.t === 'diagram') {
                return '<div class="diagram-panel"><pre>' + escapeHtml(b.text) + '</pre></div>';
            }
            if (b.t === 'qlist') {
                if (b.mode === 'q') {
                    var qitems = b.items.map(function(q, i) {
                        return '<div class="quiz-item"><div class="qnum">' + (i + 1) +
                            '</div><div class="qtext">' + q + '</div></div>';
                    }).join('');
                    return '<div class="quiz-list">' + qitems + '</div>';
                } else {
                    var aitems = b.items.map(function(a, i) {
                        return '<div class="quiz-item answer"><div class="qnum">' + (i + 1) +
                            '</div>' +
                            '<div class="qtext"><span class="ans">' + a.ans +
                            '</span><span class="explain">' + a.explain +
                            '</span></div></div>';
                    }).join('');
                    return '<div class="quiz-list">' + aitems + '</div>';
                }
            }
            return '';
        }

        function renderSlide(slide) {
            if (slide.type === 'hero') {
                var stackHtml = slide.stack.map(function(s) {
                    var rows = '';
                    for (var i = 0; i < s.rows; i++) { rows += '<i></i>'; }
                    return '<div class="stack-item neu"><div class="rows">' + rows +
                        '</div><div class="lbl">' + s.lbl + '</div></div>';
                }).join('');
                return '<div class="slide"><div class="slide-inner hero-wrap">' +
                    '<div class="hero-badge">' + slide.badge + '</div>' +
                    '<h1 class="hero-title">' + slide.title + '</h1>' +
                    '<p class="hero-sub">' + slide.sub + '</p>' +
                    '<div class="stack-diagram">' + stackHtml + '</div>' +
                    '</div></div>';
            }
            if (slide.type === 'content') {
                var blocksHtml = slide.blocks.map(renderBlock).join('');
                return '<div class="slide"><div class="slide-inner">' +
                    '<div class="eyebrow">' + slide.eyebrow + '</div>' +
                    '<h1 class="title">' + slide.title + '</h1>' +
                    blocksHtml +
                    '</div></div>';
            }
            if (slide.type === 'terminal') {
                var stepsHtml = slide.steps.map(function(s) {
                    return '<div class="term-step"><div class="step-badge">' + s.n + '</div>' +
                        '<div class="step-title">' + s.title + ' <span class="win">(' + s.win +
                        ')</span></div>' +
                        '<div class="step-path">' + escapeHtml(s.path) + '</div>' +
                        '<div class="code-panel"><div class="titlebar"><span></span><span></span><span></span></div>' +
                        '<pre>' + highlightSQL(s.code) + '</pre></div>' +
                        '<div class="step-note">' + s.note + '</div>' +
                        '</div>';
                }).join('');
                return '<div class="slide"><div class="slide-inner">' +
                    '<div class="eyebrow">' + slide.eyebrow + '</div>' +
                    '<h1 class="title">' + slide.title + '</h1>' +
                    '<p style="font-size:15.5px;color:var(--text-muted);line-height:1.6;margin:0 0 6px;">' + slide
                    .intro + '</p>' +
                    '<div class="term-steps">' + stepsHtml + '</div>' +
                    '</div></div>';
            }
            if (slide.type === 'closing') {
                var chips = slide.chips.map(function(c) {
                    var gold = ['PRIMARY KEY', 'FOREIGN KEY', 'ALTER', 'CREATE TABLE'].includes(c) ? ' gold' : '';
                    return '<span class="chip' + gold + '">' + c + '</span>';
                }).join('');
                return '<div class="slide"><div class="slide-inner hero-wrap">' +
                    '<div class="hero-badge">MODULE 2 · COMPLETE</div>' +
                    '<h1 class="hero-title" style="font-size:clamp(30px,5vw,52px);">' + slide.title + '</h1>' +
                    '<p class="hero-sub">' + slide.sub + '</p>' +
                    '<div class="chip-row">' + chips + '</div>' +
                    '</div></div>';
            }
            return '';
        }

        /* ---------------------------------------------------------------
           Navigation engine
           ------------------------------------------------------------ */
        var current = 0;
        var total = slides.length;
        var panelA = document.getElementById('panelA');
        var panelB = document.getElementById('panelB');
        var activePanel = panelA;
        var idlePanel = panelB;
        var animating = false;
        var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

        function updateChrome() {
            document.getElementById('counter').textContent = (current + 1) + ' / ' + total;
            document.getElementById('progress-fill').style.width = (((current + 1) / total) * 100) + '%';
        }

        function goTo(index, direction) {
            if (animating) return;
            if (index < 0 || index >= total) return;
            animating = true;

            idlePanel.innerHTML = renderSlide(slides[index]);
            idlePanel.scrollTop = 0;

            if (reduceMotion) {
                idlePanel.className = 'slide-panel';
                void idlePanel.offsetWidth;
                idlePanel.classList.add('active');
                activePanel.classList.remove('active');
                swapPanels(index);
                return;
            }

            var enterCls = direction === 'back' ? 'from-left' : 'from-right';
            var exitCls = direction === 'back' ? 'to-right' : 'to-left';

            idlePanel.classList.remove('active');
            idlePanel.className = 'slide-panel ' + enterCls;
            void idlePanel.offsetWidth;

            requestAnimationFrame(function() {
                idlePanel.classList.add('active');
                idlePanel.classList.remove(enterCls);
                activePanel.classList.add(exitCls);
                activePanel.classList.remove('active');
            });

            setTimeout(function() {
                activePanel.className = 'slide-panel';
                swapPanels(index);
            }, 400);
        }

        function swapPanels(index) {
            current = index;
            var tmp = activePanel;
            activePanel = idlePanel;
            idlePanel = tmp;
            updateChrome();
            animating = false;
        }

        function next() { goTo(current + 1, 'forward'); }

        function prev() { goTo(current - 1, 'back'); }

        function first() { goTo(0, 'back'); }

        function last() { goTo(total - 1, 'forward'); }

        document.addEventListener('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === ' ') { next();
                e.preventDefault(); } else if (e.key === 'ArrowLeft') { prev();
                e.preventDefault(); } else if (e.key === 'Home') { first();
                e.preventDefault(); } else if (e.key === 'End') { last();
                e.preventDefault(); }
        });

        document.getElementById('app').addEventListener('click', function() {
            next();
        });

        /* init */
        panelA.innerHTML = renderSlide(slides[0]);
        updateChrome();
    </script>
</body>
</html>
